settings_graphics-render-scale_tooltip: "ウィンドウに合わせて拡大縮小する前に、ゲームが何ピクセルでレンダリングするかです。インターフェースはどちらにしても等倍で描画されます。このデバイスクラスに最初から設定されているスケールに掛け合わされます。デスクトップのみ"
settings_graphics-resolution_tooltip: "ゲームウィンドウのピクセル単位のサイズで、このディスプレイが報告するモードから選びます。幅より高さが大きい解像度にすると、インターフェース全体が縦向きレイアウトになります。デスクトップのみ"
settings_graphics-textures-compression-quality_tooltip: "このデバイスが画像の圧縮にかける時間です。結果のサイズとフォーマットはどちらでも同じで、読み込み時間と、グラデーションやくっきりしたエッジに出るブロックノイズとの引き換えになるだけです。自動では写真以外のすべてに丁寧なエンコーダーを使います。スマートフォンでは無視されます。スマートフォンのエンコーダーにはこの設定がありません"
settings_graphics-textures-compression_tooltip: "レベルの画像を読み込み時に圧縮フォーマットへ変換します。画像1枚あたりのメモリが4分の1から8分の1になる代わりに、グラデーションやくっきりしたエッジにブロックノイズが出ます。自動ではメモリの少ないスマートフォンで圧縮し、デスクトップでは画像をそのまま保持します。レベルの読み込み時に読まれるので、次に開くレベルから適用されます"
settings_graphics-textures-filtering_tooltip: "レベルの画像を描画するときのサンプリング方法です。自動では、ミップマップがオンのときにミップレベル間をブレンドし、切り替わりの境目をなくします。ポイントではすべてのテクセルがくっきりします。画像の縮小方法は変わらず、描画方法だけが変わります。作者がドット絵に指定した画像は常にポイントサンプリングされます"
settings_graphics-textures-mipmaps_tooltip: "各画像の縮小コピーを作成し、小さく描画された画像が動いてもちらつかないようにします。メモリが3分の1多く必要になります。作者がドット絵に指定した画像には作成されません"
settings_graphics-textures-size-limit_tooltip: "このデバイスで画像がメモリ上で取れる最大の辺の長さです。それより大きい画像は読み込み時に縮小され、ディスク上のファイルは変更されません。メモリは辺の2乗に比例して減るので、1段階下げるほうが圧縮よりも節約になります。自動はスマートフォンで2048、デスクトップで4096です"
