settings_graphics-vsync_tooltip: "디스플레이 새로 고침을 기다렸다가 프레임을 표시하므로 화면 찢김이 사라지지만 지연이 한 프레임 늘어납니다. 켜져 있는 동안에는 위의 프레임 레이트 제한이 적용되지 않습니다. 데스크톱 전용"
settings_graphics-window-mode_tooltip: "창이 디스플레이를 차지하는 방식입니다. 창 모드에서는 크기를 자유롭게 바꿀 수 있으며, 그에 따라 인터페이스가 맞춰지는 화면 비율도 바뀝니다. 데스크톱 전용"
