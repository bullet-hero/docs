settings_interface-alert-on-exception_tooltip: "Включено - непойманная ошибка открывает окно отчёта поверх всего, что на экране. Выключено - она только пишется в лог, а сам отчёт собирается в любом случае"
settings_interface-menu-background_tooltip: "Что главное меню рисует за кнопками. Bot - живая арена, в которую играет reflex-бот, Shapes - поле вращающихся фигур, None не рисует ничего"
settings_interface-open-menu-on-lose_tooltip: "Выключено - проигранный забег сам отматывается к последней достигнутой контрольной точке. Включено - воспроизведение останавливается и открывается окно результата"
settings_interface-screen-orientation_tooltip: "Как держать устройство. Горизонтально и Вертикально закрепляют ось, а не сторону, поэтому перевёрнутое устройство продолжает играть. На ПК здесь показана форма окна"
settings_interface-show-game-interface_tooltip: "Общий выключатель над двумя настройками выше и над экранными контролами вместе с ними"
settings_interface-show-game-pause_tooltip: "Значок паузы в углу игрового экрана. Скрытый, он всё равно принимает нажатие там же"
settings_interface-show-game-progress_tooltip: "Полоса внизу игрового экрана, с засечкой на каждой контрольной точке, к которой может вернуться забег"
settings_interface-stats-active_tooltip: "Рисует диагностику поверх любого экрана: тайминги кадра, использование буферов, размер уровня и память процесса. Никогда не перехватывает клики - они проходят сквозь неё"
settings_interface-stats-alignment-x_tooltip: "0 - левый край экрана, 1 - правый"
settings_interface-stats-alignment-y_tooltip: "0 - нижний край экрана, 1 - верхний: та же система координат, в которой авторится контент уровня"
settings_interface-stats-alignment_x: "Выравнивание X"
settings_interface-stats-alignment_y: "Выравнивание Y"
settings_interface-stats-frame-objects_tooltip: "Добавляет блок буферов кадра: сколько экземпляров, фигур, эффектов, текстов и аудиодорожек кадр использовал, запросил и на сколько хватило места"
settings_interface-stats-level-objects_tooltip: "Добавляет размер загруженного уровня: объекты по типам, ключи, аудиодорожки и ресурсы. Считается раз в секунду и не считается вовсе, пока выключено"
settings_interface-stats-memory_tooltip: "Добавляет блок памяти процесса: управляемая куча и сколько Unity выделила из зарезервированного. Это итоги всего процесса, а не уровня"
settings_interface-stats-profiling_tooltip: "Добавляет блок профилирования: сколько заняла каждая стадия симуляции и сколько элементов держит UI-панель. Есть только в редакторе и в development-сборках - в релизной сборке маркеров нет вовсе"
