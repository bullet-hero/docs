level_resources_texture-uv_tooltip: "这张图片如何映射到绘制它的物体上，只在资源上设置一次，而不是在每个物体上设置。平铺是它在形状上重复的次数，偏移是第一份副本开始的位置。没有自己UV关键帧的物体会直接使用这个设置，而物体上的任何UV关键帧都会完全替换它"
