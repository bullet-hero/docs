hint_editor-settings_artist-permission_body: |-
  Jede externe Ressource in einem Level - Musik, Bilder, Schriftarten, Texte - braucht eine Lizenz, die mindestens so frei ist wie <color=#D4B483>CC BY-NC</color>, oder die Erlaubnis des Rechteinhabers zur öffentlichen nichtkommerziellen Weitergabe

  <color=#E86A5A><b>Vorsicht:</b></color> ein privates "klar, mach ruhig" reicht nicht. Die Erlaubnis muss die öffentliche Weitergabe abdecken, nicht nur deine persönliche Nutzung

  Solange ein Level auf deinem Gerät bleibt, wird nichts geprüft - erst wenn es einem Dienst angeboten wird

  Mehr: <link="https://bullethero.space/de/docs/editor/rights/legal-resource-paths"><color=#59A6FF>Zwei Wege zu einer legalen Ressource</color></link>, <link="https://bullethero.space/de/docs/editor/rights/asking-permission"><color=#59A6FF>Einen Autor um Erlaubnis bitten</color></link>
hint_editor-settings_artist-permission_header: "Fremde Werke verwenden"
hint_editor-settings_community: "Die eigenen Links des Projekts - sie öffnen sich in deinem Browser. Welche aufgeführt sind, hängt davon ab, woher dieser Build stammt, ein Store-Build zeigt also eventuell weniger als dieser"
hint_editor-settings_create-level_body: |-
  Ein <b>Preset</b> legt fest, womit das neue Level beginnt - leer oder mit einem kleinen Grundgerüst, das du sonst jedes Mal von Hand bauen würdest

  <color=#E86A5A><b>Vorsicht:</b></color> <b>Parameter</b> legen fest, was sich später nur mühsam ändern lässt: Framelänge und Framerate

  <color=#5EC8C8><b>Tipp:</b></color> die beiden Dateiformat-Listen bestimmen, wie das Level und seine Metadaten auf die Festplatte geschrieben werden. Beide lassen sich später in der "Gefahrenzone" des Levels ändern

  Mehr: <link="https://bullethero.space/de/docs/editor/basics/first-level"><color=#59A6FF>Dein erstes Level: der Weg</color></link>
hint_editor-settings_create-level_header: "Level erstellen"
hint_editor-settings_library_body: |-
  Alles auf diesem Gerät, was du in ein Level übernehmen kannst: deine eigene Bibliothek, deine Sammlungen und die Sammlungen, die du im Workshop abonniert hast. Die schmale Spalte wählt die Art, die Chips über der Liste wählen die Quelle

  Eine <b>Sammlung</b> ist ein Ordner mit Ressourcen beliebiger Art, mit Namen, Autoren und Lizenz. Erstelle hier eine, fülle sie mit <b>Kopieren</b> auf den Seiten der Arten, exportiere sie als Archiv oder veröffentliche sie

  <color=#5EC8C8><b>Tipp:</b></color> eine Workshop-Sammlung ist schreibgeschützt. Kopiere ihre Einträge in eine eigene Sammlung, um sie zu ändern

  Mehr: <link="https://bullethero.space/de/docs/editor/reference/library-and-collections"><color=#59A6FF>Bibliothek und Sammlungen</color></link>
hint_editor-settings_library_header: "Bibliothek"
hint_editor-settings_open-level: "Auf diesem Gerät gefundene Levels. Ein Level ist ein Ordner - leg einen neben die anderen, und er erscheint hier"
hint_editor_beat-segment_body: |-
  Ein Abschnitt mit konstantem Tempo: BPM, Phasenversatz in Frame-Bruchteilen, Beats pro Takt, ein Name und eine Farbe. Es wird nur ein Segment angezeigt, auch wenn mehrere ausgewählt sind

  <color=#E86A5A><b>Vorsicht:</b></color> ein Segment wird über seinen Startframe erkannt, also <b>ändert Verschieben seine Identität</b>. Wähle es nach dem Verschieben an seinem neuen Start erneut aus

  <color=#5EC8C8><b>Tipp:</b></color> Taps hier verschieben die Phase des ausgewählten Segments, statt ein neues zu erstellen

  Mehr: <link="https://bullethero.space/de/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>Rhythmus und Struktur</color></link>
hint_editor_beat-segment_header: "Beat-Segment"
hint_editor_beat-window_body: |-
  Metadaten fürs Erstellen - <b>beim Abspielen liest sie nichts</b>. Sie helfen dir, Inhalte auf die Musik zu setzen, und Generatoren arbeiten mit denselben Beats, die du siehst

  Das Raster ist eine Liste von <b>Beat-Segmenten</b>, jedes ein Abschnitt mit konstantem Tempo. Lücken dazwischen sind in Ordnung: ein Intro ohne Schlagzeug, ein Break, das Ende nach dem Song

  <color=#5EC8C8><b>Tipp:</b></color> drücke <b>TAP</b> im Takt der Audiospur, dann macht <b>Aus Taps erstellen</b> aus den Taps ein Segment vom ersten bis zum letzten

  Mehr: <link="https://bullethero.space/de/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>Rhythmus und Struktur</color></link>
hint_editor_beat-window_header: "Beat-Raster"
hint_editor_clipboard_body: |-
  Ein Puffer pro Zeitleiste, jeder mit eigener Statuszeile

  <b>Als Text kopieren</b> schreibt alle Puffer als Text in die Systemzwischenablage, damit eine Auswahl in ein anderes Level oder auf einen anderen Rechner wandern kann. <b>Aus Text einfügen</b> liest sie zurück in die Puffer - und <b>hört dort auf</b>

  <color=#B48CE0><b>Gut zu wissen:</b></color> im Level kommt nichts an, bis du selbst in die gewählte Zeitleiste einfügst. Wo es landet, hängt vom Abspielkopf und vom aktiven Bereich ab

  Mehr: <link="https://bullethero.space/de/docs/editor/workflow/reuse"><color=#59A6FF>Wiederverwendung: Prefabs, Kopieren, Generatoren</color></link>
hint_editor_clipboard_header: "Zwischenablage"
hint_editor_console: "Alles, was der Editor in dieser Sitzung protokolliert hat - Ladeberichte des Levels, Ergebnisse von Generatoren, Importwarnungen. <b>Leeren</b> löscht alles. Das Zahnrad filtert, welche Schweregrade angezeigt werden"
hint_editor_curve-editor: "Bearbeitet eine Kurve durch Ziehen ihrer Punkte. Änderungen greifen <b>live</b> beim Ziehen, was du siehst, steht also schon im Level - das Schließen des Fensters behält sie"
hint_editor_generators_body: |-
  Prozedurale Inhalte, auf das Level angewendet als ein einziger rückgängig machbarer Vorgang

  <color=#B48CE0><b>Gut zu wissen:</b></color> es gibt zwei Familien. <b>Generatoren</b> (<i>gen_</i>) erzeugen Inhalte - Geschosswellen, radiale Muster und den Schriftart-Cache. <b>Modifikatoren</b> (<i>mod_</i>) schreiben Vorhandenes um - Spannen anpassen, Keyframes quantisieren

  <color=#E86A5A><b>Vorsicht:</b></color> alles, was vorhandene Inhalte umschreibt oder löscht, fragt zuerst nach einer Bestätigung

  Mehr: <link="https://bullethero.space/de/docs/editor/workflow/reuse"><color=#59A6FF>Wiederverwendung: Prefabs, Kopieren, Generatoren</color></link>
hint_editor_generators_header: "Generatoren"
hint_editor_gradient-editor: "Bearbeitet einen Verlauf durch Ziehen seiner Farbmarken. Wie im Kurveneditor greifen Änderungen <b>live</b> statt erst beim Bestätigen"
hint_editor_hierarchy_body: |-
  Jedes Objekt, das im <b>aktuellen Frame</b> lebt, nach Elternobjekt verschachtelt. Die Liste ändert sich beim Ziehen des Abspielkopfs - eine leere Hierarchie heißt meist, dass der Abspielkopf hinter dem Ende deiner Inhalte steht

  Ziehe eine Zeile auf eine andere, um das Objekt zu deren Kind zu machen. Ebenen addieren sich entlang der Kette, also verschiebt ein neues Elternobjekt das Objekt auch in der Zeichenreihenfolge und würfelt seine Zufallswerte neu

  <color=#5EC8C8><b>Tipp:</b></color> Rechtsklick auf eine Zeile zeigt ihre Aktionen. Auf Touchscreens halte die Zeile gedrückt

  Mehr: <link="https://bullethero.space/de/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Wie der Editor funktioniert</color></link>
hint_editor_hierarchy_header: "Hierarchie"
hint_editor_inspector-audio_body: |-
  Clip, Geschwindigkeit, Fader-Lautstärke und Kette der Audioeffekte der ausgewählten Audiospur - Tiefpass, Hochpass, Echo, Hall, Chorus, Tonhöhe, Verzerrung, Flanger, Kompressor, Normalisieren und parametrischer EQ

  Geschwindigkeit und Lautstärke sind Schieberegler statt einfacher Zahlenfelder, damit ihr erlaubter Bereich sichtbar ist

  <color=#E86A5A><b>Vorsicht:</b></color> <b>die Lautstärke hier ist der Fader.</b> Lautstärke per Keyframes ist eine eigene Spur auf der lokalen Zeitleiste, und beim Abspielen werden beide multipliziert

  Mehr: <link="https://bullethero.space/de/docs/editor/resources/preparing-the-track"><color=#59A6FF>Den Song vorbereiten</color></link>
hint_editor_inspector-audio_chorus-delay: "Grundverzögerung der Kopien in ms - kurz genug, um als Fülle statt als Echo gehört zu werden"
hint_editor_inspector-audio_chorus-depth: "Wie weit die Verzögerung schwankt - Rate bestimmt das Tempo des Schwankens, dieser Wert seine Weite"
hint_editor_inspector-audio_chorus-dry-mix: "Pegel des unbearbeiteten Signals"
hint_editor_inspector-audio_chorus-feedback: "Wie viel vom Ausgang in den Effekt zurückgeführt wird - vertieft ihn in Richtung Flanger"
hint_editor_inspector-audio_chorus-rate: "Wie schnell die Verzögerung moduliert wird, in Hz"
hint_editor_inspector-audio_chorus-wet-mix-tap-1: "Pegel der ersten verzögerten Kopie"
hint_editor_inspector-audio_chorus-wet-mix-tap-2: "Pegel der zweiten Kopie - die Kopien liegen zeitlich auseinander, ihr Verhältnis bestimmt also, wie breit der Chorus wirkt"
hint_editor_inspector-audio_chorus-wet-mix-tap-3: "Pegel der dritten Kopie"
hint_editor_inspector-audio_chorus_body: |-
  Legt drei leicht verzögerte Kopien mit schwankender Tonhöhe über das Signal, sodass eine einzelne Spur wie mehrere Quellen klingt. <color=#D4B483>Rate</color> ist das Tempo des Schwankens, <color=#D4B483>Depth</color> seine Weite. Drehst du <color=#D4B483>Feedback</color> hoch, wird daraus <link="hint_editor_inspector-audio_flange"><color=#59A6FF>Flanger</color></link>

  <color=#B48CE0><b>Gut zu wissen:</b></color> <b>Zurücksetzen</b> stellt auch <b>Mix Level</b> auf den Standardwert -80 dB und schaltet den Effekt damit aus

  Mehr: <link="https://bullethero.space/de/docs/editor/resources/preparing-the-track"><color=#59A6FF>Den Song vorbereiten</color></link>
hint_editor_inspector-audio_chorus_header: "Chorus"
hint_editor_inspector-audio_compressor-attack: "Wie schnell er nach einer Spitze zupackt, in ms - zu schnell tötet die Transienten"
hint_editor_inspector-audio_compressor-make-up-gain: "Verstärkung in dB, die nach der Kompression wieder hinzukommt, um den entfernten Pegel zurückzuholen"
hint_editor_inspector-audio_compressor-release: "Wie schnell er danach wieder loslässt, in ms - zu schnell pumpt hörbar"
hint_editor_inspector-audio_compressor-threshold: "Pegel in dB, ab dem die Kompression einsetzt"
hint_editor_inspector-audio_compressor_body: |-
  Drückt die lauten Stellen herunter, damit die leisen höher sitzen können - die übliche Lösung für eine Spur, die hinter ihren eigenen Effekten verschwindet. <color=#D4B483>Threshold</color> ist der Einsatzpunkt, <color=#D4B483>Attack</color> und <color=#D4B483>Release</color> wie schnell er zupackt und loslässt, <color=#D4B483>Make Up Gain</color> gibt den Pegel zurück

  <color=#B48CE0><b>Gut zu wissen:</b></color> <b>Zurücksetzen</b> stellt auch <b>Mix Level</b> auf den Standardwert -80 dB und schaltet den Effekt damit aus

  Mehr: <link="https://bullethero.space/de/docs/editor/resources/preparing-the-track"><color=#59A6FF>Den Song vorbereiten</color></link>
hint_editor_inspector-audio_compressor_header: "Kompressor"
hint_editor_inspector-audio_distortion-level: "Wie stark das Signal begrenzt wird"
hint_editor_inspector-audio_distortion_body: |-
  Begrenzt die Wellenform und füllt den Klang mit Obertönen - rau und übersteuert. Ein Regler, <color=#D4B483>Level</color>, dafür, wie hart er zubeißt. Außerdem glättet er die Dynamik, sodass die Spur ihre leisen Momente verliert

  <color=#B48CE0><b>Gut zu wissen:</b></color> <b>Zurücksetzen</b> stellt auch <b>Mix Level</b> auf den Standardwert -80 dB und schaltet den Effekt damit aus

  Mehr: <link="https://bullethero.space/de/docs/editor/resources/preparing-the-track"><color=#59A6FF>Den Song vorbereiten</color></link>
hint_editor_inspector-audio_distortion_header: "Verzerrung"
hint_editor_inspector-audio_echo-decay: "Wie viel von jeder Wiederholung in die nächste fließt - höhere Werte klingen länger nach"
hint_editor_inspector-audio_echo-delay: "Millisekunden zwischen den Wiederholungen - kopple sie an das Tempo des Songs, damit die Echos auf dem Beat bleiben"
hint_editor_inspector-audio_echo-dry-mix: "Pegel des unbearbeiteten Signals im Ausgang"
hint_editor_inspector-audio_echo-max-channels: "Kanalobergrenze für den Echopuffer"
hint_editor_inspector-audio_echo-wet-mix: "Pegel des Echosignals - wird gegen Dry Mix abgewogen, getrennt von Mix Level"
hint_editor_inspector-audio_echo_body: |-
  Wiederholt das Signal der Spur in festem Abstand, jede Wiederholung leiser als die vorige - einzelne Kopien, nicht der Raum von <link="hint_editor_inspector-audio_reverb"><color=#59A6FF>Hall</color></link>. <color=#D4B483>Delay</color> ist der Abstand in Millisekunden, <color=#D4B483>Decay</color> wie viel von jeder Kopie in die nächste fließt

  <color=#B48CE0><b>Gut zu wissen:</b></color> <b>Zurücksetzen</b> stellt auch <b>Mix Level</b> auf den Standardwert -80 dB und schaltet den Effekt damit aus

  Mehr: <link="https://bullethero.space/de/docs/editor/resources/preparing-the-track"><color=#59A6FF>Den Song vorbereiten</color></link>
hint_editor_inspector-audio_echo_header: "Echo"
hint_editor_inspector-audio_enabled: "Ob dieser Effekt in der Kette ist. Ein eigenes Flag gibt es nicht - das Häkchen hebt Mix Level vom Boden bei -80 dB an, das Entfernen setzt es zurück und behält den eingestellten Pegel"
hint_editor_inspector-audio_flange-depth: "Wie weit die Verzögerung schwankt"
hint_editor_inspector-audio_flange-dry-mix: "Pegel des unbearbeiteten Signals"
hint_editor_inspector-audio_flange-rate: "Wie schnell sich der Durchlauf wiederholt, in Hz"
hint_editor_inspector-audio_flange-wet-mix: "Pegel der schwankenden Kopie - die Auslöschung zwischen beiden ist der Effekt"
hint_editor_inspector-audio_flange_body: |-
  Mischt dem Signal der Spur eine sehr kurze, schwankende Verzögerung seiner selbst bei - das Rauschen eines Düsentriebwerks. Wie <link="hint_editor_inspector-audio_chorus"><color=#59A6FF>Chorus</color></link>, aber mit nur einer Kopie, also hörst du einen Durchlauf statt Breite. Das Rauschen ist am tiefsten, wenn <color=#D4B483>Dry Mix</color> und <color=#D4B483>Wet Mix</color> nah beieinander liegen

  <color=#B48CE0><b>Gut zu wissen:</b></color> <b>Zurücksetzen</b> stellt auch <b>Mix Level</b> auf den Standardwert -80 dB und schaltet den Effekt damit aus

  Mehr: <link="https://bullethero.space/de/docs/editor/resources/preparing-the-track"><color=#59A6FF>Den Song vorbereiten</color></link>
hint_editor_inspector-audio_flange_header: "Flanger"
hint_editor_inspector-audio_header: "Inspector der Audiospur"
hint_editor_inspector-audio_highpass-cutoff-freq: "Frequenz in Hz, unterhalb der die Spur gedämpft wird - am Minimum ist der Filter praktisch transparent"
hint_editor_inspector-audio_highpass_body: |-
  Das Spiegelbild von <link="hint_editor_inspector-audio_lowpass"><color=#59A6FF>Tiefpass</color></link>: lässt die Höhen durch und schneidet alles unter <color=#D4B483>Cutoff Freq</color> ab. Hebst du die Grenzfrequenz an, wird die Spur dünn wie aus einem winzigen Lautsprecher

  <color=#5EC8C8><b>Tipp:</b></color> die Kette gehört zur <b>Spur</b> und wird nicht mit Keyframes animiert. Für einen Wechsel mitten im Song schneide die Spur und stelle die beiden Hälften unterschiedlich ein

  <color=#B48CE0><b>Gut zu wissen:</b></color> <b>Zurücksetzen</b> stellt auch <b>Mix Level</b> auf den Standardwert -80 dB und schaltet den Effekt damit aus

  Mehr: <link="https://bullethero.space/de/docs/editor/resources/preparing-the-track"><color=#59A6FF>Den Song vorbereiten</color></link>
hint_editor_inspector-audio_highpass_header: "Hochpass"
hint_editor_inspector-audio_lowpass-cutoff-freq: "Frequenz in Hz, oberhalb der die Spur gedämpft wird - am Maximum ist der Filter praktisch transparent"
hint_editor_inspector-audio_lowpass_body: |-
  Lässt die Tiefen durch und schneidet alles über <color=#D4B483>Cutoff Freq</color> ab - der Klang wie unter Wasser oder hinter einer Wand. Am oberen Ende des Bereichs ist der Filter praktisch transparent

  <color=#5EC8C8><b>Tipp:</b></color> die Kette gehört zur <b>Spur</b> und wird nicht mit Keyframes animiert. Für einen Wechsel mitten im Song schneide die Spur und stelle die beiden Hälften unterschiedlich ein

  <color=#B48CE0><b>Gut zu wissen:</b></color> <b>Zurücksetzen</b> stellt auch <b>Mix Level</b> auf den Standardwert -80 dB und schaltet den Effekt damit aus

  Mehr: <link="https://bullethero.space/de/docs/editor/resources/preparing-the-track"><color=#59A6FF>Den Song vorbereiten</color></link>
hint_editor_inspector-audio_lowpass_header: "Tiefpass"
hint_editor_inspector-audio_mix-level: "Pegel in dB, mit dem das bearbeitete Signal zurückgemischt wird. Bei -80 ist der Effekt stumm, und genau so wird \"aus\" gespeichert - einen eigenen Schalter gibt es in der Datei nicht"
hint_editor_inspector-audio_normalize-fade-in-time: "Millisekunden, bis sich die Verstärkung einpendelt, damit die Korrektur nicht als Sprung hörbar ist"
hint_editor_inspector-audio_normalize-lowest-volume: "Signale, die leiser sind, bleiben unberührt - so werden Stille und Grundrauschen nicht zu Zischen verstärkt"
hint_editor_inspector-audio_normalize-maximum-amp: "Obergrenze für die anwendbare Verstärkung"
hint_editor_inspector-audio_normalize_body: |-
  Bringt das Signal in Richtung einer Ziellautheit, sodass Clips aus verschiedenen Quellen auf vergleichbarem Pegel liegen. Er wirkt auf den Gesamtpegel, die Dynamik innerhalb einer Spur ist Sache von <link="hint_editor_inspector-audio_compressor"><color=#59A6FF>Kompressor</color></link>. <color=#D4B483>Lowest Volume</color> verhindert, dass Stille zu Zischen wird, <color=#D4B483>Maximum Amp</color> begrenzt die Anhebung

  <color=#B48CE0><b>Gut zu wissen:</b></color> <b>Zurücksetzen</b> stellt auch <b>Mix Level</b> auf den Standardwert -80 dB und schaltet den Effekt damit aus

  Mehr: <link="https://bullethero.space/de/docs/editor/resources/preparing-the-track"><color=#59A6FF>Den Song vorbereiten</color></link>
hint_editor_inspector-audio_normalize_header: "Normalisieren"
hint_editor_inspector-audio_param-eq-center-freq: "Frequenz in Hz, um die das Band zentriert ist"
hint_editor_inspector-audio_param-eq-frequency-gain: "Verstärkung innerhalb des Bands - unter 1 senkt ab, über 1 hebt an"
hint_editor_inspector-audio_param-eq-octave-range: "Breite des Bands in Oktaven - schmal für gezielte Korrekturen, breit für die Klangformung"
hint_editor_inspector-audio_param-eq_body: |-
  Ein parametrisches Band, das einen gewählten Bereich im Spektrum der Spur anhebt oder absenkt. Anders als <link="hint_editor_inspector-audio_lowpass"><color=#59A6FF>Tiefpass</color></link> und <link="hint_editor_inspector-audio_highpass"><color=#59A6FF>Hochpass</color></link> kann es auch Pegel hinzufügen. <color=#D4B483>Center Freq</color> ist die Lage des Bands, <color=#D4B483>Octave Range</color> seine Breite, <color=#D4B483>Frequency Gain</color> unter 1 senkt ab und über 1 hebt an

  <color=#B48CE0><b>Gut zu wissen:</b></color> <b>Zurücksetzen</b> stellt auch <b>Mix Level</b> auf den Standardwert -80 dB und schaltet den Effekt damit aus

  Mehr: <link="https://bullethero.space/de/docs/editor/resources/preparing-the-track"><color=#59A6FF>Den Song vorbereiten</color></link>
hint_editor_inspector-audio_param-eq_header: "Param. EQ"
hint_editor_inspector-audio_pitch-shifter-fft-size: "Größe des Analysefensters - der Regler des Algorithmus zwischen Qualität und Latenz"
hint_editor_inspector-audio_pitch-shifter-max-channels: "Kanalobergrenze für die Verarbeitung"
hint_editor_inspector-audio_pitch-shifter-overlap: "Wie stark sich aufeinanderfolgende Fenster überlappen - mehr Überlappung glättet Artefakte, kostet aber"
hint_editor_inspector-audio_pitch-shifter-pitch: "Tonhöhenfaktor - 1 ist unverändert, 2 eine Oktave höher"
hint_editor_inspector-audio_pitch-shifter_body: |-
  Ändert die Tonhöhe, ohne das Tempo zu ändern, sodass das Timing fest am Song bleibt. <color=#D4B483>Pitch</color> ist ein Faktor: 1 lässt sie unverändert, 2 ist eine Oktave höher. <color=#D4B483>FFT Size</color> und <color=#D4B483>Overlap</color> wägen Qualität gegen Rechenaufwand ab

  <color=#5EC8C8><b>Tipp:</b></color> die Kette gehört zur <b>Spur</b> und wird nicht mit Keyframes animiert. Für einen Wechsel mitten im Song schneide die Spur und stelle die beiden Hälften unterschiedlich ein

  <color=#B48CE0><b>Gut zu wissen:</b></color> <b>Zurücksetzen</b> stellt auch <b>Mix Level</b> auf den Standardwert -80 dB und schaltet den Effekt damit aus

  Mehr: <link="https://bullethero.space/de/docs/editor/resources/preparing-the-track"><color=#59A6FF>Den Song vorbereiten</color></link>
hint_editor_inspector-audio_pitch-shifter_header: "Tonhöhe"
hint_editor_inspector-audio_reverb-decay-hf-ratio: "Wie viel schneller die Höhen abklingen als die Tiefen - unter 1 wird der Nachhall beim Ausklingen dunkler"
hint_editor_inspector-audio_reverb-decay-time: "Sekunden, bis der Nachhall ausklingt - der stärkste Hinweis auf die Raumgröße"
hint_editor_inspector-audio_reverb-density: "Modendichte des simulierten Raums"
hint_editor_inspector-audio_reverb-diffusion: "Echodichte über die Zeit - niedrige Werte machen den Nachhall körnig und metallisch"
hint_editor_inspector-audio_reverb-dry-level: "Pegel des unbearbeiteten Signals im Ausgang"
hint_editor_inspector-audio_reverb-hf-reference: "Frequenz, bei der Room HF und Decay HF Ratio gemessen werden"
hint_editor_inspector-audio_reverb-lf-reference: "Frequenz, bei der Room LF gemessen wird"
hint_editor_inspector-audio_reverb-reflect-delay: "Verzögerung, bis diese Reflexionen eintreffen - wie weit die Wände entfernt sind"
hint_editor_inspector-audio_reverb-reflections: "Pegel der frühen Reflexionen - die deutlichen ersten Abpraller von nahen Wänden"
hint_editor_inspector-audio_reverb-reverb: "Pegel des späten, diffusen Nachhalls im Gegensatz zu den frühen Reflexionen"
hint_editor_inspector-audio_reverb-reverb-delay: "Verzögerung, bis dieser Nachhall einsetzt"
hint_editor_inspector-audio_reverb-room: "Gesamtpegel des verhallten Signals - wie präsent der Raum ist"
hint_editor_inspector-audio_reverb-room-hf: "Raumpegel bei hohen Frequenzen - abgesenkt klingt er nach weichen, schluckenden Wänden"
hint_editor_inspector-audio_reverb-room-lf: "Raumpegel bei tiefen Frequenzen"
hint_editor_inspector-audio_reverb_body: |-
  Setzt die Spur in einen Raum: frühe Reflexionen, dann ein abklingender Nachhall. Fang mit drei Feldern an: <color=#D4B483>Decay Time</color> ist die Raumgröße, <color=#D4B483>Room</color> wie viel davon du hörst, ein tief abgesenktes <color=#D4B483>Room HF</color> macht die Wände weich

  <color=#B48CE0><b>Gut zu wissen:</b></color> <b>Zurücksetzen</b> stellt auch <b>Mix Level</b> auf den Standardwert -80 dB und schaltet den Effekt damit aus

  Mehr: <link="https://bullethero.space/de/docs/editor/resources/preparing-the-track"><color=#59A6FF>Den Song vorbereiten</color></link>
hint_editor_inspector-audio_reverb_header: "Hall"
hint_editor_inspector-effect_angle-a: "Der Winkel in Grad. Bei den Zufallsvarianten ist er ein Ende des Bereichs, aus dem jedes Partikel zieht"
hint_editor_inspector-effect_angle-b: "Das andere Ende des Bereichs, aus dem jedes Partikel seinen Winkel zieht"
hint_editor_inspector-effect_angle-curve: "Die Kurve, aus der der Winkel gelesen wird - über die eigene Lebensdauer des Partikels bei \"Kurven über Lebensdauer\", über sein Tempo bei \"Kurven nach Tempo\""
hint_editor_inspector-effect_angle-speed-range: "Tempobereich, durch den die Kurve umgerechnet wird - das Tempo, das als Anfang der Kurve gilt, und das, das als ihr Ende gilt"
hint_editor_inspector-effect_angle-type: "Welche der fünf Drehungsvarianten das ist. Ein Wechsel ersetzt das ganze Unterobjekt, die Zeilen darunter gehören also zur neuen Variante"
hint_editor_inspector-effect_angle_body: |-
  Wie ein Partikel über seine Lebensdauer gedreht wird, als eine von fünf Varianten: ein fester <color=#D4B483>Wert</color>, zwei <color=#D4B483>Kurven</color> oder zwei <color=#D4B483>Zufällig</color>-Bereiche, je Partikel gezogen

  Bei <color=#D4B483>Kurven über Lebensdauer</color> wird die Kurve entlang der Lebensdauer des Partikels gelesen, bei <color=#D4B483>Kurven nach Tempo</color> entlang seines Tempos, durch den Tempobereich darunter

  Das <b>Zurücksetzen</b> neben dieser Schaltfläche setzt auch <color=#D4B483>Typ</color> zurück, und die Kurve oder das Zufallspaar geht mit

  Mehr: <link="https://bullethero.space/de/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Lesbarkeit und Fairness</color></link>
hint_editor_inspector-effect_angle_header: "Winkel"
hint_editor_inspector-effect_body: |-
  Die Parameter eines <color=#D4B483>VFX Graph</color>-Effekts, gruppiert: Konfiguration, Allgemein, Kräfte, Form, Winkel, Skalierung und Farbe. Alle Gruppen sind gleichzeitig sichtbar, nicht eine nach der anderen

  <color=#B48CE0><b>Gut zu wissen:</b></color> Effekte bekommen ihren <b>Seed genauso wie alles andere</b> - aus Zahlen, die du bearbeitest, nicht aus einem Generatorzustand -, daher läuft dasselbe Level auf jedem Gerät identisch ab

  <color=#5EC8C8><b>Tipp:</b></color> Farben können auf das Theme des Levels verweisen, statt einen festen Wert zu halten, und Verlaufstypen öffnen den gemeinsamen Verlaufseditor

  Mehr: <link="https://bullethero.space/de/docs/editor/performance/level-budget"><color=#59A6FF>Levelbudget</color></link>
hint_editor_inspector-effect_color-a: "Die Farbe des Partikels. Bei den Zufallsvarianten ist sie ein Ende des Bereichs, aus dem jedes Partikel zieht"
hint_editor_inspector-effect_color-b: "Das andere Ende des Bereichs, aus dem jedes Partikel seine Farbe zieht"
hint_editor_inspector-effect_color-gradient: "Der Verlauf, aus dem die Tönung gelesen wird - entlang der Lebensdauer des Partikels, entlang seines Tempos oder eine Farbe pro Partikel, je nach Variante"
hint_editor_inspector-effect_color-speed-range: "Tempobereich, durch den der Verlauf umgerechnet wird - das Tempo, das als sein Anfang gilt, und das, das als sein Ende gilt"
hint_editor_inspector-effect_color-type: "Welche der sechs Tönungsvarianten das ist. Ein Wechsel ersetzt das ganze Unterobjekt, die Zeilen darunter gehören also zur neuen Variante"
hint_editor_inspector-effect_color_body: |-
  Wie ein Partikel über seine Lebensdauer getönt wird, als eine von sechs Varianten: die fünf von <link="hint_editor_inspector-effect_angle"><color=#59A6FF>Winkel</color></link> und <link="hint_editor_inspector-effect_scale"><color=#59A6FF>Skalierung</color></link> mit Verläufen statt Kurven, dazu <color=#D4B483>Zufälliger Verlauf</color>, der eine Farbe pro Partikel wählt

  <color=#5EC8C8><b>Tipp:</b></color> eine Farbe kann hier ein Theme-Verweis sein, so folgt der Effekt einem Level, das seine Palette mittendrin wechselt

  Das <b>Zurücksetzen</b> neben dieser Schaltfläche setzt auch <color=#D4B483>Typ</color> zurück, und der Verlauf oder das Farbpaar geht mit

  Mehr: <link="https://bullethero.space/de/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>Farbe, Themes und Post-Processing</color></link>
hint_editor_inspector-effect_color_header: "Farbe"
hint_editor_inspector-effect_config-has-stop-frame: "Ob der Stopp-Frame überhaupt beachtet wird. Aus: der Emitter erzeugt weiter Partikel, solange sein Objekt lebt"
hint_editor_inspector-effect_config-stop-frame: "Frame, in dem die Emission endet, gezählt ab dem Anfang der eigenen Spanne des Objekts statt ab der Levelzeit. Schon lebende Partikel leben ihre Lebensdauer noch zu Ende"
hint_editor_inspector-effect_config_body: |-
  Wann der Emitter aufhört, Partikel zu erzeugen. Aus: er erzeugt sie, solange das Objekt lebt, und das ist der Normalfall

  <color=#D4B483>Stopp-Frame</color> zählt ab dem Anfang der eigenen Spanne des Objekts, nicht ab der Zeitleiste des Levels. Schon lebende Partikel leben zu Ende, das Bild blendet also aus, statt abzureißen

  Das <b>Zurücksetzen</b> neben dieser Schaltfläche stellt beide Felder in einem Rückgängig-Schritt auf die Standardwerte der Entwickler zurück

  Mehr: <link="https://bullethero.space/de/docs/editor/performance/level-budget"><color=#59A6FF>Levelbudget</color></link>
hint_editor_inspector-effect_config_header: "Konfiguration"
hint_editor_inspector-effect_core-lifetime-bounds: "Minimale und maximale Lebensdauer eines Partikels in Sekunden, je Partikel gezogen - die Streuung verhindert, dass ein Ausstoß auf einmal erlischt. Mit ihrem Mittelwert wird auch die Ausstoßgröße eines einmaligen Effekts multipliziert"
hint_editor_inspector-effect_core-loop: "Ob das System fortlaufend emittiert statt einer einzigen Ladung, die nie aufgefüllt wird. Ist es aus, gibt es nach den Lebensdauergrenzen nichts mehr zu zeichnen"
hint_editor_inspector-effect_core-particle-count: "Partikel pro Sekunde - der wichtigste Kostenregler. Gleichzeitig am Leben sind diese Zahl mal die mittlere Lebensdauer, in beiden Modi: mit Schleife wird in dieser Rate erzeugt, ein einmaliger Effekt stößt das ganze Produkt auf einmal aus. Die Obergrenze ist die eigene Kapazität des Graphen, und ein System rechnet in jedem Frame über diese ganze Kapazität, ob die Partikel existieren oder nicht"
hint_editor_inspector-effect_core-particle-pivot: "Punkt des Partikels, der auf seiner Position sitzt und um den es sich dreht - das Gegenstück zum eigenen Drehpunkt eines Objekts, nur pro Partikel"
hint_editor_inspector-effect_core-render: "Ob Partikel überhaupt gezeichnet werden. Aus: das System simuliert weiter, nützlich, wenn nur seine Nebenwirkungen zählen"
hint_editor_inspector-effect_core-shape-id: "Geometrie, mit der jedes Partikel gezeichnet wird, aus demselben Formenvorrat, aus dem auch ein Objekt zeichnet. \"Keine\" zeichnet gar nichts - das Quad ist ein gewöhnlicher Wert und der Standard dieses Felds"
hint_editor_inspector-effect_core-texture-id: "Bild, das jedes Partikel zeichnet, aus demselben Ressourcenvorrat, aus dem auch ein Objekt zeichnet. \"Keine\" lässt das Partikel unbemalt, und das ist der Standard dieses Felds"
hint_editor_inspector-effect_core_body: |-
  Wie viele Partikel existieren, wie lange sie leben und womit sie gezeichnet werden. Wie sie sich bewegen, regelt <link="hint_editor_inspector-effect_forces"><color=#59A6FF>Kräfte</color></link>

  <color=#D4B483>Partikelanzahl</color> ist der wichtigste Kostenregler: ein Emitter kostet etwa die Anzahl mal <color=#D4B483>Lebensdauergrenzen</color>. <color=#D4B483>Form</color> und <color=#D4B483>Textur</color> dürfen leer bleiben - ein Partikel ohne Textur ist der günstige Fall

  <color=#E8B04B><b>Warnung:</b></color> die Anzahl ist auf 1024 begrenzt, und der Graph bezahlt in jedem Frame für seine ganze Kapazität, nicht nur für die lebenden Partikel. Fordere so viele an, wie du brauchst

  Mehr: <link="https://bullethero.space/de/docs/editor/performance/level-budget"><color=#59A6FF>Levelbudget</color></link>
hint_editor_inspector-effect_core_header: "Allgemein"
hint_editor_inspector-effect_forces-linear-force: "Konstante Beschleunigung statt Geschwindigkeit, ihre Wirkung summiert sich also über die Lebensdauer des Partikels, statt gleich zu bleiben"
hint_editor_inspector-effect_forces-linear-velocity: "Konstante Drift, die in jedem Frame zu der Geschwindigkeit addiert wird, mit der das Partikel entstanden ist - Wind, kein Stoß"
hint_editor_inspector-effect_forces-orbital-center-offset: "Wo der Mittelpunkt dieser Umlaufbahn relativ zum Emitter liegt. Ein Versatz macht den Wirbel schief"
hint_editor_inspector-effect_forces-orbital-velocity: "Drehung der Partikel um einen Mittelpunkt statt um sich selbst. In einer 2D-Szene zählt die Z-Komponente"
hint_editor_inspector-effect_forces-start-angular-velocity-max: "Obergrenze der gezogenen Anfangsdrehung"
hint_editor_inspector-effect_forces-start-angular-velocity-min: "Untergrenze der gezogenen Anfangsdrehung, in Grad pro Sekunde"
hint_editor_inspector-effect_forces-start-gravity-max: "Obergrenze der je Partikel gezogenen Schwerkraft"
hint_editor_inspector-effect_forces-start-gravity-min: "Untergrenze der je Partikel gezogenen Schwerkraft. Negative Werte lassen nach oben schweben"
hint_editor_inspector-effect_forces-start-velocity-max: "Obergrenze der gezogenen Startgeschwindigkeit. Diese beiden auseinanderzuziehen macht aus einem sauberen Ausstoß eine Sprühwolke"
hint_editor_inspector-effect_forces-start-velocity-min: "Untergrenze der gezogenen Startgeschwindigkeit, je Achse"
hint_editor_inspector-effect_forces-velocity-speed: "Multiplikator auf die gesamte Geschwindigkeit des Partikels - ein Regler, um einen fertigen Effekt zu verlangsamen oder zu beschleunigen, ohne jedes Feld darüber neu einzustellen"
hint_editor_inspector-effect_forces_body: |-
  Alles, was ein Partikel nach dem Erscheinen bewegt. Wo es startet, regelt <link="hint_editor_inspector-effect_shape"><color=#59A6FF>Form</color></link>

  Die <color=#D4B483>Start</color>-Paare werden einmal beim Entstehen gezogen, je Partikel. Alles andere wirkt fortlaufend über die ganze Lebensdauer, und <color=#D4B483>Lineare Kraft</color> ist eine Beschleunigung, summiert sich also

  <color=#5EC8C8><b>Tipp:</b></color> <color=#D4B483>Bewegungstempo</color> multipliziert das ganze Ergebnis, so lässt sich ein fertiger Effekt verlangsamen oder beschleunigen, ohne den Rest neu einzustellen

  Mehr: <link="https://bullethero.space/de/docs/editor/craft/composition-and-camera"><color=#59A6FF>Komposition und Kamera</color></link>
hint_editor_inspector-effect_forces_header: "Kräfte"
hint_editor_inspector-effect_header: "Effekt-Inspector"
hint_editor_inspector-effect_scale-a: "Die Größe des Partikels. Bei den Zufallsvarianten ist sie ein Ende des Bereichs, aus dem jedes Partikel zieht"
hint_editor_inspector-effect_scale-b: "Das andere Ende des Bereichs, aus dem jedes Partikel seine Größe zieht"
hint_editor_inspector-effect_scale-curve-x: "Die Kurve, aus der die horizontale Größe gelesen wird, unabhängig von der vertikalen"
hint_editor_inspector-effect_scale-curve-y: "Die Kurve, aus der die vertikale Größe gelesen wird, unabhängig von der horizontalen"
hint_editor_inspector-effect_scale-speed-range: "Tempobereich, durch den beide Kurven umgerechnet werden - das Tempo, das als ihr Anfang gilt, und das, das als ihr Ende gilt"
hint_editor_inspector-effect_scale-type: "Welche der fünf Größenvarianten das ist. Ein Wechsel ersetzt das ganze Unterobjekt, die Zeilen darunter gehören also zur neuen Variante"
hint_editor_inspector-effect_scale_body: |-
  Wie groß ein Partikel über seine Lebensdauer ist, in denselben fünf Varianten wie <link="hint_editor_inspector-effect_angle"><color=#59A6FF>Winkel</color></link>. <color=#D4B483>Kurve X</color> und <color=#D4B483>Kurve Y</color> werden unabhängig gelesen, ein Partikel kann sich also strecken, während es schrumpft

  <color=#E8B04B><b>Warnung:</b></color> die Zeile unter den Kurven wird mehrfach genutzt: bei Wert und Zufällig ist sie die Größe selbst, bei Kurven nach Tempo der Tempobereich. Die Beschriftung daneben sagt, was gilt

  Das <b>Zurücksetzen</b> neben dieser Schaltfläche setzt auch <color=#D4B483>Typ</color> zurück, und beide Kurven und das Zufallspaar gehen mit

  Mehr: <link="https://bullethero.space/de/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Lesbarkeit und Fairness</color></link>
hint_editor_inspector-effect_scale_header: "Skalierung"
hint_editor_inspector-effect_shape-arc: "Genutzter Teil des Rands, in Radiant, gegen den Uhrzeigersinn ab der +X-Achse gemessen - weniger als eine volle Umdrehung ergibt einen Fächer"
hint_editor_inspector-effect_shape-box-size: "Volle Breite und Höhe des Erzeugungsrechtecks, zentriert auf das Effektobjekt"
hint_editor_inspector-effect_shape-circle-aspect: "Vertikale Halbachse als Vielfaches des Radius: 1 ist ein Kreis, alles andere eine Ellipse"
hint_editor_inspector-effect_shape-circle-radius: "Abstand vom Mittelpunkt zum Ring, entlang der horizontalen Achse"
hint_editor_inspector-effect_shape-circle-thickness: "Wie weit der Ring nach innen gefüllt ist: 0 ist ein bloßer Umriss, 1 eine volle Scheibe"
hint_editor_inspector-effect_shape-cone-base-radius: "Radius am Ende des Emitters"
hint_editor_inspector-effect_shape-cone-height: "Abstand zwischen den beiden Enden - wie tief der Erzeugungsbereich ist"
hint_editor_inspector-effect_shape-cone-top-radius: "Radius am fernen Ende. Größer als der Basisradius weitet sich auf, kleiner verengt sich zum Trichter"
hint_editor_inspector-effect_shape-line-end: "Das andere Ende der Strecke"
hint_editor_inspector-effect_shape-line-start: "Ein Ende der Strecke, lokal zum Effektobjekt"
hint_editor_inspector-effect_shape-spread: "Teil der Form, den der Durchlauf abdeckt, bevor er von vorn beginnt"
hint_editor_inspector-effect_shape-spread-speed: "Wie schnell der Erzeugungspunkt vorrückt - das bestimmt die sichtbare Drehgeschwindigkeit"
hint_editor_inspector-effect_shape-spread-type: "Wie aufeinanderfolgende Partikel die Form durchlaufen: zufällig, als Schleife in eine Richtung, hin und zurück oder auf einem Sinus. Das macht aus einem starren Ring ein rotierendes oder schwenkendes Muster"
hint_editor_inspector-effect_shape-torus-radius-major: "Radius des Rings, um den die Röhre gebogen ist"
hint_editor_inspector-effect_shape-torus-radius-minor: "Radius der Röhre selbst - wie dick der Ring ist"
hint_editor_inspector-effect_shape-type: "Welcher Erzeugungsbereich das ist. Ein Wechsel ersetzt die Form, die Felder darunter gehören also zur neuen Form, nicht zur alten"
hint_editor_inspector-effect_shape_body: |-
  Der Erzeugungsbereich: ein Punkt, ein Ring, ein Rechteck, eine Strecke, ein Kegel oder ein Torus. Er entscheidet nur, wo ein Partikel startet, was danach passiert, regelt <link="hint_editor_inspector-effect_forces"><color=#59A6FF>Kräfte</color></link>

  Ein Wechsel von <color=#D4B483>Typ</color> ändert die Zeilen darunter, und die Zeilen werden zwischen den Typen geteilt. <color=#D4B483>Bogen</color> ist in Radiant, und weniger als eine volle Umdrehung ergibt einen Fächer

  <color=#5EC8C8><b>Tipp:</b></color> <b>Öffnungstyp</b> auf Schleife ergibt den klassischen rotierenden Emitter

  Das <b>Zurücksetzen</b> neben dieser Schaltfläche setzt auch <color=#D4B483>Typ</color> zurück, und die Form geht mit

  Mehr: <link="https://bullethero.space/de/docs/editor/craft/composition-and-camera"><color=#59A6FF>Komposition und Kamera</color></link>
hint_editor_inspector-effect_shape_header: "Form"
hint_editor_inspector-keyframe_body: |-
  <b>Alle Spuren, die die Auswahl berührt, werden gleichzeitig angezeigt</b>, nicht nur die zuletzt angeklickte. Ein leerer Wert bedeutet, dass die gewählten Keyframes darin <b>nicht übereinstimmen</b>

  <color=#5EC8C8><b>Tipp:</b></color> <b>Easing</b> wirkt über Spuren hinweg und wird als <b>ein einziger Rückgängig-Schritt</b> übernommen

  <color=#B48CE0><b>Gut zu wissen:</b></color> <b>Frame</b> ist gesperrt, solange mehrere Keyframes ausgewählt sind - eine Zahl würde sie alle auf einen Frame zusammenschieben. Ziehe sie stattdessen auf der Zeitleiste

  Mehr: <link="https://bullethero.space/de/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Wie der Editor funktioniert</color></link>
hint_editor_inspector-keyframe_header: "Keyframe-Inspector"
hint_editor_inspector-object_body: |-
  Die eigenen Felder des gewählten Objekts. Jeder Typ zeigt die gemeinsamen Felder des leeren Objekts, und Form-, Effekt-, Text- und Prefab-Objekte fügen darunter ihre eigenen hinzu

  <b>Aktiv</b> schaltet sowohl das Rendering <i>als auch</i> die Kollision ab, und Kinder erben es: ein hier ausgeschaltetes Objekt kann den Spieler nicht töten

  <color=#E86A5A><b>Vorsicht:</b></color> <b>Ebene</b> ist relativ zum Elternobjekt. Die schreibgeschützte globale Ebene daneben ist das, was der Renderer verwendet

  <color=#5EC8C8><b>Tipp:</b></color> ein bearbeitetes Feld an einem Objekt aus einem Prefab erzeugt eine <b>Überschreibung pro Instanz</b> - das Kästchen daneben zeigt sie an und setzt sie zurück

  Mehr: <link="https://bullethero.space/de/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Wie der Editor funktioniert</color></link>
hint_editor_inspector-object_header: "Objekt-Inspector"
hint_editor_inspector-resolved_body: |-
  Was die gewählten Objekte im aktuellen Frame <b>sind</b>, gelesen aus der laufenden Simulation statt aus dem, was du festgelegt hast

  Das Quadrat am Zeilenende ist der Keyframe-Zustand des Felds: blau - ein Keyframe in diesem Frame (klicke auf das Quadrat, um ihn auszuwählen), bernsteinfarben - zwischen Keyframes interpoliert, grau - außerhalb der Keyframes, der Wert wird gehalten, hohl - keine Keyframes, der Standardwert gilt. Die Pfeile setzen den Abspielkopf auf den vorigen oder nächsten Keyframe

  Unter der Linie stehen zusammengesetzte Werte - die summierte Ebene, das geerbte Aktiv-Flag und die mit den Elternobjekten verrechnete Transformation. Kein Keyframe setzt sie, daher haben sie keine Anzeige

  Mehr: <link="https://bullethero.space/de/docs/editor/reference/object-properties"><color=#59A6FF>Objekteigenschaften</color></link>
hint_editor_inspector-resolved_header: "Aktuelle Werte"
hint_editor_inspector_audio-span-fit: "Die Spur über so viel von ihrem Clip dehnen, wie vor das Levelende passt. Nicht verfügbar ohne auflösbaren Clip und bei Geschwindigkeit null, denn eine eingefrorene Spur hat keine Länge zum Einpassen"
hint_editor_inspector_audio-span-fit-level: "Spur und Level gemeinsam verlängern, bis der ganze Clip passt. Das Level wird nur länger, und ein Clip, der schon passt, ändert nichts"
hint_editor_inspector_collider-id_body: |-
  Was dieses Objekt <b>trifft</b> - und das ist eine eigene Wahl, getrennt davon, was es zeichnet

  <color=#B48CE0><b>Gut zu wissen:</b></color> keines ergibt sich aus dem anderen, und das ist Absicht: ein Warnstrahl, der gezeichnet wird, aber harmlos ist, eine Hitbox, die einfacher ist als die Grafik, die sie schützt, und eine unsichtbare Wand sind gewöhnlicher Inhalt statt Tricks

  <color=#5EC8C8><b>Tipp:</b></color> beide Felder wählen aus denselben zwei Sammlungen, eine Form, die ein Level selbst erstellt hat, kann also als das eine, das andere oder beides dienen

  Mehr: <link="https://bullethero.space/de/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Lesbarkeit und Fairness</color></link>
hint_editor_inspector_collider-id_header: "Collider"
hint_editor_inspector_ease_body: |-
  Wie der Wert vom vorigen Keyframe zu diesem gelangt

  <color=#B48CE0><b>Gut zu wissen:</b></color> das Easing gehört zur <b>eingehenden</b> Seite eines Keyframes, der erste Keyframe einer Spur hat also keinen Übergang, und seine Wahl wirkt sich nicht aus

  <color=#5EC8C8><b>Tipp:</b></color> sind mehrere Keyframes ausgewählt, gilt die Wahl für alle als <b>ein einziger Rückgängig-Schritt</b>, auch über Spuren und Objekte hinweg. Eine leere Wahl bedeutet, dass sie nicht übereinstimmen

  Mehr: <link="https://bullethero.space/de/docs/editor/basics/keyframes-and-easing"><color=#59A6FF>Keyframes und Easing</color></link>
hint_editor_inspector_ease_header: "Easing"
hint_editor_inspector_global-layer: "Die Zeichenreihenfolge, die der Renderer tatsächlich verwendet: die eigene Ebene dieses Objekts plus die aller Vorfahren. Schreibgeschützt, weil sie berechnet und nicht gespeichert wird"
hint_editor_inspector_layer_body: |-
  Zeichenreihenfolge, <b>relativ zum Elternobjekt</b> statt absolut

  <color=#E86A5A><b>Vorsicht:</b></color> der Renderer verwendet diese Zahl plus die aller Vorfahren, schreibgeschützt angezeigt in <b>Global</b> darunter. Ein neues Elternobjekt ändert, wo ein Objekt gezeichnet wird, auch wenn diese Zahl gleich bleibt

  <color=#B48CE0><b>Gut zu wissen:</b></color> Zufallswerte hängen an der effektiven Ebene, ein Verschieben des Objekts in der Hierarchie würfelt sie also neu

  Mehr: <link="https://bullethero.space/de/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Wie der Editor funktioniert</color></link>
hint_editor_inspector_layer_header: "Ebene"
hint_editor_inspector_object-type: "Welche Art von Objekt das ist. Ein Wechsel ERSETZT das Objekt: die gemeinsamen Felder bleiben, und was im neuen Typ keinen Platz hat, fällt weg"
hint_editor_inspector_parent: "Welchem Objekt dieses folgt. Ein Elternobjekt überträgt seine Transformation auf das Kind, und Ebenen summieren sich entlang der Kette, ein neues Elternobjekt verschiebt ein Objekt also auch in der Zeichenreihenfolge"
hint_editor_inspector_shader-type_body: |-
  Welchen Renderpfad dieses Objekt nimmt

  <color=#E86A5A><b>Vorsicht:</b></color> <b>Automatisch</b> entscheidet einmal, beim Laden des Levels, und ändert nie, wie das Level aussieht: alles, was es anhand des Alphas nicht als deckend nachweisen kann, wird transparent

  <color=#5EC8C8><b>Tipp:</b></color> die Beschriftung neben diesem Feld zeigt, wozu Automatisch tatsächlich aufgelöst wurde, direkt aus den Daten des Renderers gelesen

  Mehr: <link="https://bullethero.space/de/docs/editor/performance/level-budget"><color=#59A6FF>Levelbudget</color></link>
hint_editor_inspector_shader-type_header: "Shadertyp"
hint_editor_inspector_shape-id_body: |-
  Was dieses Objekt <b>zeichnet</b>

  <color=#B48CE0><b>Gut zu wissen:</b></color> eine Form ist echte Geometrie, eingepasst in ihren Rahmen, genau 1 entlang ihrer längeren Achse, das Rechteck des Objekts ist also das, was auf dem Bildschirm erscheint. Das Spiel erzeugt rund 500 davon, und ein Level kann eigene hinzufügen

  <color=#5EC8C8><b>Tipp:</b></color> dieses Feld leer zu lassen ist gültig: ein Objekt, das nichts zeichnet, aber einen Collider hat, ist eine unsichtbare Wand

  Mehr: <link="https://bullethero.space/de/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Lesbarkeit und Fairness</color></link>
hint_editor_inspector_shape-id_header: "Form"
hint_editor_inspector_span_body: |-
  Wann dieses Objekt existiert, als halboffener Bereich: der Startframe gehört dazu, der Endframe nicht. Ein Objekt, das bei 20 endet, und eines, das bei 20 beginnt, werden in diesem Frame nie beide gezeichnet

  <color=#B48CE0><b>Gut zu wissen:</b></color> die Spanne eines Kindes muss innerhalb der seines Elternobjekts liegen, aber das wird beim Lesen aufgelöst, nie gespeichert. Verkleinere ein Elternobjekt, und seine Kinder werden beschnitten, vergrößere es wieder, und sie kommen zurück. Ein Wurzelobjekt, das über das Levelende hinausläuft, wird einfach nie abgespielt

  <b>Anker</b> lassen eine Kante der Kante des Elternobjekts folgen, und sie entscheiden, was abgespielt wird: ein verankertes Kind dehnt sich mit einem wachsenden Elternobjekt. Seine Animation behält das Timing, das du festgelegt hast

  Mehr: <link="https://bullethero.space/de/docs/editor/basics/frames-and-time"><color=#59A6FF>Frames, Zeit und die Länge eines Levels</color></link>
hint_editor_inspector_span_header: "Spanne"
hint_editor_interop-report: "Was eine Konvertierung aus dem Format eines anderen Spiels überstanden hat und was nicht. Die Einträge dienen nur zur Information: das Level ist bereits geladen, hier steht, wo es vom Original abweicht"
hint_editor_level-export_body: |-
  Schreibt dieses Level aus dem Spiel hinaus - als Ordner oder als ein Archiv. Alles, was das Level verwendet, reist mit, auch ein Song außerhalb des Levelordners

  Eine einfache <b>.zip</b> öffnet sich im Windows-Explorer, ohne dass etwas installiert sein muss. Die Passwortoptionen nicht: <b>+ Passwort</b> öffnet sich in 7-Zip oder jedem anderen Packprogramm, <b>(gpg)</b> öffnet sich mit gpg

  <color=#5EC8C8><b>Tipp:</b></color> was nicht mitreisen konnte - eine Ressource hinter einer URL, eine Datei, auf die nichts verweist -, wird danach im Bericht aufgeführt

  <color=#E8B04B><b>Warnung:</b></color> ein Passwort ist kein DRM. Wer die Datei und das Passwort hat, kann sie immer öffnen

  Mehr: <link="https://bullethero.space/de/docs/editor/workflow/sharing-by-hand"><color=#59A6FF>Ein Level von Hand teilen</color></link>
hint_editor_level-export_header: "Level exportieren"
hint_editor_level-protection_body: |-
  Verschlüsselt das Dokument dieses Levels auf dem Datenträger, sodass beim Öffnen des Levels ein Passwort abgefragt wird. Metadaten, Cover und Medien bleiben lesbar, die Levelkarte wird also auch ohne Passwort angezeigt

  Das Passwort wird einmal pro Sitzung abgefragt und nur im Speicher gehalten. Um den Schutz zu entfernen, lass das Feld leer und drücke <b>Übernehmen</b>

  <color=#E86A5A><b>Vorsicht:</b></color> ein vergessenes Passwort lässt sich nicht wiederherstellen. Nirgends wird ein Schlüssel aufbewahrt

  Mehr: <link="https://bullethero.space/de/docs/editor/reference/export-and-protection"><color=#59A6FF>Export und Schutz</color></link>
hint_editor_level-protection_header: "Level schützen"
hint_editor_prefab-flatten-recursive_body: |-
  Aus - nur die Platzierung, auf die du gezeigt hast, folgt ihrer Vorlage nicht mehr. Ein darin platziertes Prefab behält seine eigene Verknüpfung, Änderungen an dieser inneren Vorlage erreichen also weiterhin dieses Level. Das ist der Standard

  An - auch alles Verschachtelte wird aufgelöst, und nichts im Level bleibt mit diesen inneren Vorlagen verknüpft, in keiner Tiefe

  Die Vorlagen selbst bleiben in jedem Fall im Level, und ein Auflösen ist ein einziger Rückgängig-Schritt

  Mehr: <link="https://bullethero.space/de/docs/editor/reference/prefab-mode"><color=#59A6FF>Prefab-Modus</color></link>
hint_editor_prefab-flatten-recursive_header: "Verschachtelte Prefabs ebenfalls auflösen"
hint_editor_prefab-mode_body: |-
  <color=#E86A5A><b>Vorsicht:</b></color> du bearbeitest die <b>Vorlage</b> eines Prefabs, nicht eine einzelne Platzierung davon. Speichern überträgt die Änderung auf jede Platzierung, die auf diese Vorlage verweist

  Änderungen hier erzeugen keine Überschreibungen pro Instanz. Eine Überschreibung entsteht nur, wenn du das Objekt einer Platzierung außerhalb dieses Modus bearbeitest

  <color=#5EC8C8><b>Tipp:</b></color> eine Platzierung in dieser Vorlage öffnet ihre eigene Vorlage darüber, und "Speichern & schließen" bringt dich hierher zurück. Die Verschachtelung endet nach 8 Stufen

  Mehr: <link="https://bullethero.space/de/docs/editor/workflow/reuse"><color=#59A6FF>Wiederverwendung: Prefabs, Kopieren, Generatoren</color></link>
hint_editor_prefab-mode_header: "Prefab-Modus"
hint_editor_search-palette_body: |-
  Zwei Modi. <b>Befehl ausführen</b> findet jede Editoraktion nach Namen - dieselben Aktionen, die die Werkzeugleiste und die Kontextmenüs ausführen. <b>Inhalt durchsuchen</b> findet die Objekte des aktuellen Bereichs und die Audiospuren

  <color=#B48CE0><b>Gut zu wissen:</b></color> Ressourcen gibt es in keinem der beiden Modi: jede wird über das Feld ausgewählt, das sie braucht

  Mehr: <link="https://bullethero.space/de/docs/editor/workflow/speed-and-shortcuts"><color=#59A6FF>Tempo und Tastenkürzel</color></link>
hint_editor_search-palette_header: "Befehlspalette"
hint_editor_search-picker: "Die eine Auswahl, die jedes Ressourcenfeld nutzt. Tippe, um die Liste zu sortieren. Die Filter grenzen sie nach Art ein, und der Chip rechts erscheint, wenn ein Feld nur eine Domäne akzeptiert"
hint_editor_theme-ref_body: |-
  Richte diese Farbe auf einen <b>Slot im Theme des Levels</b> statt auf einen festen Wert. Ändert sich das Theme, wird alles, was auf den Slot verweist, auf einmal umgefärbt

  <color=#5EC8C8><b>Tipp:</b></color> die Farbfelder zeigen die Palette im Frame des Keyframes, den du bearbeitest, nicht am Abspielkopf. Um passend zu einem späteren Aussehen zu wählen, bearbeite einen Keyframe, der weiter hinten liegt

  Mehr: <link="https://bullethero.space/de/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>Farbe, Themes und Post-Processing</color></link>
hint_editor_theme-ref_header: "Verweis auf Theme-Farbe"
hint_editor_timeline-audio_body: |-
  Die Audiospuren des Levels mit ihren Wellenformen, damit du Inhalte an dem ausrichten kannst, was du hörst

  <color=#5EC8C8><b>Tipp:</b></color> <b>Spur einpassen</b> im Inspector passt eine Spur an die echte Länge ihres Clips an. Ohne Clip und bei Geschwindigkeit 0 ist es deaktiviert

  <color=#E86A5A><b>Vorsicht:</b></color> der Regler <b>Lautstärke</b> im Inspector ist der Fader der Spur. Die per Keyframe gesetzte Lautstärke ist eine eigene Lautstärke-Spur auf der lokalen Zeitleiste, und beim Abspielen werden beide multipliziert

  Mehr: <link="https://bullethero.space/de/docs/editor/resources/preparing-the-track"><color=#59A6FF>Den Song vorbereiten</color></link>
hint_editor_timeline-audio_header: "Audio-Zeitleiste"
hint_editor_timeline-events_body: |-
  Levelweite Keyframes, die zu keinem Objekt gehören:
  - Position, Drehung, Zoom, Drehpunkt und Erschütterung der Kamera
  - Marker und Checkpoints
  - die Bildschirmgrenze
  - Hintergrund und Theme
  - jeder Post-Processing-Effekt
  - Sichtbarkeit, Steuerung, Kollision, Größe und Geschwindigkeit des Spielers

  <color=#B48CE0><b>Gut zu wissen:</b></color> die Zeile <b>Beat</b> ist hier die Ausnahme. Ihre Elemente haben eine Spanne, daher ist sie die einzige Zeile, auf die Ränder und Schere wirken

  <color=#5EC8C8><b>Tipp:</b></color> eine Farbe kann auf das Theme des Levels verweisen, statt einen festen Wert zu halten. Dann färbt eine einzige Theme-Änderung alles davon um

  Mehr: <link="https://bullethero.space/de/docs/editor/craft/composition-and-camera"><color=#59A6FF>Komposition und Kamera</color></link>
hint_editor_timeline-events_header: "Ereignis-Zeitleiste"
hint_editor_timeline-level_body: |-
  Ein Clip pro Objekt, und die Zeile, in der er liegt, ist seine <b>Ebene</b>. Ein Clip ist die <b>Spanne</b> des Objekts: die Frames 10-19 enden genau dort, wo ein Clip ab Frame 20 beginnt

  <color=#B48CE0><b>Gut zu wissen:</b></color> ein Kind spielt nur innerhalb der Spanne seines Elternobjekts, aber von dem, was du erstellt hast, wird nichts abgeschnitten. Verlängere das Elternobjekt wieder, und das Kind kehrt zurück

  <color=#5EC8C8><b>Tipp:</b></color> <b>Auswahl</b> wählt aus und zieht, <b>Ränder</b> verändert einen Rand, <b>Schere</b> teilt einen Clip am Cursor. Ein Rechtsklick auf eine leere Stelle öffnet das Menü

  Mehr: <link="https://bullethero.space/de/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Wie der Editor funktioniert</color></link>, <link="https://bullethero.space/de/docs/editor/craft/composition-and-camera"><color=#59A6FF>Komposition und Kamera</color></link>
hint_editor_timeline-level_header: "Level-Zeitleiste"
hint_editor_timeline-local_body: |-
  Keyframes des <b>ausgewählten Objekts</b>, eine Zeile pro Spur. Frames zählen ab dem Beginn der Spanne des Objekts, daher nimmt ein verschobenes Objekt seine ganze Animation mit

  <color=#B48CE0><b>Gut zu wissen:</b></color> eine <b>leere Spur ist ein gültiger Zustand</b>. Sie nutzt den Standardwert, deshalb animiert ein neues Objekt nichts, bis du einen Keyframe hinzufügst

  Mehr: <link="https://bullethero.space/de/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Wie der Editor funktioniert</color></link>
hint_editor_timeline-local_header: "Lokale Zeitleiste"
hint_editor_timeline-prefab_body: |-
  Die eigene Zeitleiste des Prefab-Modus, über den Objekten der <b>Vorlage</b>. Ihre Länge ist die der Vorlage selbst, nicht die Spanne einer Platzierung

  <color=#E8B04B><b>Warnung:</b></color> die Auswahl wird nicht mit dem restlichen Editor geteilt. Änderungen hier verändern die Vorlage und übertragen sich auf jede ihrer Platzierungen

  Mehr: <link="https://bullethero.space/de/docs/editor/workflow/reuse"><color=#59A6FF>Wiederverwendung: Prefabs, Kopieren, Generatoren</color></link>
hint_editor_timeline-prefab_header: "Prefab-Zeitleiste"
hint_editor_value-type-color: "Woher die Farbe bei jedem Abspielen kommt. Wert - wie eingetragen. Theme - der Slot des Themes in diesem Frame, sie ändert sich also mit dem Theme. Zuf. Min-Max - jeder Kanal würfelt für sich, die Farbe landet also irgendwo zwischen den beiden. Zuf. A bis B - ein Wurf für alle Kanäle, die Farbe liegt also immer auf der Linie von A nach B"
hint_editor_value-type-number: "Wie diese Zahl bei jedem Abspielen bestimmt wird. Wert - die Zahl wie eingetragen. Zuf. Min-Max - eine Zahl zwischen den beiden Grenzen. Zuf. Min-Max, Schritt - dasselbe, eingerastet auf ein Raster dieser Größe. Eine Form A bis B gibt es hier nicht, weil eine Komponente ohnehin genau eine Zahl zieht. Ein Zufallswert wird adressiert, nicht gezogen, daher spielt sich dasselbe Level auf jedem Gerät gleich, und das Verschieben eines Objekts oder seiner Ebene würfelt ihn neu"
hint_editor_value-type-vector: "Wie dieser Vektor bei jedem Abspielen bestimmt wird. Wert - die Zahlen wie eingetragen. Zuf. im Rechteck - jede Achse würfelt für sich zwischen ihren beiden Grenzen und füllt so das Rechteck. Zuf. A bis B - EIN Wurf, den jede Achse an derselben Stelle liest, sodass der Punkt die gerade Linie von A nach B entlangläuft. Eine Achse bleibt stehen, wenn sie an beiden Enden dieselbe Zahl trägt. Zuf. im Kreis - ein Punkt auf einer Scheibe um den Mittelpunkt. Die Formen mit Schritt rasten das Ergebnis auf ein Raster ein. Ein Zufallswert wird adressiert, nicht gezogen, daher spielt sich dasselbe Level auf jedem Gerät gleich"
hint_editor_video-export_audio: "Die Spuren des Levels im Video, mit ihren Keyframes für Lautstärke und Panorama"
hint_editor_video-export_body: |-
  Rendert das geöffnete Level über das auf diesem Computer installierte ffmpeg in ein Video

  <color=#B48CE0><b>Gut zu wissen:</b></color> gerendert wird offline, ein Frame nach dem anderen, daher ist das Video exakt, egal wie langsam der Rechner ist. ffmpeg gehört nicht zum Spiel - installiere es einmal, und dieses Fenster findet es. Du kannst es auch von Hand auf eine Datei verweisen
  Mehr: <link="https://bullethero.space/de/docs/editor/reference/video-export"><color=#59A6FF>Videoexport</color></link>
hint_editor_video-export_bot: "Wer das Level im Video spielt. Reflex schaut einen Moment voraus und braucht keine Vorbereitung. Warm berechnet die ganze Route vor dem ersten Frame. Treffer bewirken während eines Exports nichts"
hint_editor_video-export_codec: "Wie Bild oder Ton im Container komprimiert werden. Aufgelistet ist nur, was dein ffmpeg erzeugen kann. Die Zeile darunter sagt, welcher Audiocodec dazugehört und welche Datei du bekommst"
hint_editor_video-export_effects: "Die Partikeleffekte des Levels im Video. Derselbe Schalter wie im Editor, nur für das Video"
hint_editor_video-export_engine-audio: "An: haben die Spuren Effekte, läuft der Ton des Levels in Echtzeit, während die Frames rendern, und der eigene Ton des Spiels wird mit allen Effekten aufgenommen, während die Lautsprecher stumm bleiben. Der Export dauert mindestens so lange wie der Bereich. Aus: die Spuren werden getrennt gemischt, ohne ihre Effekte. Nur Ton mischt immer getrennt"
hint_editor_video-export_ffmpeg: "ffmpeg kodiert das Video und gehört nicht zum Spiel. Grün - gefunden und bereit, Gelb - zu alt, Rot - nicht gefunden oder nicht startbar. \"ffmpeg wählen...\" verweist von Hand auf eine Datei, \"Erneut prüfen\" wiederholt die Suche"
hint_editor_video-export_fps: "Frames pro Sekunde des Videos, bis 240, unabhängig von der eigenen Framerate des Levels. Unter 60 wird jeder Frame in mehreren Schritten simuliert, damit der Bot so spielt wie im Spiel"
hint_editor_video-export_full-chroma: "Farbe für jedes Pixel statt für jedes zweite. Dünne farbige Linien bleiben scharf, die Datei wird größer, und manche Videoplayer öffnen sie nicht"
hint_editor_video-export_header: "Video exportieren"
hint_editor_video-export_output: "Wo das Video gespeichert wird. Standardmäßig recordings/[Level-ID] im Datenordner des Spiels, der das Löschen des Levels übersteht"
hint_editor_video-export_post-processing: "Das Post-Processing des Levels - Bloom, Farbkorrektur und der Rest - im Video. Derselbe Schalter wie im Editor, nur für das Video"
hint_editor_video-export_preroll: "Sekunden, die vor dem Start gespielt, aber nicht aufgenommen werden, damit Effekte und Partikel im ersten Frame schon ihre Vorgeschichte haben"
hint_editor_video-export_preset: "Die Art der Datei. MP4 öffnet sich überall, MKV und MOV sind für den Schnitt, WebM ist fürs Web, GIF, WebP und APNG sind kurze Clips ohne Ton, eine Bildsequenz ist ein Ordner mit Frames, Nur Ton rendert gar kein Bild"
hint_editor_video-export_quality: "Wie viel Platz das Video braucht. Entwurf ist klein und weich, Verlustfrei behält jedes Pixel und ist groß"
hint_editor_video-export_range: "Welcher Teil des Levels aufgenommen wird: alles, der Schleifenbereich der Zeitleiste oder dein eigener Start- und Endframe"
hint_editor_video-export_resolution: "Größe des Videos in Pixeln. Eigene nimmt jede gerade Breite und Höhe. Die Kamera des Levels wird hineingepasst, und schwarze Balken füllen den Rest"
hint_editor_video-export_seed: "Seed der Zufälligkeit des Levels. 0 behält den, den der Editor gerade nutzt, jede andere Zahl ergibt jedes Mal dasselbe Video"
hint_editor_video-export_sound-after-frames: "Aus (Standard): der Ton mit Effekten wird aufgenommen, während die Frames rendern, und der Export dauert so lange wie der längere der beiden Vorgänge. An: der Ton wird nach dem letzten Frame in Echtzeit aufgenommen, der Export dauert also um die Länge des Bereichs länger. Schalte es ein, wenn das Level aufwendig ist und der aufgenommene Ton stockt"
hint_gen_audio_waveform_body: |-
  Erstellt Objekte, die die Form einer Audiospur nachzeichnen, sodass das Level sichtbar dem folgt, was zu hören ist

  Mehr: <link="https://bullethero.space/de/docs/editor/workflow/reuse"><color=#59A6FF>Wiederverwendung: Prefabs, Kopieren, Generatoren</color></link>
hint_gen_audio_waveform_header: "Audio-Wellenform"
hint_gen_beat_flash_body: |-
  Setzt auf jeden Beat einen Blitz. Die Beats kommen aus dem Beat-Raster des Levels und, wenn es keines gibt, aus seinen Markern - es blitzt also genau das, was du im Raster siehst

  Mehr: <link="https://bullethero.space/de/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>Rhythmus und Struktur</color></link>
hint_gen_beat_flash_header: "Beat-Blitz"
hint_gen_bullet_homing_body: |-
  Geschosse, die sich dorthin krümmen, wo der Spieler erwartet wird. Die Kurve wird beim Erstellen festgelegt, nicht beim Abspielen berechnet: das Ergebnis bleibt auf jedem Gerät identisch

  Mehr: <link="https://bullethero.space/de/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Lesbarkeit und Fairness</color></link>
hint_gen_bullet_homing_header: "Zielsuchende Geschosse"
hint_gen_bullet_laser_sweep_body: |-
  Ein Strahl, der über das Feld schwenkt. Vorwarnung und tödliche Phase sind getrennte Objekte, sodass die Warnung gezeichnet werden kann, ohne töten zu können

  Mehr: <link="https://bullethero.space/de/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Lesbarkeit und Fairness</color></link>
hint_gen_bullet_laser_sweep_header: "Laserschwenk"
hint_gen_bullet_rain_body: |-
  Geschosse, die über einen Zeitraum auf eine Fläche fallen. Dichte und Streuung sind Parameter. Wo jedes landet, wird aus dem Seed des Levels bestimmt, daher ist ein Durchlauf reproduzierbar

  Mehr: <link="https://bullethero.space/de/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Lesbarkeit und Fairness</color></link>
hint_gen_bullet_rain_header: "Geschossregen"
hint_gen_bullet_spiral_body: |-
  Geschosse, die entlang eines rotierenden Arms ausgestoßen werden und die klassische Spiralwand bilden

  Mehr: <link="https://bullethero.space/de/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Lesbarkeit und Fairness</color></link>
hint_gen_bullet_spiral_header: "Geschossspirale"
hint_gen_bullet_wave_body: |-
  Eine Reihe von Geschossen, die gemeinsam vorrücken. Das Grundmuster, und das, das du zuerst lesen solltest: seine Parameter benennen die Ideen, die die anderen Geschossgeneratoren wiederverwenden

  Mehr: <link="https://bullethero.space/de/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Lesbarkeit und Fairness</color></link>
hint_gen_bullet_wave_header: "Geschosswelle"
hint_gen_capacity_hint_body: |-
  Schreibt die empfohlenen Grenzen des Levels - wie viele Objekte und Effekte es gleichzeitig zu brauchen erwartet

  <color=#B48CE0><b>Gut zu wissen:</b></color> sichtbar ändert er nichts. Die Laufzeit nutzt ihn, um Puffer im Voraus zu reservieren, statt sie mitten im Level zu vergrößern - genau daher käme sonst ein Ruckler

  Mehr: <link="https://bullethero.space/de/docs/editor/performance/level-budget"><color=#59A6FF>Levelbudget</color></link>
hint_gen_capacity_hint_header: "Kapazitätshinweis"
hint_gen_font_cache_body: |-
  Sammelt jedes Zeichen, das der Text des Levels tatsächlich nutzt, und backt es, damit keine Glyphe beim ersten Erscheinen vorbereitet werden muss

  <color=#7FC97F><b>Empfehlung:</b></color> führe ihn aus, wenn der Text fertig ist. Ein später hinzugefügtes und nicht neu gebackenes Zeichen kostet einen Ruckler in dem Moment, in dem es zum ersten Mal erscheint

  Mehr: <link="https://bullethero.space/de/docs/editor/resources/images-and-fonts"><color=#59A6FF>Bilder und Schriftarten</color></link>
hint_gen_font_cache_header: "Schriftcache"
hint_gen_geometry_fractal_body: |-
  Wiederholt eine Form in sich selbst in immer kleinerem Maßstab. Die Tiefe kostet exponentiell viele Objekte, erhöhe sie also Schritt für Schritt

  Mehr: <link="https://bullethero.space/de/docs/editor/workflow/reuse"><color=#59A6FF>Wiederverwendung: Prefabs, Kopieren, Generatoren</color></link>
hint_gen_geometry_fractal_header: "Fraktal"
hint_gen_geometry_grid_body: |-
  Füllt ein Rechteck mit gleichmäßig verteilten Kopien einer Form

  Mehr: <link="https://bullethero.space/de/docs/editor/workflow/reuse"><color=#59A6FF>Wiederverwendung: Prefabs, Kopieren, Generatoren</color></link>
hint_gen_geometry_grid_header: "Raster"
hint_gen_geometry_polygon_body: |-
  Setzt Formen an die Ecken oder Kanten eines regelmäßigen Polygons

  Mehr: <link="https://bullethero.space/de/docs/editor/workflow/reuse"><color=#59A6FF>Wiederverwendung: Prefabs, Kopieren, Generatoren</color></link>
hint_gen_geometry_polygon_header: "Polygon"
hint_gen_geometry_radial_body: |-
  Verteilt Kopien auf einem Kreis. Die Grundlage der meisten symmetrischen Muster

  Mehr: <link="https://bullethero.space/de/docs/editor/workflow/reuse"><color=#59A6FF>Wiederverwendung: Prefabs, Kopieren, Generatoren</color></link>
hint_gen_geometry_radial_header: "Radial"
hint_gen_geometry_spiral_body: |-
  Verteilt Kopien entlang einer Spirale, wobei Radius und Winkel gemeinsam wachsen

  Mehr: <link="https://bullethero.space/de/docs/editor/workflow/reuse"><color=#59A6FF>Wiederverwendung: Prefabs, Kopieren, Generatoren</color></link>
hint_gen_geometry_spiral_header: "Spirale"
hint_gen_level_archive_body: |-
  Erstellt ein Level aus einem Archiv, das dieses Spiel geschrieben hat - .tar.gz oder .zip, beide optional mit Passwort. Der Typ wird aus den Bytes gelesen, daher öffnet sich auch ein umbenanntes Archiv. Ein Archiv aus einem älteren Build wird beim Einlesen migriert

  <color=#E8B04B><b>Warnung:</b></color> das importierte Level bekommt standardmäßig eine eigene ID, daher kann es kein Level überschreiben, das schon auf diesem Gerät liegt. Schalte das nur aus, um ein Level zurückzuholen, das dieses Gerät früher hatte

  Mehr: <link="https://bullethero.space/de/docs/editor/reference/generators"><color=#59A6FF>Generatoren</color></link>
hint_gen_level_archive_header: "Levelarchiv importieren"
hint_gen_level_audio_file_body: |-
  Startet ein Level mit einem Song: holt das Audio als Spur herein, passt die Länge des Levels an seine Länge an und lässt dich am Anfang einer leeren Zeitleiste zurück

  Mehr: <link="https://bullethero.space/de/docs/editor/resources/preparing-the-track"><color=#59A6FF>Den Song vorbereiten</color></link>
hint_gen_level_audio_file_header: "Level aus Audiodatei"
hint_gen_level_empty_body: |-
  Leert das Level vollständig. Alles Erstellte wird entfernt - deshalb ist er die richtige Wahl, wenn du neu anfängst, statt zu bearbeiten

  Mehr: <link="https://bullethero.space/de/docs/editor/basics/first-level"><color=#59A6FF>Dein erstes Level: der Weg</color></link>
hint_gen_level_empty_header: "Leeres Level"
hint_gen_section_additional: "Verfeinerungen zusätzlich zu den Hauptparametern. Die Standardwerte passen hier meist"
hint_gen_section_main: "Die Parameter, die bestimmen, was dieser Generator erzeugt. Fang hier an"
hint_gen_test_camera_flash_body: "Ein Entwicklungsgenerator, der zum Testen der Kamera-Ereignisspuren dient. Nicht zum Erstellen von Inhalten gedacht"
hint_gen_test_camera_flash_header: "Kamerablitz (Test)"
hint_gen_test_form_body: "Ein Entwicklungsgenerator, der jedes Parameter-Steuerelement durchspielt, das das Formular bauen kann. Nicht zum Erstellen von Inhalten gedacht"
hint_gen_test_form_header: "Formular (Test)"
hint_gen_test_odd_body: "Ein Entwicklungsgenerator mit absichtlich unbequemen Parameterfällen. Nicht zum Erstellen von Inhalten gedacht"
hint_gen_test_odd_header: "Seltsam (Test)"
hint_gen_test_partial_order_body: "Ein Entwicklungsgenerator, der prüft, wie Felder angeordnet werden, die der Reihenfolge-Hinweis nicht nennt. Nicht zum Erstellen von Inhalten gedacht"
hint_gen_test_partial_order_header: "Teilordnung (Test)"
hint_gen_test_scatter_body: "Ein Entwicklungsgenerator für die Pfade der adressierten Zufälligkeit. Nicht zum Erstellen von Inhalten gedacht"
hint_gen_test_scatter_header: "Streuung (Test)"
hint_gen_test_sections_body: "Ein Entwicklungsgenerator, der ein Formular mit mehreren Abschnitten erzeugt. Nicht zum Erstellen von Inhalten gedacht"
hint_gen_test_sections_header: "Abschnitte (Test)"
hint_gen_test_spawn_body: "Ein Entwicklungsgenerator für die Pfade zum Erstellen von Objekten. Nicht zum Erstellen von Inhalten gedacht"
hint_gen_test_spawn_header: "Spawn (Test)"
hint_gen_texture_objects_body: |-
  Verwandelt ein Bild in Objekte, eines pro Zelle, sodass ein Bild zu Levelinhalt wird, der sich wie alles andere animieren lässt

  Mehr: <link="https://bullethero.space/de/docs/editor/resources/images-and-fonts"><color=#59A6FF>Bilder und Schriftarten</color></link>
hint_gen_texture_objects_header: "Objekte aus Textur"
hint_level-preview_authors: "Alle, die bei diesem Level genannt sind. Die Urheberschaft reist im Levelordner mit, daher übersteht sie das Zippen, Weiterschicken und erneute Hochladen durch jemand anderen"
hint_level-preview_licenses_body: |-
  Die Bedingungen, unter denen dieses Level und seine Ressourcen stehen. <b>Bedingungen werden pro Ressource festgehalten</b>, daher sagt ein Level aus geliehenen Teilen genau, was geliehen wurde und zu welchen Bedingungen

  <color=#7FC97F><b>Empfehlung:</b></color> lies sie, bevor du etwas aus dem Level eines anderen wiederverwendest

  Mehr: <link="https://bullethero.space/de/docs/editor/rights/licensing-basics"><color=#59A6FF>Lizenzen: das Wichtigste in drei Minuten</color></link>
hint_level-preview_licenses_header: "Lizenzen"
hint_level_backups: "Jede automatische Kopie dieses Levels, die neueste zuerst - der Name ist der Moment, in dem sie entstand. Nichts davon wird gelesen, bis du eine auswählst. Wiederherstellen ersetzt die Leveldatei auf der Festplatte und lädt sie neu, und die ersetzte Datei wird vorher in die Sicherungen geschrieben, sodass sich auch eine Wiederherstellung rückgängig machen lässt"
hint_level_collections_body: |-
  <b>Import</b> holt Einträge einer Sammlung in dieses Level, <b>Sammlung erstellen</b> kopiert die Ressourcen dieses Levels in eine Sammlung. Alles, was ein Eintrag braucht, kommt mit, und ein Import ist ein einziger Rückgängig-Schritt

  <color=#E8B04B><b>Warnung:</b></color> hat das Level schon eine andere Version eines Eintrags, fragt das Spiel nach. Behalte die Version des Levels oder importiere die der Sammlung als Kopie mit neuer ID

  Mehr: <link="https://bullethero.space/de/docs/editor/reference/library-and-collections"><color=#59A6FF>Bibliothek und Sammlungen</color></link>
hint_level_collections_header: "Sammlungen"
hint_level_core-framerate: "Eine direkte Änderung macht jedes Objekt schneller oder langsamer: Keyframes behalten ihre Framenummern, daher spielt dasselbe Level mit anderem Tempo. Nutze den Generator, um den Inhalt auf eine andere Framerate umzurechnen"
hint_level_core-level-id: "Die dauerhafte Kennung dieses Levels, einmal bei der Erstellung erzeugt und nie bearbeitet. Gib sie an, wenn du ein Problem mit dem Level meldest, und nutze sie, um zwei Kopien desselben Levels auseinanderzuhalten"
hint_level_core-orientation_body: |-
  Wie herum dieses Level gehalten werden soll

  <b>Horizontal</b> und <b>Vertikal</b> drehen das Gerät des Spielers für das Level und haben Vorrang vor seiner eigenen Einstellung. Am Desktop läuft ein vertikales Level zwischen seitlichen Balken, und so soll es auch aussehen

  <b>Nicht festgelegt</b> überlässt die Wahl dem Spieler und ist eine <b>Zusage</b>, dass das Level in <b>beiden</b> Ausrichtungen richtig lesbar ist. Dafür wird nichts neu angeordnet oder skaliert, prüfe das Level also vorher in beiden Ausrichtungen

  Mehr: <link="https://bullethero.space/de/docs/editor/reference/level-settings"><color=#59A6FF>Leveleinstellungen</color></link>
hint_level_core-orientation_header: "Level-Ausrichtung"
hint_level_core-runtime-seed: "Womit diese Editorsitzung gerade tatsächlich spielt. Ohne Seed darüber ist es bei jedem Laden des Levels eine neue Zahl. \"Neu erzeugen\" würfelt eine weitere, ohne das Level anzufassen"
hint_level_core-seed: "Jeder Zufallswert in diesem Level wird aus diesem Seed plus der eigenen Ebene und dem Startframe jedes Objekts gebildet, daher spielt derselbe Seed immer gleich. 0 heißt kein Seed: das Spiel erzeugt bei jedem Start einen neuen"
hint_level_core_body: |-
  Länge in Frames, Framerate und die beiden Seeds des Levels

  <color=#B48CE0><b>Gut zu wissen:</b></color> <b>Frames zählen ab 1.</b> Ein Level aus N Frames enthält die Frames 1 bis N, und N+1 ist die Endgrenze, kein Frame

  <b>Level-Seed</b> gehört dem Level selbst und lässt sich rückgängig machen. 0 bedeutet "bei jedem Durchlauf ein neuer Seed" und ist der Standard

  <color=#5EC8C8><b>Tipp:</b></color> <b>Laufzeit-Seed</b> zeigt, was diese Editorsitzung ermittelt hat. <i>Neu erzeugen</i> würfelt einen neuen nur für die Sitzung - nichts wird geschrieben, nichts landet im Rückgängig-Verlauf

  Mehr: <link="https://bullethero.space/de/docs/editor/basics/frames-and-time"><color=#59A6FF>Frames, Zeit und die Länge eines Levels</color></link>
hint_level_core_header: "Allgemein"
hint_level_dangerous_body: |-
  Aktionen, die Dateien zerstören oder umschreiben statt Inhalte

  <color=#E86A5A><b>Vorsicht:</b></color> die Auswahllisten für das <b>Dateiformat</b> schreiben das Level und seine Metadaten auf der Festplatte neu. Das Umschreiben in ein anderes Format <b>löscht die Datei, die das alte hinterlassen hat</b>. Sonst passiert nichts: kein Neuladen, keine erneute Simulation, kein Zurücksetzen deiner Auswahl oder des Rückgängig-Verlaufs, denn das Modell im Speicher ist bereits genau das, was geschrieben wird

  <color=#E86A5A><b>Vorsicht:</b></color> <b>Level löschen</b> entfernt den Ordner des Levels von der Festplatte. Das lässt sich nicht rückgängig machen

  Mehr: <link="https://bullethero.space/de/docs/editor/workflow/not-losing-work"><color=#59A6FF>Damit keine Arbeit verloren geht</color></link>
hint_level_dangerous_header: "Gefahrenzone"
hint_level_effect-editor_body: |-
  Erstelle einen Partikeleffekt und sieh ihn dir auf der Leinwand an

  <color=#B48CE0><b>Gut zu wissen:</b></color> die Parametergruppen sind dieselben, die der Effekt-Inspector zeigt, hier aber als <b>Entwurf</b> bearbeitet: nichts erreicht das Level, bis du speicherst

  <color=#5EC8C8><b>Tipp:</b></color> speichere in die geräteweite Bibliothek, um den Effekt in mehreren Levels wiederzuverwenden

  Mehr: <link="https://bullethero.space/de/docs/editor/performance/level-budget"><color=#59A6FF>Levelbudget</color></link>
hint_level_effect-editor_header: "Effekteditor"
hint_level_font-cache: "Welche Glyphen das Level vorab backt, damit Text beim ersten Erscheinen eines Zeichens nicht stockt - pro Schriftart und pro Sprache. Nur lesbar: der Schriftcache-Generator füllt ihn aus dem Text, den das Level tatsächlich enthält, und nichts auf diesem Tab bearbeitet ihn"
hint_level_history_body: |-
  Jede Änderung dieser Sitzung ist hier eine Zeile, die neueste oben, wie in einem git log. Die Spalte ganz links ist die Hauptlinie, eine eigene Spalte ist ein Zweig, den du verlassen hast, indem du etwas rückgängig gemacht hast und einen anderen Weg gegangen bist. Der Ring zeigt, wo du bist, der grüne Kreis die letzte Speicherung

  Ein Klick auf eine Zeile führt das Level genau in diesen Zustand, eine Operation pro Frame. Der Verlauf lebt nur in dieser Sitzung und wird nie auf die Festplatte geschrieben

  <color=#E8B04B><b>Warnung:</b></color> während der Übergang läuft, ist der Editor schreibgeschützt. Abbrechen hält ihn dort an, wo er gerade ist, und das ist immer ein echter Zustand

  Mehr: <link="https://bullethero.space/de/docs/editor/reference/level-settings"><color=#59A6FF>Leveleinstellungen</color></link>
hint_level_history_header: "Verlauf"
hint_level_library-browser_body: |-
  Ressourcen, die auf <b>diesem Gerät</b> gespeichert sind und allen Levels gehören, die du hier öffnest

  <color=#B48CE0><b>Gut zu wissen:</b></color> beim Importieren wird die Ressource <i>ins Level</i> kopiert. Ein Level trägt alles mit sich, was es braucht, die Bibliothek ist also eine Bequemlichkeit für dich und nie eine Abhängigkeit für die, die dein Level spielen

  Mehr: <link="https://bullethero.space/de/docs/editor/workflow/reuse"><color=#59A6FF>Wiederverwendung: Prefabs, Kopieren, Generatoren</color></link>
hint_level_library-browser_header: "Bibliothek"
hint_level_metadata-logo: "Wird als <color=#D4B483>logo.png</color> in den Levelordner kopiert und überall angezeigt, wo das Level aufgelistet ist. Gedacht für ein quadratisches <color=#D4B483>512x512</color> <color=#D4B483>PNG</color> - kleiner wird in der Levelliste unscharf, größer kostet nur Platz. \"Entfernen\" löscht nur den Verweis - die Datei selbst bleibt im Ordner"
hint_level_metadata-tags_body: |-
  Tags sind deine eigenen Wörter, sie werden genau so angezeigt, wie du sie schreibst, und nie übersetzt. Spieler filtern in der Levelliste danach, ein Tag hilft also nur, wenn auch andere Levels ihn verwenden

  Durch Kommas getrennt. Halte sie kurz und allgemein: ein Genre, eine Stimmung, eine Mechanik

  Mehr: <link="https://bullethero.space/de/docs/editor/reference/level-settings"><color=#59A6FF>Leveleinstellungen</color></link>
hint_level_metadata-tags_header: "Level-Tags"
hint_level_metadata_body: |-
  Alles über das Level, was nicht das Level selbst ist: Name, Beschreibung, Levelbild, Lizenz, Altersfreigabe und Autoren

  <color=#B48CE0><b>Gut zu wissen:</b></color> Name und Beschreibung sind <b>lokalisierte Texte</b> - du schreibst den Text pro Sprache direkt hier, ganz ohne Schlüssel, denn ein Level ist Inhalt und kein Teil der Spieloberfläche. Wer eine Sprache nutzt, die du nicht ausgefüllt hast, bekommt den ersten Eintrag, den du ausgefüllt hast

  Lizenz und Autoren reisen mit dem Level, wo immer es geteilt wird, und genau so bleibt die Nennung auch nach einem erneuten Hochladen erhalten

  Mehr: <link="https://bullethero.space/de/docs/editor/reference/metadata-and-sharing"><color=#59A6FF>Metadaten und ein Level teilen</color></link>
hint_level_metadata_header: "Metadaten"
hint_level_play-seed: "0 = der Seed des Levels selbst oder bei jedem Lauf ein neuer"
hint_level_play_body: |-
  <color=#B48CE0><b>Gut zu wissen:</b></color> Startoptionen <b>nur für diesen Lauf</b> - nichts hier wird im Level gespeichert

  <color=#5EC8C8><b>Tipp:</b></color> mit Leben, Geschwindigkeit, Checkpoints und Auto-Level übst du einen Abschnitt, ohne ihn zu bearbeiten. Der <b>Seed</b> hier schlägt den des Levels: er ist die oberste der drei Stufen, und mit ihm wiederholst du genau den Lauf, den du gerade gesehen hast

  Mehr: <link="https://bullethero.space/de/docs/editor/craft/difficulty-curve"><color=#59A6FF>Schwierigkeit und Kurve</color></link>
hint_level_play_header: "Spielen"
hint_level_publication_body: |-
  Alles, womit du dieses Level irgendwohin schickst. Wähle oben einen Weg, dann zeigt er seine eigenen Einstellungen und prüft das Level selbst. Ein Fehler im Bericht blockiert das Senden, Warnungen und Ratschläge überlässt er dir

  <b>Archiv</b> funktioniert überall. Ein einfaches <b>.zip</b> öffnet sich im Windows Explorer, ohne dass etwas installiert sein muss. <b>+ Passwort</b> öffnet sich in 7-Zip oder jedem anderen Packprogramm, <b>(gpg)</b> öffnet sich mit gpg
  <b>Steam Workshop</b> gibt es nur im Steam-Build, und er prüft das Level nach den Regeln des Workshops

  <color=#5EC8C8><b>Tipp:</b></color> veröffentliche im Workshop zuerst mit <b>Nur mich</b> und sieh dir den Eintrag an, bevor du ihn allen zeigst. Eine zweite Veröffentlichung aktualisiert denselben Eintrag

  <color=#E8B04B><b>Warnung:</b></color> ein Passwort ist kein DRM. Wer die Datei und das Passwort hat, kann sie immer öffnen

  Mehr: <link="https://bullethero.space/de/docs/editor/reference/publishing"><color=#59A6FF>Veröffentlichung</color></link>
hint_level_publication_header: "Veröffentlichung"
hint_level_raw-add: "Fügt dem Slot, aus dem du das geöffnet hast, ein Element hinzu. Hier werden nur die eigenen einfachen Felder des neuen Elements angeboten. Alles Verschachtelte behält seinen Standardwert und wird danach im Baum bearbeitet"
hint_level_raw_body: |-
  Das ganze gespeicherte Levelmodell als ein Baum aus Feldern - die Datei selbst, bevor der Editor sie verarbeitet

  <color=#E86A5A><b>Vorsicht:</b></color> <b>hier wird nichts validiert.</b> Es schreibt auch einen Wert, den der Rest des Editors für unmöglich hält, halte also eine Kopie des Levelordners bereit

  Ein gefüllter Punkt heißt, dass du ein Feld in dieser Sitzung geändert hast, ein hohler, dass sich etwas darin geändert hat. <b>Übernehmen</b> schreibt die ganze Sitzung als eine Operation, die du rückgängig machen kannst

  Mehr: <link="https://bullethero.space/de/docs/editor/workflow/not-losing-work"><color=#59A6FF>Damit keine Arbeit verloren geht</color></link>
hint_level_raw_header: "Rohdaten"
hint_level_resource-meta_body: |-
  Titel, Beschreibung, Quellen, Lizenz und Autoren einer Ressource

  <color=#B48CE0><b>Gut zu wissen:</b></color> so bleibt die Namensnennung erhalten: eine Textur, Schriftart oder Audiodatei, die von irgendwo stammt, trägt im Level mit, woher sie kommt und unter welchen Bedingungen, wohin das Level auch geht

  <color=#7FC97F><b>Empfehlung:</b></color> fülle es aus, wenn du die Ressource hinzufügst - das ist der einzige Moment, in dem du es noch weißt

  Mehr: <link="https://bullethero.space/de/docs/editor/rights/resource-record"><color=#59A6FF>Der Ressourceneintrag</color></link>
hint_level_resource-meta_header: "Metadaten der Ressource"
hint_level_resources-audios: "Audiodateien, die dieses Level mitbringt. Füge eine zuerst hier hinzu und setze sie dann als Spur auf die Audio-Zeitleiste"
hint_level_resources-effects_body: |-
  Partikeleffekte aus <color=#D4B483>VFX Graph</color>, die das Level platzieren kann. Sie sind <b>optional</b>: ein Level, das keinen davon nutzt, spielt sich genau wie gedacht

  Ein Effekt nutzt den Zufall des Levels mit seinem Seed und läuft deshalb auf jedem Gerät gleich ab. Effekte lassen sich in die Gerätebibliothek exportieren

  Mehr: <link="https://bullethero.space/de/docs/editor/performance/level-budget"><color=#59A6FF>Levelbudget</color></link>
hint_level_resources-effects_header: "Effekte"
hint_level_resources-fonts: "Schriftarten, die dieses Level mitbringt, für seine Textobjekte. Wie jede andere Ressource liegt eine Schriftart neben dem Level und reist mit ihm"
hint_level_resources-prefabs_body: |-
  Wiederverwendbare Gruppen von Objekten. Ein Prefab enthält Vorlagenobjekte, und jede Platzierung bekommt echte Kopien davon. Eine Änderung an der Vorlage erreicht jede Platzierung, und eine einzelne Platzierung kann trotzdem über Überschreibungen pro Instanz abweichen

  <color=#E8B04B><b>Warnung:</b></color> Prefabs haben <b>keine Presets vom Spiel</b>, anders als Themes, Effekte und Collider - über die Bibliothek und Sammlungen wandert ein Prefab zwischen Levels

  Mehr: <link="https://bullethero.space/de/docs/editor/workflow/reuse"><color=#59A6FF>Wiederverwendung: Prefabs, Kopieren, Generatoren</color></link>
hint_level_resources-prefabs_header: "Prefabs"
hint_level_resources-shapes_body: |-
  Die eigenen Formen des Levels, zusätzlich zu den rund 500, die das Spiel erzeugt. Eine Form ist <b>echte Geometrie</b>, eingepasst in ihren Begrenzungsrahmen, das Rechteck des Objekts ist also genau das, was es zeichnet

  <color=#5EC8C8><b>Tipp:</b></color> eine Form und ein Collider sind dieselbe Art von Daten, und ein Objekt verweist auf das eine für das, was gezeichnet wird, und auf das andere für das, was getroffen wird. Keins leitet sich vom anderen ab, ein harmloser Warnstrahl oder eine unsichtbare Wand ist also ganz normaler Inhalt

  Mehr: <link="https://bullethero.space/de/docs/editor/resources/level-needs"><color=#59A6FF>Was ein Level braucht</color></link>
hint_level_resources-shapes_header: "Formen"
hint_level_resources-textures_body: |-
  Bilder, die dieses Level mitbringt. <b>Das Spiel selbst liefert keine Texturen mit</b> - jede Textur, die ein Level nutzt, wird hier hinzugefügt und liegt im Levelordner, sie reist also mit dem Level

  <color=#B48CE0><b>Gut zu wissen:</b></color> Formen sind <b>keine</b> Texturen. Sie sind echte Geometrie und brauchen nichts aus diesem Tab

  Mehr: <link="https://bullethero.space/de/docs/editor/resources/images-and-fonts"><color=#59A6FF>Bilder und Schriftarten</color></link>
hint_level_resources-textures_header: "Texturen"
hint_level_resources-themes_body: |-
  Ein Theme ist eine <b>Palette, auf die die Farben des Levels verweisen können</b>, statt feste Werte zu enthalten. Ein Wechsel des aktiven Themes färbt alles um, was darauf verweist, und der Wechsel wird als Keyframe auf der Ereignis-Zeitleiste gesetzt

  <color=#5EC8C8><b>Tipp:</b></color> exportiere ein Theme in die Gerätebibliothek, um es in anderen Levels wiederzuverwenden

  Mehr: <link="https://bullethero.space/de/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>Farbe, Themes und Post-Processing</color></link>
hint_level_resources-themes_header: "Themes"
hint_level_rules_body: |-
  Was die Validierung in diesem Level gefunden hat: kaputte Verweise, doppelte IDs, Elternzyklen, zu tief verschachtelte Prefabs, sich überlappende Beat-Segmente

  Manche Befunde lassen sich beheben, einzeln oder mit <b>Alle beheben</b>. Reparaturen landen in einem Entwurf: <b>Speichern</b> übernimmt sie als eine Operation, die du rückgängig machen kannst, <b>Verwerfen</b> verwirft sie. Graph-Befunde (IDs, Eltern, Prefab-Verschachtelung) haben keine Reparatur - das sind inhaltliche Entscheidungen, die nur du treffen kannst

  <color=#5EC8C8><b>Tipp:</b></color> ein Kind, das über die Spanne seines Elternobjekts hinausragt, wird <b>nicht</b> gemeldet. Um Lebensdauern einzupassen, starte den Modifikator <color=#D4B483>Spannen einpassen</color> aus den Generatoren

  Mehr: <link="https://bullethero.space/de/docs/editor/workflow/not-losing-work"><color=#59A6FF>Damit keine Arbeit verloren geht</color></link>
hint_level_rules_header: "Regeln"
hint_level_shape-editor_body: |-
  Baue eine Form aus Punkten und den Kanten zwischen ihnen. <b>Dreiecke werden abgeleitet, nie bearbeitet</b>, eine Ecke, die drei Dreiecke teilen, ist also ein einziger Punkt zum Ziehen

  <color=#E8B04B><b>Warnung:</b></color> das Format speichert Dreiecke, keine Kanten - eine Kante, die keinen Umriss schließt, fällt beim Speichern weg, und der Editor meldet das

  Mehr: <link="https://bullethero.space/de/docs/editor/resources/images-and-fonts"><color=#59A6FF>Bilder und Schriftarten</color></link>
hint_level_shape-editor_header: "Formeditor"
hint_level_theme-editor_body: |-
  Die Slots, die ein Theme bereitstellt, und die Farben darin

  <color=#E86A5A><b>Vorsicht:</b></color> auf die Slots verweist der Inhalt des Levels, deshalb <b>färbt ein Umnummerieren alles um, was auf sie verweist</b> - die Position eines Slots ist seine Identität

  <color=#5EC8C8><b>Tipp:</b></color> speichere ein fertiges Theme in der Gerätebibliothek, um es in anderen Levels wiederzuverwenden

  Mehr: <link="https://bullethero.space/de/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>Farbe, Themes und Post-Processing</color></link>
hint_level_theme-editor_header: "Theme-Editor"
hint_menu_level-ai: "Der Autor hat angegeben, dass das Level, sein Cover oder eine seiner Ressourcen von KI erzeugt wurde. Die Entwickler prüfen das nicht - ein Level trägt, was sein Autor hineingeschrieben hat"
hint_menu_level-authors: "Wer dieses Level gemacht hat, so wie seine eigenen Metadaten es angeben. Die Schaltfläche \"Autoren\" öffnet die vollständige Liste mit Links"
hint_menu_level-bot_body: |-
  <b>Ein Bot spielt das Level für dich, mit deiner eigenen Steuerung.</b> Er läuft, dasht, nimmt Schaden und stirbt wie du, und er kann nicht schummeln: dieselbe Geschwindigkeit, derselbe Dash, dieselbe Hitbox

  <b>Reflex Bot v1</b> schaut 1,5 Sekunden voraus und weicht dem aus, was er sieht, und rechnet das in jedem Frame neu. Er braucht keine Vorbereitung, also beginnt der Lauf sofort. Was ihn bricht, ist ein Muster, in das man eine Sekunde früher hätte einsteigen müssen

  <b>Warm Bot v1</b> berechnet seine Route durch das ganze Level, bevor der Lauf beginnt, und zielt auf null Schaden

  <color=#E8B04B><b>Warnung:</b></color> diese Route ist eine zusätzliche Ladephase und kann Dutzende Sekunden dauern. Du kannst sie abbrechen und das Level selbst spielen

  <b>Es ist keine Garantie, dass das Level geschafft wird.</b> Ein Bot wird nie müde, verliert aber trotzdem. Er kostet außerdem in jedem Frame Leistung, rechne auf einem schwachen Gerät also mit einer niedrigeren Framerate

  Ein Level, das einen Bot schlägt, ist es wert, eingeschickt zu werden: eröffne ein Issue in <link="https://github.com/bullet-hero/releases/issues"><color=#59A6FF>bullet-hero/releases</color></link>, schreib, welcher Bot wo verloren hat, und häng den Levelordner an

  Mehr: <link="https://bullethero.space/de/docs/editor/workflow/bot-playtest"><color=#59A6FF>Wie ein Bot dein Level spielt</color></link>
hint_menu_level-bot_header: "Bots"
hint_menu_level-checkpoints: "Ob der Lauf die Checkpoints zählt, die der Autor gesetzt hat. An: ein Tod spult das Level zum zuletzt erreichten zurück und stellt deine Leben wieder her. Aus: es geht zurück zum Anfang. Läufe mit und ohne sie führen getrennte Rekorde"
hint_menu_level-identity: "Welches Level das wirklich ist: die Quelle, in der es gefunden wurde, die ID, unter der seine Statistik geführt wird, und der Ordner, in dem es liegt, wenn dieser nicht nach der ID benannt ist. Ein eingebautes Level und eine Kopie, die du davon gemacht hast, teilen alle anderen Angaben auf diesem Bildschirm und unterscheiden sich in diesen"
hint_menu_level-lives: "Wie viele Treffer der Lauf übersteht. In \"Zen\" wirst du trotzdem getroffen und zurückgestoßen, der Lauf endet nur nie. \"Eigene\" nimmt jede Anzahl, die der Regler erreicht. \"Ohne Kollision\" ist etwas anderes: nichts berührt dich, und solche Läufe führen eigene Rekorde"
hint_menu_level-music: "Wer die Musik geschrieben hat, so wie die Metadaten des Levels es festhalten. Die Schaltfläche \"Lizenzen\" enthält alle anderen Ressourcen, die das Level mitbringt"
hint_menu_level-no-collision: "Der Avatar geht durch alles hindurch, also kann ihn nichts treffen. Das ist etwas anderes als \"Zen\", wo Treffer weiter zählen und der Lauf nur nie endet. Läufe ohne Kollision führen eigene Rekorde"
hint_menu_level-rating: "Die Altersfreigabe, die der Autor angegeben hat. Die Entwickler prüfen sie nicht - ein Level trägt, was sein Autor hineingeschrieben hat"
hint_menu_level-record: "Deine eigene Bilanz mit diesem Level, für die rechts gewählten Startoptionen. Ändere Leben, Geschwindigkeit, Checkpoints, Bot oder \"Ohne Kollision\", und der Rekord ändert sich mit: ein Lauf unter anderen Bedingungen ist eine andere Leistung, also hat jede Kombination ihren eigenen Bestwert. Versuche und Abschlüsse zählen jeden Lauf, egal mit welchen Einstellungen"
hint_menu_level-seed: "Die Zahl, aus der jeder Zufallswert des Levels entsteht. Derselbe Seed spielt auf jedem Gerät denselben Lauf, und 0 heißt, dass das Level jedes Mal einen neuen würfelt"
hint_menu_level-speed: "Wie schnell das Level und seine Musik laufen. \"Eigene\" nimmt jede Geschwindigkeit, die der Regler erreicht, nicht nur die drei Presets"
hint_mod_content_remover_body: |-
  Löscht Levelinhalt, der zu deiner Auswahl hier passt

  <color=#E86A5A><b>Vorsicht:</b></color> er schreibt Vorhandenes um, statt etwas hinzuzufügen, lies also die Parameter, bevor du ihn startest: es ist nur ein Rückgängig-Schritt, aber er ist der einzige Weg zurück

  Mehr: <link="https://bullethero.space/de/docs/editor/workflow/reuse"><color=#59A6FF>Wiederverwendung: Prefabs, Kopieren, Generatoren</color></link>
hint_mod_content_remover_header: "Inhalt entfernen"
hint_mod_framerate_remap_body: |-
  Rechnet jede Frame-Nummer im Level auf eine andere Framerate um, damit Timings in Sekunden an derselben Stelle landen wie vorher

  <color=#E8B04B><b>Warnung:</b></color> Frames sind ganze Zahlen, also wird alles gerundet, was nicht glatt aufgeht - ein zweimal umgerechnetes Level kehrt nicht garantiert zum Ausgangszustand zurück

  Mehr: <link="https://bullethero.space/de/docs/editor/basics/frames-and-time"><color=#59A6FF>Frames, Zeit und die Länge eines Levels</color></link>
hint_mod_framerate_remap_header: "Framerate umrechnen"
hint_mod_prefab_flatten_body: |-
  Verwandelt jede Prefab-Platzierung in diesem Bereich in gewöhnliche Objekte. Die Verbindung zur Vorlage verschwindet, die Objekte bleiben genau, wo sie waren

  <color=#B48CE0><b>Gut zu wissen:</b></color> das Level sieht danach genauso aus - nichts wird gelöscht oder verschoben, und Überschreibungen pro Platzierung stehen schon in den Objekten. Die Vorlagen bleiben im Level, außer du lässt sie entfernen

  Mehr: <link="https://bullethero.space/de/docs/editor/reference/modifiers"><color=#59A6FF>Modifikatoren</color></link>
hint_mod_prefab_flatten_header: "Prefabs auflösen"
hint_mod_quantize_keyframes_body: |-
  Lässt Keyframes auf einem regelmäßigen Schritt einrasten, so wird locker von Hand gesetzte Animation auf den Beat gezogen

  <color=#E8B04B><b>Warnung:</b></color> zwei Keyframes, die auf demselben Frame landen, verschmelzen zu einem, grobes Quantisieren verliert also Details, statt sie zu verdichten

  Mehr: <link="https://bullethero.space/de/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>Rhythmus und Struktur</color></link>
hint_mod_quantize_keyframes_header: "Keyframes quantisieren"
hint_mod_span_fit_body: |-
  Passt die Lebensdauern von Kindern in die ihrer Elternobjekte ein, entweder indem die Kinder hineingeklemmt oder die Elternobjekte erweitert werden

  <color=#B48CE0><b>Gut zu wissen:</b></color> ein überstehendes Kind ist gültig und wird einfach abgeschnitten abgespielt, das ist also eine inhaltliche Entscheidung und keine Reparatur - deshalb startet ihn niemand für dich. Anker bleiben in beiden Fällen unberührt

  Mehr: <link="https://bullethero.space/de/docs/editor/basics/frames-and-time"><color=#59A6FF>Frames, Zeit und die Länge eines Levels</color></link>
hint_mod_span_fit_header: "Spannen einpassen"
hint_mod_span_stagger_body: |-
  Versetzt eine Auswahl zeitlich, sodass Objekte, die zusammen begonnen haben, nacheinander ankommen

  Mehr: <link="https://bullethero.space/de/docs/editor/workflow/reuse"><color=#59A6FF>Wiederverwendung: Prefabs, Kopieren, Generatoren</color></link>
hint_mod_span_stagger_header: "Staffeln"
hint_mod_test_rename_body: "Ein Entwicklungsgenerator für die Umbenennungspfade. Nicht zum Erstellen von Inhalten gedacht"
hint_mod_test_rename_header: "Umbenennen (Test)"
hint_sandbox_attacks-auto: "Zufällige Wellen von allein, so wie im Hintergrund des Hauptmenüs"
hint_sandbox_attacks-fire: "Jede Schaltfläche feuert eine Welle dieser Attacke auf dich"
hint_sandbox_attacks-gap: "Sekunden zwischen zwei Wellen, solange sie von allein kommen"
hint_sandbox_controls-gyro: "Schaltet den Bewegungssensor als Steuergerät ein"
hint_sandbox_controls-mode: "Der Modus des Geräts, mit dem du gerade steuerst - er wird sofort gespeichert und gilt überall im Spiel"
hint_sandbox_game-bot: "Übergibt den Avatar an den Bot, der im Hintergrund des Hauptmenüs spielt"
hint_sandbox_game-free-camera: "Schwenke mit der mittleren Maustaste oder zwei Fingern, zoome mit dem Mausrad oder durch Auseinanderziehen. Der Rahmen zeigt, was die Levelkamera sieht"
hint_sandbox_game-lives: "Treffer bis zu einem Tod. Ein Tod läuft ab wie in einem Level und bringt den Avatar zurück in die Mitte"
hint_sandbox_game-speed: "Verlangsamt oder beschleunigt nur die Attacken - der Avatar behält seine eigene Geschwindigkeit"
hint_sandbox_tutorial_body: |-
  Sechs Schritte durch die Steuerung. Jeder prüft, was du wirklich getan hast. Ein Treffer oder ein Tod wirft nur den Schritt zurück, in dem er passiert ist, und färbt ihn rot, bis dieser Schritt bestanden ist

  Drück auf einen Schritt, um ihn zu spielen, auch auf einen bestandenen. Das Tutorial gilt erst als abgeschlossen, wenn jeder Schritt bestanden ist

  <color=#E8B04B><b>Warnung:</b></color> im Modus <b>Unsterblich</b> werden Treffer nicht gezählt, also sieht das Tutorial sie auch nicht

  Mehr: <link="https://bullethero.space/de/docs/game/sandbox"><color=#59A6FF>Sandbox und Tutorial</color></link>
hint_sandbox_tutorial_header: "Tutorial"
hint_settings_audio: "Gesamtlautstärke, was ein Level im Spiel und im Editor abspielt, und die eigenen Sounds der Oberfläche außerhalb und innerhalb des Leveleditors"
hint_settings_audio-editor-game: "Lautstärke dessen, was ein Level im Editor abspielt - dasselbe Level auf demselben Weg, aber stundenlang statt einmal gehört, deshalb bleibt die Lautstärke des Spiels, wo sie ist"
hint_settings_audio-editor-ui: "Lautstärke der eigenen Sounds des Leveleditors. Er meldet nur, was eine Bearbeitung ergeben hat - Speichern, Ablehnung, Rückgängig, Löschen - nie das gewöhnliche Drücken"
hint_settings_audio-game: "Lautstärke dessen, was ein Level abspielt - seine Musik und seine Sounds"
hint_settings_audio-ui: "Lautstärke der Oberfläche außerhalb des Leveleditors: Menüs, Browser, Einstellungen"
hint_settings_audio-volume: "Gesamtlautstärke. Alles andere wird damit skaliert"
hint_settings_controls_body: |-
  Wie du den Spieler steuerst, je Geräteart - Tastatur und Maus, Touchscreen, Gamepad und Gyroskop des Geräts

  <color=#B48CE0><b>Gut zu wissen:</b></color> mehrere Arten können gleichzeitig aktiv sein - es steuert die, die du <b>zuletzt</b> berührt hast, und Dash oder Pause funktionieren mit jeder davon

  <color=#5EC8C8><b>Tipp:</b></color> das Gyroskop ruht, wenn das Telefon <b>flach</b> liegt, Bildschirm nach oben - kippe es aus der Waagerechten, um dich zu bewegen, und dreh die <b>Empfindlichkeit</b> hoch, wenn du zu weit kippen musst

  Mehr: <link="https://bullethero.space/de/docs/game/controls"><color=#59A6FF>Steuerung</color></link>
hint_settings_controls_header: "Steuerung"
hint_settings_game-editor-autosave: "Schreibt per Timer eine Kopie des Levels. Dein gespeichertes Level wird nie überschrieben - die Kopien sind ein Sicherheitsnetz, kein Speichern"
hint_settings_game-editor-autosave-rate: "Sekunden zwischen zwei automatischen Kopien"
hint_settings_game-editor-camera-invert: "Ob Ziehen das Level mit dem Zeiger bewegt oder stattdessen die Kamera. Beides fühlt sich für jemanden richtig an"
hint_settings_game-editor-camera-max-size: "Wie weit der Viewport des Editors herauszoomen darf"
hint_settings_game-editor-camera-min-size: "Wie weit der Viewport des Editors hineinzoomen darf"
hint_settings_game-editor-camera-sensitivity-x: "Wie weit sich die Ansicht pro Einheit Zeigerbewegung horizontal verschiebt"
hint_settings_game-editor-camera-sensitivity-y: "Wie weit sich die Ansicht pro Einheit Zeigerbewegung vertikal verschiebt"
hint_settings_game-editor-camera-wheel-multiplier: "Wie stark eine Raste des Mausrads zoomt"
hint_settings_game-editor-camera-zoom-to-mouse: "Zum Cursor zoomen statt zur Mitte des Viewports. Aus hält die Mitte beim Zoomen fest"
hint_settings_game-editor-create-shape-size-x: "Breite, mit der eine neue Form beginnt, vor ihrer eigenen Skalierung"
hint_settings_game-editor-create-shape-size-y: "Höhe, mit der eine neue Form beginnt, vor ihrer eigenen Skalierung"
hint_settings_game-editor-create-text-size-x: "Breite des Blocks, in dem ein neuer Text seine Zeichen anordnet, nicht die Größe der Zeichen"
hint_settings_game-editor-create-text-size-y: "Höhe des Blocks, in dem ein neuer Text seine Zeichen anordnet, etwa eine Zeile pro Einheit"
hint_settings_game-editor-effects-active-default: "Ob die Post-Processing-Effekte des Levels beim Öffnen des Editors in der Vorschau laufen. Nur der Startzustand - wenn du sie beim Arbeiten ausschaltest, ändert das ihn nie. Auf dem Handy starten sie ausgeschaltet, denn Post-Processing ist das Teuerste, was der Editor zeichnet"
hint_settings_game-editor-gizmos-scale: "Wie groß die Ziehgriffe im Viewport gezeichnet werden. Ein Griff in Mausgröße ist mit dem Daumen schwer zu treffen"
hint_settings_game-editor-grid-active-default: "Ob das Raster im Viewport beim Öffnen des Editors schon an ist. Nur der Startzustand - wenn du das Raster beim Arbeiten ausschaltest, ändert das ihn nie"
hint_settings_game-editor-grid-opacity: "Wie sichtbar das Raster ist. Ein Raster, das zu blass zum Lesen wäre, wird gar nicht gezeichnet"
hint_settings_game-editor-grid-size: "Der Abstand des Rasters im Viewport, in Leveleinheiten"
hint_settings_game-editor-history-length: "Wie viele Bearbeitungsschritte die Sitzung behält, bevor der älteste Zweig verworfen wird. Mehr kostet Speicher und sonst nichts"
hint_settings_game-editor-history-objects: "Objekte, die der Verlauf zusätzlich zur Schrittzahl behält. Ein einziges Massenlöschen ist ein Schritt mit 50 000 davon, und genau das fängt dieses Limit ab. 0 hebt das Limit auf, unter 0 entscheidet das Gerät"
hint_settings_game-editor-interface-dirty-field-delay: "Wie lange ein Feld im Inspector nach deinem letzten Tastendruck wartet, bevor es den Wert übernimmt. Null übernimmt jeden Tastendruck und macht jeden davon rückgängig machbar"
hint_settings_game-editor-interface-levels-layout: "Wie sich die Levelauswahl im Editor öffnet: als Liste von Zeilen mit Beschreibungen oder als Raster aus Covern. Die Schaltfläche neben dem Suchfeld wechselt die Ansicht weiterhin, bis du den Editor schließt"
hint_settings_game-editor-interface-log-clamps: "In der Konsole melden, wenn ein eingegebener Wert in seinen erlaubten Bereich zurückgesetzt wurde. Begrenzt wird in jedem Fall"
hint_settings_game-editor-interface-rotation-unit: "Die Einheit, in der Drehungsfelder angezeigt und eingegeben werden. Gespeichert werden Winkel in jedem Fall im Bogenmaß"
hint_settings_game-editor-level-serialize-mode: "Das Dateiformat, in dem ein Level geschrieben wird. <b><color=#D4B483>Json</color></b> ist Text - lesbar und von Hand reparierbar. <b><color=#D4B483>Blob</color></b> ist binär - lädt dutzendfach schneller und ist kaum noch zu reparieren, wenn es beschädigt ist"
hint_settings_game-editor-max-autosave-files: "Wie viele Kopien behalten werden. Ist das Limit erreicht, wird die älteste verworfen"
hint_settings_game-editor-mcp-enabled: "Erlaubt einem KI-Assistenten, der MCP spricht, sich mit diesem Editor zu verbinden und das offene Level zu bearbeiten. Verbinden kann sich nur dieser Computer, und alles, was die KI in einem Paket tut, ist ein einziger Schritt im Verlauf"
hint_settings_game-editor-mcp-follow-ai: "Wohin der Abspielkopf geht, nachdem sich die KI einen Frame angesehen hat. Aus: zurück, wo du ihn gelassen hast. An: er bleibt pausiert auf dem Frame, den die KI angesehen hat. Berührst du die Zeitleiste, während die KI schaut, bleibt der Abspielkopf, wo du ihn hingesetzt hast"
hint_settings_game-editor-mcp-operation-delay: "Wie lange der Editor zwischen zwei KI-Operationen wartet, damit du ihnen folgen kannst. <b><color=#D4B483>0</color></b> wendet jede sofort an. Abspielen, Pausieren und das Bewegen des Abspielkopfs werden nie verzögert. Von 0 bis 5"
hint_settings_game-editor-mcp-port: "Der Port, auf dem der Editor lauscht. <b><color=#D4B483>0</color></b> wählt bei jedem Start einen freien. Sonst <b><color=#D4B483>1024-65535</color></b>"
hint_settings_game-editor-mcp-reveal-edits: "Wählt nach jeder KI-Änderung aus und lokalisiert, was sie erstellt oder geändert hat. Nie, während du ziehst, tippst oder spielst"
hint_settings_game-editor-multi-select-requires-hold: "Ob das Hinzufügen zu einer Auswahl ein bewusstes Halten braucht. An ist auf Touch sicherer, wo sonst ein versehentliches Tippen die Auswahl ändert"
hint_settings_game-editor-pick-invisible-aabb: "Ein Klick darf ein Objekt auswählen, das nichts zeichnet. Nötig für unsichtbare Wände, die eine Hitbox und keine Form haben"
hint_settings_game-editor-player-active-default: "Ob der Testspieler beim Öffnen des Editors schon da ist. Auf Touch belegt er auch den Viewport, deshalb will man das auf dem Handy meist aus"
hint_settings_game-editor-player-bot: "Übergibt den Vorschauspieler an <color=#D4B483>Reflex Bot v1</color> statt an dich. Er ist der einzige Bot hier, weil er nichts Vorbereitetes braucht und weiterarbeitet, während du bearbeitest - bei jeder Abspielgeschwindigkeit, auch rückwärts. Er spielt nach denselben Regeln wie du: er nimmt Schaden und kann in die Enge getrieben werden. Direkt nach dem Ziehen des Abspielkopfs spielt er kurz schlechter, während er sein Wissen über die Zukunft neu aufbaut. Die Wahl zwischen Bots gehört zu einem Durchlauf, auf dem Tab Spielen dieses Bildschirms"
hint_settings_game-editor-player-bot-debug: "Der Hauptschalter für die Diagnose-Overlays des Bots. Standardmäßig aus. Alles darunter ist an, also zeigt das Einschalten sofort das ganze Bild"
hint_settings_game-editor-player-bot-debug-grid: "Zeichnet, wie viel Platz jeder Teil des Bildschirms nach Meinung des Bots hat, im schlimmsten Fall über alles, was er vorausschauend sieht. Rot ist eine Stelle, an der er einen Treffer erwartet. Wo er sich sicher fühlt, wird nichts gezeichnet"
hint_settings_game-editor-player-bot-debug-reach: "Zeichnet, wie weit der Bot glaubt, bis zum Ende seines Planungsfensters zu kommen - der innere Ring zu Fuß, der äußere mit dem Dash. Ein Ziel außerhalb davon wählt er nie"
hint_settings_game-editor-player-bot-debug-target: "Zeichnet den Punkt, den der Bot gerade ansteuert. Er bleibt bei einer Wahl, bis eine deutlich bessere auftaucht, ein Ziel, das stillsteht, heißt also, dass der Bot zufrieden ist, nicht festsitzt"
hint_settings_game-editor-player-reset-gizmos: "Den aktiven Gizmo-Modus verwerfen, wenn der Testspieler eingeschaltet wird, damit kein Ziehgriff unter deinem Finger liegen bleibt"
hint_settings_game-editor-preview-collider-on-select: "Die Hitbox eines ausgewählten Objekts anzeigen. Was gezeichnet und was getroffen wird, sind hier getrennte Dinge, also können sie sich unterscheiden"
hint_settings_game-editor-publish-language: "In welcher Sprache Titel und Beschreibung eines Workshop-Objekts zuerst hochgeladen werden. <b><color=#D4B483>Englisch</color></b> oder <b><color=#D4B483>System</color></b> - die Sprache des Geräts"
hint_settings_game-editor-resources-serialize-mode: "Dieselbe Wahl für die Ressourcen, die ein Level mitbringt"
hint_settings_game-editor-selection-collider-opacity: "Wie deckend die Hitbox eines ausgewählten Objekts gezeichnet wird"
hint_settings_game-editor-selection-collider-opacity-view: "Dasselbe für die Ansicht, die alle Hitboxen auf einmal zeigt - blasser, weil sich dort Hunderte davon überlagern"
hint_settings_game-editor-selection-long-press-delay: "Wie lange eine Zeile oder ein Clip gehalten werden muss, bevor die Mehrfachauswahl beginnt. Erhöhe den Wert, wenn Auswahlen versehentlich passieren"
hint_settings_game-editor-selection-long-press-threshold: "Wie weit der Zeiger während des Haltens abdriften darf, bevor es stattdessen als Ziehen zählt. Erhöhe den Wert bei unruhiger Hand"
hint_settings_game-editor-timeline-edge-handle: "Die Breite des Clip-Rands, an dem man die Länge ändert. Am Rest des Clips verschiebt man ihn stattdessen"
hint_settings_game-editor-timeline-loop-global: "Ob der Abspielkopf am Ende des Levels zum Anfang springt, statt anzuhalten"
hint_settings_game-editor-timeline-loop-local: "Dasselbe für die lokale Zeitleiste, die die Lebensdauer eines einzelnen Objekts wiederholt"
hint_settings_game-editor-timeline-snap-threshold: "Wie nah ein gezogener Rand landen muss, bevor er an einem möglichen Frame einrastet"
hint_settings_game-editor-timeline-time-format: "Worin das Lineal einer Zeitleiste und die Anzeige des Abspielkopfs zählen. Am Level ändert das nichts - es wird so oder so derselbe Frame adressiert. Takte und Beats liest das Beat-Raster des Levels und fällt auf einen Timecode zurück, wo das Raster kein Segment hat"
hint_settings_game-editor_body: |-
  <b>Autospeichern</b> speichert das Level per Timer und schreibt jedes Mal eine Sicherungskopie. <b>Max. Autosicherungen</b> begrenzt, wie viele Kopien behalten werden

  <b>Min. Kameragröße</b> und <b>Max. Kameragröße</b> begrenzen den Zoom des Viewports. <b>Mehrfachauswahl per Halten</b> und <b>Unsichtbare AABB wählen</b> ändern, was ein Klick im Viewport bedeutet

  <b>Levelformat</b> und <b>Ressourcenformat</b> legen das Standardformat für das Schreiben auf die Festplatte fest

  Mehr: <link="https://bullethero.space/de/docs/editor/workflow/speed-and-shortcuts"><color=#59A6FF>Tempo und Tastenkürzel</color></link>
hint_settings_game-editor_header: "Editor"
hint_settings_general: "Sprache und wie viele Ressourcen das Spiel gleichzeitig lädt. Eine leere <b>Sprache</b> folgt dem Gerät"
hint_settings_general-language: "Sprache der Oberfläche. Leer folgt sie dem Gerät. Den eigenen Text eines Levels, den das Level selbst mitbringt, betrifft sie nicht"
hint_settings_general-resource-parallel-load-count: "Wie viele Dateien eines Levels gleichzeitig laden. Mehr ist auf einer schnellen Festplatte früher fertig und kann auf einer langsamen ruckeln"
hint_settings_general-resource-web-timeout: "Wie lange auf eine über das Netzwerk geholte Datei gewartet wird, bevor aufgegeben wird, in Sekunden"
hint_settings_general-show-all-found-content: "Auch Inhalte auflisten, die eine Quelle gefunden hat, aber nicht als deine bestätigen kann - die Dateien eines abbestellten Workshop-Objekts oder einen von Hand hineinkopierten Ordner. Solche Levels sind auf ihrer Karte markiert. Aus listet eine Quelle nur, wofür sie bürgt"
hint_settings_graphics-antialiasing-hdr: "Farbwerte über 1. Nichts hier braucht sie, und HDR verdoppelt die Speicherbandbreite, deshalb ist es standardmäßig aus"
hint_settings_graphics-antialiasing-msaa: "Wie viele Samples <color=#D4B483>MSAA</color> pro Pixel nimmt. Mehr ist glatter und kostet mehr, und die Kosten wachsen damit, wie viel transparenter Inhalt sich überlagert"
hint_settings_graphics-antialiasing-type: "Wie Kanten geglättet werden. <b><color=#D4B483>MSAA</color></b> glättet sie exakt, weil jede Form hier echte Geometrie ist. <b><color=#D4B483>FXAA</color></b> kostet einen Durchgang, egal was die Szene tut - das ist der Kompromiss, vor dem ein schwaches Handy steht"
hint_settings_graphics-audio-pitch-correction: "Wie stark die Audiogeschwindigkeit gebogen wird, um die Simulation einzuholen. Höher korrigiert schneller und ist leichter zu hören"
hint_settings_graphics-audio-render: "Den Ton des Levels überhaupt abspielen. Aus läuft jedes Level stumm, und die Audioeinstellungen darunter spielen keine Rolle mehr - für ein Gerät, dem schon der Ton selbst zu schwer ist"
hint_settings_graphics-audio-render-effects: "Die Audioeffekte der Spur beim Bearbeiten anwenden. Aus heißt, du hörst den unbearbeiteten Clip"
hint_settings_graphics-audio-resync-jump-time: "Wie weit Ton und Simulation auseinanderdriften dürfen, bevor der Ton zurück an seinen Platz springt, statt sanft nachgeführt zu werden"
hint_settings_graphics-audio-scrub-time: "Wie lang ein Fragment zu hören ist, wenn du den Abspielkopf über die Spur ziehst"
hint_settings_graphics-audio-sync-dead-zone: "Eine kleinere Abweichung wird ignoriert. Ohne Totzone würde der Ton ständig und hörbar korrigiert"
hint_settings_graphics-audio-use-scrub: "Den Ton unter dem Abspielkopf abspielen, während du ihn ziehst, damit du einen Moment nach Gehör findest"
hint_settings_graphics-avatar-render: "Der Körper des Avatars ist ein Raster aus 25 Quadraten, und verlorenes Leben dimmt sie vom Rand nach innen entlang einiger Risse - ein schlecht laufender Durchlauf ist also am Spieler zu sehen statt an einem Balken. Ein verlorenes Quadrat bleibt als blasser Geist, und der Hitbox-Ring darunter scheint hindurch. Aus wird das Raster zu einem Quadrat, und das Leben blendet stattdessen dieses aus: dieselbe Aussage, ein Objekt statt 25, für ein Gerät, das sie lieber nicht zeichnet"
hint_settings_graphics-colliders-mode-active: "Ein Modus zum Üben. Ein gespieltes Level zeichnet jede Hitbox als flache Füllung auf einfarbigem Hintergrund und sonst nichts: Dekorationen, Texte, Effekte, Post-Processing und der Hintergrund des Themes verschwinden. Alles, was über den Durchlauf entscheidet, bleibt - die Musik, die Kollision, die Kamera und ihre Erschütterung, Checkpoints, das HUD und die Statistik - und ein Durchlauf hier zählt wie jeder andere. Nur der Spielbildschirm: Editor und Sandbox zeichnen wie gewohnt"
hint_settings_graphics-colliders-mode-background: "Was hinter den Füllungen gezeichnet wird. Absichtlich dunkelgrau statt schwarz: die Balken um den Frame der Kamera sind schwarz, und ein schwarzer Hintergrund würde verbergen, wo der Frame des Levels endet"
hint_settings_graphics-colliders-mode-color: "Womit der Modus Hitboxen füllt. Die Collider-Ansicht des Editors nimmt denselben Farbton mit eigener Deckkraft, also stimmen beide immer überein. \"Grafik zurücksetzen\" bringt das ursprüngliche Rot zurück"
hint_settings_graphics-colliders-mode-use-alpha: "An sind Füllungen mit dem Alpha der Farbe durchscheinend, also lesen sich zwei überlappende Gefahren als dunklerer Fleck. Aus ist jede Füllung deckend - auf einem kleinen Bildschirm leichter zu lesen, aber Überlappungen verschmelzen zu einer Form. Im Spiel fällt das Alpha nie unter 0,15, denn alles Blassere ist unsichtbar"
hint_settings_graphics-effects-fixed-framerate: "Die Rate, mit der Effekte simuliert werden, unabhängig davon, wie oft sie gezeichnet werden"
hint_settings_graphics-effects-frame-step-budget: "Wie viele Effektschritte ein einzelner Frame verbrauchen darf, damit das Aufholen nie ein sichtbares Stocken kostet"
hint_settings_graphics-effects-framerate-target: "Wie oft Effekte gezeichnet werden. Weniger als die Rate des Spiels selbst ist eine billige Ersparnis, weil Partikel auch mit gröberem Schritt gut lesbar sind"
hint_settings_graphics-effects-max-scrub-time: "Wie viel Effektverlauf der Editor neu abspielt, wenn du den Abspielkopf springen lässt. Länger ist genauer und langsamer"
hint_settings_graphics-effects-render: "Partikeleffekte überhaupt zeichnen. Sie bereichern ein Level, aber kein Level hängt von ihnen ab, also kannst du gefahrlos darauf verzichten"
hint_settings_graphics-effects-replay-step-budget: "Wie viele Simulationsschritte eine Neuberechnung verbrauchen darf. Die Grenze verhindert, dass ein Sprung in einen dichten Abschnitt den Editor einfriert"
hint_settings_graphics-fixed-framerate: "Die Obergrenze, die das Spiel hält, solange Framerate-Ziel auf Fest steht - wie oft der Bildschirm neu gezeichnet wird, sonst nichts. Ein Level wird gegen die echte Zeit simuliert, also läuft derselbe Durchlauf bei 30 und bei 144 identisch. Wird ignoriert, solange VSync an ist"
hint_settings_graphics-framerate-target: "Frames pro Sekunde, die das Spiel anstrebt. Direkt angewendet statt über die vertikale Synchronisation"
hint_settings_graphics-postprocessing-render: "Der Hauptschalter für alle Kameraeffekte darunter. Aus überspringt den ganzen Stapel"
hint_settings_graphics-postprocessing-render-analog-glitch: "Analoge Störungen: wandernde Streifen, zerrissene Zeilen, auslaufende Farbe"
hint_settings_graphics-postprocessing-render-bloom: "Helle Bereiche strahlen Licht in ihre Umgebung ab"
hint_settings_graphics-postprocessing-render-chroma: "Die Farbkanäle laufen zu den Bildschirmrändern hin auseinander, wie bei einer billigen Linse"
hint_settings_graphics-postprocessing-render-color-curves: "Farbkurven pro Kanal, für feine Farbkorrektur"
hint_settings_graphics-postprocessing-render-digital-glitch: "Digitale Störung: verschobene Blöcke, als wären Frames beschädigt"
hint_settings_graphics-postprocessing-render-grain: "Filmkörnung über dem Bild"
hint_settings_graphics-postprocessing-render-lens: "Das Bild wird verzerrt, wie eine echte Linse es verzerren würde"
hint_settings_graphics-postprocessing-render-lift-gamma-gain: "Farbkorrektur in drei Bereichen: Schatten, Mitteltöne und Lichter"
hint_settings_graphics-postprocessing-render-motion-blur: "Schnelle Bewegung verwischt. Lieber ausschalten, wenn Geschosse dadurch schwerer zu lesen sind"
hint_settings_graphics-postprocessing-render-shadows-midtones-highlights: "Wieder dieselben drei Bereiche, getrennt eingefärbt statt angehoben"
hint_settings_graphics-postprocessing-render-vignette: "Die Bildschirmränder werden dunkler und lenken den Blick zur Mitte"
hint_settings_graphics-postprocessing-render-white-balance: "Verschiebt, was als Weiß gilt, und macht das ganze Bild wärmer oder kühler"
hint_settings_graphics-render-scale: |-
  Wie viele Pixel das Spiel selbst rendert, bevor das Ergebnis auf das Fenster skaliert wird

  Unter 1 zeichnet das Spiel weniger Pixel und streckt sie hoch - das Wirksamste, was du auf einem schwachen Rechner herunterdrehen kannst, weil die Fragmentkosten mit dem <b>Quadrat</b> davon sinken. Über 1 rendert es größer und verkleinert das Ergebnis, das ist Supersampling

  Die Oberfläche wird in jedem Fall in ein eigenes Ziel voller Größe gezeichnet, also bleiben Text und Schaltflächen scharf, egal was hier eingestellt ist. Die Zahl multipliziert die Skalierung, mit der diese Geräteklasse ohnehin ausgeliefert wird, statt sie zu ersetzen
hint_settings_graphics-resolution: |-
  Die Größe des Spielfensters in Pixeln, angeboten aus den Modi, die dieser Bildschirm tatsächlich meldet - hier lässt sich also kein Modus anfordern, den der Monitor nicht zeigen kann

  Es ist auch der Desktop-Weg, die Ausrichtung zu ändern: eine Auflösung, die höher als breit ist, versetzt die Oberfläche in dasselbe vertikale Layout wie ein aufrecht gehaltenes Handy. Ein Monitor lässt sich nicht aus dem Spiel heraus drehen, also sind das hier und die Fenstergröße die einzigen Hebel

  Bleibt es unberührt, wird die eigene Auflösung des Bildschirms verwendet
hint_settings_graphics-textures-compression: "Packt Bilder beim Laden in ein <color=#D4B483>komprimiertes</color> Format. Vier- bis achtmal weniger Speicher und Blockartefakte, wo ein Verlauf oder eine harte Kante auf einen 4x4-Block trifft. Wird beim Laden eines Levels gelesen, nicht während eines offen ist"
hint_settings_graphics-textures-compression-quality: "Ladezeit gegen Kompressionsartefakte. Das Bild ist am Ende so oder so gleich groß, und Handys ignorieren das komplett"
hint_settings_graphics-textures-filtering: "Wie Bilder beim Zeichnen abgetastet werden, sonst nichts - ob ein Bild verkleinert wird, entscheidet, was sein Autor darüber angegeben hat, nicht diese Einstellung"
hint_settings_graphics-textures-mipmaps: "Verkleinerte Kopien jedes Bildes, damit ein klein gezeichnetes beim Bewegen nicht mehr flimmert. Ein Drittel mehr Speicher und das einzige Mittel gegen dieses Flimmern"
hint_settings_graphics-textures-size-limit: "Die Obergrenze, wie groß ein Bild hier im Speicher sein darf. Der Speicher sinkt mit dem QUADRAT der Seitenlänge, also spart das mehr als Kompression, und es ist das Einzige der drei, das überhaupt begrenzt, was ein Level kosten kann"
hint_settings_graphics-vsync: |-
  Ob das Spiel auf die Bildwiederholung des Bildschirms wartet, bevor es einen Frame zeigt

  <b>Aus</b> zeigt jeden Frame, sobald er fertig ist. Nichts wartet, also erreicht die Eingabe den Bildschirm bei der ersten Gelegenheit - und ein Frame, der mitten in der Wiederholung fertig wird, wird halb über den vorigen gezeichnet, das ist Tearing

  <b>An</b> zeigt einmal pro Wiederholung, also ist das Tearing weg und jeder Frame kostet bis zu einer Wiederholung zusätzliche Latenz. <b>Halbe Rate</b> zeigt einmal pro zweiter Wiederholung - gleichmäßiger auf einem Rechner, der die volle Rate nicht hält, bei doppelter Latenz

  Solange das nicht auf Aus steht, ignoriert Unity die Framerate-Grenze darüber komplett, deshalb sind diese beiden Zeilen ausgegraut

  Ein Handy zeigt nach eigenem Zeitplan, dort bewirkt das nichts
hint_settings_graphics-window-mode: |-
  Wie das Spielfenster den Bildschirm belegt

  <b>Fenstermodus</b> ist der einzige Modus, in dem du die Größe frei ändern kannst, und genau das ändert das Seitenverhältnis des Spiels - zieh das Fenster höher als breit, und die ganze Oberfläche wechselt in ihr vertikales Layout, genau wie bei einem aufrecht gehaltenen Handy

  <b>Randloses Fenster</b> ist der Standard: der Bildschirm ist gefüllt, ohne Moduswechsel und mit sofortigem Alt-Tab. <b>Exklusives Vollbild</b> überlässt den Bildschirm ganz dem Spiel, das ist minimal schneller und langsamer zu verlassen

  Ein Handy hat ein Fenster, und das ist der Bildschirm, dort bewirkt das also nichts
hint_settings_graphics_body: |-
  <b>Kantenglättung.</b> <color=#D4B483>MSAA</color> ist der Standard, weil jede Form in diesem Spiel echte Geometrie ist, also ist jede treppige Kante eine echte geometrische Kante - genau der Fall, den Multisampling exakt glättet, bei voller Schärfe, auf jeder Plattform. <b><color=#D4B483>FXAA</color></b> ist die Alternative für schwächere Handys: es kostet einen Vollbilddurchgang, egal wie viel Overdraw das Level hat, während die Kosten von <color=#D4B483>MSAA</color> mit transparentem Overdraw wachsen. <b>TAA wird bewusst nicht angeboten</b> - Nachzieheffekte hinter schnellen Geschossen sind in diesem Genre ein Problem der Lesbarkeit, und sein Jitter kämpft gegen die Glitch-Effekte

  <b>Framerate.</b> Das Ziel wird direkt angewendet statt über VSync. Die feste Framerate entkoppelt die Simulation von der Anzeige, und genau das hält das Timing eines Levels auf einem 60-Hz- und einem 144-Hz-Bildschirm gleich

  <color=#7FC97F><b>Empfehlung:</b></color> <b>Renderskala</b> unter 1 ist das Billigste, worauf du verzichten kannst, wenn ein Gerät zu kämpfen hat: sie kostet Schärfe und sonst nichts

  Mehr: <link="https://bullethero.space/de/docs/editor/performance/mobile-devices"><color=#59A6FF>Mobile Geräte</color></link>
hint_settings_graphics_header: "Grafik"
hint_settings_interface: "Das Statistik-Overlay und wo es sitzt. Es wird über jeden Bildschirm gezeichnet und ist zum Diagnostizieren der Leistung gedacht, nicht zum Spielen"
hint_settings_interface-alert-on-exception: "Ob ein nicht abgefangener Fehler das Berichtsfenster öffnet. Der Bericht wird in jedem Fall erstellt, protokolliert und aufbewahrt - hier wird nur entschieden, ob er dich unterbricht, und das zählt mitten in einem Durchlauf am meisten. Ist es aus, steht der letzte Bericht trotzdem im Spielerprotokoll und unter <b>Bericht speichern</b> im Berichtsordner"
hint_settings_interface-hitbox-ring-opacity: "Der Ring aus Punkten am Avatar liegt genau auf seinem Kollisionsradius, und der ist 0,4 bei einem Körper, der 1 breit gezeichnet wird - die Silhouette war nie die Hitbox, und jetzt siehst du, wo sie wirklich ist. Derselbe Ring zählt Leben: ein leuchtender Punkt ist ein Leben, das du noch hast, ein gedimmter eines, das du verbraucht hast. Dieser Regler bestimmt nur, wie sichtbar er über dem ist, was das Level zeichnet, und 0 schaltet ihn ganz aus - Levels sind für jemanden ausbalanciert, der ihn sieht"
hint_settings_interface-levels-layout: "Wie sich die Levelauswahl im Menü öffnet: als Raster aus Covern oder als Liste von Zeilen mit Beschreibungen. Die Schaltfläche neben dem Suchfeld wechselt die Ansicht weiterhin, bis du den Bildschirm verlässt"
hint_settings_interface-menu-background: "Was das Menü hinter seinen Schaltflächen abspielt. Bot ist eine echte Arena - derselbe Reflex-Bot, dem man einen Durchlauf übergeben kann, weicht Gefahren aus, die erzeugt werden, während du dasitzt, und er kann getroffen werden, ohne dass etwas passiert. Formen ist das ältere Feld rotierender Formen und das schwerste der drei. Kein zeichnet gar nichts"
hint_settings_interface-open-menu-on-lose: "Was ein verlorener Durchlauf tut. Aus bremst das Level mit Easing bis zum Stillstand ab, spult zum zuletzt erreichten Checkpoint zurück und beschleunigt mit Easing wieder, ohne dass ein Fenster im Weg ist. An stoppt die Wiedergabe und öffnet das Ergebnisfenster"
hint_settings_interface-screen-orientation: |-
  <b>Horizontal</b> und <b>Vertikal</b> sperren eine <b>Achse</b>, nie eine Seite - dreh das Gerät um, und das Bild dreht sich mit, so lässt sich in beiden Lagen spielen

  <b>Automatisch drehen</b> sperrt gar nichts: der Bildschirm folgt dem Gerät. Bei einem Level, das keine eigene Ausrichtung angibt, kannst du das Handy mitten im Durchlauf drehen, und Oberfläche und Kamera folgen beide

  Ein Level kann das überschreiben, solange es läuft. Sein Autor hat den Inhalt für einen Frame bestimmter Form gestaltet, also gilt diese Wahl, solange das Level läuft, und beim Verlassen kehrt die Einstellung zurück

  Auf dem Desktop dreht nichts einen Monitor, also ist das Feld deaktiviert und zeigt nur die Form deines Fensters - ändere seine Größe, und es folgt
hint_settings_interface-show-game-interface: "Der Hauptschalter über die beiden darüber und mit ihnen über die Touch-Steuerung auf dem Bildschirm. Aus zeichnet der Spielbildschirm gar nichts - genau das, was eine saubere Aufnahme oder ein Screenshot braucht. Nichts hört auf zu funktionieren: jedes Steuerelement bleibt genau, wo es war, und nimmt weiter Druck an"
hint_settings_interface-show-game-pause: "Ob das Pausensymbol gezeichnet wird. Es wird ausgeblendet, nicht entfernt: dieselbe Ecke nimmt weiter Druck an, und Escape oder Back am Gamepad öffnet das Pausenfenster, egal was hier steht"
hint_settings_interface-show-game-progress: "Ob der Fortschrittsbalken des Durchlaufs unten am Spielbildschirm gezeichnet wird. Ihn auszublenden ändert sonst nichts - die Checkpoints, die er markiert, funktionieren weiter"
hint_settings_interface-stats-active: "Die Diagnoseanzeige über jedem Bildschirm einblenden. Sie dient zum Messen der Leistung, nicht zum Spielen"
hint_settings_interface-stats-alignment-x: "Wo die Anzeige horizontal sitzt: 0 ist der linke Rand, 1 der rechte"
hint_settings_interface-stats-alignment-y: "Wo die Anzeige vertikal sitzt: 0 ist der obere Rand, 1 der untere"
hint_settings_other: "<b>Alle Einstellungen zurücksetzen</b> setzt jede Einstellung auf jedem Tab auf ihren Standard zurück. Es betrifft nur Einstellungen - deine Levels sind Dateien auf der Festplatte und bleiben unberührt"
hint_settings_profile: "Alles, was dieses Gerät darüber weiß, wie das Spiel gespielt und was damit gebaut wurde. Es ist lokal: nichts davon wird irgendwohin hochgeladen, und die Dateien dahinter liegen neben den Levels in einem Ordner, den man öffnen und lesen kann. Zeiten sind echte Sekunden statt Levelzeit, also zählen die Verlangsamung am Checkpoint und ein Durchlauf bei halber Geschwindigkeit so lange, wie sie wirklich gedauert haben. Die Gerätezeile misst, welches der vier Steuergeräte beim Spielen eines Levels führend war, nicht bloß verbunden"
hint_settings_profile-transfer_body: |-
  Dein ganzes Profil in einer ZIP-Datei und zurück: Levels, Statistik, Einstellungen, die Bibliothek mit ihren Sammlungen und, wenn du sie ankreuzt, Autosicherungen des Editors und Fehlerberichte. Damit ziehst du auf ein anderes Gerät um oder behältst vor einer Neuinstallation eine Kopie

  <b>Ersetzen</b> leert die angekreuzten Teile und setzt die aus der Datei ein. <b>Zusammenführen</b> ergänzt, was fehlt, nimmt von einem Level, das beide Seiten haben, die neuere Kopie und behält die höhere Statistik

  <color=#E8B04B><b>Warnung:</b></color> auf einem Handy löscht das Deinstallieren des Spiels das ganze Profil. Exportiere es vorher

  Vor jedem Import speichert das Spiel, was es gleich ersetzt, in eine Sicherung, die du hier wiederherstellen, woanders speichern oder löschen kannst

  Mehr: <link="https://bullethero.space/de/docs/game/profile-transfer"><u>Profilübertragung</u></link>
hint_settings_profile-transfer_header: "Profilübertragung"
hint_settings_suppress-game-saves_body: |-
  Solange das an ist, speichert das Spiel nichts Eigenes: <color=#D4B483>settings.json</color>, die globale Statistik und die Statistik jedes Levels bleiben genau so auf der Festplatte, wie sie sind. Eine geänderte Einstellung wirkt trotzdem, bis das Spiel geschlossen wird

  Deine Arbeit an Levels wird weiter wie gewohnt gespeichert - Speichern, Exportieren, Importieren, Kopieren und Löschen von Levels sowie Autospeichern und Sicherungen des Editors, die ihren eigenen Schalter haben

  Es gilt, bis das Spiel geschlossen wird, und wird nie gemerkt. Schaltest du es aus, werden deine aktuellen Einstellungen gespeichert und alles verworfen, was in dieser Zeit gespielt wurde

  <color=#B48CE0><b>Gut zu wissen:</b></color> es schaltet sich auch von selbst ein. Das Startargument <color=#D4B483>--suppress-game-saves</color> schaltet es für den ganzen Start ein, und nichts im Spiel kann es ausschalten. Einstellungen oder Statistik, die eine neuere Version des Spiels gespeichert hat, schalten es ebenfalls ein, und dann fragt das Spiel bei jedem Start, ob sie behalten oder mit Standardwerten überschrieben werden sollen
hint_settings_suppress-game-saves_header: "Anonymer Modus"
