settings_interface-alert-on-exception_tooltip: "Si está activado, un error no controlado abre la ventana del informe encima de lo que haya en pantalla. Si está desactivado, solo se escribe en el registro - el informe se genera igualmente"
settings_interface-menu-background_tooltip: "Lo que el menú principal dibuja detrás de sus botones. Bot es una arena en vivo en la que juega el bot reflex, Formas es un campo de formas que giran, Ninguno no dibuja nada"
settings_interface-open-menu-on-lose_tooltip: "Si está desactivado, una partida perdida se rebobina sola hasta el último checkpoint alcanzado. Si está activado, la reproducción se detiene y se abre la ventana de resultados"
settings_interface-screen-orientation_tooltip: "Cómo se sostiene el dispositivo. Horizontal y Vertical fijan un eje y no un lado, así que al dar la vuelta al dispositivo se sigue jugando. En escritorio, aquí se muestra la forma de la ventana"
settings_interface-show-game-interface_tooltip: "El interruptor general de las dos opciones de arriba y, con ellas, de los controles en pantalla"
settings_interface-show-game-pause_tooltip: "El icono de pausa en la esquina de la pantalla de juego. Aunque esté oculto, sigue respondiendo a una pulsación en el mismo sitio"
settings_interface-show-game-progress_tooltip: "La barra en la parte inferior de la pantalla de juego, con una marca por cada checkpoint al que puede volver la partida"
settings_interface-stats-active_tooltip: "Dibuja un panel de diagnóstico sobre cualquier pantalla: tiempos del fotograma, uso de búferes por fotograma, tamaño del nivel y memoria del proceso. Nunca es interactivo - los clics lo atraviesan"
settings_interface-stats-alignment-x_tooltip: "0 es el borde izquierdo de la pantalla, 1 el derecho"
settings_interface-stats-alignment-y_tooltip: "0 es el borde inferior de la pantalla, 1 el superior - la misma convención con la que se crea el contenido del nivel"
settings_interface-stats-alignment_x: "Alineación X"
settings_interface-stats-alignment_y: "Alineación Y"
settings_interface-stats-frame-objects_tooltip: "Añade el bloque de búferes del fotograma: cuántas instancias, formas, efectos, textos y pistas de audio usó este fotograma, cuántas necesitó y para cuántas tenía espacio"
settings_interface-stats-level-objects_tooltip: "Añade el tamaño propio del nivel cargado: objetos por tipo, fotogramas clave, pistas de audio y recursos. Se cuenta una vez por segundo, y no se cuenta en absoluto mientras esto está desactivado"
settings_interface-stats-memory_tooltip: "Añade el bloque de memoria del proceso: el heap administrado y cuánto ha asignado Unity de lo que tenía reservado. Ambos son totales del propio proceso, no de este nivel"
settings_interface-stats-profiling_tooltip: "Añade el bloque de perfilado: cuánto tardó cada etapa de la simulación y cuántos elementos contiene el panel de la interfaz. Solo existe en el Editor de Unity y en las compilaciones de desarrollo - una compilación final no lleva ningún marcador de perfilado"
