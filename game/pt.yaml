level_resources_texture-alpha: "Alfa"
level_resources_texture-alpha_tooltip: "O que você declara sobre a transparência desta imagem. Opaco significa que o canal alfa não é usado, então a imagem é reempacotada sem ele - os mesmos pixels, desenhados mais rápido e pelo caminho de renderização opaco. Nada verifica essa declaração: em uma imagem que realmente esmaece, ela achata o esmaecimento, e é na linha de relatório abaixo que isso aparece"
level_resources_texture-compression: "Compressão"
level_resources_texture-compression_tooltip: "Se um dispositivo pode compactar esta imagem em um formato com perdas. Recusar mantém cada pixel e custa até quatro vezes mais memória, Permitir deixa o dispositivo comprimi-la mesmo onde o tipo recusaria. Auto segue o tipo: pixel art e gradientes recusam. Nenhum dos valores faz um dispositivo comprimir o que as configurações dele proíbem, e nenhum deles remove o limite de tamanho"
level_resources_texture-details: "Importação"
level_resources_texture-kind: "O que esta imagem é - uma foto, um desenho, pixel art, um gradiente. Puramente artístico: diz o que a imagem É. Também define os valores iniciais dos campos Amostragem e Compressão abaixo - pixel art começa nítida e sem compressão, um gradiente sem compressão - e os dois podem ser alterados ali. Mipmaps são a única coisa que o tipo ainda decide sozinho: pixel art nunca os recebe"
level_resources_texture-report-alpha-dropped: "alfa removido"
level_resources_texture-report-mips: "mips"
level_resources_texture-report-not-loaded: "não carregada"
level_resources_texture-report-source-unknown: "origem desconhecida"
level_resources_texture-sampling: "Amostragem"
level_resources_texture-sampling_tooltip: "Como esta imagem é desenhada - Suave mistura os pixels vizinhos, Nítida desenha cada um como um quadrado rígido. Auto segue o tipo: pixel art nítida, todo o resto suave. Nítida e suave custam o mesmo para um dispositivo, então isso é uma questão de aparência, não de orçamento, e se sobrepõe à filtragem escolhida pelo jogador"
level_resources_texture-uv-offset-x: "Deslocamento X"
level_resources_texture-uv-offset-y: "Deslocamento Y"
level_resources_texture-uv-tiling-x: "Mosaico X"
level_resources_texture-uv-tiling-y: "Mosaico Y"
level_resources_texture-uv_tooltip: "Como esta imagem se aplica ao que a desenha, definido uma vez para o recurso em vez de em cada objeto. Mosaico é quantas vezes ela se repete ao longo da forma, Deslocamento é onde começa a primeira cópia. Um objeto sem quadros-chave de UV próprios amostra exatamente isso, e qualquer quadro-chave de UV nesse objeto o substitui por completo"
level_resources_texture-wrap-u: "Fora das bordas X"
level_resources_texture-wrap-u_tooltip: "O que esta imagem faz além das bordas esquerda e direita. Repetir e Espelhar só aparecem onde o UV se repete em mosaico - com mosaico 1 a imagem é amostrada uma vez e nunca sai de si mesma"
level_resources_texture-wrap-v: "Fora das bordas Y"
level_resources_texture-wrap-v_tooltip: "O que esta imagem faz além das bordas superior e inferior. Separado do eixo X de propósito: uma tira que se repete na horizontal e fica limitada na vertical é conteúdo comum"
