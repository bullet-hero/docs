settings_graphics-antialiasing-type_tooltip: "エッジをどう滑らかにするかです。MSAAがデフォルトで、このゲームの内容に合っています。すべてのシェイプは実際のジオメトリなので、ギザギザになる部分だけを正確に処理し、ほかは何もぼかしません。FXAAはレベルのオーバードローに関係なくフルスクリーンパス1回分のコストで、性能の低いデバイスでFXAAを選ぶ理由はそれだけです。細い輪郭がぼやけます"
