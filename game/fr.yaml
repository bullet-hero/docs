settings_graphics-vsync_tooltip: "Attend le rafraîchissement de l'écran avant d'afficher une image, ce qui supprime le déchirement et coûte une image de latence. Tant qu'elle est activée, la limite d'images par seconde au-dessus ne fait rien. Ordinateur uniquement"
settings_graphics-window-mode_tooltip: "Comment la fenêtre occupe l'écran. Le mode fenêtré permet de la redimensionner librement, ce qui change aussi la forme pour laquelle l'interface se dispose. Ordinateur uniquement"
