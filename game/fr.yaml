graph_prefab_too_deep: "Prefabs trop imbriqués"
graph_rule_none: "Aucune règle"
graph_unresolved_reference: "Référence non résolue"
hint_editor-settings_artist-permission_body: |-
  Chaque ressource externe d'un niveau - musique, illustrations, polices, textes - doit avoir une licence au moins aussi libre que <color=#D4B483>CC BY-NC</color>, ou l'autorisation de l'ayant droit pour une redistribution publique non commerciale

  <color=#E86A5A><b>Attention :</b></color> un "vas-y, pas de souci" en privé ne suffit pas. L'autorisation doit couvrir la redistribution publique, pas seulement ton usage personnel

  Rien n'est vérifié tant qu'un niveau reste sur ton appareil - seulement quand il est proposé à un service

  Plus : <link="https://bullethero.space/fr/docs/editor/rights/legal-resource-paths"><color=#59A6FF>Deux façons pour une ressource d'être en règle</color></link>, <link="https://bullethero.space/fr/docs/editor/rights/asking-permission"><color=#59A6FF>Demander une autorisation à un auteur</color></link>
hint_editor-settings_artist-permission_header: "Utiliser le travail d'autrui"
hint_editor-settings_community: "Les liens du projet - ils s'ouvrent dans ton navigateur. La liste dépend de la provenance de cette version, donc une version de boutique peut en afficher moins que celle-ci"
hint_editor-settings_create-level_body: |-
  Un <b>préréglage</b> décide du point de départ du nouveau niveau - vide, ou avec un petit échafaudage que tu monterais sinon à la main à chaque fois

  <color=#E86A5A><b>Attention :</b></color> la section <b>Paramètres</b> fixe ce qui est pénible à changer plus tard : la durée en images et les images par seconde

  <color=#5EC8C8><b>Conseil :</b></color> les deux listes de format de fichier choisissent comment le niveau et ses métadonnées sont écrits sur le disque. Les deux se changent ensuite depuis la Zone dangereuse du niveau

  Plus : <link="https://bullethero.space/fr/docs/editor/basics/first-level"><color=#59A6FF>Ton premier niveau : le parcours</color></link>
hint_editor-settings_create-level_header: "Créer un niveau"
hint_editor-settings_library_body: |-
  Tout ce qui, sur cet appareil, peut entrer dans un niveau : ta propre bibliothèque, tes collections et celles de tes abonnements au Workshop. La colonne étroite choisit le type, les puces au-dessus de la liste choisissent la source

  Une <b>collection</b> est un dossier de ressources de tout type, avec un nom, des auteurs et une licence. Crée-en une ici, remplis-la avec <b>Copier</b> depuis les pages de chaque type, exporte-la en archive ou publie-la

  <color=#5EC8C8><b>Conseil :</b></color> une collection du Workshop est en lecture seule. Copie ses entrées dans une de tes collections pour les modifier

  Plus : <link="https://bullethero.space/fr/docs/editor/reference/library-and-collections"><color=#59A6FF>Bibliothèque et collections</color></link>
hint_editor-settings_library_header: "Bibliothèque"
hint_editor-settings_open-level: "Les niveaux trouvés sur cet appareil. Un niveau est un dossier - pose-le à côté des autres et il apparaît ici"
hint_editor_beat-segment_body: |-
  Une portion à tempo constant : BPM, décalage de phase en fractions d'image, pulsations par mesure, un nom et une couleur. Un seul segment est affiché, même si plusieurs sont sélectionnés

  <color=#E86A5A><b>Attention :</b></color> un segment est identifié par son image de début, donc <b>le déplacer change son identité</b>. Après un déplacement, resélectionne-le à son nouveau début

  <color=#5EC8C8><b>Conseil :</b></color> ici, les appuis recalent la phase du segment sélectionné au lieu d'en créer un nouveau

  Plus : <link="https://bullethero.space/fr/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>Rythme et structure</color></link>
hint_editor_beat-segment_header: "Segment de pulsation"
hint_editor_beat-window_body: |-
  Des métadonnées d'édition - <b>rien ne les lit pendant la lecture</b>. Elles te permettent de caler le contenu sur la musique, et les générateurs agissent sur les mêmes pulsations que celles que tu vois

  La grille est une liste de <b>segments de pulsation</b>, chacun une portion à tempo constant. Les trous entre eux ne posent pas de problème : une intro sans percussions, un break, la fin après le morceau

  <color=#5EC8C8><b>Conseil :</b></color> appuie sur <b>APPUYER</b> en rythme avec la piste, puis <b>Créer depuis les appuis</b> transforme les appuis en un seul segment, du premier au dernier

  Plus : <link="https://bullethero.space/fr/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>Rythme et structure</color></link>
hint_editor_beat-window_header: "Grille de pulsations"
hint_editor_clipboard_body: |-
  Un tampon par timeline, chacun avec sa propre ligne d'état

  <b>Copier en texte</b> écrit tous les tampons dans le presse-papiers du système sous forme de texte, pour qu'une sélection puisse passer dans un autre niveau ou sur une autre machine. <b>Coller du texte</b> les relit dans les tampons - et <b>s'arrête là</b>

  <color=#B48CE0><b>Bon à savoir :</b></color> rien n'arrive dans le niveau tant que tu ne colles pas toi-même dans la timeline de ton choix. L'endroit où ça atterrit dépend de la tête de lecture et de la portée active

  Plus : <link="https://bullethero.space/fr/docs/editor/workflow/reuse"><color=#59A6FF>Réutiliser : prefabs, copie, générateurs</color></link>
hint_editor_clipboard_header: "Presse-papiers"
hint_editor_console: "Tout ce que l'éditeur a journalisé pendant la session - rapports de chargement de niveau, résultats des générateurs, avertissements d'import. <b>Effacer</b> vide la console. La roue dentée filtre les niveaux de gravité affichés"
hint_editor_curve-editor: "Modifie une courbe en faisant glisser ses points. Les changements s'appliquent <b>en direct</b> pendant le glissement, donc ce que tu vois est déjà dans le niveau - fermer la fenêtre les conserve"
hint_editor_generators_body: |-
  Du contenu procédural, appliqué au niveau en une seule opération annulable

  <color=#B48CE0><b>Bon à savoir :</b></color> il y a deux familles. Les <b>générateurs</b> (<i>gen_</i>) créent du contenu - vagues de balles, motifs radiaux et cache de polices. Les <b>modificateurs</b> (<i>mod_</i>) réécrivent ce qui existe déjà - ajustement des intervalles, quantification des images clés

  <color=#E86A5A><b>Attention :</b></color> tout ce qui réécrit ou supprime du contenu existant demande d'abord une confirmation

  Plus : <link="https://bullethero.space/fr/docs/editor/workflow/reuse"><color=#59A6FF>Réutiliser : prefabs, copie, générateurs</color></link>
hint_editor_generators_header: "Générateurs"
hint_editor_gradient-editor: "Modifie un dégradé en faisant glisser ses repères. Comme dans l'éditeur de courbe, les changements s'appliquent <b>en direct</b> et non à la validation"
hint_editor_hierarchy_body: |-
  Chaque objet vivant sur l'<b>image actuelle</b>, imbriqué sous son parent. La liste change pendant le balayage - une hiérarchie vide signifie en général que la tête de lecture a dépassé la fin de ton contenu

  Fais glisser une ligne sur une autre pour en faire l'enfant de cet objet. Les calques s'additionnent le long de la chaîne, donc changer de parent déplace aussi l'objet dans l'ordre de dessin et relance le tirage de ses valeurs aléatoires

  <color=#5EC8C8><b>Conseil :</b></color> fais un clic droit sur une ligne pour voir ses actions. Sur écran tactile, maintiens le doigt sur la ligne

  Plus : <link="https://bullethero.space/fr/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Comment pense l'éditeur</color></link>
hint_editor_hierarchy_header: "Hiérarchie"
hint_editor_inspector-audio_body: |-
  Le clip de la piste audio sélectionnée, sa vitesse, son volume de fader et sa chaîne d'effets audio - passe-bas, passe-haut, écho, réverbération, chorus, changement de hauteur, distorsion, flanger, compresseur, normalisation et EQ paramétrique

  La vitesse et le volume sont des curseurs plutôt que de simples champs numériques, pour que leur plage autorisée soit visible

  <color=#E86A5A><b>Attention :</b></color> <b>ici, le volume est celui du fader.</b> Le volume en images clés est une piste séparée sur la timeline locale, et les deux se multiplient à la lecture

  Plus : <link="https://bullethero.space/fr/docs/editor/resources/preparing-the-track"><color=#59A6FF>Préparer la piste audio</color></link>
hint_editor_inspector-audio_chorus-delay: "Délai de base des copies en ms - assez court pour s'entendre comme de l'épaisseur plutôt que comme un écho"
hint_editor_inspector-audio_chorus-depth: "Amplitude de l'oscillation du délai - Rate fixe la vitesse de l'ondulation, ce champ son ampleur"
hint_editor_inspector-audio_chorus-dry-mix: "Niveau du signal non traité"
hint_editor_inspector-audio_chorus-feedback: "Part de la sortie renvoyée dans l'effet, qui le creuse jusqu'à le rapprocher d'un flanger"
hint_editor_inspector-audio_chorus-rate: "Vitesse de modulation du délai, en Hz"
hint_editor_inspector-audio_chorus-wet-mix-tap-1: "Niveau de la première copie retardée"
hint_editor_inspector-audio_chorus-wet-mix-tap-2: "Niveau de la deuxième copie - les copies sont espacées dans le temps, donc leur équilibre décide de la largeur perçue du chorus"
hint_editor_inspector-audio_chorus-wet-mix-tap-3: "Niveau de la troisième copie"
hint_editor_inspector-audio_chorus_body: |-
  Superpose au signal trois copies légèrement retardées, à la hauteur ondulante, pour qu'une seule source sonne comme plusieurs. <color=#D4B483>Rate</color> est la vitesse de l'ondulation, <color=#D4B483>Depth</color> son ampleur. Pousse <color=#D4B483>Feedback</color> et il devient un <link="hint_editor_inspector-audio_flange"><color=#59A6FF>Flanger</color></link>

  <color=#B48CE0><b>Bon à savoir :</b></color> la <b>réinitialisation</b> remet aussi <b>Niveau de mix</b> à sa valeur par défaut de -80 dB, ce qui coupe l'effet

  Plus : <link="https://bullethero.space/fr/docs/editor/resources/preparing-the-track"><color=#59A6FF>Préparer la piste audio</color></link>
hint_editor_inspector-audio_chorus_header: "Chorus"
hint_editor_inspector-audio_compressor-attack: "Vitesse à laquelle il serre après un pic, en ms - trop rapide, il écrase les transitoires"
hint_editor_inspector-audio_compressor-make-up-gain: "Gain en dB rajouté après la compression, pour rendre le niveau qu'elle a retiré"
hint_editor_inspector-audio_compressor-release: "Vitesse à laquelle il relâche ensuite, en ms - trop rapide, il pompe de façon audible"
hint_editor_inspector-audio_compressor-threshold: "Niveau en dB au-dessus duquel la compression commence à agir"
hint_editor_inspector-audio_compressor_body: |-
  Baisse les passages forts pour que les passages calmes puissent monter - le remède habituel pour un morceau qui disparaît derrière ses propres effets. <color=#D4B483>Threshold</color> est le seuil où il commence, <color=#D4B483>Attack</color> et <color=#D4B483>Release</color> la vitesse à laquelle il serre et relâche, <color=#D4B483>Make Up Gain</color> rend le niveau

  <color=#B48CE0><b>Bon à savoir :</b></color> la <b>réinitialisation</b> remet aussi <b>Niveau de mix</b> à sa valeur par défaut de -80 dB, ce qui coupe l'effet

  Plus : <link="https://bullethero.space/fr/docs/editor/resources/preparing-the-track"><color=#59A6FF>Préparer la piste audio</color></link>
hint_editor_inspector-audio_compressor_header: "Compresseur"
hint_editor_inspector-audio_distortion-level: "Force de l'écrêtage du signal"
hint_editor_inspector-audio_distortion_body: |-
  Écrête la forme d'onde et remplit le son d'harmoniques - granuleux et saturé. Un seul bouton, <color=#D4B483>Level</color>, règle le niveau de la morsure. Il aplatit aussi la dynamique, donc la piste perd ses moments calmes

  <color=#B48CE0><b>Bon à savoir :</b></color> la <b>réinitialisation</b> remet aussi <b>Niveau de mix</b> à sa valeur par défaut de -80 dB, ce qui coupe l'effet

  Plus : <link="https://bullethero.space/fr/docs/editor/resources/preparing-the-track"><color=#59A6FF>Préparer la piste audio</color></link>
hint_editor_inspector-audio_distortion_header: "Distorsion"
hint_editor_inspector-audio_echo-decay: "Part de chaque répétition qui alimente la suivante - plus la valeur est haute, plus ça résonne longtemps"
hint_editor_inspector-audio_echo-delay: "Millisecondes entre les répétitions - cale-les sur le tempo du morceau pour que les échos tombent sur la pulsation"
hint_editor_inspector-audio_echo-dry-mix: "Niveau du signal non traité en sortie"
hint_editor_inspector-audio_echo-max-channels: "Nombre maximal de canaux du tampon d'écho"
hint_editor_inspector-audio_echo-wet-mix: "Niveau du signal en écho - équilibré avec Dry Mix, indépendamment du Niveau de mix"
hint_editor_inspector-audio_echo_body: |-
  Répète le signal à intervalle fixe, chaque répétition plus faible que la précédente - des copies distinctes, et non la salle de l'effet <link="hint_editor_inspector-audio_reverb"><color=#59A6FF>Réverbération</color></link>. <color=#D4B483>Delay</color> est l'écart en millisecondes, <color=#D4B483>Decay</color> la part de chaque copie qui alimente la suivante

  <color=#B48CE0><b>Bon à savoir :</b></color> la <b>réinitialisation</b> remet aussi <b>Niveau de mix</b> à sa valeur par défaut de -80 dB, ce qui coupe l'effet

  Plus : <link="https://bullethero.space/fr/docs/editor/resources/preparing-the-track"><color=#59A6FF>Préparer la piste audio</color></link>
hint_editor_inspector-audio_echo_header: "Écho"
hint_editor_inspector-audio_enabled: "Indique si cet effet est dans la chaîne. Il n'a pas d'interrupteur propre - cocher la case fait remonter le Niveau de mix du plancher de -80 dB, la décocher l'y renvoie et garde le niveau que tu avais réglé"
hint_editor_inspector-audio_flange-depth: "Amplitude de l'oscillation du délai"
hint_editor_inspector-audio_flange-dry-mix: "Niveau du signal non traité"
hint_editor_inspector-audio_flange-rate: "Fréquence de répétition du balayage, en Hz"
hint_editor_inspector-audio_flange-wet-mix: "Niveau de la copie balayée - l'effet naît de l'annulation entre les deux signaux"
hint_editor_inspector-audio_flange_body: |-
  Mélange le signal avec une copie de lui-même, très brièvement retardée et balayée - le souffle d'un réacteur. Comme <link="hint_editor_inspector-audio_chorus"><color=#59A6FF>Chorus</color></link>, mais avec une seule copie, donc on entend un balayage plutôt que de la largeur. Le souffle est le plus profond quand <color=#D4B483>Dry Mix</color> et <color=#D4B483>Wet Mix</color> sont proches

  <color=#B48CE0><b>Bon à savoir :</b></color> la <b>réinitialisation</b> remet aussi <b>Niveau de mix</b> à sa valeur par défaut de -80 dB, ce qui coupe l'effet

  Plus : <link="https://bullethero.space/fr/docs/editor/resources/preparing-the-track"><color=#59A6FF>Préparer la piste audio</color></link>
hint_editor_inspector-audio_flange_header: "Flanger"
hint_editor_inspector-audio_header: "Inspecteur de piste audio"
hint_editor_inspector-audio_highpass-cutoff-freq: "Fréquence en Hz sous laquelle la piste est atténuée - au minimum, le filtre est pratiquement transparent"
hint_editor_inspector-audio_highpass_body: |-
  Le miroir de <link="hint_editor_inspector-audio_lowpass"><color=#59A6FF>Passe-bas</color></link> : laisse passer les aigus et coupe tout ce qui est sous <color=#D4B483>Cutoff Freq</color>. Monte la fréquence de coupure et la piste s'amincit jusqu'à sonner comme un minuscule haut-parleur

  <color=#5EC8C8><b>Conseil :</b></color> la chaîne appartient à la <b>piste</b> et ne s'anime pas par images clés. Pour un changement en cours de morceau, coupe la piste et règle les deux moitiés différemment

  <color=#B48CE0><b>Bon à savoir :</b></color> la <b>réinitialisation</b> remet aussi <b>Niveau de mix</b> à sa valeur par défaut de -80 dB, ce qui coupe l'effet

  Plus : <link="https://bullethero.space/fr/docs/editor/resources/preparing-the-track"><color=#59A6FF>Préparer la piste audio</color></link>
hint_editor_inspector-audio_highpass_header: "Passe-haut"
hint_editor_inspector-audio_lowpass-cutoff-freq: "Fréquence en Hz au-dessus de laquelle la piste est atténuée - au maximum, le filtre est pratiquement transparent"
hint_editor_inspector-audio_lowpass_body: |-
  Laisse passer les graves et coupe tout ce qui est au-dessus de <color=#D4B483>Cutoff Freq</color> - le son sous l'eau, derrière un mur. En haut de la plage, le filtre est pratiquement transparent

  <color=#5EC8C8><b>Conseil :</b></color> la chaîne appartient à la <b>piste</b> et ne s'anime pas par images clés. Pour un changement en cours de morceau, coupe la piste et règle les deux moitiés différemment

  <color=#B48CE0><b>Bon à savoir :</b></color> la <b>réinitialisation</b> remet aussi <b>Niveau de mix</b> à sa valeur par défaut de -80 dB, ce qui coupe l'effet

  Plus : <link="https://bullethero.space/fr/docs/editor/resources/preparing-the-track"><color=#59A6FF>Préparer la piste audio</color></link>
hint_editor_inspector-audio_lowpass_header: "Passe-bas"
hint_editor_inspector-audio_mix-level: "Niveau en dB auquel le signal traité est remélangé. À -80, l'effet est muet, et c'est ainsi que \"désactivé\" est stocké - le fichier n'a pas d'interrupteur séparé"
hint_editor_inspector-audio_normalize-fade-in-time: "Millisecondes que met le gain à se stabiliser, pour que la correction ne s'entende pas comme un saut"
hint_editor_inspector-audio_normalize-lowest-volume: "Les signaux plus faibles que ce seuil ne sont pas touchés - le silence et le bruit de fond ne sont pas amplifiés en souffle"
hint_editor_inspector-audio_normalize-maximum-amp: "Plafond du gain qui peut être appliqué"
hint_editor_inspector-audio_normalize_body: |-
  Amène le signal vers une intensité cible, pour que des clips de sources différentes soient à un niveau comparable. Il agit sur le niveau global, la dynamique à l'intérieur d'une piste relève du <link="hint_editor_inspector-audio_compressor"><color=#59A6FF>Compresseur</color></link>. <color=#D4B483>Lowest Volume</color> l'empêche de changer le silence en souffle, <color=#D4B483>Maximum Amp</color> plafonne l'amplification

  <color=#B48CE0><b>Bon à savoir :</b></color> la <b>réinitialisation</b> remet aussi <b>Niveau de mix</b> à sa valeur par défaut de -80 dB, ce qui coupe l'effet

  Plus : <link="https://bullethero.space/fr/docs/editor/resources/preparing-the-track"><color=#59A6FF>Préparer la piste audio</color></link>
hint_editor_inspector-audio_normalize_header: "Normalisation"
hint_editor_inspector-audio_param-eq-center-freq: "Fréquence en Hz sur laquelle la bande est centrée"
hint_editor_inspector-audio_param-eq-frequency-gain: "Gain appliqué dans la bande - sous 1 il coupe, au-dessus de 1 il amplifie"
hint_editor_inspector-audio_param-eq-octave-range: "Largeur de la bande en octaves - étroite pour des corrections chirurgicales, large pour façonner le timbre"
hint_editor_inspector-audio_param-eq_body: |-
  Une bande paramétrique qui amplifie ou coupe une zone choisie du spectre. Contrairement à <link="hint_editor_inspector-audio_lowpass"><color=#59A6FF>Passe-bas</color></link> et <link="hint_editor_inspector-audio_highpass"><color=#59A6FF>Passe-haut</color></link>, elle peut aussi ajouter du niveau. <color=#D4B483>Center Freq</color> est l'emplacement de la bande, <color=#D4B483>Octave Range</color> sa largeur, <color=#D4B483>Frequency Gain</color> coupe sous 1 et amplifie au-dessus de 1

  <color=#B48CE0><b>Bon à savoir :</b></color> la <b>réinitialisation</b> remet aussi <b>Niveau de mix</b> à sa valeur par défaut de -80 dB, ce qui coupe l'effet

  Plus : <link="https://bullethero.space/fr/docs/editor/resources/preparing-the-track"><color=#59A6FF>Préparer la piste audio</color></link>
hint_editor_inspector-audio_param-eq_header: "EQ paramétrique"
hint_editor_inspector-audio_pitch-shifter-fft-size: "Taille de la fenêtre d'analyse - le réglage qualité contre latence de l'algorithme"
hint_editor_inspector-audio_pitch-shifter-max-channels: "Nombre maximal de canaux pour le traitement"
hint_editor_inspector-audio_pitch-shifter-overlap: "Chevauchement des fenêtres successives - plus il est grand, plus les artefacts sont lissés, mais plus ça coûte"
hint_editor_inspector-audio_pitch-shifter-pitch: "Multiplicateur de hauteur - 1 ne change rien, 2 monte d'une octave"
hint_editor_inspector-audio_pitch-shifter_body: |-
  Change la hauteur sans changer la vitesse, donc le timing reste calé sur le morceau. <color=#D4B483>Pitch</color> est un multiplicateur : 1 ne change rien, 2 monte d'une octave. <color=#D4B483>FFT Size</color> et <color=#D4B483>Overlap</color> échangent de la qualité contre du coût

  <color=#5EC8C8><b>Conseil :</b></color> la chaîne appartient à la <b>piste</b> et ne s'anime pas par images clés. Pour un changement en cours de morceau, coupe la piste et règle les deux moitiés différemment

  <color=#B48CE0><b>Bon à savoir :</b></color> la <b>réinitialisation</b> remet aussi <b>Niveau de mix</b> à sa valeur par défaut de -80 dB, ce qui coupe l'effet

  Plus : <link="https://bullethero.space/fr/docs/editor/resources/preparing-the-track"><color=#59A6FF>Préparer la piste audio</color></link>
hint_editor_inspector-audio_pitch-shifter_header: "Changement de hauteur"
hint_editor_inspector-audio_reverb-decay-hf-ratio: "À quel point les aigus s'éteignent plus vite que les graves - sous 1, la queue s'assombrit en s'estompant"
hint_editor_inspector-audio_reverb-decay-time: "Secondes que met la queue à s'éteindre - l'indice le plus fort de la taille de la pièce"
hint_editor_inspector-audio_reverb-density: "Densité modale de l'espace simulé"
hint_editor_inspector-audio_reverb-diffusion: "Densité des échos dans le temps - des valeurs basses rendent la queue granuleuse et métallique"
hint_editor_inspector-audio_reverb-dry-level: "Niveau du signal non traité en sortie"
hint_editor_inspector-audio_reverb-hf-reference: "Fréquence à laquelle les réglages Room HF et Decay HF Ratio sont mesurés"
hint_editor_inspector-audio_reverb-lf-reference: "Fréquence à laquelle le réglage Room LF est mesuré"
hint_editor_inspector-audio_reverb-reflect-delay: "Délai avant l'arrivée de ces réflexions - la distance des murs"
hint_editor_inspector-audio_reverb-reflections: "Niveau des premières réflexions - les premiers rebonds distincts sur les murs proches"
hint_editor_inspector-audio_reverb-reverb: "Niveau de la queue tardive et diffuse, par opposition aux premières réflexions"
hint_editor_inspector-audio_reverb-reverb-delay: "Délai avant que cette queue ne s'installe"
hint_editor_inspector-audio_reverb-room: "Niveau global du signal réverbéré - la présence de la pièce"
hint_editor_inspector-audio_reverb-room-hf: "Niveau de la pièce dans les hautes fréquences - le baisser donne l'impression de murs mous et absorbants"
hint_editor_inspector-audio_reverb-room-lf: "Niveau de la pièce dans les basses fréquences"
hint_editor_inspector-audio_reverb_body: |-
  Place la piste dans une pièce : premières réflexions, puis une queue qui s'éteint. Commence par trois champs : <color=#D4B483>Decay Time</color> est la taille de la pièce, <color=#D4B483>Room</color> la part que tu en entends, <color=#D4B483>Room HF</color> baissé rend les murs mous

  <color=#B48CE0><b>Bon à savoir :</b></color> la <b>réinitialisation</b> remet aussi <b>Niveau de mix</b> à sa valeur par défaut de -80 dB, ce qui coupe l'effet

  Plus : <link="https://bullethero.space/fr/docs/editor/resources/preparing-the-track"><color=#59A6FF>Préparer la piste audio</color></link>
hint_editor_inspector-audio_reverb_header: "Réverbération"
hint_editor_inspector-effect_angle-a: "L'angle, en degrés. Avec les variantes Aléatoire, c'est une des bornes de la plage dans laquelle chaque particule tire sa valeur"
hint_editor_inspector-effect_angle-b: "L'autre borne de la plage dans laquelle chaque particule tire son angle"
hint_editor_inspector-effect_angle-curve: "La courbe qui donne l'angle - lue sur la durée de vie de la particule en \"Sur la durée de vie\", sur sa vitesse en \"Selon la vitesse\""
hint_editor_inspector-effect_angle-speed-range: "Plage de vitesses sur laquelle la courbe est remappée - la vitesse qui correspond au début de la courbe, et celle qui correspond à sa fin"
hint_editor_inspector-effect_angle-type: "Laquelle des cinq variantes de rotation est utilisée. La changer remplace tout le sous-objet, donc les lignes ci-dessous sont celles de la nouvelle variante"
hint_editor_inspector-effect_angle_body: |-
  Comment une particule tourne au fil de sa vie, selon une des cinq variantes : une <color=#D4B483>Valeur</color> fixe, deux <color=#D4B483>Courbes</color> ou deux plages <color=#D4B483>Aléatoire</color> tirées pour chaque particule

  <color=#D4B483>Sur la durée de vie</color> lit la courbe le long de la durée de vie de la particule, <color=#D4B483>Selon la vitesse</color> le long de sa vitesse, via la plage de vitesses ci-dessous

  Le bouton <b>réinitialiser</b> voisin réinitialise aussi <color=#D4B483>Type</color>, et emporte avec lui la courbe ou la paire aléatoire

  Plus : <link="https://bullethero.space/fr/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Lisibilité</color></link>
hint_editor_inspector-effect_angle_header: "Angle"
hint_editor_inspector-effect_body: |-
  Les paramètres d'un effet <color=#D4B483>VFX Graph</color>, par groupes : configuration, base, forces, forme, angle, échelle et couleur. Tous les groupes sont visibles en même temps, pas un par un

  <color=#B48CE0><b>Bon à savoir :</b></color> les effets <b>reçoivent leur graine comme tout le reste</b> - à partir de nombres que tu modifies, pas de l'état d'un générateur - donc le même niveau se rejoue à l'identique sur n'importe quel appareil

  <color=#5EC8C8><b>Conseil :</b></color> les couleurs peuvent renvoyer au thème du niveau au lieu de contenir une valeur fixe, et les types à dégradé ouvrent l'éditeur de dégradé commun

  Plus : <link="https://bullethero.space/fr/docs/editor/performance/level-budget"><color=#59A6FF>Le budget du niveau</color></link>
hint_editor_inspector-effect_color-a: "La couleur de la particule. Avec les variantes Aléatoire, c'est une des bornes de la plage dans laquelle chaque particule tire sa valeur"
hint_editor_inspector-effect_color-b: "L'autre borne de la plage dans laquelle chaque particule tire sa couleur"
hint_editor_inspector-effect_color-gradient: "Le dégradé qui donne la teinte - lu sur la durée de vie de la particule, sur sa vitesse, ou une couleur par particule, selon la variante"
hint_editor_inspector-effect_color-speed-range: "Plage de vitesses sur laquelle le dégradé est remappé - la vitesse qui correspond à son début, et celle qui correspond à sa fin"
hint_editor_inspector-effect_color-type: "Laquelle des six variantes de teinte est utilisée. La changer remplace tout le sous-objet, donc les lignes ci-dessous sont celles de la nouvelle variante"
hint_editor_inspector-effect_color_body: |-
  Comment une particule est teintée au fil de sa vie, selon une des six variantes : les cinq de <link="hint_editor_inspector-effect_angle"><color=#59A6FF>Angle</color></link> et <link="hint_editor_inspector-effect_scale"><color=#59A6FF>Échelle</color></link> avec des dégradés au lieu des courbes, plus un <color=#D4B483>Dégradé aléatoire</color> qui choisit une couleur par particule

  <color=#5EC8C8><b>Conseil :</b></color> une couleur ici peut être une référence au thème, et l'effet suit alors un niveau qui change de palette en cours de route

  Le bouton <b>réinitialiser</b> voisin réinitialise aussi <color=#D4B483>Type</color>, et emporte avec lui le dégradé ou la paire de couleurs

  Plus : <link="https://bullethero.space/fr/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>Couleur et thèmes</color></link>
hint_editor_inspector-effect_color_header: "Couleur"
hint_editor_inspector-effect_config-has-stop-frame: "Active ou non l'image d'arrêt. Désactivé, l'émetteur continue d'émettre tant que son objet existe"
hint_editor_inspector-effect_config-stop-frame: "Image, comptée depuis le début de l'intervalle de l'objet lui-même et non depuis le temps du niveau, où l'émission s'arrête. Les particules déjà en vie vont au bout de leur durée de vie"
hint_editor_inspector-effect_config_body: |-
  Quand l'émetteur cesse d'émettre. Désactivé, il émet tant que l'objet existe, ce qui est le cas ordinaire

  <color=#D4B483>Image d'arrêt</color> se compte depuis le début de l'intervalle de l'objet lui-même, pas depuis la timeline du niveau. Les particules déjà en vie vont au bout de leur durée de vie, donc le rendu s'estompe au lieu d'être coupé net

  Le bouton <b>réinitialiser</b> voisin remet les deux champs aux valeurs par défaut des développeurs, en une seule étape d'annulation

  Plus : <link="https://bullethero.space/fr/docs/editor/performance/level-budget"><color=#59A6FF>Ce qu'un niveau peut se permettre</color></link>
hint_editor_inspector-effect_config_header: "Configuration"
hint_editor_inspector-effect_core-lifetime-bounds: "Durée de vie min et max d'une particule en secondes, tirée pour chaque particule - c'est cet écart qui évite qu'une salve s'éteigne d'un coup. Leur moyenne multiplie aussi la taille de la salve d'un effet sans boucle"
hint_editor_inspector-effect_core-loop: "Si le système émet en continu, au lieu d'une seule salve jamais renouvelée. Désactivé, il ne reste plus rien à dessiner au-delà des limites de durée de vie"
hint_editor_inspector-effect_core-particle-count: "Particules émises par seconde - le principal réglage de coût. Le nombre de particules en vie à la fois est ce nombre multiplié par la durée de vie moyenne, dans les deux modes : en boucle, elles naissent à ce rythme, sans boucle, tout ce produit part en une seule salve. Le plafond est la capacité propre du graphe, et un système est calculé sur toute cette capacité à chaque image, que les particules existent ou non"
hint_editor_inspector-effect_core-particle-pivot: "Point de la particule posé sur sa position et autour duquel elle tourne - l'équivalent, pour une particule, du pivot propre d'un objet"
hint_editor_inspector-effect_core-render: "Si les particules sont dessinées. Désactivé, le système continue d'être simulé, ce qui sert quand seuls ses effets secondaires comptent"
hint_editor_inspector-effect_core-shape-id: "Géométrie avec laquelle chaque particule est dessinée, prise dans le même ensemble de formes que celui d'un objet. \"Aucun\" ne dessine rien du tout - le quad est une valeur ordinaire, et c'est la valeur par défaut de ce champ"
hint_editor_inspector-effect_core-texture-id: "Texture que dessine chaque particule, prise dans le même ensemble de ressources que celui d'un objet. \"Aucun\" laisse la particule sans texture, et c'est la valeur par défaut de ce champ"
hint_editor_inspector-effect_core_body: |-
  Combien de particules existent, combien de temps elles vivent et avec quoi elles sont dessinées. Leur mouvement relève de <link="hint_editor_inspector-effect_forces"><color=#59A6FF>Forces</color></link>

  <color=#D4B483>Nombre de particules</color> est le principal réglage de coût : un émetteur coûte à peu près ce nombre multiplié par <color=#D4B483>Limites de durée de vie</color>. <color=#D4B483>Forme</color> et <color=#D4B483>Texture</color> peuvent rester vides - une particule sans texture est le cas le moins cher

  <color=#E8B04B><b>Avertissement :</b></color> le nombre est plafonné à 1024, et le graphe paie toute sa capacité à chaque image, pas seulement les particules en vie. Demande juste ce qu'il te faut

  Plus : <link="https://bullethero.space/fr/docs/editor/performance/level-budget"><color=#59A6FF>Ce qu'un niveau peut se permettre</color></link>
hint_editor_inspector-effect_core_header: "Base"
hint_editor_inspector-effect_forces-linear-force: "Une accélération constante et non une vitesse, donc son effet s'accumule au fil de la vie de la particule au lieu de rester stable"
hint_editor_inspector-effect_forces-linear-velocity: "Dérive constante ajoutée à chaque image en plus de la vitesse de naissance de la particule - du vent, pas une impulsion"
hint_editor_inspector-effect_forces-orbital-center-offset: "Position de ce centre d'orbite par rapport à l'émetteur. Le décaler rend le tourbillon asymétrique"
hint_editor_inspector-effect_forces-orbital-velocity: "Rotation des particules autour d'un centre plutôt que sur elles-mêmes. Dans une scène 2D, c'est la composante Z qui compte"
hint_editor_inspector-effect_forces-start-angular-velocity-max: "Borne haute du tirage de rotation initiale"
hint_editor_inspector-effect_forces-start-angular-velocity-min: "Borne basse du tirage de rotation initiale, en degrés par seconde"
hint_editor_inspector-effect_forces-start-gravity-max: "Borne haute du tirage de gravité par particule"
hint_editor_inspector-effect_forces-start-gravity-min: "Borne basse du tirage de gravité par particule. Les valeurs négatives font monter les particules"
hint_editor_inspector-effect_forces-start-velocity-max: "Borne haute du tirage de vitesse initiale. Écarter ces deux valeurs transforme une salve nette en gerbe"
hint_editor_inspector-effect_forces-start-velocity-min: "Borne basse du tirage de vitesse initiale, par axe"
hint_editor_inspector-effect_forces-velocity-speed: "Multiplicateur de toute la vitesse de la particule - un seul réglage pour ralentir ou accélérer un effet fini sans réajuster chaque champ au-dessus"
hint_editor_inspector-effect_forces_body: |-
  Tout ce qui déplace une particule après sa naissance. Son point de départ relève de <link="hint_editor_inspector-effect_shape"><color=#59A6FF>Forme</color></link>

  Les paires min/max des champs <color=#D4B483>initiale</color> sont tirées une seule fois, à la naissance de chaque particule. Tout le reste agit en continu pendant toute la vie de la particule, et <color=#D4B483>Force linéaire</color> est une accélération, donc elle s'accumule

  <color=#5EC8C8><b>Conseil :</b></color> <color=#D4B483>Vitesse de déplacement</color> multiplie tout le résultat, donc un effet fini peut être ralenti ou accéléré sans réajuster le reste

  Plus : <link="https://bullethero.space/fr/docs/editor/craft/composition-and-camera"><color=#59A6FF>Composition</color></link>
hint_editor_inspector-effect_forces_header: "Forces"
hint_editor_inspector-effect_header: "Inspecteur d'effet"
hint_editor_inspector-effect_scale-a: "La taille de la particule. Avec les variantes Aléatoire, c'est une des bornes de la plage dans laquelle chaque particule tire sa valeur"
hint_editor_inspector-effect_scale-b: "L'autre borne de la plage dans laquelle chaque particule tire sa taille"
hint_editor_inspector-effect_scale-curve-x: "La courbe qui donne la taille horizontale, indépendamment de la verticale"
hint_editor_inspector-effect_scale-curve-y: "La courbe qui donne la taille verticale, indépendamment de l'horizontale"
hint_editor_inspector-effect_scale-speed-range: "Plage de vitesses sur laquelle les deux courbes sont remappées - la vitesse qui correspond à leur début, et celle qui correspond à leur fin"
hint_editor_inspector-effect_scale-type: "Laquelle des cinq variantes de taille est utilisée. La changer remplace tout le sous-objet, donc les lignes ci-dessous sont celles de la nouvelle variante"
hint_editor_inspector-effect_scale_body: |-
  La taille d'une particule au fil de sa vie, dans les cinq mêmes variantes qu'<link="hint_editor_inspector-effect_angle"><color=#59A6FF>Angle</color></link>. <color=#D4B483>Courbe X</color> et <color=#D4B483>Courbe Y</color> sont lues indépendamment, donc une particule peut s'étirer tout en rétrécissant

  <color=#E8B04B><b>Avertissement :</b></color> la ligne sous les courbes sert à deux choses : la taille elle-même en Valeur et Aléatoire, la plage de vitesses en Selon la vitesse. La légende à côté indique laquelle

  Le bouton <b>réinitialiser</b> voisin réinitialise aussi <color=#D4B483>Type</color>, et emporte avec lui les deux courbes et la paire aléatoire

  Plus : <link="https://bullethero.space/fr/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Lisibilité</color></link>
hint_editor_inspector-effect_scale_header: "Échelle"
hint_editor_inspector-effect_shape-arc: "Part du bord réellement utilisée, en radians, mesurée dans le sens antihoraire depuis l'axe +X - moins d'un tour complet donne un éventail"
hint_editor_inspector-effect_shape-box-size: "Largeur et hauteur totales de la boîte d'émission, centrée sur l'objet d'effet"
hint_editor_inspector-effect_shape-circle-aspect: "Demi-axe vertical en multiple du rayon : 1 donne un cercle, toute autre valeur une ellipse"
hint_editor_inspector-effect_shape-circle-radius: "Distance du centre à l'anneau, le long de l'axe horizontal"
hint_editor_inspector-effect_shape-circle-thickness: "Jusqu'où l'anneau est rempli vers l'intérieur : 0 donne un simple contour, 1 un disque plein"
hint_editor_inspector-effect_shape-cone-base-radius: "Rayon du côté de l'émetteur"
hint_editor_inspector-effect_shape-cone-height: "Distance entre les deux extrémités - la profondeur du volume d'émission"
hint_editor_inspector-effect_shape-cone-top-radius: "Rayon à l'extrémité opposée. Plus grand que le rayon de base, il s'évase, plus petit, il se resserre en entonnoir"
hint_editor_inspector-effect_shape-line-end: "L'autre extrémité du segment"
hint_editor_inspector-effect_shape-line-start: "Une extrémité du segment, en coordonnées locales de l'objet d'effet"
hint_editor_inspector-effect_shape-spread: "Part de la forme parcourue avant de recommencer"
hint_editor_inspector-effect_shape-spread-speed: "Vitesse à laquelle avance le point d'émission - c'est elle qui fixe la vitesse de rotation visible"
hint_editor_inspector-effect_shape-spread-type: "Comment les particules successives parcourent la forme : au hasard, en boucle dans un sens, en aller-retour ou selon un sinus. C'est ce qui transforme un anneau fixe en motif qui tourne ou qui balaie"
hint_editor_inspector-effect_shape-torus-radius-major: "Rayon de l'anneau autour duquel le tube est courbé"
hint_editor_inspector-effect_shape-torus-radius-minor: "Rayon du tube lui-même - l'épaisseur de l'anneau"
hint_editor_inspector-effect_shape-type: "Le volume d'émission utilisé. Le changer remplace la forme, donc les champs ci-dessous sont ceux de la nouvelle forme, pas de l'ancienne"
hint_editor_inspector-effect_shape_body: |-
  Le volume d'émission : un point, un anneau, une boîte, un segment, un cône ou un tore. Il ne décide que du point de départ d'une particule, la suite relève de <link="hint_editor_inspector-effect_forces"><color=#59A6FF>Forces</color></link>

  Changer <color=#D4B483>Type</color> change les lignes ci-dessous, et ces lignes sont partagées entre les types. <color=#D4B483>Arc</color> est en radians, et moins d'un tour complet donne un éventail

  <color=#5EC8C8><b>Conseil :</b></color> <b>Ouverture</b> réglée sur Boucle donne l'émetteur rotatif classique

  Le bouton <b>réinitialiser</b> voisin réinitialise aussi <color=#D4B483>Type</color>, et emporte avec lui la forme

  Plus : <link="https://bullethero.space/fr/docs/editor/craft/composition-and-camera"><color=#59A6FF>Composition</color></link>
hint_editor_inspector-effect_shape_header: "Forme"
hint_editor_inspector-keyframe_body: |-
  <b>Toutes les pistes touchées par la sélection s'affichent en même temps</b>, pas seulement la dernière sur laquelle tu as cliqué. Une valeur vide signifie que les clés sélectionnées <b>divergent</b> sur ce point

  <color=#5EC8C8><b>Conseil :</b></color> le <b>Lissage</b> agit sur toutes les pistes à la fois et s'enregistre en <b>une seule étape d'annulation</b>

  <color=#B48CE0><b>Bon à savoir :</b></color> le champ <b>Image</b> est verrouillé quand plusieurs clés sont sélectionnées - un seul nombre les écraserait toutes sur la même image. Fais-les plutôt glisser sur la timeline

  Plus : <link="https://bullethero.space/fr/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Comment pense l'éditeur</color></link>
hint_editor_inspector-keyframe_header: "Inspecteur d'image clé"
hint_editor_inspector-object_body: |-
  Les champs propres à l'objet sélectionné. Chaque type affiche les champs communs d'un objet vide, et les objets Forme, Effet, Texte et Prefab ajoutent les leurs en dessous

  <b>Actif</b> désactive à la fois le rendu <i>et</i> la collision, et les enfants en héritent : un objet masqué ici ne peut pas tuer le joueur

  <color=#E86A5A><b>Attention :</b></color> le <b>Calque</b> est relatif au parent. Le calque global en lecture seule, juste à côté, est celui qu'utilise le rendu

  <color=#5EC8C8><b>Conseil :</b></color> un champ modifié sur un objet issu d'un prefab enregistre un <b>remplacement propre à l'instance</b> - la case à côté le signale et permet de l'annuler

  Plus : <link="https://bullethero.space/fr/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Comment pense l'éditeur</color></link>
hint_editor_inspector-object_header: "Inspecteur d'objet"
hint_editor_inspector-resolved_body: |-
  Ce que les objets sélectionnés <b>sont</b> sur l'image actuelle, lu dans la simulation en cours et non dans ce que tu as créé

  Le carré au bout d'une ligne indique l'état de l'image clé du champ : bleu - une clé sur cette image (clique sur le carré pour la sélectionner), ambre - interpolé entre deux clés, gris - hors des clés, la valeur est maintenue, vide - aucune clé, la valeur par défaut est utilisée. Les flèches amènent la tête de lecture sur la clé précédente ou suivante

  Sous le trait se trouvent les valeurs composées - le calque cumulé, l'état Actif hérité et la transformation composée avec celle des parents. Aucune image clé ne les fixe, elles n'ont donc pas d'indicateur

  Plus : <link="https://bullethero.space/fr/docs/editor/reference/object-properties"><color=#59A6FF>Propriétés de l'objet</color></link>
hint_editor_inspector-resolved_header: "Valeurs résolues"
hint_editor_inspector_audio-span-fit: "Étire la piste sur toute la partie de son clip qui tient avant la fin du niveau. Indisponible sans clip résolu, et à vitesse nulle, car une piste figée n'a pas de longueur à ajuster"
hint_editor_inspector_audio-span-fit-level: "Agrandit la piste et le niveau ensemble jusqu'à ce que tout le clip tienne. Le niveau ne fait que s'allonger, et un clip qui tient déjà ne change rien"
hint_editor_inspector_collider-id_body: |-
  Ce que cet objet <b>touche</b> - et c'est un choix distinct de ce qu'il dessine

  <color=#B48CE0><b>Bon à savoir :</b></color> l'un ne découle pas de l'autre, et c'est voulu : un rayon d'avertissement dessiné mais inoffensif, une hitbox plus simple que le dessin qu'elle protège, un mur invisible - tout cela est du contenu ordinaire, pas des astuces

  <color=#5EC8C8><b>Conseil :</b></color> les deux champs puisent dans les deux mêmes collections, donc une forme créée par un niveau peut servir à l'un, à l'autre ou aux deux

  Plus : <link="https://bullethero.space/fr/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Lisibilité et équité</color></link>
hint_editor_inspector_collider-id_header: "Collider"
hint_editor_inspector_ease_body: |-
  Comment la valeur arrive à cette image clé depuis la précédente

  <color=#B48CE0><b>Bon à savoir :</b></color> le lissage appartient au côté <b>entrant</b> d'une image clé, donc la première image clé d'une piste n'a rien à lisser et son choix ne s'affiche pas

  <color=#5EC8C8><b>Conseil :</b></color> avec plusieurs images clés sélectionnées, le choix s'applique à toutes en <b>une seule étape d'annulation</b>, même sur plusieurs pistes et objets. Un choix vide signifie qu'elles divergent

  Plus : <link="https://bullethero.space/fr/docs/editor/basics/keyframes-and-easing"><color=#59A6FF>Images clés et lissage</color></link>
hint_editor_inspector_ease_header: "Lissage"
hint_editor_inspector_global-layer: "L'ordre de dessin réellement utilisé par le rendu : le calque propre de cet objet plus celui de chaque ancêtre. En lecture seule, car il est calculé et non enregistré"
hint_editor_inspector_layer_body: |-
  Ordre de dessin, <b>relatif au parent</b> et non absolu

  <color=#E86A5A><b>Attention :</b></color> le rendu utilise ce nombre plus celui de chaque ancêtre, affiché en lecture seule dans <b>Global</b> ci-dessous. Changer de parent change l'endroit où un objet est dessiné, même si ce nombre reste le même

  <color=#B48CE0><b>Bon à savoir :</b></color> les valeurs aléatoires sont liées au calque effectif, donc déplacer un objet dans la hiérarchie les fait tirer à nouveau

  Plus : <link="https://bullethero.space/fr/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Comment pense l'éditeur</color></link>
hint_editor_inspector_layer_header: "Calque"
hint_editor_inspector_object-type: "Le genre de cet objet. Le changer REMPLACE l'objet : les champs communs sont gardés, et ce que le nouveau type ne peut pas accueillir est perdu"
hint_editor_inspector_parent: "L'objet que celui-ci suit. Un parent compose sa transformation sur celle de l'enfant, et les calques s'additionnent le long de la chaîne, donc changer de parent déplace aussi l'objet dans l'ordre de dessin"
hint_editor_inspector_shader-type_body: |-
  Le chemin de rendu que prend cet objet

  <color=#E86A5A><b>Attention :</b></color> <b>Auto</b> décide une seule fois, au chargement du niveau, et ne change jamais l'apparence du niveau : tout ce qu'il ne peut pas prouver opaque d'après l'alpha devient transparent

  <color=#5EC8C8><b>Conseil :</b></color> le libellé à côté de ce champ montre ce qu'Auto a réellement choisi, lu directement dans les données du rendu

  Plus : <link="https://bullethero.space/fr/docs/editor/performance/level-budget"><color=#59A6FF>Le budget du niveau</color></link>
hint_editor_inspector_shader-type_header: "Type de shader"
hint_editor_inspector_shape-id_body: |-
  Ce que cet objet <b>dessine</b>

  <color=#B48CE0><b>Bon à savoir :</b></color> une forme est une vraie géométrie ajustée à sa boîte, qui mesure exactement 1 sur son axe le plus long, donc le rectangle de l'objet est ce qui apparaît à l'écran. Le jeu en génère environ 500, et un niveau peut ajouter les siennes

  <color=#5EC8C8><b>Conseil :</b></color> laisser ce champ vide est valide : un objet qui ne dessine rien mais a un collider est un mur invisible

  Plus : <link="https://bullethero.space/fr/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Lisibilité et équité</color></link>
hint_editor_inspector_shape-id_header: "Forme"
hint_editor_inspector_span_body: |-
  Quand cet objet existe, sous forme de plage semi-ouverte : l'image de début est incluse, l'image de fin ne l'est pas. Un objet qui finit à 20 et un objet qui commence à 20 ne sont jamais dessinés tous les deux sur cette image

  <color=#B48CE0><b>Bon à savoir :</b></color> l'intervalle d'un enfant doit tenir dans celui de son parent, mais c'est résolu à la lecture, jamais enregistré. Réduis un parent et ses enfants sont rognés, agrandis-le de nouveau et ils reviennent. Un objet racine qui dépasse la fin du niveau n'est tout simplement jamais joué

  Les <b>ancres</b> font suivre à un bord le bord du parent, et décident de ce qui est joué : un enfant ancré s'étire avec un parent qui grandit. Son animation garde le timing que tu as créé

  Plus : <link="https://bullethero.space/fr/docs/editor/basics/frames-and-time"><color=#59A6FF>Images, temps et durée d'un niveau</color></link>
hint_editor_inspector_span_header: "Intervalle"
hint_editor_interop-report: "Ce qui a survécu ou non à une conversion depuis le format d'un autre jeu. Les entrées sont informatives : le niveau est déjà chargé, ceci indique en quoi il diffère de l'original"
hint_editor_level-export_body: |-
  Écrit ce niveau hors du jeu - sous forme de dossier ou d'une seule archive. Tout ce que le niveau utilise voyage avec lui, y compris un morceau situé hors du dossier du niveau

  Un simple <b>.zip</b> s'ouvre dans l'Explorateur Windows sans rien installer. Pas les options avec mot de passe : <b>+ mot de passe</b> s'ouvre dans 7-Zip ou tout autre archiveur, <b>(gpg)</b> s'ouvre avec gpg

  <color=#5EC8C8><b>Conseil :</b></color> tout ce qui n'a pas pu voyager - une ressource derrière une URL, un fichier que rien ne référence - est listé ensuite dans le rapport

  <color=#E8B04B><b>Avertissement :</b></color> un mot de passe n'est pas un DRM. Quiconque a le fichier et le mot de passe peut toujours l'ouvrir

  Plus : <link="https://bullethero.space/fr/docs/editor/workflow/sharing-by-hand"><color=#59A6FF>Partager un niveau à la main</color></link>
hint_editor_level-export_header: "Exporter le niveau"
hint_editor_level-protection_body: |-
  Chiffre le document de ce niveau sur le disque, donc ouvrir le niveau demande un mot de passe. Les métadonnées, la couverture et les médias restent lisibles, donc la carte du niveau s'affiche quand même

  Le mot de passe est demandé une fois par session et gardé en mémoire uniquement. Pour retirer la protection, laisse le champ vide et clique sur <b>Appliquer</b>

  <color=#E86A5A><b>Attention :</b></color> un mot de passe oublié ne peut pas être récupéré. Aucune clé n'est conservée nulle part

  Plus : <link="https://bullethero.space/fr/docs/editor/reference/export-and-protection"><color=#59A6FF>Export et protection</color></link>
hint_editor_level-protection_header: "Protéger le niveau"
hint_editor_prefab-flatten-recursive_body: |-
  Désactivé - seul le placement désigné cesse de suivre son modèle. Un prefab placé à l'intérieur garde son propre lien, donc modifier ce modèle interne touche toujours ce niveau. C'est la valeur par défaut

  Activé - tout ce qui est imbriqué est aussi aplati, et plus rien dans le niveau ne reste lié à ces modèles internes, à aucune profondeur

  Les modèles eux-mêmes restent dans le niveau dans les deux cas, et un aplatissement s'annule en une seule étape

  Plus : <link="https://bullethero.space/fr/docs/editor/reference/prefab-mode"><color=#59A6FF>Mode prefab</color></link>
hint_editor_prefab-flatten-recursive_header: "Aplatir aussi les prefabs imbriqués"
hint_editor_prefab-mode_body: |-
  <color=#E86A5A><b>Attention :</b></color> tu modifies le <b>modèle</b> d'un prefab, pas un de ses placements. L'enregistrement reporte la modification sur chaque placement qui renvoie à ce modèle

  Les modifications faites ici ne créent aucun remplacement par instance. Un remplacement ne vient que de la modification de l'objet d'un placement en dehors de ce mode

  <color=#5EC8C8><b>Conseil :</b></color> un placement dans ce modèle ouvre son propre modèle par-dessus, et "Enregistrer et fermer" te ramène ici. L'imbrication s'arrête à 8 niveaux

  Plus : <link="https://bullethero.space/fr/docs/editor/workflow/reuse"><color=#59A6FF>Réutiliser : prefabs, copie, générateurs</color></link>
hint_editor_prefab-mode_header: "Mode prefab"
hint_editor_search-palette_body: |-
  Deux modes. <b>Exécuter une commande</b> trouve n'importe quelle action de l'éditeur par son nom - les mêmes actions que lancent la barre d'outils et les menus contextuels. <b>Rechercher du contenu</b> trouve les objets de la portée actuelle et les pistes audio

  <color=#B48CE0><b>Bon à savoir :</b></color> les ressources ne figurent dans aucun des deux modes : chacune se choisit via le champ qui en a besoin

  Plus : <link="https://bullethero.space/fr/docs/editor/workflow/speed-and-shortcuts"><color=#59A6FF>Vitesse et raccourcis</color></link>
hint_editor_search-palette_header: "Palette de commandes"
hint_editor_search-picker: "Le sélecteur unique qu'utilise chaque champ de ressource. Tape pour classer la liste. Les filtres la restreignent par type, et la pastille à droite apparaît quand un champ n'accepte qu'un seul domaine"
hint_editor_theme-ref_body: |-
  Fais pointer cette couleur vers un <b>emplacement du thème du niveau</b> au lieu d'une valeur fixe. Quand le thème change, tout ce qui renvoie à l'emplacement change de style d'un coup

  <color=#5EC8C8><b>Conseil :</b></color> les échantillons montrent la palette à l'image de la clé que tu modifies, pas à la tête de lecture. Pour choisir selon un rendu plus tardif, modifie une clé placée plus loin

  Plus : <link="https://bullethero.space/fr/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>Couleur, thèmes et post-traitement</color></link>
hint_editor_theme-ref_header: "Référence à une couleur du thème"
hint_editor_timeline-audio_body: |-
  Les pistes audio du niveau avec leurs formes d'onde, pour caler le contenu sur ce que tu entends

  <color=#5EC8C8><b>Conseil :</b></color> <b>Ajuster la piste</b> dans l'inspecteur redimensionne une piste à la durée réelle de son clip. Le bouton est désactivé sans clip et à la vitesse 0

  <color=#E86A5A><b>Attention :</b></color> le curseur <b>Volume</b> de l'inspecteur est le fader de la piste. Le volume en images clés est une piste Volume séparée sur la timeline locale, et les deux se multiplient à la lecture

  Plus : <link="https://bullethero.space/fr/docs/editor/resources/preparing-the-track"><color=#59A6FF>Préparer la piste audio</color></link>
hint_editor_timeline-audio_header: "Timeline audio"
hint_editor_timeline-events_body: |-
  Les images clés à l'échelle du niveau, qui n'appartiennent à aucun objet :
  - position, rotation, zoom, pivot et tremblement de la caméra
  - marqueurs et checkpoints
  - la limite de l'écran
  - arrière-plan et thème
  - chaque effet de post-traitement
  - visibilité, contrôle, collision, taille et vitesse du joueur

  <color=#B48CE0><b>Bon à savoir :</b></color> la ligne <b>Pulsation</b> est l'exception ici. Ses éléments ont un intervalle, c'est donc la seule ligne sur laquelle agissent Bords et Ciseaux

  <color=#5EC8C8><b>Conseil :</b></color> une couleur peut renvoyer au thème du niveau au lieu de garder une valeur fixe. Un seul changement de thème recolore alors le tout

  Plus : <link="https://bullethero.space/fr/docs/editor/craft/composition-and-camera"><color=#59A6FF>Composition et caméra</color></link>
hint_editor_timeline-events_header: "Timeline des événements"
hint_editor_timeline-level_body: |-
  Un clip par objet, et la ligne où il se trouve est son <b>calque</b>. Un clip est l'<b>intervalle</b> de l'objet : les images 10-19 finissent exactement là où commence un clip qui démarre à 20

  <color=#B48CE0><b>Bon à savoir :</b></color> un enfant n'est joué qu'à l'intérieur de l'intervalle de son parent, mais rien n'est coupé de ce que tu as créé. Rallonge le parent et l'enfant revient

  <color=#5EC8C8><b>Conseil :</b></color> <b>Sélection</b> choisit et déplace, <b>Bords</b> remodèle un bord, <b>Ciseaux</b> coupe un clip au curseur. Fais un clic droit dans un espace vide pour le menu

  Plus : <link="https://bullethero.space/fr/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Comment pense l'éditeur</color></link>, <link="https://bullethero.space/fr/docs/editor/craft/composition-and-camera"><color=#59A6FF>Composition et caméra</color></link>
hint_editor_timeline-level_header: "Timeline du niveau"
hint_editor_timeline-local_body: |-
  Les images clés de l'<b>objet sélectionné</b>, une ligne par piste. Les images se comptent depuis le début de l'intervalle de l'objet, donc déplacer l'objet déplace toute son animation avec lui

  <color=#B48CE0><b>Bon à savoir :</b></color> une <b>piste vide est une donnée valide</b>. Elle utilise la valeur par défaut, c'est pourquoi un nouvel objet n'anime rien tant que tu n'ajoutes pas d'image clé

  Plus : <link="https://bullethero.space/fr/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Comment pense l'éditeur</color></link>
hint_editor_timeline-local_header: "Timeline locale"
hint_editor_timeline-prefab_body: |-
  La timeline propre au mode prefab, sur les objets du <b>modèle</b>. Sa durée est celle du modèle lui-même, pas l'intervalle d'un placement

  <color=#E8B04B><b>Avertissement :</b></color> la sélection n'est pas partagée avec le reste de l'éditeur. Les modifications faites ici changent le modèle et se propagent à tous ses placements

  Plus : <link="https://bullethero.space/fr/docs/editor/workflow/reuse"><color=#59A6FF>Réutiliser : prefabs, copie, générateurs</color></link>
hint_editor_timeline-prefab_header: "Timeline du prefab"
hint_editor_value-type-color: "D'où vient la couleur à chaque lecture. Valeur - telle qu'écrite. Thème - l'emplacement du thème à cette image, elle suit donc le thème. Aléat. min-max - chaque canal est tiré séparément, la couleur tombe donc n'importe où entre les deux. Aléat. de A à B - un seul tirage pour tous les canaux, la couleur se trouve donc toujours sur la ligne de A à B"
hint_editor_value-type-number: "Comment ce nombre est décidé à chaque lecture. Valeur - le nombre tel qu'écrit. Aléat. min-max - un nombre entre les deux bornes. Aléat. min-max, pas - pareil, aimanté à une grille de cette taille. Il n'y a pas de forme de A à B ici, car une composante tire déjà exactement un nombre. Une valeur aléatoire est adressée, pas tirée, donc le même niveau se joue pareil sur chaque appareil, et déplacer un objet ou changer son calque relance le tirage"
hint_editor_value-type-vector: "Comment ce vecteur est décidé à chaque lecture. Valeur - les nombres tels qu'écrits. Aléat. en rectangle - chaque axe est tiré séparément entre ses deux bornes et remplit le rectangle. Aléat. de A à B - UN seul tirage, lu par chaque axe au même endroit, donc le point parcourt la ligne droite de A à B. Un axe reste immobile quand il porte le même nombre aux deux bouts. Aléat. en cercle - un point sur un disque autour du centre. Les formes avec pas aimantent le résultat à une grille. Une valeur aléatoire est adressée, pas tirée, donc le même niveau se joue pareil sur chaque appareil"
hint_editor_video-export_audio: "Les pistes du niveau dans la vidéo, avec leurs images clés de volume et de panoramique"
hint_editor_video-export_body: |-
  Fait le rendu du niveau ouvert en vidéo via le ffmpeg installé sur cet ordinateur

  <color=#B48CE0><b>Bon à savoir :</b></color> le rendu se fait hors ligne, une image à la fois, donc la vidéo est exacte quelle que soit la lenteur de la machine. ffmpeg ne fait pas partie du jeu - installe-le une fois et cette fenêtre le trouve. Tu peux aussi lui indiquer un ffmpeg à la main
  Plus : <link="https://bullethero.space/fr/docs/editor/reference/video-export"><color=#59A6FF>Export vidéo</color></link>
hint_editor_video-export_bot: "Qui joue le niveau dans la vidéo. Reflex lit un instant à l'avance et ne demande aucune préparation. Warm calcule tout le parcours avant la première image. Les impacts n'ont aucun effet pendant un export"
hint_editor_video-export_codec: "Comment l'image ou le son est compressé dans le conteneur. Seul ce que ton ffmpeg sait produire est listé. La ligne en dessous indique quel codec audio va avec et quel fichier tu obtiens"
hint_editor_video-export_effects: "Les effets de particules du niveau dans la vidéo. Même interrupteur que dans l'éditeur, pour la vidéo seulement"
hint_editor_video-export_engine-audio: "Activé : si les pistes ont des effets, le son du niveau joue en temps réel pendant le rendu des images, et le son du jeu lui-même est enregistré, effets compris, pendant que les haut-parleurs restent muets. L'export dure au moins la longueur de la plage. Désactivé : les pistes sont mixées séparément, sans leurs effets. Son seulement mixe toujours séparément"
hint_editor_video-export_ffmpeg: "ffmpeg encode la vidéo et ne fait pas partie du jeu. Vert - trouvé et prêt, ambre - trop ancien, rouge - introuvable ou ne se lance pas. Choisir ffmpeg désigne un fichier à la main, Revérifier relance la recherche"
hint_editor_video-export_fps: "Images par seconde de la vidéo, jusqu'à 240, indépendamment de la fréquence d'images du niveau. En dessous de 60, chaque image est simulée en plusieurs pas, pour que le bot joue comme dans le jeu"
hint_editor_video-export_full-chroma: "La couleur pour chaque pixel au lieu d'un sur deux. Les fines lignes colorées restent nettes, le fichier grossit, et certains lecteurs le refusent"
hint_editor_video-export_header: "Exporter la vidéo"
hint_editor_video-export_output: "Où la vidéo est enregistrée. Par défaut, c'est recordings/[ID du niveau] dans le dossier de données du jeu, qui survit à la suppression du niveau"
hint_editor_video-export_post-processing: "Le post-traitement du niveau - bloom, étalonnage des couleurs, le reste - dans la vidéo. Même interrupteur que dans l'éditeur, pour la vidéo seulement"
hint_editor_video-export_preroll: "Secondes jouées avant le début mais non enregistrées, pour que les effets et les particules aient déjà leur historique sur la première image"
hint_editor_video-export_preset: "Le type de fichier. MP4 s'ouvre partout, MKV et MOV servent au montage, WebM est pour le web, GIF, WebP et APNG sont des clips courts sans son, une séquence d'images est un dossier d'images, Son seulement ne rend aucune image"
hint_editor_video-export_quality: "La place que prend la vidéo. Brouillon est léger et flou, Sans perte garde chaque pixel et pèse lourd"
hint_editor_video-export_range: "Quelle partie du niveau est enregistrée : tout le niveau, la plage de boucle de la timeline, ou tes propres images de début et de fin"
hint_editor_video-export_resolution: "Taille de la vidéo en pixels. Personnalisé accepte toute largeur et toute hauteur paires. La caméra du niveau est ajustée à l'intérieur, et des bandes noires remplissent le reste"
hint_editor_video-export_seed: "Graine de l'aléatoire du niveau. 0 garde celle qu'utilise l'éditeur en ce moment, tout autre nombre donne la même vidéo à chaque fois"
hint_editor_video-export_sound-after-frames: "Désactivé (par défaut) : le son avec effets est enregistré pendant le rendu des images, et l'export dure autant que le plus long des deux. Activé : le son est enregistré en temps réel après la dernière image, donc l'export s'allonge de la durée de la plage. Active-le quand le niveau est lourd et que le son enregistré saccade"
hint_gen_audio_waveform_body: |-
  Construit des objets qui suivent la forme d'une piste audio, pour que le niveau suive visiblement ce que tu entends

  Plus : <link="https://bullethero.space/fr/docs/editor/workflow/reuse"><color=#59A6FF>Réutiliser : prefabs, copie, générateurs</color></link>
hint_gen_audio_waveform_header: "Forme d'onde audio"
hint_gen_beat_flash_body: |-
  Place un flash sur chaque pulsation. Les pulsations viennent de la grille de pulsations du niveau, et de ses marqueurs s'il n'y a pas de grille - donc ce qui clignote est exactement ce que tu vois sur la grille

  Plus : <link="https://bullethero.space/fr/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>Rythme et structure</color></link>
hint_gen_beat_flash_header: "Flash sur la pulsation"
hint_gen_bullet_homing_body: |-
  Des balles qui s'incurvent vers l'endroit où le joueur devrait se trouver. La courbe est créée à l'avance, pas calculée à la lecture : le résultat reste identique sur chaque appareil

  Plus : <link="https://bullethero.space/fr/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Lisibilité et équité</color></link>
hint_gen_bullet_homing_header: "Balles à tête chercheuse"
hint_gen_bullet_laser_sweep_body: |-
  Un rayon qui balaie le terrain. Son avertissement et sa phase mortelle sont des objets séparés, donc l'avertissement peut être dessiné sans pouvoir tuer

  Plus : <link="https://bullethero.space/fr/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Lisibilité et équité</color></link>
hint_gen_bullet_laser_sweep_header: "Balayage laser"
hint_gen_bullet_rain_body: |-
  Des balles qui tombent sur une zone pendant un certain temps. La densité et l'ouverture sont des paramètres. L'endroit où chacune atterrit est tiré de la graine du niveau, donc une partie est reproductible

  Plus : <link="https://bullethero.space/fr/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Lisibilité et équité</color></link>
hint_gen_bullet_rain_header: "Pluie de balles"
hint_gen_bullet_spiral_body: |-
  Des balles émises le long d'un bras en rotation, ce qui donne le mur en spirale classique

  Plus : <link="https://bullethero.space/fr/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Lisibilité et équité</color></link>
hint_gen_bullet_spiral_header: "Spirale de balles"
hint_gen_bullet_wave_body: |-
  Une rangée de balles qui avancent ensemble. Le motif de base, et celui à lire en premier : ses paramètres nomment les idées que les autres générateurs de balles réutilisent

  Plus : <link="https://bullethero.space/fr/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Lisibilité et équité</color></link>
hint_gen_bullet_wave_header: "Vague de balles"
hint_gen_capacity_hint_body: |-
  Écrit les limites indicatives du niveau - combien d'objets et d'effets il compte utiliser en même temps

  <color=#B48CE0><b>Bon à savoir :</b></color> cela ne change rien de visible. Le moteur s'en sert pour réserver ses tampons à l'avance au lieu de les agrandir en plein niveau, ce qui provoquerait sinon une saccade

  Plus : <link="https://bullethero.space/fr/docs/editor/performance/level-budget"><color=#59A6FF>Le budget du niveau</color></link>
hint_gen_capacity_hint_header: "Indication de capacité"
hint_gen_font_cache_body: |-
  Rassemble chaque caractère qu'utilise vraiment le texte du niveau et le précalcule, pour qu'aucun glyphe ne doive être préparé à sa première apparition

  <color=#7FC97F><b>Recommandation :</b></color> lance-le une fois le texte définitif. Un caractère ajouté plus tard et non précalculé coûte une saccade au moment où il s'affiche pour la première fois

  Plus : <link="https://bullethero.space/fr/docs/editor/resources/images-and-fonts"><color=#59A6FF>Textures et polices</color></link>
hint_gen_font_cache_header: "Cache de police"
hint_gen_geometry_fractal_body: |-
  Répète une forme en elle-même à des échelles décroissantes. La profondeur coûte des objets de façon exponentielle, alors augmente-la un cran à la fois

  Plus : <link="https://bullethero.space/fr/docs/editor/workflow/reuse"><color=#59A6FF>Réutiliser : prefabs, copie, générateurs</color></link>
hint_gen_geometry_fractal_header: "Fractale"
hint_gen_geometry_grid_body: |-
  Remplit un rectangle de copies d'une forme régulièrement espacées

  Plus : <link="https://bullethero.space/fr/docs/editor/workflow/reuse"><color=#59A6FF>Réutiliser : prefabs, copie, générateurs</color></link>
hint_gen_geometry_grid_header: "Grille"
hint_gen_geometry_polygon_body: |-
  Place des formes autour des sommets ou des arêtes d'un polygone régulier

  Plus : <link="https://bullethero.space/fr/docs/editor/workflow/reuse"><color=#59A6FF>Réutiliser : prefabs, copie, générateurs</color></link>
hint_gen_geometry_polygon_header: "Polygone"
hint_gen_geometry_radial_body: |-
  Répartit des copies autour d'un cercle. La base de la plupart des motifs symétriques

  Plus : <link="https://bullethero.space/fr/docs/editor/workflow/reuse"><color=#59A6FF>Réutiliser : prefabs, copie, générateurs</color></link>
hint_gen_geometry_radial_header: "Radial"
hint_gen_geometry_spiral_body: |-
  Répartit des copies le long d'une spirale, le rayon et l'angle avançant ensemble

  Plus : <link="https://bullethero.space/fr/docs/editor/workflow/reuse"><color=#59A6FF>Réutiliser : prefabs, copie, générateurs</color></link>
hint_gen_geometry_spiral_header: "Spirale"
hint_gen_level_archive_body: |-
  Construit un niveau à partir d'une archive créée par ce jeu - un .tar.gz ou un .zip, l'un comme l'autre éventuellement protégé par un mot de passe. Le type est lu dans les octets, donc une archive renommée s'ouvre quand même. Une archive d'une version plus ancienne est migrée à l'import

  <color=#E8B04B><b>Avertissement :</b></color> par défaut, le niveau importé reçoit son propre ID, il ne peut donc pas écraser un niveau déjà présent sur cette machine. Désactive cette option uniquement pour récupérer un niveau que cette machine contenait auparavant

  Plus : <link="https://bullethero.space/fr/docs/editor/reference/generators"><color=#59A6FF>Générateurs</color></link>
hint_gen_level_archive_header: "Importer une archive de niveau"
hint_gen_level_audio_file_body: |-
  Démarre un niveau à partir d'une piste audio : importe l'audio, ajuste la durée du niveau à sa longueur et te laisse au début d'une timeline vide

  Plus : <link="https://bullethero.space/fr/docs/editor/resources/preparing-the-track"><color=#59A6FF>Préparer la piste audio</color></link>
hint_gen_level_audio_file_header: "Niveau depuis un fichier audio"
hint_gen_level_empty_body: |-
  Vide entièrement le niveau. Tout ce qui a été créé est supprimé, c'est donc le générateur à choisir pour repartir de zéro plutôt que pour modifier

  Plus : <link="https://bullethero.space/fr/docs/editor/basics/first-level"><color=#59A6FF>Ton premier niveau : le parcours</color></link>
hint_gen_level_empty_header: "Niveau vide"
hint_gen_section_additional: "Ajustements par-dessus les paramètres principaux. Les valeurs par défaut conviennent généralement"
hint_gen_section_main: "Les paramètres qui décident de ce que produit ce générateur. Commence ici"
hint_gen_test_camera_flash_body: "Un générateur de développement, gardé pour tester les pistes d'événements de la caméra. Pas destiné à la création de contenu"
hint_gen_test_camera_flash_header: "Flash de caméra (test)"
hint_gen_test_form_body: "Un générateur de développement qui met à l'épreuve chaque type de champ que le formulaire sait construire. Pas destiné à la création de contenu"
hint_gen_test_form_header: "Formulaire (test)"
hint_gen_test_odd_body: "Un générateur de développement qui regroupe des cas de paramètres volontairement bizarres. Pas destiné à la création de contenu"
hint_gen_test_odd_header: "Bizarre (test)"
hint_gen_test_partial_order_body: "Un générateur de développement qui vérifie comment sont disposés les champs que l'indication d'ordre ne mentionne pas. Pas destiné à la création de contenu"
hint_gen_test_partial_order_header: "Ordre partiel (test)"
hint_gen_test_scatter_body: "Un générateur de développement pour les chemins de l'aléatoire adressé. Pas destiné à la création de contenu"
hint_gen_test_scatter_header: "Dispersion (test)"
hint_gen_test_sections_body: "Un générateur de développement qui produit un formulaire en plusieurs sections. Pas destiné à la création de contenu"
hint_gen_test_sections_header: "Sections (test)"
hint_gen_test_spawn_body: "Un générateur de développement pour les chemins de création d'objets. Pas destiné à la création de contenu"
hint_gen_test_spawn_header: "Apparition (test)"
hint_gen_texture_objects_body: |-
  Transforme une texture en objets, un par cellule, pour qu'une illustration devienne du contenu du niveau, animable comme tout le reste

  Plus : <link="https://bullethero.space/fr/docs/editor/resources/images-and-fonts"><color=#59A6FF>Textures et polices</color></link>
hint_gen_texture_objects_header: "Objets depuis une texture"
hint_level-preview_authors: "Toutes les personnes créditées sur ce niveau. Les crédits voyagent dans le dossier du niveau, ils survivent donc à la mise en zip, à l'envoi et à la republication par quelqu'un d'autre"
hint_level-preview_licenses_body: |-
  Les conditions qui s'appliquent à ce niveau et à ses ressources. <b>Les conditions sont enregistrées par ressource</b>, donc un niveau fait de pièces empruntées dit exactement ce qui a été emprunté et à quelles conditions

  <color=#7FC97F><b>Recommandation :</b></color> lis-les avant de réutiliser quoi que ce soit du niveau de quelqu'un d'autre

  Plus : <link="https://bullethero.space/fr/docs/editor/rights/licensing-basics"><color=#59A6FF>Licences : l'essentiel en trois minutes</color></link>
hint_level-preview_licenses_header: "Licences"
hint_level_backups: "Chaque copie automatique de ce niveau, de la plus récente à la plus ancienne - le nom est le moment où elle a été prise. Rien n'est lu tant que tu n'en choisis pas une. La restauration remplace le fichier du niveau sur le disque et le recharge, et le fichier remplacé est d'abord écrit dans les sauvegardes, donc une restauration peut elle-même être annulée"
hint_level_collections_body: |-
  <b>Importer</b> fait entrer des entrées d'une collection dans ce niveau, <b>Assembler une collection</b> copie les ressources de ce niveau dans une collection. Tout ce dont une entrée a besoin vient avec elle, et un import s'annule en une seule étape

  <color=#E8B04B><b>Avertissement :</b></color> quand le niveau contient déjà une autre version d'une entrée, le jeu demande. Garde la version du niveau, ou importe celle de la collection comme copie avec un nouvel ID

  Plus : <link="https://bullethero.space/fr/docs/editor/reference/library-and-collections"><color=#59A6FF>Bibliothèque et collections</color></link>
hint_level_collections_header: "Collections"
hint_level_core-framerate: "Le modifier directement accélère ou ralentit tous les objets : les images clés gardent leurs numéros d'image, donc le même niveau se joue à une autre vitesse. Utilise le générateur pour transposer le contenu vers une autre fréquence d'images"
hint_level_core-level-id: "L'identifiant permanent de ce niveau, généré une seule fois à sa création et jamais modifié. Cite-le quand tu signales un problème avec le niveau, et utilise-le pour distinguer deux copies du même niveau"
hint_level_core-orientation_body: |-
  Dans quel sens ce niveau doit être tenu

  <b>Horizontale</b> et <b>Verticale</b> font pivoter l'appareil du joueur pendant le niveau et priment sur son propre paramètre. Sur ordinateur, un niveau vertical se joue entre deux bandes latérales, et c'est normal

  <b>Non précisée</b> laisse le choix au joueur, et c'est <b>affirmer</b> que le niveau se lit correctement dans les <b>deux</b> orientations. Rien n'est recadré ni mis à l'échelle pour autant, donc vérifie d'abord le niveau dans les deux sens

  Plus : <link="https://bullethero.space/fr/docs/editor/reference/level-settings"><color=#59A6FF>Paramètres du niveau</color></link>
hint_level_core-orientation_header: "Orientation du niveau"
hint_level_core-runtime-seed: "Ce sur quoi cette session de l'éditeur joue réellement en ce moment. Sans graine au-dessus, c'est un nouveau nombre à chaque chargement du niveau. \"Régénérer\" en tire une autre sans toucher au niveau"
hint_level_core-seed: "Chaque valeur aléatoire de ce niveau découle de cette graine, plus le calque et l'image de début propres à chaque objet, donc la même graine se joue toujours de la même façon. 0 signifie aucune graine : le jeu en génère une nouvelle à chaque lancement"
hint_level_core_body: |-
  Durée en images, fréquence d'images et les deux graines du niveau

  <color=#B48CE0><b>Bon à savoir :</b></color> <b>les images se comptent à partir de 1.</b> Un niveau de N images contient les images 1 à N, et N+1 est la limite de fin, pas une image

  <b>Graine du niveau</b> est propre au niveau, et sa modification peut être annulée. 0 signifie "une nouvelle graine à chaque partie" et c'est la valeur par défaut

  <color=#5EC8C8><b>Conseil :</b></color> <b>Graine d'exécution</b> montre ce que cette session de l'éditeur a résolu. <i>Régénérer</i> en tire une nouvelle pour la session seulement - rien n'est écrit et rien ne va dans l'historique d'annulation

  Plus : <link="https://bullethero.space/fr/docs/editor/basics/frames-and-time"><color=#59A6FF>Images, temps et durée d'un niveau</color></link>
hint_level_core_header: "Base"
hint_level_dangerous_body: |-
  Des actions qui détruisent ou réécrivent des fichiers plutôt que du contenu

  <color=#E86A5A><b>Attention :</b></color> les listes déroulantes de <b>format de fichier</b> réécrivent le niveau et ses métadonnées sur le disque. Réécrire dans un autre format <b>supprime le fichier laissé par l'ancien</b>. Rien d'autre ne se passe : pas de rechargement, pas de nouvelle simulation, pas de réinitialisation de ta sélection ni de ta pile d'annulation, car le modèle en mémoire est déjà exactement ce qui est écrit

  <color=#E86A5A><b>Attention :</b></color> <b>Supprimer</b> efface le dossier du niveau du disque. Cette action-là ne peut pas être annulée

  Plus : <link="https://bullethero.space/fr/docs/editor/workflow/not-losing-work"><color=#59A6FF>Ne pas perdre son travail</color></link>
hint_level_dangerous_header: "Zone dangereuse"
hint_level_effect-editor_body: |-
  Crée un effet de particules et prévisualise-le sur le canevas

  <color=#B48CE0><b>Bon à savoir :</b></color> les groupes de paramètres sont ceux que montre l'inspecteur d'effet, modifiés ici comme <b>brouillon</b> : rien n'atteint le niveau tant que tu n'enregistres pas

  <color=#5EC8C8><b>Conseil :</b></color> enregistre dans la bibliothèque partagée de l'appareil pour réutiliser l'effet d'un niveau à l'autre

  Plus : <link="https://bullethero.space/fr/docs/editor/performance/level-budget"><color=#59A6FF>Le budget du niveau</color></link>
hint_level_effect-editor_header: "Éditeur d'effet"
hint_level_font-cache: "Les glyphes que le niveau précalcule, pour que le texte ne se fige pas la première fois qu'un caractère apparaît - par police et par langue. Lecture seule : le générateur de cache de police le remplit à partir du texte que le niveau contient réellement, et rien dans cet onglet ne le modifie"
hint_level_history_body: |-
  Chaque modification de cette session est une ligne ici, la plus récente en haut, comme un git log. La colonne la plus à gauche est la ligne principale, une colonne à part est une branche que tu as quittée en annulant puis en prenant un autre chemin. L'anneau marque où tu es, le cercle vert le dernier enregistrement

  Cliquer sur une ligne ramène le niveau exactement à cet état, une opération par image. L'historique n'existe que dans cette session et n'est jamais écrit sur le disque

  <color=#E8B04B><b>Avertissement :</b></color> l'éditeur est en lecture seule pendant ce parcours. Annuler l'arrête là où il en est, et c'est toujours un état réel

  Plus : <link="https://bullethero.space/fr/docs/editor/reference/level-settings"><color=#59A6FF>Paramètres du niveau</color></link>
hint_level_history_header: "Historique"
hint_level_library-browser_body: |-
  Les ressources enregistrées sur <b>cet appareil</b>, partagées par tous les niveaux que tu ouvres ici

  <color=#B48CE0><b>Bon à savoir :</b></color> importer copie la ressource <i>dans le niveau</i>. Un niveau emporte tout ce dont il a besoin, donc la bibliothèque est une commodité pour toi, jamais une dépendance pour qui joue ton niveau

  Plus : <link="https://bullethero.space/fr/docs/editor/workflow/reuse"><color=#59A6FF>Réutiliser : prefabs, copie, générateurs</color></link>
hint_level_library-browser_header: "Bibliothèque"
hint_level_metadata-logo: "Copié dans le dossier du niveau sous le nom <color=#D4B483>logo.png</color> et affiché partout où le niveau apparaît dans une liste. Prévu pour un <color=#D4B483>PNG</color> carré de <color=#D4B483>512x512</color> - plus petit, il devient flou dans la liste, plus grand, il ne fait que prendre de la place. \"Retirer\" efface seulement la référence - le fichier lui-même reste dans le dossier"
hint_level_metadata-tags_body: |-
  Les tags sont tes propres mots, affichés exactement comme tu les écris et jamais traduits. Un joueur filtre par tags dans la liste des niveaux, donc un tag n'aide que si d'autres niveaux l'utilisent aussi

  Séparés par des virgules. Garde-les courts et généraux : un genre, une ambiance, une mécanique

  Plus : <link="https://bullethero.space/fr/docs/editor/reference/level-settings"><color=#59A6FF>Paramètres du niveau</color></link>
hint_level_metadata-tags_header: "Tags du niveau"
hint_level_metadata_body: |-
  Tout ce qui concerne le niveau sans être le niveau : nom, description, logo, licence, classification par âge et auteurs

  <color=#B48CE0><b>Bon à savoir :</b></color> le nom et la description sont des <b>textes localisés</b> - tu écris le texte de chaque langue directement ici, sans aucune clé, car un niveau est du contenu et non une partie de l'interface du jeu. Un joueur dont tu n'as pas renseigné la langue voit la première entrée que tu as renseignée

  La licence et les auteurs voyagent avec le niveau partout où il est partagé, et c'est ce qui permet aux crédits de survivre à une republication

  Plus : <link="https://bullethero.space/fr/docs/editor/reference/metadata-and-sharing"><color=#59A6FF>Métadonnées et partage d'un niveau</color></link>
hint_level_metadata_header: "Métadonnées"
hint_level_play-seed: "0 = utiliser la graine propre au niveau, ou une nouvelle à chaque partie"
hint_level_play_body: |-
  <color=#B48CE0><b>Bon à savoir :</b></color> options de lancement pour <b>cette partie uniquement</b> - rien ici n'est enregistré dans le niveau

  <color=#5EC8C8><b>Conseil :</b></color> vies, vitesse, checkpoints et niveau automatique te permettent de t'entraîner sur une section sans la modifier. La <b>graine</b> indiquée ici prime sur celle du niveau : c'est le plus haut des trois niveaux de priorité, et c'est elle qu'il faut utiliser pour rejouer exactement la partie que tu viens de voir

  Plus : <link="https://bullethero.space/fr/docs/editor/craft/difficulty-curve"><color=#59A6FF>Difficulté et courbe</color></link>
hint_level_play_header: "Jouer"
hint_level_publication_body: |-
  Tout ce qui envoie ce niveau quelque part. Choisis un moyen en haut, il affiche ses propres paramètres et vérifie le niveau tout seul. Une erreur dans le rapport bloque l'envoi, les avertissements et les conseils sont laissés à ton jugement

  <b>Archive</b> fonctionne partout. Un simple <b>.zip</b> s'ouvre dans l'Explorateur Windows sans rien installer. <b>+ mot de passe</b> s'ouvre dans 7-Zip ou tout autre archiveur, <b>(gpg)</b> s'ouvre avec gpg
  <b>Workshop Steam</b> n'existe que dans la version Steam et vérifie le niveau selon les règles du Workshop

  <color=#5EC8C8><b>Conseil :</b></color> publie d'abord sur le Workshop avec <b>Moi uniquement</b> et regarde l'élément avant de le montrer à tout le monde. Une deuxième publication met à jour le même élément

  <color=#E8B04B><b>Avertissement :</b></color> un mot de passe n'est pas un DRM. Quiconque a le fichier et le mot de passe peut toujours l'ouvrir

  Plus : <link="https://bullethero.space/fr/docs/editor/reference/publishing"><color=#59A6FF>Publication</color></link>
hint_level_publication_header: "Publication"
hint_level_raw-add: "Ajoute un élément à l'emplacement depuis lequel tu as ouvert cette fenêtre. Seuls les champs simples propres au nouvel élément sont proposés ici. Tout ce qui est imbriqué garde sa valeur par défaut et se modifie ensuite dans l'arbre"
hint_level_raw_body: |-
  Tout le modèle enregistré du niveau sous forme d'un seul arbre de champs - le fichier lui-même, avant que l'éditeur ne le traite

  <color=#E86A5A><b>Attention :</b></color> <b>rien ici n'est validé.</b> Tu peux y écrire une valeur que le reste de l'éditeur considère comme impossible, donc garde une copie du dossier du niveau sous la main

  Un point plein signifie que tu as modifié un champ pendant cette session, un point creux que quelque chose à l'intérieur a changé. <b>Appliquer</b> valide toute la session en une seule opération que tu peux annuler

  Plus : <link="https://bullethero.space/fr/docs/editor/workflow/not-losing-work"><color=#59A6FF>Ne pas perdre son travail</color></link>
hint_level_raw_header: "Données brutes"
hint_level_resource-meta_body: |-
  Titre, description, sources, licence et auteurs d'une ressource

  <color=#B48CE0><b>Bon à savoir :</b></color> c'est ainsi que l'attribution survit : une texture, une police ou un fichier audio pris ailleurs emporte d'où il vient et à quelles conditions, à l'intérieur du niveau, où que le niveau aille

  <color=#7FC97F><b>Recommandation :</b></color> remplis ces champs quand tu ajoutes la ressource - c'est le seul moment où tu t'en souviens encore

  Plus : <link="https://bullethero.space/fr/docs/editor/rights/resource-record"><color=#59A6FF>La fiche d'une ressource</color></link>
hint_level_resource-meta_header: "Métadonnées de la ressource"
hint_level_resources-audios: "Les fichiers audio que contient ce niveau. Ajoute-en un ici d'abord, puis place-le comme piste sur la timeline audio"
hint_level_resources-effects_body: |-
  Effets de particules <color=#D4B483>VFX Graph</color> que le niveau peut placer. Ils sont <b>facultatifs</b> : un niveau qui n'en utilise aucun se joue exactement comme prévu

  Un effet utilise l'aléatoire à graine du niveau, il se rejoue donc à l'identique sur n'importe quel appareil. Les effets peuvent être exportés vers la bibliothèque partagée de l'appareil

  Plus : <link="https://bullethero.space/fr/docs/editor/performance/level-budget"><color=#59A6FF>Le budget du niveau</color></link>
hint_level_resources-effects_header: "Effets"
hint_level_resources-fonts: "Les polices que contient ce niveau, pour ses objets Texte. Comme toute autre ressource, une police vit à côté du niveau et voyage avec lui"
hint_level_resources-prefabs_body: |-
  Des groupes d'objets réutilisables. Un prefab contient des objets modèles, et chaque placement en reçoit de vraies copies. Modifier le modèle atteint chaque placement, et un placement peut quand même différer grâce aux remplacements par instance

  <color=#E8B04B><b>Avertissement :</b></color> les prefabs n'ont <b>aucun préréglage fourni par le jeu</b>, contrairement aux thèmes, aux effets et aux colliders - la bibliothèque et les collections sont le moyen de faire passer un prefab d'un niveau à l'autre

  Plus : <link="https://bullethero.space/fr/docs/editor/workflow/reuse"><color=#59A6FF>Réutiliser : prefabs, copie, générateurs</color></link>
hint_level_resources-prefabs_header: "Prefabs"
hint_level_resources-shapes_body: |-
  Les formes propres au niveau, en plus des quelque 500 que génère le jeu. Une forme est une <b>vraie géométrie</b> ajustée à sa boîte englobante, donc le rectangle de l'objet est exactement ce qu'il dessine

  <color=#5EC8C8><b>Conseil :</b></color> une forme et un collider sont le même genre de données, et un objet pointe vers l'une pour ce qui est dessiné et vers l'autre pour ce qui est touché. Aucun ne découle de l'autre, donc un rayon d'avertissement inoffensif ou un mur invisible est du contenu ordinaire

  Plus : <link="https://bullethero.space/fr/docs/editor/resources/level-needs"><color=#59A6FF>Ce dont un niveau a besoin</color></link>
hint_level_resources-shapes_header: "Formes"
hint_level_resources-textures_body: |-
  Les textures que contient ce niveau. <b>Le jeu lui-même ne fournit aucune texture</b> - chaque texture utilisée par un niveau est ajoutée ici et vit dans le dossier du niveau, elle voyage donc avec lui

  <color=#B48CE0><b>Bon à savoir :</b></color> les formes ne sont <b>pas</b> des textures. Ce sont de vraies géométries, et elles n'ont besoin de rien dans cet onglet

  Plus : <link="https://bullethero.space/fr/docs/editor/resources/images-and-fonts"><color=#59A6FF>Textures et polices</color></link>
hint_level_resources-textures_header: "Textures"
hint_level_resources-themes_body: |-
  Un thème est une <b>palette vers laquelle les couleurs du niveau peuvent pointer</b> au lieu de contenir des valeurs fixes. Changer le thème actif recolore tout ce qui pointe vers lui, et ce changement se place en image clé sur la timeline des événements

  <color=#5EC8C8><b>Conseil :</b></color> exporte un thème vers la bibliothèque partagée de l'appareil pour le réutiliser dans d'autres niveaux

  Plus : <link="https://bullethero.space/fr/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>Couleur, thèmes et post-traitement</color></link>
hint_level_resources-themes_header: "Thèmes"
hint_level_rules_body: |-
  Ce que la validation a trouvé dans ce niveau : références cassées, ID en double, cycles de parents, prefabs imbriqués trop profondément, segments de pulsation qui se chevauchent

  Certains problèmes peuvent être réparés, un par un ou avec <b>Tout corriger</b>. Les réparations vont dans un brouillon : <b>Enregistrer</b> les applique en une seule opération que tu peux annuler, <b>Abandonner</b> les rejette. Les problèmes de graphe (ID, parents, imbrication des prefabs) n'ont pas de réparation - ce sont des décisions de contenu qui ne reviennent qu'à toi

  <color=#5EC8C8><b>Conseil :</b></color> un enfant qui dépasse de l'intervalle de son parent n'est <b>pas</b> signalé. Pour ajuster les durées de vie, lance le modificateur <color=#D4B483>Ajustement des intervalles</color> depuis les Générateurs

  Plus : <link="https://bullethero.space/fr/docs/editor/workflow/not-losing-work"><color=#59A6FF>Ne pas perdre son travail</color></link>
hint_level_rules_header: "Règles"
hint_level_shape-editor_body: |-
  Construis une forme à partir de points et des arêtes qui les relient. <b>Les triangles sont déduits, jamais modifiés</b>, donc un coin partagé par trois triangles est un seul point à faire glisser

  <color=#E8B04B><b>Avertissement :</b></color> le format stocke des triangles, pas des arêtes - une arête qui ne ferme aucune boucle est supprimée à l'enregistrement, et l'éditeur le signale

  Plus : <link="https://bullethero.space/fr/docs/editor/resources/images-and-fonts"><color=#59A6FF>Textures et polices</color></link>
hint_level_shape-editor_header: "Éditeur de formes"
hint_level_theme-editor_body: |-
  Les emplacements qu'un thème fournit et les couleurs qui les remplissent

  <color=#E86A5A><b>Attention :</b></color> le contenu du niveau pointe vers les emplacements, donc <b>les renuméroter change le style de tout ce qui y fait référence</b> - la position d'un emplacement est son identité

  <color=#5EC8C8><b>Conseil :</b></color> enregistre un thème terminé dans la bibliothèque partagée de l'appareil pour le réutiliser dans d'autres niveaux

  Plus : <link="https://bullethero.space/fr/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>Couleur, thèmes et post-traitement</color></link>
hint_level_theme-editor_header: "Éditeur de thèmes"
hint_menu_level-ai: "L'auteur a déclaré que l'IA a généré le niveau, sa couverture ou une de ses ressources. Les développeurs ne le vérifient pas - un niveau contient ce que son auteur y a écrit"
hint_menu_level-authors: "Qui a fait ce niveau, d'après la liste de ses propres métadonnées. Le bouton Auteurs ouvre la liste complète avec les liens"
hint_menu_level-bot_body: |-
  <b>Un bot joue le niveau à ta place, avec tes propres contrôles.</b> Il marche, fait des dashs, subit des dégâts et meurt comme toi, et il ne peut pas tricher : même vitesse, même dash, même hitbox

  <b>Reflex Bot v1</b> regarde 1,5 seconde en avant et esquive ce qu'il voit, en recalculant tout à chaque image. Il n'a besoin d'aucune préparation, donc la partie commence tout de suite. Ce qui le met en échec, c'est un motif dans lequel il fallait entrer une seconde plus tôt

  <b>Warm Bot v1</b> calcule son itinéraire à travers tout le niveau avant le début de la partie et vise zéro dégât

  <color=#E8B04B><b>Avertissement :</b></color> cet itinéraire est une étape de chargement en plus, et elle peut prendre des dizaines de secondes. Tu peux l'annuler et jouer le niveau toi-même

  <b>Ce n'est pas une garantie que le niveau soit terminé.</b> Un bot ne se fatigue jamais, mais il perd quand même. Il coûte aussi des performances à chaque image, donc attends-toi à moins d'images par seconde sur un appareil faible

  Un niveau qui bat un bot vaut la peine d'être envoyé : ouvre un ticket dans <link="https://github.com/bullet-hero/releases/issues"><color=#59A6FF>bullet-hero/releases</color></link>, indique quel bot a perdu et où, et joins le dossier du niveau

  Plus : <link="https://bullethero.space/fr/docs/editor/workflow/bot-playtest"><color=#59A6FF>Laisser un bot jouer ton niveau</color></link>
hint_menu_level-bot_header: "Bots"
hint_menu_level-checkpoints: "Si la partie compte les checkpoints placés par l'auteur. Activé, une mort ramène le niveau au dernier checkpoint atteint et restaure tes vies. Désactivé, elle te ramène au début. Les parties avec et sans checkpoints ont des records séparés"
hint_menu_level-identity: "Quel niveau c'est vraiment : la source où il a été trouvé, l'ID sous lequel ses statistiques sont classées, et le dossier qui le contient quand ce dossier ne porte pas le nom de l'ID. Un niveau intégré et une copie que tu en as faite partagent tout le reste de cet écran et diffèrent sur ces points"
hint_menu_level-lives: "Combien d'impacts la partie supporte. En Zen, les impacts et le recul ont toujours lieu, la partie ne se termine simplement jamais. Personnalisé accepte n'importe quel nombre que le curseur atteint. Sans collision est à part : rien ne te touche, et ces parties ont leurs propres records"
hint_menu_level-music: "Qui a écrit la musique, tel que les métadonnées du niveau l'enregistrent. Le bouton Licences contient toutes les autres ressources que le niveau transporte"
hint_menu_level-no-collision: "L'avatar traverse tout, donc rien ne peut le toucher. C'est distinct du Zen, où les impacts ont toujours lieu et la partie ne se termine simplement jamais. Les parties sans collision ont leurs propres records"
hint_menu_level-rating: "La classification d'âge déclarée par l'auteur. Les développeurs ne la vérifient pas - un niveau contient ce que son auteur y a écrit"
hint_menu_level-record: "Ton propre historique avec ce niveau, pour les options de lancement sélectionnées à droite. Change les vies, la vitesse, les checkpoints, le bot ou Sans collision et le record change avec eux : une partie dans d'autres conditions est une autre performance, donc chaque combinaison garde son propre meilleur résultat. Les essais et les réussites sont comptés à chaque partie, quels que soient les paramètres"
hint_menu_level-seed: "Le nombre d'où vient chaque valeur aléatoire du niveau. La même graine donne la même partie sur n'importe quel appareil, et 0 signifie que le niveau en tire une nouvelle à chaque fois"
hint_menu_level-speed: "La vitesse à laquelle le niveau et sa musique sont joués. Personnalisé accepte n'importe quelle vitesse que le curseur atteint, pas seulement les trois préréglages"
hint_mod_content_remover_body: |-
  Supprime le contenu du niveau qui correspond à ce que tu sélectionnes ici

  <color=#E86A5A><b>Attention :</b></color> il réécrit ce qui existe déjà au lieu d'y ajouter, donc lis les paramètres avant de le lancer : il n'y a qu'une étape d'annulation, mais c'est le seul retour en arrière

  Plus : <link="https://bullethero.space/fr/docs/editor/workflow/reuse"><color=#59A6FF>Réutiliser : prefabs, copie, générateurs</color></link>
hint_mod_content_remover_header: "Suppression de contenu"
hint_mod_framerate_remap_body: |-
  Remet à l'échelle chaque numéro d'image du niveau pour une autre fréquence d'images, afin que les timings tombent au même endroit en secondes qu'avant

  <color=#E8B04B><b>Avertissement :</b></color> les numéros d'image sont entiers, donc tout ce qui ne se divise pas exactement est arrondi - un niveau converti deux fois ne revient pas forcément à son point de départ

  Plus : <link="https://bullethero.space/fr/docs/editor/basics/frames-and-time"><color=#59A6FF>Images, temps et durée d'un niveau</color></link>
hint_mod_framerate_remap_header: "Conversion de fréquence d'images"
hint_mod_prefab_flatten_body: |-
  Transforme chaque placement de prefab de cette portée en objets ordinaires. Le lien vers le modèle disparaît, les objets restent exactement où ils étaient

  <color=#B48CE0><b>Bon à savoir :</b></color> le niveau a le même aspect ensuite - rien n'est supprimé ni déplacé, et les remplacements propres à chaque placement sont déjà écrits sur les objets. Les modèles restent dans le niveau, sauf si tu demandes de les retirer

  Plus : <link="https://bullethero.space/fr/docs/editor/reference/modifiers"><color=#59A6FF>Modificateurs</color></link>
hint_mod_prefab_flatten_header: "Aplatissement de prefabs"
hint_mod_quantize_keyframes_body: |-
  Aimante les images clés sur un pas régulier - c'est ainsi qu'une animation placée à la main sans rigueur se cale sur la pulsation

  <color=#E8B04B><b>Avertissement :</b></color> deux images clés qui tombent sur la même image fusionnent en une seule, donc une quantification grossière perd des détails au lieu de les compresser

  Plus : <link="https://bullethero.space/fr/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>Rythme et structure</color></link>
hint_mod_quantize_keyframes_header: "Quantification des images clés"
hint_mod_span_fit_body: |-
  Fait tenir les durées de vie des enfants dans celles de leurs parents, soit en resserrant les enfants, soit en étendant les parents

  <color=#B48CE0><b>Bon à savoir :</b></color> un enfant qui dépasse est une donnée valide qui est simplement jouée coupée, donc c'est une décision de contenu plutôt qu'une réparation - c'est pour ça que rien ne le lance à ta place. Les ancrages restent intacts dans les deux cas

  Plus : <link="https://bullethero.space/fr/docs/editor/basics/frames-and-time"><color=#59A6FF>Images, temps et durée d'un niveau</color></link>
hint_mod_span_fit_header: "Ajustement des intervalles"
hint_mod_span_stagger_body: |-
  Décale une sélection dans le temps pour que des objets qui commençaient ensemble arrivent l'un après l'autre

  Plus : <link="https://bullethero.space/fr/docs/editor/workflow/reuse"><color=#59A6FF>Réutiliser : prefabs, copie, générateurs</color></link>
hint_mod_span_stagger_header: "Échelonnement"
hint_mod_test_rename_body: "Un générateur de développement pour les chemins de renommage. Pas destiné à créer du contenu"
hint_mod_test_rename_header: "Renommer (test)"
hint_sandbox_attacks-auto: "Des vagues aléatoires automatiques, comme celles de l'arrière-plan du menu principal"
hint_sandbox_attacks-fire: "Chaque bouton lance sur toi une vague de cette attaque"
hint_sandbox_attacks-gap: "Secondes entre deux vagues quand elles viennent d'elles-mêmes"
hint_sandbox_controls-gyro: "Active le capteur de mouvement comme appareil de contrôle"
hint_sandbox_controls-mode: "Le mode de l'appareil avec lequel tu diriges l'avatar en ce moment - il est enregistré tout de suite et s'applique partout dans le jeu"
hint_sandbox_game-bot: "Confie l'avatar au bot qui joue en arrière-plan du menu principal"
hint_sandbox_game-free-camera: "Déplace la vue avec le bouton du milieu de la souris ou deux doigts, zoome avec la molette ou en pinçant. Le cadre montre ce que voit la caméra du niveau"
hint_sandbox_game-lives: "Les impacts avant une mort. Une mort se déroule comme dans un niveau et ramène l'avatar au centre"
hint_sandbox_game-speed: "Ralentit ou accélère seulement les attaques - l'avatar garde sa propre vitesse"
hint_sandbox_tutorial_body: |-
  Six étapes pour découvrir les contrôles. Chacune vérifie ce que tu as réellement fait. Un impact ou une mort ne fait recommencer que l'étape où il a eu lieu et la passe en rouge jusqu'à ce qu'elle soit réussie

  Appuie sur une étape pour la jouer, même une étape déjà réussie. Le tutoriel ne compte comme terminé qu'une fois toutes les étapes réussies

  <color=#E8B04B><b>Avertissement :</b></color> en <b>mode immortel</b>, les impacts ne sont pas comptés, donc le tutoriel ne les voit pas non plus

  Plus : <link="https://bullethero.space/fr/docs/game/sandbox"><color=#59A6FF>Bac à sable et tutoriel</color></link>
hint_sandbox_tutorial_header: "Tutoriel"
hint_settings_audio: "Le volume général, ce qu'un niveau joue dans le jeu et dans l'éditeur, et les sons propres de l'interface hors de l'éditeur de niveaux et dedans"
hint_settings_audio-editor-game: "Volume de ce qu'un niveau joue dans l'éditeur - le même niveau par le même chemin, mais écouté pendant des heures au lieu d'une fois, donc le volume du jeu reste tel quel"
hint_settings_audio-editor-ui: "Volume des sons propres de l'éditeur de niveaux. Il n'annonce que le résultat d'une modification - un enregistrement, un refus, une annulation, une suppression - jamais un simple appui"
hint_settings_audio-game: "Volume de ce qu'un niveau joue - sa musique et ses sons"
hint_settings_audio-ui: "Volume de l'interface hors de l'éditeur de niveaux : menus, navigateurs, paramètres"
hint_settings_audio-volume: "Volume général. Tous les autres volumes en dépendent"
hint_settings_controls_body: |-
  Comment tu diriges le joueur, par type d'appareil - clavier et souris, écran tactile, manette et gyroscope de l'appareil

  <color=#B48CE0><b>Bon à savoir :</b></color> plusieurs types peuvent être actifs en même temps - celui que tu as touché en <b>dernier</b> dirige, et un dash ou une pause fonctionne depuis n'importe lequel

  <color=#5EC8C8><b>Conseil :</b></color> le gyroscope est au repos quand le téléphone est posé <b>à plat</b>, écran vers le haut - incline-le pour te déplacer, et augmente la <b>Sensibilité</b> si tu dois trop l'incliner

  Plus : <link="https://bullethero.space/fr/docs/game/controls"><color=#59A6FF>Contrôles</color></link>
hint_settings_controls_header: "Contrôles"
hint_settings_game-editor-autosave: "Écrire une copie du niveau à intervalles réguliers. Elle n'écrase jamais ton niveau enregistré - les copies sont un filet de sécurité, pas un enregistrement"
hint_settings_game-editor-autosave-rate: "Secondes entre deux copies automatiques"
hint_settings_game-editor-camera-invert: "Si le glissement déplace le niveau avec le pointeur ou déplace plutôt la caméra. Chacun des deux paraît naturel à quelqu'un"
hint_settings_game-editor-camera-max-size: "Jusqu'où la vue de l'éditeur peut dézoomer"
hint_settings_game-editor-camera-min-size: "Jusqu'où la vue de l'éditeur peut zoomer"
hint_settings_game-editor-camera-sensitivity-x: "La distance que la vue parcourt horizontalement pour chaque unité de mouvement du pointeur"
hint_settings_game-editor-camera-sensitivity-y: "La distance que la vue parcourt verticalement pour chaque unité de mouvement du pointeur"
hint_settings_game-editor-camera-wheel-multiplier: "De combien un cran de la molette zoome"
hint_settings_game-editor-camera-zoom-to-mouse: "Zoomer vers le curseur au lieu du milieu de la vue. Désactivé, le centre reste fixe pendant le zoom"
hint_settings_game-editor-create-shape-size-x: "Largeur de départ d'une nouvelle forme, avant toute échelle propre"
hint_settings_game-editor-create-shape-size-y: "Hauteur de départ d'une nouvelle forme, avant toute échelle propre"
hint_settings_game-editor-create-text-size-x: "Largeur du bloc dans lequel un nouveau texte dispose ses glyphes, pas la taille des glyphes"
hint_settings_game-editor-create-text-size-y: "Hauteur du bloc dans lequel un nouveau texte dispose ses glyphes, environ une ligne par unité"
hint_settings_game-editor-effects-active-default: "Si les effets de post-traitement du niveau sont prévisualisés à l'ouverture de l'éditeur. C'est seulement l'état de départ - les désactiver pendant le travail ne le change jamais. Un téléphone démarre avec ces effets désactivés, car le post-traitement est ce que l'éditeur dessine de plus coûteux"
hint_settings_game-editor-gizmos-scale: "La taille des poignées de glissement dessinées dans la vue. Une poignée faite pour la souris est difficile à toucher avec le pouce"
hint_settings_game-editor-grid-active-default: "Si la grille de la vue est déjà activée à l'ouverture de l'éditeur. C'est seulement l'état de départ - désactiver la grille pendant le travail ne le change jamais"
hint_settings_game-editor-grid-opacity: "La visibilité de la grille. Une grille trop pâle pour être lisible n'est pas dessinée du tout"
hint_settings_game-editor-grid-size: "L'espacement de la grille de la vue, en unités du niveau"
hint_settings_game-editor-history-length: "Combien d'étapes d'édition la session garde avant que la branche la plus ancienne soit supprimée. Une valeur plus haute coûte de la mémoire, et rien d'autre"
hint_settings_game-editor-history-objects: "Les objets que l'historique garde en plus de ce nombre d'étapes. Une suppression massive est une seule étape qui en contient 50 000, et c'est ce que cette limite intercepte. 0 retire la limite, en dessous de 0 l'appareil décide"
hint_settings_game-editor-interface-dirty-field-delay: "Combien de temps un champ de l'inspecteur attend après ta dernière frappe avant de valider. Zéro valide à chaque frappe, et rend chacune annulable"
hint_settings_game-editor-interface-levels-layout: "Comment s'ouvre le navigateur de niveaux de l'éditeur : une liste de lignes avec descriptions ou une grille de couvertures. Le bouton à côté du champ de recherche le change toujours, jusqu'à ce que tu fermes l'éditeur"
hint_settings_game-editor-interface-log-clamps: "Signaler dans la console quand une valeur saisie a été ramenée dans sa plage autorisée. La limitation a lieu dans tous les cas"
hint_settings_game-editor-interface-rotation-unit: "L'unité dans laquelle les champs de rotation sont affichés et saisis. Les angles sont toujours stockés en radians"
hint_settings_game-editor-level-serialize-mode: "Le format de fichier dans lequel un niveau est écrit. <b><color=#D4B483>Json</color></b> est du texte - lisible et réparable à la main. <b><color=#D4B483>Blob</color></b> est binaire - des dizaines de fois plus rapide à charger, et presque irréparable une fois endommagé"
hint_settings_game-editor-max-autosave-files: "Combien de copies sont conservées. La plus ancienne est supprimée quand la limite est atteinte"
hint_settings_game-editor-mcp-enabled: "Permet à un assistant IA compatible MCP de se connecter à cet éditeur et de modifier le niveau ouvert. Seul cet ordinateur peut se connecter, et tout ce que l'IA fait en un lot est une seule étape de l'historique"
hint_settings_game-editor-mcp-follow-ai: "Où va la tête de lecture après que l'IA a regardé une image. Désactivé : elle revient là où tu l'as laissée. Activé : elle reste sur l'image que l'IA a regardée, en pause. Si tu touches la timeline pendant que l'IA regarde, la tête de lecture reste là où tu l'as mise"
hint_settings_game-editor-mcp-operation-delay: "Combien de temps l'éditeur attend entre deux opérations de l'IA, pour que tu puisses les suivre. <b><color=#D4B483>0</color></b> applique chacune immédiatement. Lire, mettre en pause et déplacer la tête de lecture ne sont jamais retardés. De 0 à 5"
hint_settings_game-editor-mcp-port: "Le port sur lequel l'éditeur écoute. <b><color=#D4B483>0</color></b> en choisit un libre à chaque démarrage. Sinon <b><color=#D4B483>1024-65535</color></b>"
hint_settings_game-editor-mcp-reveal-edits: "Après chaque modification de l'IA, sélectionne et localise ce qu'elle a créé ou modifié. Jamais pendant que tu fais glisser, tapes ou joues"
hint_settings_game-editor-multi-select-requires-hold: "Si l'ajout à une sélection demande un maintien volontaire. Activé est plus sûr sur écran tactile, où sinon un appui accidentel change la sélection"
hint_settings_game-editor-pick-invisible-aabb: "Permettre à un clic de sélectionner un objet qui ne dessine rien. Nécessaire pour les murs invisibles, qui ont une hitbox et aucune forme"
hint_settings_game-editor-player-active-default: "Si le joueur de test est déjà là à l'ouverture de l'éditeur. Sur écran tactile, il prend aussi la vue, donc sur un téléphone on préfère en général le désactiver"
hint_settings_game-editor-player-bot: "Confie le joueur d'aperçu à <color=#D4B483>Reflex Bot v1</color> plutôt qu'à toi. C'est le seul bot proposé ici, car il n'a besoin d'aucune préparation à l'avance et continue de fonctionner pendant que tu modifies - à n'importe quelle vitesse de lecture, à l'envers compris. Il joue selon les mêmes règles que toi : il subit des dégâts et peut être coincé. Juste après un balayage, il joue moins bien un instant, le temps de reconstruire ce qu'il sait du futur. Le choix du bot se fait au lancement d'une partie, dans l'onglet Jouer de cet écran"
hint_settings_game-editor-player-bot-debug: "L'interrupteur principal des superpositions de diagnostic du bot. Désactivé par défaut. Tout ce qui est en dessous est activé, donc l'ouvrir donne tout de suite la vue d'ensemble"
hint_settings_game-editor-player-bot-debug-grid: "Dessine l'espace que le bot pense avoir dans chaque zone de l'écran, dans le pire cas sur tout ce qu'il voit devant lui. Le rouge marque un endroit où il s'attend à être touché. Rien n'est dessiné là où il se considère en sécurité"
hint_settings_game-editor-player-bot-debug-reach: "Dessine jusqu'où le bot pense pouvoir aller avant la fin de la fenêtre sur laquelle il planifie - l'anneau intérieur en marchant, l'extérieur en utilisant le dash. Il ne choisit jamais de cible en dehors"
hint_settings_game-editor-player-bot-debug-target: "Dessine le point vers lequel le bot se dirige en ce moment. Il s'en tient à un choix jusqu'à ce qu'un nettement meilleur apparaisse, donc une cible qui ne bouge plus veut dire que le bot est satisfait, pas bloqué"
hint_settings_game-editor-player-reset-gizmos: "Abandonner le mode de gizmo actif quand le joueur de test est activé, pour qu'aucune poignée de glissement ne reste sous ton doigt"
hint_settings_game-editor-preview-collider-on-select: "Afficher la hitbox d'un objet sélectionné. Ici, ce qui est dessiné et ce qui est touché sont deux choses distinctes, donc elles peuvent différer"
hint_settings_game-editor-publish-language: "La langue dans laquelle le titre et la description d'un élément du Workshop sont publiés en premier. <b><color=#D4B483>Anglais</color></b>, ou <b><color=#D4B483>Système</color></b> - la langue de l'appareil"
hint_settings_game-editor-resources-serialize-mode: "Le même choix pour les ressources qu'un niveau transporte"
hint_settings_game-editor-selection-collider-opacity: "L'opacité avec laquelle la hitbox d'un objet sélectionné est dessinée"
hint_settings_game-editor-selection-collider-opacity-view: "La même chose pour l'affichage qui montre toutes les hitboxes à la fois - plus pâle, car des centaines s'y superposent"
hint_settings_game-editor-selection-long-press-delay: "Combien de temps une ligne ou un clip doit être maintenu avant de passer en sélection multiple. Augmente-le si des sélections se font par accident"
hint_settings_game-editor-selection-long-press-threshold: "De combien le pointeur peut dériver pendant ce maintien avant que ça compte comme un glissement. Augmente-le si ta main tremble"
hint_settings_game-editor-timeline-edge-handle: "La largeur du bord d'un clip qui le redimensionne. Le reste du clip le fait glisser"
hint_settings_game-editor-timeline-loop-global: "Si la tête de lecture revient au début à la fin du niveau au lieu de s'arrêter"
hint_settings_game-editor-timeline-loop-local: "La même chose pour la timeline locale, qui répète la durée de vie d'un seul objet"
hint_settings_game-editor-timeline-snap-threshold: "À quelle distance un bord déplacé doit arriver avant de s'aimanter sur une image candidate"
hint_settings_game-editor-timeline-time-format: "Ce que comptent la règle d'une timeline et l'affichage de la tête de lecture. Ça ne change rien dans le niveau - la même image est désignée dans tous les cas. Mesures et pulsations lit la grille de pulsations propre au niveau et revient à un timecode partout où la grille n'a pas de segment"
hint_settings_game-editor_body: |-
  <b>Enregistrement auto</b> enregistre le niveau à intervalles réguliers et écrit chaque fois une copie de sauvegarde. <b>Nombre max de sauvegardes auto</b> limite le nombre de copies conservées

  <b>Taille min de la caméra</b> et <b>Taille max de la caméra</b> limitent le zoom de la vue. <b>Sélection multiple avec maintien</b> et <b>Sélection par AABB invisible</b> changent ce que signifie un clic dans la vue

  Les deux champs de format, <b>Format des niveaux</b> et <b>Format des ressources</b>, fixent le format d'écriture sur le disque par défaut

  Plus : <link="https://bullethero.space/fr/docs/editor/workflow/speed-and-shortcuts"><color=#59A6FF>Vitesse et raccourcis</color></link>
hint_settings_game-editor_header: "Éditeur"
hint_settings_general: "La langue, et combien de ressources le jeu charge à la fois. Une <b>Langue</b> laissée vide suit l'appareil"
hint_settings_general-language: "La langue de l'interface. Laissée vide, elle suit celle de l'appareil. Elle n'affecte pas le texte propre d'un niveau, que le niveau transporte lui-même"
hint_settings_general-resource-parallel-load-count: "Combien de fichiers d'un niveau se chargent à la fois. Une valeur plus haute finit plus vite sur un disque rapide et peut provoquer des saccades sur un disque lent"
hint_settings_general-resource-web-timeout: "Combien de secondes attendre un fichier récupéré par le réseau avant d'abandonner"
hint_settings_general-show-all-found-content: "Lister aussi le contenu qu'une source a trouvé mais ne peut pas confirmer comme le tien - les fichiers d'un élément du Workshop dont l'abonnement a été annulé, ou un dossier copié à la main. Ces niveaux sont marqués sur leur carte. Désactivé, une source ne liste que ce dont elle se porte garante"
hint_settings_graphics-antialiasing-hdr: "Les valeurs de couleur au-dessus de 1. Rien ici n'en a besoin, et cela double la bande passante mémoire, donc c'est désactivé par défaut"
hint_settings_graphics-antialiasing-msaa: "Combien d'échantillons <color=#D4B483>MSAA</color> prend par pixel. Une valeur plus haute lisse mieux et coûte plus, et le coût augmente avec la quantité de contenu transparent qui se superpose"
hint_settings_graphics-antialiasing-type: "Comment les bords sont adoucis. <b><color=#D4B483>MSAA</color></b> les traite exactement, car chaque forme ici est une vraie géométrie. <b><color=#D4B483>FXAA</color></b> coûte une passe quoi que fasse la scène, et c'est le compromis d'un téléphone peu puissant"
hint_settings_graphics-audio-pitch-correction: "La force avec laquelle la vitesse de l'audio est infléchie pour rattraper la simulation. Plus haut, la correction arrive plus tôt et s'entend davantage"
hint_settings_graphics-audio-render: "Lire l'audio du niveau tout court. Désactivé, chaque niveau tourne en silence et les paramètres audio ci-dessous ne comptent plus - pour un appareil auquel le son lui-même pèse trop"
hint_settings_graphics-audio-render-effects: "Appliquer les effets audio de la piste pendant l'édition. Désactivé, tu entends le clip brut"
hint_settings_graphics-audio-resync-jump-time: "L'écart toléré entre l'audio et la simulation avant que l'audio soit remis en place d'un saut au lieu d'être ajusté en douceur"
hint_settings_graphics-audio-scrub-time: "La durée du fragment entendu quand tu fais glisser la tête de lecture le long de la piste"
hint_settings_graphics-audio-sync-dead-zone: "Un décalage plus petit que cette valeur est ignoré. Sans zone morte, l'audio serait corrigé en permanence, et ça s'entendrait"
hint_settings_graphics-audio-use-scrub: "Lire l'audio sous la tête de lecture pendant que tu la fais glisser, pour trouver un moment à l'oreille"
hint_settings_graphics-avatar-render: "Le corps de l'avatar est une grille de 25 carrés, et la santé perdue les éteint du bord vers l'intérieur le long de quelques fissures - une partie qui tourne mal se voit donc sur le joueur plutôt que sur une barre. Un carré perdu reste comme un fantôme pâle, et l'anneau de la hitbox, en dessous, transparaît à travers lui. Désactivé, la grille devient un seul carré et la santé le fait pâlir à la place : même lecture, un objet au lieu de 25, pour un appareil qui préfère ne pas les dessiner"
hint_settings_graphics-colliders-mode-active: "Un mode d'entraînement. Un niveau joué dessine chaque hitbox en aplat sur un fond uni, et rien d'autre : décorations, textes, effets, post-traitement et arrière-plan du thème disparaissent. Tout ce qui décide de la partie reste - la musique, la collision, la caméra et son tremblement, les checkpoints, l'interface de jeu et les statistiques - et une partie ici compte comme n'importe quelle autre. Seulement l'écran de jeu : l'éditeur et le bac à sable s'affichent comme d'habitude"
hint_settings_graphics-colliders-mode-background: "Ce qui est dessiné derrière les aplats. Il est gris foncé et non noir exprès : les bandes autour du cadre de la caméra sont noires, et un fond noir cacherait où s'arrête le cadre du niveau"
hint_settings_graphics-colliders-mode-color: "La couleur dont le mode remplit chaque hitbox. La vue des colliders de l'éditeur prend la même teinte avec sa propre opacité, donc les deux concordent toujours. \"Réinitialiser les graphismes\" rétablit le rouge d'origine"
hint_settings_graphics-colliders-mode-use-alpha: "Activé, les aplats sont translucides selon l'alpha de la couleur, et deux dangers qui se chevauchent forment une zone plus sombre. Désactivé, chaque aplat est opaque - plus lisible sur un petit écran, mais les chevauchements se fondent en une seule forme. En jeu, l'alpha ne descend jamais sous 0.15, car plus pâle, on ne voit plus rien"
hint_settings_graphics-effects-fixed-framerate: "La fréquence à laquelle les effets sont simulés, indépendamment de la fréquence à laquelle ils sont dessinés"
hint_settings_graphics-effects-frame-step-budget: "Combien de pas d'effets une seule image peut consommer, pour que le rattrapage ne coûte jamais un blocage visible"
hint_settings_graphics-effects-framerate-target: "La fréquence à laquelle les effets sont dessinés. Plus bas que la fréquence du jeu lui-même, c'est une économie peu coûteuse, car les particules restent lisibles avec un pas plus grossier"
hint_settings_graphics-effects-max-scrub-time: "Quelle part de l'historique des effets l'éditeur rejoue quand tu fais sauter la tête de lecture. Plus long, c'est plus précis et plus lent"
hint_settings_graphics-effects-render: "Dessiner les effets de particules tout court. Ils enrichissent un niveau, mais aucun niveau n'en dépend, c'est donc un sacrifice sans risque"
hint_settings_graphics-effects-replay-step-budget: "Combien de pas de simulation une seule relecture peut consommer. C'est ce plafond qui empêche un saut dans une section dense de figer l'éditeur"
hint_settings_graphics-fixed-framerate: "La limite que le jeu tient tant que \"Cible de fréquence d'images\" est sur \"Fixe\" - la fréquence à laquelle l'écran est redessiné, et rien d'autre. Un niveau est simulé en temps réel, donc la même partie se joue à l'identique à 30 et à 144. Ignorée tant que VSync est activée"
hint_settings_graphics-framerate-target: "Le nombre d'images par seconde que vise le jeu. Appliqué directement plutôt que par la synchronisation verticale"
hint_settings_graphics-postprocessing-render: "L'interrupteur général de tous les effets de caméra ci-dessous. Désactivé, toute la pile est ignorée"
hint_settings_graphics-postprocessing-render-analog-glitch: "Interférences analogiques : bandes qui défilent, lignes de balayage déchirées, bavures de couleur"
hint_settings_graphics-postprocessing-render-bloom: "Les zones claires débordent de lumière sur ce qui les entoure"
hint_settings_graphics-postprocessing-render-chroma: "Les canaux de couleur se séparent vers les bords de l'écran, comme avec un objectif bon marché"
hint_settings_graphics-postprocessing-render-color-curves: "Courbes de couleur par canal, pour un étalonnage fin"
hint_settings_graphics-postprocessing-render-digital-glitch: "Corruption numérique : blocs décalés, comme si les images étaient endommagées"
hint_settings_graphics-postprocessing-render-grain: "Du grain de film sur l'image"
hint_settings_graphics-postprocessing-render-lens: "L'image est déformée comme le ferait un vrai objectif"
hint_settings_graphics-postprocessing-render-lift-gamma-gain: "Étalonnage réparti en trois zones : ombres, tons moyens et hautes lumières"
hint_settings_graphics-postprocessing-render-motion-blur: "Les mouvements rapides laissent une traînée. À désactiver si les balles deviennent plus difficiles à lire"
hint_settings_graphics-postprocessing-render-shadows-midtones-highlights: "Les mêmes trois zones, mais teintées séparément plutôt que relevées"
hint_settings_graphics-postprocessing-render-vignette: "Les bords de l'écran s'assombrissent et attirent l'attention vers le centre"
hint_settings_graphics-postprocessing-render-white-balance: "Déplace ce qui compte comme blanc, pour réchauffer ou refroidir toute l'image"
hint_settings_graphics-render-scale: |-
  Combien de pixels le jeu rend lui-même avant que le résultat soit mis à l'échelle de la fenêtre

  En dessous de 1, le jeu dessine moins de pixels et les étire - le levier le plus efficace à baisser sur une machine faible, car le coût des fragments baisse avec le <b>carré</b> de cette valeur. Au-dessus de 1, il rend plus grand et réduit le résultat, c'est du suréchantillonnage

  L'interface est dessinée dans sa propre cible en taille réelle dans tous les cas, donc le texte et les boutons restent nets quelle que soit cette valeur. Le nombre multiplie l'échelle avec laquelle cette classe d'appareils est déjà livrée, au lieu de la remplacer
hint_settings_graphics-resolution: |-
  La taille de la fenêtre du jeu en pixels, proposée parmi les modes que cet écran déclare réellement - rien ici ne peut donc demander un mode que le moniteur ne sait pas afficher

  C'est aussi le moyen de changer d'orientation sur ordinateur : une résolution plus haute que large fait passer l'interface à la même disposition verticale qu'un téléphone tenu debout. Un moniteur ne peut pas être tourné depuis le jeu, donc ce paramètre et la taille de la fenêtre sont les seuls leviers possibles

  Sans y toucher, c'est la résolution native de l'écran qui est utilisée
hint_settings_graphics-textures-compression: "Convertit les textures dans un format <color=#D4B483>compressé</color> au chargement. Quatre à huit fois moins de mémoire, et des artefacts de blocs là où un dégradé ou un bord net tombe sur un bloc 4x4. Lu au chargement d'un niveau, pas pendant qu'un niveau est ouvert"
hint_settings_graphics-textures-compression-quality: "Temps de chargement contre artefacts de compression. La texture finit à la même taille dans tous les cas, et les téléphones ignorent complètement ce paramètre"
hint_settings_graphics-textures-filtering: "Comment les textures sont échantillonnées au moment du dessin, et rien d'autre - la réduction d'une texture dépend de ce que son auteur en a dit, pas de ce paramètre"
hint_settings_graphics-textures-mipmaps: "Des copies réduites de chaque texture, pour qu'une texture dessinée en petit cesse de scintiller en bougeant. Un tiers de mémoire en plus, et le seul remède à ce scintillement"
hint_settings_graphics-textures-size-limit: "La taille maximale d'une texture en mémoire sur cet appareil. La mémoire baisse avec le CARRÉ du côté, donc on économise plus qu'avec la compression, et c'est le seul des trois paramètres qui borne vraiment ce qu'un niveau peut coûter"
hint_settings_graphics-vsync: |-
  Si le jeu attend le rafraîchissement de l'écran avant d'afficher une image

  <b>Désactivée</b> affiche chaque image dès qu'elle est prête. Rien n'attend, donc l'entrée arrive à l'écran à la première occasion - et une image terminée en plein rafraîchissement est dessinée à moitié par-dessus la précédente, c'est le déchirement

  <b>Activée</b> présente une image par rafraîchissement : plus de déchirement, et chaque image coûte jusqu'à un rafraîchissement de latence en plus. <b>Demi-fréquence</b> présente une image tous les deux rafraîchissements - plus stable sur une machine qui ne tient pas la fréquence complète, pour le double de latence

  Tant que ce n'est pas Désactivée, Unity ignore complètement la limite de fréquence d'images au-dessus, d'où ces deux lignes grisées

  Un téléphone affiche à son propre rythme, et ce paramètre n'y fait rien
hint_settings_graphics-window-mode: |-
  Comment la fenêtre du jeu occupe l'écran

  <b>Fenêtré</b> est le seul mode que tu peux redimensionner librement, et c'est le redimensionnement qui change les proportions du jeu - étire la fenêtre plus haute que large et toute l'interface passe à sa disposition verticale, exactement comme un téléphone tenu debout

  <b>Fenêtre sans bordure</b> est le mode par défaut : l'écran rempli, sans changement de mode et avec un alt-tab instantané. <b>Plein écran exclusif</b> confie l'écran entièrement au jeu, un peu plus rapide, mais plus lent à quitter

  Un téléphone n'a qu'une fenêtre, et c'est l'écran, donc ce paramètre n'y fait rien
hint_settings_graphics_body: |-
  <b>Antialiasing.</b> <color=#D4B483>MSAA</color> est la valeur par défaut, car chaque forme de ce jeu est une vraie géométrie, donc chaque bord crénelé est un vrai bord géométrique - le seul cas que le multiéchantillonnage corrige exactement, en pleine netteté, sur toutes les plateformes. <b><color=#D4B483>FXAA</color></b> est l'alternative pour les téléphones peu puissants : il coûte une passe plein écran quel que soit le surdessin du niveau, alors que le coût de <color=#D4B483>MSAA</color> augmente avec le surdessin transparent. <b>TAA n'est volontairement pas proposé</b> - les traînées derrière les balles rapides nuisent à la lisibilité dans ce genre, et sa gigue entre en conflit avec les effets de glitch

  <b>Fréquence d'images.</b> La cible est appliquée manuellement plutôt que par la VSync. La fréquence fixe découple la simulation de l'affichage, et c'est ce qui garde le timing d'un niveau identique sur un écran 60 Hz comme sur un écran 144 Hz

  <color=#7FC97F><b>Recommandation :</b></color> une <b>échelle de rendu</b> sous 1 est le sacrifice le moins cher quand un appareil peine : elle coûte de la netteté et rien d'autre

  Plus : <link="https://bullethero.space/fr/docs/editor/performance/mobile-devices"><color=#59A6FF>Appareils mobiles</color></link>
hint_settings_graphics_header: "Graphismes"
hint_settings_interface: "La superposition des statistiques et sa position. Elle s'affiche par-dessus chaque écran et sert à diagnostiquer les performances, pas à jouer"
hint_settings_interface-alert-on-exception: "Si une erreur non interceptée ouvre la fenêtre de rapport. Le rapport est construit, journalisé et conservé dans tous les cas - ce paramètre décide seulement s'il t'interrompt, ce qui compte surtout en pleine partie. Désactivé, le dernier rapport reste dans le journal du jeu et sous <b>Enregistrer le rapport</b> dans le dossier des rapports"
hint_settings_interface-hitbox-ring-opacity: "L'anneau de points sur l'avatar se trouve exactement sur son rayon de collision, qui fait 0.4 pour un corps dessiné sur une largeur de 1 - la silhouette n'a jamais été la hitbox, et maintenant tu vois où elle se trouve vraiment. Le même anneau compte les vies : un point allumé est une vie encore en réserve, un point éteint est une vie dépensée. Ce paramètre règle seulement sa visibilité par-dessus ce que dessine le niveau, et 0 le désactive complètement - les niveaux sont équilibrés pour qui peut le voir"
hint_settings_interface-levels-layout: "Comment s'ouvre la liste des niveaux du menu : une grille de couvertures ou une liste de lignes avec descriptions. Le bouton à côté du champ de recherche change toujours l'affichage tant que tu ne quittes pas l'écran"
hint_settings_interface-menu-background: "Ce que le menu joue derrière ses boutons. Bot est une vraie arène - le même bot Reflex à qui une partie peut être confiée esquive des dangers émis pendant que tu restes là, et il peut être touché sans que rien ne se passe. Formes est l'ancien champ de formes qui tournent, le plus lourd des trois. Aucun ne dessine rien du tout"
hint_settings_interface-open-menu-on-lose: "Ce que fait une partie perdue. Désactivé, le niveau ralentit en douceur jusqu'à l'arrêt, revient au dernier checkpoint atteint et repart en douceur, sans aucune fenêtre au milieu. Activé, la lecture s'arrête et la fenêtre de résultat s'ouvre"
hint_settings_interface-screen-orientation: |-
  <b>Horizontal</b> et <b>Vertical</b> verrouillent un <b>axe</b>, jamais un côté - retourne l'appareil et l'image se retourne avec lui, donc on joue dans les deux sens

  <b>Rotation auto</b> ne verrouille rien du tout : l'écran suit l'appareil. Avec un niveau qui n'impose pas sa propre orientation, tu peux tourner le téléphone en pleine partie, et l'interface comme la caméra suivent

  Un niveau peut remplacer ce paramètre pendant qu'il est joué. Son auteur a composé le contenu pour un cadre d'une forme précise, donc ce choix l'emporte tant que le niveau tourne, et le quitter rend la main au paramètre

  Sur ordinateur, rien ne fait pivoter un moniteur, donc le contrôle est désactivé et indique simplement la forme de ta fenêtre - redimensionne-la et il suit
hint_settings_interface-show-game-interface: "L'interrupteur général des deux paramètres ci-dessus, et des contrôles tactiles à l'écran avec eux. Désactivé, l'écran de jeu ne dessine plus rien du tout - c'est ce que demande une capture vidéo propre ou une capture d'écran. Rien ne cesse de fonctionner : chaque contrôle reste exactement à sa place et accepte toujours un appui"
hint_settings_interface-show-game-pause: "Si le symbole de pause est dessiné. Il est masqué, pas retiré : le même coin accepte toujours un appui, et Escape ou Back sur une manette ouvre la fenêtre de pause quoi qu'indique ce paramètre"
hint_settings_interface-show-game-progress: "Si la barre de progression de la partie est dessinée en bas de l'écran de jeu. La masquer ne change rien d'autre - les checkpoints qu'elle marque continuent de fonctionner"
hint_settings_interface-stats-active: "Afficher les diagnostics par-dessus chaque écran. Ils servent à mesurer les performances, pas à jouer"
hint_settings_interface-stats-alignment-x: "Position horizontale des diagnostics : 0 est le bord gauche, 1 le bord droit"
hint_settings_interface-stats-alignment-y: "Position verticale des diagnostics : 0 est le bord supérieur, 1 le bord inférieur"
hint_settings_other: "<b>Réinitialiser les paramètres</b> remet chaque paramètre de chaque onglet à sa valeur par défaut. Seuls les paramètres sont touchés - tes niveaux sont des fichiers sur le disque et ne sont pas affectés"
hint_settings_profile: "Tout ce que cet appareil retient de la façon dont on a joué au jeu et de ce qu'on a créé avec. Tout est local : rien n'est envoyé nulle part, et les fichiers derrière ces données sont à côté des niveaux, dans un dossier qu'on peut ouvrir et lire. Les temps sont en secondes réelles et non en temps du niveau, donc le ralentissement au checkpoint et une partie à mi-vitesse comptent pour la durée qu'ils ont vraiment prise. La ligne des appareils mesure lequel des quatre appareils de contrôle menait pendant qu'un niveau était joué, pas seulement lequel était branché"
hint_settings_profile-transfer_body: |-
  Tout ton profil dans un seul fichier zip, à l'export comme à l'import : niveaux, statistiques, paramètres, la bibliothèque avec ses collections et, si tu les coches, les enregistrements automatiques de l'éditeur et les rapports d'erreur. Sers-t'en pour passer à un autre appareil ou garder une copie avant une réinstallation

  <b>Remplacer</b> vide les parties cochées et y met celles du fichier. <b>Fusionner</b> ajoute ce qui manque, prend la copie la plus récente d'un niveau présent des deux côtés et garde les statistiques les plus élevées

  <color=#E8B04B><b>Avertissement :</b></color> sur un téléphone, désinstaller le jeu supprime tout le profil. Exporte-le d'abord

  Avant chaque import, le jeu met ce qu'il va remplacer dans une seule sauvegarde, que tu peux restaurer, enregistrer ailleurs ou supprimer ici

  Plus : <link="https://bullethero.space/fr/docs/game/profile-transfer"><u>Transfert de profil</u></link>
hint_settings_profile-transfer_header: "Transfert de profil"
hint_settings_suppress-game-saves_body: |-
  Tant que ce mode est activé, le jeu n'enregistre rien de lui-même : <color=#D4B483>settings.json</color>, les statistiques globales et celles de chaque niveau restent sur le disque exactement telles quelles. Un paramètre que tu changes fonctionne quand même jusqu'à la fermeture du jeu

  Ton travail sur les niveaux est enregistré comme d'habitude - enregistrer, exporter, importer, copier et supprimer des niveaux, ainsi que l'enregistrement automatique et les sauvegardes de l'éditeur, qui ont leur propre interrupteur

  Il dure jusqu'à la fermeture du jeu et n'est jamais mémorisé. Le désactiver enregistre tes paramètres actuels et jette tout ce qui a été joué pendant qu'il était activé

  <color=#B48CE0><b>Bon à savoir :</b></color> il s'active aussi tout seul. L'argument de lancement <color=#D4B483>--suppress-game-saves</color> l'active pour tout le lancement, et rien dans le jeu ne peut le désactiver. Des paramètres ou des statistiques enregistrés par une version plus récente du jeu l'activent aussi, et le jeu demande alors à chaque lancement s'il faut les garder ou les écraser avec les valeurs par défaut
