settings_interface-alert-on-exception_tooltip: "On, an uncaught error opens the report window over whatever is on screen. Off, it is only written to the log - the report itself is built either way"
settings_interface-menu-background_tooltip: "What the main menu draws behind its buttons. Bot is a live arena the reflex bot plays, Shapes is a field of rotating shapes, None draws nothing"
settings_interface-open-menu-on-lose_tooltip: "Off, a lost run rewinds itself to the last checkpoint it reached. On, playback stops and the result window opens instead"
settings_interface-screen-orientation_tooltip: "Which way round the device is held. Horizontal and Vertical lock an axis rather than a side, so turning the device over keeps playing. On desktop this reports the shape of the window instead"
settings_interface-show-game-interface_tooltip: "The master switch over the two above, and over the on-screen controls with them"
settings_interface-show-game-pause_tooltip: "The pause glyph in the corner of the game screen. Hidden it still takes a press in the same place"
settings_interface-show-game-progress_tooltip: "The bar along the bottom of the game screen, with a notch for every checkpoint the run can come back to"
settings_interface-stats-active_tooltip: "Draws a diagnostics readout over every screen: frame timings, per-frame buffer usage, level size and process memory. Never interactive - clicks pass through it"
settings_interface-stats-alignment-x_tooltip: "0 is the left screen edge, 1 the right one"
settings_interface-stats-alignment-y_tooltip: "0 is the bottom screen edge, 1 the top one - the same convention level content is authored in"
settings_interface-stats-alignment_x: "Alignment X"
settings_interface-stats-alignment_y: "Alignment Y"
settings_interface-stats-frame-objects_tooltip: "Adds the per-frame buffer block: how many instances, shapes, effects, texts and audio tracks this frame used, needed and had room for"
settings_interface-stats-level-objects_tooltip: "Adds the loaded level's own size: objects by kind, keys, audio tracks and resources. It is counted once a second, and not counted at all while this is off"
settings_interface-stats-memory_tooltip: "Adds the process memory block: the managed heap, and how much Unity has allocated of what it reserved. Both are the process' own totals, not this level's"
settings_interface-stats-profiling_tooltip: "Adds the profiling block: how long each simulation stage took, and how many elements the UI panel holds. Present in the Editor and in development builds only - a release build carries no profiler markers at all"
