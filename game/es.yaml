level_resources_texture-alpha: "Alfa"
level_resources_texture-alpha_tooltip: "Lo que declaras sobre la transparencia de esta imagen. Opaca significa que el canal alfa no se usa, así que la imagen se reempaqueta sin él - los mismos píxeles, dibujados más rápido y por la ruta de renderizado opaca. Nadie lo comprueba: en una imagen que de verdad se desvanece, la declaración aplana el desvanecimiento, y eso se ve en la línea de informe de abajo"
level_resources_texture-compression: "Compresión"
level_resources_texture-compression_tooltip: "Si un dispositivo puede empaquetar esta imagen en un formato con pérdida. Rechazar conserva cada píxel y cuesta hasta cuatro veces más memoria, Permitir deja que el dispositivo la comprima incluso donde el tipo lo rechazaría. Auto sigue al tipo: el pixel art y los degradados lo rechazan. Ningún valor hace que un dispositivo comprima en contra de su configuración, y ninguno levanta el límite de tamaño"
level_resources_texture-details: "Importación"
level_resources_texture-kind: "Qué es esta imagen - una foto, un dibujo, pixel art, un degradado. Es puramente artístico: dice lo que la imagen ES. Además, fija los valores iniciales de los campos Muestreo y Compresión de abajo - el pixel art empieza nítido y sin compresión, un degradado sin compresión - y ambos se pueden cambiar ahí. Los mipmaps son lo único que el tipo aún decide por sí solo: el pixel art nunca los tiene"
level_resources_texture-report-alpha-dropped: "alfa descartado"
level_resources_texture-report-mips: "mips"
level_resources_texture-report-not-loaded: "sin cargar"
level_resources_texture-report-source-unknown: "origen desconocido"
level_resources_texture-sampling: "Muestreo"
level_resources_texture-sampling_tooltip: "Cómo se dibuja esta imagen - Suave mezcla los píxeles vecinos, Nítido dibuja cada uno como un cuadrado duro. Auto sigue al tipo: nítido para el pixel art, suave para todo lo demás. Nítido y suave le cuestan lo mismo a un dispositivo, así que es una cuestión de aspecto y no de presupuesto, y se impone al filtrado que elija el jugador"
level_resources_texture-uv-offset-x: "Desplazamiento X"
level_resources_texture-uv-offset-y: "Desplazamiento Y"
level_resources_texture-uv-tiling-x: "Mosaico X"
level_resources_texture-uv-tiling-y: "Mosaico Y"
level_resources_texture-uv_tooltip: "Cómo se proyecta esta imagen sobre lo que la dibuja, indicado una sola vez para el recurso en lugar de en cada objeto. Mosaico es cuántas veces se repite a lo largo de la forma, Desplazamiento es dónde empieza su primera copia. Un objeto sin fotogramas clave de UV propios muestrea exactamente esto, y cualquier fotograma clave de UV de ese objeto lo reemplaza por completo"
level_resources_texture-wrap-u: "Fuera de bordes X"
level_resources_texture-wrap-u_tooltip: "Qué hace esta imagen más allá de sus bordes izquierdo y derecho. Repetir y Espejo solo se notan donde el UV se repite en mosaico - con un mosaico de 1 la imagen se muestrea una sola vez y nunca sale de sí misma"
level_resources_texture-wrap-v: "Fuera de bordes Y"
level_resources_texture-wrap-v_tooltip: "Qué hace esta imagen más allá de sus bordes superior e inferior. Va aparte del eje X a propósito: una franja que se repite en horizontal y queda limitada en vertical es contenido normal"
