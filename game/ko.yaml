level_resources_texture-alpha: "알파"
level_resources_texture-alpha_tooltip: "이 이미지의 투명도에 대해 명시하는 값입니다. 불투명은 알파 채널을 쓰지 않는다는 뜻이므로 이미지가 알파 채널 없이 다시 패킹됩니다. 픽셀은 같고, 더 빠르게 불투명 렌더링 경로로 그려집니다. 이 값이 맞는지는 검증하지 않습니다. 실제로 투명도가 변하는 이미지에서는 그 변화가 사라지며, 아래의 정보 줄에서 확인할 수 있습니다"
level_resources_texture-compression: "압축"
level_resources_texture-compression_tooltip: "기기가 이 이미지를 손실 형식으로 압축해도 되는지 정합니다. 거부는 모든 픽셀을 유지하며 메모리를 최대 4배까지 사용하고, 허용은 종류가 거부하는 경우에도 기기가 압축하게 합니다. 자동은 종류를 따르며, 픽셀 아트와 그레이디언트는 거부합니다. 어느 값도 기기 설정이 금지한 압축을 강제하지 않으며 크기 제한을 해제하지도 않습니다"
level_resources_texture-details: "가져오기"
level_resources_texture-kind: "이 이미지의 종류입니다: 사진, 그림, 픽셀 아트, 그레이디언트. 순수하게 예술적인 선택으로, 이미지가 무엇인지를 나타냅니다. 또한 아래 샘플링과 압축 필드의 초기값을 정합니다. 픽셀 아트는 선명하고 압축되지 않은 상태로, 그레이디언트는 압축되지 않은 상태로 시작하며 두 필드 모두 그곳에서 바꿀 수 있습니다. 밉맵만은 종류가 여전히 스스로 정합니다: 픽셀 아트에는 밉맵이 생성되지 않습니다"
level_resources_texture-report-alpha-dropped: "알파 제거됨"
level_resources_texture-report-mips: "밉 레벨"
level_resources_texture-report-not-loaded: "로드되지 않음"
level_resources_texture-report-source-unknown: "알 수 없는 소스"
level_resources_texture-sampling: "샘플링"
level_resources_texture-sampling_tooltip: "이 이미지를 그리는 방식입니다. 부드러움은 인접한 픽셀을 섞고, 선명함은 각 픽셀을 딱딱한 사각형으로 그립니다. 자동은 종류를 따르며, 픽셀 아트는 선명하게, 나머지는 부드럽게 그립니다. 선명함과 부드러움은 기기에 드는 비용이 같으므로 이는 예산이 아니라 외관의 문제이며, 플레이어 자신의 필터링 설정보다 우선합니다"
level_resources_texture-uv-offset-x: "오프셋 X"
level_resources_texture-uv-offset-y: "오프셋 Y"
level_resources_texture-uv-tiling-x: "타일링 X"
level_resources_texture-uv-tiling-y: "타일링 Y"
level_resources_texture-uv_tooltip: "이 이미지가 자신을 그리는 대상에 어떻게 매핑되는지를 오브젝트마다가 아니라 리소스에 한 번 지정합니다. 타일링은 도형 위에서 반복되는 횟수이고, 오프셋은 첫 번째 사본이 시작되는 위치입니다. 자체 UV 키프레임이 없는 오브젝트는 정확히 이 값을 샘플링하며, 오브젝트에 UV 키프레임이 하나라도 있으면 이 값을 완전히 대체합니다"
level_resources_texture-wrap-u: "래핑 X"
level_resources_texture-wrap-u_tooltip: "이 이미지가 왼쪽과 오른쪽 가장자리 바깥에서 어떻게 보이는지 정합니다. 반복과 미러는 UV 타일링이 적용되는 곳에서만 나타납니다. 타일링이 1일 때는 이미지가 한 번만 샘플링되어 자기 영역을 벗어나지 않습니다"
level_resources_texture-wrap-v: "래핑 Y"
level_resources_texture-wrap-v_tooltip: "이 이미지가 위쪽과 아래쪽 가장자리 바깥에서 어떻게 보이는지 정합니다. 일부러 X축과 분리되어 있습니다. 가로로는 타일링되고 세로로는 클램프된 띠는 흔한 콘텐츠입니다"
