settings_interface-alert-on-exception_tooltip: "켜져 있으면 처리되지 않은 오류가 발생할 때 화면 위에 보고서 창이 열립니다. 꺼져 있으면 로그에만 기록됩니다. 보고서는 어느 경우든 만들어집니다"
settings_interface-menu-background_tooltip: "메인 메뉴의 버튼 뒤에 그려지는 것입니다. 봇은 reflex 봇이 플레이하는 실시간 아레나, 도형은 회전하는 도형들, 없음은 아무것도 그리지 않습니다"
settings_interface-open-menu-on-lose_tooltip: "꺼져 있으면 실패한 플레이가 마지막으로 도달한 체크포인트로 저절로 되감깁니다. 켜져 있으면 재생이 멈추고 대신 결과 창이 열립니다"
settings_interface-screen-orientation_tooltip: "기기를 어느 방향으로 들지 정합니다. 가로와 세로는 한쪽 면이 아니라 축을 고정하므로, 기기를 뒤집어도 계속 플레이할 수 있습니다. 데스크톱에서는 대신 창의 형태를 보여 줍니다"
settings_interface-show-game-interface_tooltip: "위의 두 설정과 화면 조작 버튼을 함께 켜고 끄는 마스터 스위치입니다"
settings_interface-show-game-pause_tooltip: "게임 화면 모서리의 일시 정지 아이콘입니다. 숨겨도 같은 위치를 누르면 동작합니다"
settings_interface-show-game-progress_tooltip: "게임 화면 아래쪽을 따라 표시되는 막대로, 플레이가 돌아올 수 있는 체크포인트마다 눈금이 있습니다"
settings_interface-stats-active_tooltip: "모든 화면 위에 진단 정보를 그립니다: 프레임 시간, 프레임별 버퍼 사용량, 레벨 크기, 프로세스 메모리. 상호작용하지 않으며 클릭은 그대로 통과합니다"
settings_interface-stats-alignment-x_tooltip: "화면 왼쪽 가장자리가 0, 오른쪽 가장자리가 1입니다"
settings_interface-stats-alignment-y_tooltip: "화면 아래쪽 가장자리가 0, 위쪽 가장자리가 1입니다. 레벨 콘텐츠를 제작할 때와 같은 규칙입니다"
settings_interface-stats-alignment_x: "정렬 X"
settings_interface-stats-alignment_y: "정렬 Y"
settings_interface-stats-frame-objects_tooltip: "프레임별 버퍼 블록을 추가합니다: 이 프레임에서 인스턴스, 도형, 이펙트, 텍스트, 오디오 트랙을 얼마나 사용했고, 얼마나 필요했고, 얼마나 담을 수 있었는지 보여 줍니다"
settings_interface-stats-level-objects_tooltip: "불러온 레벨 자체의 크기를 추가합니다: 종류별 오브젝트, 키프레임, 오디오 트랙, 리소스. 1초에 한 번 집계하며, 꺼져 있으면 전혀 집계하지 않습니다"
settings_interface-stats-memory_tooltip: "프로세스 메모리 블록을 추가합니다: 관리 힙, 그리고 Unity 예약 메모리 중 실제로 할당된 양. 둘 다 이 레벨이 아니라 프로세스 전체의 합계입니다"
settings_interface-stats-profiling_tooltip: "프로파일링 블록을 추가합니다: 시뮬레이션 단계별 소요 시간과 UI 패널이 가진 요소 수. Unity 에디터와 개발 빌드에만 있습니다. 릴리스 빌드에는 프로파일러 마커가 전혀 없습니다"
