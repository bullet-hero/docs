settings_graphics-render-scale_tooltip: "Quantos pixels o jogo renderiza antes de escalar para a janela. A interface é desenhada em tamanho total de qualquer forma. Multiplica a escala com que esta classe de dispositivo já vem. Só no computador"
settings_graphics-resolution_tooltip: "Tamanho da janela do jogo em pixels, entre os modos que esta tela informa. Uma resolução mais alta do que larga coloca a interface inteira no layout vertical. Só no computador"
settings_graphics-textures-compression-quality_tooltip: "Quanto tempo este dispositivo gasta comprimindo uma imagem. O resultado tem o mesmo tamanho e o mesmo formato de qualquer forma - a troca é só entre tempo de carregamento e artefatos de bloco em gradientes e bordas duras. Auto usa o codificador cuidadoso para tudo, exceto fotografias. Ignorado nos celulares, cujos codificadores não aceitam essa configuração"
settings_graphics-textures-compression_tooltip: "Compacta as imagens de um nível em um formato comprimido ao carregar. De quatro a oito vezes menos memória por imagem, ao custo de artefatos de bloco em gradientes e bordas duras. Auto comprime nos celulares, onde a memória é escassa, e mantém a imagem completa nos computadores. Lido quando um nível carrega, então vale para o próximo que você abrir"
settings_graphics-textures-filtering_tooltip: "Como as imagens de um nível são amostradas ao serem desenhadas. Auto mescla entre os níveis de mipmap quando os mipmaps estão ativados, o que remove a emenda onde um passa para o próximo. Ponto dá texels de bordas duras em tudo - não muda como uma imagem é reduzida, só como é desenhada. Imagens que o autor marcou como pixel art sempre são amostradas por ponto"
settings_graphics-textures-mipmaps_tooltip: "Gera cópias reduzidas de cada imagem, para que uma imagem desenhada pequena não cintile ao se mover. Custa um terço a mais de memória. Imagens que o autor marcou como pixel art nunca as recebem"
settings_graphics-textures-size-limit_tooltip: "O maior lado que uma imagem pode ocupar na memória deste dispositivo. Qualquer coisa maior é reduzida ao carregar, e o arquivo no disco nunca é alterado. A memória cai com o quadrado do lado, então um passo abaixo economiza mais do que a compressão. Auto é 2048 nos celulares e 4096 nos computadores"
