hint_editor-settings_artist-permission_body: |-
  Todo recurso externo de um nível - música, imagens, fontes, textos - precisa de uma licença pelo menos tão livre quanto <color=#D4B483>CC BY-NC</color>, ou da permissão do detentor dos direitos para a redistribuição pública não comercial

  <color=#E86A5A><b>Cuidado:</b></color> um "pode usar, sem problema" em particular não basta. A permissão precisa cobrir a redistribuição pública, não só o seu uso pessoal

  Nada é verificado enquanto o nível fica no seu dispositivo - só quando ele é oferecido a um serviço

  Mais: <link="https://bullethero.space/pt/docs/editor/rights/legal-resource-paths"><color=#59A6FF>Dois caminhos para um recurso ser aceito</color></link>, <link="https://bullethero.space/pt/docs/editor/rights/asking-permission"><color=#59A6FF>Pedir permissão a um autor</color></link>
hint_editor-settings_artist-permission_header: "Usar o trabalho de outra pessoa"
hint_editor-settings_community: "Os links do próprio projeto - abrem no seu navegador. Quais aparecem depende de onde veio esta versão do jogo, então a versão de uma loja pode mostrar menos links do que esta"
hint_editor-settings_create-level_body: |-
  Uma <b>predefinição</b> decide com o que o novo nível começa - vazio, ou com um pouco de estrutura que você teria de montar à mão toda vez

  <color=#E86A5A><b>Cuidado:</b></color> os <b>Parâmetros</b> definem o que é difícil mudar depois: a duração em quadros e a taxa de quadros

  <color=#5EC8C8><b>Dica:</b></color> as duas listas de formato de arquivo escolhem como o nível e os metadados dele são gravados no disco. As duas podem ser alteradas depois na Zona de perigo do nível

  Mais: <link="https://bullethero.space/pt/docs/editor/basics/first-level"><color=#59A6FF>Seu primeiro nível: o caminho</color></link>
hint_editor-settings_create-level_header: "Criar um nível"
hint_editor-settings_library_body: |-
  Tudo neste dispositivo que você pode levar para um nível: a sua biblioteca, as suas coleções e as coleções que você assinou na Oficina. A coluna estreita escolhe o tipo, as etiquetas acima da lista escolhem a origem

  Uma <b>coleção</b> é uma pasta de recursos de qualquer tipo, com nome, autores e licença. Crie uma aqui, preencha com <b>Copiar</b> nas páginas de cada tipo, exporte como arquivo compactado ou publique

  <color=#5EC8C8><b>Dica:</b></color> uma coleção da Oficina é somente leitura. Copie os itens dela para uma coleção sua para alterá-los

  Mais: <link="https://bullethero.space/pt/docs/editor/reference/library-and-collections"><color=#59A6FF>Biblioteca e coleções</color></link>
hint_editor-settings_library_header: "Biblioteca"
hint_editor-settings_open-level: "Níveis encontrados neste dispositivo. Um nível é uma pasta - coloque uma ao lado das outras e ela aparece aqui"
hint_editor_beat-segment_body: |-
  Um trecho de andamento constante: BPM, deslocamento de fase em quadros fracionários, batidas por compasso, um nome e uma cor. Só um segmento é mostrado, mesmo quando vários estão selecionados

  <color=#E86A5A><b>Cuidado:</b></color> um segmento é identificado pelo quadro inicial, então <b>movê-lo muda a identidade dele</b>. Depois de mover, selecione-o de novo no novo início

  <color=#5EC8C8><b>Dica:</b></color> os toques aqui reajustam a fase do segmento selecionado em vez de criar um novo

  Mais: <link="https://bullethero.space/pt/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>Ritmo e estrutura</color></link>
hint_editor_beat-segment_header: "Segmento de batida"
hint_editor_beat-window_body: |-
  Metadados de autoria - <b>nada na reprodução os lê</b>. Eles permitem posicionar o conteúdo na música, e os geradores agem sobre as mesmas batidas que você vê

  A grade é uma lista de <b>segmentos de batida</b>, cada um com andamento constante. Lacunas entre eles não são problema: uma introdução sem percussão, uma pausa, o final depois da música

  <color=#5EC8C8><b>Dica:</b></color> aperte <b>TOCAR</b> junto com a faixa, e depois <b>Criar dos toques</b> transforma os toques em um segmento do primeiro ao último

  Mais: <link="https://bullethero.space/pt/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>Ritmo e estrutura</color></link>
hint_editor_beat-window_header: "Grade de batidas"
hint_editor_clipboard_body: |-
  Um buffer por linha do tempo, cada um com a própria linha de status

  <b>Copiar como texto</b> grava todos os buffers na área de transferência do sistema como texto, para que uma seleção possa ir para outro nível ou outra máquina. <b>Colar do texto</b> lê o texto de volta para os buffers - e <b>para por aí</b>

  <color=#B48CE0><b>Vale saber:</b></color> nada chega ao nível até você colar na linha do tempo que você mesmo escolheu. Onde o conteúdo cai depende do indicador de reprodução e do escopo ativo

  Mais: <link="https://bullethero.space/pt/docs/editor/workflow/reuse"><color=#59A6FF>Reutilização: prefabs, cópia, geradores</color></link>
hint_editor_clipboard_header: "Área de transferência"
hint_editor_console: "Tudo o que o editor registrou nesta sessão - relatórios de carregamento de nível, resultados de geradores, avisos de importação. <b>Limpar</b> esvazia a lista. A engrenagem filtra as mensagens por gravidade"
hint_editor_curve-editor: "Edita uma curva arrastando os pontos dela. As alterações valem <b>na hora</b>, enquanto você arrasta, então o que você vê já está no nível - fechar a janela as mantém"
hint_editor_generators_body: |-
  Conteúdo procedural, aplicado ao nível como uma única operação que pode ser desfeita

  <color=#B48CE0><b>Vale saber:</b></color> existem duas famílias. Os <b>geradores</b> (<i>gen_</i>) criam conteúdo - ondas de projéteis, padrões radiais e o cache de fontes. Os <b>modificadores</b> (<i>mod_</i>) reescrevem o que já existe - ajustando intervalos, quantizando quadros-chave

  <color=#E86A5A><b>Cuidado:</b></color> tudo o que reescreve ou exclui conteúdo existente pede confirmação antes

  Mais: <link="https://bullethero.space/pt/docs/editor/workflow/reuse"><color=#59A6FF>Reutilização: prefabs, cópia, geradores</color></link>
hint_editor_generators_header: "Geradores"
hint_editor_gradient-editor: "Edita um gradiente arrastando as paradas de cor dele. Como no editor de curvas, as alterações valem <b>na hora</b>, e não ao confirmar"
hint_editor_hierarchy_body: |-
  Todos os objetos vivos no <b>quadro atual</b>, aninhados pelo pai. A lista muda conforme você arrasta o indicador - uma hierarquia vazia geralmente significa que o indicador de reprodução passou do fim do seu conteúdo

  Arraste uma linha sobre outra para tornar o objeto dela filho do outro. As camadas se somam ao longo da cadeia, então trocar o pai também move o objeto na ordem de desenho e sorteia de novo os valores aleatórios dele

  <color=#5EC8C8><b>Dica:</b></color> clique com o botão direito em uma linha para ver as ações dela. Na tela sensível ao toque, mantenha a linha pressionada

  Mais: <link="https://bullethero.space/pt/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Como o editor pensa</color></link>
hint_editor_hierarchy_header: "Hierarquia"
hint_editor_inspector-audio_body: |-
  O clipe, a velocidade, o volume do fader e a cadeia de efeitos de áudio da faixa de áudio selecionada - passa-baixas, passa-altas, eco, reverberação, chorus, alteração de tom, distorção, flanger, compressor, normalização e EQ paramétrico

  Velocidade e volume são controles deslizantes, e não campos numéricos simples, para que os limites permitidos fiquem visíveis

  <color=#E86A5A><b>Cuidado:</b></color> <b>o volume aqui é o fader.</b> O volume em quadros-chave é uma faixa separada na linha do tempo local, e os dois se multiplicam na reprodução

  Mais: <link="https://bullethero.space/pt/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar a faixa de áudio</color></link>
hint_editor_inspector-audio_chorus-delay: "Atraso base das cópias em ms - curto o bastante para soar como espessura, e não como eco"
hint_editor_inspector-audio_chorus-depth: "Quanto o atraso oscila - Rate define a velocidade da oscilação, e este campo, a amplitude dela"
hint_editor_inspector-audio_chorus-dry-mix: "Nível do sinal sem processamento"
hint_editor_inspector-audio_chorus-feedback: "Quanto da saída volta para o efeito, tornando-o mais intenso, até soar como um flanger"
hint_editor_inspector-audio_chorus-rate: "A velocidade com que o atraso é modulado, em Hz"
hint_editor_inspector-audio_chorus-wet-mix-tap-1: "Nível da primeira cópia atrasada"
hint_editor_inspector-audio_chorus-wet-mix-tap-2: "Nível da segunda cópia - as cópias ficam espaçadas, então o equilíbrio entre elas decide a largura do chorus"
hint_editor_inspector-audio_chorus-wet-mix-tap-3: "Nível da terceira cópia"
hint_editor_inspector-audio_chorus_body: |-
  Sobrepõe ao sinal três cópias levemente atrasadas com afinação oscilante, para que uma fonte soe como várias. <color=#D4B483>Rate</color> é a velocidade da oscilação, <color=#D4B483>Depth</color>, a amplitude dela. Aumente <color=#D4B483>Feedback</color> e ele vira <link="hint_editor_inspector-audio_flange"><color=#59A6FF>Flanger</color></link>

  <color=#B48CE0><b>Vale saber:</b></color> <b>redefinir</b> também devolve o <b>Nível de mixagem</b> ao padrão de -80 dB, então desliga o efeito

  Mais: <link="https://bullethero.space/pt/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar a faixa de áudio</color></link>
hint_editor_inspector-audio_chorus_header: "Chorus"
hint_editor_inspector-audio_compressor-attack: "A rapidez com que ele aperta depois de um pico, em ms - rápido demais mata os transientes"
hint_editor_inspector-audio_compressor-make-up-gain: "Ganho em dB devolvido depois da compressão, para recuperar o nível que ela tirou"
hint_editor_inspector-audio_compressor-release: "A rapidez com que ele solta depois, em ms - rápido demais causa um bombeamento audível"
hint_editor_inspector-audio_compressor-threshold: "Nível em dB acima do qual a compressão começa a agir"
hint_editor_inspector-audio_compressor_body: |-
  Abaixa os trechos fortes para que os fracos possam subir - a correção de sempre para uma música que some atrás dos próprios efeitos. <color=#D4B483>Threshold</color> é onde ele começa a agir, <color=#D4B483>Attack</color> e <color=#D4B483>Release</color>, a rapidez com que aperta e solta, <color=#D4B483>Make Up Gain</color> devolve o nível

  <color=#B48CE0><b>Vale saber:</b></color> <b>redefinir</b> também devolve o <b>Nível de mixagem</b> ao padrão de -80 dB, então desliga o efeito

  Mais: <link="https://bullethero.space/pt/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar a faixa de áudio</color></link>
hint_editor_inspector-audio_compressor_header: "Compressor"
hint_editor_inspector-audio_distortion-level: "Com que força o sinal é saturado"
hint_editor_inspector-audio_distortion_body: |-
  Corta os picos da forma de onda e enche o som de harmônicos - áspero e saturado. Um só controle, <color=#D4B483>Level</color>, para a força da mordida. Ele também achata a dinâmica, então a faixa perde os momentos silenciosos

  <color=#B48CE0><b>Vale saber:</b></color> <b>redefinir</b> também devolve o <b>Nível de mixagem</b> ao padrão de -80 dB, então desliga o efeito

  Mais: <link="https://bullethero.space/pt/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar a faixa de áudio</color></link>
hint_editor_inspector-audio_distortion_header: "Distorção"
hint_editor_inspector-audio_echo-decay: "Quanto de cada repetição alimenta a próxima - valores mais altos soam por mais tempo"
hint_editor_inspector-audio_echo-delay: "Milissegundos entre as repetições - sincronize com o andamento da música para manter os ecos na batida"
hint_editor_inspector-audio_echo-dry-mix: "Nível do sinal sem processamento na saída"
hint_editor_inspector-audio_echo-max-channels: "Limite de canais do buffer do eco"
hint_editor_inspector-audio_echo-wet-mix: "Nível do sinal com eco - equilibrado com Dry Mix, separado do Nível de mixagem"
hint_editor_inspector-audio_echo_body: |-
  Repete o sinal em espaços fixos de tempo, cada repetição mais baixa que a anterior - cópias separadas, e não a sala da <link="hint_editor_inspector-audio_reverb"><color=#59A6FF>Reverberação</color></link>. <color=#D4B483>Delay</color> é o espaço em milissegundos, <color=#D4B483>Decay</color>, quanto de cada cópia alimenta a próxima

  <color=#B48CE0><b>Vale saber:</b></color> <b>redefinir</b> também devolve o <b>Nível de mixagem</b> ao padrão de -80 dB, então desliga o efeito

  Mais: <link="https://bullethero.space/pt/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar a faixa de áudio</color></link>
hint_editor_inspector-audio_echo_header: "Eco"
hint_editor_inspector-audio_enabled: "Se este efeito está na cadeia. Não existe um interruptor separado para isso - marcar a caixa tira o Nível de mixagem do piso de -80 dB, desmarcar o devolve para lá e mantém o nível que você tinha definido"
hint_editor_inspector-audio_flange-depth: "Quanto o atraso oscila"
hint_editor_inspector-audio_flange-dry-mix: "Nível do sinal sem processamento"
hint_editor_inspector-audio_flange-rate: "A frequência com que a varredura se repete, em Hz"
hint_editor_inspector-audio_flange-wet-mix: "Nível da cópia varrida - o cancelamento entre as duas é o próprio efeito"
hint_editor_inspector-audio_flange_body: |-
  Mistura o sinal com um atraso muito curto e oscilante dele mesmo - o zunido de uma turbina de jato. Como o <link="hint_editor_inspector-audio_chorus"><color=#59A6FF>Chorus</color></link>, mas com uma só cópia, então você ouve uma varredura em vez de largura. O zunido é mais profundo quando <color=#D4B483>Dry Mix</color> e <color=#D4B483>Wet Mix</color> estão próximos

  <color=#B48CE0><b>Vale saber:</b></color> <b>redefinir</b> também devolve o <b>Nível de mixagem</b> ao padrão de -80 dB, então desliga o efeito

  Mais: <link="https://bullethero.space/pt/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar a faixa de áudio</color></link>
hint_editor_inspector-audio_flange_header: "Flanger"
hint_editor_inspector-audio_header: "Inspetor da faixa de áudio"
hint_editor_inspector-audio_highpass-cutoff-freq: "Frequência em Hz abaixo da qual a faixa é atenuada - no mínimo, o filtro é praticamente transparente"
hint_editor_inspector-audio_highpass_body: |-
  O espelho do <link="hint_editor_inspector-audio_lowpass"><color=#59A6FF>Passa-baixas</color></link>: deixa passar os agudos e corta tudo abaixo de <color=#D4B483>Cutoff Freq</color>. Aumente o corte e a faixa vai afinando até soar como um alto-falante minúsculo

  <color=#5EC8C8><b>Dica:</b></color> a cadeia pertence à <b>faixa</b> e não é animada por quadros-chave. Para uma mudança no meio da música, corte a faixa e configure as duas metades de forma diferente

  <color=#B48CE0><b>Vale saber:</b></color> <b>redefinir</b> também devolve o <b>Nível de mixagem</b> ao padrão de -80 dB, então desliga o efeito

  Mais: <link="https://bullethero.space/pt/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar a faixa de áudio</color></link>
hint_editor_inspector-audio_highpass_header: "Passa-altas"
hint_editor_inspector-audio_lowpass-cutoff-freq: "Frequência em Hz acima da qual a faixa é atenuada - no máximo, o filtro é praticamente transparente"
hint_editor_inspector-audio_lowpass_body: |-
  Deixa passar os graves e corta tudo acima de <color=#D4B483>Cutoff Freq</color> - o som debaixo d'água, atrás de uma parede. No topo da escala, o filtro é praticamente transparente

  <color=#5EC8C8><b>Dica:</b></color> a cadeia pertence à <b>faixa</b> e não é animada por quadros-chave. Para uma mudança no meio da música, corte a faixa e configure as duas metades de forma diferente

  <color=#B48CE0><b>Vale saber:</b></color> <b>redefinir</b> também devolve o <b>Nível de mixagem</b> ao padrão de -80 dB, então desliga o efeito

  Mais: <link="https://bullethero.space/pt/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar a faixa de áudio</color></link>
hint_editor_inspector-audio_lowpass_header: "Passa-baixas"
hint_editor_inspector-audio_mix-level: "Nível em dB com que o sinal processado é misturado de volta. Em -80 o efeito fica mudo, e é assim que \"desligado\" é armazenado - não existe um interruptor separado no arquivo"
hint_editor_inspector-audio_normalize-fade-in-time: "Milissegundos que o ganho leva para se estabilizar, para que a correção não soe como um salto"
hint_editor_inspector-audio_normalize-lowest-volume: "Sinais mais baixos que isto ficam como estão - impede que o silêncio e o ruído de fundo sejam amplificados até virar chiado"
hint_editor_inspector-audio_normalize-maximum-amp: "Teto do ganho que pode ser aplicado"
hint_editor_inspector-audio_normalize_body: |-
  Leva o sinal em direção a um volume-alvo, para que clipes de fontes diferentes fiquem em um nível comparável. Ele age sobre o nível geral, a dinâmica dentro de uma faixa é com o <link="hint_editor_inspector-audio_compressor"><color=#59A6FF>Compressor</color></link>. <color=#D4B483>Lowest Volume</color> impede que ele transforme silêncio em chiado, <color=#D4B483>Maximum Amp</color> limita o reforço

  <color=#B48CE0><b>Vale saber:</b></color> <b>redefinir</b> também devolve o <b>Nível de mixagem</b> ao padrão de -80 dB, então desliga o efeito

  Mais: <link="https://bullethero.space/pt/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar a faixa de áudio</color></link>
hint_editor_inspector-audio_normalize_header: "Normalizar"
hint_editor_inspector-audio_param-eq-center-freq: "Frequência em Hz em que a banda fica centrada"
hint_editor_inspector-audio_param-eq-frequency-gain: "Ganho aplicado dentro da banda - abaixo de 1 corta, acima de 1 reforça"
hint_editor_inspector-audio_param-eq-octave-range: "Largura da banda em oitavas - estreita para correções cirúrgicas, larga para moldar o timbre"
hint_editor_inspector-audio_param-eq_body: |-
  Uma banda paramétrica que reforça ou corta uma região escolhida do espectro. Ao contrário do <link="hint_editor_inspector-audio_lowpass"><color=#59A6FF>Passa-baixas</color></link> e do <link="hint_editor_inspector-audio_highpass"><color=#59A6FF>Passa-altas</color></link>, ela também pode aumentar o nível. <color=#D4B483>Center Freq</color> é onde a banda fica, <color=#D4B483>Octave Range</color>, a largura dela, <color=#D4B483>Frequency Gain</color> abaixo de 1 corta e acima de 1 reforça

  <color=#B48CE0><b>Vale saber:</b></color> <b>redefinir</b> também devolve o <b>Nível de mixagem</b> ao padrão de -80 dB, então desliga o efeito

  Mais: <link="https://bullethero.space/pt/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar a faixa de áudio</color></link>
hint_editor_inspector-audio_param-eq_header: "EQ paramétrico"
hint_editor_inspector-audio_pitch-shifter-fft-size: "Tamanho da janela de análise - o controle de qualidade contra latência do algoritmo"
hint_editor_inspector-audio_pitch-shifter-max-channels: "Limite de canais do processamento"
hint_editor_inspector-audio_pitch-shifter-overlap: "Quanto as janelas consecutivas se sobrepõem - mais sobreposição suaviza os artefatos, mas custa mais"
hint_editor_inspector-audio_pitch-shifter-pitch: "Multiplicador de tom - 1 não muda nada, 2 sobe uma oitava"
hint_editor_inspector-audio_pitch-shifter_body: |-
  Muda o tom sem mudar a velocidade, então a sincronia continua presa à música. <color=#D4B483>Pitch</color> é um multiplicador: 1 deixa como está, 2 sobe uma oitava. <color=#D4B483>FFT Size</color> e <color=#D4B483>Overlap</color> trocam qualidade por custo

  <color=#5EC8C8><b>Dica:</b></color> a cadeia pertence à <b>faixa</b> e não é animada por quadros-chave. Para uma mudança no meio da música, corte a faixa e configure as duas metades de forma diferente

  <color=#B48CE0><b>Vale saber:</b></color> <b>redefinir</b> também devolve o <b>Nível de mixagem</b> ao padrão de -80 dB, então desliga o efeito

  Mais: <link="https://bullethero.space/pt/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar a faixa de áudio</color></link>
hint_editor_inspector-audio_pitch-shifter_header: "Alteração de tom"
hint_editor_inspector-audio_reverb-decay-hf-ratio: "Quanto os agudos decaem mais rápido que os graves - abaixo de 1, a cauda escurece enquanto some"
hint_editor_inspector-audio_reverb-decay-time: "Segundos que a cauda leva para sumir - o indício mais forte do tamanho da sala"
hint_editor_inspector-audio_reverb-density: "Densidade modal do espaço simulado"
hint_editor_inspector-audio_reverb-diffusion: "Densidade dos ecos ao longo do tempo - valores baixos deixam a cauda granulada e metálica"
hint_editor_inspector-audio_reverb-dry-level: "Nível do sinal sem processamento na saída"
hint_editor_inspector-audio_reverb-hf-reference: "Frequência em que Room HF e Decay HF Ratio são medidos"
hint_editor_inspector-audio_reverb-lf-reference: "Frequência em que Room LF é medido"
hint_editor_inspector-audio_reverb-reflect-delay: "Atraso até essas reflexões chegarem - a distância das paredes"
hint_editor_inspector-audio_reverb-reflections: "Nível das primeiras reflexões - os primeiros ricochetes nítidos nas paredes próximas"
hint_editor_inspector-audio_reverb-reverb: "Nível da cauda tardia e difusa, em oposição às primeiras reflexões"
hint_editor_inspector-audio_reverb-reverb-delay: "Atraso até essa cauda começar"
hint_editor_inspector-audio_reverb-room: "Nível geral do sinal reverberado - a presença da sala"
hint_editor_inspector-audio_reverb-room-hf: "Nível da sala nas altas frequências - cortá-lo soa como paredes macias e absorventes"
hint_editor_inspector-audio_reverb-room-lf: "Nível da sala nas baixas frequências"
hint_editor_inspector-audio_reverb_body: |-
  Coloca a faixa em uma sala: primeiras reflexões, depois uma cauda que decai. Comece por três campos: <color=#D4B483>Decay Time</color> é o tamanho da sala, <color=#D4B483>Room</color>, quanto dela você ouve, e <color=#D4B483>Room HF</color> baixo deixa as paredes macias

  <color=#B48CE0><b>Vale saber:</b></color> <b>redefinir</b> também devolve o <b>Nível de mixagem</b> ao padrão de -80 dB, então desliga o efeito

  Mais: <link="https://bullethero.space/pt/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar a faixa de áudio</color></link>
hint_editor_inspector-audio_reverb_header: "Reverberação"
hint_editor_inspector-effect_angle-a: "O ângulo, em graus. Nas variantes Aleatório, é um dos extremos entre os quais cada partícula sorteia o valor"
hint_editor_inspector-effect_angle-b: "O outro extremo dos valores entre os quais cada partícula sorteia o ângulo"
hint_editor_inspector-effect_angle-curve: "A curva de onde o ângulo é lido - pelo tempo de vida da própria partícula em Ao longo da vida, pela velocidade dela em Por velocidade"
hint_editor_inspector-effect_angle-speed-range: "Janela de velocidades pela qual a curva é remapeada - a velocidade que conta como o início da curva e a velocidade que conta como o fim"
hint_editor_inspector-effect_angle-type: "Qual das cinco variantes de rotação é esta. Mudar substitui o subobjeto inteiro, então as linhas abaixo são da nova variante"
hint_editor_inspector-effect_angle_body: |-
  Como uma partícula gira ao longo da vida, em uma de cinco variantes: um <color=#D4B483>Valor</color> fixo, duas de <color=#D4B483>Curvas</color> ou duas de <color=#D4B483>Aleatório</color>, sorteadas por partícula

  <color=#D4B483>Ao longo da vida</color> lê a curva pelo tempo de vida da partícula, <color=#D4B483>Por velocidade</color>, pela velocidade dela, através da janela de velocidades abaixo

  O botão <b>redefinir</b> ao lado deste também redefine o <color=#D4B483>Tipo</color>, e a curva ou o par aleatório vai junto

  Mais: <link="https://bullethero.space/pt/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Legibilidade</color></link>
hint_editor_inspector-effect_angle_header: "Ângulo"
hint_editor_inspector-effect_body: |-
  Os parâmetros de um efeito <color=#D4B483>VFX Graph</color>, agrupados: configuração, principal, forças, forma, ângulo, escala e cor. Todos os grupos ficam visíveis ao mesmo tempo, e não um por vez

  <color=#B48CE0><b>Vale saber:</b></color> os efeitos <b>recebem a semente do mesmo jeito que todo o resto</b> - de números que você edita, e não do estado de um gerador - então o mesmo nível é reproduzido de forma idêntica em qualquer dispositivo

  <color=#5EC8C8><b>Dica:</b></color> as cores podem se referir ao tema do nível em vez de conter um valor literal, e os tipos de gradiente abrem o editor de gradiente compartilhado

  Mais: <link="https://bullethero.space/pt/docs/editor/performance/level-budget"><color=#59A6FF>O orçamento do nível</color></link>
hint_editor_inspector-effect_color-a: "A cor da partícula. Nas variantes Aleatório, é um dos extremos entre os quais cada partícula sorteia o valor"
hint_editor_inspector-effect_color-b: "O outro extremo dos valores entre os quais cada partícula sorteia a cor"
hint_editor_inspector-effect_color-gradient: "O gradiente de onde a tonalidade é lida - pelo tempo de vida da partícula, pela velocidade dela ou uma cor por partícula, conforme a variante"
hint_editor_inspector-effect_color-speed-range: "Janela de velocidades pela qual o gradiente é remapeado - a velocidade que conta como o início dele e a velocidade que conta como o fim"
hint_editor_inspector-effect_color-type: "Qual das seis variantes de tonalidade é esta. Mudar substitui o subobjeto inteiro, então as linhas abaixo são da nova variante"
hint_editor_inspector-effect_color_body: |-
  Como uma partícula é colorida ao longo da vida, em uma de seis variantes: as cinco de <link="hint_editor_inspector-effect_angle"><color=#59A6FF>Ângulo</color></link> e <link="hint_editor_inspector-effect_scale"><color=#59A6FF>Escala</color></link> com gradientes em vez de curvas, mais um <color=#D4B483>Gradiente aleatório</color> que escolhe uma cor por partícula

  <color=#5EC8C8><b>Dica:</b></color> uma cor aqui pode ser uma referência ao tema, assim o efeito acompanha um nível que muda a paleta no meio do caminho

  O botão <b>redefinir</b> ao lado deste também redefine o <color=#D4B483>Tipo</color>, e o gradiente ou o par de cores vai junto

  Mais: <link="https://bullethero.space/pt/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>Cor e temas</color></link>
hint_editor_inspector-effect_color_header: "Cor"
hint_editor_inspector-effect_config-has-stop-frame: "Se o Quadro de parada é respeitado. Desativado, o emissor continua gerando partículas enquanto o objeto dele existir"
hint_editor_inspector-effect_config-stop-frame: "Quadro, contado a partir do início do intervalo do próprio objeto e não do tempo do nível, em que a emissão para. As partículas já vivas ainda terminam o tempo de vida delas"
hint_editor_inspector-effect_config_body: |-
  Quando o emissor para de gerar partículas. Desativado, ele gera enquanto o objeto existir, que é o caso comum

  <color=#D4B483>Quadro de parada</color> conta a partir do início do intervalo do próprio objeto, não da linha do tempo do nível. As partículas já vivas terminam o tempo de vida, então a imagem se desfaz em vez de ser cortada

  O botão <b>redefinir</b> ao lado deste devolve os dois campos aos padrões dos desenvolvedores em uma única etapa de desfazer

  Mais: <link="https://bullethero.space/pt/docs/editor/performance/level-budget"><color=#59A6FF>O que um nível aguenta</color></link>
hint_editor_inspector-effect_config_header: "Configuração"
hint_editor_inspector-effect_core-lifetime-bounds: "Mínimo e máximo de segundos de vida de uma partícula, sorteados por partícula - a diferença entre eles é o que impede uma rajada de morrer toda de uma vez. A média deles também é o que multiplica o tamanho do lote de um efeito de disparo único"
hint_editor_inspector-effect_core-loop: "Se o sistema emite continuamente, em vez de um único lote que nunca é reabastecido. Com ele desativado, não sobra nada para desenhar depois dos limites do tempo de vida"
hint_editor_inspector-effect_core-particle-count: "Partículas emitidas por segundo - o principal controle de custo. As vivas ao mesmo tempo são este número vezes o tempo de vida médio, nos dois modos: com loop, elas surgem nesse ritmo, e um disparo único lança todo esse produto de uma vez. O teto é a capacidade do próprio grafo, e um sistema é processado sobre essa capacidade a cada quadro, existam as partículas ou não"
hint_editor_inspector-effect_core-particle-pivot: "Ponto da partícula que fica sobre a posição dela e em torno do qual ela gira - o equivalente, por partícula, do pivô de um objeto"
hint_editor_inspector-effect_core-render: "Se as partículas são desenhadas. Desativado, o sistema continua simulando, o que é útil quando só os efeitos colaterais dele importam"
hint_editor_inspector-effect_core-shape-id: "Geometria com que cada partícula é desenhada, do mesmo conjunto de formas que um objeto usa. Nenhum não desenha nada - o quad é um valor comum e é o padrão deste campo"
hint_editor_inspector-effect_core-texture-id: "Imagem que cada partícula desenha, do mesmo conjunto de recursos que um objeto usa. Nenhum deixa a partícula sem pintura, que é o padrão deste campo"
hint_editor_inspector-effect_core_body: |-
  Quantas partículas existem, quanto tempo vivem e com o que são desenhadas. Como elas se movem é com <link="hint_editor_inspector-effect_forces"><color=#59A6FF>Forças</color></link>

  <color=#D4B483>Qtd. de partículas</color> é o principal controle de custo: um emissor custa aproximadamente a quantidade vezes <color=#D4B483>Limites do tempo de vida</color>. <color=#D4B483>Forma</color> e <color=#D4B483>Textura</color> podem ficar vazios - uma partícula sem textura é o caso barato

  <color=#E8B04B><b>Aviso:</b></color> a quantidade é limitada a 1024, e o grafo paga por toda a capacidade dele a cada quadro, não só pelas partículas vivas. Peça só quantas você precisa

  Mais: <link="https://bullethero.space/pt/docs/editor/performance/level-budget"><color=#59A6FF>O que um nível aguenta</color></link>
hint_editor_inspector-effect_core_header: "Principal"
hint_editor_inspector-effect_forces-linear-force: "Aceleração constante, e não velocidade, então o efeito dela se acumula ao longo da vida da partícula em vez de ficar estável"
hint_editor_inspector-effect_forces-linear-velocity: "Deriva constante somada a cada quadro por cima da velocidade com que a partícula nasceu - vento, não um impulso"
hint_editor_inspector-effect_forces-orbital-center-offset: "Onde fica o centro dessa órbita em relação ao emissor. Deslocá-lo deixa o redemoinho torto"
hint_editor_inspector-effect_forces-orbital-velocity: "Rotação das partículas em torno de um centro, e não em torno de si mesmas. Em uma cena 2D, o componente Z é o que importa"
hint_editor_inspector-effect_forces-start-angular-velocity-max: "Limite superior do sorteio do giro inicial"
hint_editor_inspector-effect_forces-start-angular-velocity-min: "Limite inferior do sorteio do giro inicial, em graus por segundo"
hint_editor_inspector-effect_forces-start-gravity-max: "Limite superior do sorteio da gravidade por partícula"
hint_editor_inspector-effect_forces-start-gravity-min: "Limite inferior do sorteio da gravidade por partícula. Valores negativos flutuam para cima"
hint_editor_inspector-effect_forces-start-velocity-max: "Limite superior do sorteio da velocidade inicial. Afastar estes dois é o que transforma uma rajada limpa em um borrifo"
hint_editor_inspector-effect_forces-start-velocity-min: "Limite inferior do sorteio da velocidade inicial, por eixo"
hint_editor_inspector-effect_forces-velocity-speed: "Multiplicador sobre toda a velocidade da partícula - um só controle para desacelerar ou acelerar um efeito pronto sem reajustar cada campo acima"
hint_editor_inspector-effect_forces_body: |-
  Tudo o que move uma partícula depois que ela surge. Onde ela começa é com <link="hint_editor_inspector-effect_shape"><color=#59A6FF>Forma</color></link>

  Os pares de campos <color=#D4B483>inicial</color> são sorteados uma vez, no nascimento, por partícula. Todo o resto age continuamente durante toda a vida da partícula, e <color=#D4B483>Força linear</color> é uma aceleração, então se acumula

  <color=#5EC8C8><b>Dica:</b></color> <color=#D4B483>Velocidade de movimento</color> multiplica o resultado inteiro, então um efeito pronto pode ser desacelerado ou acelerado sem reajustar o resto

  Mais: <link="https://bullethero.space/pt/docs/editor/craft/composition-and-camera"><color=#59A6FF>Composição</color></link>
hint_editor_inspector-effect_forces_header: "Forças"
hint_editor_inspector-effect_header: "Inspetor de efeito"
hint_editor_inspector-effect_scale-a: "O tamanho da partícula. Nas variantes Aleatório, é um dos extremos entre os quais cada partícula sorteia o valor"
hint_editor_inspector-effect_scale-b: "O outro extremo dos valores entre os quais cada partícula sorteia o tamanho"
hint_editor_inspector-effect_scale-curve-x: "A curva de onde o tamanho horizontal é lido, independente do vertical"
hint_editor_inspector-effect_scale-curve-y: "A curva de onde o tamanho vertical é lido, independente do horizontal"
hint_editor_inspector-effect_scale-speed-range: "Janela de velocidades pela qual as duas curvas são remapeadas - a velocidade que conta como o início delas e a velocidade que conta como o fim"
hint_editor_inspector-effect_scale-type: "Qual das cinco variantes de tamanho é esta. Mudar substitui o subobjeto inteiro, então as linhas abaixo são da nova variante"
hint_editor_inspector-effect_scale_body: |-
  O tamanho de uma partícula ao longo da vida, nas mesmas cinco variantes de <link="hint_editor_inspector-effect_angle"><color=#59A6FF>Ângulo</color></link>. <color=#D4B483>Curva X</color> e <color=#D4B483>Curva Y</color> são lidas de forma independente, então uma partícula pode se esticar enquanto encolhe

  <color=#E8B04B><b>Aviso:</b></color> a linha abaixo das curvas é reaproveitada: o próprio tamanho em Valor e Aleatório, a janela de velocidades em Por velocidade. A legenda ao lado diz qual das duas

  O botão <b>redefinir</b> ao lado deste também redefine o <color=#D4B483>Tipo</color>, e as duas curvas e o par aleatório vão junto

  Mais: <link="https://bullethero.space/pt/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Legibilidade</color></link>
hint_editor_inspector-effect_scale_header: "Escala"
hint_editor_inspector-effect_shape-arc: "Parte da borda realmente usada, em radianos, medida no sentido anti-horário a partir do eixo +X - menos de uma volta completa forma um leque"
hint_editor_inspector-effect_shape-box-size: "Largura e altura totais da caixa de surgimento, centrada no objeto do efeito"
hint_editor_inspector-effect_shape-circle-aspect: "Semieixo vertical como múltiplo do raio: 1 é um círculo, qualquer outro valor, uma elipse"
hint_editor_inspector-effect_shape-circle-radius: "Distância do centro até o anel, ao longo do eixo horizontal"
hint_editor_inspector-effect_shape-circle-thickness: "Quanto o anel é preenchido para dentro: 0 é só o contorno, 1, um disco cheio"
hint_editor_inspector-effect_shape-cone-base-radius: "Raio na ponta do emissor"
hint_editor_inspector-effect_shape-cone-height: "Distância entre as duas pontas - a profundidade do volume de surgimento"
hint_editor_inspector-effect_shape-cone-top-radius: "Raio na ponta distante. Maior que o raio da base abre para fora, menor afunila para dentro"
hint_editor_inspector-effect_shape-line-end: "A outra ponta do segmento de reta"
hint_editor_inspector-effect_shape-line-start: "Uma ponta do segmento de reta, em coordenadas locais do objeto do efeito"
hint_editor_inspector-effect_shape-spread: "Parte da forma que o percurso cobre antes de recomeçar"
hint_editor_inspector-effect_shape-spread-speed: "A rapidez com que o ponto de surgimento avança - é o que define a velocidade de rotação visível"
hint_editor_inspector-effect_shape-spread-type: "Como as partículas seguintes percorrem a forma: ao acaso, em loop em uma direção, indo e voltando ou em uma senoide. É isso que transforma um anel parado em um padrão que gira ou varre"
hint_editor_inspector-effect_shape-torus-radius-major: "Raio do anel em torno do qual o tubo é curvado"
hint_editor_inspector-effect_shape-torus-radius-minor: "Raio do próprio tubo - a espessura do anel"
hint_editor_inspector-effect_shape-type: "Qual volume de surgimento é este. Mudar substitui a forma, então os campos abaixo são da nova forma, não da antiga"
hint_editor_inspector-effect_shape_body: |-
  O volume de surgimento: um ponto, um anel, uma caixa, um segmento de reta, um cone ou um toro. Ele decide só onde a partícula começa, o que vem depois é com <link="hint_editor_inspector-effect_forces"><color=#59A6FF>Forças</color></link>

  Mudar o <color=#D4B483>Tipo</color> muda as linhas abaixo, e as linhas são compartilhadas entre os tipos. <color=#D4B483>Arco</color> é em radianos, e menos de uma volta completa forma um leque

  <color=#5EC8C8><b>Dica:</b></color> <b>Abertura</b> em Loop dá o clássico emissor giratório

  O botão <b>redefinir</b> ao lado deste também redefine o <color=#D4B483>Tipo</color>, e a forma vai junto

  Mais: <link="https://bullethero.space/pt/docs/editor/craft/composition-and-camera"><color=#59A6FF>Composição</color></link>
hint_editor_inspector-effect_shape_header: "Forma"
hint_editor_inspector-keyframe_body: |-
  <b>Todas as faixas que a seleção toca aparecem ao mesmo tempo</b>, não só a última em que você clicou. Um valor em branco significa que os quadros-chave selecionados <b>divergem</b> nele

  <color=#5EC8C8><b>Dica:</b></color> a <b>Suavização</b> vale para várias faixas de uma vez e é registrada como <b>um único passo de desfazer</b>

  <color=#B48CE0><b>Vale saber:</b></color> o <b>Quadro</b> fica bloqueado quando vários quadros-chave estão selecionados - um só número juntaria todos em um único quadro. Em vez disso, arraste-os na linha do tempo

  Mais: <link="https://bullethero.space/pt/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Como o editor pensa</color></link>
hint_editor_inspector-keyframe_header: "Inspetor de quadro-chave"
hint_editor_inspector-object_body: |-
  Os campos próprios do objeto selecionado. Todo tipo mostra os campos comuns do objeto vazio, e os objetos Forma, Efeito, Texto e Prefab adicionam os seus logo abaixo

  <b>Ativo</b> desliga tanto a renderização <i>quanto</i> a colisão, e os filhos herdam isso: um objeto oculto aqui não pode matar o jogador

  <color=#E86A5A><b>Cuidado:</b></color> a <b>Camada</b> é relativa ao pai. A camada global ao lado, somente leitura, é a que o renderizador usa

  <color=#5EC8C8><b>Dica:</b></color> um campo editado em um objeto vindo de um prefab registra uma <b>substituição por instância</b> - a caixa de seleção ao lado a mostra e a desfaz

  Mais: <link="https://bullethero.space/pt/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Como o editor pensa</color></link>
hint_editor_inspector-object_header: "Inspetor de objeto"
hint_editor_inspector-resolved_body: |-
  O que os objetos selecionados <b>são</b> no quadro atual, lido da simulação em execução e não do que você criou

  O quadrado no fim de uma linha é o estado de quadro-chave do campo: azul - um quadro-chave neste quadro (clique no quadrado para selecioná-lo), âmbar - valor interpolado entre quadros-chave, cinza - fora dos quadros-chave, o valor é mantido, vazado - sem quadros-chave, vale o padrão. As setas levam o indicador de reprodução ao quadro-chave anterior ou ao próximo

  Abaixo do separador ficam os valores compostos - a camada somada, o Ativo herdado e a transformação composta com a dos pais. Nenhum quadro-chave os define, por isso eles não têm sinal de estado

  Mais: <link="https://bullethero.space/pt/docs/editor/reference/object-properties"><color=#59A6FF>Propriedades do objeto</color></link>
hint_editor_inspector-resolved_header: "Valores atuais"
hint_editor_inspector_audio-span-fit: "Estica a faixa sobre o máximo do clipe que couber antes do fim do nível. Indisponível sem um clipe resolvível ou com velocidade zero, porque uma faixa congelada não tem duração para ajustar"
hint_editor_inspector_audio-span-fit-level: "Aumenta a faixa e o nível juntos até o clipe inteiro caber. O nível só fica mais longo, e um clipe que já cabe não muda nada"
hint_editor_inspector_collider-id_body: |-
  O que este objeto <b>atinge</b> - e essa é uma escolha separada do que ele desenha

  <color=#B48CE0><b>Vale saber:</b></color> nenhum dos dois deriva do outro, e isso é proposital: um feixe de aviso desenhado mas inofensivo, uma hitbox mais simples que a arte que ela protege e uma parede invisível são conteúdo comum, não truques

  <color=#5EC8C8><b>Dica:</b></color> os dois campos escolhem das mesmas duas coleções, então uma forma própria do nível pode servir para um, para o outro ou para os dois

  Mais: <link="https://bullethero.space/pt/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Legibilidade e justiça</color></link>
hint_editor_inspector_collider-id_header: "Colisor"
hint_editor_inspector_ease_body: |-
  Como o valor chega a este quadro-chave a partir do anterior

  <color=#B48CE0><b>Vale saber:</b></color> a suavização pertence ao lado de <b>entrada</b> de um quadro-chave, então o primeiro quadro-chave de uma faixa não tem de onde suavizar e a escolha dele não aparece

  <color=#5EC8C8><b>Dica:</b></color> com vários quadros-chave selecionados, a escolha vale para todos como <b>um único passo de desfazer</b>, mesmo em faixas e objetos diferentes. Uma escolha em branco significa que eles divergem

  Mais: <link="https://bullethero.space/pt/docs/editor/basics/keyframes-and-easing"><color=#59A6FF>Quadros-chave e suavização</color></link>
hint_editor_inspector_ease_header: "Suavização"
hint_editor_inspector_global-layer: "A ordem de desenho que o renderizador realmente usa: a camada do próprio objeto mais a de cada ancestral. Somente leitura, porque é calculada e não armazenada"
hint_editor_inspector_layer_body: |-
  Ordem de desenho <b>relativa ao pai</b>, não absoluta

  <color=#E86A5A><b>Cuidado:</b></color> o renderizador usa este número mais o de cada ancestral, mostrado somente leitura em <b>Global</b> abaixo. Trocar o pai muda onde um objeto é desenhado mesmo quando este número continua igual

  <color=#B48CE0><b>Vale saber:</b></color> os valores aleatórios estão ligados à camada efetiva, então mover um objeto na hierarquia sorteia todos de novo

  Mais: <link="https://bullethero.space/pt/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Como o editor pensa</color></link>
hint_editor_inspector_layer_header: "Camada"
hint_editor_inspector_object-type: "Que tipo de objeto é este. Mudá-lo SUBSTITUI o objeto: os campos comuns ficam, e o que não tem lugar no novo tipo é descartado"
hint_editor_inspector_parent: "Qual objeto este segue. O pai compõe a própria transformação sobre a do filho, e as camadas se somam ao longo da cadeia, então trocar o pai também move o objeto na ordem de desenho"
hint_editor_inspector_shader-type_body: |-
  Qual caminho de renderização este objeto segue

  <color=#E86A5A><b>Cuidado:</b></color> <b>Auto</b> decide uma vez, quando o nível carrega, e nunca muda a aparência do nível: tudo o que ele não consegue provar opaco pelo alfa vira transparente

  <color=#5EC8C8><b>Dica:</b></color> o rótulo ao lado deste campo mostra o que o Auto realmente escolheu, lido direto dos dados do renderizador

  Mais: <link="https://bullethero.space/pt/docs/editor/performance/level-budget"><color=#59A6FF>O orçamento do nível</color></link>
hint_editor_inspector_shader-type_header: "Tipo de shader"
hint_editor_inspector_shape-id_body: |-
  O que este objeto <b>desenha</b>

  <color=#B48CE0><b>Vale saber:</b></color> uma forma é geometria real ajustada à própria caixa, com exatamente 1 no eixo mais longo, então o retângulo do objeto é o que aparece na tela. O jogo gera cerca de 500 formas, e um nível pode adicionar as suas

  <color=#5EC8C8><b>Dica:</b></color> deixar este campo vazio é válido: um objeto que não desenha nada mas tem um colisor é uma parede invisível

  Mais: <link="https://bullethero.space/pt/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Legibilidade e justiça</color></link>
hint_editor_inspector_shape-id_header: "Forma"
hint_editor_inspector_span_body: |-
  Quando este objeto existe, como um intervalo semiaberto: o quadro inicial entra, o final não. Um objeto que termina em 20 e outro que começa em 20 nunca são desenhados juntos nesse quadro

  <color=#B48CE0><b>Vale saber:</b></color> o intervalo de um filho precisa ficar dentro do intervalo do pai, mas isso é resolvido na leitura, nunca armazenado. Encolha o pai e os filhos são cortados, aumente-o de novo e eles voltam. Um objeto raiz que passa do fim do nível simplesmente nunca é reproduzido

  <b>Âncoras</b> fazem uma borda seguir a borda do pai, e elas decidem o que é reproduzido: um filho com âncoras se estica junto com o pai que cresce. A animação dele mantém o tempo que você definiu

  Mais: <link="https://bullethero.space/pt/docs/editor/basics/frames-and-time"><color=#59A6FF>Quadros, tempo e duração de um nível</color></link>
hint_editor_inspector_span_header: "Intervalo"
hint_editor_interop-report: "O que sobreviveu e o que não sobreviveu à conversão do formato de outro jogo. As entradas são informativas: o nível já foi carregado, aqui está onde ele difere do original"
hint_editor_level-export_body: |-
  Grava este nível fora do jogo - como uma pasta ou como um único arquivo compactado. Tudo o que o nível usa vai junto, inclusive uma música que está fora da pasta do nível

  Um <b>.zip</b> comum abre no Explorador de Arquivos do Windows sem instalar nada. As opções com senha, não: <b>+ senha</b> abre no 7-Zip ou em qualquer outro compactador, <b>(gpg)</b> abre com o gpg

  <color=#5EC8C8><b>Dica:</b></color> o que não pôde ir junto - um recurso atrás de uma URL, um arquivo que nada referencia - aparece listado no relatório depois

  <color=#E8B04B><b>Aviso:</b></color> senha não é DRM. Quem tem o arquivo e a senha sempre consegue abri-lo

  Mais: <link="https://bullethero.space/pt/docs/editor/workflow/sharing-by-hand"><color=#59A6FF>Compartilhar um nível manualmente</color></link>
hint_editor_level-export_header: "Exportar nível"
hint_editor_level-protection_body: |-
  Criptografa o documento deste nível no disco, então abrir o nível pede uma senha. Os metadados, a capa e a mídia continuam legíveis, por isso o cartão do nível aparece mesmo sem ela

  A senha é pedida uma vez por sessão e fica só na memória. Para remover a proteção, deixe o campo vazio e pressione <b>Aplicar</b>

  <color=#E86A5A><b>Cuidado:</b></color> uma senha esquecida não pode ser recuperada. Nenhuma chave fica armazenada em lugar nenhum

  Mais: <link="https://bullethero.space/pt/docs/editor/reference/export-and-protection"><color=#59A6FF>Exportação e proteção</color></link>
hint_editor_level-protection_header: "Proteger nível"
hint_editor_prefab-flatten-recursive_body: |-
  Desativado - só o posicionamento que você apontou deixa de seguir o próprio modelo. Um prefab colocado dentro dele mantém o próprio vínculo, então editar esse modelo interno ainda chega a este nível. Este é o padrão

  Ativado - tudo o que está aninhado também é achatado, e nada no nível continua vinculado a esses modelos internos, em qualquer profundidade

  Os modelos em si continuam no nível de qualquer forma, e um achatamento é um único passo de desfazer

  Mais: <link="https://bullethero.space/pt/docs/editor/reference/prefab-mode"><color=#59A6FF>Modo prefab</color></link>
hint_editor_prefab-flatten-recursive_header: "Achatar também prefabs aninhados"
hint_editor_prefab-mode_body: |-
  <color=#E86A5A><b>Cuidado:</b></color> você está editando um <b>modelo</b> de prefab, não um posicionamento dele. Salvar leva a mudança a todos os posicionamentos que referenciam este modelo

  As edições feitas aqui não registram substituições por instância. Uma substituição só surge ao editar o objeto de um posicionamento fora deste modo

  <color=#5EC8C8><b>Dica:</b></color> um posicionamento dentro deste modelo abre o próprio modelo por cima, e "Salvar e fechar" traz você de volta para cá. O aninhamento para em 8 níveis

  Mais: <link="https://bullethero.space/pt/docs/editor/workflow/reuse"><color=#59A6FF>Reutilização: prefabs, cópia, geradores</color></link>
hint_editor_prefab-mode_header: "Modo prefab"
hint_editor_search-palette_body: |-
  Dois modos. <b>Executar comando</b> encontra qualquer ação do editor pelo nome - as mesmas ações que a barra de ferramentas e os menus de contexto executam. <b>Pesquisar conteúdo</b> encontra os objetos do escopo atual e as faixas de áudio

  <color=#B48CE0><b>Vale saber:</b></color> os recursos não estão em nenhum dos dois modos: cada um é escolhido pelo campo que precisa dele

  Mais: <link="https://bullethero.space/pt/docs/editor/workflow/speed-and-shortcuts"><color=#59A6FF>Velocidade e atalhos</color></link>
hint_editor_search-palette_header: "Paleta de comandos"
hint_editor_search-picker: "O seletor único que todo campo de recurso usa. Digite para ordenar a lista. Os filtros a restringem por tipo, e a etiqueta à direita aparece quando um campo aceita só um domínio"
hint_editor_theme-ref_body: |-
  Aponte esta cor para um <b>slot do tema do nível</b> em vez de um valor literal. Quando o tema muda, tudo o que referencia o slot muda de estilo de uma vez

  <color=#5EC8C8><b>Dica:</b></color> as amostras mostram a paleta no quadro do quadro-chave que você está editando, não no indicador de reprodução. Para escolher pela aparência de um momento posterior, edite um quadro-chave mais adiante

  Mais: <link="https://bullethero.space/pt/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>Cor, temas e pós-processamento</color></link>
hint_editor_theme-ref_header: "Referência de cor do tema"
hint_editor_timeline-audio_body: |-
  As faixas de áudio do nível com as formas de onda, para você alinhar o conteúdo ao que ouve

  <color=#5EC8C8><b>Dica:</b></color> <b>Ajustar faixa</b> no inspetor redimensiona uma faixa para a duração real do clipe. O botão fica desativado sem clipe ou com velocidade 0

  <color=#E86A5A><b>Cuidado:</b></color> o controle deslizante <b>Volume</b> do inspetor é o fader da faixa. O volume com quadros-chave é uma faixa Volume separada na linha do tempo local, e os dois se multiplicam na reprodução

  Mais: <link="https://bullethero.space/pt/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar a faixa de áudio</color></link>
hint_editor_timeline-audio_header: "Linha do tempo de áudio"
hint_editor_timeline-events_body: |-
  Quadros-chave do nível inteiro que não pertencem a nenhum objeto:
  - posição, rotação, zoom, pivô e tremor da câmera
  - marcadores e checkpoints
  - o limite da tela
  - fundo e tema
  - todos os efeitos de pós-processamento
  - visibilidade, controle, colisão, tamanho e velocidade do jogador

  <color=#B48CE0><b>Vale saber:</b></color> a faixa <b>Batida</b> é a exceção aqui. Os itens dela têm intervalo, então é a única faixa em que Bordas e Tesoura atuam

  <color=#5EC8C8><b>Dica:</b></color> uma cor pode apontar para o tema do nível em vez de ter um valor fixo. Assim uma única troca de tema recolore tudo isso

  Mais: <link="https://bullethero.space/pt/docs/editor/craft/composition-and-camera"><color=#59A6FF>Composição e câmera</color></link>
hint_editor_timeline-events_header: "Linha do tempo de eventos"
hint_editor_timeline-level_body: |-
  Um clipe por objeto, e a linha em que ele fica é a sua <b>camada</b>. Um clipe é o <b>intervalo</b> do objeto: os quadros 10-19 terminam exatamente onde começa um clipe que inicia em 20

  <color=#B48CE0><b>Vale saber:</b></color> um filho só é reproduzido dentro do intervalo do pai, mas nada do que você criou é cortado. Aumente o pai de novo e o filho volta

  <color=#5EC8C8><b>Dica:</b></color> <b>Seleção</b> seleciona e arrasta, <b>Bordas</b> remodela uma borda, <b>Tesoura</b> divide um clipe no cursor. Clique com o botão direito em um espaço vazio para abrir o menu

  Mais: <link="https://bullethero.space/pt/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Como o editor pensa</color></link>, <link="https://bullethero.space/pt/docs/editor/craft/composition-and-camera"><color=#59A6FF>Composição e câmera</color></link>
hint_editor_timeline-level_header: "Linha do tempo do nível"
hint_editor_timeline-local_body: |-
  Quadros-chave do <b>objeto selecionado</b>, uma faixa por propriedade. Os quadros contam a partir do início do intervalo do objeto, então mover o objeto move a animação inteira junto

  <color=#B48CE0><b>Vale saber:</b></color> uma <b>faixa vazia é um dado válido</b>. Ela usa o valor padrão, e é por isso que um objeto novo não anima nada até você adicionar um quadro-chave

  Mais: <link="https://bullethero.space/pt/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Como o editor pensa</color></link>
hint_editor_timeline-local_header: "Linha do tempo local"
hint_editor_timeline-prefab_body: |-
  A linha do tempo própria do modo prefab, sobre os objetos do <b>modelo</b>. A duração dela é a do próprio modelo, não o intervalo de algum posicionamento

  <color=#E8B04B><b>Aviso:</b></color> a seleção não é compartilhada com o resto do editor. As edições aqui mudam o modelo e se espalham para todos os posicionamentos dele

  Mais: <link="https://bullethero.space/pt/docs/editor/workflow/reuse"><color=#59A6FF>Reutilização: prefabs, cópia, geradores</color></link>
hint_editor_timeline-prefab_header: "Linha do tempo do prefab"
hint_editor_value-type-color: "De onde a cor vem a cada reprodução. Valor - como está escrito. Tema - o slot do tema naquele quadro, então a cor muda quando o tema muda. Aleat. mín-máx - cada canal é sorteado separadamente, então a cor cai em qualquer ponto entre as duas. Aleat. de A a B - um sorteio para todos os canais, então a cor sempre fica na linha de A até B"
hint_editor_value-type-number: "Como este número é decidido toda vez que é reproduzido. Valor - o número como está escrito. Aleat. mín-máx - um número entre os dois limites. Aleat. mín-máx, passo - o mesmo, encaixado em uma grade desse tamanho. Aqui não existe a forma de A a B, porque um componente já recebe exatamente um número. Um valor aleatório é endereçado, não sorteado, então o mesmo nível é jogado igual em qualquer dispositivo, e mover um objeto ou mudar a camada dele gera outro valor"
hint_editor_value-type-vector: "Como este vetor é decidido toda vez que é reproduzido. Valor - os números como estão escritos. Aleat. no retângulo - cada eixo é sorteado separadamente entre os seus dois limites, preenchendo o retângulo. Aleat. de A a B - UM sorteio, lido por todos os eixos no mesmo ponto, então o ponto percorre a reta de A até B. Um eixo fica parado quando tem o mesmo número nas duas pontas. Aleat. no círculo - um ponto em um disco ao redor do centro. As formas com passo encaixam o resultado em uma grade. Um valor aleatório é endereçado, não sorteado, então o mesmo nível é jogado igual em qualquer dispositivo"
hint_editor_video-export_audio: "As faixas do nível no vídeo, com os quadros-chave de volume e pan"
hint_editor_video-export_body: |-
  Renderiza o nível aberto em um vídeo pelo ffmpeg instalado neste computador

  <color=#B48CE0><b>Vale saber:</b></color> a renderização é offline, um quadro por vez, então o vídeo sai exato por mais lento que seja o computador. O ffmpeg não faz parte do jogo - instale-o uma vez e esta janela o encontra. Também dá para indicar um ffmpeg manualmente
  Mais: <link="https://bullethero.space/pt/docs/editor/reference/video-export"><color=#59A6FF>Exportação de vídeo</color></link>
hint_editor_video-export_bot: "Quem joga o nível no vídeo. Reflex olha um instante à frente e não precisa de preparação. Warm calcula a rota inteira antes do primeiro quadro. Os impactos não fazem nada durante uma exportação"
hint_editor_video-export_codec: "Como a imagem ou o som é comprimido dentro do contêiner. Só aparece o que o seu ffmpeg consegue gerar. A linha abaixo diz qual codec de áudio vai junto e que arquivo você obtém"
hint_editor_video-export_effects: "Os efeitos de partículas do nível no vídeo. O mesmo interruptor do editor, só para o vídeo"
hint_editor_video-export_engine-audio: "Ativado: quando as faixas têm efeitos, o som do nível toca em tempo real enquanto os quadros são renderizados, e o som do próprio jogo é gravado com todos os efeitos, enquanto os alto-falantes ficam em silêncio. A exportação dura pelo menos a duração do trecho. Desativado: as faixas são mixadas separadamente, sem os efeitos. Com Só som, a mixagem é sempre separada"
hint_editor_video-export_ffmpeg: "O ffmpeg codifica o vídeo e não faz parte do jogo. Verde - encontrado e pronto, âmbar - antigo demais, vermelho - não encontrado ou não executa. Escolher ffmpeg aponta um arquivo manualmente, Verificar de novo repete a busca"
hint_editor_video-export_fps: "Quadros por segundo do vídeo, até 240, independente da taxa de quadros do próprio nível. Abaixo de 60, cada quadro é simulado em vários passos, para que o bot jogue como no jogo"
hint_editor_video-export_full-chroma: "Cor para cada pixel em vez de um a cada dois. Linhas coloridas finas continuam nítidas, o arquivo fica maior e alguns players de vídeo não o abrem"
hint_editor_video-export_header: "Exportar vídeo"
hint_editor_video-export_output: "Onde o vídeo é salvo. Por padrão é recordings/[id do nível] na pasta de dados do jogo, e essa pasta continua lá mesmo se o nível for excluído"
hint_editor_video-export_post-processing: "O pós-processamento do nível - bloom, correção de cor e o resto - no vídeo. O mesmo interruptor do editor, só para o vídeo"
hint_editor_video-export_preroll: "Segundos reproduzidos antes do início, mas não gravados, para que efeitos e partículas já tenham um histórico no primeiro quadro"
hint_editor_video-export_preset: "O tipo de arquivo. MP4 abre em qualquer lugar, MKV e MOV são para edição, WebM é para a web, GIF, WebP e APNG são clipes curtos sem som, a sequência de imagens é uma pasta de quadros, Só som não renderiza imagem nenhuma"
hint_editor_video-export_quality: "Quanto espaço o vídeo ocupa. Rascunho é pequeno e pouco nítido, Sem perdas mantém cada pixel e fica grande"
hint_editor_video-export_range: "Qual parte do nível é gravada: o nível inteiro, o trecho do loop da linha do tempo ou um quadro inicial e final escolhidos por você"
hint_editor_video-export_resolution: "Tamanho do vídeo em pixels. Personalizado aceita qualquer largura e altura pares. A câmera do nível é ajustada dentro, e barras pretas preenchem o resto"
hint_editor_video-export_seed: "Semente da aleatoriedade do nível. 0 mantém a que o editor está usando agora, qualquer outro número gera o mesmo vídeo toda vez"
hint_editor_video-export_sound-after-frames: "Desativado (o padrão): o som com efeitos é gravado enquanto os quadros são renderizados, e a exportação dura o que for mais longo entre os dois. Ativado: o som é gravado em tempo real depois do último quadro, então a exportação demora mais, e o tempo extra é a duração do trecho. Ative quando o nível for pesado e o som gravado engasgar"
hint_gen_audio_waveform_body: |-
  Cria objetos que traçam a forma de uma faixa de áudio, para que o nível siga visivelmente o que se ouve

  Mais: <link="https://bullethero.space/pt/docs/editor/workflow/reuse"><color=#59A6FF>Reutilização: prefabs, cópia, geradores</color></link>
hint_gen_audio_waveform_header: "Forma de onda do áudio"
hint_gen_beat_flash_body: |-
  Coloca um flash em cada batida. As batidas vêm do mapa de batidas do nível e, quando não há mapa, dos marcadores - então o que pisca é exatamente o que você vê na grade

  Mais: <link="https://bullethero.space/pt/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>Ritmo e estrutura</color></link>
hint_gen_beat_flash_header: "Flash na batida"
hint_gen_bullet_homing_body: |-
  Balas que fazem curva em direção a onde se espera que o jogador esteja. A curva é definida na criação, não calculada na reprodução: o resultado fica idêntico em qualquer dispositivo

  Mais: <link="https://bullethero.space/pt/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Legibilidade e justiça</color></link>
hint_gen_bullet_homing_header: "Balas teleguiadas"
hint_gen_bullet_laser_sweep_body: |-
  Um feixe que varre o campo. O aviso e a fase letal são objetos separados, então o aviso pode ser desenhado sem poder matar

  Mais: <link="https://bullethero.space/pt/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Legibilidade e justiça</color></link>
hint_gen_bullet_laser_sweep_header: "Varredura de laser"
hint_gen_bullet_rain_body: |-
  Balas caindo sobre uma área ao longo de um trecho de tempo. Densidade e dispersão são parâmetros. Onde cada uma cai sai da semente do nível, então uma partida se repete igual

  Mais: <link="https://bullethero.space/pt/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Legibilidade e justiça</color></link>
hint_gen_bullet_rain_header: "Chuva de balas"
hint_gen_bullet_spiral_body: |-
  Balas emitidas ao longo de um braço giratório, formando a clássica parede em espiral

  Mais: <link="https://bullethero.space/pt/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Legibilidade e justiça</color></link>
hint_gen_bullet_spiral_header: "Espiral de balas"
hint_gen_bullet_wave_body: |-
  Uma fileira de balas avançando juntas. O padrão básico, e o que vale ler primeiro: os parâmetros dele dão nome às ideias que os outros geradores de balas reutilizam

  Mais: <link="https://bullethero.space/pt/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Legibilidade e justiça</color></link>
hint_gen_bullet_wave_header: "Onda de balas"
hint_gen_capacity_hint_body: |-
  Grava os limites indicativos do nível - quantos objetos e efeitos ele espera precisar ao mesmo tempo

  <color=#B48CE0><b>Vale saber:</b></color> não muda nada do que se vê. O runtime usa esses limites para reservar buffers de antemão em vez de aumentá-los no meio do nível, que é de onde viria um engasgo

  Mais: <link="https://bullethero.space/pt/docs/editor/performance/level-budget"><color=#59A6FF>O orçamento do nível</color></link>
hint_gen_capacity_hint_header: "Previsão de capacidade"
hint_gen_font_cache_body: |-
  Reúne todos os caracteres que o texto do nível realmente usa e os gera de antemão, para que nenhum glifo precise ser preparado na primeira vez que aparece

  <color=#7FC97F><b>Recomendação:</b></color> execute-o depois que o texto estiver finalizado. Um caractere adicionado depois e não gerado de novo custa um engasgo no momento em que aparece pela primeira vez

  Mais: <link="https://bullethero.space/pt/docs/editor/resources/images-and-fonts"><color=#59A6FF>Imagens e fontes</color></link>
hint_gen_font_cache_header: "Cache de fontes"
hint_gen_geometry_fractal_body: |-
  Repete uma forma dentro de si mesma em escalas cada vez menores. A profundidade custa objetos de forma exponencial, então aumente-a um passo por vez

  Mais: <link="https://bullethero.space/pt/docs/editor/workflow/reuse"><color=#59A6FF>Reutilização: prefabs, cópia, geradores</color></link>
hint_gen_geometry_fractal_header: "Fractal"
hint_gen_geometry_grid_body: |-
  Preenche um retângulo com cópias de uma forma espaçadas por igual

  Mais: <link="https://bullethero.space/pt/docs/editor/workflow/reuse"><color=#59A6FF>Reutilização: prefabs, cópia, geradores</color></link>
hint_gen_geometry_grid_header: "Grade"
hint_gen_geometry_polygon_body: |-
  Coloca formas nos vértices ou nas arestas de um polígono regular

  Mais: <link="https://bullethero.space/pt/docs/editor/workflow/reuse"><color=#59A6FF>Reutilização: prefabs, cópia, geradores</color></link>
hint_gen_geometry_polygon_header: "Polígono"
hint_gen_geometry_radial_body: |-
  Distribui cópias em torno de um círculo. A base da maioria dos padrões simétricos

  Mais: <link="https://bullethero.space/pt/docs/editor/workflow/reuse"><color=#59A6FF>Reutilização: prefabs, cópia, geradores</color></link>
hint_gen_geometry_radial_header: "Radial"
hint_gen_geometry_spiral_body: |-
  Distribui cópias ao longo de uma espiral, com raio e ângulo avançando juntos

  Mais: <link="https://bullethero.space/pt/docs/editor/workflow/reuse"><color=#59A6FF>Reutilização: prefabs, cópia, geradores</color></link>
hint_gen_geometry_spiral_header: "Espiral"
hint_gen_level_archive_body: |-
  Cria um nível a partir de um arquivo compactado gerado por este jogo - um .tar.gz ou um .zip, qualquer um deles opcionalmente protegido por senha. O tipo é lido dos bytes, então um arquivo compactado renomeado ainda abre. Um arquivo compactado de uma versão mais antiga é migrado na entrada

  <color=#E8B04B><b>Aviso:</b></color> por padrão, o nível importado recebe um ID próprio, então não pode sobrescrever um nível que já está neste dispositivo. Desative isso só para trazer de volta um nível que este dispositivo já teve

  Mais: <link="https://bullethero.space/pt/docs/editor/reference/generators"><color=#59A6FF>Geradores</color></link>
hint_gen_level_archive_header: "Importar arquivo compactado de nível"
hint_gen_level_audio_file_body: |-
  Começa um nível a partir de uma faixa: traz o áudio, ajusta a duração do nível ao comprimento dela e deixa você no início de uma linha do tempo vazia

  Mais: <link="https://bullethero.space/pt/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar a faixa de áudio</color></link>
hint_gen_level_audio_file_header: "Nível a partir de arquivo de áudio"
hint_gen_level_empty_body: |-
  Esvazia o nível por completo. Tudo o que foi criado é removido, e é por isso que ele é o gerador certo para recomeçar do zero em vez de editar

  Mais: <link="https://bullethero.space/pt/docs/editor/basics/first-level"><color=#59A6FF>Seu primeiro nível: o caminho</color></link>
hint_gen_level_empty_header: "Nível vazio"
hint_gen_section_additional: "Ajustes finos sobre os parâmetros principais. Os valores padrão aqui costumam servir"
hint_gen_section_main: "Os parâmetros que decidem o que este gerador produz. Comece por aqui"
hint_gen_test_camera_flash_body: "Um gerador de desenvolvimento, mantido para testar as faixas de eventos da câmera. Não serve para criar conteúdo"
hint_gen_test_camera_flash_header: "Flash da câmera (teste)"
hint_gen_test_form_body: "Um gerador de desenvolvimento que testa todos os controles de parâmetro que o formulário sabe montar. Não serve para criar conteúdo"
hint_gen_test_form_header: "Formulário (teste)"
hint_gen_test_odd_body: "Um gerador de desenvolvimento com casos de parâmetros propositalmente estranhos. Não serve para criar conteúdo"
hint_gen_test_odd_header: "Estranho (teste)"
hint_gen_test_partial_order_body: "Um gerador de desenvolvimento que verifica como são dispostos os campos que a indicação de ordem não menciona. Não serve para criar conteúdo"
hint_gen_test_partial_order_header: "Ordem parcial (teste)"
hint_gen_test_scatter_body: "Um gerador de desenvolvimento para os caminhos da aleatoriedade endereçada. Não serve para criar conteúdo"
hint_gen_test_scatter_header: "Dispersão (teste)"
hint_gen_test_sections_body: "Um gerador de desenvolvimento que produz um formulário com várias seções. Não serve para criar conteúdo"
hint_gen_test_sections_header: "Seções (teste)"
hint_gen_test_spawn_body: "Um gerador de desenvolvimento para os caminhos de criação de objetos. Não serve para criar conteúdo"
hint_gen_test_spawn_header: "Spawn (teste)"
hint_gen_texture_objects_body: |-
  Transforma uma imagem em objetos, um por célula, para que a figura vire conteúdo do nível que pode ser animado como qualquer outra coisa

  Mais: <link="https://bullethero.space/pt/docs/editor/resources/images-and-fonts"><color=#59A6FF>Imagens e fontes</color></link>
hint_gen_texture_objects_header: "Objetos da textura"
hint_level-preview_authors: "Todas as pessoas creditadas neste nível. A autoria viaja dentro da pasta do nível, então sobrevive a ser compactada, reenviada e publicada de novo por outra pessoa"
hint_level-preview_licenses_body: |-
  Os termos sob os quais estão este nível e os recursos dele. <b>As condições são registradas por recurso</b>, então um nível feito de partes emprestadas diz exatamente o que foi emprestado e em quais termos

  <color=#7FC97F><b>Recomendação:</b></color> leia-os antes de reutilizar qualquer coisa do nível de outra pessoa

  Mais: <link="https://bullethero.space/pt/docs/editor/rights/licensing-basics"><color=#59A6FF>Licenças: tudo em três minutos</color></link>
hint_level-preview_licenses_header: "Licenças"
hint_level_backups: "Todas as cópias automáticas deste nível, as mais recentes primeiro - o nome é o momento em que a cópia foi feita. Nada aqui é lido até você escolher uma. Restaurar substitui o arquivo do nível no disco e o recarrega, e o arquivo substituído é gravado nos backups antes, então uma restauração também pode ser desfeita"
hint_level_collections_body: |-
  <b>Importar</b> traz itens de uma coleção para este nível, <b>Criar uma coleção</b> copia os recursos deste nível para uma. Tudo o que um item precisa vem junto com ele, e uma importação é um único passo de desfazer

  <color=#E8B04B><b>Aviso:</b></color> quando o nível já tem uma versão diferente de um item, o jogo pergunta. Mantenha a versão do nível ou importe a da coleção como cópia com um novo ID

  Mais: <link="https://bullethero.space/pt/docs/editor/reference/library-and-collections"><color=#59A6FF>Biblioteca e coleções</color></link>
hint_level_collections_header: "Coleções"
hint_level_core-framerate: "Alterar isto diretamente acelera ou desacelera todos os objetos: os quadros-chave mantêm os números de quadro, então o mesmo nível é reproduzido em outra velocidade. Use o gerador para remapear o conteúdo para outra taxa de quadros"
hint_level_core-level-id: "O identificador permanente deste nível, gerado uma única vez na criação e nunca editado. Informe-o ao relatar um problema com o nível e use-o para distinguir duas cópias do mesmo nível"
hint_level_core-orientation_body: |-
  Como o aparelho deve ser segurado neste nível

  <b>Horizontal</b> e <b>Vertical</b> giram o dispositivo do jogador durante o nível e têm prioridade sobre a configuração do próprio jogador. No computador, um nível vertical é jogado entre barras laterais, e é assim mesmo que ele deve aparecer

  <b>Não definida</b> deixa a escolha para o jogador, e é uma <b>afirmação</b> de que o nível funciona bem nas <b>duas</b> orientações. Nada é reenquadrado nem redimensionado para isso, então verifique o nível dos dois jeitos antes

  Mais: <link="https://bullethero.space/pt/docs/editor/reference/level-settings"><color=#59A6FF>Configurações do nível</color></link>
hint_level_core-orientation_header: "Orientação do nível"
hint_level_core-runtime-seed: "A semente que esta sessão do editor está de fato usando agora. Sem semente definida acima, é um número novo a cada carregamento do nível. Regenerar sorteia outra sem mexer no nível"
hint_level_core-seed: "Cada valor aleatório deste nível sai desta semente somada à camada e ao quadro inicial de cada objeto, então, com a mesma semente, o nível sempre é jogado do mesmo jeito. 0 significa sem semente: o jogo gera uma nova a cada inicialização"
hint_level_core_body: |-
  Duração em quadros, taxa de quadros e as duas sementes do nível

  <color=#B48CE0><b>Vale saber:</b></color> <b>os quadros contam a partir de 1.</b> Um nível de N quadros tem os quadros de 1 a N, e N+1 é o limite final, não um quadro

  <b>Semente do nível</b> pertence ao próprio nível e pode ser desfeita. 0 significa "uma semente nova a cada execução" e é o padrão

  <color=#5EC8C8><b>Dica:</b></color> <b>Semente de execução</b> mostra o que esta sessão do editor resolveu. <i>Regenerar</i> sorteia uma nova só para a sessão - nada é gravado e nada entra no desfazer

  Mais: <link="https://bullethero.space/pt/docs/editor/basics/frames-and-time"><color=#59A6FF>Quadros, tempo e duração de um nível</color></link>
hint_level_core_header: "Principal"
hint_level_dangerous_body: |-
  Ações que destroem ou reescrevem arquivos, e não conteúdo

  <color=#E86A5A><b>Cuidado:</b></color> as listas suspensas de <b>formato de arquivo</b> reescrevem o nível e os metadados dele no disco. Reescrever em outro formato <b>exclui o arquivo que o formato antigo deixou</b>. Nada mais acontece: nada de recarregar, ressimular ou redefinir sua seleção e a pilha de desfazer, porque o modelo na memória já é exatamente o que é gravado

  <color=#E86A5A><b>Cuidado:</b></color> <b>Excluir nível</b> remove a pasta do nível do disco. Isso não pode ser desfeito

  Mais: <link="https://bullethero.space/pt/docs/editor/workflow/not-losing-work"><color=#59A6FF>Não perder seu trabalho</color></link>
hint_level_dangerous_header: "Zona de perigo"
hint_level_effect-editor_body: |-
  Crie um efeito de partículas e pré-visualize-o no canvas

  <color=#B48CE0><b>Vale saber:</b></color> os grupos de parâmetros são os mesmos que o inspetor do efeito mostra, editados aqui como <b>rascunho</b>: nada chega ao nível até você salvar

  <color=#5EC8C8><b>Dica:</b></color> salve na biblioteca compartilhada do dispositivo para reutilizar o efeito em outros níveis

  Mais: <link="https://bullethero.space/pt/docs/editor/performance/level-budget"><color=#59A6FF>O orçamento do nível</color></link>
hint_level_effect-editor_header: "Editor de efeitos"
hint_level_font-cache: "Quais glifos o nível prepara com antecedência, para que o texto não trave na primeira vez que um caractere aparece - por fonte e por idioma. Somente leitura: o gerador de cache de fontes preenche esta lista a partir do texto que o nível realmente contém, e nada nesta aba a edita"
hint_level_history_body: |-
  Cada edição desta sessão é uma linha aqui, a mais recente no topo, como em um git log. A coluna mais à esquerda é a linha principal, e uma coluna própria é um ramo que você deixou ao desfazer e seguir por outro caminho. O anel marca onde você está, o círculo verde marca o último salvamento

  Clicar em uma linha leva o nível de volta exatamente àquele estado, uma operação por quadro. O histórico existe só nesta sessão e nunca é gravado no disco

  <color=#E8B04B><b>Aviso:</b></color> o editor fica somente leitura enquanto esse percurso está em andamento. Cancelar o interrompe onde estiver, e esse é sempre um estado real

  Mais: <link="https://bullethero.space/pt/docs/editor/reference/level-settings"><color=#59A6FF>Configurações do nível</color></link>
hint_level_history_header: "Histórico"
hint_level_library-browser_body: |-
  Recursos salvos <b>neste dispositivo</b>, compartilhados por todos os níveis que você abre aqui

  <color=#B48CE0><b>Vale saber:</b></color> importar copia o recurso <i>para dentro do nível</i>. Um nível leva tudo de que precisa, então a biblioteca é uma conveniência para você, nunca uma dependência para quem joga seu nível

  Mais: <link="https://bullethero.space/pt/docs/editor/workflow/reuse"><color=#59A6FF>Reutilização: prefabs, cópia, geradores</color></link>
hint_level_library-browser_header: "Biblioteca"
hint_level_metadata-logo: "A capa é copiada para a pasta do nível como <color=#D4B483>logo.png</color> e mostrada em todo lugar onde o nível aparece listado. Ela é pensada para um quadrado de <color=#D4B483>512x512</color> em <color=#D4B483>PNG</color> - menor fica borrada na lista de níveis, maior só ocupa espaço. Remover só limpa a referência - o próprio arquivo continua na pasta"
hint_level_metadata-tags_body: |-
  As tags são palavras suas, mostradas exatamente como você escreve e nunca traduzidas. Um jogador filtra por elas no navegador de níveis, então uma tag só ajuda se outros níveis também a usam

  Separadas por vírgula. Mantenha-as curtas e gerais: um gênero, um clima, uma mecânica

  Mais: <link="https://bullethero.space/pt/docs/editor/reference/level-settings"><color=#59A6FF>Configurações do nível</color></link>
hint_level_metadata-tags_header: "Tags do nível"
hint_level_metadata_body: |-
  Tudo sobre o nível que não é o nível em si: nome, descrição, capa, licença, classificação etária e autores

  <color=#B48CE0><b>Vale saber:</b></color> nome e descrição são <b>textos localizados</b> - você escreve o texto de cada idioma aqui mesmo, sem nenhuma chave, porque um nível é conteúdo e não parte da interface do jogo. Um jogador cujo idioma você não preencheu vê a primeira entrada que você preencheu

  A licença e os autores viajam com o nível aonde quer que ele seja compartilhado, e é isso que faz o crédito sobreviver a um novo envio

  Mais: <link="https://bullethero.space/pt/docs/editor/reference/metadata-and-sharing"><color=#59A6FF>Metadados e compartilhamento de um nível</color></link>
hint_level_metadata_header: "Metadados"
hint_level_play-seed: "0 = usar a semente do próprio nível ou uma nova a cada execução"
hint_level_play_body: |-
  <color=#B48CE0><b>Vale saber:</b></color> opções de inicialização <b>só para esta execução</b> - nada aqui é salvo no nível

  <color=#5EC8C8><b>Dica:</b></color> vidas, velocidade, checkpoints e o bot permitem ensaiar um trecho sem editá-lo. A <b>semente</b> aqui tem prioridade sobre a do próprio nível: é a mais alta das três prioridades, e é ela que você usa quando quer repetir exatamente a execução que acabou de ver

  Mais: <link="https://bullethero.space/pt/docs/editor/craft/difficulty-curve"><color=#59A6FF>Dificuldade e curva</color></link>
hint_level_play_header: "Jogar"
hint_level_publication_body: |-
  Tudo o que envia este nível para algum lugar. Escolha um caminho no topo, e ele mostra as próprias configurações e verifica o nível sozinho. Um erro no relatório bloqueia o envio, avisos e sugestões ficam a seu critério

  <b>Arquivo compactado</b> funciona em qualquer lugar. Um <b>.zip</b> simples abre no Explorador de Arquivos do Windows sem instalar nada. <b>+ senha</b> abre no 7-Zip ou em qualquer outro compactador, <b>(gpg)</b> abre com o gpg
  <b>Oficina Steam</b> só existe na versão Steam e verifica o nível pelas regras da Oficina

  <color=#5EC8C8><b>Dica:</b></color> publique na Oficina primeiro com <b>Só eu</b> e veja o item antes de mostrá-lo a todos. Uma segunda publicação atualiza o mesmo item

  <color=#E8B04B><b>Aviso:</b></color> senha não é DRM. Qualquer pessoa com o arquivo e a senha sempre consegue abri-lo

  Mais: <link="https://bullethero.space/pt/docs/editor/reference/publishing"><color=#59A6FF>Publicação</color></link>
hint_level_publication_header: "Publicação"
hint_level_raw-add: "Adiciona um elemento ao slot de onde você abriu isto. Aqui só aparecem os campos simples do próprio elemento novo. Tudo o que é aninhado mantém o valor padrão e é editado depois na árvore"
hint_level_raw_body: |-
  Todo o modelo salvo do nível como uma única árvore de campos - o próprio arquivo, antes de o editor processá-lo

  <color=#E86A5A><b>Cuidado:</b></color> <b>nada aqui é validado.</b> Esta janela grava até um valor que o resto do editor considera impossível, então mantenha uma cópia da pasta do nível à mão

  Um ponto cheio significa que você alterou um campo nesta sessão, um ponto vazado significa que algo dentro dele mudou. <b>Aplicar</b> confirma a sessão inteira como uma única operação que pode ser desfeita

  Mais: <link="https://bullethero.space/pt/docs/editor/workflow/not-losing-work"><color=#59A6FF>Não perder seu trabalho</color></link>
hint_level_raw_header: "Dados brutos"
hint_level_resource-meta_body: |-
  Título, descrição, origens, licença e autores de um recurso

  <color=#B48CE0><b>Vale saber:</b></color> é assim que a atribuição sobrevive: uma textura, fonte ou arquivo de áudio tirado de algum lugar leva consigo, dentro do nível, de onde veio e sob quais termos, aonde quer que o nível vá

  <color=#7FC97F><b>Recomendação:</b></color> preencha isso ao adicionar o recurso - é o único momento em que você ainda se lembra

  Mais: <link="https://bullethero.space/pt/docs/editor/rights/resource-record"><color=#59A6FF>O registro de um recurso</color></link>
hint_level_resource-meta_header: "Metadados do recurso"
hint_level_resources-audios: "Arquivos de áudio que este nível carrega. Adicione um aqui primeiro e depois coloque-o como faixa na linha do tempo de áudio"
hint_level_resources-effects_body: |-
  Efeitos de partículas <color=#D4B483>VFX Graph</color> que o nível pode posicionar. Eles são <b>opcionais</b>: um nível que nunca usa nenhum é jogado exatamente como foi projetado

  Um efeito usa a aleatoriedade com semente do nível, então se repete igual em qualquer dispositivo. Os efeitos podem ser exportados para a biblioteca compartilhada do dispositivo

  Mais: <link="https://bullethero.space/pt/docs/editor/performance/level-budget"><color=#59A6FF>O orçamento do nível</color></link>
hint_level_resources-effects_header: "Efeitos"
hint_level_resources-fonts: "Fontes que este nível carrega, para os objetos de texto dele. Como qualquer outro recurso, uma fonte fica ao lado do nível e viaja com ele"
hint_level_resources-prefabs_body: |-
  Grupos reutilizáveis de objetos. Um prefab contém objetos-modelo, e cada posicionamento recebe cópias reais deles. Editar o modelo alcança todos os posicionamentos, e um posicionamento ainda pode ser diferente por meio de substituições por instância

  <color=#E8B04B><b>Aviso:</b></color> prefabs <b>não têm predefinições do jogo</b>, ao contrário de temas, efeitos e colisores - a biblioteca e as coleções são o caminho para levar um prefab de um nível a outro

  Mais: <link="https://bullethero.space/pt/docs/editor/workflow/reuse"><color=#59A6FF>Reutilização: prefabs, cópia, geradores</color></link>
hint_level_resources-prefabs_header: "Prefabs"
hint_level_resources-shapes_body: |-
  As formas próprias do nível, além das cerca de 500 que o jogo gera. Uma forma é <b>geometria real</b> ajustada à sua caixa delimitadora, então o retângulo do objeto é exatamente o que ele desenha

  <color=#5EC8C8><b>Dica:</b></color> uma forma e um colisor são o mesmo tipo de dado, e um objeto aponta para um deles para o que é desenhado e para o outro para o que é atingido. Nenhum deriva do outro, então um feixe de aviso inofensivo ou uma parede invisível é conteúdo comum

  Mais: <link="https://bullethero.space/pt/docs/editor/resources/level-needs"><color=#59A6FF>Do que um nível precisa</color></link>
hint_level_resources-shapes_header: "Formas"
hint_level_resources-textures_body: |-
  Imagens que este nível carrega. <b>O jogo em si não traz nenhuma textura</b> - toda textura que um nível usa é adicionada aqui e fica na pasta do nível, então viaja com ele

  <color=#B48CE0><b>Vale saber:</b></color> formas <b>não</b> são texturas. São geometria real e não precisam de nada desta aba

  Mais: <link="https://bullethero.space/pt/docs/editor/resources/images-and-fonts"><color=#59A6FF>Imagens e fontes</color></link>
hint_level_resources-textures_header: "Texturas"
hint_level_resources-themes_body: |-
  Um tema é uma <b>paleta para a qual as cores do nível podem apontar</b> em vez de conter valores literais. Trocar o tema ativo reestiliza tudo o que aponta para ele, e a troca é marcada com um quadro-chave na linha do tempo de eventos

  <color=#5EC8C8><b>Dica:</b></color> exporte um tema para a biblioteca compartilhada do dispositivo para reutilizá-lo em outros níveis

  Mais: <link="https://bullethero.space/pt/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>Cor, temas e pós-processamento</color></link>
hint_level_resources-themes_header: "Temas"
hint_level_rules_body: |-
  O que a validação encontrou neste nível: referências quebradas, IDs duplicados, ciclos de pais, prefabs com aninhamento profundo demais, segmentos de batida sobrepostos

  Algumas ocorrências podem ser corrigidas, uma de cada vez ou com <b>Corrigir tudo</b>. As correções vão para um rascunho: <b>Salvar</b> as aplica como uma única operação que pode ser desfeita, <b>Descartar</b> as joga fora. As ocorrências do grafo (IDs, pais, aninhamento de prefabs) não têm correção - são decisões de conteúdo que só você pode tomar

  <color=#5EC8C8><b>Dica:</b></color> um filho que ultrapassa o intervalo do pai <b>não</b> é relatado. Para ajustar os tempos de vida, execute o modificador <color=#D4B483>Ajuste de intervalos</color> em "Geradores"

  Mais: <link="https://bullethero.space/pt/docs/editor/workflow/not-losing-work"><color=#59A6FF>Não perder seu trabalho</color></link>
hint_level_rules_header: "Regras"
hint_level_shape-editor_body: |-
  Monte uma forma a partir de pontos e das arestas entre eles. <b>Os triângulos são derivados, nunca editados</b>, então um vértice compartilhado por três triângulos é um único ponto para arrastar

  <color=#E8B04B><b>Aviso:</b></color> o formato armazena triângulos, não arestas - uma aresta que não fecha nenhum contorno é descartada ao salvar, e o editor avisa sobre isso

  Mais: <link="https://bullethero.space/pt/docs/editor/resources/images-and-fonts"><color=#59A6FF>Imagens e fontes</color></link>
hint_level_shape-editor_header: "Editor de formas"
hint_level_theme-editor_body: |-
  Os slots que um tema oferece e as cores que os preenchem

  <color=#E86A5A><b>Cuidado:</b></color> os slots são aquilo para onde o conteúdo do nível aponta, então <b>renumerá-los muda o visual de tudo o que os referencia</b> - a posição de um slot é a identidade dele

  <color=#5EC8C8><b>Dica:</b></color> salve um tema terminado na biblioteca compartilhada do dispositivo para reutilizá-lo em outros níveis

  Mais: <link="https://bullethero.space/pt/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>Cor, temas e pós-processamento</color></link>
hint_level_theme-editor_header: "Editor de temas"
hint_menu_level-ai: "O autor declarou que o nível, a capa ou um dos recursos dele foi gerado por IA. Os desenvolvedores não verificam isso - um nível traz o que o autor escreveu"
hint_menu_level-authors: "Quem fez este nível, conforme os metadados dele listam. O botão Autores abre a lista completa com links"
hint_menu_level-bot_body: |-
  <b>Um bot joga o nível por você, com os seus controles.</b> Ele anda, usa o dash, sofre dano e morre como você, e não pode trapacear: a mesma velocidade, o mesmo dash, a mesma hitbox

  <b>Reflex Bot v1</b> olha 1.5 segundos à frente e se esquiva do que vê, recalculando tudo a cada quadro. Não precisa de preparação, então a partida começa na hora. O que o derrota é um padrão em que era preciso entrar um segundo antes

  <b>Warm Bot v1</b> calcula a rota pelo nível inteiro antes de a partida começar e tenta não sofrer nenhum dano

  <color=#E8B04B><b>Aviso:</b></color> essa rota é uma etapa extra de carregamento e pode levar dezenas de segundos. Você pode cancelá-la e jogar o nível você mesmo

  <b>Não é garantia de que o nível será concluído.</b> Um bot nunca se cansa, mas ainda assim perde. Ele também custa desempenho a cada quadro, então espere uma taxa de quadros menor em um dispositivo fraco

  Vale a pena enviar um nível que vence um bot: abra uma issue em <link="https://github.com/bullet-hero/releases/issues"><color=#59A6FF>bullet-hero/releases</color></link>, diga qual bot perdeu e onde, e anexe a pasta do nível

  Mais: <link="https://bullethero.space/pt/docs/editor/workflow/bot-playtest"><color=#59A6FF>Deixar um bot jogar seu nível</color></link>
hint_menu_level-bot_header: "Bots"
hint_menu_level-checkpoints: "Se a partida conta os checkpoints que o autor colocou. Ativado, uma morte volta o nível ao último checkpoint alcançado e restaura suas vidas. Desativado, volta ao início. Partidas com e sem eles têm recordes separados"
hint_menu_level-identity: "Qual nível este realmente é: a fonte em que foi encontrado, o ID sob o qual as estatísticas dele são registradas e a pasta que o contém, quando essa pasta não leva o nome do ID. Um nível embutido e uma cópia que você fez dele compartilham todos os outros dados desta tela e diferem nestes"
hint_menu_level-lives: "Quantos impactos a partida aguenta. No Zen você ainda é atingido e empurrado, só que a partida nunca termina. Personalizado aceita qualquer quantidade que o controle deslizante alcançar. Sem colisão é separado: nada toca em você, e essas partidas têm recordes próprios"
hint_menu_level-music: "Quem compôs a música, conforme registram os metadados do próprio nível. O botão Licenças reúne todos os outros recursos que o nível traz"
hint_menu_level-no-collision: "O avatar atravessa tudo, então nada pode atingi-lo. Isso é separado do Zen, em que os impactos ainda acontecem e a partida simplesmente nunca termina. Partidas sem colisão têm recordes próprios"
hint_menu_level-rating: "A classificação etária que o autor declarou. Os desenvolvedores não verificam isso - um nível traz o que o autor escreveu"
hint_menu_level-record: "Seu próprio histórico com este nível, para as opções de início selecionadas agora à direita. Mude as vidas, a velocidade, os checkpoints, o bot ou Sem colisão e o recorde muda junto: uma partida em outras condições é outra conquista, então cada conjunto mantém o próprio melhor resultado. Tentativas e conclusões contam todas as partidas, quaisquer que sejam as configurações"
hint_menu_level-seed: "O número de onde sai cada valor aleatório do nível. A mesma semente reproduz a mesma partida em qualquer dispositivo, e 0 significa que o nível sorteia uma nova a cada vez"
hint_menu_level-speed: "Com que velocidade o nível e a música dele tocam. Personalizado aceita qualquer velocidade que o controle deslizante alcançar, não só as três predefinições"
hint_mod_content_remover_body: |-
  Exclui o conteúdo do nível que corresponde ao que você seleciona aqui

  <color=#E86A5A><b>Cuidado:</b></color> ele reescreve o que já existe em vez de adicionar, então leia os parâmetros antes de executar: desfazer é um passo só, mas é o único caminho de volta

  Mais: <link="https://bullethero.space/pt/docs/editor/workflow/reuse"><color=#59A6FF>Reutilização: prefabs, cópia, geradores</color></link>
hint_mod_content_remover_header: "Remoção de conteúdo"
hint_mod_framerate_remap_body: |-
  Reescala cada número de quadro do nível para outra taxa de quadros, para que os tempos caiam no mesmo ponto em segundos que antes

  <color=#E8B04B><b>Aviso:</b></color> quadros são números inteiros, então o que não se divide exatamente é arredondado - um nível remapeado duas vezes não tem garantia de voltar ao ponto de partida

  Mais: <link="https://bullethero.space/pt/docs/editor/basics/frames-and-time"><color=#59A6FF>Quadros, tempo e duração de um nível</color></link>
hint_mod_framerate_remap_header: "Remapeamento da taxa de quadros"
hint_mod_prefab_flatten_body: |-
  Transforma cada posicionamento de prefab neste escopo em objetos comuns. O vínculo com o modelo some, os objetos ficam exatamente onde estavam

  <color=#B48CE0><b>Vale saber:</b></color> o nível fica igual depois - nada é excluído nem movido, e as substituições de cada posicionamento já estão gravadas nos objetos. Os modelos continuam no nível, a menos que você peça para removê-los

  Mais: <link="https://bullethero.space/pt/docs/editor/reference/modifiers"><color=#59A6FF>Modificadores</color></link>
hint_mod_prefab_flatten_header: "Achatamento de prefabs"
hint_mod_quantize_keyframes_body: |-
  Encaixa os quadros-chave em um passo regular, que é como uma animação solta feita à mão é puxada para a batida

  <color=#E8B04B><b>Aviso:</b></color> dois quadros-chave que caem no mesmo quadro se fundem em um só, então quantizar de forma grosseira perde detalhes em vez de comprimi-los

  Mais: <link="https://bullethero.space/pt/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>Ritmo e estrutura</color></link>
hint_mod_quantize_keyframes_header: "Quantização de quadros-chave"
hint_mod_span_fit_body: |-
  Faz o tempo de vida dos filhos caber dentro do tempo de vida dos pais, seja limitando os filhos para dentro, seja expandindo os pais para fora

  <color=#B48CE0><b>Vale saber:</b></color> um filho que ultrapassa o pai é um dado válido que simplesmente é reproduzido cortado, então isso é uma decisão de conteúdo e não um reparo - é por isso que nada o executa por você. As âncoras ficam intactas em qualquer caso

  Mais: <link="https://bullethero.space/pt/docs/editor/basics/frames-and-time"><color=#59A6FF>Quadros, tempo e duração de um nível</color></link>
hint_mod_span_fit_header: "Ajuste de intervalos"
hint_mod_span_stagger_body: |-
  Desloca uma seleção no tempo para que objetos que começavam juntos cheguem um depois do outro

  Mais: <link="https://bullethero.space/pt/docs/editor/workflow/reuse"><color=#59A6FF>Reutilização: prefabs, cópia, geradores</color></link>
hint_mod_span_stagger_header: "Escalonamento de intervalos"
hint_mod_test_rename_body: "Um gerador de desenvolvimento para os caminhos de renomeação. Não serve para criar conteúdo"
hint_mod_test_rename_header: "Renomeação (teste)"
hint_sandbox_attacks-auto: "Ondas aleatórias por conta própria, como no fundo do menu principal"
hint_sandbox_attacks-fire: "Cada botão dispara contra você uma onda daquele ataque"
hint_sandbox_attacks-gap: "Segundos entre duas ondas enquanto elas vêm por conta própria"
hint_sandbox_controls-gyro: "Liga o sensor de movimento como dispositivo de controle"
hint_sandbox_controls-mode: "O modo do dispositivo com que você está controlando agora - é salvo na hora e vale em todo o jogo"
hint_sandbox_game-bot: "Entrega o avatar ao bot que joga no fundo do menu principal"
hint_sandbox_game-free-camera: "Mova a vista com o botão do meio do mouse ou com dois dedos, dê zoom com a roda ou com um gesto de pinça. A moldura mostra o que a câmera do nível vê"
hint_sandbox_game-lives: "Impactos antes de uma morte. A morte acontece como em um nível e traz o avatar de volta ao centro"
hint_sandbox_game-speed: "Desacelera ou acelera só os ataques - o avatar mantém a própria velocidade"
hint_sandbox_tutorial_body: |-
  Seis passos pelos controles. Cada um verifica o que você realmente fez. Um impacto ou uma morte reinicia só o passo em que aconteceu e o deixa vermelho até esse passo ser concluído

  Pressione um passo para jogá-lo, mesmo um já concluído. O tutorial só conta como terminado quando todos os passos forem concluídos

  <color=#E8B04B><b>Aviso:</b></color> com <b>Imortal</b> ativado, os impactos não são contados, então o tutorial também não os vê

  Mais: <link="https://bullethero.space/pt/docs/game/sandbox"><color=#59A6FF>Sandbox e tutorial</color></link>
hint_sandbox_tutorial_header: "Tutorial"
hint_settings_audio: "Volume geral, o que um nível toca no jogo e no editor, e os sons próprios da interface fora e dentro do editor de níveis"
hint_settings_audio-editor-game: "Volume do que um nível toca dentro do editor - o mesmo nível, tocado do mesmo jeito que no jogo, mas ouvido por horas em vez de uma vez, por isso o volume do próprio jogo fica como está"
hint_settings_audio-editor-ui: "Volume dos sons próprios do editor de níveis. Esses sons só marcam o resultado de uma edição - um salvamento, uma recusa, um desfazer, uma exclusão - nunca um clique comum"
hint_settings_audio-game: "Volume do que um nível toca - a música e os sons dele"
hint_settings_audio-ui: "Volume da interface fora do editor de níveis: menus, listas de níveis, configurações"
hint_settings_audio-volume: "Volume geral. Todo o resto é escalado por ele"
hint_settings_controls_body: |-
  Como você controla o jogador, por tipo de dispositivo - teclado e mouse, tela sensível ao toque, gamepad e giroscópio do dispositivo

  <color=#B48CE0><b>Vale saber:</b></color> vários tipos podem estar ativos ao mesmo tempo - quem controla é o que você tocou por <b>último</b>, e o dash ou a pausa funcionam a partir de qualquer um deles

  <color=#5EC8C8><b>Dica:</b></color> o giroscópio fica em repouso com o celular <b>deitado</b>, tela para cima - incline-o para fora da horizontal para se mover, e aumente a <b>Sensibilidade</b> se precisar inclinar demais

  Mais: <link="https://bullethero.space/pt/docs/game/controls"><color=#59A6FF>Controles</color></link>
hint_settings_controls_header: "Controles"
hint_settings_game-editor-autosave: "Grava uma cópia do nível periodicamente. Nunca sobrescreve o nível que você salvou - as cópias são uma rede de segurança, não um salvamento"
hint_settings_game-editor-autosave-rate: "Segundos entre as cópias automáticas"
hint_settings_game-editor-camera-invert: "Se arrastar move o nível junto com o ponteiro ou move a câmera. As duas opções parecem naturais para alguém"
hint_settings_game-editor-camera-max-size: "Até onde o zoom do viewport do editor pode se afastar"
hint_settings_game-editor-camera-min-size: "Até onde o zoom do viewport do editor pode se aproximar"
hint_settings_game-editor-camera-sensitivity-x: "Quanto a vista se desloca na horizontal por unidade de movimento do ponteiro"
hint_settings_game-editor-camera-sensitivity-y: "Quanto a vista se desloca na vertical por unidade de movimento do ponteiro"
hint_settings_game-editor-camera-wheel-multiplier: "Quanto zoom cada clique da roda do mouse aplica"
hint_settings_game-editor-camera-zoom-to-mouse: "Dá zoom em direção ao cursor em vez do centro do viewport. Desativado, o centro fica parado enquanto você dá zoom"
hint_settings_game-editor-create-shape-size-x: "Largura com que uma nova forma começa, antes de qualquer escala própria"
hint_settings_game-editor-create-shape-size-y: "Altura com que uma nova forma começa, antes de qualquer escala própria"
hint_settings_game-editor-create-text-size-x: "Largura do bloco em que um novo texto distribui os glifos, não o tamanho dos glifos"
hint_settings_game-editor-create-text-size-y: "Altura do bloco em que um novo texto distribui os glifos, cerca de uma linha por unidade"
hint_settings_game-editor-effects-active-default: "Se os efeitos de pós-processamento do nível já aparecem na pré-visualização quando o editor abre. É só o estado inicial - desativá-los durante o trabalho nunca o altera. Um celular começa com eles desativados, já que o pós-processamento é a coisa mais cara que o editor desenha"
hint_settings_game-editor-gizmos-scale: "O tamanho com que as alças de arrasto do viewport são desenhadas. Uma alça dimensionada para o mouse é difícil de acertar com o polegar"
hint_settings_game-editor-grid-active-default: "Se a grade do viewport já está ativada quando o editor abre. É só o estado inicial - desativar a grade durante o trabalho nunca o altera"
hint_settings_game-editor-grid-opacity: "Quão visível é a grade. Uma grade fraca demais para ser lida nem chega a ser desenhada"
hint_settings_game-editor-grid-size: "O espaçamento da grade do viewport, em unidades do nível"
hint_settings_game-editor-history-length: "Quantos passos de edição a sessão mantém antes de descartar o ramo mais antigo. Mais custa memória e nada além disso"
hint_settings_game-editor-history-objects: "Quantos objetos o histórico mantém, um limite que vale junto com o de passos. Uma exclusão em massa é um único passo com 50 000 deles, e é isso que este limite pega. 0 remove o limite, abaixo de 0 o dispositivo decide"
hint_settings_game-editor-interface-dirty-field-delay: "Quanto tempo um campo do inspetor espera depois da sua última tecla antes de aplicar o valor. Zero aplica a cada tecla e permite desfazer cada uma delas"
hint_settings_game-editor-interface-levels-layout: "Como a lista de níveis do editor abre: uma lista de linhas com descrições ou uma grade de capas. O botão ao lado do campo de pesquisa ainda alterna a vista até você fechar o editor"
hint_settings_game-editor-interface-log-clamps: "Informa no console quando um valor digitado foi trazido de volta para dentro dos limites permitidos. A limitação acontece de qualquer forma"
hint_settings_game-editor-interface-rotation-unit: "A unidade em que os campos de rotação são exibidos e digitados. Os ângulos são sempre armazenados em radianos de qualquer forma"
hint_settings_game-editor-level-serialize-mode: "O formato de arquivo em que um nível é gravado. <b><color=#D4B483>Json</color></b> é texto - legível e reparável à mão. <b><color=#D4B483>Blob</color></b> é binário - carrega dezenas de vezes mais rápido, e é quase irreparável depois de danificado"
hint_settings_game-editor-max-autosave-files: "Quantas cópias são mantidas. A mais antiga é descartada quando o limite é atingido"
hint_settings_game-editor-mcp-enabled: "Permite que um assistente de IA compatível com MCP se conecte a este editor e edite o nível aberto. Só este computador pode se conectar, e tudo o que a IA faz em um lote é um único passo no histórico"
hint_settings_game-editor-mcp-follow-ai: "Para onde vai o indicador depois que a IA olha um quadro. Desativado: volta para onde você o deixou. Ativado: fica pausado no quadro que a IA olhou. Se você tocar na linha do tempo enquanto a IA olha, o indicador fica onde você o colocou"
hint_settings_game-editor-mcp-operation-delay: "Quanto tempo o editor espera entre duas operações da IA, para você poder acompanhá-las. <b><color=#D4B483>0</color></b> aplica cada uma na hora. Reproduzir, pausar e mover o indicador nunca sofrem atraso. De 0 a 5"
hint_settings_game-editor-mcp-port: "A porta em que o editor escuta. <b><color=#D4B483>0</color></b> escolhe uma livre a cada início. Caso contrário, <b><color=#D4B483>1024-65535</color></b>"
hint_settings_game-editor-mcp-reveal-edits: "Depois de cada edição da IA, seleciona e localiza o que ela criou ou alterou. Nunca enquanto você está arrastando, digitando ou reproduzindo"
hint_settings_game-editor-multi-select-requires-hold: "Se adicionar a uma seleção exige segurar de propósito. Ativado é mais seguro em tela sensível ao toque, onde um toque acidental muda o que está selecionado"
hint_settings_game-editor-pick-invisible-aabb: "Permite que um clique selecione um objeto que não desenha nada. Necessário para paredes invisíveis, que têm hitbox e não têm forma"
hint_settings_game-editor-player-active-default: "Se o jogador de teste já está presente quando o editor abre. Em tela sensível ao toque ele também ocupa o viewport, então em um celular normalmente se deixa isto desativado"
hint_settings_game-editor-player-bot: "Entrega o jogador de teste ao <color=#D4B483>Reflex Bot v1</color> em vez de a você. É o único bot oferecido aqui, porque não precisa de nada preparado com antecedência e continua funcionando enquanto você edita - em qualquer velocidade de reprodução, inclusive de trás para frente. Ele joga pelas mesmas regras que você: sofre dano e pode ficar encurralado. Logo depois de você arrastar o indicador, ele joga pior por um momento enquanto reconstrói o que sabe sobre o futuro. A escolha entre bots pertence a uma partida, na aba Jogar desta tela"
hint_settings_game-editor-player-bot-debug: "O interruptor geral das sobreposições de diagnóstico do bot. Desativado por padrão. Tudo abaixo dele vem ativado, então ligá-lo mostra tudo de uma vez"
hint_settings_game-editor-player-bot-debug-grid: "Desenha quanto espaço o bot acredita que cada parte da tela tem, no pior caso entre tudo o que ele consegue ver à frente. Vermelho é um lugar onde ele espera ser atingido. Nada é desenhado onde ele se considera seguro"
hint_settings_game-editor-player-bot-debug-reach: "Desenha até onde o bot acredita que consegue chegar antes do fim da janela que ele planeja - o anel interno andando, o externo gastando o dash. Ele nunca escolhe um alvo fora deles"
hint_settings_game-editor-player-bot-debug-target: "Desenha o ponto para onde o bot está indo agora. Ele mantém uma escolha até surgir uma claramente melhor, então um alvo que para de se mover é o bot satisfeito, não travado"
hint_settings_game-editor-player-reset-gizmos: "Desativa o modo de gizmo ativo quando o jogador de teste é ligado, para que uma alça de arrasto não fique sob o seu dedo"
hint_settings_game-editor-preview-collider-on-select: "Mostra a hitbox de um objeto selecionado. Aqui o que é desenhado e o que é atingido são coisas separadas, então podem ser diferentes"
hint_settings_game-editor-publish-language: "Em qual idioma o título e a descrição de um item da Oficina são publicados primeiro. <b><color=#D4B483>Inglês</color></b> ou <b><color=#D4B483>Do sistema</color></b> - o idioma do próprio dispositivo"
hint_settings_game-editor-resources-serialize-mode: "A mesma escolha para os recursos que um nível traz"
hint_settings_game-editor-selection-collider-opacity: "Quão sólida é desenhada a hitbox de um objeto selecionado"
hint_settings_game-editor-selection-collider-opacity-view: "O mesmo, para a vista que mostra todas as hitboxes de uma vez - mais fraca, porque centenas delas se sobrepõem ali"
hint_settings_game-editor-selection-long-press-delay: "Quanto tempo uma linha ou um clipe precisa ser segurado antes de entrar na seleção múltipla. Aumente se seleções acontecem sem querer"
hint_settings_game-editor-selection-long-press-threshold: "Quanto o ponteiro pode se desviar durante esse toque longo antes de contar como arrasto. Aumente para uma mão instável"
hint_settings_game-editor-timeline-edge-handle: "A largura da borda de um clipe que o redimensiona. Arrastar o resto do clipe o move inteiro"
hint_settings_game-editor-timeline-loop-global: "Se o indicador volta ao início no fim do nível em vez de parar"
hint_settings_game-editor-timeline-loop-local: "O mesmo para a linha do tempo local, que repete o tempo de vida de um único objeto"
hint_settings_game-editor-timeline-snap-threshold: "Quão perto uma borda arrastada precisa chegar antes de se encaixar em um quadro candidato"
hint_settings_game-editor-timeline-time-format: "Em que contam a régua de uma linha do tempo e a leitura do indicador. Nada muda no nível - o mesmo quadro é endereçado de qualquer forma. Compassos e batidas lê a grade de batidas do próprio nível e volta a um timecode onde a grade não tem segmento"
hint_settings_game-editor_body: |-
  <b>Salvamento automático</b> salva o nível periodicamente e grava uma cópia de backup a cada vez. <b>Máx. de salvamentos automáticos</b> limita quantas cópias são mantidas

  <b>Tamanho mín. da câmera</b> e <b>Tamanho máx. da câmera</b> limitam o zoom do viewport. <b>Seleção múltipla exige segurar</b> e <b>Selecionar AABB invisível</b> mudam o que um clique no viewport significa

  Os campos <b>Formato do nível</b> e <b>Formato dos recursos</b> definem o formato padrão de gravação em disco

  Mais: <link="https://bullethero.space/pt/docs/editor/workflow/speed-and-shortcuts"><color=#59A6FF>Velocidade e atalhos</color></link>
hint_settings_game-editor_header: "Editor do jogo"
hint_settings_general: "O idioma e quantos recursos o jogo carrega ao mesmo tempo. Com o <b>Idioma</b> vazio, o jogo segue o dispositivo"
hint_settings_general-language: "Idioma da interface. Vazio, segue o dispositivo. Não afeta o texto próprio de um nível, que o próprio nível traz"
hint_settings_general-resource-parallel-load-count: "Quantos arquivos de um nível carregam ao mesmo tempo. Um valor maior termina antes em um disco rápido e pode engasgar em um lento"
hint_settings_general-resource-web-timeout: "Quanto tempo esperar por um arquivo baixado pela rede antes de desistir, em segundos"
hint_settings_general-show-all-found-content: "Lista também o conteúdo que uma fonte encontrou mas não consegue confirmar que é seu - os arquivos de um item da Oficina cuja inscrição foi cancelada, ou uma pasta copiada à mão. Esses níveis são marcados no cartão. Desativado, uma fonte lista só o que ela garante"
hint_settings_graphics-antialiasing-hdr: "Valores de cor acima de 1. Nada aqui precisa deles, e o HDR dobra o uso de banda da memória, por isso vem desativado por padrão"
hint_settings_graphics-antialiasing-msaa: "Quantas amostras o <color=#D4B483>MSAA</color> coleta por pixel. Mais é mais suave e custa mais, e o custo cresce com a quantidade de conteúdo transparente sobreposto"
hint_settings_graphics-antialiasing-type: "Como o serrilhado das bordas é removido. <b><color=#D4B483>MSAA</color></b> o resolve com exatidão, porque toda forma aqui é geometria real. <b><color=#D4B483>FXAA</color></b> custa uma única passada, faça a cena o que fizer, e essa é a troca que um celular fraco enfrenta"
hint_settings_graphics-audio-pitch-correction: "Com que força a velocidade do áudio é alterada para alcançar a simulação. Um valor maior corrige mais cedo e fica mais audível"
hint_settings_graphics-audio-render: "Reproduzir ou não o áudio do nível. Desativado, todo nível roda em silêncio e as configurações de áudio abaixo deixam de importar - para um dispositivo em que o próprio som já pesa demais"
hint_settings_graphics-audio-render-effects: "Aplicar os efeitos de áudio da faixa durante a edição. Desativado, você ouve o clipe cru"
hint_settings_graphics-audio-resync-jump-time: "Quanto o áudio e a simulação podem se afastar antes de o áudio saltar de volta para o lugar em vez de ser corrigido aos poucos"
hint_settings_graphics-audio-scrub-time: "Quanto dura o trecho que se ouve quando você arrasta o indicador pela faixa"
hint_settings_graphics-audio-sync-dead-zone: "Desvios menores que isto são ignorados. Sem uma zona morta, o áudio seria corrigido o tempo todo e de forma audível"
hint_settings_graphics-audio-use-scrub: "Reproduzir o áudio sob o indicador enquanto você o arrasta, para encontrar um momento de ouvido"
hint_settings_graphics-avatar-render: "O corpo do avatar é uma grade de 25 quadrados, e perder vida os apaga da borda para dentro ao longo de algumas rachaduras - assim uma partida que vai mal se vê no próprio jogador, e não numa barra. Um quadrado perdido fica como um fantasma pálido, e o anel da hitbox por baixo aparece através dele. Desativado, a grade vira um só quadrado e a vida o esmaece: a mesma leitura, um objeto em vez de 25, para um dispositivo que prefere não desenhá-los"
hint_settings_graphics-colliders-mode-active: "Um modo para treinar. Um nível que você joga desenha cada hitbox como um preenchimento chapado sobre um fundo liso e nada mais: decorações, textos, efeitos, pós-processamento e o fundo do tema somem. Tudo o que decide a partida fica - a música, a colisão, a câmera e seu tremor, os checkpoints, o HUD e as estatísticas - e uma partida aqui conta como qualquer outra. Só a tela do jogo: o editor e o sandbox desenham como sempre"
hint_settings_graphics-colliders-mode-background: "O que é desenhado atrás dos preenchimentos. É cinza-escuro, e não preto, de propósito: as barras em volta do quadro da câmera são pretas, e um fundo preto esconderia onde termina o quadro do nível"
hint_settings_graphics-colliders-mode-color: "Com o que o modo preenche as hitboxes. A vista de colisores do editor usa o mesmo tom com a própria opacidade, então os dois sempre combinam. \"Redefinir gráficos\" traz de volta o vermelho original"
hint_settings_graphics-colliders-mode-use-alpha: "Ativado, os preenchimentos ficam translúcidos conforme o alfa da cor, e dois perigos sobrepostos aparecem como uma mancha mais escura. Desativado, todo preenchimento é sólido - mais fácil de ler numa tela pequena, mas as sobreposições se fundem numa só forma. No jogo, o alfa nunca fica abaixo de 0.15, porque qualquer coisa mais fraca é invisível"
hint_settings_graphics-effects-fixed-framerate: "A taxa em que os efeitos são simulados, independentemente de com que frequência são desenhados"
hint_settings_graphics-effects-frame-step-budget: "Quantos passos de efeito um único quadro pode gastar, para que recuperar o atraso nunca custe um travamento visível"
hint_settings_graphics-effects-framerate-target: "Com que frequência os efeitos são desenhados. Abaixo da taxa do próprio jogo é uma economia barata, porque as partículas continuam legíveis com um passo mais grosso"
hint_settings_graphics-effects-max-scrub-time: "Quanto do histórico de efeitos o editor reproduz de novo quando você faz o indicador saltar. Mais longo é mais preciso e mais lento"
hint_settings_graphics-effects-render: "Desenhar ou não os efeitos de partículas. Eles enriquecem um nível, mas nenhum nível depende deles, então é seguro abrir mão disso"
hint_settings_graphics-effects-replay-step-budget: "Quantos passos de simulação um único recálculo pode gastar. O limite é o que impede que um salto para um trecho denso congele o editor"
hint_settings_graphics-fixed-framerate: "O limite que o jogo mantém enquanto \"Alvo da taxa de quadros\" está em \"Fixa\" - com que frequência a tela é redesenhada, e nada mais. Um nível é simulado em tempo real, então a mesma partida roda igual a 30 e a 144. Ignorado enquanto o VSync está ativado"
hint_settings_graphics-framerate-target: "Quadros por segundo que o jogo busca. Aplicado diretamente, e não pela sincronização vertical"
hint_settings_graphics-postprocessing-render: "O interruptor geral de todos os efeitos de câmera abaixo. Desativado, a pilha inteira é pulada"
hint_settings_graphics-postprocessing-render-analog-glitch: "Interferência analógica: bandas que rolam, linhas de varredura rasgadas, cor que vaza"
hint_settings_graphics-postprocessing-render-bloom: "Áreas claras espalham luz sobre o que as rodeia"
hint_settings_graphics-postprocessing-render-chroma: "Os canais de cor se separam rumo às bordas da tela, como numa lente barata"
hint_settings_graphics-postprocessing-render-color-curves: "Curvas de cor por canal, para uma correção de cor fina"
hint_settings_graphics-postprocessing-render-digital-glitch: "Corrupção digital: blocos deslocados, como se os quadros estivessem danificados"
hint_settings_graphics-postprocessing-render-grain: "Granulação de filme sobre a imagem"
hint_settings_graphics-postprocessing-render-lens: "A imagem se curva como uma lente real a curvaria"
hint_settings_graphics-postprocessing-render-lift-gamma-gain: "Correção de cor dividida em três: sombras, meios-tons e realces"
hint_settings_graphics-postprocessing-render-motion-blur: "Movimentos rápidos borram. Convém desativar se isso deixar os projéteis mais difíceis de ler"
hint_settings_graphics-postprocessing-render-shadows-midtones-highlights: "As mesmas três zonas de novo, mas cada uma é tingida separadamente em vez de clareada ou escurecida"
hint_settings_graphics-postprocessing-render-vignette: "As bordas da tela escurecem, puxando a atenção para o centro"
hint_settings_graphics-postprocessing-render-white-balance: "Desloca o que conta como branco, deixando a imagem toda mais quente ou mais fria"
hint_settings_graphics-render-scale: |-
  Quantos pixels o próprio jogo renderiza antes de o resultado ser escalado para a janela

  Abaixo de 1, o jogo desenha menos pixels e os estica - a coisa mais eficaz de reduzir numa máquina fraca, porque o custo de fragmentos cai com o <b>quadrado</b> do valor. Acima de 1, renderiza maior e reduz o resultado, o que é supersampling

  A interface é desenhada de qualquer forma em uma textura própria, em tamanho real, então textos e botões ficam nítidos seja qual for este valor. O número multiplica a escala com que esta classe de dispositivo já vem, em vez de substituí-la
hint_settings_graphics-resolution: |-
  O tamanho da janela do jogo em pixels, oferecido entre os modos que esta tela realmente informa - então nada aqui pode pedir um modo que o monitor não consegue mostrar

  É também a forma de mudar a orientação no computador: uma resolução mais alta que larga põe a interface no mesmo layout vertical que um celular em pé recebe. Um monitor não pode ser girado de dentro do jogo, então isto e o tamanho da janela são as únicas alavancas que existem

  Se você não mexer, é usada a resolução nativa da tela
hint_settings_graphics-textures-compression: "Empacota as imagens em um formato <color=#D4B483>comprimido</color> ao carregar. De quatro a oito vezes menos memória, e artefatos de bloco onde um gradiente ou uma borda dura encontra um bloco 4x4. Lido quando um nível carrega, não enquanto um está aberto"
hint_settings_graphics-textures-compression-quality: "Tempo de carregamento contra artefatos de compressão. A imagem acaba do mesmo tamanho de qualquer forma, e os celulares ignoram essa configuração por completo"
hint_settings_graphics-textures-filtering: "Como as imagens são amostradas ao serem desenhadas, e nada mais - como uma imagem é reduzida depende de como o autor dela a marcou, não desta configuração"
hint_settings_graphics-textures-mipmaps: "Cópias reduzidas de cada imagem, para que uma desenhada pequena pare de cintilar ao se mover. Um terço a mais de memória, e a única cura para essa cintilação"
hint_settings_graphics-textures-size-limit: "O teto de quão grande uma imagem pode ser na memória aqui. A memória cai com o QUADRADO do lado, então isto economiza mais que a compressão, e é o único dos três que limita o quanto um nível pode custar"
hint_settings_graphics-vsync: |-
  Se o jogo espera a atualização da tela antes de mostrar um quadro

  <b>Desativado</b> mostra cada quadro assim que fica pronto. Nada espera, então a entrada chega à tela na primeira oportunidade - e um quadro terminado no meio de uma atualização é desenhado pela metade sobre o anterior, o chamado tearing

  <b>Ativado</b> apresenta uma vez por atualização, então o tearing some e cada quadro custa até uma atualização de latência extra. <b>Metade da taxa</b> apresenta uma vez a cada duas atualizações - mais estável numa máquina que não sustenta a taxa cheia, com o dobro dessa latência

  Enquanto isto não estiver em Desativado, a Unity ignora por completo o limite de taxa de quadros acima, por isso essas duas linhas ficam acinzentadas

  Um celular apresenta no próprio ritmo e isto não faz nada lá
hint_settings_graphics-window-mode: |-
  Como a janela do jogo ocupa a tela

  <b>Em janela</b> é o único modo que você pode redimensionar livremente, e redimensionar é o que muda a proporção do jogo - arraste a janela até ficar mais alta que larga e a interface inteira passa para o layout vertical, exatamente como um celular em pé

  <b>Janela sem bordas</b> é o padrão: a tela preenchida, sem troca de modo e com alt-tab instantâneo. <b>Tela cheia exclusiva</b> entrega a tela inteira ao jogo, o que é um pouco mais rápido, mas demora mais para sair

  Um celular tem uma janela só e ela é a tela, então isto não faz nada lá
hint_settings_graphics_body: |-
  <b>Antialiasing.</b> <color=#D4B483>MSAA</color> é o padrão porque toda forma neste jogo é geometria real, então toda borda serrilhada é uma borda geométrica real - o único caso que o multisampling resolve com exatidão, com nitidez total, em todas as plataformas. <b><color=#D4B483>FXAA</color></b> é a alternativa para celulares mais fracos: custa uma passada de tela cheia, não importa quanto o nível redesenhe por cima, enquanto o custo do <color=#D4B483>MSAA</color> cresce com o overdraw transparente. <b>TAA não é oferecido de propósito</b> - o rastro atrás de projéteis rápidos é um problema de legibilidade neste gênero, e a oscilação dele briga com os efeitos de glitch

  <b>Taxa de quadros.</b> O alvo é aplicado manualmente, e não pelo VSync. A taxa fixa de simulação separa a simulação da exibição, e é isso que mantém o timing de um nível idêntico numa tela de 60 Hz e numa de 144 Hz

  <color=#7FC97F><b>Recomendação:</b></color> a <b>escala de renderização</b> abaixo de 1 é a coisa mais barata de sacrificar quando um dispositivo sofre: custa nitidez e nada mais

  Mais: <link="https://bullethero.space/pt/docs/editor/performance/mobile-devices"><color=#59A6FF>Dispositivos móveis</color></link>
hint_settings_graphics_header: "Gráficos"
hint_settings_interface: "A sobreposição de estatísticas e onde ela fica. Ela é desenhada sobre todas as telas e serve para diagnosticar o desempenho, não para jogar com ela"
hint_settings_interface-alert-on-exception: "Se um erro não tratado abre a janela de relatório. O relatório é montado, registrado no log e mantido de qualquer forma - isto decide apenas se você é interrompido por ele, o que importa mais que tudo no meio de uma partida. Com isto desativado, o último relatório continua no log do jogador, e o botão <b>Salvar relatório</b> o grava na pasta de relatórios"
hint_settings_interface-hitbox-ring-opacity: "O anel de pontos no avatar fica exatamente no raio de colisão dele, que é 0.4 para um corpo desenhado com largura 1 - a silhueta nunca foi a hitbox, e agora dá para ver onde ela realmente está. O mesmo anel conta as vidas: um ponto aceso é uma vida ainda na mão, um apagado é uma vida que você gastou. Este controle deslizante define só o quanto ele aparece sobre o que o nível desenha, e 0 o desativa por completo - os níveis são balanceados para quem consegue vê-lo"
hint_settings_interface-levels-layout: "Como o navegador de níveis do menu abre: uma grade de capas ou uma lista de linhas com descrições. O botão ao lado do campo de pesquisa continua alternando a exibição até você sair"
hint_settings_interface-menu-background: "O que o menu mostra atrás dos botões. \"Bot\" é uma arena de verdade - o mesmo Reflex Bot a quem uma partida pode ser entregue, desviando dos perigos que surgem enquanto você está ali, e ele pode ser atingido sem que nada aconteça. \"Formas\" é o antigo campo de formas girando e o mais pesado dos três. \"Nenhum\" não desenha nada"
hint_settings_interface-open-menu-on-lose: "O que acontece com uma partida perdida. Desativado, o nível desacelera até parar com suavização, volta ao último checkpoint alcançado e acelera de novo com suavização, sem nenhuma janela no caminho. Ativado, a reprodução para e a janela de resultado abre"
hint_settings_interface-screen-orientation: |-
  <b>Horizontal</b> e <b>Vertical</b> travam um <b>eixo</b>, nunca um lado - vire o dispositivo ao contrário e a imagem vira junto, então dá para jogar de qualquer lado

  <b>Autorrotação</b> não trava nada: a tela segue o dispositivo. Com um nível que não define uma orientação própria, você pode girar o celular no meio de uma partida, e a interface e a câmera acompanham

  Um nível pode substituir isto enquanto é reproduzido. O autor dele compôs o conteúdo para um quadro de um formato específico, então essa escolha vale enquanto o nível estiver rodando, e sair dele devolve a configuração

  No computador nada gira um monitor, então o controle fica desativado e só informa o formato da sua janela - redimensione-a e ele acompanha
hint_settings_interface-show-game-interface: "O interruptor geral sobre as duas opções acima e, junto com elas, sobre os controles de toque na tela. Desativado, a tela do jogo não desenha absolutamente nada - o que uma gravação limpa ou uma captura de tela pede. Nada para de funcionar: cada controle fica exatamente onde estava e continua respondendo ao toque"
hint_settings_interface-show-game-pause: "Se o ícone de pausa é desenhado. Ele fica oculto, não removido: o mesmo canto continua respondendo ao toque, e Escape ou o Back de um gamepad abre a janela de pausa, seja qual for esta opção"
hint_settings_interface-show-game-progress: "Se a barra de progresso da partida é desenhada na parte de baixo da tela do jogo. Ocultá-la não muda mais nada - os checkpoints que ela marca continuam funcionando"
hint_settings_interface-stats-active: "Mostrar o painel de diagnóstico sobre todas as telas. Ele serve para medir o desempenho, não para jogar com ele"
hint_settings_interface-stats-alignment-x: "Onde o painel fica na horizontal: 0 é a borda esquerda, 1 a direita"
hint_settings_interface-stats-alignment-y: "Onde o painel fica na vertical: 0 é a borda superior, 1 a inferior"
hint_settings_other: "<b>Redefinir para o padrão</b> restaura todas as configurações de todas as abas aos valores padrão. Só mexe nas configurações - seus níveis são arquivos no disco e não são afetados"
hint_settings_profile: "Tudo o que este dispositivo lembra sobre como o jogo foi jogado e o que foi construído com ele. É local: nada daqui é enviado para lugar nenhum, e os arquivos por trás disso ficam ao lado dos níveis, numa pasta que pode ser aberta e lida. Os tempos são segundos reais, e não tempo do nível, então a rampa de velocidade do checkpoint e uma partida na metade da velocidade contam o tempo que realmente levaram. A linha de dispositivos mede qual dos quatro dispositivos de controle estava no comando enquanto um nível era jogado, e não apenas conectado"
hint_settings_profile-transfer_body: |-
  Todo o seu perfil em um arquivo zip, e de volta: níveis, estatísticas, configurações, a biblioteca com suas coleções e, se você marcar, os salvamentos automáticos do editor e os relatórios de erro. Use para mudar de dispositivo ou para manter uma cópia antes de reinstalar

  <b>Substituir</b> esvazia as partes marcadas e coloca nelas as do arquivo. <b>Mesclar</b> adiciona o que falta, fica com a cópia mais nova de um nível que os dois lados têm e mantém as estatísticas mais altas

  <color=#E8B04B><b>Aviso:</b></color> no celular, desinstalar o jogo exclui o perfil inteiro. Exporte-o antes

  Antes de qualquer importação, o jogo salva o que está prestes a substituir em um único backup, que você pode restaurar, salvar em outro lugar ou excluir aqui

  Mais: <link="https://bullethero.space/pt/docs/game/profile-transfer"><u>Transferência de perfil</u></link>
hint_settings_profile-transfer_header: "Transferência de perfil"
hint_settings_suppress-game-saves_body: |-
  Enquanto isto está ativado, o jogo não salva nada próprio: <color=#D4B483>settings.json</color>, as estatísticas globais e as estatísticas de cada nível ficam no disco exatamente como estão. Uma configuração que você muda continua funcionando até o jogo ser fechado

  O seu trabalho nos níveis continua sendo salvo normalmente - salvar, exportar, importar, copiar e excluir níveis, e também o salvamento automático e os backups do editor, que têm o próprio interruptor

  Dura até o jogo ser fechado e nunca é lembrado. Desativá-lo salva as configurações atuais e descarta tudo o que foi jogado enquanto estava ativado

  <color=#B48CE0><b>Vale saber:</b></color> ele também se ativa sozinho. O argumento de inicialização <color=#D4B483>--suppress-game-saves</color> o ativa durante toda essa execução, e nada dentro do jogo consegue desativá-lo. Configurações ou estatísticas salvas por uma versão mais nova do jogo também o ativam, e então o jogo pergunta a cada inicialização se deve mantê-las ou sobrescrevê-las com os padrões
