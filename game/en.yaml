settings_game-editor-level-serialize_mode: "Level Serialize Mode"
settings_game-editor-multi-select-requires-hold_tooltip: "On: multi-selection only applies while Ctrl is held, so a plain click replaces the selection. Off: once multi-select mode is on, every click adds to it"
settings_game-editor-multi-select-requires_hold: "Multi Select Requires Hold"
settings_game-editor-pick-invisible-aabb_tooltip: "Pick objects by their whole rect instead of what they draw. Off by default: a click on a shape hits its own geometry or its collider, so the empty padding around a slice or a ring belongs to whatever is behind it. An object with no shape and no collider is picked by its rect either way"
