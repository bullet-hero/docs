settings_graphics-antialiasing-hdr_tooltip: "HDR 렌더 타깃으로 렌더링합니다. 기본적으로 모든 곳에서 꺼져 있습니다. 이 게임이 그리는 것 중 1보다 큰 값이 필요한 것은 없으며, HDR 사용 시 안티앨리어싱이 이미 늘린 대역폭이 다시 두 배가 됩니다"
settings_graphics-antialiasing-msaa_tooltip: "픽셀당 MSAA 샘플 수입니다. 타입이 MSAA일 때만 읽습니다. 값이 클수록 깨끗하지만, 블렌딩이 샘플마다 처리되므로 투명한 도형이 많이 겹칠수록 비용이 커집니다. 휴대폰에는 x2, 데스크톱에는 x4 정도가 적당합니다"
settings_graphics-antialiasing-type_tooltip: "가장자리를 부드럽게 하는 방식입니다. 기본값은 MSAA이며, 이 게임의 콘텐츠에 맞는 방식입니다. 모든 도형이 실제 지오메트리이므로 계단 현상이 생기는 부분만 정확히 처리하고 다른 것은 흐리게 만들지 않습니다. FXAA 비용은 레벨의 오버드로가 얼마나 많든 전체 화면 패스 한 번이며, 약한 기기에서 이를 고를 이유는 그것뿐입니다. 대신 얇은 윤곽선이 흐려집니다"
settings_graphics-antialiasing_hdr: "HDR"
settings_graphics-antialiasing_msaa: "MSAA 샘플"
settings_graphics-antialiasing_type: "타입"
settings_graphics-audio-pitch_correction: "피치 보정"
settings_graphics-audio-resync-jump_time: "재동기화 임계값"
settings_graphics-audio-sync-dead_zone: "동기화 데드존"
settings_graphics-colliders-mode-active_tooltip: "연습용 모드입니다. 플레이하는 레벨에서 닿으면 피해를 주는 것만 한 가지 색의 평면 채우기로 그립니다"
settings_graphics-colliders-mode-background_tooltip: "모드가 켜져 있는 동안 레벨 테마의 배경 대신 카메라가 화면을 채우는 색상입니다"
settings_graphics-colliders-mode-color_tooltip: "모드의 채움 색상입니다. 에디터의 콜라이더 보기도 같은 색조를 씁니다"
settings_graphics-colliders-mode-use-alpha_tooltip: "꺼져 있으면 모든 채움이 불투명해지고 색상의 알파가 최대로 고정됩니다"
settings_graphics-colliders-mode_active: "모드 활성화"
settings_graphics-colliders-mode_background: "배경 색상"
settings_graphics-colliders-mode_color: "채움 색상"
settings_graphics-colliders-mode_title: "콜라이더 전용 모드"
settings_graphics-colliders-mode_use-alpha: "투명도 사용"
settings_graphics-effects-frame-step_budget: "프레임 단계 예산"
settings_graphics-effects-replay-step_budget: "리플레이 단계 예산"
settings_graphics-render-scale_tooltip: "창에 맞게 스케일하기 전에 게임이 렌더링하는 픽셀 수입니다. 인터페이스는 어느 경우든 원래 크기로 그려집니다. 이 기기 등급에 기본으로 적용된 스케일에 곱해집니다. 데스크톱 전용"
settings_graphics-resolution_tooltip: "게임 창의 픽셀 크기로, 이 디스플레이가 지원하는 모드 중에서 고릅니다. 세로가 가로보다 긴 해상도에서는 인터페이스 전체가 세로 레이아웃으로 바뀝니다. 데스크톱 전용"
settings_graphics-textures-compression-quality_tooltip: "이 기기가 이미지를 압축하는 데 들이는 시간입니다. 결과는 어느 쪽이든 같은 형식, 같은 크기이며, 바뀌는 것은 불러오기 시간과 그레이디언트 및 날카로운 가장자리의 블록 아티팩트 사이의 균형뿐입니다. 자동은 사진을 제외한 모든 이미지에 정밀한 인코더를 씁니다. 휴대폰에서는 무시됩니다. 휴대폰의 인코더에는 이런 설정이 없습니다"
settings_graphics-textures-compression_tooltip: "레벨의 이미지를 불러올 때 압축 형식으로 변환합니다. 이미지당 메모리가 4-8배 줄어드는 대신 그레이디언트와 날카로운 가장자리에 블록 아티팩트가 생깁니다. 자동은 메모리가 부족한 휴대폰에서는 압축하고 데스크톱에서는 원본 이미지를 유지합니다. 레벨을 불러올 때 읽으므로 다음에 여는 레벨부터 적용됩니다"
settings_graphics-textures-filtering_tooltip: "레벨의 이미지를 그릴 때 샘플링하는 방식입니다. 자동은 밉맵이 켜져 있으면 밉 레벨 사이를 블렌딩하여 한 레벨에서 다음 레벨로 넘어가는 이음매를 없앱니다. 포인트는 모든 것에 경계가 뚜렷한 텍셀을 줍니다. 이미지가 축소되는 방식은 바꾸지 않고 그려지는 방식만 바꿉니다. 제작자가 픽셀 아트로 표시한 이미지는 항상 포인트 샘플링됩니다"
settings_graphics-textures-mipmaps_tooltip: "각 이미지의 축소본을 만들어, 작게 그려진 이미지가 움직일 때 깜빡이지 않게 합니다. 메모리를 3분의 1 더 씁니다. 제작자가 픽셀 아트로 표시한 이미지에는 만들지 않습니다"
settings_graphics-textures-size-limit_tooltip: "이 기기에서 이미지가 메모리에서 차지할 수 있는 가장 긴 변의 길이입니다. 이보다 큰 이미지는 불러올 때 축소되며, 디스크의 파일은 건드리지 않습니다. 메모리는 변 길이의 제곱에 비례해 줄어들므로, 한 단계 낮추면 압축보다 더 많이 절약됩니다. 자동은 휴대폰에서 2048, 데스크톱에서 4096입니다"
