settings_graphics-vsync_tooltip: "Wartet vor dem Anzeigen eines Frames auf die Aktualisierung des Bildschirms, was Tearing beseitigt und einen Frame Latenz kostet. Solange es an ist, wirkt die Framerate-Begrenzung oben nicht. Nur Desktop"
settings_graphics-window-mode_tooltip: "Wie das Fenster den Bildschirm einnimmt. Im Fenstermodus kannst du die Größe frei ändern, was auch die Form ändert, für die sich die Oberfläche anordnet. Nur Desktop"
