# Strings of the website in French. Keys match en.yaml, only the values are
# translated. A {name} is filled in by the site, keep it as is. A key that
# depends on a count needs the French plural forms one / many / other (many is
# the same text as other). A space before ? ! : is a no-break space U+00A0.
