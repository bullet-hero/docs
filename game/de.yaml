editor_publish-rule-detail_resource-share-alike-conflict: "{0} \"{1}\" ({2}) und {3} \"{4}\" ({5}) verlangen jeweils ihre eigene Lizenz für das Level, und keine Lizenz erfüllt beide. Ersetze eine davon"
