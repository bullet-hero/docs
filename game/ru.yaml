settings_general_title: "Общее"
settings_graphics-antialiasing-hdr_tooltip: "Рендерить в HDR-цель. Везде выключено по умолчанию: ничему, что рисует эта игра, не нужны значения выше 1, а HDR удваивает пропускную способность, которую сглаживание и так умножает"
settings_graphics-antialiasing-msaa_tooltip: "Сколько сэмплов на пиксель берёт MSAA. Читается, только когда тип - MSAA. Больше - чище и дороже тем сильнее, чем больше накладывается прозрачных фигур, поскольку смешение разрешается посэмплово: x2 - предел для телефона, x4 - то, что может позволить себе десктоп"
settings_graphics-antialiasing-type_tooltip: "Как сглаживаются края. MSAA - по умолчанию и подходит контенту этой игры: каждая фигура - настоящая геометрия, поэтому сглаживается ровно то, что действительно ступенчатое, и ничего больше не размывается. FXAA стоит одного полноэкранного прохода независимо от перерисовки - это единственная причина предпочесть его на слабом устройстве. Он замыливает тонкие контуры"
settings_graphics-antialiasing_hdr: "HDR"
settings_graphics-antialiasing_msaa: "Сэмплы MSAA"
settings_graphics-antialiasing_type: "Тип"
settings_graphics-audio-pitch_correction: "Коррекция тона"
settings_graphics-audio-resync-jump_time: "Порог пересинхронизации"
settings_graphics-audio-sync-dead_zone: "Мёртвая зона синхронизации"
settings_graphics-effects-frame-step_budget: "Бюджет шага кадра"
settings_graphics-effects-replay-step_budget: "Бюджет шага перемотки"
settings_graphics-render-scale_tooltip: "Сколько пикселей игра рисует до масштабирования в окно. Интерфейс в любом случае рисуется в полном размере. Умножается на масштаб, с которым и так поставляется этот класс устройств. Только на ПК"
settings_graphics-resolution_tooltip: "Размер окна игры в пикселях, из режимов, которые сообщает монитор. Разрешение выше, чем шире, переводит весь интерфейс в вертикальную раскладку. Только на ПК"
settings_graphics-textures-compression-quality_tooltip: "Сколько времени устройство тратит на сжатие картинки. Результат в любом случае одного размера и в одном формате - меняется только время загрузки против блочных артефактов на градиентах и резких краях. Авто берёт аккуратный кодировщик для всего, кроме фотографий. На телефонах не действует: их кодировщики такой настройки не принимают"
settings_graphics-textures-compression_tooltip: "Упаковывать картинки уровня в сжатый формат при загрузке. В четыре-восемь раз меньше памяти на картинку ценой блочных артефактов на градиентах и резких краях. Авто сжимает на телефонах, где памяти мало, и держит картинку целиком на десктопах. Читается при загрузке уровня, поэтому действует со следующего открытого"
settings_graphics-textures-filtering_tooltip: "Как картинки уровня сэмплируются при отрисовке. Авто смешивает соседние мип-уровни, когда мип-карты включены, и убирает шов на их стыке. Точечная даёт чёткие тексели у всего - на то, как картинка уменьшается при загрузке, это не влияет, только на отрисовку. Картинки, помеченные автором как пиксель-арт, всегда точечные"
settings_graphics-textures-mipmaps_tooltip: "Строить уменьшенные копии каждой картинки, чтобы нарисованная мелко не мерцала при движении. Стоит на треть больше памяти. Картинки, помеченные автором как пиксель-арт, их не получают"
settings_graphics-textures-size-limit_tooltip: "Наибольшая сторона, которую картинка может занимать в памяти этого устройства. Всё, что больше, уменьшается при загрузке, а файл на диске не трогается. Память падает как квадрат стороны, поэтому шаг вниз экономит больше, чем сжатие. Авто это 2048 на телефонах и 4096 на десктопах"
