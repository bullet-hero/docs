hint_editor-settings_artist-permission_body: |-
  關卡中的每個外部資源（音樂、圖片、字型、文本）都需要至少與<color=#D4B483>CC BY-NC</color>同等自由的許可證，或者獲得版權所有者對公開非商業再分發的許可

  <color=#E86A5A><b>注意：</b></color>私下一句“沒問題，用吧”是不夠的。許可必須涵蓋公開再分發，而不只是你的個人使用

  關卡只儲存在你的裝置上時不會檢查任何內容，只有在提交給某個服務時才會檢查

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/rights/legal-resource-paths"><color=#59A6FF>資源合規的兩種途徑</color></link>，<link="https://bullethero.space/zh-Hant/docs/editor/rights/asking-permission"><color=#59A6FF>向作者請求許可</color></link>
hint_editor-settings_artist-permission_header: "使用他人的作品"
hint_editor-settings_community: "專案自己的連結，會在瀏覽器中開啟。列出哪些連結取決於這個版本的來源，因此商店版本顯示的連結可能比這裡少"
hint_editor-settings_create-level_body: |-
  <b>預設</b>決定新關卡的初始內容：一個空關卡，或者一小套原本每次都要手工搭建的基礎框架

  <color=#E86A5A><b>注意：</b></color><b>引數</b>設定的是事後不便修改的內容：以幀為單位的長度和幀率

  <color=#5EC8C8><b>提示：</b></color>兩個檔案格式下拉框決定關卡及其後設資料以何種方式寫入磁碟。兩者之後都可以在關卡的“危險區域”中修改

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/basics/first-level"><color=#59A6FF>第一個關卡：路線</color></link>
hint_editor-settings_create-level_header: "建立關卡"
hint_editor-settings_library_body: |-
  本裝置上所有可以放進關卡的內容：你的庫、你的合集，以及你在創意工坊訂閱的合集。窄欄選擇種類，列表上方的標籤選擇來源

  <b>合集</b>是一個包含任意種類資源的資料夾，帶有名稱、作者和許可證。在這裡新建合集，在各種類頁面用<b>複製</b>填充它，匯出為壓縮包或釋出

  <color=#5EC8C8><b>提示：</b></color>創意工坊的合集是隻讀的。要修改，請把條目複製到你自己的合集

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/reference/library-and-collections"><color=#59A6FF>庫與合集</color></link>
hint_editor-settings_library_header: "庫"
hint_editor-settings_open-level: "在此裝置上找到的關卡。關卡就是一個資料夾，把它放在其他關卡旁邊，它就會出現在這裡"
hint_editor_beat-segment_body: |-
  速度恆定的一段區間：BPM、以小數幀表示的相位偏移、每小節拍數、名稱和顏色。即使選中了多個節拍段，也只顯示其中一個

  <color=#E86A5A><b>注意：</b></color>節拍段以起始幀作為標識，因此<b>移動它會改變它的身份</b>。移動後，在新的起點處重新選中它

  <color=#5EC8C8><b>提示：</b></color>在這裡敲擊會重新調整所選節拍段的相位，而不是建立新的節拍段

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>節奏與結構</color></link>
hint_editor_beat-segment_header: "節拍段"
hint_editor_beat-window_body: |-
  創作用的後設資料，<b>播放時完全不讀取</b>。它幫助你把內容對齊到音樂上，生成器也按照你看到的這些節拍工作

  網格是一組<b>節拍段</b>，每段內速度恆定。節拍段之間可以留空：沒有打擊樂的前奏、間奏、歌曲結束後的尾聲

  <color=#5EC8C8><b>提示：</b></color>跟著音訊軌道按<b>敲擊</b>，然後<b>由敲擊建立</b>會把這些敲擊變成一個節拍段，從第一次敲擊延續到最後一次

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>節奏與結構</color></link>
hint_editor_beat-window_header: "節拍網格"
hint_editor_clipboard_body: |-
  每個時間軸一個緩衝區，各有自己的狀態行

  <b>複製為文本</b>把所有緩衝區以文本形式寫入系統剪貼簿，這樣選中項就能帶到另一個關卡或另一臺機器上。<b>從文本貼上</b>把它讀回緩衝區，並且<b>到此為止</b>

  <color=#B48CE0><b>須知：</b></color>在你親自選定的時間軸中貼上之前，沒有任何內容會進入關卡。貼上的位置取決於播放頭和當前的活動作用域

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/workflow/reuse"><color=#59A6FF>複用：預製件、複製、生成器</color></link>
hint_editor_clipboard_header: "剪貼簿"
hint_editor_console: "編輯器在本次會話中記錄的所有內容：關卡載入報告、生成器結果、匯入警告。<b>清空</b>會清除這些內容。齒輪按鈕用於篩選顯示哪些嚴重級別"
hint_editor_curve-editor: "通過拖動控制點編輯曲線。拖動時修改<b>即時</b>生效，你看到的就是關卡中已有的內容，關閉視窗會保留這些修改"
hint_editor_generators_body: |-
  程式化內容，作為一次可撤銷的操作作用於關卡

  <color=#B48CE0><b>須知：</b></color>共有兩類。<b>生成器</b>（<i>gen_</i>）建立內容：子彈波次、徑向圖案和字型快取。<b>修改器</b>（<i>mod_</i>）改寫已有內容：時段適配、量化關鍵幀

  <color=#E86A5A><b>注意：</b></color>任何改寫或刪除已有內容的操作都會先請求確認

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/workflow/reuse"><color=#59A6FF>複用：預製件、複製、生成器</color></link>
hint_editor_generators_header: "生成器"
hint_editor_gradient-editor: "通過拖動色標編輯漸變。與曲線編輯器一樣，修改<b>即時</b>生效，而不是在確認時才應用"
hint_editor_hierarchy_body: |-
  <b>當前幀</b>上存在的所有物體，按父級巢狀。列表會隨著拖動播放頭而變化，層級為空通常意味著播放頭已越過你的內容末尾

  把一行拖到另一行上，即可讓它成為那個物體的子物體。圖層沿父子鏈累加，因此更換父級也會改變物體的繪製順序，並重新生成它的隨機值

  <color=#5EC8C8><b>提示：</b></color>右鍵點選一行可開啟它的操作。在觸屏上，長按該行

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>編輯器的思路</color></link>
hint_editor_hierarchy_header: "層級"
hint_editor_inspector-audio_body: |-
  選中音訊軌道的片段、速度、推子音量及其音訊效果鏈：低通、高通、回聲、混響、合唱、變調、失真、鑲邊、壓縮器、標準化和引數均衡

  速度和音量用滑塊而不是普通數字欄位，這樣合法範圍一目瞭然

  <color=#E86A5A><b>注意：</b></color><b>這裡的音量是推子。</b>關鍵幀音量是區域性時間軸上的另一條軌道，播放時兩者相乘

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/resources/preparing-the-track"><color=#59A6FF>準備音訊軌道</color></link>
hint_editor_inspector-audio_chorus-delay: "副本的基礎延遲，單位毫秒。它足夠短，聽起來是厚度而不是回聲"
hint_editor_inspector-audio_chorus-depth: "延遲擺動的幅度。Rate決定擺動的快慢，這裡決定擺動的大小"
hint_editor_inspector-audio_chorus-dry-mix: "未處理訊號的電平"
hint_editor_inspector-audio_chorus-feedback: "有多少輸出回送到效果輸入，調高會讓聲音越來越接近鑲邊"
hint_editor_inspector-audio_chorus-rate: "延遲被調變的速度，單位Hz"
hint_editor_inspector-audio_chorus-wet-mix-tap-1: "第一個延遲副本的電平"
hint_editor_inspector-audio_chorus-wet-mix-tap-2: "第二個副本的電平。各副本在時間上錯開，它們之間的平衡決定合唱聽起來有多寬"
hint_editor_inspector-audio_chorus-wet-mix-tap-3: "第三個副本的電平"
hint_editor_inspector-audio_chorus_body: |-
  在訊號上疊加三個略有延遲、音高微微擺動的副本，讓一個聲源聽起來像多個。<color=#D4B483>Rate</color>是擺動的快慢，<color=#D4B483>Depth</color>是擺動的幅度。把<color=#D4B483>Feedback</color>調高，它就會變成<link="hint_editor_inspector-audio_flange"><color=#59A6FF>鑲邊</color></link>

  <color=#B48CE0><b>須知：</b></color><b>重置</b>也會把<b>Mix Level</b>恢復為預設的-80 dB，因此會關閉該效果

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/resources/preparing-the-track"><color=#59A6FF>準備音訊軌道</color></link>
hint_editor_inspector-audio_chorus_header: "合唱"
hint_editor_inspector-audio_compressor-attack: "越過峰值後多快開始壓制，單位毫秒。太快會吃掉瞬態"
hint_editor_inspector-audio_compressor-make-up-gain: "壓縮後補回的增益，單位dB，用於找回被壓掉的電平"
hint_editor_inspector-audio_compressor-release: "壓制之後多快鬆開，單位毫秒。太快會產生明顯的抽吸感"
hint_editor_inspector-audio_compressor-threshold: "壓縮開始起作用的電平，單位dB"
hint_editor_inspector-audio_compressor_body: |-
  壓低響亮的部分，讓安靜的部分能抬高，這是歌曲被自身效果蓋住時的常用解法。<color=#D4B483>Threshold</color>是開始壓縮的位置，<color=#D4B483>Attack</color>和<color=#D4B483>Release</color>決定壓制和鬆開的快慢，<color=#D4B483>Make Up Gain</color>把電平補回來

  <color=#B48CE0><b>須知：</b></color><b>重置</b>也會把<b>Mix Level</b>恢復為預設的-80 dB，因此會關閉該效果

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/resources/preparing-the-track"><color=#59A6FF>準備音訊軌道</color></link>
hint_editor_inspector-audio_compressor_header: "壓縮器"
hint_editor_inspector-audio_distortion-level: "訊號被削波的程度"
hint_editor_inspector-audio_distortion_body: |-
  對波形削波，讓聲音充滿諧波，粗糙而過載。只有一個旋鈕<color=#D4B483>Level</color>，決定失真有多狠。它還會壓平動態，讓音訊軌道失去安靜的段落

  <color=#B48CE0><b>須知：</b></color><b>重置</b>也會把<b>Mix Level</b>恢復為預設的-80 dB，因此會關閉該效果

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/resources/preparing-the-track"><color=#59A6FF>準備音訊軌道</color></link>
hint_editor_inspector-audio_distortion_header: "失真"
hint_editor_inspector-audio_echo-decay: "每次重複有多少送入下一次，數值越高餘音越長"
hint_editor_inspector-audio_echo-delay: "兩次重複之間的毫秒數。把它和歌曲的速度對齊，回聲就能落在節拍上"
hint_editor_inspector-audio_echo-dry-mix: "輸出中未處理訊號的電平"
hint_editor_inspector-audio_echo-max-channels: "回聲緩衝區的聲道數上限"
hint_editor_inspector-audio_echo-wet-mix: "回聲訊號的電平，與Dry Mix相平衡，獨立於Mix Level"
hint_editor_inspector-audio_echo_body: |-
  以固定間隔重複訊號，每次重複都比上一次輕。這是一個個分開的副本，而不是<link="hint_editor_inspector-audio_reverb"><color=#59A6FF>混響</color></link>那樣的房間感。<color=#D4B483>Delay</color>是間隔的毫秒數，<color=#D4B483>Decay</color>是每個副本有多少送入下一個

  <color=#B48CE0><b>須知：</b></color><b>重置</b>也會把<b>Mix Level</b>恢復為預設的-80 dB，因此會關閉該效果

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/resources/preparing-the-track"><color=#59A6FF>準備音訊軌道</color></link>
hint_editor_inspector-audio_echo_header: "回聲"
hint_editor_inspector-audio_enabled: "該效果是否在效果鏈中。它沒有單獨的開關：勾選會把Mix Level從-80 dB的下限抬起，取消勾選會把它放回去，並保留你設定過的電平"
hint_editor_inspector-audio_flange-depth: "延遲擺動的幅度"
hint_editor_inspector-audio_flange-dry-mix: "未處理訊號的電平"
hint_editor_inspector-audio_flange-rate: "掃頻重複的速度，單位Hz"
hint_editor_inspector-audio_flange-wet-mix: "掃頻副本的電平。兩路訊號之間的相互抵消就是這個效果本身"
hint_editor_inspector-audio_flange_body: |-
  把訊號與它自身一段極短且不斷掃動的延遲混合，形成噴氣發動機般的呼嘯聲。類似<link="hint_editor_inspector-audio_chorus"><color=#59A6FF>合唱</color></link>，但只有一個副本，所以你聽到的是掃動而不是寬度。<color=#D4B483>Dry Mix</color>和<color=#D4B483>Wet Mix</color>接近時呼嘯最深

  <color=#B48CE0><b>須知：</b></color><b>重置</b>也會把<b>Mix Level</b>恢復為預設的-80 dB，因此會關閉該效果

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/resources/preparing-the-track"><color=#59A6FF>準備音訊軌道</color></link>
hint_editor_inspector-audio_flange_header: "鑲邊"
hint_editor_inspector-audio_header: "音訊軌道檢視器"
hint_editor_inspector-audio_highpass-cutoff-freq: "頻率（Hz），音訊軌道中低於它的部分會被衰減。設為最小值時濾波器實際上是透明的"
hint_editor_inspector-audio_highpass_body: |-
  <link="hint_editor_inspector-audio_lowpass"><color=#59A6FF>低通</color></link>的映象：保留高頻，切掉<color=#D4B483>Cutoff Freq</color>以下的一切。調高截止頻率，音訊軌道就會變薄，像從小喇叭裡放出來

  <color=#5EC8C8><b>提示：</b></color>效果鏈屬於<b>軌道</b>，不能用關鍵幀製作動畫。要在歌曲中途改變，就把軌道切開，分別設定兩半

  <color=#B48CE0><b>須知：</b></color><b>重置</b>也會把<b>Mix Level</b>恢復為預設的-80 dB，因此會關閉該效果

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/resources/preparing-the-track"><color=#59A6FF>準備音訊軌道</color></link>
hint_editor_inspector-audio_highpass_header: "高通"
hint_editor_inspector-audio_lowpass-cutoff-freq: "頻率（Hz），音訊軌道中高於它的部分會被衰減。設為最大值時濾波器實際上是透明的"
hint_editor_inspector-audio_lowpass_body: |-
  保留低頻，切掉<color=#D4B483>Cutoff Freq</color>以上的一切，得到水下或隔牆聽到的聲音。在範圍頂端，濾波器實際上是透明的

  <color=#5EC8C8><b>提示：</b></color>效果鏈屬於<b>軌道</b>，不能用關鍵幀製作動畫。要在歌曲中途改變，就把軌道切開，分別設定兩半

  <color=#B48CE0><b>須知：</b></color><b>重置</b>也會把<b>Mix Level</b>恢復為預設的-80 dB，因此會關閉該效果

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/resources/preparing-the-track"><color=#59A6FF>準備音訊軌道</color></link>
hint_editor_inspector-audio_lowpass_header: "低通"
hint_editor_inspector-audio_mix-level: "處理後的訊號混回時的電平，單位dB。在-80時效果無聲，“關閉”就是這樣儲存的，檔案中沒有單獨的開關"
hint_editor_inspector-audio_normalize-fade-in-time: "增益穩定下來所需的毫秒數，讓校正聽起來不像突變"
hint_editor_inspector-audio_normalize-lowest-volume: "比這更安靜的訊號不做處理，以免靜音和底噪被放大成嘶嘶聲"
hint_editor_inspector-audio_normalize-maximum-amp: "允許施加的增益上限"
hint_editor_inspector-audio_normalize_body: |-
  把訊號拉向目標響度，讓來自不同來源的片段處於相近的電平。它作用於整體電平，音訊軌道內部的動態交給<link="hint_editor_inspector-audio_compressor"><color=#59A6FF>壓縮器</color></link>。<color=#D4B483>Lowest Volume</color>防止它把靜音變成嘶嘶聲，<color=#D4B483>Maximum Amp</color>限制提升幅度

  <color=#B48CE0><b>須知：</b></color><b>重置</b>也會把<b>Mix Level</b>恢復為預設的-80 dB，因此會關閉該效果

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/resources/preparing-the-track"><color=#59A6FF>準備音訊軌道</color></link>
hint_editor_inspector-audio_normalize_header: "標準化"
hint_editor_inspector-audio_param-eq-center-freq: "頻段中心所在的頻率，單位Hz"
hint_editor_inspector-audio_param-eq-frequency-gain: "頻段內施加的增益，小於1為衰減，大於1為提升"
hint_editor_inspector-audio_param-eq-octave-range: "頻段寬度，以八度計。窄的用於精確修正，寬的用於整體音色塑造"
hint_editor_inspector-audio_param-eq_body: |-
  一個引數頻段，提升或衰減頻譜中選定的區域。與<link="hint_editor_inspector-audio_lowpass"><color=#59A6FF>低通</color></link>和<link="hint_editor_inspector-audio_highpass"><color=#59A6FF>高通</color></link>不同，它也能增加電平。<color=#D4B483>Center Freq</color>是頻段所在位置，<color=#D4B483>Octave Range</color>是它的寬度，<color=#D4B483>Frequency Gain</color>小於1為衰減，大於1為提升

  <color=#B48CE0><b>須知：</b></color><b>重置</b>也會把<b>Mix Level</b>恢復為預設的-80 dB，因此會關閉該效果

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/resources/preparing-the-track"><color=#59A6FF>準備音訊軌道</color></link>
hint_editor_inspector-audio_param-eq_header: "引數均衡"
hint_editor_inspector-audio_pitch-shifter-fft-size: "分析視窗大小，是演算法在質量和延遲之間取捨的旋鈕"
hint_editor_inspector-audio_pitch-shifter-max-channels: "處理的聲道數上限"
hint_editor_inspector-audio_pitch-shifter-overlap: "相鄰視窗的重疊程度。重疊越多，偽影越少，但開銷更大"
hint_editor_inspector-audio_pitch-shifter-pitch: "音高倍數：1為不變，2為升高一個八度"
hint_editor_inspector-audio_pitch-shifter_body: |-
  改變音高而不改變速度，因此節奏始終與歌曲對齊。<color=#D4B483>Pitch</color>是倍數：1保持不變，2升高一個八度。<color=#D4B483>FFT Size</color>和<color=#D4B483>Overlap</color>在質量和開銷之間取捨

  <color=#5EC8C8><b>提示：</b></color>效果鏈屬於<b>軌道</b>，不能用關鍵幀製作動畫。要在歌曲中途改變，就把軌道切開，分別設定兩半

  <color=#B48CE0><b>須知：</b></color><b>重置</b>也會把<b>Mix Level</b>恢復為預設的-80 dB，因此會關閉該效果

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/resources/preparing-the-track"><color=#59A6FF>準備音訊軌道</color></link>
hint_editor_inspector-audio_pitch-shifter_header: "變調"
hint_editor_inspector-audio_reverb-decay-hf-ratio: "高頻比低頻衰減快多少。小於1時，尾音在消退中逐漸變暗"
hint_editor_inspector-audio_reverb-decay-time: "尾音消退所需的秒數，是判斷房間大小最明顯的線索"
hint_editor_inspector-audio_reverb-density: "模擬空間的模態密度"
hint_editor_inspector-audio_reverb-diffusion: "回聲隨時間的密度。數值低時尾音會顯得粗糙，帶有金屬感"
hint_editor_inspector-audio_reverb-dry-level: "輸出中未處理訊號的電平"
hint_editor_inspector-audio_reverb-hf-reference: "Room HF和Decay HF Ratio所依據的測量頻率"
hint_editor_inspector-audio_reverb-lf-reference: "Room LF所依據的測量頻率"
hint_editor_inspector-audio_reverb-reflect-delay: "這些反射到達之前的延遲，即牆壁有多遠"
hint_editor_inspector-audio_reverb-reflections: "早期反射的電平，即附近牆壁清晰可辨的最初幾次反彈"
hint_editor_inspector-audio_reverb-reverb: "後期彌散尾音的電平，與早期反射相對"
hint_editor_inspector-audio_reverb-reverb-delay: "尾音出現之前的延遲"
hint_editor_inspector-audio_reverb-room: "混響訊號的整體電平，即房間的存在感"
hint_editor_inspector-audio_reverb-room-hf: "房間在高頻的電平。調低它聽起來像柔軟、吸音的牆壁"
hint_editor_inspector-audio_reverb-room-lf: "房間在低頻的電平"
hint_editor_inspector-audio_reverb_body: |-
  把音訊軌道放進一個房間：先是早期反射，然後是逐漸衰減的尾音。先從三個欄位入手：<color=#D4B483>Decay Time</color>是房間大小，<color=#D4B483>Room</color>是能聽到多少房間感，把<color=#D4B483>Room HF</color>調低會讓牆壁變軟

  <color=#B48CE0><b>須知：</b></color><b>重置</b>也會把<b>Mix Level</b>恢復為預設的-80 dB，因此會關閉該效果

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/resources/preparing-the-track"><color=#59A6FF>準備音訊軌道</color></link>
hint_editor_inspector-audio_reverb_header: "混響"
hint_editor_inspector-effect_angle-a: "角度，單位為度。在隨機類變體下，它是每個粒子抽取範圍的一端"
hint_editor_inspector-effect_angle-b: "每個粒子抽取角度所用範圍的另一端"
hint_editor_inspector-effect_angle-curve: "讀取角度所用的曲線。“按壽命”變體沿粒子自身的壽命讀取，“按速度”變體沿其速度讀取"
hint_editor_inspector-effect_angle-speed-range: "曲線重新對映所用的速度區間：對應曲線起點的速度，以及對應曲線終點的速度"
hint_editor_inspector-effect_angle-type: "當前是五種旋轉變體中的哪一種。更改它會替換整個子物件，因此下面的各行屬於新變體"
hint_editor_inspector-effect_angle_body: |-
  粒子在壽命內如何旋轉，共五種變體：固定的<color=#D4B483>數值</color>、兩種<color=#D4B483>曲線</color>，或兩種按粒子抽取的<color=#D4B483>隨機</color>範圍

  <color=#D4B483>按壽命</color>沿粒子的壽命讀取曲線，<color=#D4B483>按速度</color>沿其速度讀取，並經過下方的速度區間對映

  此按鈕旁的<b>重置</b>也會重置<color=#D4B483>型別</color>，曲線或隨機值對也隨之重置

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/craft/readability-and-fairness"><color=#59A6FF>可讀性</color></link>
hint_editor_inspector-effect_angle_header: "角度"
hint_editor_inspector-effect_body: |-
  <color=#D4B483>VFX Graph</color>特效的引數，分組排列：配置、基本、力、形狀、角度、縮放和顏色。所有組同時可見，而不是一次只顯示一組

  <color=#B48CE0><b>須知：</b></color>特效<b>與其他所有內容使用同樣的種子方式</b>，隨機值來自你編輯的數字，而不是隨機數生成器的狀態，因此同一關卡在任何裝置上的回放都完全一致

  <color=#5EC8C8><b>提示：</b></color>顏色可以引用關卡主題，而不必填寫固定值，漸變型別會開啟共用的漸變編輯器

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/performance/level-budget"><color=#59A6FF>關卡預算</color></link>
hint_editor_inspector-effect_color-a: "粒子的顏色。在隨機類變體下，它是每個粒子抽取範圍的一端"
hint_editor_inspector-effect_color-b: "每個粒子抽取顏色所用範圍的另一端"
hint_editor_inspector-effect_color-gradient: "讀取顏色所用的漸變。根據變體不同，沿粒子的壽命讀取、沿其速度讀取，或為每個粒子取一種顏色"
hint_editor_inspector-effect_color-speed-range: "漸變重新對映所用的速度區間：對應漸變起點的速度，以及對應漸變終點的速度"
hint_editor_inspector-effect_color-type: "當前是六種著色變體中的哪一種。更改它會替換整個子物件，因此下面的各行屬於新變體"
hint_editor_inspector-effect_color_body: |-
  粒子在壽命內如何著色，共六種變體：<link="hint_editor_inspector-effect_angle"><color=#59A6FF>角度</color></link>和<link="hint_editor_inspector-effect_scale"><color=#59A6FF>縮放</color></link>的那五種，只是用漸變代替曲線，外加<color=#D4B483>隨機漸變</color>，為每個粒子選取一種顏色

  <color=#5EC8C8><b>提示：</b></color>這裡的顏色可以是主題引用，這樣關卡中途更換調色盤時，特效也會隨之變化

  此按鈕旁的<b>重置</b>也會重置<color=#D4B483>型別</color>，漸變或顏色對也隨之重置

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>顏色與主題</color></link>
hint_editor_inspector-effect_color_header: "顏色"
hint_editor_inspector-effect_config-has-stop-frame: "是否啟用停止幀。關閉時，只要物體還存在，發射器就一直生成粒子"
hint_editor_inspector-effect_config-stop-frame: "停止發射的幀，從物體自身時段的起點計數，而不是從關卡時間計數。已存在的粒子仍會走完各自的壽命"
hint_editor_inspector-effect_config_body: |-
  發射器何時停止生成粒子。關閉時，只要物體還存在它就一直生成，這是通常的情況

  <color=#D4B483>停止幀</color>從物體自身時段的起點計數，而不是從關卡時間軸計數。已存在的粒子會走完壽命，因此畫面是逐漸消散，而不是突然中斷

  此按鈕旁的<b>重置</b>會把兩個欄位恢復為開發者設定的預設值，只佔一步撤銷

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/performance/level-budget"><color=#59A6FF>關卡能承受多少</color></link>
hint_editor_inspector-effect_config_header: "配置"
hint_editor_inspector-effect_core-lifetime-bounds: "粒子存活的最短和最長秒數，按粒子抽取。正是這個差值讓一次爆發的粒子不會同時消失。兩者的平均值也是一次性特效批次大小的乘數"
hint_editor_inspector-effect_core-loop: "系統是否持續發射，而不是隻發射一批且永不補充。關閉時，超出壽命範圍後就沒有可繪製的內容了"
hint_editor_inspector-effect_core-particle-count: "每秒發射的粒子數，是控制開銷的主要引數。同時存活的數量等於它乘以平均壽命，兩種模式都是如此：迴圈時按此速率生成，一次性時把這整個乘積一次爆發出來。上限是圖自身的容量，無論粒子是否存在，系統每幀都會按這個容量排程"
hint_editor_inspector-effect_core-particle-pivot: "粒子上位於其位置、也是其旋轉中心的點，相當於單個粒子自己的軸心，對應物體的軸心"
hint_editor_inspector-effect_core-render: "是否繪製粒子。關閉後系統仍繼續模擬，適合只需要它的附帶效果的情況"
hint_editor_inspector-effect_core-shape-id: "每個粒子繪製所用的幾何體，取自物體所用的同一個形狀庫。“無”完全不繪製，四邊形是普通的值，也是此欄位的預設值"
hint_editor_inspector-effect_core-texture-id: "每個粒子繪製的影像，取自物體所用的同一個資源庫。“無”讓粒子不上色，這是此欄位的預設值"
hint_editor_inspector-effect_core_body: |-
  粒子有多少、存活多久、用什麼繪製。粒子如何運動見<link="hint_editor_inspector-effect_forces"><color=#59A6FF>力</color></link>

  <color=#D4B483>粒子數量</color>是控制開銷的主要引數：一個發射器的開銷約為數量乘以<color=#D4B483>壽命範圍</color>。<color=#D4B483>形狀</color>和<color=#D4B483>紋理</color>可以留空，無紋理的粒子開銷最低

  <color=#E8B04B><b>警告：</b></color>數量上限為1024，而且圖每幀都要為全部容量付出開銷，而不只是存活的粒子。需要多少就設多少

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/performance/level-budget"><color=#59A6FF>關卡能承受多少</color></link>
hint_editor_inspector-effect_core_header: "基本"
hint_editor_inspector-effect_forces-linear-force: "恆定的加速度而非速度，因此它的作用會在粒子壽命中不斷累積，而不是保持不變"
hint_editor_inspector-effect_forces-linear-velocity: "每幀疊加在粒子初始速度之上的恆定漂移，像風，而不是衝擊"
hint_editor_inspector-effect_forces-orbital-center-offset: "環繞中心相對於發射器的位置。偏移後漩渦會變得不對稱"
hint_editor_inspector-effect_forces-orbital-velocity: "粒子繞某個中心旋轉，而不是繞自身旋轉。在2D場景中起作用的是Z分量"
hint_editor_inspector-effect_forces-start-angular-velocity-max: "初始旋轉抽取的上限"
hint_editor_inspector-effect_forces-start-angular-velocity-min: "初始旋轉抽取的下限，單位為度每秒"
hint_editor_inspector-effect_forces-start-gravity-max: "每個粒子重力抽取的上限"
hint_editor_inspector-effect_forces-start-gravity-min: "每個粒子重力抽取的下限。負值會讓粒子向上飄"
hint_editor_inspector-effect_forces-start-velocity-max: "初始速度抽取的上限。拉開這兩者的差距，就能把整齊的爆發變成噴灑"
hint_editor_inspector-effect_forces-start-velocity-min: "初始速度抽取的下限，按軸分別計算"
hint_editor_inspector-effect_forces-velocity-speed: "作用於粒子整體速度的倍數，只用這一個引數就能讓做好的特效變慢或變快，無需重新調整上面的每個欄位"
hint_editor_inspector-effect_forces_body: |-
  粒子生成後推動它運動的一切。粒子從哪裡出發見<link="hint_editor_inspector-effect_shape"><color=#59A6FF>形狀</color></link>

  <color=#D4B483>初始</color>這幾對數值在出生時為每個粒子抽取一次。其餘各項在粒子整個壽命中持續作用，而<color=#D4B483>線性力</color>是加速度，所以會累積

  <color=#5EC8C8><b>提示：</b></color><color=#D4B483>移動速度</color>會乘以整個結果，因此做好的特效無需重新調整其餘引數就能變慢或變快

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/craft/composition-and-camera"><color=#59A6FF>構圖</color></link>
hint_editor_inspector-effect_forces_header: "力"
hint_editor_inspector-effect_header: "特效檢視器"
hint_editor_inspector-effect_scale-a: "粒子的尺寸。在隨機類變體下，它是每個粒子抽取範圍的一端"
hint_editor_inspector-effect_scale-b: "每個粒子抽取尺寸所用範圍的另一端"
hint_editor_inspector-effect_scale-curve-x: "讀取水平尺寸所用的曲線，與垂直尺寸相互獨立"
hint_editor_inspector-effect_scale-curve-y: "讀取垂直尺寸所用的曲線，與水平尺寸相互獨立"
hint_editor_inspector-effect_scale-speed-range: "兩條曲線重新對映所用的速度區間：對應曲線起點的速度，以及對應曲線終點的速度"
hint_editor_inspector-effect_scale-type: "當前是五種尺寸變體中的哪一種。更改它會替換整個子物件，因此下面的各行屬於新變體"
hint_editor_inspector-effect_scale_body: |-
  粒子在壽命內的大小，變體與<link="hint_editor_inspector-effect_angle"><color=#59A6FF>角度</color></link>相同，共五種。<color=#D4B483>曲線X</color>和<color=#D4B483>曲線Y</color>分別獨立讀取，因此粒子可以一邊縮小一邊拉伸

  <color=#E8B04B><b>警告：</b></color>曲線下方那一行是複用的：在數值和隨機變體下是尺寸本身，在按速度變體下是速度區間。旁邊的標註會說明當前是哪一個

  此按鈕旁的<b>重置</b>也會重置<color=#D4B483>型別</color>，兩條曲線和隨機值對也隨之重置

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/craft/readability-and-fairness"><color=#59A6FF>可讀性</color></link>
hint_editor_inspector-effect_scale_header: "縮放"
hint_editor_inspector-effect_shape-arc: "實際使用的邊緣部分，以弧度為單位，從+X軸起逆時針測量。小於一整圈就會形成扇形"
hint_editor_inspector-effect_shape-box-size: "生成框的完整寬度和高度，以特效物體為中心"
hint_editor_inspector-effect_shape-circle-aspect: "垂直半軸相對於半徑的倍數：1為圓，其他值為橢圓"
hint_editor_inspector-effect_shape-circle-radius: "沿水平軸從中心到圓周的距離"
hint_editor_inspector-effect_shape-circle-thickness: "圓周向內填充的程度：0為只有輪廓，1為實心圓盤"
hint_editor_inspector-effect_shape-cone-base-radius: "發射器一端的半徑"
hint_editor_inspector-effect_shape-cone-height: "兩端之間的距離，即生成體積有多深"
hint_editor_inspector-effect_shape-cone-top-radius: "遠端的半徑。大於底部半徑時向外張開，小於時向內收成漏斗"
hint_editor_inspector-effect_shape-line-end: "線段的另一端"
hint_editor_inspector-effect_shape-line-start: "線段的一端，使用特效物體的區域性座標"
hint_editor_inspector-effect_shape-spread: "遍歷在回到起點之前覆蓋形狀的比例"
hint_editor_inspector-effect_shape-spread-speed: "生成點前進的速度，決定了肉眼可見的旋轉速率"
hint_editor_inspector-effect_shape-spread-type: "後續粒子如何遍歷形狀：隨機、單向迴圈、往返或按正弦。正是這一項能把靜止的圓環變成旋轉或擺動的圖案"
hint_editor_inspector-effect_shape-torus-radius-major: "圓管所環繞的圓環的半徑"
hint_editor_inspector-effect_shape-torus-radius-minor: "圓管本身的半徑，即圓環有多粗"
hint_editor_inspector-effect_shape-type: "當前是哪種生成體積。更改它會替換形狀，因此下面的欄位屬於新形狀，而不是舊形狀"
hint_editor_inspector-effect_shape_body: |-
  生成體積：點、圓形、矩形、線段、錐形或圓環。它只決定粒子從哪裡出發，之後的運動見<link="hint_editor_inspector-effect_forces"><color=#59A6FF>力</color></link>

  更改<color=#D4B483>型別</color>會改變下面的行，而且這些行在各型別之間共用。<color=#D4B483>弧</color>以弧度為單位，小於一整圈就會形成扇形

  <color=#5EC8C8><b>提示：</b></color>把<b>擴散</b>設為“迴圈”，就是經典的旋轉發射器

  此按鈕旁的<b>重置</b>也會重置<color=#D4B483>型別</color>，形狀也隨之重置

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/craft/composition-and-camera"><color=#59A6FF>構圖</color></link>
hint_editor_inspector-effect_shape_header: "形狀"
hint_editor_inspector-keyframe_body: |-
  <b>選中項涉及的所有軌道會同時顯示</b>，而不只是你最後點選的那一條。數值為空表示選中的關鍵幀在這一項上<b>不一致</b>

  <color=#5EC8C8><b>提示：</b></color><b>緩動</b>可跨軌道生效，並作為<b>一次撤銷步驟</b>提交

  <color=#B48CE0><b>須知：</b></color>選中多個關鍵幀時<b>幀</b>會被鎖定，因為一個數字會把它們全部壓到同一幀上。請改為在時間軸上拖動它們

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>編輯器的思路</color></link>
hint_editor_inspector-keyframe_header: "關鍵幀檢視器"
hint_editor_inspector-object_body: |-
  選中物體自身的欄位。所有型別都會顯示共有的空物體欄位，形狀、特效、文本和預製件物體會在其下方新增各自的欄位

  <b>活動</b>會同時關閉渲染<i>和</i>碰撞，並由子物體繼承：在這裡隱藏的物體無法殺死玩家

  <color=#E86A5A><b>注意：</b></color><b>圖層</b>相對於父級。旁邊只讀的全域性圖層才是渲染器實際使用的值

  <color=#5EC8C8><b>提示：</b></color>在來自預製件的物體上編輯欄位，會記錄一個<b>例項覆蓋</b>，旁邊的核取方塊會顯示它，也可以將其還原

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>編輯器的思路</color></link>
hint_editor_inspector-object_header: "物體檢視器"
hint_editor_inspector-resolved_body: |-
  選中物體在當前幀上<b>實際是</b>什麼，數值讀取自正在執行的模擬，而不是你編寫的內容

  行末的方塊表示該欄位的關鍵幀狀態：藍色表示此幀上有關鍵幀（點選方塊即可選中它），琥珀色表示在關鍵幀之間插值，灰色表示位於關鍵幀範圍之外、數值保持不變，空心表示沒有關鍵幀、使用預設值。箭頭會把播放頭移到上一個或下一個關鍵幀

  分隔線下方是組合值：累加後的圖層、繼承的“活動”狀態，以及經父級組合的變換。它們不由任何關鍵幀設定，所以沒有狀態指示

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/reference/object-properties"><color=#59A6FF>物體屬性</color></link>
hint_editor_inspector-resolved_header: "當前值"
hint_editor_inspector_audio-span-fit: "把軌道拉伸到音訊片段在關卡結束前能容納的最大長度。沒有可解析的音訊片段，或速度為零時不可用，因為凍結的軌道沒有可適配的長度"
hint_editor_inspector_audio-span-fit-level: "同時延長軌道和關卡，直到整個音訊片段都能容納。關卡只會變長，如果片段已經能容納，則不做任何改動"
hint_editor_inspector_collider-id_body: |-
  物體用來<b>擊中</b>玩家的範圍，與它繪製的內容是兩個獨立的選擇

  <color=#B48CE0><b>須知：</b></color>兩者互不推導，這是有意為之：繪製出來卻無害的預警光束、比其所覆蓋圖形更簡單的判定框、隱形牆，都是普通內容，而不是取巧手段

  <color=#5EC8C8><b>提示：</b></color>兩個欄位都從同樣的兩個集合中選擇，因此關卡自己建立的形狀可以用作其中之一，也可以同時用作兩者

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/craft/readability-and-fairness"><color=#59A6FF>可讀性與公平性</color></link>
hint_editor_inspector_collider-id_header: "碰撞體"
hint_editor_inspector_ease_body: |-
  數值如何從上一個關鍵幀到達這一個關鍵幀

  <color=#B48CE0><b>須知：</b></color>緩動屬於關鍵幀的<b>進入</b>一側，所以軌道的第一個關鍵幀沒有可以緩動的起點，它的選擇不會體現出來

  <color=#5EC8C8><b>提示：</b></color>選中多個關鍵幀時，選擇會作為<b>一次撤銷步驟</b>應用到所有關鍵幀，即使它們分屬不同軌道和物體。選擇為空表示它們不一致

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/basics/keyframes-and-easing"><color=#59A6FF>關鍵幀與緩動</color></link>
hint_editor_inspector_ease_header: "緩動"
hint_editor_inspector_global-layer: "渲染器實際使用的繪製順序：此物體自身的圖層加上所有祖先的圖層。只讀，因為它是計算得出的，而不是儲存的"
hint_editor_inspector_layer_body: |-
  繪製順序，<b>相對於父級</b>，而不是絕對值

  <color=#E86A5A><b>注意：</b></color>渲染器使用的是這個數字加上所有祖先的圖層，結果以只讀方式顯示在下方的<b>全域性</b>中。更換父級會改變物體的繪製位置，即使這個數字保持不變

  <color=#B48CE0><b>須知：</b></color>隨機值與實際生效的圖層繫結，所以在層級中移動物體會重新隨機這些值

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>編輯器的思路</color></link>
hint_editor_inspector_layer_header: "圖層"
hint_editor_inspector_object-type: "這是哪種物體。更改型別會替換整個物體：保留共有欄位，丟棄新型別無法容納的內容"
hint_editor_inspector_parent: "此物體跟隨哪個物體。父級會把自己的變換疊加到子物體上，圖層也沿著鏈條累加，因此更換父級也會改變物體的繪製順序"
hint_editor_inspector_shader-type_body: |-
  此物體採用哪條渲染路徑

  <color=#E86A5A><b>注意：</b></color><b>自動</b>只在關卡載入時決定一次，且從不改變關卡的外觀：凡是無法根據Alpha證明為不透明的內容，都會變為透明

  <color=#5EC8C8><b>提示：</b></color>此欄位旁邊的標籤顯示“自動”實際解析成了什麼，直接讀取自渲染器的資料

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/performance/level-budget"><color=#59A6FF>關卡預算</color></link>
hint_editor_inspector_shader-type_header: "著色器型別"
hint_editor_inspector_shape-id_body: |-
  此物體<b>繪製</b>什麼

  <color=#B48CE0><b>須知：</b></color>形狀是適配到其框內的真實幾何體，較長的軸上恰好為1，因此物體的矩形就是螢幕上顯示的內容。遊戲生成了約500種形狀，關卡還可以新增自己的形狀

  <color=#5EC8C8><b>提示：</b></color>留空也是有效的：不繪製任何內容但帶有碰撞體的物體，就是一堵隱形牆

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/craft/readability-and-fairness"><color=#59A6FF>可讀性與公平性</color></link>
hint_editor_inspector_shape-id_header: "形狀"
hint_editor_inspector_span_body: |-
  此物體存在的時間，是一個半開區間：包含起始幀，不包含結束幀。在20結束的物體和從20開始的物體，永遠不會在那一幀同時繪製

  <color=#B48CE0><b>須知：</b></color>子物體的時段必須位於父級的時段之內，但這是在讀取時解析的，從不儲存。縮短父級，子物體會被裁剪，再把父級延長回來，它們就會恢復。超出關卡結尾的根物體只是永遠不會播放

  <b>錨點</b>讓一條邊跟隨父級的邊，並決定播放的內容：帶錨點的子物體會隨著父級變長而拉伸。它的動畫仍保持你編寫的時間安排

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/basics/frames-and-time"><color=#59A6FF>幀、時間與關卡長度</color></link>
hint_editor_inspector_span_header: "時段"
hint_editor_interop-report: "從其他遊戲的格式轉換時，哪些內容保留了下來，哪些沒有。條目僅供參考：關卡已經載入，這裡說明它與原版有哪些不同"
hint_editor_level-export_body: |-
  把此關卡寫到遊戲之外，可以是資料夾，也可以是單個歸檔包。關卡使用的所有內容都會隨之一起帶走，包括關卡資料夾之外的歌曲

  普通的<b>.zip</b>無需安裝任何軟體即可在Windows資源管理器中開啟。帶密碼的選項則不行：<b>+密碼</b>可用7-Zip或其他任何壓縮軟體開啟，<b>（gpg）</b>需用gpg開啟

  <color=#5EC8C8><b>提示：</b></color>任何無法帶走的內容，比如通過URL引用的資源、沒有被任何內容引用的檔案，都會在之後的報告中列出

  <color=#E8B04B><b>警告：</b></color>密碼不是DRM。任何同時擁有檔案和密碼的人，始終都能開啟它

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/workflow/sharing-by-hand"><color=#59A6FF>手動分享關卡</color></link>
hint_editor_level-export_header: "匯出關卡"
hint_editor_level-protection_body: |-
  在磁碟上加密此關卡的文件，開啟關卡時會要求輸入密碼。後設資料、封面和媒體檔案仍然可讀，所以沒有密碼也能顯示關卡卡片

  每次會話只詢問一次密碼，且僅儲存在記憶體中。要移除保護，請將欄位留空並按<b>應用</b>

  <color=#E86A5A><b>注意：</b></color>忘記的密碼無法找回。任何地方都不會儲存金鑰

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/reference/export-and-protection"><color=#59A6FF>匯出與保護</color></link>
hint_editor_level-protection_header: "保護關卡"
hint_editor_prefab-flatten-recursive_body: |-
  關：只有你選中的這個放置不再跟隨模板。放置在它內部的預製件保留自己的連結，所以編輯那個內部模板仍會影響本關卡。這是預設值

  開：所有巢狀的內容也一併展平，關卡中不再有任何內容連結到這些內部模板，無論巢狀多深

  無論哪種方式，模板本身都會保留在關卡中，一次展平只佔一步撤銷

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/reference/prefab-mode"><color=#59A6FF>預製件模式</color></link>
hint_editor_prefab-flatten-recursive_header: "同時展平巢狀的預製件"
hint_editor_prefab-mode_body: |-
  <color=#E86A5A><b>注意：</b></color>你正在編輯預製件<b>模板</b>，而不是它的某一個放置。儲存會把改動帶到引用此模板的每一個放置

  在這裡做的編輯不會記錄例項覆蓋。覆蓋只會在此模式之外編輯某個放置中的物體時產生

  <color=#5EC8C8><b>提示：</b></color>此模板內的放置會在上層開啟它自己的模板，“儲存並關閉”會帶你回到這裡。巢狀最多8層

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/workflow/reuse"><color=#59A6FF>複用：預製件、複製、生成器</color></link>
hint_editor_prefab-mode_header: "預製件模式"
hint_editor_search-palette_body: |-
  兩種模式。<b>執行命令</b>按名稱查詢任意編輯器操作，與工具欄和右鍵選單執行的是同一批操作。<b>搜尋內容</b>查詢當前範圍內的物體和音訊軌道

  <color=#B48CE0><b>須知：</b></color>兩種模式都不包含資源：每個資源都通過需要它的那個欄位來選擇

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/workflow/speed-and-shortcuts"><color=#59A6FF>速度與快捷鍵</color></link>
hint_editor_search-palette_header: "命令面板"
hint_editor_search-picker: "所有資源欄位共用的選擇器。輸入文字即可為列表排序。篩選器按型別縮小範圍，當欄位只接受一個域時，右側會出現一個標籤"
hint_editor_theme-ref_body: |-
  讓這個顏色指向<b>關卡主題中的槽位</b>，而不是一個固定值。主題改變時，所有引用該槽位的內容會同時換色

  <color=#5EC8C8><b>提示：</b></color>色塊顯示的是你正在編輯的關鍵幀所在幀的調色盤，而不是播放頭處的。要按更靠後的外觀取色，請編輯位置更靠後的關鍵幀

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>顏色、主題與後期處理</color></link>
hint_editor_theme-ref_header: "主題顏色引用"
hint_editor_timeline-audio_body: |-
  關卡的音訊軌道及其波形，方便你讓內容與聽到的聲音對齊

  <color=#5EC8C8><b>提示：</b></color>檢視器中的<b>適配軌道</b>會把軌道調整為其音訊片段的實際長度。沒有片段或速度為0時不可用

  <color=#E86A5A><b>注意：</b></color>檢視器中的<b>音量</b>滑塊是軌道的推子。用關鍵幀控制的音量是區域性時間軸上一條單獨的音量軌道，播放時兩者相乘

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/resources/preparing-the-track"><color=#59A6FF>準備音訊軌道</color></link>
hint_editor_timeline-audio_header: "音訊時間軸"
hint_editor_timeline-events_body: |-
  不屬於任何物體的關卡級關鍵幀：
  - 相機的位置、旋轉、縮放、軸心和震動
  - 標記和檢查點
  - 螢幕限制
  - 背景和主題
  - 所有後期效果
  - 玩家的可見性、控制、碰撞、尺寸和速度

  <color=#B48CE0><b>須知：</b></color><b>節拍</b>軌道是這裡的例外。它的條目帶有時段，所以它是邊緣和剪刀工具唯一能作用的軌道

  <color=#5EC8C8><b>提示：</b></color>顏色可以指向關卡主題，而不是儲存固定值。這樣只需改一次主題，這些顏色就會全部換色

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/craft/composition-and-camera"><color=#59A6FF>構圖與相機</color></link>
hint_editor_timeline-events_header: "事件時間軸"
hint_editor_timeline-level_body: |-
  每個物體一個片段，片段所在的行就是它的<b>圖層</b>。片段就是物體的<b>時段</b>：佔據第10至19幀的片段，恰好結束在從第20幀開始的片段的起點

  <color=#B48CE0><b>須知：</b></color>子物體只在父級的時段內播放，但你創作的內容不會被裁掉。把父級重新拉長，子物體就會回來

  <color=#5EC8C8><b>提示：</b></color><b>選擇</b>用於選中和拖動，<b>邊緣</b>用於調整邊緣，<b>剪刀</b>在游標處切開片段。右鍵單擊空白處可開啟選單

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>編輯器的思路</color></link>，<link="https://bullethero.space/zh-Hant/docs/editor/craft/composition-and-camera"><color=#59A6FF>構圖與相機</color></link>
hint_editor_timeline-level_header: "關卡時間軸"
hint_editor_timeline-local_body: |-
  <b>選中物體</b>的關鍵幀，每條軌道一行。幀從物體時段的起點開始計數，所以移動物體時，它的整段動畫也隨之移動

  <color=#B48CE0><b>須知：</b></color><b>空軌道是有效資料</b>。它使用預設值，所以新物體在你新增關鍵幀之前不會有任何動畫

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>編輯器的思路</color></link>
hint_editor_timeline-local_header: "區域性時間軸"
hint_editor_timeline-prefab_body: |-
  預製件模式專屬的時間軸，顯示<b>模板</b>中的物體。它的長度是模板自身的長度，而不是某個放置的時段

  <color=#E8B04B><b>警告：</b></color>這裡的選中項不與編輯器其他部分共享。在這裡的編輯會改變模板，並擴散到它的每一個放置

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/workflow/reuse"><color=#59A6FF>複用：預製件、複製、生成器</color></link>
hint_editor_timeline-prefab_header: "預製件時間軸"
hint_editor_value-type-color: "每次播放時顏色的來源。“數值”：按寫入的值。“主題”：該幀上主題的槽位，會隨主題變化。“隨機區間”：每個通道各自隨機，顏色可能落在兩者之間的任意位置。“A到B隨機”：所有通道共用一次隨機，顏色始終位於從A到B的直線上"
hint_editor_value-type-number: "每次播放時這個數如何確定。“數值”：按寫入的數。“隨機區間”：兩個邊界之間的一個數。“隨機區間，步長”：同上，但吸附到該大小的網格上。這裡沒有“A到B隨機”，因為一個分量本來就只取一個數。隨機值按地址計算，而不是抽取，所以同一關卡在任何裝置上表現都相同，而移動物體或改變其圖層會重新隨機"
hint_editor_value-type-vector: "每次播放時這個向量如何確定。“數值”：按寫入的數。“矩形內隨機”：每個軸在自己的兩個邊界之間各自隨機，填滿整個矩形。“A到B隨機”：只隨機一次，所有軸都在同一位置讀取，所以點沿從A到B的直線移動。某個軸兩端的數相同時，它保持不動。“圓內隨機”：圍繞中心的圓盤上的一個點。帶步長的形式會把結果吸附到網格上。隨機值按地址計算，而不是抽取，所以同一關卡在任何裝置上表現都相同"
hint_editor_video-export_audio: "影片中包含關卡的軌道，按音量和聲像關鍵幀"
hint_editor_video-export_body: |-
  通過此電腦上安裝的 ffmpeg 將開啟的關卡渲染為影片

  <color=#B48CE0><b>須知：</b></color>渲染為離線逐幀進行，因此無論電腦多慢，影片都是精確的。ffmpeg 不屬於遊戲 - 安裝一次後此視窗會自動找到它。也可以手動指定
  更多：<link="https://bullethero.space/zh-Hant/docs/editor/reference/video-export"><color=#59A6FF>影片匯出</color></link>
hint_editor_video-export_bot: "影片中由誰遊玩關卡。Reflex只向前看一瞬間，無需準備。Warm在第一幀之前算好整條路線。匯出期間受擊不產生任何效果"
hint_editor_video-export_codec: "容器內畫面或聲音的壓縮方式。列表中只有你的ffmpeg能生成的格式。下方一行說明配套的音訊編解碼器和最終檔案"
hint_editor_video-export_effects: "影片中包含關卡的粒子特效。與編輯器中的開關相同，僅作用於影片"
hint_editor_video-export_engine-audio: "開啟：軌道有效果時，關卡的聲音會在渲染幀的同時即時播放，錄製遊戲自身的聲音並包含所有效果，揚聲器保持靜音。匯出時間至少為範圍的長度。關閉：軌道單獨混音，不含效果。僅聲音始終單獨混音"
hint_editor_video-export_ffmpeg: "ffmpeg負責編碼影片，不屬於遊戲。綠色表示已找到且可用，黃色表示版本過舊，紅色表示未找到或無法執行。選擇ffmpeg可手動指定檔案，重新檢查會再次查詢"
hint_editor_video-export_fps: "影片每秒幀數，最高240，與關卡自身幀率無關。低於60時每幀分多步模擬，讓機器人的表現與遊戲中一致"
hint_editor_video-export_full-chroma: "每個畫素都有顏色，而不是每兩個畫素一個。細的彩色線條保持清晰，檔案更大，部分播放器無法開啟"
hint_editor_video-export_header: "匯出影片"
hint_editor_video-export_output: "影片儲存位置。預設是遊戲資料資料夾中的recordings/[關卡id]，刪除關卡後仍會保留"
hint_editor_video-export_post-processing: "影片中包含關卡的後期處理：泛光、調色等。與編輯器中的開關相同，僅作用於影片"
hint_editor_video-export_preroll: "開始前播放但不錄製的秒數，讓特效和粒子在第一幀時已有歷史"
hint_editor_video-export_preset: "檔案型別。MP4到處都能開啟，MKV和MOV用於剪輯，WebM用於網頁，GIF、WebP和APNG是沒有聲音的短片，影像序列是裝滿幀的資料夾，僅聲音則完全不渲染畫面"
hint_editor_video-export_quality: "影片佔用多少空間。草稿體積小、畫面較軟，無損保留每個畫素、體積大"
hint_editor_video-export_range: "錄製關卡的哪一部分：整個關卡、時間軸的迴圈範圍，或自定義的起始幀和結束幀"
hint_editor_video-export_resolution: "影片尺寸（畫素）。自定義可輸入任意偶數寬高。關卡攝像機畫面適配其中，其餘部分用黑邊填充"
hint_editor_video-export_seed: "關卡隨機性的種子。0保持編輯器當前使用的種子，其他任意數字每次都生成相同的影片"
hint_editor_video-export_sound-after-frames: "關閉（預設）：在渲染幀的同時錄製含效果的聲音，匯出時間取兩者中較長的一個。開啟：在最後一幀之後即時錄製聲音，匯出時間會增加一個範圍的長度。關卡較重、錄製的聲音出現卡頓時請開啟"
hint_gen_audio_waveform_body: |-
  生成描繪音訊軌道形狀的物體，讓關卡在畫面上跟隨聽到的聲音

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/workflow/reuse"><color=#59A6FF>複用：預製件、複製、生成器</color></link>
hint_gen_audio_waveform_header: "音訊波形"
hint_gen_beat_flash_body: |-
  在每個節拍上放置一次閃光。節拍來自關卡的節拍圖，沒有節拍圖時則來自標記，所以閃爍的正是你在網格上看到的節拍

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>節奏與結構</color></link>
hint_gen_beat_flash_header: "節拍閃光"
hint_gen_bullet_homing_body: |-
  朝玩家預計所在位置彎曲的子彈。彎曲軌跡在創作時就已寫定，而不是在播放時計算：在任何裝置上結果都完全相同

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/craft/readability-and-fairness"><color=#59A6FF>可讀性與公平性</color></link>
hint_gen_bullet_homing_header: "追蹤彈"
hint_gen_bullet_laser_sweep_body: |-
  掃過場地的光束。預警和致命階段是兩個獨立的物體，因此可以只繪製警告而不讓它造成傷害

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/craft/readability-and-fairness"><color=#59A6FF>可讀性與公平性</color></link>
hint_gen_bullet_laser_sweep_header: "雷射掃射"
hint_gen_bullet_rain_body: |-
  在一段時間內落向一片區域的子彈。密度和擴散都是引數。每顆子彈的落點取自關卡的種子，因此每次遊玩都能重現

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/craft/readability-and-fairness"><color=#59A6FF>可讀性與公平性</color></link>
hint_gen_bullet_rain_header: "彈幕雨"
hint_gen_bullet_spiral_body: |-
  沿旋轉的臂發射的子彈，形成經典的螺旋彈幕牆

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/craft/readability-and-fairness"><color=#59A6FF>可讀性與公平性</color></link>
hint_gen_bullet_spiral_header: "螺旋彈幕"
hint_gen_bullet_wave_body: |-
  一排齊頭並進的子彈。最基礎的彈幕模式，也最值得先讀：它的引數命名了其他子彈生成器沿用的概念

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/craft/readability-and-fairness"><color=#59A6FF>可讀性與公平性</color></link>
hint_gen_bullet_wave_header: "彈幕波"
hint_gen_capacity_hint_body: |-
  寫入關卡的建議上限：它預計同時需要多少物體和特效

  <color=#B48CE0><b>須知：</b></color>它不會改變任何可見的內容。執行時用它預先分配緩衝區，而不是在關卡中途擴容，中途擴容正是卡頓的來源

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/performance/level-budget"><color=#59A6FF>關卡預算</color></link>
hint_gen_capacity_hint_header: "容量預估"
hint_gen_font_cache_body: |-
  收集關卡文本實際用到的每個字元並烘焙，這樣任何字形都不必在首次出現時才準備

  <color=#7FC97F><b>建議：</b></color>在文本定稿後執行。之後新增且未重新烘焙的字元，會在首次顯示時造成一次卡頓

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/resources/images-and-fonts"><color=#59A6FF>圖片與字型</color></link>
hint_gen_font_cache_header: "字型快取"
hint_gen_geometry_fractal_body: |-
  把一個形狀以逐級縮小的比例重複巢狀進自身。深度對物體數量的消耗呈指數增長，所以每次只調高一級

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/workflow/reuse"><color=#59A6FF>複用：預製件、複製、生成器</color></link>
hint_gen_geometry_fractal_header: "分形"
hint_gen_geometry_grid_body: |-
  用均勻排列的形狀副本填滿一個矩形

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/workflow/reuse"><color=#59A6FF>複用：預製件、複製、生成器</color></link>
hint_gen_geometry_grid_header: "網格"
hint_gen_geometry_polygon_body: |-
  在正多邊形的頂點或邊上放置形狀

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/workflow/reuse"><color=#59A6FF>複用：預製件、複製、生成器</color></link>
hint_gen_geometry_polygon_header: "多邊形"
hint_gen_geometry_radial_body: |-
  把副本沿圓周分佈。大多數對稱圖案的基礎

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/workflow/reuse"><color=#59A6FF>複用：預製件、複製、生成器</color></link>
hint_gen_geometry_radial_header: "環形"
hint_gen_geometry_spiral_body: |-
  把副本沿螺旋線分佈，半徑和角度同步增長

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/workflow/reuse"><color=#59A6FF>複用：預製件、複製、生成器</color></link>
hint_gen_geometry_spiral_header: "螺旋"
hint_gen_level_archive_body: |-
  從本遊戲寫出的歸檔包構建關卡，格式為.tar.gz或.zip，兩者都可以設定密碼。型別根據檔案位元組判斷，所以改過名的歸檔包也能開啟。舊版本生成的歸檔包會在匯入時遷移

  <color=#E8B04B><b>警告：</b></color>預設情況下，匯入的關卡會獲得自己的ID，因此不會覆蓋本機上已有的關卡。只有在要找回本機曾經儲存過的關卡時才關閉此選項

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/reference/generators"><color=#59A6FF>生成器</color></link>
hint_gen_level_archive_header: "匯入關卡歸檔包"
hint_gen_level_audio_file_body: |-
  從一首曲目開始建立關卡：匯入音訊，按曲目長度設定關卡長度，並把你帶到空白時間軸的開頭

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/resources/preparing-the-track"><color=#59A6FF>準備音訊軌道</color></link>
hint_gen_level_audio_file_header: "從音訊檔案建立關卡"
hint_gen_level_empty_body: |-
  把關卡完全清空。所有創作的內容都會被移除，所以要從頭開始而不是修改時，就用它

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/basics/first-level"><color=#59A6FF>第一個關卡：路線</color></link>
hint_gen_level_empty_header: "空白關卡"
hint_gen_section_additional: "主要引數之上的細化設定。這裡的預設值通常就夠用"
hint_gen_section_main: "決定這個生成器產出什麼的引數。從這裡開始"
hint_gen_test_camera_flash_body: "開發用生成器，用於測試相機事件軌道。不用於創作內容"
hint_gen_test_camera_flash_header: "相機閃光（測試）"
hint_gen_test_form_body: "開發用生成器，覆蓋表單能構建的每一種引數控制元件。不用於創作內容"
hint_gen_test_form_header: "表單（測試）"
hint_gen_test_odd_body: "開發用生成器，包含故意設計的刁鑽引數情形。不用於創作內容"
hint_gen_test_odd_header: "怪異（測試）"
hint_gen_test_partial_order_body: "開發用生成器，檢查排序提示未提及的欄位如何佈局。不用於創作內容"
hint_gen_test_partial_order_header: "部分排序（測試）"
hint_gen_test_scatter_body: "開發用生成器，用於測試定址式隨機的程式碼路徑。不用於創作內容"
hint_gen_test_scatter_header: "散佈（測試）"
hint_gen_test_sections_body: "開發用生成器，生成包含多個分割槽的表單。不用於創作內容"
hint_gen_test_sections_header: "分割槽（測試）"
hint_gen_test_spawn_body: "開發用生成器，用於測試物體建立的程式碼路徑。不用於創作內容"
hint_gen_test_spawn_header: "生成（測試）"
hint_gen_texture_objects_body: |-
  把圖片轉換為物體，每個格子一個，這樣圖片就成了關卡內容，可以像其他內容一樣製作動畫

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/resources/images-and-fonts"><color=#59A6FF>圖片與字型</color></link>
hint_gen_texture_objects_header: "紋理物體"
hint_level-preview_authors: "這個關卡署名的所有人。作者資訊儲存在關卡資料夾中，所以即使被打包、轉發並由他人重新上傳也不會丟失"
hint_level-preview_licenses_body: |-
  這個關卡及其資源所適用的條款。<b>條件按每個資源分別記錄</b>，因此由借用部件組成的關卡會準確說明借用了什麼、依據什麼條款

  <color=#7FC97F><b>建議：</b></color>在複用他人關卡中的任何內容之前，先閱讀這些條款

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/rights/licensing-basics"><color=#59A6FF>許可證：三分鐘瞭解全部</color></link>
hint_level-preview_licenses_header: "許可證"
hint_level_backups: "這個關卡的所有自動副本，最新的在最上面，名稱就是建立的時間。選擇其中一個之前不會讀取任何內容。恢復會替換磁碟上的關卡檔案並重新載入，被替換的檔案會先寫入備份，所以恢復本身也可以撤銷"
hint_level_collections_body: |-
  <b>匯入</b>把合集中的條目放進本關卡，<b>生成合集</b>把本關卡的資源複製到合集中。條目需要的一切會一併帶上，一次匯入只需一步撤銷

  <color=#E8B04B><b>警告：</b></color>如果關卡中已有某條目的不同版本，遊戲會詢問。保留關卡的版本，或將合集的版本以新標識作為副本匯入

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/reference/library-and-collections"><color=#59A6FF>庫與合集</color></link>
hint_level_collections_header: "合集"
hint_level_core-framerate: "直接修改這個值會讓所有物體一起變快或變慢：關鍵幀保留各自的幀號，所以同一個關卡會以不同的速度播放。要把內容重新對映到另一個幀率，請使用生成器"
hint_level_core-level-id: "關卡的永久識別符號，在建立時生成一次，之後永不修改。報告關卡問題時請附上它，也可以用它區分同一關卡的兩個副本"
hint_level_core-orientation_body: |-
  這個關卡遊玩時裝置應以哪個方向握持

  <b>水平</b>和<b>垂直</b>會在關卡期間旋轉玩家的裝置，優先於玩家自己的設定。在桌面端，垂直關卡會在兩側留出邊欄來播放，這是預期的樣子

  <b>未指定</b>把選擇留給玩家，這等於<b>宣告</b>關卡在<b>兩種</b>方向下都能正確顯示。遊戲不會為此重新取景或縮放任何內容，所以請先在兩個方向上都檢查一遍關卡

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/reference/level-settings"><color=#59A6FF>關卡設定</color></link>
hint_level_core-orientation_header: "關卡方向"
hint_level_core-runtime-seed: "當前編輯器會話實際使用的種子。上方沒有設定種子時，每次載入關卡都會得到一個新數字。“重新生成”會再擲一個，不改動關卡"
hint_level_core-seed: "關卡中的每個隨機值都由這個種子加上各物體自己的圖層和起始幀得出，所以同一種子每次播放都相同。0表示沒有種子：遊戲每次啟動都會生成一個新的"
hint_level_core_body: |-
  幀長度、幀率和關卡的兩個種子

  <color=#B48CE0><b>須知：</b></color><b>幀從1開始計數。</b>一個N幀的關卡包含第1幀到第N幀，N+1是結束邊界，不是一幀

  <b>關卡種子</b>屬於關卡本身，修改可以撤銷。0表示“每次執行都用新種子”，這也是預設值

  <color=#5EC8C8><b>提示：</b></color><b>執行種子</b>顯示當前編輯器會話實際得到的種子。<i>重新生成</i>只為本次會話換一個新的，不寫入任何內容，也不進入撤銷記錄

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/basics/frames-and-time"><color=#59A6FF>幀、時間與關卡長度</color></link>
hint_level_core_header: "基本"
hint_level_dangerous_body: |-
  會銷燬或重寫檔案（而不是內容）的操作

  <color=#E86A5A><b>注意：</b></color><b>檔案格式</b>下拉選單會重寫磁碟上的關卡及其後設資料。以另一種格式重寫時，<b>舊格式留下的檔案會被刪除</b>。除此之外什麼都不會發生：不重新載入，不重新模擬，也不重置你的選中項或撤銷棧，因為記憶體中的模型本來就與寫入的內容完全一致

  <color=#E86A5A><b>注意：</b></color><b>刪除關卡</b>會從磁碟上刪除關卡資料夾。這一步無法撤銷

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/workflow/not-losing-work"><color=#59A6FF>避免丟失工作</color></link>
hint_level_dangerous_header: "危險區域"
hint_level_effect-editor_body: |-
  製作粒子特效並在畫布上預覽

  <color=#B48CE0><b>須知：</b></color>這裡的引數組與特效檢視器中顯示的相同，但在這裡作為<b>草稿</b>編輯：儲存之前，任何改動都不會進入關卡

  <color=#5EC8C8><b>提示：</b></color>儲存到本裝置的共享庫，即可在多個關卡之間複用這個特效

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/performance/level-budget"><color=#59A6FF>關卡預算</color></link>
hint_level_effect-editor_header: "特效編輯器"
hint_level_font-cache: "關卡預先烘焙哪些字形（按字型和語言分別列出），這樣某個字元第一次出現時文本不會卡頓。只讀：字型快取生成器會根據關卡實際包含的文本來填充它，這個標籤頁上沒有任何東西能編輯它"
hint_level_history_body: |-
  本次會話中的每次編輯都是這裡的一行，最新的在最上面，就像git log。最左邊一列是主線，單獨的一列是你撤銷後換了另一條路而離開的分支。圓環標出你當前的位置，綠色圓點標出上次儲存

  點選某一行會把關卡逐步退回到那個確切的狀態，每幀執行一個操作。歷史只存在於本次會話中，從不寫入磁碟

  <color=#E8B04B><b>警告：</b></color>回退進行期間編輯器處於只讀狀態。“取消”會讓它停在當前位置，而那始終是一個真實的狀態

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/reference/level-settings"><color=#59A6FF>關卡設定</color></link>
hint_level_history_header: "歷史"
hint_level_library-browser_body: |-
  儲存在<b>本裝置</b>上的資源，你在這裡開啟的所有關卡都能共用

  <color=#B48CE0><b>須知：</b></color>匯入會把資源複製<i>到關卡中</i>。關卡自帶所需的一切，所以庫只是為你提供便利，絕不會成為遊玩你關卡的人的依賴

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/workflow/reuse"><color=#59A6FF>複用：預製件、複製、生成器</color></link>
hint_level_library-browser_header: "庫"
hint_level_metadata-logo: "以<color=#D4B483>logo.png</color>的名稱複製到關卡資料夾，並在所有列出該關卡的地方顯示。按正方形<color=#D4B483>512x512</color>的<color=#D4B483>PNG</color>設計：更小的圖片在瀏覽器中會發糊，更大的只會佔用空間。“移除”只清除引用，檔案本身仍留在資料夾中"
hint_level_metadata-tags_body: |-
  標籤是你自己的詞語，按你寫的樣子原樣顯示，從不翻譯。玩家在關卡瀏覽器中按標籤篩選，所以只有其他關卡也在用的標籤才有幫助

  用逗號分隔。保持簡短而通用：一種型別、一種氛圍、一種機制

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/reference/level-settings"><color=#59A6FF>關卡設定</color></link>
hint_level_metadata-tags_header: "關卡標籤"
hint_level_metadata_body: |-
  關於關卡、但不屬於關卡本身的一切：名稱、描述、封面、許可證、年齡分級和作者

  <color=#B48CE0><b>須知：</b></color>名稱和描述是<b>本地化字串</b>：你直接在這裡按語言分別編寫文本，不涉及任何鍵，因為關卡是內容，而不是遊戲介面的一部分。如果玩家的語言你沒有填寫，就會顯示你填寫的第一條

  許可證和作者會隨關卡一起被分享到任何地方，正是這一點讓署名在重新上傳後依然保留

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/reference/metadata-and-sharing"><color=#59A6FF>後設資料與分享關卡</color></link>
hint_level_metadata_header: "後設資料"
hint_level_play-seed: "0表示使用關卡自己的種子，或每次執行用新種子"
hint_level_play_body: |-
  <color=#B48CE0><b>須知：</b></color>這些啟動選項<b>只對這一次執行</b>有效，這裡的任何設定都不會儲存到關卡中

  <color=#5EC8C8><b>提示：</b></color>生命、速度、檢查點和自動遊玩讓你無需編輯就能反覆練習某一段。這裡的<b>種子</b>優先於關卡自己的種子：它是三層中的最高一層，想要重放剛剛看到的那一次執行時就用它

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/craft/difficulty-curve"><color=#59A6FF>難度與曲線</color></link>
hint_level_play_header: "遊玩"
hint_level_publication_body: |-
  所有把此關卡傳送出去的方式。在頂部選擇一種方式，它會顯示自己的設定並自動檢查關卡。報告中的錯誤會阻止傳送，警告和建議由你決定

  <b>壓縮包</b>在所有平臺可用。普通的<b>.zip</b>無需安裝任何軟體即可在Windows資源管理器中開啟。<b>+密碼</b>可用7-Zip或其他任何壓縮軟體開啟，<b>（gpg）</b>需用gpg開啟
  <b>Steam創意工坊</b>只在Steam版本中提供，並按創意工坊的規則檢查關卡

  <color=#5EC8C8><b>提示：</b></color>釋出到創意工坊時先以<b>僅自己</b>可見釋出，檢視物品後再公開。再次釋出會更新同一個物品

  <color=#E8B04B><b>警告：</b></color>密碼不是DRM。任何同時擁有檔案和密碼的人，始終都能開啟它

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/reference/publishing"><color=#59A6FF>釋出</color></link>
hint_level_publication_header: "釋出"
hint_level_raw-add: "向開啟此視窗時所在的槽位新增一個元素。這裡只提供新元素自身的葉欄位，所有巢狀內容保持預設值，之後在樹中編輯"
hint_level_raw_body: |-
  整個儲存的關卡模型，呈現為一棵欄位樹：即檔案本身，在編輯器處理之前的樣子

  <color=#E86A5A><b>注意：</b></color><b>這裡的任何內容都不做校驗。</b>它會寫入編輯器其他部分認為不可能的值，所以請在手邊保留一份關卡資料夾的副本

  實心圓點表示你在本次會話中修改了這個欄位，空心圓點表示它內部有內容被修改。<b>應用</b>會把整個會話作為一次可撤銷的操作提交

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/workflow/not-losing-work"><color=#59A6FF>避免丟失工作</color></link>
hint_level_raw_header: "原始資料"
hint_level_resource-meta_body: |-
  單個資源的標題、描述、來源、許可證和作者

  <color=#B48CE0><b>須知：</b></color>署名正是這樣得以保留：從別處取來的紋理、字型或音訊檔案，會在關卡內部記錄它的來源和使用條款，無論關卡去往何處

  <color=#7FC97F><b>建議：</b></color>在新增資源時就填寫，那是你唯一還記得這些資訊的時候

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/rights/resource-record"><color=#59A6FF>資源的記錄</color></link>
hint_level_resource-meta_header: "資源後設資料"
hint_level_resources-audios: "這個關卡攜帶的音訊檔案。先在這裡新增，再把它作為音訊軌道放到音訊時間軸上"
hint_level_resources-effects_body: |-
  關卡可以放置的<color=#D4B483>VFX Graph</color>粒子特效。它們是<b>可選的</b>：不使用特效的關卡也會完全按設計播放

  特效使用關卡帶種子的隨機數，因此在任何裝置上重放結果都相同。特效可以匯出到本裝置的共享庫

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/performance/level-budget"><color=#59A6FF>關卡預算</color></link>
hint_level_resources-effects_header: "特效"
hint_level_resources-fonts: "這個關卡攜帶的字型，供它的文本物體使用。和其他資源一樣，字型存放在關卡旁邊，隨關卡一起轉移"
hint_level_resources-prefabs_body: |-
  可複用的物體組。預製件儲存模板物體，每次放置都會得到它們的真實副本。編輯模板會影響每個放置，而單個放置仍可以通過例項覆蓋與模板不同

  <color=#E8B04B><b>警告：</b></color>與主題、特效和碰撞體不同，預製件<b>沒有遊戲內建預設</b>，在關卡之間轉移預製件要通過庫和合集

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/workflow/reuse"><color=#59A6FF>複用：預製件、複製、生成器</color></link>
hint_level_resources-prefabs_header: "預製件"
hint_level_resources-shapes_body: |-
  關卡自己的形狀，在遊戲生成的約500種之外另加。形狀是貼合其包圍框的<b>真實幾何體</b>，因此物體的矩形就是它繪製的內容

  <color=#5EC8C8><b>提示：</b></color>形狀和碰撞體是同一類資料，物體引用其中一個決定繪製什麼，引用另一個決定被擊中的範圍。兩者互不推導，因此無害的預警光束或隱形牆都只是普通內容

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/resources/level-needs"><color=#59A6FF>關卡需要什麼</color></link>
hint_level_resources-shapes_header: "形狀"
hint_level_resources-textures_body: |-
  這個關卡攜帶的圖片。<b>遊戲本身不附帶任何紋理</b>，關卡用到的每張紋理都在這裡新增，並存放在關卡資料夾中，因此會隨關卡一起轉移

  <color=#B48CE0><b>須知：</b></color>形狀<b>不是</b>紋理。它們是真實幾何體，不需要這個標籤頁裡的任何東西

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/resources/images-and-fonts"><color=#59A6FF>圖片與字型</color></link>
hint_level_resources-textures_header: "紋理"
hint_level_resources-themes_body: |-
  主題是<b>關卡顏色可以引用的調色盤</b>，顏色不必直接儲存具體數值。切換活動主題會為所有引用它的內容重新配色，而切換本身以關鍵幀的形式放在事件時間軸上

  <color=#5EC8C8><b>提示：</b></color>把主題匯出到本裝置的共享庫，即可在其他關卡中複用

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>顏色、主題與後期處理</color></link>
hint_level_resources-themes_header: "主題"
hint_level_rules_body: |-
  校驗在這個關卡中發現的問題：失效的引用、重複的ID、父級迴圈、巢狀過深的預製件、重疊的節拍段

  部分問題可以修復，逐個修復或使用<b>全部修復</b>。修復會先寫入草稿：<b>儲存</b>把它們作為一次可撤銷的操作應用，<b>放棄</b>則丟棄它們。圖結構問題（ID、父級、預製件巢狀）沒有修復方案，這些是隻有你能做的內容決定

  <color=#5EC8C8><b>提示：</b></color>子物體的時段超出父級<b>不會</b>被報告。要讓時段相互適配，請從生成器中執行<color=#D4B483>時段適配</color>修改器

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/workflow/not-losing-work"><color=#59A6FF>避免丟失工作</color></link>
hint_level_rules_header: "規則"
hint_level_shape-editor_body: |-
  用點和點之間的邊構建形狀。<b>三角形自動推導，不能編輯</b>，因此三個三角形共用的頂點只是一個可拖動的點

  <color=#E8B04B><b>警告：</b></color>格式儲存的是三角形而不是邊，沒有閉合成環的邊在儲存時會被丟棄，編輯器會報告這一點

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/resources/images-and-fonts"><color=#59A6FF>圖片與字型</color></link>
hint_level_shape-editor_header: "形狀編輯器"
hint_level_theme-editor_body: |-
  主題提供的槽位以及填充它們的顏色

  <color=#E86A5A><b>注意：</b></color>關卡內容引用的是槽位，因此<b>重新編號槽位會為所有引用它們的內容重新配色</b>，槽位的位置就是它的身份

  <color=#5EC8C8><b>提示：</b></color>把完成的主題儲存到本裝置的共享庫，即可在其他關卡中複用

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>顏色、主題與後期處理</color></link>
hint_level_theme-editor_header: "主題編輯器"
hint_menu_level-ai: "作者宣告關卡本身、其封面或其中某個資源由 AI 生成。開發者不會核查，關卡攜帶的是作者寫下的內容"
hint_menu_level-authors: "這個關卡的製作者，按關卡自己的後設資料列出。“作者”按鈕會開啟帶連結的完整列表"
hint_menu_level-bot_body: |-
  <b>機器人用你的操作方式替你遊玩關卡</b>，它會像你一樣移動、衝刺、受到傷害和死亡，而且不能作弊：同樣的速度、同樣的衝刺、同樣的判定框

  <b>Reflex Bot v1</b>向前看1.5秒，躲開它看到的東西，並且每一幀重新計算。它不需要準備，所以這一局會立刻開始。能難倒它的是需要提前一秒進入的彈幕組合

  <b>Warm Bot v1</b>在這一局開始前算好貫穿整個關卡的路線，目標是零傷害

  <color=#E8B04B><b>警告：</b></color>計算路線是額外的載入階段，可能需要幾十秒。你可以取消計算，自己遊玩這個關卡

  <b>它不能保證關卡可以通關</b>：機器人永遠不會疲勞，但依然會輸。它還會在每一幀佔用效能，因此在效能較弱的裝置上幀率會降低

  能擊敗機器人的關卡值得提交：在<link="https://github.com/bullet-hero/releases/issues"><color=#59A6FF>bullet-hero/releases</color></link>中建立Issue，說明是哪個機器人在哪裡輸了，並附上關卡資料夾

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/workflow/bot-playtest"><color=#59A6FF>讓機器人遊玩你的關卡</color></link>
hint_menu_level-bot_header: "機器人"
hint_menu_level-checkpoints: "這一局是否計入作者設定的檢查點。開啟時，死亡會讓關卡倒回到最後到達的檢查點並恢復生命。關閉時則回到關卡開頭。開啟和關閉檢查點的遊玩分別記錄成績"
hint_menu_level-identity: "這個關卡實際上是哪一個：它所在的來源、統計記錄所用的ID，以及當資料夾不以ID命名時存放它的資料夾。內建關卡和你製作的副本在此螢幕上的其他資訊都相同，區別只在這幾項"
hint_menu_level-lives: "一次遊玩能承受多少次受擊。在“禪”模式下你仍會被擊中和擊退，只是遊玩永遠不會結束。“自定義”可取滑塊能達到的任意次數。“無碰撞”是單獨的選項：任何東西都碰不到你，這類遊玩單獨記錄成績"
hint_menu_level-music: "音樂作者，按關卡自己的後設資料記錄。“許可證”按鈕包含關卡攜帶的其他所有資源"
hint_menu_level-no-collision: "角色會穿過一切，任何東西都碰不到它。這和“禪”模式不同：“禪”模式下仍會被擊中，只是遊玩永遠不會結束。無碰撞的遊玩單獨記錄成績"
hint_menu_level-rating: "作者宣告的年齡分級。開發者不會核查，關卡攜帶的是作者寫下的內容"
hint_menu_level-record: "你在這個關卡上的個人記錄，對應右側當前選擇的啟動選項。改變生命、速度、檢查點、機器人或“無碰撞”，記錄也會隨之改變：不同條件下的遊玩是不同的成就，因此每組設定各自保留最佳成績。嘗試次數和通關次數統計每一次遊玩，與設定無關"
hint_menu_level-seed: "關卡中所有隨機值的來源數字。相同的種子在任何裝置上都會產生相同的遊玩，0表示關卡每次都重新生成一個"
hint_menu_level-speed: "關卡及其音樂的播放速度。“自定義”可取滑塊能達到的任意速度，不限於三個預設"
hint_mod_content_remover_body: |-
  刪除關卡中與你在此處所選條件匹配的內容

  <color=#E86A5A><b>注意：</b></color>它會改寫已有內容而不是新增內容，所以執行前請先讀懂引數：撤銷只有一步，但那是唯一的回頭路

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/workflow/reuse"><color=#59A6FF>複用：預製件、複製、生成器</color></link>
hint_mod_content_remover_header: "內容移除"
hint_mod_framerate_remap_body: |-
  把關卡中的所有幀號換算到另一個幀率，使各個時間點以秒計仍落在原來的位置

  <color=#E8B04B><b>警告：</b></color>幀是整數，任何不能整除的數值都會被取整，一個關卡重對映兩次後不一定能回到原樣

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/basics/frames-and-time"><color=#59A6FF>幀、時間與關卡長度</color></link>
hint_mod_framerate_remap_header: "幀率重對映"
hint_mod_prefab_flatten_body: |-
  把此範圍內的每個預製件放置轉換為普通物體。與模板的關聯會斷開，物體保持在原來的位置

  <color=#B48CE0><b>須知：</b></color>執行後關卡看起來完全一樣：沒有任何內容被刪除或移動，每個放置的覆蓋已經寫入物體本身。除非你要求移除，模板會保留在關卡中

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/reference/modifiers"><color=#59A6FF>修改器</color></link>
hint_mod_prefab_flatten_header: "展平預製件"
hint_mod_quantize_keyframes_body: |-
  將關鍵幀吸附到固定的步長上，手動擺放的鬆散動畫就是這樣對齊到節拍的

  <color=#E8B04B><b>警告：</b></color>落在同一幀上的兩個關鍵幀會合併為一個，所以粗粒度的量化只會丟失細節，而不是壓縮細節

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>節奏與結構</color></link>
hint_mod_quantize_keyframes_header: "量化關鍵幀"
hint_mod_span_fit_body: |-
  讓子物體的時段落在父級的時段之內：要麼把子物體收進來，要麼把父級向外擴充套件

  <color=#B48CE0><b>須知：</b></color>超出父級的子物體是合法資料，只是播放時會被裁掉，所以這是內容上的決定，而不是修復，也因此編輯器不會自動替你執行它。兩種方式都不會改動錨點

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/basics/frames-and-time"><color=#59A6FF>幀、時間與關卡長度</color></link>
hint_mod_span_fit_header: "時段適配"
hint_mod_span_stagger_body: |-
  在時間上錯開選中項，讓原本同時開始的物體一個接一個出現

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/workflow/reuse"><color=#59A6FF>複用：預製件、複製、生成器</color></link>
hint_mod_span_stagger_header: "時段錯開"
hint_mod_test_rename_body: "用於測試重新命名路徑的開發用生成器。不用於創作內容"
hint_mod_test_rename_header: "重新命名（測試）"
hint_sandbox_attacks-auto: "隨機波次自動出現，就像主選單背景裡那樣"
hint_sandbox_attacks-fire: "每個按鈕都會向你發出一波該攻擊"
hint_sandbox_attacks-gap: "波次自動出現時，兩波之間間隔的秒數"
hint_sandbox_controls-gyro: "開啟體感，把它作為操控裝置"
hint_sandbox_controls-mode: "你當前所用操控裝置的模式，會立即儲存並在整個遊戲中生效"
hint_sandbox_game-bot: "把化身交給主選單背景裡遊玩的那個機器人"
hint_sandbox_game-free-camera: "用滑鼠中鍵或雙指平移，用滾輪或雙指捏合縮放。框線顯示的是關卡相機所見的範圍"
hint_sandbox_game-lives: "死亡前可承受的受擊次數。死亡的過程與關卡中相同，之後化身回到中心"
hint_sandbox_game-speed: "只讓攻擊變慢或變快，化身保持自己的速度"
hint_sandbox_tutorial_body: |-
  六個操作步驟。每一步都檢查你實際做了什麼。被擊中或死亡只會讓當時所在的那一步重來，並把它標紅，直到通過為止

  點按一個步驟即可練習它，已通過的步驟也可以。只有所有步驟都通過，教程才算完成

  <color=#E8B04B><b>警告：</b></color><b>無敵</b>時受擊不計數，所以教程也看不到它們

  更多：<link="https://bullethero.space/zh-Hant/docs/game/sandbox"><color=#59A6FF>沙盒與教程</color></link>
hint_sandbox_tutorial_header: "教程"
hint_settings_audio: "主音量、關卡在遊戲和編輯器中播放的音量，以及關卡編輯器之外和之內的介面音效"
hint_settings_audio-editor-game: "關卡在編輯器中播放的音量。同一個關卡、同一條播放路徑，只是要連聽幾個小時而不是一次，所以遊戲本身的音量保持不變"
hint_settings_audio-editor-ui: "關卡編輯器自身音效的音量。它只提示一次編輯的結果：儲存、拒絕、撤銷、刪除，從不為普通的按下發聲"
hint_settings_audio-game: "關卡播放內容的音量：它的音樂和音效"
hint_settings_audio-ui: "關卡編輯器之外的介面音量：選單、瀏覽介面、設定"
hint_settings_audio-volume: "主音量。其他所有音量都按它縮放"
hint_settings_controls_body: |-
  你如何操控玩家，按裝置型別劃分：鍵盤和滑鼠、觸屏、手柄以及裝置的陀螺儀

  <color=#B48CE0><b>須知：</b></color>可以同時啟用多種裝置，由你<b>最後</b>碰過的那種來操控，衝刺和暫停在任何一種上都有效

  <color=#5EC8C8><b>提示：</b></color>陀螺儀的中立位置是手機螢幕朝上<b>平放</b>，偏離水平傾斜即可移動。如果需要傾斜得太多，就調高<b>靈敏度</b>

  更多：<link="https://bullethero.space/zh-Hant/docs/game/controls"><color=#59A6FF>操作</color></link>
hint_settings_controls_header: "操作"
hint_settings_game-editor-autosave: "定時寫入一份關卡副本。它不會覆蓋你已儲存的關卡，副本只是安全網，不等於儲存"
hint_settings_game-editor-autosave-rate: "兩次自動副本之間間隔的秒數"
hint_settings_game-editor-camera-invert: "拖拽時是讓關卡跟著指標移動，還是反過來移動相機。兩種方式各有人覺得順手"
hint_settings_game-editor-camera-max-size: "編輯器視口最多能縮小到多遠"
hint_settings_game-editor-camera-min-size: "編輯器視口最多能放大到多近"
hint_settings_game-editor-camera-sensitivity-x: "指標每移動一個單位，檢視水平移動多遠"
hint_settings_game-editor-camera-sensitivity-y: "指標每移動一個單位，檢視垂直移動多遠"
hint_settings_game-editor-camera-wheel-multiplier: "滾輪每滾動一格縮放多少"
hint_settings_game-editor-camera-zoom-to-mouse: "朝游標縮放，而不是朝視口中心縮放。關閉時縮放過程中中心保持不動"
hint_settings_game-editor-create-shape-size-x: "新形狀建立時的寬度，不含它自身的縮放"
hint_settings_game-editor-create-shape-size-y: "新形狀建立時的高度，不含它自身的縮放"
hint_settings_game-editor-create-text-size-x: "新文本排布字形所用文本框的寬度，而不是字形本身的大小"
hint_settings_game-editor-create-text-size-y: "新文本排布字形所用文本框的高度，每個單位大約一行"
hint_settings_game-editor-effects-active-default: "開啟編輯器時是否預覽關卡的後期效果。這只是初始狀態，工作中關掉它們不會改變此設定。手機上預設關閉，因為後期處理是編輯器繪製的內容中最耗效能的"
hint_settings_game-editor-gizmos-scale: "視口中控制柄的繪製大小。按滑鼠尺寸設計的控制柄很難用拇指點中"
hint_settings_game-editor-grid-active-default: "開啟編輯器時視口網格是否已開啟。這只是初始狀態，工作中關掉網格不會改變此設定"
hint_settings_game-editor-grid-opacity: "網格的明顯程度。淡到無法辨認的網格乾脆不繪製"
hint_settings_game-editor-grid-size: "視口網格的間距，以關卡單位計"
hint_settings_game-editor-history-length: "會話保留多少步編輯操作，超出後丟棄最舊的分支。調高只多佔記憶體，沒有其他代價"
hint_settings_game-editor-history-objects: "在步數之外，歷史還限制保留的物體數量。一次批次刪除就是一個包含50000個物體的步驟，這個上限正是為此而設。0表示不限制，小於0由裝置決定"
hint_settings_game-editor-interface-dirty-field-delay: "檢視器欄位在你最後一次按鍵後等待多久才提交。設為零則每次按鍵都提交，並且每一次都可以撤銷"
hint_settings_game-editor-interface-levels-layout: "編輯器中關卡瀏覽器開啟時的樣式：帶描述的列表，或封面網格。搜尋框旁的按鈕仍可臨時切換，關閉編輯器前有效"
hint_settings_game-editor-interface-log-clamps: "當你輸入的數值被拉回允許範圍時，在控制台中報告。無論是否開啟，數值都會被鉗制"
hint_settings_game-editor-interface-rotation-unit: "旋轉欄位顯示和輸入所用的單位。角度始終以弧度儲存"
hint_settings_game-editor-level-serialize-mode: "關卡寫入所用的檔案格式。<b><color=#D4B483>Json</color></b>是文本，可讀，也能手動修復。<b><color=#D4B483>Blob</color></b>是二進位制，載入快幾十倍，但一旦損壞幾乎無法修復"
hint_settings_game-editor-max-autosave-files: "保留多少份副本。達到上限時丟棄最舊的一份"
hint_settings_game-editor-mcp-enabled: "允許支援 MCP 的 AI 助手連線到此編輯器並編輯開啟的關卡。只有本機可以連線，AI 一次批次完成的所有操作在歷史記錄中只算一步"
hint_settings_game-editor-mcp-follow-ai: "AI檢視某一幀之後播放頭停在哪裡。關閉：回到你離開時的位置。開啟：停在AI檢視的那一幀並暫停。AI檢視期間你動了時間軸，播放頭就留在你放的位置"
hint_settings_game-editor-mcp-operation-delay: "編輯器在兩次AI操作之間等待的時間，方便你看清每一步。<b><color=#D4B483>0</color></b>表示每次立即執行。播放、暫停和移動播放頭從不延遲。範圍為0到5"
hint_settings_game-editor-mcp-port: "編輯器監聽的埠。<b><color=#D4B483>0</color></b> 表示每次啟動自動選一個空閒埠，否則填 <b><color=#D4B483>1024-65535</color></b>"
hint_settings_game-editor-mcp-reveal-edits: "每次AI編輯後，選中並定位它建立或修改的內容。你在拖拽、輸入或遊玩時不會這樣做"
hint_settings_game-editor-multi-select-requires-hold: "向選中項中新增內容是否需要刻意長按。觸屏上開啟更安全，否則一次誤觸就會改變選中的內容"
hint_settings_game-editor-pick-invisible-aabb: "允許點選選中不繪製任何內容的物體。隱形牆需要它，因為隱形牆有判定框卻沒有形狀"
hint_settings_game-editor-player-active-default: "開啟編輯器時測試玩家是否已在場。在觸屏上它還會佔用視口，所以手機上通常應關閉"
hint_settings_game-editor-player-bot: "把預覽玩家交給<color=#D4B483>Reflex Bot v1</color>操控，而不是由你操控。這裡只提供這一個機器人，因為它無需預先準備，並且在你編輯時持續工作，任何播放速度都可以，包括倒放。它遵守和你一樣的規則：會受到傷害，也會被逼入死角。剛拖動進度後，它會短暫表現變差，因為要重建對未來的認知。選擇哪個機器人屬於每一局的設定，在此介面的“遊玩”標籤頁中"
hint_settings_game-editor-player-bot-debug: "機器人除錯疊加層的總開關。預設關閉。其下各項都已開啟，所以開啟它就能一次看到全貌"
hint_settings_game-editor-player-bot-debug-grid: "繪製機器人認為螢幕各處有多少空間，按它能預見的所有內容中的最壞情況計算。紅色是它預計會被擊中的位置。它認為安全的地方不繪製任何內容"
hint_settings_game-editor-player-bot-debug-reach: "繪製機器人認為在其規劃視窗結束前能到達多遠，內圈是步行可達，外圈是用掉衝刺可達。它從不選擇圈外的目標"
hint_settings_game-editor-player-bot-debug-target: "繪製機器人當前前往的點。它會堅持已有選擇，直到出現明顯更好的目標，所以目標不再移動說明機器人已滿意，而不是卡住了"
hint_settings_game-editor-player-reset-gizmos: "開啟測試玩家時取消當前的控制柄模式，免得手指下留著一個拖拽手柄"
hint_settings_game-editor-preview-collider-on-select: "顯示選中物體的判定框。這裡繪製的內容和被擊中的範圍是兩回事，所以二者可能不一致"
hint_settings_game-editor-publish-language: "創意工坊物品的標題和描述優先以哪種語言釋出。<b><color=#D4B483>英語</color></b>或<b><color=#D4B483>系統語言</color></b>，即裝置自身的語言"
hint_settings_game-editor-resources-serialize-mode: "對關卡自帶的資源做同樣的選擇"
hint_settings_game-editor-selection-collider-opacity: "選中物體的判定框繪製得有多不透明"
hint_settings_game-editor-selection-collider-opacity-view: "同上，用於同時顯示所有判定框的檢視。這裡更淡，因為數百個判定框會相互重疊"
hint_settings_game-editor-selection-long-press-delay: "行或片段需要按住多久才進入多選。如果經常誤選，就調高它"
hint_settings_game-editor-selection-long-press-threshold: "按住期間指標能偏移多遠，超過就算作拖拽。手不穩時調高它"
hint_settings_game-editor-timeline-edge-handle: "片段邊緣上用於調整長度的區域有多寬。拖動片段的其餘部分則會整體滑動"
hint_settings_game-editor-timeline-loop-global: "播放頭到達關卡末尾時是否回到開頭，而不是停止"
hint_settings_game-editor-timeline-loop-local: "同上，用於區域性時間軸，它會重複單個物體自己的時段"
hint_settings_game-editor-timeline-snap-threshold: "拖動的邊緣需要落到多近才會吸附到候選幀上"
hint_settings_game-editor-timeline-time-format: "時間軸標尺和播放頭讀數的計數方式。它不改變關卡中的任何內容，指向的始終是同一幀。“小節和節拍”讀取關卡自己的節拍網格，在網格沒有節拍段的地方改用時間碼"
hint_settings_game-editor_body: |-
  <b>自動儲存</b>定時儲存關卡，每次寫入一份備份副本。<b>自動儲存檔案上限</b>限制保留的副本數量

  <b>相機最小尺寸</b>和<b>相機最大尺寸</b>限制視口的縮放範圍。<b>多選需按住</b>和<b>按AABB選取不可見部分</b>改變在視口中點選的含義

  <b>關卡格式</b>和<b>資源格式</b>設定寫入磁碟的預設格式

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/workflow/speed-and-shortcuts"><color=#59A6FF>速度與快捷鍵</color></link>
hint_settings_game-editor_header: "編輯器"
hint_settings_general: "語言，以及遊戲同時載入多少資源。<b>語言</b>留空時跟隨裝置"
hint_settings_general-language: "介面語言。留空時跟隨裝置。它不影響關卡自己的文本，那些文本由關卡自帶"
hint_settings_general-resource-parallel-load-count: "關卡的檔案同時載入多少個。調高在快速磁碟上完成得更快，在慢速磁碟上可能卡頓"
hint_settings_general-resource-web-timeout: "通過網路獲取檔案時，放棄前等待的秒數"
hint_settings_general-show-all-found-content: "同時列出來源找到、但無法確認屬於你的內容，例如已取消訂閱的創意工坊物品的檔案，或手動複製進來的資料夾。這類關卡會在卡片上標出。關閉時，來源只列出它能擔保的內容"
hint_settings_graphics-antialiasing-hdr: "大於1的顏色值。這裡沒有任何內容需要它們，而且它會讓記憶體頻寬翻倍，所以預設關閉"
hint_settings_graphics-antialiasing-msaa: "<color=#D4B483>MSAA</color>對每個畫素取多少個取樣。越多越平滑，開銷也越大，而且透明內容重疊得越多，開銷增長得越快"
hint_settings_graphics-antialiasing-type: "邊緣如何平滑。<b><color=#D4B483>MSAA</color></b>能精確處理邊緣，因為這裡的每個形狀都是真實幾何體。<b><color=#D4B483>FXAA</color></b>無論場景如何，開銷都只是一次處理，這是效能弱的手機要面對的取捨"
hint_settings_graphics-audio-pitch-correction: "為追上模擬而對音訊速度施加的校正強度。越高校正得越快，也越容易聽出來"
hint_settings_graphics-audio-render: "是否播放關卡的音訊。關閉後所有關卡都靜音執行，下面的音訊設定也不再起作用。適合連音訊本身都吃力的裝置"
hint_settings_graphics-audio-render-effects: "編輯時應用軌道的音訊效果。關閉時你聽到的是原始音訊片段"
hint_settings_graphics-audio-resync-jump-time: "音訊與模擬允許偏離多遠，超過後音訊會直接跳回原位，而不是逐步微調"
hint_settings_graphics-audio-scrub-time: "沿軌道拖動播放頭時，每次聽到的片段有多長"
hint_settings_graphics-audio-sync-dead-zone: "小於此值的偏差會被忽略。沒有死區的話，音訊會被不停地校正，而且能聽出來"
hint_settings_graphics-audio-use-scrub: "拖動播放頭時播放它下方的音訊，方便憑聽覺找到某個時刻"
hint_settings_graphics-avatar-render: "化身的身體是由25個方塊組成的網格，損失生命值時，方塊會沿幾道裂痕從邊緣向內變暗，所以一局打得不順，你在玩家身上就能看出來，而不必看血條。失去的方塊會留下淡淡的殘影，下方的判定框圓環會透過它顯現。關閉後，網格變成一個方塊，生命值改為讓它逐漸變淡：傳達的資訊相同，只是一個物體而不是25個，適合不想繪製那麼多方塊的裝置"
hint_settings_graphics-colliders-mode-active: "用於練習的模式。遊玩的關卡會把每個判定框畫成純色背景上的平面填充，除此之外什麼都不畫：裝飾、文字、特效、後期處理和主題背景都會消失。決定本局的一切都保留：音樂、碰撞、鏡頭及其震動、檢查點、介面和統計。在這裡的遊玩與其他遊玩同樣計入。僅限遊戲畫面：編輯器和沙盒照常繪製"
hint_settings_graphics-colliders-mode-background: "填充後面繪製的顏色。特意用深灰而不是黑色：鏡頭畫面周圍的邊框是黑色的，黑色背景會讓人看不出關卡畫面在哪裡結束"
hint_settings_graphics-colliders-mode-color: "該模式填充判定框所用的顏色。編輯器的碰撞體檢視以其自身的不透明度使用相同的色相，因此兩者始終一致。“重置圖形設定”會恢復最初的紅色"
hint_settings_graphics-colliders-mode-use-alpha: "開啟時填充按顏色的不透明度半透明顯示，兩個重疊的障礙會顯示為更深的一塊。關閉時每個填充都是實心的，在小螢幕上更易辨認，但重疊部分會合成一個形狀。遊戲中不透明度不會低於0.15，因為再淡就看不見了"
hint_settings_graphics-effects-fixed-framerate: "特效模擬的頻率，與特效繪製的頻率無關"
hint_settings_graphics-effects-frame-step-budget: "單幀內特效最多可以執行多少步，這樣追趕進度時永遠不會造成明顯的卡頓"
hint_settings_graphics-effects-framerate-target: "特效繪製的頻率。低於遊戲本身的幀率是一種低成本的節省，因為粒子在較粗的步長下看起來也沒問題"
hint_settings_graphics-effects-max-scrub-time: "跳轉播放頭時，編輯器最多重放多長的特效歷史。越長越準確，也越慢"
hint_settings_graphics-effects-render: "是否繪製粒子特效。它們讓關卡更豐富，但沒有任何關卡依賴它們，所以放棄它們是安全的"
hint_settings_graphics-effects-replay-step-budget: "一次重放最多可以執行多少模擬步。有了這個上限，跳轉到密集段落時編輯器才不會卡死"
hint_settings_graphics-fixed-framerate: "“目標幀率”為“固定”時遊戲保持的上限，只決定螢幕重繪的頻率，別的都不影響。關卡按真即時間模擬，所以同一局在30 FPS和144 FPS下的表現完全一致。開啟“垂直同步”時忽略此項"
hint_settings_graphics-framerate-target: "遊戲力求達到的每秒幀數。直接應用，而不是通過垂直同步"
hint_settings_graphics-postprocessing-render: "下方所有相機效果的總開關。關閉後跳過整個效果棧"
hint_settings_graphics-postprocessing-render-analog-glitch: "模擬訊號干擾：滾動的條紋、撕裂的掃描線、顏色滲出"
hint_settings_graphics-postprocessing-render-bloom: "明亮區域的光向四周溢位"
hint_settings_graphics-postprocessing-render-chroma: "顏色通道向螢幕邊緣分離，就像廉價鏡頭一樣"
hint_settings_graphics-postprocessing-render-color-curves: "按通道調整的顏色曲線，用於精細調色"
hint_settings_graphics-postprocessing-render-digital-glitch: "數字損壞：錯位的色塊，彷彿幀資料被損壞了"
hint_settings_graphics-postprocessing-render-grain: "畫面上疊加的膠片顆粒"
hint_settings_graphics-postprocessing-render-lens: "畫面像真實鏡頭那樣發生彎曲"
hint_settings_graphics-postprocessing-render-lift-gamma-gain: "分為三個區域的調色：陰影、中間調和高光"
hint_settings_graphics-postprocessing-render-motion-blur: "快速運動會拖出殘影。如果它讓子彈更難看清，可以關掉"
hint_settings_graphics-postprocessing-render-shadows-midtones-highlights: "還是這三個區域，但分別著色，而不是整體提亮"
hint_settings_graphics-postprocessing-render-vignette: "螢幕邊緣變暗，把注意力引向中央"
hint_settings_graphics-postprocessing-render-white-balance: "改變什麼算作白色，讓整個畫面變暖或變冷"
hint_settings_graphics-render-scale: |-
  遊戲自身在縮放到視窗之前渲染多少畫素

  低於1時，遊戲繪製更少的畫素再拉伸放大，這是在效能弱的機器上最值得調低的一項，因為片元開銷隨它的<b>平方</b>下降。高於1時，遊戲以更大的尺寸渲染再縮小結果，也就是超取樣

  無論如何，介面都繪製到自己的全尺寸目標中，所以不管這裡設為多少，文字和按鈕都保持清晰。這個數值會與此類裝置自帶的縮放倍數相乘，而不是取代它
hint_settings_graphics-resolution: |-
  遊戲視窗的畫素尺寸，可選值來自此顯示器實際報告的模式，所以這裡不可能請求顯示器無法顯示的模式

  這也是桌面端切換螢幕方向的方式：高度大於寬度的解析度會讓介面進入豎屏佈局，與豎起來的手機相同。顯示器無法在遊戲內旋轉，所以這一項和視窗尺寸是僅有的兩個手段

  不做設定時，使用顯示器自身的解析度
hint_settings_graphics-textures-compression: "載入時把影像打包成<color=#D4B483>壓縮</color>格式。記憶體減少到四分之一至八分之一，代價是漸變或硬邊緣落在4x4塊上時會出現塊狀瑕疵。在關卡載入時讀取，而不是在關卡開啟期間"
hint_settings_graphics-textures-compression-quality: "在載入時間和壓縮瑕疵之間取捨。無論如何，影像最終的大小都相同，手機則完全忽略此設定"
hint_settings_graphics-textures-filtering: "只決定影像繪製時如何取樣。影像縮小的方式由它的作者對它的標記決定，而不是由這一項決定"
hint_settings_graphics-textures-mipmaps: "每張影像的縮小副本，使縮小繪製的影像在移動時不再閃爍。多佔用三分之一的記憶體，也是消除這種閃爍的唯一辦法"
hint_settings_graphics-textures-size-limit: "影像在此裝置記憶體中允許的最大尺寸。記憶體隨邊長的平方下降，所以這一項比壓縮更省記憶體，也是三項中唯一能真正限制關卡開銷上限的一項"
hint_settings_graphics-vsync: |-
  遊戲在顯示一幀之前是否等待顯示器重新整理

  <b>關</b>時，每幀一準備好就立刻顯示。沒有任何等待，所以輸入會盡早反映到螢幕上，但在重新整理中途完成的幀會覆蓋在上一幀的一半之上，這就是畫面撕裂

  <b>開</b>時，每次重新整理呈現一幀，撕裂消失，但每幀最多增加一次重新整理的延遲。<b>半速率</b>則每兩次重新整理呈現一幀，在無法保持完整重新整理率的機器上更平穩，但延遲加倍

  只要此項不是“關”，Unity就會完全忽略上方的幀率上限，所以那兩行會變灰

  手機按自己的節奏呈現畫面，此項在手機上無效
hint_settings_graphics-window-mode: |-
  遊戲視窗如何佔據顯示器

  <b>視窗化</b>是唯一可以自由調整大小的模式，而調整大小正是改變遊戲寬高比的方式：把視窗拖得高度大於寬度，整個介面就會切換到豎屏佈局，與豎起來的手機完全一樣

  <b>無邊框視窗</b>是預設模式：填滿顯示器，無需切換顯示模式，Alt+Tab即時切換。<b>獨佔全屏</b>把顯示器完全交給遊戲，速度略快，但切出去更慢

  手機只有一個視窗，那就是螢幕，所以此項在手機上無效
hint_settings_graphics_body: |-
  <b>抗鋸齒。</b>預設使用<color=#D4B483>MSAA</color>，因為這款遊戲中的每個形狀都是真實幾何體，所以每條出現鋸齒的邊都是真實的幾何邊緣，這正是多重取樣能在所有平臺上以完整清晰度精確處理的情況。<b><color=#D4B483>FXAA</color></b>是效能較弱手機的替代方案：無論關卡過度繪製多少，它的開銷都只是一次全屏處理，而<color=#D4B483>MSAA</color>的開銷會隨透明內容的過度繪製增長。<b>刻意不提供TAA</b>：在這類遊戲中，快速子彈後的拖影會影響辨識，而且它的抖動會與故障效果相沖突

  <b>幀率。</b>目標幀率是手動應用的，而不是通過垂直同步。“固定幀率”讓模擬與顯示脫鉤，正因如此，關卡的時序在60Hz和144Hz的螢幕上完全一致

  <color=#7FC97F><b>建議：</b></color>裝置吃力時，把<b>渲染縮放</b>調到1以下是代價最小的選擇：只損失清晰度，別的都不受影響

  更多：<link="https://bullethero.space/zh-Hant/docs/editor/performance/mobile-devices"><color=#59A6FF>移動裝置</color></link>
hint_settings_graphics_header: "圖形"
hint_settings_interface: "統計資訊疊加層及其位置。它繪製在所有螢幕之上，用於診斷效能，而不是在遊玩時使用"
hint_settings_interface-alert-on-exception: "未捕獲的錯誤是否彈出報告視窗。無論如何，報告都會生成、寫入日誌並保留，這項設定只決定它是否打斷你，而這在一局遊玩的中途最為重要。關閉時，最後一份報告仍在玩家日誌中，也可以通過<b>儲存報告</b>在報告資料夾中找到"
hint_settings_interface-hitbox-ring-opacity: "化身上的圓點環正好位於它的碰撞半徑上：身體繪製寬度為1，碰撞半徑卻只有0.4。輪廓從來都不是判定框，現在你能看到判定框真正的位置。這個圓環同時也顯示生命數：亮著的點是剩餘的生命，暗下的點是已經失去的生命。這個滑塊只決定圓環在關卡繪製的內容之上有多顯眼，設為0會將它完全關閉。關卡是按能看到它的玩家來平衡的"
hint_settings_interface-levels-layout: "選單中關卡瀏覽器開啟時的樣式：封面網格，或帶描述的列表。搜尋框旁的按鈕仍可臨時切換，離開該介面前有效"
hint_settings_interface-menu-background: "選單在按鈕後面播放的內容。“機器人”是一個真實的競技場：可以代你遊玩一局的那個反應型機器人，會在你停留於選單時閃避即時發射的危險物，被擊中也不會產生任何後果。“形狀”是舊版的旋轉形狀場，也是三者中最耗效能的。“無”什麼都不繪製"
hint_settings_interface-open-menu-on-lose: "失敗的一局會怎樣處理。關：關卡平滑減速停下，倒回到最後到達的檢查點，再平滑加速恢復，不會彈出任何視窗。開：播放停止並開啟結算視窗"
hint_settings_interface-screen-orientation: |-
  <b>橫屏</b>和<b>豎屏</b>鎖定的是<b>軸</b>，而不是某一側。把裝置翻轉過來，畫面也會隨之翻轉，所以正反兩個方向都能遊玩

  <b>自動旋轉</b>不做任何鎖定：螢幕跟隨裝置轉動。如果關卡沒有指定自己的方向，你可以在遊玩中途轉動手機，介面和相機都會隨之調整

  關卡在播放時可以覆蓋這項設定。關卡作者是按特定形狀的畫面來編排內容的，所以在關卡執行期間以作者的選擇為準，離開關卡後設置會恢復

  桌面端的顯示器無法旋轉，因此這個控制元件處於停用狀態，只顯示視窗的形狀。調整視窗大小，它也會隨之變化
hint_settings_interface-show-game-interface: "上面兩項的總開關，同時也控制螢幕上的觸控按鈕。關閉時，遊戲畫面完全不繪製任何內容，適合乾淨的錄屏或截圖。所有功能都不會停止工作：每個控制元件都留在原位，仍然可以按下"
hint_settings_interface-show-game-pause: "是否繪製暫停圖示。它只是隱藏，而不是移除：同一個角落仍然可以按下，而且無論此項如何設定，Escape或手柄的Back鍵都會開啟暫停視窗"
hint_settings_interface-show-game-progress: "是否在遊戲畫面底部繪製本局的進度條。隱藏它不會改變其他任何東西，它標出的檢查點照常生效"
hint_settings_interface-stats-active: "在所有螢幕之上顯示診斷資訊。它用於測量效能，而不是在遊玩時使用"
hint_settings_interface-stats-alignment-x: "診斷資訊在水平方向上的位置：0為左邊緣，1為右邊緣"
hint_settings_interface-stats-alignment-y: "診斷資訊在垂直方向上的位置：0為上邊緣，1為下邊緣"
hint_settings_other: "<b>將設定恢復為預設</b>會把所有標籤頁上的全部設定恢復為預設值。它隻影響設定：你的關卡是磁碟上的檔案，不受影響"
hint_settings_profile: "這臺裝置記下的一切：遊戲被怎樣遊玩過，用它創作了什麼。資料只儲存在本地：這裡的任何內容都不會上傳，其背後的檔案位於關卡旁邊的資料夾中，可以開啟閱讀。時間按真實秒數計算，而不是關卡時間，因此檢查點處的減速與加速、以半速遊玩的一局，都按實際花費的時間計入。裝置一欄統計的是遊玩關卡時四種操作裝置中哪一種在主導化身，而不只是哪一種已連線"
hint_settings_profile-transfer_body: |-
  整個檔案打包成一個zip檔案，也能導回來：關卡、統計、設定、庫及其合集，勾選後還包括編輯器自動儲存和錯誤報告。可用於換裝置，或在重灌前保留一份副本

  <b>替換</b>會清空勾選的部分並放入檔案中的內容。<b>合併</b>會新增缺少的內容，兩邊都有的關卡取較新的副本，統計保留較大的數值

  <color=#E8B04B><b>警告：</b></color>在手機上解除安裝遊戲會刪除整個檔案。請先匯出

  每次匯入前，遊戲會把即將被替換的內容儲存到一個備份中，可以在這裡恢復、另存或刪除

  更多：<link="https://bullethero.space/zh-Hant/docs/game/profile-transfer"><u>轉移檔案</u></link>
hint_settings_profile-transfer_header: "轉移檔案"
hint_settings_suppress-game-saves_body: |-
  開啟時，遊戲不儲存任何自身的資料：<color=#D4B483>settings.json</color>、全域性統計和每個關卡的統計都原樣保留在磁碟上。你更改的設定在關閉遊戲前仍然有效

  你的關卡工作仍照常儲存：儲存、匯出、匯入、複製和刪除關卡，以及編輯器的自動儲存和備份，後者有自己的開關

  它持續到遊戲關閉為止，也不會保留到下次啟動。關閉它會儲存你當前的設定，並丟棄開啟期間遊玩產生的所有資料

  <color=#B48CE0><b>須知：</b></color>它也會自動開啟。啟動引數<color=#D4B483>--suppress-game-saves</color>會在本次啟動期間一直開啟它，遊戲內無法將其關閉。由更新版本的遊戲儲存的設定或統計資料也會開啟它，此時遊戲會在每次啟動時詢問是保留這些資料，還是用預設值覆蓋
hint_settings_suppress-game-saves_header: "匿名模式"
