settings_interface-alert-on-exception_tooltip: "An: Ein nicht abgefangener Fehler öffnet das Berichtsfenster über allem, was gerade auf dem Bildschirm ist. Aus: Er wird nur ins Log geschrieben - der Bericht selbst wird in beiden Fällen erstellt"
settings_interface-menu-background_tooltip: "Was das Hauptmenü hinter seinen Schaltflächen zeichnet. Bot ist eine lebendige Arena, in der der Reflex-Bot spielt, Formen ist ein Feld rotierender Formen, Kein zeichnet nichts"
settings_interface-open-menu-on-lose_tooltip: "Aus: Ein verlorener Lauf spult sich selbst zum letzten erreichten Checkpoint zurück. An: Die Wiedergabe stoppt und stattdessen öffnet sich das Ergebnisfenster"
settings_interface-screen-orientation_tooltip: "Wie das Gerät gehalten wird. Horizontal und Vertikal fixieren eine Achse, nicht eine Seite, deshalb läuft das Spiel weiter, wenn du das Gerät umdrehst. Auf dem Desktop zeigt dies stattdessen die Form des Fensters"
settings_interface-show-game-interface_tooltip: "Der Hauptschalter für die beiden Einstellungen darüber und mit ihnen für die Bildschirmsteuerung"
settings_interface-show-game-pause_tooltip: "Das Pausensymbol in der Ecke des Spielbildschirms. Auch ausgeblendet reagiert es auf einen Druck an derselben Stelle"
settings_interface-show-game-progress_tooltip: "Der Balken am unteren Rand des Spielbildschirms, mit einer Kerbe für jeden Checkpoint, zu dem der Lauf zurückkehren kann"
settings_interface-stats-active_tooltip: "Zeichnet eine Diagnoseanzeige über jeden Bildschirm: Frame-Zeiten, Pufferauslastung pro Frame, Levelgröße und Prozessspeicher. Nie interaktiv - Klicks gehen durch sie hindurch"
settings_interface-stats-alignment-x_tooltip: "0 ist der linke Bildschirmrand, 1 der rechte"
settings_interface-stats-alignment-y_tooltip: "0 ist der untere Bildschirmrand, 1 der obere - dieselbe Konvention, in der Levelinhalte erstellt werden"
settings_interface-stats-alignment_x: "Ausrichtung X"
settings_interface-stats-alignment_y: "Ausrichtung Y"
settings_interface-stats-frame-objects_tooltip: "Fügt den Pufferblock pro Frame hinzu: wie viele Instanzen, Formen, Effekte, Texte und Audiospuren dieser Frame belegt und benötigt hat und wie viel Platz es dafür gab"
settings_interface-stats-level-objects_tooltip: "Fügt die Größe des geladenen Levels hinzu: Objekte nach Typ, Keyframes, Audiospuren und Ressourcen. Sie wird einmal pro Sekunde gezählt und gar nicht, solange dies aus ist"
settings_interface-stats-memory_tooltip: "Fügt den Block zum Prozessspeicher hinzu: den verwalteten Heap und wie viel Unity von seinem reservierten Speicher belegt hat. Beides sind Gesamtwerte des Prozesses, nicht dieses Levels"
settings_interface-stats-profiling_tooltip: "Fügt den Profiling-Block hinzu: wie lange jede Simulationsstufe gedauert hat und wie viele Elemente der UI-Bereich enthält. Nur im Editor und in Development-Builds vorhanden - ein Release-Build enthält überhaupt keine Profiler-Marker"
