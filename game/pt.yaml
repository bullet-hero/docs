settings_graphics-antialiasing-hdr_tooltip: "Renderiza em um alvo HDR. Desativado em todo lugar por padrão: nada que este jogo desenha precisa de valores acima de 1, e o HDR dobra a largura de banda que o antialiasing já multiplica"
settings_graphics-antialiasing-msaa_tooltip: "Quantas amostras por pixel o MSAA usa. Só vale enquanto Tipo é MSAA. Mais é mais limpo e custa mais quanto mais formas transparentes se sobrepõem, já que a mesclagem é resolvida por amostra - x2 é onde um celular deve ficar, x4 é o que um computador aguenta"
settings_graphics-antialiasing-type_tooltip: "Como o serrilhado das bordas é removido. MSAA é o padrão e o que combina com o conteúdo deste jogo - cada forma é geometria real, então ele resolve exatamente o que serrilha sem desfocar mais nada. O FXAA custa uma passada de tela inteira, não importa quanto o nível redesenha, e esse é o único motivo para preferi-lo em um aparelho fraco. Ele borra contornos finos"
