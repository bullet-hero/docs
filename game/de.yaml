editor_publish-rule-detail_resource-forbids-adaptation: "{0} \"{1}\" steht unter der Lizenz {2}, die Änderungen verbietet, und Musik, die mit einem Level synchronisiert ist, gilt als Änderung. Ersetze die Ressource oder trage die Erlaubnis des Rechteinhabers in den Credits ein"
