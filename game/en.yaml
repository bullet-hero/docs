settings_graphics-antialiasing-hdr_tooltip: "Render into an HDR target. Off everywhere by default: nothing this game draws needs values above 1, and HDR doubles the bandwidth anti-aliasing already multiplies"
settings_graphics-antialiasing-msaa_tooltip: "Samples per pixel MSAA takes. Read only while Type is MSAA. Higher is cleaner and costs more the more transparent shapes overlap, since blending resolves per sample - x2 is where a phone should stay, x4 is what a desktop can afford"
settings_graphics-antialiasing-type_tooltip: "How edges are smoothed. MSAA is the default and the one that fits this game's content - every shape is real geometry, so it resolves exactly what aliases without softening anything else. FXAA costs one full-screen pass no matter how much the level overdraws, which is the only reason to prefer it on a weak device. It blurs thin outlines"
settings_graphics-antialiasing_hdr: "HDR"
settings_graphics-antialiasing_msaa: "MSAA Samples"
settings_graphics-antialiasing_type: "Type"
settings_graphics-audio-pitch_correction: "Pitch Correction"
settings_graphics-audio-resync-jump_time: "Resync Jump Time"
settings_graphics-audio-sync-dead_zone: "Sync Dead Zone"
settings_graphics-effects-frame-step_budget: "Frame Step Budget"
settings_graphics-effects-replay-step_budget: "Replay Step Budget"
settings_graphics-render-scale_tooltip: "How many pixels the game renders before scaling to the window. The interface is drawn at full size either way. Multiplies the scale this device class already ships with. Desktop only"
settings_graphics-resolution_tooltip: "Size of the game window in pixels, from the modes this display reports. A resolution taller than it is wide puts the whole interface into its vertical layout. Desktop only"
settings_graphics-textures-compression-quality_tooltip: "How long this device spends compressing an image. The result is the same size in the same format either way - all this trades is loading time against block artefacts on gradients and hard edges. Auto takes the careful encoder for everything except photographs. Ignored on phones, whose encoders take no such setting"
settings_graphics-textures-compression_tooltip: "Pack a level's images into a compressed format as they load. Four to eight times less memory per image, at the cost of block artefacts on gradients and hard edges. Auto compresses on phones, where memory is scarce, and keeps the full image on desktops. Read when a level loads, so it applies to the next one you open"
settings_graphics-textures-filtering_tooltip: "How a level's images are sampled when they are drawn. Auto blends between mip levels when mip-maps are on, which removes the seam where one takes over from the next. Point gives hard-edged texels on everything - it does not change how an image is scaled down, only how it is drawn. Images their author marked as pixel art are always point-sampled"
settings_graphics-textures-mipmaps_tooltip: "Build reduced copies of each image, so one drawn small does not shimmer as it moves. Costs a third more memory. Images their author marked as pixel art never get them"
settings_graphics-textures-size-limit_tooltip: "The largest side an image may occupy in memory on this device. Anything bigger is scaled down as it loads, and the file on disk is never touched. Memory falls with the square of the side, so one step down saves more than compression does. Auto is 2048 on phones and 4096 on desktops"
settings_graphics-textures_compression: "Compression"
settings_graphics-textures_compression-quality: "Compression Quality"
settings_graphics-textures_filtering: "Filtering"
settings_graphics-textures_mipmaps: "Mipmaps"
settings_graphics-textures_size-limit: "Size Limit"
settings_graphics-textures_title: "Textures"
settings_graphics-vsync_tooltip: "Waits for the display's refresh before showing a frame, which removes tearing and costs a frame of latency. While it is on, the framerate cap above does nothing. Desktop only"
settings_graphics-window-mode_tooltip: "How the window occupies the display. Windowed lets you resize it freely, which also changes the shape the interface lays itself out for. Desktop only"
