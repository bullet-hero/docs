level_resources_texture-alpha_tooltip: "この画像の透明度についての申告です。「不透明」はアルファチャンネルを使わないという意味で、画像はアルファなしで再パックされます。ピクセルは同じまま、より速く、不透明のレンダリング経路で描画されます。この申告は検証されません。実際にフェードする画像ではフェードが平らに潰れ、それは下の報告行に表れます"
