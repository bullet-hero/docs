settings_interface-alert-on-exception_tooltip: "Ativado, um erro não tratado abre a janela de relatório por cima do que estiver na tela. Desativado, ele só é gravado no log - o relatório é montado de qualquer forma"
settings_interface-menu-background_tooltip: "O que o menu principal desenha atrás dos botões. Bot é uma arena ao vivo em que o bot reflex joga, Formas é um campo de formas girando, Nenhum não desenha nada"
settings_interface-open-menu-on-lose_tooltip: "Desativado, uma partida perdida volta sozinha para o último checkpoint alcançado. Ativado, a reprodução para e a janela de resultado abre no lugar"
settings_interface-screen-orientation_tooltip: "Como o dispositivo é segurado. Horizontal e Vertical travam um eixo, não um lado, então virar o dispositivo ao contrário não interrompe o jogo. No computador, isto mostra o formato da janela"
settings_interface-show-game-interface_tooltip: "O interruptor geral das duas opções acima e, junto com elas, dos controles na tela"
settings_interface-show-game-pause_tooltip: "O ícone de pausa no canto da tela do jogo. Oculto, ele ainda aceita um toque no mesmo lugar"
settings_interface-show-game-progress_tooltip: "A barra na parte de baixo da tela do jogo, com uma marca em cada checkpoint ao qual a partida pode voltar"
settings_interface-stats-active_tooltip: "Desenha um painel de diagnóstico sobre todas as telas: tempos do quadro, uso de buffers por quadro, tamanho do nível e memória do processo. Nunca é interativo - os cliques passam através dele"
settings_interface-stats-alignment-x_tooltip: "0 é a borda esquerda da tela, 1 a direita"
settings_interface-stats-alignment-y_tooltip: "0 é a borda inferior da tela, 1 a superior - a mesma convenção em que o conteúdo do nível é criado"
settings_interface-stats-alignment_x: "Alinhamento X"
settings_interface-stats-alignment_y: "Alinhamento Y"
settings_interface-stats-frame-objects_tooltip: "Adiciona o bloco de buffers do quadro: quantas instâncias, formas, efeitos, textos e faixas de áudio este quadro usou, quantas precisou e para quantas havia espaço"
settings_interface-stats-level-objects_tooltip: "Adiciona o tamanho do próprio nível carregado: objetos por tipo, quadros-chave, faixas de áudio e recursos. É contado uma vez por segundo, e não é contado de forma alguma enquanto isto está desativado"
settings_interface-stats-memory_tooltip: "Adiciona o bloco de memória do processo: o heap gerenciado e quanto a Unity alocou do que reservou. Os dois são totais do próprio processo, não deste nível"
settings_interface-stats-profiling_tooltip: "Adiciona o bloco de profiling: quanto tempo cada etapa da simulação levou e quantos elementos o painel da interface contém. Existe só no Editor e em builds de desenvolvimento - um build de release não tem nenhum marcador de profiler"
