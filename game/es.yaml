graph_prefab_too_deep: "Anidamiento de prefabs demasiado profundo"
graph_rule_none: "Regla no definida"
graph_unresolved_reference: "Referencia sin resolver"
hint_editor-settings_artist-permission_body: |-
  Todo recurso externo de un nivel - música, imágenes, fuentes, textos - necesita una licencia al menos tan libre como <color=#D4B483>CC BY-NC</color>, o el permiso del titular de los derechos para la redistribución pública no comercial

  <color=#E86A5A><b>Precaución:</b></color> un "claro, adelante" en privado no basta. El permiso tiene que cubrir la redistribución pública, no solo tu uso personal

  Mientras el nivel se quede en tu dispositivo no se comprueba nada - solo cuando se ofrece a un servicio

  Más: <link="https://bullethero.space/es/docs/editor/rights/legal-resource-paths"><color=#59A6FF>Dos formas de que un recurso sea válido</color></link>, <link="https://bullethero.space/es/docs/editor/rights/asking-permission"><color=#59A6FF>Pedir permiso a un autor</color></link>
hint_editor-settings_artist-permission_header: "Usar el trabajo de otros"
hint_editor-settings_community: "Los enlaces propios del proyecto - se abren en tu navegador. Cuáles aparecen depende del origen de esta versión, así que la versión de una tienda puede mostrar menos que esta"
hint_editor-settings_create-level_body: |-
  Un <b>preset</b> decide con qué empieza el nivel nuevo - vacío, o con una pequeña estructura que si no tendrías que montar a mano cada vez

  <color=#E86A5A><b>Precaución:</b></color> los <b>parámetros</b> fijan lo que cuesta cambiar después: la duración en fotogramas y la frecuencia de fotogramas

  <color=#5EC8C8><b>Consejo:</b></color> los dos desplegables de formato de archivo eligen cómo se escriben en disco el nivel y sus metadatos. Los dos se pueden cambiar después desde la "Zona de peligro" del nivel

  Más: <link="https://bullethero.space/es/docs/editor/basics/first-level"><color=#59A6FF>Tu primer nivel: la ruta</color></link>
hint_editor-settings_create-level_header: "Crear un nivel"
hint_editor-settings_library_body: |-
  Todo lo que hay en este dispositivo y puedes llevar a un nivel: tu propia biblioteca, tus colecciones y las colecciones a las que te suscribiste en el Workshop. La columna estrecha elige el tipo, los botones sobre la lista eligen el origen

  Una <b>colección</b> es una carpeta de recursos de cualquier tipo, con nombre, autores y licencia. Crea una aquí, llénala con <b>Copiar</b> desde las páginas de cada tipo, expórtala como archivo comprimido o publícala

  <color=#5EC8C8><b>Consejo:</b></color> una colección del Workshop es de solo lectura. Copia sus entradas a una colección tuya para cambiarlas

  Más: <link="https://bullethero.space/es/docs/editor/reference/library-and-collections"><color=#59A6FF>Biblioteca y colecciones</color></link>
hint_editor-settings_library_header: "Biblioteca"
hint_editor-settings_open-level: "Niveles encontrados en este dispositivo. Un nivel es una carpeta - ponla junto a las demás y aparecerá aquí"
hint_editor_beat-segment_body: |-
  Una parte de tempo constante: BPM, desplazamiento de fase en fotogramas fraccionarios, pulsos por compás, un nombre y un color. Solo se muestra un segmento aunque haya varios seleccionados

  <color=#E86A5A><b>Precaución:</b></color> un segmento se identifica por su fotograma inicial, así que <b>moverlo cambia su identidad</b>. Después de moverlo, vuelve a seleccionarlo en su nuevo inicio

  <color=#5EC8C8><b>Consejo:</b></color> aquí los toques recalculan la fase del segmento seleccionado en lugar de crear uno nuevo

  Más: <link="https://bullethero.space/es/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>Ritmo y estructura</color></link>
hint_editor_beat-segment_header: "Segmento de pulso"
hint_editor_beat-window_body: |-
  Metadatos de autoría - <b>la reproducción no los lee</b>. Te permiten colocar el contenido sobre la música, y los generadores actúan sobre los mismos pulsos que ves

  La cuadrícula es una lista de <b>segmentos de pulso</b>, cada uno una parte de tempo constante. Los huecos entre ellos no son un problema: una intro sin percusión, una pausa, la cola tras la canción

  <color=#5EC8C8><b>Consejo:</b></color> pulsa <b>TOCAR</b> al ritmo de la pista, y luego <b>Crear con toques</b> convierte los toques en un segmento del primero al último

  Más: <link="https://bullethero.space/es/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>Ritmo y estructura</color></link>
hint_editor_beat-window_header: "Cuadrícula de pulsos"
hint_editor_clipboard_body: |-
  Un búfer por línea de tiempo, cada uno con su propia línea de estado

  <b>Copiar a texto</b> escribe todos los búferes en el portapapeles del sistema como texto, así una selección puede viajar a otro nivel o a otro equipo. <b>Pegar desde texto</b> lo vuelve a leer en los búferes - y <b>ahí se detiene</b>

  <color=#B48CE0><b>Conviene saber:</b></color> nada llega al nivel hasta que pegas en la línea de tiempo que tú elijas. Dónde cae depende del cabezal y del ámbito activo

  Más: <link="https://bullethero.space/es/docs/editor/workflow/reuse"><color=#59A6FF>Reutilización: prefabs, copia, generadores</color></link>
hint_editor_clipboard_header: "Portapapeles"
hint_editor_console: "Todo lo que el editor ha registrado en esta sesión - informes de carga de niveles, resultados de generadores, advertencias de importación. <b>Clear</b> lo vacía. El engranaje filtra qué niveles de gravedad se muestran"
hint_editor_curve-editor: "Edita una curva arrastrando sus puntos. Los cambios se aplican <b>en vivo</b> mientras arrastras, así que lo que ves ya es lo que guarda el nivel - cerrar la ventana los conserva"
hint_editor_generators_body: |-
  Contenido procedural, aplicado al nivel como una sola operación que se puede deshacer

  <color=#B48CE0><b>Conviene saber:</b></color> hay dos familias. Los <b>generadores</b> (<i>gen_</i>) crean contenido - oleadas de balas, patrones radiales y la caché de fuentes. Los <b>modificadores</b> (<i>mod_</i>) reescriben lo que ya existe - encajar tramos, cuantizar fotogramas clave

  <color=#E86A5A><b>Precaución:</b></color> todo lo que reescribe o elimina contenido existente pide confirmación antes

  Más: <link="https://bullethero.space/es/docs/editor/workflow/reuse"><color=#59A6FF>Reutilización: prefabs, copia, generadores</color></link>
hint_editor_generators_header: "Generadores"
hint_editor_gradient-editor: "Edita un degradado arrastrando sus paradas de color. Como en el editor de curvas, los cambios se aplican <b>en vivo</b> y no al confirmar"
hint_editor_hierarchy_body: |-
  Todos los objetos vivos en el <b>fotograma actual</b>, anidados por padre. La lista cambia al arrastrar el cabezal - una jerarquía vacía suele significar que el cabezal está más allá del final de tu contenido

  Arrastra una fila sobre otra para que pase a ser hija de ese objeto. Las capas se suman a lo largo de la cadena, así que cambiar el padre también mueve el objeto en el orden de dibujo y vuelve a generar sus valores aleatorios

  <color=#5EC8C8><b>Consejo:</b></color> haz clic derecho en una fila para ver sus acciones. En pantalla táctil, mantén pulsada la fila

  Más: <link="https://bullethero.space/es/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Cómo piensa el editor</color></link>
hint_editor_hierarchy_header: "Jerarquía"
hint_editor_inspector-audio_body: |-
  El clip de la pista de audio seleccionada, su velocidad, el volumen del fader y su cadena de efectos de audio: paso bajo, paso alto, eco, reverberación, chorus, cambio de tono, distorsión, flanger, compresor, normalizar y EQ paramétrico

  La velocidad y el volumen son deslizadores y no simples campos numéricos, para que su rango válido quede a la vista

  <color=#E86A5A><b>Precaución:</b></color> <b>aquí el volumen es el fader.</b> El volumen con fotogramas clave es otra pista en la línea de tiempo local, y los dos se multiplican al reproducir

  Más: <link="https://bullethero.space/es/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar la pista de audio</color></link>
hint_editor_inspector-audio_chorus-delay: "Retardo base de las copias, en ms - lo bastante corto como para oírse como cuerpo y no como eco"
hint_editor_inspector-audio_chorus-depth: "Cuánto oscila el retardo - Rate fija la velocidad de la oscilación, y este campo su amplitud"
hint_editor_inspector-audio_chorus-dry-mix: "Nivel de la señal sin procesar"
hint_editor_inspector-audio_chorus-feedback: "Cuánta salida vuelve a entrar en el efecto, llevándolo hacia el terreno del flanger"
hint_editor_inspector-audio_chorus-rate: "Con qué rapidez se modula el retardo, en Hz"
hint_editor_inspector-audio_chorus-wet-mix-tap-1: "Nivel de la primera copia retardada"
hint_editor_inspector-audio_chorus-wet-mix-tap-2: "Nivel de la segunda copia - las copias están separadas en el tiempo, así que su equilibrio decide lo ancho que suena el chorus"
hint_editor_inspector-audio_chorus-wet-mix-tap-3: "Nivel de la tercera copia"
hint_editor_inspector-audio_chorus_body: |-
  Superpone a la señal tres copias ligeramente retardadas con un tono que oscila, y una sola fuente suena como varias. <color=#D4B483>Rate</color> es la velocidad de la oscilación, <color=#D4B483>Depth</color> su amplitud. Sube <color=#D4B483>Feedback</color> y se convierte en <link="hint_editor_inspector-audio_flange"><color=#59A6FF>Flanger</color></link>

  <color=#B48CE0><b>Conviene saber:</b></color> al <b>restablecer</b>, <b>Mix Level</b> también vuelve a su nivel predeterminado de -80 dB, así que el efecto se apaga

  Más: <link="https://bullethero.space/es/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar la pista de audio</color></link>
hint_editor_inspector-audio_chorus_header: "Chorus"
hint_editor_inspector-audio_compressor-attack: "Con qué rapidez aprieta tras un pico, en ms - demasiado rápido se come los transitorios"
hint_editor_inspector-audio_compressor-make-up-gain: "Ganancia en dB que se devuelve tras la compresión, para recuperar el nivel que quitó"
hint_editor_inspector-audio_compressor-release: "Con qué rapidez suelta después, en ms - demasiado rápido produce un bombeo audible"
hint_editor_inspector-audio_compressor-threshold: "Nivel en dB por encima del cual empieza a actuar la compresión"
hint_editor_inspector-audio_compressor_body: |-
  Baja las partes fuertes para que las suaves puedan quedar más arriba - el remedio habitual para una canción que desaparece tras sus propios efectos. <color=#D4B483>Threshold</color> es donde empieza, <color=#D4B483>Attack</color> y <color=#D4B483>Release</color> la rapidez con que aprieta y suelta, <color=#D4B483>Make Up Gain</color> devuelve el nivel

  <color=#B48CE0><b>Conviene saber:</b></color> al <b>restablecer</b>, <b>Mix Level</b> también vuelve a su nivel predeterminado de -80 dB, así que el efecto se apaga

  Más: <link="https://bullethero.space/es/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar la pista de audio</color></link>
hint_editor_inspector-audio_compressor_header: "Compresor"
hint_editor_inspector-audio_distortion-level: "Con qué fuerza se recorta la señal"
hint_editor_inspector-audio_distortion_body: |-
  Recorta la forma de onda y llena el sonido de armónicos - áspero y saturado. Un solo control, <color=#D4B483>Level</color>, decide cuánto muerde. También aplana la dinámica, así que la pista pierde sus momentos tranquilos

  <color=#B48CE0><b>Conviene saber:</b></color> al <b>restablecer</b>, <b>Mix Level</b> también vuelve a su nivel predeterminado de -80 dB, así que el efecto se apaga

  Más: <link="https://bullethero.space/es/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar la pista de audio</color></link>
hint_editor_inspector-audio_distortion_header: "Distorsión"
hint_editor_inspector-audio_echo-decay: "Cuánto de cada repetición pasa a la siguiente - con valores altos resuena más tiempo"
hint_editor_inspector-audio_echo-delay: "Milisegundos entre repeticiones - átalos al tempo de la canción para que los ecos caigan en el pulso"
hint_editor_inspector-audio_echo-dry-mix: "Nivel de la señal sin procesar en la salida"
hint_editor_inspector-audio_echo-max-channels: "Límite de canales para el búfer del eco"
hint_editor_inspector-audio_echo-wet-mix: "Nivel de la señal con eco - se equilibra con Dry Mix, aparte de Mix Level"
hint_editor_inspector-audio_echo_body: |-
  Repite la señal a intervalos fijos, cada repetición más baja que la anterior - copias separadas, no la sala de <link="hint_editor_inspector-audio_reverb"><color=#59A6FF>Reverberación</color></link>. <color=#D4B483>Delay</color> es el intervalo en milisegundos, <color=#D4B483>Decay</color> cuánto de cada copia pasa a la siguiente

  <color=#B48CE0><b>Conviene saber:</b></color> al <b>restablecer</b>, <b>Mix Level</b> también vuelve a su nivel predeterminado de -80 dB, así que el efecto se apaga

  Más: <link="https://bullethero.space/es/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar la pista de audio</color></link>
hint_editor_inspector-audio_echo_header: "Eco"
hint_editor_inspector-audio_enabled: "Si este efecto está en la cadena. No tiene un indicador propio - al marcarlo, Mix Level sube del suelo de -80 dB, y al desmarcarlo vuelve allí y se conserva el nivel que habías puesto"
hint_editor_inspector-audio_flange-depth: "Cuánto oscila el retardo"
hint_editor_inspector-audio_flange-dry-mix: "Nivel de la señal sin procesar"
hint_editor_inspector-audio_flange-rate: "Con qué rapidez se repite el barrido, en Hz"
hint_editor_inspector-audio_flange-wet-mix: "Nivel de la copia en barrido - el efecto es la cancelación entre las dos"
hint_editor_inspector-audio_flange_body: |-
  Mezcla la señal con un retardo de sí misma muy corto y en barrido - el silbido de un motor a reacción. Como <link="hint_editor_inspector-audio_chorus"><color=#59A6FF>Chorus</color></link>, pero con una sola copia, así que oyes un barrido y no anchura. El silbido es más profundo cuando <color=#D4B483>Dry Mix</color> y <color=#D4B483>Wet Mix</color> están cerca

  <color=#B48CE0><b>Conviene saber:</b></color> al <b>restablecer</b>, <b>Mix Level</b> también vuelve a su nivel predeterminado de -80 dB, así que el efecto se apaga

  Más: <link="https://bullethero.space/es/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar la pista de audio</color></link>
hint_editor_inspector-audio_flange_header: "Flanger"
hint_editor_inspector-audio_header: "Inspector de pista de audio"
hint_editor_inspector-audio_highpass-cutoff-freq: "Frecuencia en Hz por debajo de la cual la pista se atenúa - en el mínimo el filtro es prácticamente transparente"
hint_editor_inspector-audio_highpass_body: |-
  El reflejo de <link="hint_editor_inspector-audio_lowpass"><color=#59A6FF>Paso bajo</color></link>: deja pasar los agudos y corta todo lo que está por debajo de <color=#D4B483>Cutoff Freq</color>. Sube el corte y la pista se adelgaza hasta sonar como un altavoz diminuto

  <color=#5EC8C8><b>Consejo:</b></color> la cadena pertenece a la <b>pista</b> y no admite fotogramas clave. Para un cambio a mitad de canción, corta la pista y configura las dos mitades por separado

  <color=#B48CE0><b>Conviene saber:</b></color> al <b>restablecer</b>, <b>Mix Level</b> también vuelve a su nivel predeterminado de -80 dB, así que el efecto se apaga

  Más: <link="https://bullethero.space/es/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar la pista de audio</color></link>
hint_editor_inspector-audio_highpass_header: "Paso alto"
hint_editor_inspector-audio_lowpass-cutoff-freq: "Frecuencia en Hz por encima de la cual la pista se atenúa - en el máximo el filtro es prácticamente transparente"
hint_editor_inspector-audio_lowpass_body: |-
  Deja pasar los graves y corta todo lo que está por encima de <color=#D4B483>Cutoff Freq</color> - el sonido bajo el agua o tras una pared. En lo alto del rango el filtro es prácticamente transparente

  <color=#5EC8C8><b>Consejo:</b></color> la cadena pertenece a la <b>pista</b> y no admite fotogramas clave. Para un cambio a mitad de canción, corta la pista y configura las dos mitades por separado

  <color=#B48CE0><b>Conviene saber:</b></color> al <b>restablecer</b>, <b>Mix Level</b> también vuelve a su nivel predeterminado de -80 dB, así que el efecto se apaga

  Más: <link="https://bullethero.space/es/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar la pista de audio</color></link>
hint_editor_inspector-audio_lowpass_header: "Paso bajo"
hint_editor_inspector-audio_mix-level: "Nivel en dB con el que la señal procesada se vuelve a mezclar. A -80 el efecto calla, y así es como se guarda \"desactivado\" - en el archivo no hay un interruptor aparte"
hint_editor_inspector-audio_normalize-fade-in-time: "Milisegundos que tarda la ganancia en asentarse, para que la corrección no se oiga como un salto"
hint_editor_inspector-audio_normalize-lowest-volume: "Las señales más bajas que esto no se tocan - así el silencio y el ruido de fondo no se amplifican hasta convertirse en siseo"
hint_editor_inspector-audio_normalize-maximum-amp: "Límite de la ganancia que se puede aplicar"
hint_editor_inspector-audio_normalize_body: |-
  Lleva la señal hacia una sonoridad objetivo, para que clips de distintas fuentes queden a un nivel comparable. Actúa sobre el nivel general, la dinámica dentro de una pista es cosa de <link="hint_editor_inspector-audio_compressor"><color=#59A6FF>Compresor</color></link>. <color=#D4B483>Lowest Volume</color> evita que convierta el silencio en siseo, <color=#D4B483>Maximum Amp</color> limita el refuerzo

  <color=#B48CE0><b>Conviene saber:</b></color> al <b>restablecer</b>, <b>Mix Level</b> también vuelve a su nivel predeterminado de -80 dB, así que el efecto se apaga

  Más: <link="https://bullethero.space/es/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar la pista de audio</color></link>
hint_editor_inspector-audio_normalize_header: "Normalizar"
hint_editor_inspector-audio_param-eq-center-freq: "Frecuencia en Hz en la que se centra la banda"
hint_editor_inspector-audio_param-eq-frequency-gain: "Ganancia aplicada dentro de la banda - por debajo de 1 recorta, por encima de 1 realza"
hint_editor_inspector-audio_param-eq-octave-range: "Ancho de la banda en octavas - estrecha para correcciones quirúrgicas, ancha para dar forma al timbre"
hint_editor_inspector-audio_param-eq_body: |-
  Una banda paramétrica que realza o recorta una zona elegida del espectro. A diferencia de <link="hint_editor_inspector-audio_lowpass"><color=#59A6FF>Paso bajo</color></link> y <link="hint_editor_inspector-audio_highpass"><color=#59A6FF>Paso alto</color></link>, también puede añadir nivel. <color=#D4B483>Center Freq</color> es dónde está la banda, <color=#D4B483>Octave Range</color> su ancho, <color=#D4B483>Frequency Gain</color> por debajo de 1 recorta y por encima de 1 realza

  <color=#B48CE0><b>Conviene saber:</b></color> al <b>restablecer</b>, <b>Mix Level</b> también vuelve a su nivel predeterminado de -80 dB, así que el efecto se apaga

  Más: <link="https://bullethero.space/es/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar la pista de audio</color></link>
hint_editor_inspector-audio_param-eq_header: "EQ paramétrico"
hint_editor_inspector-audio_pitch-shifter-fft-size: "Tamaño de la ventana de análisis - el control de calidad frente a latencia del algoritmo"
hint_editor_inspector-audio_pitch-shifter-max-channels: "Límite de canales para el procesado"
hint_editor_inspector-audio_pitch-shifter-overlap: "Cuánto se solapan las ventanas consecutivas - más solapamiento suaviza los artefactos, a cambio de coste"
hint_editor_inspector-audio_pitch-shifter-pitch: "Multiplicador de tono - 1 lo deja igual, 2 lo sube una octava"
hint_editor_inspector-audio_pitch-shifter_body: |-
  Cambia el tono sin cambiar la velocidad, así que la sincronía con la canción se mantiene. <color=#D4B483>Pitch</color> es un multiplicador: 1 lo deja igual, 2 lo sube una octava. <color=#D4B483>FFT Size</color> y <color=#D4B483>Overlap</color> equilibran calidad y coste

  <color=#5EC8C8><b>Consejo:</b></color> la cadena pertenece a la <b>pista</b> y no admite fotogramas clave. Para un cambio a mitad de canción, corta la pista y configura las dos mitades por separado

  <color=#B48CE0><b>Conviene saber:</b></color> al <b>restablecer</b>, <b>Mix Level</b> también vuelve a su nivel predeterminado de -80 dB, así que el efecto se apaga

  Más: <link="https://bullethero.space/es/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar la pista de audio</color></link>
hint_editor_inspector-audio_pitch-shifter_header: "Cambio de tono"
hint_editor_inspector-audio_reverb-decay-hf-ratio: "Cuánto más rápido decaen los agudos que los graves - por debajo de 1 la cola se oscurece al apagarse"
hint_editor_inspector-audio_reverb-decay-time: "Segundos que tarda la cola en apagarse - el indicio más claro del tamaño de la sala"
hint_editor_inspector-audio_reverb-density: "Densidad modal del espacio simulado"
hint_editor_inspector-audio_reverb-diffusion: "Densidad de ecos a lo largo del tiempo - con valores bajos la cola suena granulada y metálica"
hint_editor_inspector-audio_reverb-dry-level: "Nivel de la señal sin procesar en la salida"
hint_editor_inspector-audio_reverb-hf-reference: "Frecuencia a la que se miden Room HF y Decay HF Ratio"
hint_editor_inspector-audio_reverb-lf-reference: "Frecuencia a la que se mide Room LF"
hint_editor_inspector-audio_reverb-reflect-delay: "Retardo antes de que lleguen esas reflexiones - a qué distancia están las paredes"
hint_editor_inspector-audio_reverb-reflections: "Nivel de las reflexiones tempranas - los primeros rebotes nítidos en las paredes cercanas"
hint_editor_inspector-audio_reverb-reverb: "Nivel de la cola tardía y difusa, frente a las reflexiones tempranas"
hint_editor_inspector-audio_reverb-reverb-delay: "Retardo antes de que entre esa cola"
hint_editor_inspector-audio_reverb-room: "Nivel general de la señal reverberada - cuánto se nota la sala"
hint_editor_inspector-audio_reverb-room-hf: "Nivel de la sala en altas frecuencias - recortarlo suena a paredes blandas y absorbentes"
hint_editor_inspector-audio_reverb-room-lf: "Nivel de la sala en bajas frecuencias"
hint_editor_inspector-audio_reverb_body: |-
  Pone la pista en una sala: reflexiones tempranas y luego una cola que se apaga. Empieza por tres campos: <color=#D4B483>Decay Time</color> es el tamaño de la sala, <color=#D4B483>Room</color> cuánto se oye, <color=#D4B483>Room HF</color> bajo hace que las paredes suenen blandas

  <color=#B48CE0><b>Conviene saber:</b></color> al <b>restablecer</b>, <b>Mix Level</b> también vuelve a su nivel predeterminado de -80 dB, así que el efecto se apaga

  Más: <link="https://bullethero.space/es/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar la pista de audio</color></link>
hint_editor_inspector-audio_reverb_header: "Reverberación"
hint_editor_inspector-effect_angle-a: "El ángulo, en grados. En las variantes Aleatorio es un extremo del rango del que cada partícula saca su valor"
hint_editor_inspector-effect_angle-b: "El otro extremo del rango del que cada partícula saca su ángulo"
hint_editor_inspector-effect_angle-curve: "La curva de la que se lee el ángulo - según el tiempo de vida de la propia partícula en Durante la vida, según su velocidad en Por velocidad"
hint_editor_inspector-effect_angle-speed-range: "Ventana de velocidades a la que se reasigna la curva - la velocidad que cuenta como su inicio y la que cuenta como su final"
hint_editor_inspector-effect_angle-type: "Cuál de las cinco variantes de rotación es esta. Cambiarla sustituye el subobjeto entero, así que las filas de abajo son de la nueva variante"
hint_editor_inspector-effect_angle_body: |-
  Cómo gira una partícula a lo largo de su vida, en una de cinco variantes: un <color=#D4B483>Valor</color> fijo, dos <color=#D4B483>Curvas</color> o dos rangos <color=#D4B483>Aleatorio</color> que se sortean por partícula

  <color=#D4B483>Durante la vida</color> lee la curva a lo largo del tiempo de vida de la partícula, <color=#D4B483>Por velocidad</color> según su velocidad, a través de la ventana de velocidades de abajo

  <b>Restablecer</b>, junto a este botón, también restablece <color=#D4B483>Tipo</color>, y con él se van la curva o el par aleatorio

  Más: <link="https://bullethero.space/es/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Legibilidad</color></link>
hint_editor_inspector-effect_angle_header: "Ángulo"
hint_editor_inspector-effect_body: |-
  Los parámetros de un efecto de <color=#D4B483>VFX Graph</color>, por grupos: configuración, principal, fuerzas, forma, ángulo, escala y color. Todos los grupos se ven a la vez, no de uno en uno

  <color=#B48CE0><b>Conviene saber:</b></color> los efectos <b>toman su semilla igual que todo lo demás</b> - de números que editas y no del estado de un generador - así que el mismo nivel se reproduce idéntico en cualquier dispositivo

  <color=#5EC8C8><b>Consejo:</b></color> los colores pueden hacer referencia al tema del nivel en lugar de guardar un valor literal, y los tipos de degradado abren el editor de degradados compartido

  Más: <link="https://bullethero.space/es/docs/editor/performance/level-budget"><color=#59A6FF>El presupuesto del nivel</color></link>
hint_editor_inspector-effect_color-a: "El color de la partícula. En las variantes Aleatorio es un extremo del rango del que cada partícula saca su valor"
hint_editor_inspector-effect_color-b: "El otro extremo del rango del que cada partícula saca su color"
hint_editor_inspector-effect_color-gradient: "El degradado del que se lee el tinte - a lo largo del tiempo de vida de la partícula, según su velocidad o un color por partícula, según la variante"
hint_editor_inspector-effect_color-speed-range: "Ventana de velocidades a la que se reasigna el degradado - la velocidad que cuenta como su inicio y la que cuenta como su final"
hint_editor_inspector-effect_color-type: "Cuál de las seis variantes de tinte es esta. Cambiarla sustituye el subobjeto entero, así que las filas de abajo son de la nueva variante"
hint_editor_inspector-effect_color_body: |-
  Cómo se tiñe una partícula a lo largo de su vida, en una de seis variantes: las cinco de <link="hint_editor_inspector-effect_angle"><color=#59A6FF>Ángulo</color></link> y <link="hint_editor_inspector-effect_scale"><color=#59A6FF>Escala</color></link> con degradados en lugar de curvas, más la variante <color=#D4B483>Degradado aleatorio</color>, que elige un color por partícula

  <color=#5EC8C8><b>Consejo:</b></color> aquí un color puede ser una referencia al tema, así el efecto sigue a un nivel que cambia de paleta a mitad de camino

  <b>Restablecer</b>, junto a este botón, también restablece <color=#D4B483>Tipo</color>, y con él se van el degradado o el par de colores

  Más: <link="https://bullethero.space/es/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>Color y temas</color></link>
hint_editor_inspector-effect_color_header: "Color"
hint_editor_inspector-effect_config-has-stop-frame: "Si se tiene en cuenta el fotograma de parada. Desactivado, el emisor sigue generando partículas mientras viva su objeto"
hint_editor_inspector-effect_config-stop-frame: "Fotograma en el que se detiene la emisión, contado desde el inicio del tramo del propio objeto y no desde el tiempo del nivel. Las partículas ya vivas terminan su tiempo de vida"
hint_editor_inspector-effect_config_body: |-
  Cuándo deja de generar partículas el emisor. Desactivado, genera mientras viva el objeto, que es el caso habitual

  <color=#D4B483>Fotograma de parada</color> cuenta desde el inicio del tramo del propio objeto, no desde la línea de tiempo del nivel. Las partículas ya vivas terminan su tiempo de vida, así que la imagen se desvanece en lugar de cortarse

  <b>Restablecer</b>, junto a este botón, devuelve los dos campos a los valores predeterminados de los desarrolladores en un solo paso de deshacer

  Más: <link="https://bullethero.space/es/docs/editor/performance/level-budget"><color=#59A6FF>Lo que un nivel puede permitirse</color></link>
hint_editor_inspector-effect_config_header: "Configuración"
hint_editor_inspector-effect_core-lifetime-bounds: "Segundos mínimos y máximos que vive una partícula, sorteados por partícula - la dispersión es lo que evita que una ráfaga muera de golpe. Su media también multiplica el tamaño del lote de un efecto sin bucle"
hint_editor_inspector-effect_core-loop: "Si el sistema emite de forma continua, en lugar de un solo lote que nunca se repone. Desactivado, pasados los límites del tiempo de vida no queda nada que dibujar"
hint_editor_inspector-effect_core-particle-count: "Partículas emitidas por segundo - el control principal del coste. Las vivas a la vez son este valor por el tiempo de vida medio, en los dos modos: con bucle se generan a este ritmo, sin bucle sale todo ese producto de una sola ráfaga. El techo es la capacidad propia del grafo, y un sistema se procesa sobre esa capacidad cada fotograma, existan o no las partículas"
hint_editor_inspector-effect_core-particle-pivot: "Punto de la partícula que se coloca en su posición y alrededor del cual gira - el equivalente por partícula del pivote propio de un objeto"
hint_editor_inspector-effect_core-render: "Si las partículas se dibujan. Desactivado, el sistema sigue simulando, lo que sirve cuando solo importan sus efectos secundarios"
hint_editor_inspector-effect_core-shape-id: "Geometría con la que se dibuja cada partícula, del mismo conjunto de formas del que dibuja un objeto. Con Ninguno no se dibuja nada - el quad es un valor normal y es el predeterminado de este campo"
hint_editor_inspector-effect_core-texture-id: "Imagen que dibuja cada partícula, del mismo conjunto de recursos del que dibuja un objeto. Ninguno deja la partícula sin pintar, que es el valor predeterminado de este campo"
hint_editor_inspector-effect_core_body: |-
  Cuántas partículas existen, cuánto viven y con qué se dibujan. Cómo se mueven es <link="hint_editor_inspector-effect_forces"><color=#59A6FF>Fuerzas</color></link>

  <color=#D4B483>Cantidad de partículas</color> es el control principal del coste: un emisor cuesta más o menos la cantidad por <color=#D4B483>Límites del tiempo de vida</color>. <color=#D4B483>Forma</color> y <color=#D4B483>Textura</color> pueden quedar vacías - una partícula sin textura es el caso barato

  <color=#E8B04B><b>Advertencia:</b></color> la cantidad tiene un tope de 1024, y el grafo paga cada fotograma por toda su capacidad, no solo por las partículas vivas. Pide tantas como necesites

  Más: <link="https://bullethero.space/es/docs/editor/performance/level-budget"><color=#59A6FF>Lo que un nivel puede permitirse</color></link>
hint_editor_inspector-effect_core_header: "Principal"
hint_editor_inspector-effect_forces-linear-force: "Aceleración constante y no velocidad, así que su efecto se acumula a lo largo de la vida de la partícula en lugar de mantenerse plano"
hint_editor_inspector-effect_forces-linear-velocity: "Deriva constante que se suma cada fotograma a la velocidad con la que nació la partícula - viento, no un empujón"
hint_editor_inspector-effect_forces-orbital-center-offset: "Dónde está ese centro de órbita respecto al emisor. Desplazarlo hace que el remolino quede descompensado"
hint_editor_inspector-effect_forces-orbital-velocity: "Rotación de las partículas alrededor de un centro y no sobre sí mismas. En una escena 2D lo que importa es la componente Z"
hint_editor_inspector-effect_forces-start-angular-velocity-max: "Límite superior del giro inicial sorteado"
hint_editor_inspector-effect_forces-start-angular-velocity-min: "Límite inferior del giro inicial sorteado, en grados por segundo"
hint_editor_inspector-effect_forces-start-gravity-max: "Límite superior de la gravedad sorteada por partícula"
hint_editor_inspector-effect_forces-start-gravity-min: "Límite inferior de la gravedad sorteada por partícula. Con valores negativos flotan hacia arriba"
hint_editor_inspector-effect_forces-start-velocity-max: "Límite superior de la velocidad inicial sorteada. Separar estos dos valores es lo que convierte una ráfaga limpia en un abanico"
hint_editor_inspector-effect_forces-start-velocity-min: "Límite inferior de la velocidad inicial sorteada, por eje"
hint_editor_inspector-effect_forces-velocity-speed: "Multiplicador de toda la velocidad de la partícula - un solo control para frenar o acelerar un efecto terminado sin volver a configurar cada campo de arriba"
hint_editor_inspector-effect_forces_body: |-
  Todo lo que mueve una partícula después de nacer. Dónde empieza es <link="hint_editor_inspector-effect_shape"><color=#59A6FF>Forma</color></link>

  Los pares de valores <color=#D4B483>iniciales</color> se sortean una vez al nacer, por partícula. Todo lo demás actúa de forma continua durante toda la vida de la partícula, y <color=#D4B483>Fuerza lineal</color> es una aceleración, así que se acumula

  <color=#5EC8C8><b>Consejo:</b></color> <color=#D4B483>Velocidad de movimiento</color> multiplica todo el resultado, así que un efecto terminado se puede frenar o acelerar sin volver a configurar el resto

  Más: <link="https://bullethero.space/es/docs/editor/craft/composition-and-camera"><color=#59A6FF>Composición</color></link>
hint_editor_inspector-effect_forces_header: "Fuerzas"
hint_editor_inspector-effect_header: "Inspector de efecto"
hint_editor_inspector-effect_scale-a: "El tamaño de la partícula. En las variantes Aleatorio es un extremo del rango del que cada partícula saca su valor"
hint_editor_inspector-effect_scale-b: "El otro extremo del rango del que cada partícula saca su tamaño"
hint_editor_inspector-effect_scale-curve-x: "La curva de la que se lee el tamaño horizontal, con independencia del vertical"
hint_editor_inspector-effect_scale-curve-y: "La curva de la que se lee el tamaño vertical, con independencia del horizontal"
hint_editor_inspector-effect_scale-speed-range: "Ventana de velocidades a la que se reasignan las dos curvas - la velocidad que cuenta como su inicio y la que cuenta como su final"
hint_editor_inspector-effect_scale-type: "Cuál de las cinco variantes de tamaño es esta. Cambiarla sustituye el subobjeto entero, así que las filas de abajo son de la nueva variante"
hint_editor_inspector-effect_scale_body: |-
  Qué tamaño tiene una partícula a lo largo de su vida, en las mismas cinco variantes que <link="hint_editor_inspector-effect_angle"><color=#59A6FF>Ángulo</color></link>. <color=#D4B483>Curva X</color> y <color=#D4B483>Curva Y</color> se leen por separado, así que una partícula puede estirarse mientras encoge

  <color=#E8B04B><b>Advertencia:</b></color> la fila bajo las curvas se reutiliza: en Valor y Aleatorio es el propio tamaño, en Por velocidad es la ventana de velocidades. La etiqueta de al lado dice cuál

  <b>Restablecer</b>, junto a este botón, también restablece <color=#D4B483>Tipo</color>, y con él se van las dos curvas y el par aleatorio

  Más: <link="https://bullethero.space/es/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Legibilidad</color></link>
hint_editor_inspector-effect_scale_header: "Escala"
hint_editor_inspector-effect_shape-arc: "Parte del borde que se usa, en radianes, medida en sentido antihorario desde el eje +X - menos de una vuelta completa forma un abanico"
hint_editor_inspector-effect_shape-box-size: "Ancho y alto totales de la caja de emisión, centrada en el objeto del efecto"
hint_editor_inspector-effect_shape-circle-aspect: "Semieje vertical como múltiplo del radio: 1 es un círculo, cualquier otro valor una elipse"
hint_editor_inspector-effect_shape-circle-radius: "Distancia del centro al anillo, a lo largo del eje horizontal"
hint_editor_inspector-effect_shape-circle-thickness: "Hasta dónde se rellena el anillo hacia dentro: 0 es solo el contorno, 1 un disco lleno"
hint_editor_inspector-effect_shape-cone-base-radius: "Radio en el extremo del emisor"
hint_editor_inspector-effect_shape-cone-height: "Distancia entre los dos extremos - la profundidad del volumen de emisión"
hint_editor_inspector-effect_shape-cone-top-radius: "Radio en el extremo lejano. Mayor que el radio de la base se abre hacia fuera, menor forma un embudo"
hint_editor_inspector-effect_shape-line-end: "El otro extremo del segmento"
hint_editor_inspector-effect_shape-line-start: "Un extremo del segmento, en coordenadas locales del objeto del efecto"
hint_editor_inspector-effect_shape-spread: "Parte de la forma que recorre el avance antes de volver a empezar"
hint_editor_inspector-effect_shape-spread-speed: "Con qué rapidez avanza el punto de emisión - es lo que fija la velocidad de giro visible"
hint_editor_inspector-effect_shape-spread-type: "Cómo recorren la forma las partículas sucesivas: al azar, en bucle en un solo sentido, de ida y vuelta o siguiendo un seno. Esto es lo que convierte un anillo estático en un patrón que gira o barre"
hint_editor_inspector-effect_shape-torus-radius-major: "Radio del anillo alrededor del cual se curva el tubo"
hint_editor_inspector-effect_shape-torus-radius-minor: "Radio del propio tubo - el grosor del anillo"
hint_editor_inspector-effect_shape-type: "Qué volumen de emisión es este. Cambiarlo sustituye la forma, así que los campos de abajo son de la nueva forma, no de la anterior"
hint_editor_inspector-effect_shape_body: |-
  El volumen de emisión: un punto, un anillo, una caja, un segmento, un cono o un toro. Solo decide dónde empieza una partícula, lo que pasa después es <link="hint_editor_inspector-effect_forces"><color=#59A6FF>Fuerzas</color></link>

  Cambiar <color=#D4B483>Tipo</color> cambia las filas de abajo, y las filas se comparten entre tipos. <color=#D4B483>Arco</color> va en radianes, y menos de una vuelta completa forma un abanico

  <color=#5EC8C8><b>Consejo:</b></color> <b>Apertura</b> en Bucle da el clásico emisor giratorio

  <b>Restablecer</b>, junto a este botón, también restablece <color=#D4B483>Tipo</color>, y con él se va la forma

  Más: <link="https://bullethero.space/es/docs/editor/craft/composition-and-camera"><color=#59A6FF>Composición</color></link>
hint_editor_inspector-effect_shape_header: "Forma"
hint_editor_inspector-keyframe_body: |-
  <b>Se muestran a la vez todas las pistas que toca la selección</b>, no solo la última en la que hiciste clic. Un valor vacío significa que los fotogramas clave seleccionados <b>no coinciden</b> en él

  <color=#5EC8C8><b>Consejo:</b></color> <b>Suavizado</b> actúa sobre todas las pistas y se confirma como <b>un solo paso de deshacer</b>

  <color=#B48CE0><b>Conviene saber:</b></color> <b>Fotograma</b> se bloquea cuando hay varios fotogramas clave seleccionados - un solo número los juntaría en un fotograma. Arrástralos en la línea de tiempo

  Más: <link="https://bullethero.space/es/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Cómo piensa el editor</color></link>
hint_editor_inspector-keyframe_header: "Inspector del fotograma clave"
hint_editor_inspector-object_body: |-
  Los campos propios del objeto seleccionado. Todos los tipos muestran los campos comunes del objeto vacío, y los objetos Forma, Efecto, Texto y Prefab añaden los suyos debajo

  <b>Activo</b> desactiva tanto el renderizado <i>como</i> la colisión, y los hijos lo heredan: un objeto oculto aquí no puede matar al jugador

  <color=#E86A5A><b>Precaución:</b></color> <b>Capa</b> es relativa al padre. La capa global de solo lectura que hay al lado es la que usa el renderizador

  <color=#5EC8C8><b>Consejo:</b></color> editar un campo de un objeto que viene de un prefab registra una <b>sobrescritura por instancia</b> - la casilla de al lado la muestra y la revierte

  Más: <link="https://bullethero.space/es/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Cómo piensa el editor</color></link>
hint_editor_inspector-object_header: "Inspector del objeto"
hint_editor_inspector-resolved_body: |-
  Lo que los objetos seleccionados <b>son</b> en el fotograma actual, leído de la simulación en marcha y no de lo que creaste

  El cuadrado al final de una fila es el estado de fotograma clave del campo: azul - un fotograma clave en este fotograma (haz clic en el cuadrado para seleccionarlo), ámbar - interpolado entre fotogramas clave, gris - fuera de los fotogramas clave, el valor se mantiene, hueco - sin fotogramas clave, se usa el predeterminado. Las flechas llevan el cabezal al fotograma clave anterior o al siguiente

  Bajo la línea están los valores compuestos - la capa sumada, la marca Activo heredada y la transformación compuesta con los padres. Ningún fotograma clave los fija, así que no llevan indicador

  Más: <link="https://bullethero.space/es/docs/editor/reference/object-properties"><color=#59A6FF>Propiedades del objeto</color></link>
hint_editor_inspector-resolved_header: "Valores resueltos"
hint_editor_inspector_audio-span-fit: "Estira la pista sobre toda la parte de su clip que cabe antes del final del nivel. No está disponible sin un clip resoluble ni con velocidad cero, porque una pista congelada no tiene longitud que encajar"
hint_editor_inspector_audio-span-fit-level: "Alarga la pista y el nivel a la vez hasta que cabe todo el clip. El nivel solo se alarga, y un clip que ya cabe no cambia nada"
hint_editor_inspector_collider-id_body: |-
  Con qué <b>choca</b> este objeto - y es una elección aparte de lo que dibuja

  <color=#B48CE0><b>Conviene saber:</b></color> ninguno se deriva del otro, y es a propósito: un rayo de aviso que se dibuja pero no hace daño, un hitbox más simple que el dibujo que protege y un muro invisible son contenido normal, no trucos

  <color=#5EC8C8><b>Consejo:</b></color> los dos campos eligen de las mismas dos colecciones, así que una forma creada por un nivel puede servir para uno, para el otro o para ambos

  Más: <link="https://bullethero.space/es/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Legibilidad y justicia</color></link>
hint_editor_inspector_collider-id_header: "Colisionador"
hint_editor_inspector_ease_body: |-
  Cómo llega el valor a este fotograma clave desde el anterior

  <color=#B48CE0><b>Conviene saber:</b></color> el suavizado pertenece al lado <b>de entrada</b> de un fotograma clave, así que el primer fotograma clave de una pista no tiene desde dónde suavizar y su elección no se nota

  <color=#5EC8C8><b>Consejo:</b></color> con varios fotogramas clave seleccionados, la elección se aplica a todos como <b>un solo paso de deshacer</b>, incluso entre pistas y objetos distintos. Una elección vacía significa que no coinciden

  Más: <link="https://bullethero.space/es/docs/editor/basics/keyframes-and-easing"><color=#59A6FF>Fotogramas clave y suavizado</color></link>
hint_editor_inspector_ease_header: "Suavizado"
hint_editor_inspector_global-layer: "El orden de dibujo que usa de verdad el renderizador: la capa propia de este objeto más la de cada ancestro. Solo lectura, porque se calcula y no se guarda"
hint_editor_inspector_layer_body: |-
  Orden de dibujo, <b>relativo al padre</b> y no absoluto

  <color=#E86A5A><b>Precaución:</b></color> el renderizador usa este número más el de cada ancestro, que se muestra en solo lectura en <b>Global</b> más abajo. Cambiar de padre cambia dónde se dibuja un objeto aunque este número no cambie

  <color=#B48CE0><b>Conviene saber:</b></color> los valores aleatorios dependen de la capa efectiva, así que mover un objeto en la jerarquía vuelve a sortearlos

  Más: <link="https://bullethero.space/es/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Cómo piensa el editor</color></link>
hint_editor_inspector_layer_header: "Capa"
hint_editor_inspector_object-type: "Qué tipo de objeto es este. Cambiarlo REEMPLAZA el objeto: se conservan los campos comunes y se pierde lo que no tiene sitio en el tipo nuevo"
hint_editor_inspector_parent: "A qué objeto sigue este. Un padre aplica su transformación al hijo, y las capas se suman a lo largo de la cadena, así que cambiar de padre también mueve un objeto en el orden de dibujo"
hint_editor_inspector_shader-type_body: |-
  Qué ruta de renderizado sigue este objeto

  <color=#E86A5A><b>Precaución:</b></color> <b>Auto</b> decide una sola vez, al cargar el nivel, y nunca cambia el aspecto del nivel: todo lo que no puede demostrar que es opaco a partir del alfa pasa a ser transparente

  <color=#5EC8C8><b>Consejo:</b></color> la etiqueta junto a este campo muestra en qué se resolvió Auto de verdad, leído directamente de los datos del renderizador

  Más: <link="https://bullethero.space/es/docs/editor/performance/level-budget"><color=#59A6FF>El presupuesto del nivel</color></link>
hint_editor_inspector_shader-type_header: "Tipo de shader"
hint_editor_inspector_shape-id_body: |-
  Lo que <b>dibuja</b> este objeto

  <color=#B48CE0><b>Conviene saber:</b></color> una forma es geometría real encajada en su recuadro, con exactamente 1 en su eje más largo, así que el rectángulo del objeto es lo que aparece en pantalla. El juego genera unas 500, y un nivel puede añadir las suyas

  <color=#5EC8C8><b>Consejo:</b></color> dejarlo vacío es válido: un objeto que no dibuja nada pero tiene un colisionador es un muro invisible

  Más: <link="https://bullethero.space/es/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Legibilidad y justicia</color></link>
hint_editor_inspector_shape-id_header: "Forma"
hint_editor_inspector_span_body: |-
  Cuándo existe este objeto, como rango semiabierto: el fotograma inicial entra, el final no. Un objeto que termina en 20 y otro que empieza en 20 nunca se dibujan los dos en ese fotograma

  <color=#B48CE0><b>Conviene saber:</b></color> el tramo de un hijo tiene que quedar dentro del de su padre, pero eso se resuelve al leer y nunca se guarda. Encoge un padre y sus hijos se recortan, vuelve a agrandarlo y regresan. Un objeto raíz que pasa del final del nivel simplemente nunca se reproduce

  Las <b>anclas</b> hacen que un borde siga al borde del padre, y deciden lo que se reproduce: un hijo anclado se estira con un padre que crece. Su animación conserva los tiempos que fijaste

  Más: <link="https://bullethero.space/es/docs/editor/basics/frames-and-time"><color=#59A6FF>Fotogramas, tiempo y duración de un nivel</color></link>
hint_editor_inspector_span_header: "Tramo"
hint_editor_interop-report: "Lo que sobrevivió y lo que no a una conversión desde el formato de otro juego. Las entradas son informativas: el nivel ya se cargó, esto indica en qué se diferencia del original"
hint_editor_level-export_body: |-
  Guarda este nivel fuera del juego - como carpeta o como un solo archivo comprimido. Todo lo que usa el nivel viaja con él, incluida una canción de fuera de la carpeta del nivel

  Un <b>.zip</b> normal se abre en el Explorador de Windows sin instalar nada. Las opciones con contraseña no: <b>+ contraseña</b> se abre en 7-Zip o en cualquier otro programa de compresión, <b>(gpg)</b> se abre con gpg

  <color=#5EC8C8><b>Consejo:</b></color> lo que no pudo viajar - un recurso detrás de una URL, un archivo al que nada hace referencia - aparece después en el informe

  <color=#E8B04B><b>Advertencia:</b></color> una contraseña no es DRM. Quien tenga el archivo y la contraseña siempre puede abrirlo

  Más: <link="https://bullethero.space/es/docs/editor/workflow/sharing-by-hand"><color=#59A6FF>Compartir un nivel a mano</color></link>
hint_editor_level-export_header: "Exportar nivel"
hint_editor_level-protection_body: |-
  Cifra el documento de este nivel en disco, así que al abrir el nivel se pide una contraseña. Los metadatos, la portada y los medios siguen siendo legibles, así que la tarjeta del nivel se muestra igualmente

  La contraseña se pide una vez por sesión y solo se guarda en memoria. Para quitar la protección, deja el campo vacío y haz clic en <b>Aplicar</b>

  <color=#E86A5A><b>Precaución:</b></color> una contraseña olvidada no se puede recuperar. No se guarda ninguna clave en ningún sitio

  Más: <link="https://bullethero.space/es/docs/editor/reference/export-and-protection"><color=#59A6FF>Exportación y protección</color></link>
hint_editor_level-protection_header: "Proteger nivel"
hint_editor_prefab-flatten-recursive_body: |-
  Desactivado - solo la colocación que señalaste deja de seguir a su plantilla. Un prefab colocado dentro conserva su propio vínculo, así que editar esa plantilla interior sigue llegando a este nivel. Es el valor predeterminado

  Activado - también se aplana todo lo anidado, y nada en el nivel queda vinculado a esas plantillas interiores, a ninguna profundidad

  Las plantillas en sí se quedan en el nivel en cualquier caso, y un aplanado es un solo paso de deshacer

  Más: <link="https://bullethero.space/es/docs/editor/reference/prefab-mode"><color=#59A6FF>Modo prefab</color></link>
hint_editor_prefab-flatten-recursive_header: "Aplanar también los prefabs anidados"
hint_editor_prefab-mode_body: |-
  <color=#E86A5A><b>Precaución:</b></color> estás editando una <b>plantilla</b> de prefab, no una colocación suya. Al guardar, el cambio llega a todas las colocaciones que usan esta plantilla

  Lo que editas aquí no registra sobrescrituras por instancia. Una sobrescritura solo surge al editar el objeto de una colocación fuera de este modo

  <color=#5EC8C8><b>Consejo:</b></color> una colocación dentro de esta plantilla abre su propia plantilla encima, y "Guardar y cerrar" te devuelve aquí. El anidamiento se detiene en 8 niveles

  Más: <link="https://bullethero.space/es/docs/editor/workflow/reuse"><color=#59A6FF>Reutilización: prefabs, copia, generadores</color></link>
hint_editor_prefab-mode_header: "Modo prefab"
hint_editor_search-palette_body: |-
  Dos modos. <b>Ejecutar comando</b> encuentra cualquier acción del editor por su nombre - las mismas acciones que ejecutan la barra de herramientas y los menús contextuales. <b>Buscar contenido</b> encuentra los objetos del ámbito actual y las pistas de audio

  <color=#B48CE0><b>Conviene saber:</b></color> los recursos no están en ningún modo: cada uno se elige desde el campo que lo necesita

  Más: <link="https://bullethero.space/es/docs/editor/workflow/speed-and-shortcuts"><color=#59A6FF>Velocidad y atajos</color></link>
hint_editor_search-palette_header: "Paleta de comandos"
hint_editor_search-picker: "El único selector que usan todos los campos de recurso. Escribe para ordenar la lista. Los filtros la acotan por tipo, y la etiqueta de la derecha aparece cuando un campo solo acepta un dominio"
hint_editor_theme-ref_body: |-
  Apunta este color a una <b>ranura del tema del nivel</b> en lugar de a un valor fijo. Cuando el tema cambia, todo lo que hace referencia a la ranura cambia de color a la vez

  <color=#5EC8C8><b>Consejo:</b></color> las muestras enseñan la paleta tal como está en el fotograma clave que estás editando, no en el cabezal. Para elegir según un aspecto posterior, edita un fotograma clave que esté más adelante

  Más: <link="https://bullethero.space/es/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>Color, temas y posprocesado</color></link>
hint_editor_theme-ref_header: "Referencia a un color del tema"
hint_editor_timeline-audio_body: |-
  Las pistas de audio del nivel con sus formas de onda, para que alinees el contenido con lo que oyes

  <color=#5EC8C8><b>Consejo:</b></color> <b>Encajar pista</b> en el inspector cambia la longitud de una pista a la longitud real de su clip. No está disponible sin clip ni con velocidad 0

  <color=#E86A5A><b>Precaución:</b></color> el control deslizante <b>Volumen</b> del inspector es el fader de la pista. El volumen con fotogramas clave es una pista Volumen aparte en la línea de tiempo local, y los dos se multiplican al reproducir

  Más: <link="https://bullethero.space/es/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar la pista de audio</color></link>
hint_editor_timeline-audio_header: "Línea de tiempo de audio"
hint_editor_timeline-events_body: |-
  Fotogramas clave de todo el nivel que no pertenecen a ningún objeto:
  - posición, rotación, zoom, pivote y sacudida de la cámara
  - marcadores y checkpoints
  - el límite de pantalla
  - fondo y tema
  - todos los efectos de posprocesado
  - la visibilidad, el control, la colisión, el tamaño y la velocidad del jugador

  <color=#B48CE0><b>Conviene saber:</b></color> el carril <b>Pulso</b> es aquí la excepción. Sus elementos tienen un tramo, así que es el único carril sobre el que actúan Bordes y Tijeras

  <color=#5EC8C8><b>Consejo:</b></color> un color puede apuntar al tema del nivel en lugar de tener un valor fijo. Así un solo cambio de tema lo recolorea todo

  Más: <link="https://bullethero.space/es/docs/editor/craft/composition-and-camera"><color=#59A6FF>Composición y cámara</color></link>
hint_editor_timeline-events_header: "Línea de tiempo de eventos"
hint_editor_timeline-level_body: |-
  Un clip por objeto, y el carril en el que está es su <b>capa</b>. Un clip es el <b>tramo</b> del objeto: los fotogramas 10-19 terminan justo donde empieza un clip que arranca en 20

  <color=#B48CE0><b>Conviene saber:</b></color> un hijo solo se reproduce dentro del tramo de su padre, pero no se recorta nada de lo que creaste. Vuelve a agrandar el padre y el hijo regresa

  <color=#5EC8C8><b>Consejo:</b></color> <b>Selección</b> elige y arrastra, <b>Bordes</b> mueve un borde, <b>Tijeras</b> divide un clip en el cursor. Haz clic derecho en un espacio vacío para abrir el menú

  Más: <link="https://bullethero.space/es/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Cómo piensa el editor</color></link>, <link="https://bullethero.space/es/docs/editor/craft/composition-and-camera"><color=#59A6FF>Composición y cámara</color></link>
hint_editor_timeline-level_header: "Línea de tiempo del nivel"
hint_editor_timeline-local_body: |-
  Fotogramas clave del <b>objeto seleccionado</b>, un carril por pista. Los fotogramas se cuentan desde el inicio del tramo del objeto, así que mover el objeto mueve con él toda su animación

  <color=#B48CE0><b>Conviene saber:</b></color> una <b>pista vacía es un dato válido</b>. Usa el valor predeterminado, por eso un objeto nuevo no anima nada hasta que añades un fotograma clave

  Más: <link="https://bullethero.space/es/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Cómo piensa el editor</color></link>
hint_editor_timeline-local_header: "Línea de tiempo local"
hint_editor_timeline-prefab_body: |-
  La línea de tiempo propia del modo prefab, sobre los objetos de la <b>plantilla</b>. Su duración es la de la propia plantilla, no el tramo de alguna colocación

  <color=#E8B04B><b>Advertencia:</b></color> la selección no se comparte con el resto del editor. Lo que editas aquí cambia la plantilla y se extiende a todas sus colocaciones

  Más: <link="https://bullethero.space/es/docs/editor/workflow/reuse"><color=#59A6FF>Reutilización: prefabs, copia, generadores</color></link>
hint_editor_timeline-prefab_header: "Línea de tiempo del prefab"
hint_editor_value-type-color: "De dónde sale el color en cada reproducción. Valor - tal como está escrito. Tema - la ranura del tema en ese fotograma, así que cambia cuando cambia el tema. Aleat. mín-máx - cada canal se sortea por su cuenta, así que el color cae en cualquier punto entre los dos. Aleat. de A a B - un solo sorteo para todos los canales, así que el color siempre está en la línea de A a B"
hint_editor_value-type-number: "Cómo se decide este número cada vez que se reproduce. Valor - el número tal como está escrito. Aleat. mín-máx - un número entre los dos límites. Aleat. mín-máx, paso - lo mismo, ajustado a una cuadrícula de ese tamaño. Aquí no hay forma de A a B, porque un solo componente ya saca exactamente un número. Un valor aleatorio se direcciona, no se sortea, así que el mismo nivel se juega igual en cualquier dispositivo, y mover un objeto o cambiar su capa lo vuelve a sortear"
hint_editor_value-type-vector: "Cómo se decide este vector cada vez que se reproduce. Valor - los números tal como están escritos. Aleat. en recuadro - cada eje se sortea por su cuenta entre sus dos límites, y llena el rectángulo. Aleat. de A a B - UN solo sorteo, que cada eje lee en el mismo punto, así que el punto recorre la recta de A a B. Un eje se queda quieto cuando lleva el mismo número en los dos extremos. Aleat. en círculo - un punto en un disco alrededor del centro. Las formas con paso ajustan el resultado a una cuadrícula. Un valor aleatorio se direcciona, no se sortea, así que el mismo nivel se juega igual en cualquier dispositivo"
hint_editor_video-export_audio: "Las pistas del nivel en el video, con sus fotogramas clave de volumen y paneo"
hint_editor_video-export_body: |-
  Renderiza el nivel abierto en un video mediante el ffmpeg instalado en este equipo

  <color=#B48CE0><b>Conviene saber:</b></color> el renderizado es offline, fotograma a fotograma, así que el video sale exacto por lento que sea el equipo. ffmpeg no forma parte del juego - instálalo una vez y esta ventana lo encuentra. También puedes indicar el archivo a mano
  Más: <link="https://bullethero.space/es/docs/editor/reference/video-export"><color=#59A6FF>Exportación de video</color></link>
hint_editor_video-export_bot: "Quién juega el nivel en el video. Reflex mira un instante por delante y no necesita preparación. Warm calcula toda la ruta antes del primer fotograma. Los impactos no hacen nada durante una exportación"
hint_editor_video-export_codec: "Cómo se comprimen la imagen o el sonido dentro del contenedor. Solo aparece lo que tu ffmpeg puede crear. La línea de abajo indica qué códec de sonido lo acompaña y qué archivo obtienes"
hint_editor_video-export_effects: "Los efectos de partículas del nivel en el video. El mismo interruptor que en el editor, solo para el video"
hint_editor_video-export_engine-audio: "Activado: si las pistas tienen efectos, el sonido del nivel se reproduce en tiempo real mientras se renderizan los fotogramas y se graba el propio sonido del juego, con todos los efectos, mientras los altavoces siguen en silencio. La exportación dura como mínimo lo que dura el rango. Desactivado: las pistas se mezclan por separado, sin sus efectos. Solo sonido siempre mezcla por separado"
hint_editor_video-export_ffmpeg: "ffmpeg codifica el video y no forma parte del juego. Verde - encontrado y listo, ámbar - demasiado antiguo, rojo - no encontrado o no se pudo ejecutar. Elegir ffmpeg señala un archivo a mano, Comprobar repite la búsqueda"
hint_editor_video-export_fps: "Fotogramas por segundo del video, hasta 240, sin relación con la frecuencia de fotogramas del propio nivel. Por debajo de 60 cada fotograma se simula en varios pasos, para que el bot juegue igual que en el juego"
hint_editor_video-export_full-chroma: "Color para cada píxel en lugar de uno de cada dos. Las líneas finas de color siguen nítidas, el archivo crece y algunos reproductores no lo abren"
hint_editor_video-export_header: "Exportar video"
hint_editor_video-export_output: "Dónde se guarda el video. Por defecto es recordings/[id del nivel] en la carpeta de datos del juego, que sobrevive aunque se elimine el nivel"
hint_editor_video-export_post-processing: "El posprocesado del nivel - bloom, corrección de color y lo demás - en el video. El mismo interruptor que en el editor, solo para el video"
hint_editor_video-export_preroll: "Segundos que se reproducen antes del inicio sin grabarse, para que los efectos y las partículas ya tengan su historial en el primer fotograma"
hint_editor_video-export_preset: "El tipo de archivo. MP4 se abre en todas partes, MKV y MOV son para edición, WebM es para la web, GIF, WebP y APNG son clips cortos sin sonido, una secuencia de imágenes es una carpeta de fotogramas, Solo sonido no renderiza ninguna imagen"
hint_editor_video-export_quality: "Cuánto espacio ocupa el video. Borrador es pequeño y poco nítido, Sin pérdida conserva cada píxel y ocupa mucho"
hint_editor_video-export_range: "Qué parte del nivel se graba: todo, el rango del bucle de la línea de tiempo o tus propios fotogramas inicial y final"
hint_editor_video-export_resolution: "Tamaño del video en píxeles. Personalizada acepta cualquier ancho y alto pares. La cámara del nivel se encaja dentro, y franjas negras rellenan el resto"
hint_editor_video-export_seed: "Semilla de la aleatoriedad del nivel. 0 conserva la que usa ahora el editor, cualquier otro número da el mismo video cada vez"
hint_editor_video-export_sound-after-frames: "Desactivado (predeterminado): el sonido con efectos se graba mientras se renderizan los fotogramas, y la exportación dura lo que la más larga de las dos cosas. Activado: el sonido se graba en tiempo real después del último fotograma, así que la exportación tarda más, tanto como dura el rango. Actívalo cuando el nivel es pesado y el sonido grabado da tirones"
hint_gen_audio_waveform_body: |-
  Crea objetos que trazan la forma de una pista de audio, para que el nivel siga a la vista lo que se oye

  Más: <link="https://bullethero.space/es/docs/editor/workflow/reuse"><color=#59A6FF>Reutilización: prefabs, copia, generadores</color></link>
hint_gen_audio_waveform_header: "Forma de onda"
hint_gen_beat_flash_body: |-
  Coloca un destello en cada pulso. Los pulsos salen del mapa de pulsos del nivel, y de sus marcadores cuando no hay mapa - así que lo que destella es exactamente lo que ves en la cuadrícula

  Más: <link="https://bullethero.space/es/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>Ritmo y estructura</color></link>
hint_gen_beat_flash_header: "Destello de pulso"
hint_gen_bullet_homing_body: |-
  Balas que se curvan hacia donde se espera que esté el jugador. La curva se define al crear el nivel, no se calcula durante la reproducción: el resultado es idéntico en cualquier dispositivo

  Más: <link="https://bullethero.space/es/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Legibilidad y justicia</color></link>
hint_gen_bullet_homing_header: "Balas teledirigidas"
hint_gen_bullet_laser_sweep_body: |-
  Un rayo que barre el campo. Su advertencia previa y su fase letal son objetos separados, así la advertencia puede dibujarse sin que pueda matar

  Más: <link="https://bullethero.space/es/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Legibilidad y justicia</color></link>
hint_gen_bullet_laser_sweep_header: "Barrido láser"
hint_gen_bullet_rain_body: |-
  Balas que caen sobre un área durante un intervalo de tiempo. La densidad y la dispersión son parámetros. Dónde cae cada una sale de la semilla del nivel, así que una partida es reproducible

  Más: <link="https://bullethero.space/es/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Legibilidad y justicia</color></link>
hint_gen_bullet_rain_header: "Lluvia de balas"
hint_gen_bullet_spiral_body: |-
  Balas emitidas a lo largo de un brazo giratorio, que forman el clásico muro en espiral

  Más: <link="https://bullethero.space/es/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Legibilidad y justicia</color></link>
hint_gen_bullet_spiral_header: "Espiral de balas"
hint_gen_bullet_wave_body: |-
  Una fila de balas que avanzan juntas. El patrón básico, y el que conviene leer primero: sus parámetros dan nombre a las ideas que reutilizan los demás generadores de balas

  Más: <link="https://bullethero.space/es/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Legibilidad y justicia</color></link>
hint_gen_bullet_wave_header: "Ola de balas"
hint_gen_capacity_hint_body: |-
  Escribe los límites orientativos del nivel - cuántos objetos y efectos espera necesitar a la vez

  <color=#B48CE0><b>Conviene saber:</b></color> no cambia nada que se pueda ver. El motor lo usa para reservar los búferes de antemano en lugar de ampliarlos a mitad del nivel, que es de donde, si no, saldría un tirón

  Más: <link="https://bullethero.space/es/docs/editor/performance/level-budget"><color=#59A6FF>El presupuesto del nivel</color></link>
hint_gen_capacity_hint_header: "Previsión de capacidad"
hint_gen_font_cache_body: |-
  Reúne cada carácter que usa de verdad el texto del nivel y lo hornea, para que ningún glifo tenga que prepararse la primera vez que aparece

  <color=#7FC97F><b>Recomendación:</b></color> ejecútalo cuando el texto sea definitivo. Un carácter añadido después y no vuelto a hornear cuesta un tirón en el momento en que se muestra por primera vez

  Más: <link="https://bullethero.space/es/docs/editor/resources/images-and-fonts"><color=#59A6FF>Imágenes y fuentes</color></link>
hint_gen_font_cache_header: "Caché de fuentes"
hint_gen_geometry_fractal_body: |-
  Repite una forma dentro de sí misma a escalas cada vez menores. La profundidad multiplica los objetos de forma exponencial, así que súbela paso a paso

  Más: <link="https://bullethero.space/es/docs/editor/workflow/reuse"><color=#59A6FF>Reutilización: prefabs, copia, generadores</color></link>
hint_gen_geometry_fractal_header: "Fractal"
hint_gen_geometry_grid_body: |-
  Llena un rectángulo con copias de una forma espaciadas por igual

  Más: <link="https://bullethero.space/es/docs/editor/workflow/reuse"><color=#59A6FF>Reutilización: prefabs, copia, generadores</color></link>
hint_gen_geometry_grid_header: "Cuadrícula"
hint_gen_geometry_polygon_body: |-
  Coloca formas en los vértices o en las aristas de un polígono regular

  Más: <link="https://bullethero.space/es/docs/editor/workflow/reuse"><color=#59A6FF>Reutilización: prefabs, copia, generadores</color></link>
hint_gen_geometry_polygon_header: "Polígono"
hint_gen_geometry_radial_body: |-
  Reparte copias alrededor de un círculo. La base de la mayoría de los patrones simétricos

  Más: <link="https://bullethero.space/es/docs/editor/workflow/reuse"><color=#59A6FF>Reutilización: prefabs, copia, generadores</color></link>
hint_gen_geometry_radial_header: "Radial"
hint_gen_geometry_spiral_body: |-
  Reparte copias a lo largo de una espiral, con el radio y el ángulo avanzando a la vez

  Más: <link="https://bullethero.space/es/docs/editor/workflow/reuse"><color=#59A6FF>Reutilización: prefabs, copia, generadores</color></link>
hint_gen_geometry_spiral_header: "Espiral"
hint_gen_level_archive_body: |-
  Crea un nivel a partir de un archivo comprimido hecho por este juego - un .tar.gz o un .zip, cualquiera de los dos con contraseña opcional. El tipo se lee de los bytes, así que un archivo comprimido renombrado se abre igual. Un archivo comprimido de una versión anterior se migra al entrar

  <color=#E8B04B><b>Advertencia:</b></color> por defecto, el nivel importado recibe un ID propio, así que no puede sobrescribir un nivel que ya esté en este equipo. Desactiva esa opción solo para recuperar un nivel que este equipo tenía antes

  Más: <link="https://bullethero.space/es/docs/editor/reference/generators"><color=#59A6FF>Generadores</color></link>
hint_gen_level_archive_header: "Importar archivo comprimido de nivel"
hint_gen_level_audio_file_body: |-
  Empieza un nivel a partir de una pista: trae el audio, adapta la duración del nivel a la suya y te deja al principio de una línea de tiempo vacía

  Más: <link="https://bullethero.space/es/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparar la pista de audio</color></link>
hint_gen_level_audio_file_header: "Nivel desde archivo de audio"
hint_gen_level_empty_body: |-
  Vacía el nivel por completo. Todo lo creado se elimina, por eso es el que conviene usar para empezar de cero en lugar de editar

  Más: <link="https://bullethero.space/es/docs/editor/basics/first-level"><color=#59A6FF>Tu primer nivel: la ruta</color></link>
hint_gen_level_empty_header: "Nivel vacío"
hint_gen_section_additional: "Refinamientos sobre los parámetros principales. Los valores predeterminados de aquí suelen bastar"
hint_gen_section_main: "Los parámetros que deciden qué produce este generador. Empieza por aquí"
hint_gen_test_camera_flash_body: "Un generador de desarrollo, conservado para probar las pistas de eventos de la cámara. No está pensado para crear contenido"
hint_gen_test_camera_flash_header: "Destello de cámara (prueba)"
hint_gen_test_form_body: "Un generador de desarrollo que pone a prueba cada control de parámetro que el formulario sabe construir. No está pensado para crear contenido"
hint_gen_test_form_header: "Formulario (prueba)"
hint_gen_test_odd_body: "Un generador de desarrollo con casos de parámetros deliberadamente incómodos. No está pensado para crear contenido"
hint_gen_test_odd_header: "Casos raros (prueba)"
hint_gen_test_partial_order_body: "Un generador de desarrollo que comprueba cómo se colocan los campos que la ayuda de orden no menciona. No está pensado para crear contenido"
hint_gen_test_partial_order_header: "Orden parcial (prueba)"
hint_gen_test_scatter_body: "Un generador de desarrollo para las rutas de la aleatoriedad direccionada. No está pensado para crear contenido"
hint_gen_test_scatter_header: "Dispersión (prueba)"
hint_gen_test_sections_body: "Un generador de desarrollo que produce un formulario de varias secciones. No está pensado para crear contenido"
hint_gen_test_sections_header: "Secciones (prueba)"
hint_gen_test_spawn_body: "Un generador de desarrollo para las rutas de creación de objetos. No está pensado para crear contenido"
hint_gen_test_spawn_header: "Aparición (prueba)"
hint_gen_texture_objects_body: |-
  Convierte una imagen en objetos, uno por celda, así un dibujo pasa a ser contenido del nivel que se puede animar como todo lo demás

  Más: <link="https://bullethero.space/es/docs/editor/resources/images-and-fonts"><color=#59A6FF>Imágenes y fuentes</color></link>
hint_gen_texture_objects_header: "Objetos desde textura"
hint_level-preview_authors: "Todas las personas acreditadas en este nivel. La autoría viaja dentro de la carpeta del nivel, así que sobrevive a que alguien la comprima, la reenvíe y la vuelva a subir"
hint_level-preview_licenses_body: |-
  Las condiciones bajo las que se ofrecen este nivel y sus recursos. <b>Las condiciones se registran por recurso</b>, así que un nivel hecho de piezas prestadas dice exactamente qué se tomó prestado y en qué condiciones

  <color=#7FC97F><b>Recomendación:</b></color> léelas antes de reutilizar algo del nivel de otra persona

  Más: <link="https://bullethero.space/es/docs/editor/rights/licensing-basics"><color=#59A6FF>Licencias: lo esencial en tres minutos</color></link>
hint_level-preview_licenses_header: "Licencias"
hint_level_backups: "Cada copia automática de este nivel, la más reciente primero - el nombre es el momento en que se hizo. No se lee nada hasta que eliges una. Restaurar reemplaza el archivo del nivel en el disco y lo vuelve a cargar, y el archivo reemplazado se escribe antes en las copias de seguridad, así que una restauración también se puede deshacer"
hint_level_collections_body: |-
  <b>Importar</b> trae entradas de una colección a este nivel, <b>Crear una colección</b> copia los recursos de este nivel a una nueva. Todo lo que necesita una entrada viene con ella, y una importación es un solo paso de deshacer

  <color=#E8B04B><b>Advertencia:</b></color> cuando el nivel ya contiene otra versión de una entrada, el juego pregunta. Conserva la versión del nivel o importa la de la colección como copia con un ID nuevo

  Más: <link="https://bullethero.space/es/docs/editor/reference/library-and-collections"><color=#59A6FF>Biblioteca y colecciones</color></link>
hint_level_collections_header: "Colecciones"
hint_level_core-framerate: "Cambiarla directamente acelera o frena todos los objetos: los fotogramas clave conservan sus números de fotograma, así que el mismo nivel se reproduce a otra velocidad. Usa el generador para trasladar el contenido a otra frecuencia de fotogramas"
hint_level_core-level-id: "El identificador permanente de este nivel, generado una sola vez al crearlo y que nunca se edita. Indícalo al informar de un problema con el nivel, y úsalo para distinguir dos copias del mismo nivel"
hint_level_core-orientation_body: |-
  En qué orientación hay que sostener el dispositivo en este nivel

  <b>Horizontal</b> y <b>Vertical</b> giran el dispositivo del jugador durante el nivel y prevalecen sobre su propia configuración. En escritorio, un nivel vertical se juega entre franjas laterales, y así es como debe verse

  <b>Sin especificar</b> deja la elección al jugador, y es una <b>afirmación</b> de que el nivel se lee bien en <b>las dos</b> orientaciones. No se reencuadra ni se escala nada para ello, así que antes comprueba el nivel de las dos maneras

  Más: <link="https://bullethero.space/es/docs/editor/reference/level-settings"><color=#59A6FF>Configuración del nivel</color></link>
hint_level_core-orientation_header: "Orientación del nivel"
hint_level_core-runtime-seed: "La semilla con la que juega de verdad esta sesión del editor ahora mismo. Si no hay semilla arriba, es un número nuevo en cada carga del nivel. Regenerar saca otra sin tocar el nivel"
hint_level_core-seed: "Cada valor aleatorio de este nivel sale de esta semilla más la capa y el fotograma inicial propios de cada objeto, así que la misma semilla siempre se juega igual. 0 significa sin semilla: el juego genera una nueva en cada inicio"
hint_level_core_body: |-
  Duración en fotogramas, frecuencia de fotogramas y las dos semillas del nivel

  <color=#B48CE0><b>Conviene saber:</b></color> <b>los fotogramas se cuentan desde 1.</b> Un nivel de N fotogramas contiene los fotogramas 1 a N, y N+1 es el límite final, no un fotograma

  <b>Semilla del nivel</b> es la propia del nivel y se puede deshacer. 0 significa "una semilla nueva en cada partida" y es el valor predeterminado

  <color=#5EC8C8><b>Consejo:</b></color> <b>Semilla de ejecución</b> muestra lo que resolvió esta sesión del editor. <i>Regenerar</i> saca una nueva solo para la sesión - no se escribe nada y nada entra en el historial de deshacer

  Más: <link="https://bullethero.space/es/docs/editor/basics/frames-and-time"><color=#59A6FF>Fotogramas, tiempo y duración de un nivel</color></link>
hint_level_core_header: "General"
hint_level_dangerous_body: |-
  Acciones que destruyen o reescriben archivos en lugar de contenido

  <color=#E86A5A><b>Precaución:</b></color> los desplegables de <b>formato de archivo</b> reescriben en disco el nivel y sus metadatos. Reescribir en otro formato <b>elimina el archivo que dejó el anterior</b>. No pasa nada más: ni recarga, ni resimulación, ni se restablecen la selección ni la pila de deshacer, porque el modelo en memoria ya es exactamente lo que se escribe

  <color=#E86A5A><b>Precaución:</b></color> <b>Eliminar</b> borra del disco la carpeta del nivel. Eso no se puede deshacer

  Más: <link="https://bullethero.space/es/docs/editor/workflow/not-losing-work"><color=#59A6FF>No perder tu trabajo</color></link>
hint_level_dangerous_header: "Zona de peligro"
hint_level_effect-editor_body: |-
  Crea un efecto de partículas y previsualízalo en el lienzo

  <color=#B48CE0><b>Conviene saber:</b></color> los grupos de parámetros son los mismos que muestra el inspector del efecto, aquí editados como <b>borrador</b>: nada llega al nivel hasta que guardas

  <color=#5EC8C8><b>Consejo:</b></color> guarda en la biblioteca compartida del dispositivo para reutilizar el efecto en otros niveles

  Más: <link="https://bullethero.space/es/docs/editor/performance/level-budget"><color=#59A6FF>El presupuesto del nivel</color></link>
hint_level_effect-editor_header: "Editor de efectos"
hint_level_font-cache: "Qué glifos hornea de antemano el nivel, para que el texto no se trabe la primera vez que aparece un carácter - por fuente y por idioma. Solo lectura: el generador de caché de fuentes lo llena con el texto que el nivel contiene de verdad, y nada en esta pestaña lo edita"
hint_level_history_body: |-
  Cada edición de esta sesión es una fila aquí, la más reciente arriba, como en un git log. La columna de más a la izquierda es la línea principal, una columna aparte es una rama que dejaste al deshacer y tomar otro camino. El anillo marca dónde estás, el círculo verde el último guardado

  Hacer clic en una fila lleva el nivel de vuelta a ese estado exacto, una operación por fotograma. El historial vive solo en esta sesión y nunca se escribe en disco

  <color=#E8B04B><b>Advertencia:</b></color> el editor es de solo lectura mientras dura un recorrido. Cancelar lo detiene donde está, y eso siempre es un estado real

  Más: <link="https://bullethero.space/es/docs/editor/reference/level-settings"><color=#59A6FF>Configuración del nivel</color></link>
hint_level_history_header: "Historial"
hint_level_library-browser_body: |-
  Recursos guardados en <b>este dispositivo</b>, compartidos por todos los niveles que abres aquí

  <color=#B48CE0><b>Conviene saber:</b></color> importar copia el recurso <i>dentro del nivel</i>. Un nivel lleva todo lo que necesita, así que la biblioteca es una comodidad para ti, nunca una dependencia para quien juegue tu nivel

  Más: <link="https://bullethero.space/es/docs/editor/workflow/reuse"><color=#59A6FF>Reutilización: prefabs, copia, generadores</color></link>
hint_level_library-browser_header: "Biblioteca"
hint_level_metadata-logo: "Se copia a la carpeta del nivel como <color=#D4B483>logo.png</color> y se muestra en todas partes donde aparece el nivel. Está pensado para un <color=#D4B483>PNG</color> cuadrado de <color=#D4B483>512x512</color> - uno más pequeño se ve borroso en la lista, uno más grande solo ocupa espacio. \"Quitar\" solo borra la referencia - el archivo sigue en la carpeta"
hint_level_metadata-tags_body: |-
  Las etiquetas son tus propias palabras, se muestran tal como las escribes y nunca se traducen. Un jugador filtra por ellas en la lista de niveles, así que una etiqueta solo ayuda si otros niveles también la usan

  Separadas por comas. Mantenlas cortas y generales: un género, un ambiente, una mecánica

  Más: <link="https://bullethero.space/es/docs/editor/reference/level-settings"><color=#59A6FF>Configuración del nivel</color></link>
hint_level_metadata-tags_header: "Etiquetas del nivel"
hint_level_metadata_body: |-
  Todo lo que trata del nivel sin ser el nivel: nombre, descripción, portada, licencia, clasificación por edad y autores

  <color=#B48CE0><b>Conviene saber:</b></color> el nombre y la descripción son <b>cadenas localizadas</b> - escribes el texto de cada idioma aquí mismo, sin claves de por medio, porque un nivel es contenido y no parte de la interfaz del juego. Un jugador cuyo idioma no escribiste ve la primera entrada que sí escribiste

  La licencia y los autores viajan con el nivel allá donde se comparta, y eso es lo que mantiene el crédito cuando alguien vuelve a subirlo

  Más: <link="https://bullethero.space/es/docs/editor/reference/metadata-and-sharing"><color=#59A6FF>Metadatos y cómo compartir un nivel</color></link>
hint_level_metadata_header: "Metadatos"
hint_level_play-seed: "0 = usar la semilla propia del nivel, o una nueva en cada partida"
hint_level_play_body: |-
  <color=#B48CE0><b>Conviene saber:</b></color> opciones de inicio <b>solo para esta partida</b> - nada de aquí se guarda en el nivel

  <color=#5EC8C8><b>Consejo:</b></color> las vidas, la velocidad, los checkpoints y el bot te dejan ensayar una sección sin editarla. La <b>semilla</b> de aquí manda sobre la del propio nivel: es la prioridad más alta de las tres, y es la que debes usar cuando quieras repetir exactamente la partida que acabas de ver

  Más: <link="https://bullethero.space/es/docs/editor/craft/difficulty-curve"><color=#59A6FF>La dificultad y la curva</color></link>
hint_level_play_header: "Jugar"
hint_level_publication_body: |-
  Todo lo que envía este nivel a alguna parte. Elige un método arriba: muestra su propia configuración y revisa el nivel por sí mismo. Un error en el informe bloquea el envío, las advertencias y los consejos quedan a tu criterio

  El <b>archivo comprimido</b> funciona en todas partes. Un <b>.zip</b> normal se abre en el Explorador de Windows sin instalar nada. <b>+ contraseña</b> se abre con 7-Zip o con cualquier otro compresor, <b>(gpg)</b> se abre con gpg
  El <b>Workshop de Steam</b> solo existe en la versión de Steam y revisa el nivel según las reglas del Workshop

  <color=#5EC8C8><b>Consejo:</b></color> publica primero en el Workshop con <b>Solo yo</b> y revisa el elemento antes de mostrarlo a todos. Una segunda publicación actualiza el mismo elemento

  <color=#E8B04B><b>Advertencia:</b></color> una contraseña no es DRM. Quien tenga el archivo y la contraseña siempre puede abrirlo

  Más: <link="https://bullethero.space/es/docs/editor/reference/publishing"><color=#59A6FF>Publicación</color></link>
hint_level_publication_header: "Publicación"
hint_level_raw-add: "Añade un elemento a la ranura desde la que abriste esto. Aquí solo se ofrecen los campos simples propios del nuevo elemento. Todo lo anidado conserva su valor predeterminado y se edita después en el árbol"
hint_level_raw_body: |-
  Todo el modelo guardado del nivel como un único árbol de campos - el propio archivo, antes de que el editor lo procese

  <color=#E86A5A><b>Precaución:</b></color> <b>aquí no se valida nada.</b> Puede escribir un valor que el resto del editor considera imposible, así que ten a mano una copia de la carpeta del nivel

  Un punto relleno significa que cambiaste un campo en esta sesión, uno hueco significa que cambió algo dentro de él. <b>Aplicar</b> confirma toda la sesión como una sola operación que puedes deshacer

  Más: <link="https://bullethero.space/es/docs/editor/workflow/not-losing-work"><color=#59A6FF>No perder tu trabajo</color></link>
hint_level_raw_header: "Datos sin procesar"
hint_level_resource-meta_body: |-
  Título, descripción, orígenes, licencia y autores de un recurso

  <color=#B48CE0><b>Conviene saber:</b></color> así sobrevive la atribución: cuando una textura, una fuente o un archivo de audio viene de otro sitio, lleva dentro del nivel de dónde salió y con qué condiciones, vaya donde vaya el nivel

  <color=#7FC97F><b>Recomendación:</b></color> rellénalo al añadir el recurso - es el único momento en que todavía lo recuerdas

  Más: <link="https://bullethero.space/es/docs/editor/rights/resource-record"><color=#59A6FF>La ficha de un recurso</color></link>
hint_level_resource-meta_header: "Metadatos del recurso"
hint_level_resources-audios: "Archivos de audio que lleva este nivel. Añade uno aquí primero y luego colócalo como pista en la línea de tiempo de audio"
hint_level_resources-effects_body: |-
  Efectos de partículas de <color=#D4B483>VFX Graph</color> que el nivel puede colocar. Son <b>opcionales</b>: un nivel que nunca usa ninguno se juega exactamente como se diseñó

  Un efecto usa la aleatoriedad con semilla del nivel, así que se repite igual en cualquier dispositivo. Los efectos se pueden exportar a la biblioteca compartida del dispositivo

  Más: <link="https://bullethero.space/es/docs/editor/performance/level-budget"><color=#59A6FF>El presupuesto del nivel</color></link>
hint_level_resources-effects_header: "Efectos"
hint_level_resources-fonts: "Fuentes que lleva este nivel, para sus objetos de texto. Como cualquier otro recurso, una fuente vive junto al nivel y viaja con él"
hint_level_resources-prefabs_body: |-
  Grupos de objetos reutilizables. Un prefab guarda objetos de plantilla, y cada colocación recibe copias reales de ellos. Editar la plantilla llega a todas las colocaciones, y una colocación aún puede diferir mediante sobrescrituras por instancia

  <color=#E8B04B><b>Advertencia:</b></color> los prefabs <b>no tienen presets del juego</b>, a diferencia de los temas, los efectos y los colisionadores - la biblioteca y las colecciones son la forma de llevar un prefab de un nivel a otro

  Más: <link="https://bullethero.space/es/docs/editor/workflow/reuse"><color=#59A6FF>Reutilización: prefabs, copia, generadores</color></link>
hint_level_resources-prefabs_header: "Prefabs"
hint_level_resources-shapes_body: |-
  Las formas propias del nivel, además de las ~500 que genera el juego. Una forma es <b>geometría real</b> encajada en su caja delimitadora, así que el rectángulo del objeto es exactamente lo que dibuja

  <color=#5EC8C8><b>Consejo:</b></color> una forma y un colisionador son el mismo tipo de dato, y un objeto apunta a uno para lo que se dibuja y al otro para lo que recibe los golpes. Ninguno se deriva del otro, así que un haz de aviso inofensivo o un muro invisible son contenido normal

  Más: <link="https://bullethero.space/es/docs/editor/resources/level-needs"><color=#59A6FF>Qué necesita un nivel</color></link>
hint_level_resources-shapes_header: "Formas"
hint_level_resources-textures_body: |-
  Imágenes que lleva este nivel. <b>El juego en sí no incluye ninguna textura</b> - cada textura que usa un nivel se añade aquí y vive en la carpeta del nivel, así que viaja con él

  <color=#B48CE0><b>Conviene saber:</b></color> las formas <b>no</b> son texturas. Son geometría real y no necesitan nada de esta pestaña

  Más: <link="https://bullethero.space/es/docs/editor/resources/images-and-fonts"><color=#59A6FF>Imágenes y fuentes</color></link>
hint_level_resources-textures_header: "Texturas"
hint_level_resources-themes_body: |-
  Un tema es una <b>paleta a la que pueden apuntar los colores del nivel</b> en lugar de guardar valores literales. Cambiar el tema activo recolorea todo lo que apunta a él, y el cambio se marca con un fotograma clave en la línea de tiempo de eventos

  <color=#5EC8C8><b>Consejo:</b></color> exporta un tema a la biblioteca compartida del dispositivo para reutilizarlo en otros niveles

  Más: <link="https://bullethero.space/es/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>Color, temas y posprocesado</color></link>
hint_level_resources-themes_header: "Temas"
hint_level_rules_body: |-
  Lo que la validación encontró en este nivel: referencias rotas, ID duplicados, ciclos de padres, prefabs anidados demasiado hondo, segmentos de pulso superpuestos

  Algunas incidencias se pueden reparar, una por una o con <b>Corregir todo</b>. Las reparaciones van a un borrador: <b>Guardar</b> las aplica como una sola operación que puedes deshacer, <b>Descartar</b> las desecha. Las incidencias del grafo (ID, padres, anidación de prefabs) no tienen reparación - son decisiones de contenido que solo tú puedes tomar

  <color=#5EC8C8><b>Consejo:</b></color> un hijo que sobresale del tramo de su padre <b>no</b> se informa. Para encajar los tiempos de vida, ejecuta el modificador <color=#D4B483>Encaje de tramos</color> desde Generadores

  Más: <link="https://bullethero.space/es/docs/editor/workflow/not-losing-work"><color=#59A6FF>No perder tu trabajo</color></link>
hint_level_rules_header: "Reglas"
hint_level_shape-editor_body: |-
  Construye una forma con puntos y las aristas entre ellos. <b>Los triángulos se deducen, nunca se editan</b>, así que una esquina compartida por tres triángulos es un solo punto que arrastrar

  <color=#E8B04B><b>Advertencia:</b></color> el formato guarda triángulos, no aristas - una arista que no cierra ningún contorno se descarta al guardar, y el editor lo avisa

  Más: <link="https://bullethero.space/es/docs/editor/resources/images-and-fonts"><color=#59A6FF>Imágenes y fuentes</color></link>
hint_level_shape-editor_header: "Editor de formas"
hint_level_theme-editor_body: |-
  Las ranuras que ofrece un tema y los colores que las llenan

  <color=#E86A5A><b>Precaución:</b></color> las ranuras son a lo que apunta el contenido del nivel, así que <b>renumerarlas recolorea todo lo que las referencia</b> - la posición de una ranura es su identidad

  <color=#5EC8C8><b>Consejo:</b></color> guarda un tema terminado en la biblioteca compartida del dispositivo para reutilizarlo en otros niveles

  Más: <link="https://bullethero.space/es/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>Color, temas y posprocesado</color></link>
hint_level_theme-editor_header: "Editor de temas"
hint_menu_level-ai: "El autor declaró que el nivel, su portada o uno de sus recursos se generó con IA. Los desarrolladores no lo comprueban - un nivel lleva lo que su autor haya escrito"
hint_menu_level-authors: "Quién hizo este nivel, tal como lo indican sus propios metadatos. El botón Autores abre la lista completa con enlaces"
hint_menu_level-bot_body: |-
  <b>Un bot juega el nivel por ti, con tus propios controles.</b> Se mueve, hace dash, recibe daño y muere como lo harías tú, y no puede hacer trampas: la misma velocidad, el mismo dash, la misma hitbox

  <b>Reflex Bot v1</b> mira 1.5 segundos hacia delante y esquiva lo que ve, recalculándolo en cada fotograma. No necesita preparación, así que la partida empieza al momento. Lo que lo rompe es un patrón en el que había que entrar un segundo antes

  <b>Warm Bot v1</b> calcula su ruta por todo el nivel antes de que empiece la partida y busca no recibir ningún daño

  <color=#E8B04B><b>Advertencia:</b></color> esa ruta es una etapa de carga extra, y puede tardar decenas de segundos. Puedes cancelarla y jugar el nivel tú

  <b>No garantiza que el nivel se supere.</b> Un bot nunca se cansa, pero aun así pierde. Además consume rendimiento en cada fotograma, así que espera menos fotogramas por segundo en un dispositivo poco potente

  Un nivel que derrota a un bot merece que lo envíes: abre un issue en <link="https://github.com/bullet-hero/releases/issues"><color=#59A6FF>bullet-hero/releases</color></link>, di qué bot perdió y dónde, y adjunta la carpeta del nivel

  Más: <link="https://bullethero.space/es/docs/editor/workflow/bot-playtest"><color=#59A6FF>Dejar que un bot juegue tu nivel</color></link>
hint_menu_level-bot_header: "Bots"
hint_menu_level-checkpoints: "Si la partida cuenta los checkpoints que puso el autor. Activado: una muerte rebobina el nivel hasta el último alcanzado y te devuelve las vidas. Desactivado: vuelve al inicio. Las partidas con y sin ellos guardan récords separados"
hint_menu_level-identity: "Qué nivel es realmente: el origen donde se encontró, el ID con el que se archivan sus estadísticas y la carpeta que lo contiene cuando esa carpeta no lleva el nombre del ID. Un nivel integrado y una copia que hiciste de él comparten todos los demás datos de esta pantalla y se diferencian en estos"
hint_menu_level-lives: "Cuántos impactos aguanta la partida. En Zen los golpes y los empujones siguen llegando, solo que la partida nunca termina. \"A medida\" acepta cualquier número que alcance el control deslizante. \"Sin colisiones\" es aparte: nada te toca, y esas partidas guardan sus propios récords"
hint_menu_level-music: "Quién escribió la música, tal como lo registran los metadatos del nivel. El botón Licencias reúne todos los demás recursos que lleva el nivel"
hint_menu_level-no-collision: "El avatar atraviesa todo, así que nada puede golpearlo. Es distinto de Zen, donde los impactos siguen llegando y la partida simplemente nunca termina. Las partidas sin colisión guardan sus propios récords"
hint_menu_level-rating: "La clasificación por edad que declaró el autor. Los desarrolladores no la comprueban - un nivel lleva lo que su autor haya escrito"
hint_menu_level-record: "Tu propio historial con este nivel, para las opciones de inicio elegidas ahora a la derecha. Cambia las vidas, la velocidad, los checkpoints, el bot o \"Sin colisiones\" y el récord cambia con ellos: una partida en otras condiciones es otro logro, así que cada combinación guarda su mejor marca. Los intentos y los completados cuentan cada partida sea cual sea la configuración"
hint_menu_level-seed: "El número del que sale cada valor aleatorio del nivel. La misma semilla da la misma partida en cualquier dispositivo, y 0 significa que el nivel saca una nueva cada vez"
hint_menu_level-speed: "A qué velocidad se reproducen el nivel y su música. \"A medida\" acepta cualquier velocidad que alcance el control deslizante, no solo los tres presets"
hint_mod_content_remover_body: |-
  Elimina el contenido del nivel que coincide con lo que selecciones aquí

  <color=#E86A5A><b>Precaución:</b></color> reescribe lo que ya existe en vez de añadir, así que lee los parámetros antes de ejecutarlo: el paso de deshacer es uno, pero es el único camino de vuelta

  Más: <link="https://bullethero.space/es/docs/editor/workflow/reuse"><color=#59A6FF>Reutilización: prefabs, copia, generadores</color></link>
hint_mod_content_remover_header: "Eliminar contenido"
hint_mod_framerate_remap_body: |-
  Reescala cada número de fotograma del nivel a otra frecuencia de fotogramas, para que los tiempos caigan en el mismo segundo que antes

  <color=#E8B04B><b>Advertencia:</b></color> los fotogramas son números enteros, así que todo lo que no se divide exactamente se redondea - no está garantizado que un nivel reescalado dos veces vuelva a donde empezó

  Más: <link="https://bullethero.space/es/docs/editor/basics/frames-and-time"><color=#59A6FF>Fotogramas, tiempo y duración de un nivel</color></link>
hint_mod_framerate_remap_header: "Cambiar frecuencia de fotogramas"
hint_mod_prefab_flatten_body: |-
  Convierte cada colocación de prefab de este ámbito en objetos normales. El vínculo con la plantilla desaparece, los objetos se quedan exactamente donde estaban

  <color=#B48CE0><b>Conviene saber:</b></color> el nivel se ve igual después - no se elimina ni se mueve nada, y las sobrescrituras de cada colocación ya están escritas en los objetos. Las plantillas se quedan en el nivel salvo que pidas quitarlas

  Más: <link="https://bullethero.space/es/docs/editor/reference/modifiers"><color=#59A6FF>Modificadores</color></link>
hint_mod_prefab_flatten_header: "Aplanar prefabs"
hint_mod_quantize_keyframes_body: |-
  Ajusta los fotogramas clave a un paso regular, que es como una animación suelta colocada a mano se lleva al pulso

  <color=#E8B04B><b>Advertencia:</b></color> dos fotogramas clave que caen en el mismo fotograma se funden en uno, así que cuantizar con un paso grueso pierde detalle en vez de comprimirlo

  Más: <link="https://bullethero.space/es/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>Ritmo y estructura</color></link>
hint_mod_quantize_keyframes_header: "Cuantización de fotogramas clave"
hint_mod_span_fit_body: |-
  Hace que los tiempos de vida de los hijos quepan dentro de los de sus padres, ya sea recortando a los hijos o ampliando a los padres

  <color=#B48CE0><b>Conviene saber:</b></color> un hijo que sobresale es un dato válido que simplemente se reproduce recortado, así que esto es una decisión de contenido y no una reparación - por eso nada lo ejecuta por ti. Las anclas no se tocan en ningún caso

  Más: <link="https://bullethero.space/es/docs/editor/basics/frames-and-time"><color=#59A6FF>Fotogramas, tiempo y duración de un nivel</color></link>
hint_mod_span_fit_header: "Encajar tramos"
hint_mod_span_stagger_body: |-
  Desplaza una selección en el tiempo para que los objetos que empezaban juntos lleguen uno tras otro

  Más: <link="https://bullethero.space/es/docs/editor/workflow/reuse"><color=#59A6FF>Reutilización: prefabs, copia, generadores</color></link>
hint_mod_span_stagger_header: "Escalonar"
hint_mod_test_rename_body: "Un generador de desarrollo para las rutas de renombrado. No está pensado para crear contenido"
hint_mod_test_rename_header: "Renombrar (prueba)"
hint_sandbox_attacks-auto: "Oleadas aleatorias por sí solas, como en el fondo del menú principal"
hint_sandbox_attacks-fire: "Cada botón te lanza una oleada de ese ataque"
hint_sandbox_attacks-gap: "Segundos entre dos oleadas mientras llegan por sí solas"
hint_sandbox_controls-gyro: "Activa el sensor de movimiento como dispositivo de control"
hint_sandbox_controls-mode: "El modo del dispositivo con el que controlas ahora mismo - se guarda al instante y se aplica en todo el juego"
hint_sandbox_game-bot: "Cede el avatar al bot que juega en el fondo del menú principal"
hint_sandbox_game-free-camera: "Desplaza la vista con el botón central del ratón o con dos dedos, haz zoom con la rueda o pellizcando. El marco muestra lo que ve la cámara del nivel"
hint_sandbox_game-lives: "Impactos antes de una muerte. Una muerte se desarrolla como en un nivel y devuelve el avatar al centro"
hint_sandbox_game-speed: "Ralentiza o acelera solo los ataques - el avatar mantiene su propia velocidad"
hint_sandbox_tutorial_body: |-
  Seis pasos por los controles. Cada uno comprueba lo que de verdad hiciste. Un impacto o una muerte solo hacen retroceder el paso en el que ocurrieron y lo ponen en rojo hasta que lo superes

  Elige un paso para jugarlo, también uno ya superado. El tutorial solo cuenta como terminado cuando se superan todos los pasos

  <color=#E8B04B><b>Advertencia:</b></color> en modo <b>inmortal</b> los impactos no cuentan, así que el tutorial tampoco los ve

  Más: <link="https://bullethero.space/es/docs/game/sandbox"><color=#59A6FF>Sandbox y tutorial</color></link>
hint_sandbox_tutorial_header: "Tutorial"
hint_settings_audio: "Volumen general, lo que reproduce un nivel en el juego y en el editor, y los sonidos propios de la interfaz fuera y dentro del editor de niveles"
hint_settings_audio-editor-game: "Volumen de lo que reproduce un nivel dentro del editor - el mismo nivel por el mismo camino, pero escuchado durante horas en lugar de una vez, así que el volumen del juego se queda como está"
hint_settings_audio-editor-ui: "Volumen de los sonidos propios del editor de niveles. Solo anuncia el resultado de una edición - un guardado, un rechazo, un deshacer, una eliminación - nunca una pulsación normal"
hint_settings_audio-game: "Volumen de lo que reproduce un nivel - su música y sus sonidos"
hint_settings_audio-ui: "Volumen de la interfaz fuera del editor de niveles: menús, exploradores de niveles, configuración"
hint_settings_audio-volume: "Volumen general. Todo lo demás se escala según él"
hint_settings_controls_body: |-
  Cómo diriges al jugador, por tipo de dispositivo - teclado y ratón, pantalla táctil, gamepad y giroscopio del dispositivo

  <color=#B48CE0><b>Conviene saber:</b></color> varios tipos pueden estar activos a la vez - dirige el que tocaste <b>el último</b>, y el dash o la pausa funcionan desde cualquiera de ellos

  <color=#5EC8C8><b>Consejo:</b></color> el giroscopio está en reposo con el teléfono <b>en plano</b>, con la pantalla hacia arriba - inclínalo para moverte, y sube la <b>sensibilidad</b> si tienes que inclinarlo demasiado

  Más: <link="https://bullethero.space/es/docs/game/controls"><color=#59A6FF>Controles</color></link>
hint_settings_controls_header: "Controles"
hint_settings_game-editor-autosave: "Escribe una copia del nivel a intervalos regulares. Nunca sobrescribe tu nivel guardado - las copias son una red de seguridad, no un guardado"
hint_settings_game-editor-autosave-rate: "Segundos entre copias automáticas"
hint_settings_game-editor-camera-invert: "Si arrastrar mueve el nivel junto con el puntero o, al contrario, mueve la cámara. Cada opción le parece la natural a alguien"
hint_settings_game-editor-camera-max-size: "Cuánto puede alejarse la vista del editor"
hint_settings_game-editor-camera-min-size: "Cuánto puede acercarse la vista del editor"
hint_settings_game-editor-camera-sensitivity-x: "Cuánto se desplaza la vista en horizontal por cada unidad de movimiento del puntero"
hint_settings_game-editor-camera-sensitivity-y: "Cuánto se desplaza la vista en vertical por cada unidad de movimiento del puntero"
hint_settings_game-editor-camera-wheel-multiplier: "Cuánto zoom aplica cada muesca de la rueda"
hint_settings_game-editor-camera-zoom-to-mouse: "Hace zoom hacia el cursor en lugar de hacia el centro de la vista. Desactivado, el centro se queda quieto mientras haces zoom"
hint_settings_game-editor-create-shape-size-x: "Ancho con el que empieza una forma nueva, antes de cualquier escala propia"
hint_settings_game-editor-create-shape-size-y: "Alto con el que empieza una forma nueva, antes de cualquier escala propia"
hint_settings_game-editor-create-text-size-x: "Ancho del bloque en el que un texto nuevo distribuye sus glifos, no el tamaño de los glifos"
hint_settings_game-editor-create-text-size-y: "Alto del bloque en el que un texto nuevo distribuye sus glifos, aproximadamente una línea por unidad"
hint_settings_game-editor-effects-active-default: "Si los efectos de posprocesado del nivel se previsualizan al abrir el editor. Es solo el estado inicial - desactivarlos mientras trabajas nunca lo cambia. En un teléfono empiezan desactivados, porque el posprocesado es lo más costoso que dibuja el editor"
hint_settings_game-editor-gizmos-scale: "Tamaño con el que se dibujan las asas de arrastre en la vista. Un asa pensada para el ratón es difícil de acertar con el pulgar"
hint_settings_game-editor-grid-active-default: "Si la cuadrícula de la vista ya está activada al abrir el editor. Es solo el estado inicial - desactivarla mientras trabajas nunca lo cambia"
hint_settings_game-editor-grid-opacity: "Cuánto se ve la cuadrícula. Una cuadrícula demasiado tenue para leerse no se dibuja en absoluto"
hint_settings_game-editor-grid-size: "La separación de la cuadrícula de la vista, en unidades del nivel"
hint_settings_game-editor-history-length: "Cuántos pasos de edición guarda la sesión antes de descartar la rama más antigua. Más cuesta memoria y nada más"
hint_settings_game-editor-history-objects: "Objetos que el historial guarda además de ese número de pasos. Un borrado masivo es un solo paso con 50 000 objetos, y eso es lo que detecta este límite. 0 quita el límite, por debajo de 0 decide el dispositivo"
hint_settings_game-editor-interface-dirty-field-delay: "Cuánto espera un campo del inspector tras tu última pulsación de tecla antes de aplicar el valor. Cero aplica cada pulsación y hace que cada una se pueda deshacer"
hint_settings_game-editor-interface-levels-layout: "Cómo se abre el explorador de niveles en el editor: una lista de filas con descripciones o una cuadrícula de portadas. El botón junto al campo de búsqueda lo sigue cambiando hasta que cierres el editor"
hint_settings_game-editor-interface-log-clamps: "Avisa en la consola cuando un valor que escribiste se devolvió a su rango permitido. El límite se aplica de todos modos"
hint_settings_game-editor-interface-rotation-unit: "La unidad en la que se muestran y se escriben los campos de rotación. Los ángulos se guardan siempre en radianes de todos modos"
hint_settings_game-editor-level-serialize-mode: "El formato de archivo en el que se escribe un nivel. <b><color=#D4B483>Json</color></b> es texto - legible y reparable a mano. <b><color=#D4B483>Blob</color></b> es binario - se carga decenas de veces más rápido, y es casi irreparable una vez dañado"
hint_settings_game-editor-max-autosave-files: "Cuántas copias se conservan. La más antigua se descarta al llegar al límite"
hint_settings_game-editor-mcp-enabled: "Permite que un asistente de IA compatible con MCP se conecte a este editor y edite el nivel abierto. Solo puede conectarse este equipo, y todo lo que hace la IA en un lote es un único paso en el historial"
hint_settings_game-editor-mcp-follow-ai: "Adónde va el cabezal después de que la IA mire un fotograma. Desactivado: vuelve a donde lo dejaste. Activado: se queda en el fotograma que miró la IA, en pausa. Si tocas la línea de tiempo mientras la IA mira, el cabezal se queda donde lo pusiste"
hint_settings_game-editor-mcp-operation-delay: "Cuánto espera el editor entre dos operaciones de la IA, para que puedas seguirlas. <b><color=#D4B483>0</color></b> aplica cada una al instante. Reproducir, pausar y mover el cabezal nunca se retrasan. De 0 a 5"
hint_settings_game-editor-mcp-port: "El puerto en el que escucha el editor. <b><color=#D4B483>0</color></b> elige uno libre en cada inicio. Si no, <b><color=#D4B483>1024-65535</color></b>"
hint_settings_game-editor-mcp-reveal-edits: "Tras cada edición de la IA, selecciona y localiza lo que creó o cambió. Nunca mientras arrastras, escribes o reproduces"
hint_settings_game-editor-multi-select-requires-hold: "Si añadir a una selección requiere mantener pulsado a propósito. Activado es más seguro en pantallas táctiles, donde si no un toque accidental cambia lo seleccionado"
hint_settings_game-editor-pick-invisible-aabb: "Permite que un clic seleccione un objeto que no dibuja nada. Hace falta para las paredes invisibles, que tienen hitbox y no tienen forma"
hint_settings_game-editor-player-active-default: "Si el jugador de prueba ya está presente al abrir el editor. En pantallas táctiles también ocupa la vista, así que en un teléfono normalmente conviene desactivarlo"
hint_settings_game-editor-player-bot: "Cede el jugador de prueba a <color=#D4B483>Reflex Bot v1</color> en lugar de a ti. Es el único bot que se ofrece aquí, porque no necesita nada preparado de antemano y sigue funcionando mientras editas - a cualquier velocidad de reproducción, hacia atrás incluida. Juega con las mismas reglas que tú: recibe daño y puede quedar acorralado. Justo después de arrastrar el cabezal juega peor durante un momento, mientras reconstruye lo que sabe del futuro. Elegir entre bots corresponde a una partida, en la pestaña Jugar de esta pantalla"
hint_settings_game-editor-player-bot-debug: "El interruptor general de las superposiciones de diagnóstico del bot. Desactivado por defecto. Todo lo que hay debajo está activado, así que al activarlo ves todo el panorama de una vez"
hint_settings_game-editor-player-bot-debug-grid: "Dibuja cuánto espacio cree el bot que tiene cada parte de la pantalla, en el peor caso de todo lo que ve por delante. El rojo es un lugar donde espera recibir un impacto. No se dibuja nada donde se considera a salvo"
hint_settings_game-editor-player-bot-debug-reach: "Dibuja hasta dónde cree el bot que puede llegar antes del final de la ventana que planifica - el anillo interior caminando, el exterior gastando el dash. Nunca elige un objetivo fuera de ellos"
hint_settings_game-editor-player-bot-debug-target: "Dibuja el punto hacia el que se dirige ahora el bot. Mantiene una elección hasta que aparece otra claramente mejor, así que un objetivo que deja de moverse significa que el bot está satisfecho, no atascado"
hint_settings_game-editor-player-reset-gizmos: "Quita el modo de gizmo activo al activar el jugador de prueba, para que no quede un asa de arrastre bajo tu dedo"
hint_settings_game-editor-preview-collider-on-select: "Muestra la hitbox de un objeto seleccionado. Aquí lo que se dibuja y lo que recibe impactos son cosas distintas, así que pueden no coincidir"
hint_settings_game-editor-publish-language: "En qué idioma se publican primero el título y la descripción de un artículo del Workshop. <b><color=#D4B483>Inglés</color></b>, o <b><color=#D4B483>Del sistema</color></b> - el idioma del propio dispositivo"
hint_settings_game-editor-resources-serialize-mode: "La misma elección para los recursos que lleva un nivel"
hint_settings_game-editor-selection-collider-opacity: "Con qué opacidad se dibuja la hitbox de un objeto seleccionado"
hint_settings_game-editor-selection-collider-opacity-view: "Lo mismo para el modo que muestra todas las hitbox a la vez - más tenue, porque allí se solapan cientos de ellas"
hint_settings_game-editor-selection-long-press-delay: "Cuánto hay que mantener pulsada una fila o un clip antes de entrar en la selección múltiple. Súbelo si las selecciones ocurren por accidente"
hint_settings_game-editor-selection-long-press-threshold: "Cuánto puede desviarse el puntero durante esa pulsación antes de que cuente como arrastre. Súbelo si te tiembla la mano"
hint_settings_game-editor-timeline-edge-handle: "El ancho del borde de un clip que cambia su tamaño. Desde el resto, el clip se desliza entero"
hint_settings_game-editor-timeline-loop-global: "Si el cabezal vuelve al principio al llegar al final del nivel en lugar de detenerse"
hint_settings_game-editor-timeline-loop-local: "Lo mismo para la línea de tiempo local, que repite el tiempo de vida de un solo objeto"
hint_settings_game-editor-timeline-snap-threshold: "A qué distancia debe quedar un borde arrastrado para ajustarse a un fotograma candidato"
hint_settings_game-editor-timeline-time-format: "En qué cuentan la regla de una línea de tiempo y el indicador del cabezal. No cambia nada en el nivel - se direcciona el mismo fotograma en cualquier caso. \"Compases y pulsos\" lee la cuadrícula de pulsos del propio nivel y recurre a un código de tiempo donde la cuadrícula no tiene segmento"
hint_settings_game-editor_body: |-
  <b>Autoguardado</b> guarda el nivel con un temporizador y escribe una copia de seguridad cada vez. <b>Máx. archivos de autoguardado</b> limita cuántas copias se conservan

  <b>Tamaño mín. de cámara</b> y <b>Tamaño máx. de cámara</b> limitan el zoom de la vista. <b>Multiselección al mantener</b> y <b>Seleccionar AABB invisible</b> cambian lo que significa un clic en la vista

  Los dos campos de formato, <b>Formato del nivel</b> y <b>Formato de recursos</b>, fijan el formato predeterminado para escribir en disco

  Más: <link="https://bullethero.space/es/docs/editor/workflow/speed-and-shortcuts"><color=#59A6FF>Velocidad y atajos</color></link>
hint_settings_game-editor_header: "Editor del juego"
hint_settings_general: "El idioma y cuántos recursos carga el juego a la vez. Si <b>Idioma</b> se deja vacío, sigue al dispositivo"
hint_settings_general-language: "Idioma de la interfaz. Si se deja vacío, sigue al dispositivo. No afecta al texto propio de un nivel, que lo lleva el propio nivel"
hint_settings_general-resource-parallel-load-count: "Cuántos archivos de un nivel se cargan a la vez. Un valor más alto termina antes en un disco rápido y puede dar tirones en uno lento"
hint_settings_general-resource-web-timeout: "Cuánto esperar a un archivo descargado por la red antes de rendirse, en segundos"
hint_settings_general-show-all-found-content: "Muestra también el contenido que un origen encontró pero no puede confirmar que sea tuyo - los archivos de un artículo del Workshop sin suscripción, o una carpeta copiada a mano. Esos niveles se marcan en su tarjeta. Desactivado, un origen solo muestra lo que puede garantizar"
hint_settings_graphics-antialiasing-hdr: "Valores de color por encima de 1. Aquí nada los necesita, y duplica el ancho de banda de memoria, por eso viene desactivado"
hint_settings_graphics-antialiasing-msaa: "Cuántas muestras toma <color=#D4B483>MSAA</color> por píxel. Más es más suave y cuesta más, y el coste crece cuanto más contenido transparente se solapa"
hint_settings_graphics-antialiasing-type: "Cómo se eliminan los dientes de sierra de los bordes. <b><color=#D4B483>MSAA</color></b> los resuelve con exactitud, porque aquí cada forma es geometría real. <b><color=#D4B483>FXAA</color></b> cuesta una pasada haga lo que haga la escena, y ese es el compromiso al que se enfrenta un teléfono poco potente"
hint_settings_graphics-audio-pitch-correction: "Cuánto se fuerza la velocidad del audio para alcanzar a la simulación. Un valor más alto corrige antes y se nota más al oído"
hint_settings_graphics-audio-render: "Si se reproduce el audio del nivel. Si está desactivado, todos los niveles se reproducen sin sonido y las opciones de audio de abajo dejan de influir - pensado para un dispositivo al que hasta el propio sonido le pesa demasiado"
hint_settings_graphics-audio-render-effects: "Aplicar los efectos de audio de la pista mientras editas. Si está desactivado, oyes el clip sin procesar"
hint_settings_graphics-audio-resync-jump-time: "Cuánto pueden separarse el audio y la simulación antes de que el audio salte de vuelta a su sitio en lugar de corregirse poco a poco"
hint_settings_graphics-audio-scrub-time: "Cuánto dura el fragmento que se oye al arrastrar el cabezal por la pista"
hint_settings_graphics-audio-sync-dead-zone: "Una desviación menor que esta se ignora. Sin zona muerta, el audio se corregiría constantemente y se notaría al oído"
hint_settings_graphics-audio-use-scrub: "Reproducir el audio bajo el cabezal mientras lo arrastras, para encontrar un momento de oído"
hint_settings_graphics-avatar-render: "El cuerpo del avatar es una cuadrícula de 25 cuadrados, y al perder salud se apagan del borde hacia dentro siguiendo unas pocas grietas - así una partida que va mal se ve en el propio jugador y no en una barra. Un cuadrado perdido queda como un fantasma pálido, y el anillo de la hitbox que hay debajo se ve a través de él. Si está desactivado, la cuadrícula pasa a ser un solo cuadrado y la salud lo desvanece: la misma lectura, un objeto en lugar de 25, para un dispositivo que prefiere no dibujarlos"
hint_settings_graphics-colliders-mode-active: "Un modo para practicar. Un nivel que juegas dibuja cada hitbox como un relleno plano sobre un fondo liso y nada más: desaparecen las decoraciones, los textos, los efectos, el posprocesado y el fondo del tema. Se queda todo lo que decide la partida - la música, la colisión, la cámara y su sacudida, los checkpoints, el HUD y las estadísticas - y una partida aquí cuenta como cualquier otra. Solo afecta a la pantalla de juego: el editor y el sandbox se dibujan como siempre"
hint_settings_graphics-colliders-mode-background: "Lo que se dibuja detrás de los rellenos. Es gris oscuro y no negro a propósito: las barras alrededor del encuadre de la cámara son negras, y sobre un fondo negro no se vería dónde acaba el encuadre del nivel"
hint_settings_graphics-colliders-mode-color: "Con qué rellena el modo las hitbox. La vista de colisionadores del editor toma el mismo tono con su propia opacidad, así que los dos siempre coinciden. \"Restablecer gráficos\" devuelve el rojo inicial"
hint_settings_graphics-colliders-mode-use-alpha: "Si está activado, los rellenos son translúcidos según el alfa del color, así que dos peligros superpuestos se leen como una mancha más oscura. Si está desactivado, cada relleno es sólido - más fácil de leer en una pantalla pequeña, pero las superposiciones se funden en una sola forma. En el juego el alfa nunca baja de 0.15, porque algo más tenue no se ve"
hint_settings_graphics-effects-fixed-framerate: "La frecuencia a la que se simulan los efectos, independientemente de cada cuánto se dibujan"
hint_settings_graphics-effects-frame-step-budget: "Cuántos pasos de efectos puede gastar un solo fotograma, para que ponerse al día nunca cueste un parón visible"
hint_settings_graphics-effects-framerate-target: "Cada cuánto se dibujan los efectos. Por debajo de la frecuencia del propio juego es un ahorro barato, porque las partículas se leen bien con un paso más grueso"
hint_settings_graphics-effects-max-scrub-time: "Cuánto historial de efectos vuelve a reproducir el editor cuando saltas con el cabezal. Más largo es más preciso y más lento"
hint_settings_graphics-effects-render: "Si se dibujan los efectos de partículas. Enriquecen un nivel, pero ningún nivel depende de ellos, así que renunciar a ellos es seguro"
hint_settings_graphics-effects-replay-step-budget: "Cuántos pasos de simulación puede gastar un recálculo. Ese límite es lo que impide que un salto a una sección densa congele el editor"
hint_settings_graphics-fixed-framerate: "El límite que mantiene el juego mientras \"Frecuencia objetivo\" está en \"Fija\" - cada cuánto se redibuja la pantalla, y nada más. Un nivel se simula contra el tiempo real, así que la misma partida se juega igual a 30 y a 144. Se ignora mientras VSync está activada"
hint_settings_graphics-framerate-target: "Fotogramas por segundo a los que apunta el juego. Se aplica directamente y no a través de la sincronización vertical"
hint_settings_graphics-postprocessing-render: "El interruptor general de todos los efectos de cámara de abajo. Si está desactivado, se omite toda la cadena"
hint_settings_graphics-postprocessing-render-analog-glitch: "Interferencias analógicas: bandas que se desplazan, líneas de barrido rasgadas, sangrado de color"
hint_settings_graphics-postprocessing-render-bloom: "Las zonas brillantes derraman luz sobre lo que las rodea"
hint_settings_graphics-postprocessing-render-chroma: "Los canales de color se separan hacia los bordes de la pantalla, como en una lente barata"
hint_settings_graphics-postprocessing-render-color-curves: "Curvas de color por canal, para una corrección de color fina"
hint_settings_graphics-postprocessing-render-digital-glitch: "Corrupción digital: bloques desplazados, como si los fotogramas estuvieran dañados"
hint_settings_graphics-postprocessing-render-grain: "Grano de película sobre la imagen"
hint_settings_graphics-postprocessing-render-lens: "La imagen se curva como la curvaría una lente real"
hint_settings_graphics-postprocessing-render-lift-gamma-gain: "Corrección de color dividida en tres zonas: sombras, medios tonos y luces"
hint_settings_graphics-postprocessing-render-motion-blur: "El movimiento rápido se emborrona. Conviene desactivarlo si hace que las balas se lean peor"
hint_settings_graphics-postprocessing-render-shadows-midtones-highlights: "Las mismas tres zonas otra vez, teñidas por separado en lugar de elevadas"
hint_settings_graphics-postprocessing-render-vignette: "Los bordes de la pantalla se oscurecen y llevan la atención al centro"
hint_settings_graphics-postprocessing-render-white-balance: "Desplaza lo que se considera blanco, calentando o enfriando toda la imagen"
hint_settings_graphics-render-scale: |-
  Cuántos píxeles renderiza el propio juego antes de escalar el resultado a la ventana

  Por debajo de 1 el juego dibuja menos píxeles y los estira - lo más eficaz que se puede bajar en un equipo poco potente, porque el coste por fragmento cae con el <b>cuadrado</b> del valor. Por encima de 1 renderiza a mayor tamaño y reduce el resultado, que es supermuestreo

  La interfaz se dibuja en su propio destino a tamaño completo en cualquier caso, así que el texto y los botones siguen nítidos sea cual sea este valor. El número multiplica la escala con la que ya viene esta clase de dispositivo en lugar de sustituirla
hint_settings_graphics-resolution: |-
  El tamaño de la ventana del juego en píxeles, elegido entre los modos que esta pantalla declara de verdad - así que desde aquí no se puede pedir un modo que el monitor no pueda mostrar

  También es la forma de cambiar la orientación en escritorio: una resolución más alta que ancha pone la interfaz en la misma disposición vertical que recibe un teléfono sostenido en vertical. Un monitor no se puede girar desde dentro del juego, así que esto y el tamaño de la ventana son las únicas palancas que hay

  Si no lo tocas, se usa la resolución propia de la pantalla
hint_settings_graphics-textures-compression: "Empaqueta las imágenes en un formato <color=#D4B483>comprimido</color> al cargar. Entre cuatro y ocho veces menos memoria, y artefactos de bloque donde un degradado o un borde duro coincide con un bloque de 4x4. Se lee al cargar un nivel, no mientras hay uno abierto"
hint_settings_graphics-textures-compression-quality: "Tiempo de carga frente a artefactos de compresión. La imagen acaba con el mismo tamaño en cualquier caso, y los teléfonos lo ignoran por completo"
hint_settings_graphics-textures-filtering: "Cómo se muestrean las imágenes al dibujarlas, y nada más - reducir una imagen lo decide lo que su autor dijo que es, no esto"
hint_settings_graphics-textures-mipmaps: "Copias reducidas de cada imagen, para que una imagen dibujada pequeña deje de parpadear al moverse. Un tercio más de memoria, y la única cura para ese parpadeo"
hint_settings_graphics-textures-size-limit: "El límite de lo grande que puede ser una imagen en memoria en este dispositivo. La memoria cae con el CUADRADO del lado, así que esto ahorra más que la compresión, y es la única de las tres opciones que pone un tope a lo que un nivel puede costar"
hint_settings_graphics-vsync: |-
  Si el juego espera al refresco de la pantalla antes de mostrar un fotograma

  <b>Desactivada</b> muestra cada fotograma en cuanto está listo. Nada espera, así que la entrada llega a la pantalla en la primera ocasión - y un fotograma terminado a mitad de refresco se dibuja a medias sobre el anterior, que es el desgarro de imagen (tearing)

  <b>Activada</b> presenta una vez por refresco, así que el desgarro desaparece y cada fotograma cuesta hasta un refresco de latencia extra. <b>Mitad de frecuencia</b> presenta una vez cada dos refrescos - más estable en un equipo que no sostiene la frecuencia completa, con el doble de esa latencia

  Mientras no esté en Desactivada, Unity ignora por completo el límite de frecuencia de fotogramas de arriba, así que esas dos filas aparecen en gris

  Un teléfono presenta los fotogramas a su propio ritmo, y allí esto no hace nada
hint_settings_graphics-window-mode: |-
  Cómo ocupa la pantalla la ventana del juego

  <b>En ventana</b> es el único modo cuyo tamaño puedes cambiar libremente, y cambiar el tamaño es lo que cambia la proporción del juego - arrastra la ventana hasta que sea más alta que ancha y toda la interfaz pasa a su disposición vertical, exactamente como haría un teléfono sostenido en vertical

  <b>Ventana sin bordes</b> es el modo predeterminado: la pantalla llena, sin cambio de modo y con alt-tab instantáneo. <b>Pantalla completa exclusiva</b> entrega la pantalla entera al juego, lo que es ligeramente más rápido y más lento de abandonar

  Un teléfono tiene una sola ventana y es la pantalla, así que allí esto no hace nada
hint_settings_graphics_body: |-
  <b>Antialiasing.</b> <color=#D4B483>MSAA</color> es el predeterminado porque cada forma de este juego es geometría real, así que cada borde con dientes de sierra es un borde geométrico real - el único caso que el multimuestreo resuelve con exactitud, a nitidez completa, en todas las plataformas. <b><color=#D4B483>FXAA</color></b> es la alternativa para teléfonos menos potentes: cuesta una pasada a pantalla completa por mucho sobredibujado que tenga el nivel, mientras que el coste de <color=#D4B483>MSAA</color> crece con el sobredibujado transparente. <b>TAA no se ofrece a propósito</b> - la estela detrás de las balas rápidas es un problema de legibilidad en este género, y su temblor choca con los efectos de glitch

  <b>Frecuencia de fotogramas.</b> El objetivo se aplica manualmente y no a través de la sincronización vertical. La frecuencia de fotogramas fija separa la simulación de la pantalla, y eso es lo que mantiene idénticos los tiempos de un nivel en una pantalla de 60 Hz y en una de 144 Hz

  <color=#7FC97F><b>Recomendación:</b></color> una <b>escala de renderizado</b> por debajo de 1 es lo más barato a lo que renunciar cuando a un dispositivo le cuesta: cuesta nitidez y nada más

  Más: <link="https://bullethero.space/es/docs/editor/performance/mobile-devices"><color=#59A6FF>Dispositivos móviles</color></link>
hint_settings_graphics_header: "Gráficos"
hint_settings_interface: "El panel de estadísticas y dónde se sitúa. Se dibuja sobre cualquier pantalla y sirve para diagnosticar el rendimiento, no para jugar con él"
hint_settings_interface-alert-on-exception: "Si un error no controlado abre la ventana del informe. El informe se genera, se registra y se guarda en cualquier caso - esto solo decide si te interrumpe, y eso importa sobre todo en mitad de una partida. Si está desactivado, el último informe sigue en el registro del juego y, con <b>Guardar informe</b>, en la carpeta de informes"
hint_settings_interface-hitbox-ring-opacity: "El anillo de puntos del avatar está exactamente sobre su radio de colisión, que es 0.4 frente a un cuerpo de 1 de ancho - la silueta nunca fue la hitbox, y ahora puedes ver dónde está de verdad. El mismo anillo cuenta las vidas: un punto encendido es una vida que aún tienes, uno apagado es una vida que ya gastaste. Este control deslizante solo decide cuánto se ve sobre lo que dibuje el nivel, y 0 lo desactiva por completo - los niveles están equilibrados para quien lo ve"
hint_settings_interface-levels-layout: "Cómo se abre el explorador de niveles del menú: una cuadrícula de portadas o una lista de filas con descripciones. El botón junto al campo de búsqueda sigue cambiándolo hasta que sales"
hint_settings_interface-menu-background: "Lo que el menú reproduce detrás de sus botones. Bot es una arena real - el mismo bot reflex al que se le puede ceder una partida, esquivando peligros que se emiten mientras estás ahí, y puede recibir impactos sin que pase nada. Formas es el campo de formas giratorias de antes y el más pesado de los tres. Ninguno no dibuja nada en absoluto"
hint_settings_interface-open-menu-on-lose: "Qué hace una partida perdida. Si está desactivado, el nivel frena hasta pararse, se rebobina hasta el último checkpoint alcanzado y vuelve a acelerar, sin ninguna ventana de por medio. Si está activado, la reproducción se detiene y se abre la ventana de resultados"
hint_settings_interface-screen-orientation: |-
  <b>Horizontal</b> y <b>Vertical</b> fijan un <b>eje</b>, nunca un lado - da la vuelta al dispositivo y la imagen gira con él, así que se juega en cualquiera de los dos sentidos

  <b>Giro automático</b> no fija nada: la pantalla sigue al dispositivo. Con un nivel que no indica una orientación propia, puedes girar el teléfono en mitad de una partida y tanto la interfaz como la cámara lo siguen

  Un nivel puede anular esto mientras se juega. Su autor compuso el contenido para un encuadre con una forma concreta, así que esa elección manda mientras el nivel está en marcha, y al salir se recupera la configuración

  En escritorio nada gira un monitor, así que el control está desactivado y simplemente muestra la forma de tu ventana - cambia su tamaño y esto lo sigue
hint_settings_interface-show-game-interface: "El interruptor general de las dos opciones de arriba y, con ellas, de los controles táctiles en pantalla. Si está desactivado, la pantalla de juego no dibuja nada en absoluto - justo lo que pide una grabación limpia o una captura de pantalla. Nada deja de funcionar: cada control se queda exactamente donde estaba y sigue respondiendo a una pulsación"
hint_settings_interface-show-game-pause: "Si se dibuja el icono de pausa. Se oculta, no se elimina: la misma esquina sigue respondiendo a una pulsación, y Escape o Back en un gamepad abren la ventana de pausa diga lo que diga esto"
hint_settings_interface-show-game-progress: "Si se dibuja la barra de progreso de la partida en la parte inferior de la pantalla de juego. Ocultarla no cambia nada más - los checkpoints que marca siguen funcionando"
hint_settings_interface-stats-active: "Mostrar el panel de diagnóstico sobre cualquier pantalla. Sirve para medir el rendimiento, no para jugar con él"
hint_settings_interface-stats-alignment-x: "Dónde se sitúa el panel en horizontal: 0 es el borde izquierdo, 1 el derecho"
hint_settings_interface-stats-alignment-y: "Dónde se sitúa el panel en vertical: 0 es el borde superior, 1 el inferior"
hint_settings_other: "<b>Restablecer configuración</b> devuelve cada opción de cada pestaña a su valor predeterminado. Solo toca la configuración - tus niveles son archivos en disco y no se ven afectados"
hint_settings_profile: "Todo lo que este dispositivo recuerda sobre cómo se ha jugado y qué se ha construido con el juego. Es local: nada de esto se sube a ningún sitio, y los archivos que hay detrás están junto a los niveles en una carpeta que se puede abrir y leer. Los tiempos son segundos reales y no tiempo del nivel, así que la rampa del checkpoint y una partida a media velocidad cuentan lo que realmente duraron. La fila de dispositivos mide cuál de los cuatro dispositivos de control dirigía la partida mientras se jugaba un nivel, no solo cuál estaba conectado"
hint_settings_profile-transfer_body: |-
  Todo tu perfil en un archivo zip y de vuelta: niveles, estadísticas, configuración, la biblioteca con sus colecciones y, si los marcas, los autoguardados del editor y los informes de errores. Úsalo para pasar a otro dispositivo o para guardar una copia antes de reinstalar

  <b>Reemplazar</b> vacía las partes marcadas y pone en ellas las del archivo. <b>Fusionar</b> añade lo que falta, se queda con la copia más reciente de un nivel que esté en los dos lados y conserva las estadísticas más altas

  <color=#E8B04B><b>Advertencia:</b></color> en un teléfono, desinstalar el juego elimina todo el perfil. Expórtalo antes

  Antes de cualquier importación, el juego guarda lo que va a reemplazar en una única copia de seguridad, que puedes restaurar, guardar en otro sitio o eliminar aquí

  Más: <link="https://bullethero.space/es/docs/game/profile-transfer"><u>Transferencia de perfil</u></link>
hint_settings_profile-transfer_header: "Transferencia de perfil"
hint_settings_suppress-game-saves_body: |-
  Mientras esto está activado, el juego no guarda nada propio: <color=#D4B483>settings.json</color>, las estadísticas globales y las de cada nivel se quedan en el disco tal como están. Una opción que cambies sigue funcionando hasta que se cierre el juego

  Tu trabajo con niveles se sigue guardando como siempre - guardar, exportar, importar, copiar y eliminar niveles, y el autoguardado y las copias de seguridad del editor, que tienen su propio interruptor

  Dura hasta que se cierra el juego y nunca se recuerda. Al desactivarlo se guarda tu configuración actual y se descarta todo lo jugado mientras estaba activado

  <color=#B48CE0><b>Conviene saber:</b></color> también se activa solo. El argumento de inicio <color=#D4B483>--suppress-game-saves</color> lo activa durante toda esa ejecución, y nada dentro del juego puede desactivarlo. Una configuración o unas estadísticas guardadas por una versión más reciente del juego también lo activan, y entonces el juego pregunta en cada inicio si conservarlas o sobrescribirlas con los valores predeterminados
