hint_editor-settings_artist-permission_body: |-
  레벨에 들어가는 모든 외부 리소스(음악, 이미지, 폰트, 텍스트)에는 최소한 <color=#D4B483>CC BY-NC</color>만큼 자유로운 라이선스가 있거나, 공개 비상업적 재배포에 대한 권리자의 허락이 있어야 합니다

  <color=#E86A5A><b>주의:</b></color> 사적으로 받은 "네, 쓰세요"로는 부족합니다. 허락은 개인적인 사용만이 아니라 공개 재배포까지 포함해야 합니다

  레벨이 기기 안에만 있는 동안에는 아무것도 검사하지 않습니다. 검사는 서비스에 올릴 때만 이루어집니다

  자세히: <link="https://bullethero.space/ko/docs/editor/rights/legal-resource-paths"><color=#59A6FF>합법적인 리소스로 가는 두 가지 방법</color></link>, <link="https://bullethero.space/ko/docs/editor/rights/asking-permission"><color=#59A6FF>저작자에게 허락 구하기</color></link>
hint_editor-settings_artist-permission_header: "다른 사람의 작품 사용"
hint_editor-settings_community: "프로젝트의 공식 링크이며 브라우저에서 열립니다. 표시되는 링크는 이 빌드를 받은 곳에 따라 달라지므로, 스토어 빌드에서는 여기보다 적게 표시될 수 있습니다"
hint_editor-settings_create-level_body: |-
  <b>프리셋</b>은 새 레벨이 무엇으로 시작할지 정합니다. 빈 레벨일 수도 있고, 그렇지 않으면 매번 직접 만들어야 했을 작은 기본 골격일 수도 있습니다

  <color=#E86A5A><b>주의:</b></color> <b>파라미터</b>는 나중에 바꾸기 번거로운 값, 즉 프레임 길이와 프레임 레이트를 정합니다

  <color=#5EC8C8><b>팁:</b></color> 두 파일 형식 드롭다운은 레벨과 메타데이터를 디스크에 어떤 형식으로 쓸지 고릅니다. 둘 다 나중에 레벨의 위험 구역에서 바꿀 수 있습니다

  자세히: <link="https://bullethero.space/ko/docs/editor/basics/first-level"><color=#59A6FF>첫 레벨: 경로</color></link>
hint_editor-settings_create-level_header: "레벨 생성"
hint_editor-settings_library_body: |-
  이 기기에 있으면서 레벨에 가져올 수 있는 모든 것입니다: 내 라이브러리, 내 컬렉션, 창작마당에서 구독한 컬렉션. 좁은 열에서 종류를 고르고, 목록 위의 칩에서 출처를 고릅니다

  <b>컬렉션</b>은 이름, 제작자, 라이선스를 가진 모든 종류의 리소스 폴더입니다. 여기서 만들고, 종류별 페이지의 <b>복사</b>로 채운 뒤, 아카이브로 내보내거나 게시합니다

  <color=#5EC8C8><b>팁:</b></color> 창작마당 컬렉션은 읽기 전용입니다. 내용을 바꾸려면 항목을 직접 만든 컬렉션으로 복사합니다

  자세히: <link="https://bullethero.space/ko/docs/editor/reference/library-and-collections"><color=#59A6FF>라이브러리와 컬렉션</color></link>
hint_editor-settings_library_header: "라이브러리"
hint_editor-settings_open-level: "이 기기에서 찾은 레벨입니다. 레벨은 폴더이므로 다른 레벨 옆에 두면 여기에 나타납니다"
hint_editor_beat-segment_body: |-
  템포가 일정한 비트 세그먼트 하나입니다: BPM, 프레임 소수 단위의 위상 오프셋, 마디당 비트 수, 이름, 색상. 여러 개를 선택해도 세그먼트는 하나만 표시됩니다

  <color=#E86A5A><b>주의:</b></color> 세그먼트는 시작 프레임으로 식별되므로 <b>이동하면 다른 세그먼트가 됩니다</b>. 이동한 뒤에는 새 시작 위치에서 다시 선택합니다

  <color=#5EC8C8><b>팁:</b></color> 여기서 탭하면 새 세그먼트를 만드는 대신 선택한 세그먼트의 위상을 다시 맞춥니다

  자세히: <link="https://bullethero.space/ko/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>리듬과 구조</color></link>
hint_editor_beat-segment_header: "비트 세그먼트"
hint_editor_beat-window_body: |-
  제작용 메타데이터이며 <b>재생 중에는 아무것도 이것을 읽지 않습니다</b>. 음악에 맞춰 내용을 배치하는 데 쓰이고, 생성기도 화면에 보이는 것과 같은 비트를 기준으로 동작합니다

  그리드는 <b>비트 세그먼트</b>의 목록이며, 각 세그먼트는 템포가 일정한 부분입니다. 세그먼트 사이에 빈틈이 있어도 됩니다: 타악기가 없는 인트로, 브레이크, 곡이 끝난 뒤의 꼬리 부분

  <color=#5EC8C8><b>팁:</b></color> 트랙에 맞춰 <b>탭</b>을 누른 뒤 <b>탭으로 생성</b>을 누르면, 탭이 첫 탭부터 마지막 탭까지 이어지는 세그먼트 하나가 됩니다

  자세히: <link="https://bullethero.space/ko/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>리듬과 구조</color></link>
hint_editor_beat-window_header: "비트 그리드"
hint_editor_clipboard_body: |-
  타임라인마다 버퍼가 하나씩 있고, 버퍼마다 자체 상태 줄이 있습니다

  <b>텍스트로 복사</b>는 모든 버퍼를 시스템 클립보드에 텍스트로 써서, 선택 항목을 다른 레벨이나 다른 컴퓨터로 옮길 수 있게 합니다. <b>텍스트 붙여넣기</b>는 그 텍스트를 다시 버퍼로 읽어 들이고 <b>거기서 멈춥니다</b>

  <color=#B48CE0><b>참고:</b></color> 직접 고른 타임라인에 붙여넣기 전까지는 레벨에 아무것도 들어가지 않습니다. 어디에 놓일지는 재생 헤드와 활성 범위에 따라 달라집니다

  자세히: <link="https://bullethero.space/ko/docs/editor/workflow/reuse"><color=#59A6FF>재사용: 프리팹, 복사, 생성기</color></link>
hint_editor_clipboard_header: "클립보드"
hint_editor_console: "이번 세션에 에디터가 기록한 모든 것입니다: 레벨 불러오기 보고, 생성기 결과, 가져오기 경고. <b>지우기</b>로 목록을 비웁니다. 톱니바퀴로 표시할 심각도를 거릅니다"
hint_editor_curve-editor: "점을 드래그해서 커브를 편집합니다. 변경 사항은 드래그하는 동안 <b>바로</b> 적용되므로, 보이는 모습이 이미 레벨에 저장된 값입니다. 창을 닫아도 변경 사항은 유지됩니다"
hint_editor_generators_body: |-
  레벨에 대해 실행되는 절차적 콘텐츠이며, 한 번에 실행 취소할 수 있는 하나의 작업으로 적용됩니다

  <color=#B48CE0><b>참고:</b></color> 두 계열이 있습니다. <b>생성기</b>(<i>gen_</i>) 계열은 내용을 만듭니다: 탄환 웨이브, 방사형 패턴, 폰트 캐시. <b>모디파이어</b>(<i>mod_</i>) 계열은 이미 있는 내용을 다시 씁니다: 구간 맞추기, 키프레임 퀀타이즈

  <color=#E86A5A><b>주의:</b></color> 기존 내용을 다시 쓰거나 삭제하는 작업은 모두 먼저 확인을 요청합니다

  자세히: <link="https://bullethero.space/ko/docs/editor/workflow/reuse"><color=#59A6FF>재사용: 프리팹, 복사, 생성기</color></link>
hint_editor_generators_header: "생성기"
hint_editor_gradient-editor: "색상 정지점을 드래그해서 그레이디언트를 편집합니다. 커브 에디터와 마찬가지로 변경 사항은 확정할 때가 아니라 <b>바로</b> 적용됩니다"
hint_editor_hierarchy_body: |-
  <b>현재 프레임</b>에 살아 있는 모든 오브젝트를 부모 기준으로 중첩해 보여 줍니다. 스크럽하면 목록이 바뀝니다. 계층 구조가 비어 있다면 대개 재생 헤드가 내용의 끝을 지난 것입니다

  행을 다른 행 위로 드래그하면 그 오브젝트의 자식이 됩니다. 레이어는 부모 사슬을 따라 더해지므로, 부모를 바꾸면 그리기 순서에서의 위치도 바뀌고 무작위 값도 다시 뽑힙니다

  <color=#5EC8C8><b>팁:</b></color> 행을 오른쪽 클릭하면 그 행의 작업이 열립니다. 터치 화면에서는 행을 길게 누릅니다

  자세히: <link="https://bullethero.space/ko/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>에디터의 작동 방식</color></link>
hint_editor_hierarchy_header: "계층 구조"
hint_editor_inspector-audio_body: |-
  선택한 오디오 트랙의 클립, 속도, 페이더 음량과 오디오 효과 체인(로우패스, 하이패스, 에코, 리버브, 코러스, 피치 시프터, 디스토션, 플랜저, 컴프레서, 노멀라이즈, 파라메트릭 EQ)을 다룹니다

  속도와 음량은 허용 범위가 보이도록 일반 숫자 필드가 아니라 슬라이더로 되어 있습니다

  <color=#E86A5A><b>주의:</b></color> <b>여기의 음량은 페이더입니다.</b> 키프레임 음량은 로컬 타임라인에 있는 별도의 트랙이며, 재생할 때 둘이 곱해집니다

  자세히: <link="https://bullethero.space/ko/docs/editor/resources/preparing-the-track"><color=#59A6FF>트랙 준비하기</color></link>
hint_editor_inspector-audio_chorus-delay: "복사본의 기본 지연 시간(ms)입니다. 에코가 아니라 두께로 들릴 만큼 짧습니다"
hint_editor_inspector-audio_chorus-depth: "지연 시간이 흔들리는 폭입니다. Rate는 흔들림의 속도를, 이 값은 그 크기를 정합니다"
hint_editor_inspector-audio_chorus-dry-mix: "처리되지 않은 원래 신호의 레벨입니다"
hint_editor_inspector-audio_chorus-feedback: "출력을 효과에 다시 돌려보내는 양입니다. 높일수록 소리가 깊어지며 플랜저에 가까워집니다"
hint_editor_inspector-audio_chorus-rate: "지연 시간이 변조되는 속도(Hz)입니다"
hint_editor_inspector-audio_chorus-wet-mix-tap-1: "첫 번째 지연 복사본의 레벨입니다"
hint_editor_inspector-audio_chorus-wet-mix-tap-2: "두 번째 복사본의 레벨입니다. 탭들은 시간 간격을 두고 떨어져 있으므로, 그 균형이 코러스의 폭을 결정합니다"
hint_editor_inspector-audio_chorus-wet-mix-tap-3: "세 번째 복사본의 레벨입니다"
hint_editor_inspector-audio_chorus_body: |-
  약간씩 지연되고 피치가 흔들리는 복사본 세 개를 신호 위에 겹쳐, 하나의 음원이 여러 개처럼 들리게 합니다. <color=#D4B483>Rate</color>는 흔들림의 속도, <color=#D4B483>Depth</color>는 그 크기입니다. <color=#D4B483>Feedback</color>을 올리면 <link="hint_editor_inspector-audio_flange"><color=#59A6FF>플랜저</color></link>로 바뀝니다

  <color=#B48CE0><b>참고:</b></color> <b>초기화</b>하면 <b>믹스 레벨</b>도 기본값인 -80 dB로 돌아가므로 효과가 꺼집니다

  자세히: <link="https://bullethero.space/ko/docs/editor/resources/preparing-the-track"><color=#59A6FF>트랙 준비하기</color></link>
hint_editor_inspector-audio_chorus_header: "코러스"
hint_editor_inspector-audio_compressor-attack: "피크 뒤에 얼마나 빨리 눌러 주는지(ms)입니다. 너무 빠르면 트랜지언트가 죽습니다"
hint_editor_inspector-audio_compressor-make-up-gain: "압축 후 다시 더하는 게인(dB)으로, 압축으로 줄어든 레벨을 되찾습니다"
hint_editor_inspector-audio_compressor-release: "그 뒤에 얼마나 빨리 놓아 주는지(ms)입니다. 너무 빠르면 펌핑이 귀에 들립니다"
hint_editor_inspector-audio_compressor-threshold: "압축이 작동하기 시작하는 레벨(dB)입니다"
hint_editor_inspector-audio_compressor_body: |-
  큰 부분을 눌러 작은 부분이 더 위로 올라올 수 있게 합니다. 자체 효과에 묻혀 사라지는 곡을 고치는 일반적인 방법입니다. <color=#D4B483>Threshold</color>는 작동이 시작되는 지점, <color=#D4B483>Attack</color>과 <color=#D4B483>Release</color>는 누르고 놓는 속도이고, <color=#D4B483>Make Up Gain</color>은 레벨을 되돌려 줍니다

  <color=#B48CE0><b>참고:</b></color> <b>초기화</b>하면 <b>믹스 레벨</b>도 기본값인 -80 dB로 돌아가므로 효과가 꺼집니다

  자세히: <link="https://bullethero.space/ko/docs/editor/resources/preparing-the-track"><color=#59A6FF>트랙 준비하기</color></link>
hint_editor_inspector-audio_compressor_header: "컴프레서"
hint_editor_inspector-audio_distortion-level: "신호를 얼마나 세게 클리핑하는지 정합니다"
hint_editor_inspector-audio_distortion_body: |-
  파형을 클리핑해 소리를 배음으로 채웁니다. 거칠고 오버드라이브된 소리입니다. 다이얼은 <color=#D4B483>Level</color> 하나로, 얼마나 세게 물어뜯는지를 정합니다. 다이내믹도 평탄하게 만들기 때문에 트랙의 조용한 순간이 사라집니다

  <color=#B48CE0><b>참고:</b></color> <b>초기화</b>하면 <b>믹스 레벨</b>도 기본값인 -80 dB로 돌아가므로 효과가 꺼집니다

  자세히: <link="https://bullethero.space/ko/docs/editor/resources/preparing-the-track"><color=#59A6FF>트랙 준비하기</color></link>
hint_editor_inspector-audio_distortion_header: "디스토션"
hint_editor_inspector-audio_echo-decay: "각 반복이 다음 반복으로 넘겨주는 비율입니다. 값이 높을수록 더 오래 울립니다"
hint_editor_inspector-audio_echo-delay: "반복 사이의 간격(밀리초)입니다. 곡의 템포에 맞추면 에코가 비트에 맞게 떨어집니다"
hint_editor_inspector-audio_echo-dry-mix: "출력에 포함되는 처리되지 않은 원래 신호의 레벨입니다"
hint_editor_inspector-audio_echo-max-channels: "에코 버퍼의 채널 수 상한입니다"
hint_editor_inspector-audio_echo-wet-mix: "에코 신호의 레벨입니다. 믹스 레벨과는 별개로 Dry Mix와 균형을 맞춥니다"
hint_editor_inspector-audio_echo_body: |-
  신호를 일정한 간격으로 반복하며, 반복할 때마다 소리가 작아집니다. <link="hint_editor_inspector-audio_reverb"><color=#59A6FF>리버브</color></link>의 공간감이 아니라 따로 떨어진 복사본입니다. <color=#D4B483>Delay</color>는 간격(밀리초), <color=#D4B483>Decay</color>는 각 복사본이 다음 복사본으로 넘겨주는 비율입니다

  <color=#B48CE0><b>참고:</b></color> <b>초기화</b>하면 <b>믹스 레벨</b>도 기본값인 -80 dB로 돌아가므로 효과가 꺼집니다

  자세히: <link="https://bullethero.space/ko/docs/editor/resources/preparing-the-track"><color=#59A6FF>트랙 준비하기</color></link>
hint_editor_inspector-audio_echo_header: "에코"
hint_editor_inspector-audio_enabled: "이 효과가 체인에 들어가 있는지 여부입니다. 별도의 플래그는 없습니다. 체크하면 믹스 레벨이 -80 dB 하한에서 올라가고, 체크를 해제하면 하한으로 돌아가되 설정해 둔 레벨은 유지됩니다"
hint_editor_inspector-audio_flange-depth: "지연 시간이 흔들리는 폭입니다"
hint_editor_inspector-audio_flange-dry-mix: "처리되지 않은 원래 신호의 레벨입니다"
hint_editor_inspector-audio_flange-rate: "스윕이 반복되는 속도(Hz)입니다"
hint_editor_inspector-audio_flange-wet-mix: "스윕되는 복사본의 레벨입니다. 두 신호가 서로 상쇄되는 것이 바로 이 효과입니다"
hint_editor_inspector-audio_flange_body: |-
  신호에 아주 짧게 스윕하는 자기 자신의 지연음을 섞습니다. 제트 엔진 같은 쉭 하는 소리입니다. <link="hint_editor_inspector-audio_chorus"><color=#59A6FF>코러스</color></link>와 비슷하지만 복사본이 하나라서 폭이 아니라 스윕이 들립니다. <color=#D4B483>Dry Mix</color>와 <color=#D4B483>Wet Mix</color>가 비슷할 때 쉭 소리가 가장 깊어집니다

  <color=#B48CE0><b>참고:</b></color> <b>초기화</b>하면 <b>믹스 레벨</b>도 기본값인 -80 dB로 돌아가므로 효과가 꺼집니다

  자세히: <link="https://bullethero.space/ko/docs/editor/resources/preparing-the-track"><color=#59A6FF>트랙 준비하기</color></link>
hint_editor_inspector-audio_flange_header: "플랜저"
hint_editor_inspector-audio_header: "오디오 트랙 인스펙터"
hint_editor_inspector-audio_highpass-cutoff-freq: "트랙에서 이 주파수(Hz)보다 낮은 부분을 감쇠시킵니다. 최솟값에서는 필터가 사실상 투명합니다"
hint_editor_inspector-audio_highpass_body: |-
  <link="hint_editor_inspector-audio_lowpass"><color=#59A6FF>로우패스</color></link>의 반대입니다. 고음을 통과시키고 <color=#D4B483>Cutoff Freq</color>보다 낮은 부분을 모두 잘라 냅니다. 컷오프를 올리면 트랙이 작은 스피커에서 나오는 것처럼 가늘어집니다

  <color=#5EC8C8><b>팁:</b></color> 체인은 <b>트랙</b>에 속하며 키프레임으로 바꿀 수 없습니다. 곡 중간에 바꾸려면 트랙을 잘라 두 부분을 따로 설정하십시오

  <color=#B48CE0><b>참고:</b></color> <b>초기화</b>하면 <b>믹스 레벨</b>도 기본값인 -80 dB로 돌아가므로 효과가 꺼집니다

  자세히: <link="https://bullethero.space/ko/docs/editor/resources/preparing-the-track"><color=#59A6FF>트랙 준비하기</color></link>
hint_editor_inspector-audio_highpass_header: "하이패스"
hint_editor_inspector-audio_lowpass-cutoff-freq: "트랙에서 이 주파수(Hz)보다 높은 부분을 감쇠시킵니다. 최댓값에서는 필터가 사실상 투명합니다"
hint_editor_inspector-audio_lowpass_body: |-
  저음을 통과시키고 <color=#D4B483>Cutoff Freq</color>보다 높은 부분을 모두 잘라 냅니다. 물속이나 벽 너머에서 듣는 듯한 소리입니다. 범위의 맨 위에서는 필터가 사실상 투명합니다

  <color=#5EC8C8><b>팁:</b></color> 체인은 <b>트랙</b>에 속하며 키프레임으로 바꿀 수 없습니다. 곡 중간에 바꾸려면 트랙을 잘라 두 부분을 따로 설정하십시오

  <color=#B48CE0><b>참고:</b></color> <b>초기화</b>하면 <b>믹스 레벨</b>도 기본값인 -80 dB로 돌아가므로 효과가 꺼집니다

  자세히: <link="https://bullethero.space/ko/docs/editor/resources/preparing-the-track"><color=#59A6FF>트랙 준비하기</color></link>
hint_editor_inspector-audio_lowpass_header: "로우패스"
hint_editor_inspector-audio_mix-level: "처리된 신호를 다시 섞는 레벨(dB)입니다. -80에서는 효과가 들리지 않으며, 파일에는 이 방식으로 \"꺼짐\"이 저장됩니다. 파일에 별도의 스위치는 없습니다"
hint_editor_inspector-audio_normalize-fade-in-time: "게인이 안정되는 데 걸리는 시간(밀리초)으로, 보정이 갑작스러운 변화로 들리지 않게 합니다"
hint_editor_inspector-audio_normalize-lowest-volume: "이보다 작은 신호는 그대로 둡니다. 무음과 노이즈 플로어가 증폭되어 히스 잡음이 되는 것을 막습니다"
hint_editor_inspector-audio_normalize-maximum-amp: "적용할 수 있는 게인의 상한입니다"
hint_editor_inspector-audio_normalize_body: |-
  신호를 목표 음량 쪽으로 맞춰, 출처가 다른 클립들이 비슷한 레벨에 놓이게 합니다. 전체 레벨에 작용하며, 트랙 안의 다이내믹은 <link="hint_editor_inspector-audio_compressor"><color=#59A6FF>컴프레서</color></link>가 담당합니다. <color=#D4B483>Lowest Volume</color>은 무음이 히스 잡음으로 바뀌지 않게 막고, <color=#D4B483>Maximum Amp</color>는 증폭의 상한을 정합니다

  <color=#B48CE0><b>참고:</b></color> <b>초기화</b>하면 <b>믹스 레벨</b>도 기본값인 -80 dB로 돌아가므로 효과가 꺼집니다

  자세히: <link="https://bullethero.space/ko/docs/editor/resources/preparing-the-track"><color=#59A6FF>트랙 준비하기</color></link>
hint_editor_inspector-audio_normalize_header: "노멀라이즈"
hint_editor_inspector-audio_param-eq-center-freq: "대역의 중심 주파수(Hz)입니다"
hint_editor_inspector-audio_param-eq-frequency-gain: "대역 안에 적용되는 게인입니다. 1보다 작으면 깎고, 1보다 크면 올립니다"
hint_editor_inspector-audio_param-eq-octave-range: "옥타브 단위의 대역 폭입니다. 정밀한 수정에는 좁게, 음색을 다듬을 때는 넓게 씁니다"
hint_editor_inspector-audio_param-eq_body: |-
  스펙트럼의 선택한 영역을 올리거나 깎는 파라메트릭 대역 하나입니다. <link="hint_editor_inspector-audio_lowpass"><color=#59A6FF>로우패스</color></link>, <link="hint_editor_inspector-audio_highpass"><color=#59A6FF>하이패스</color></link>와 달리 레벨을 더할 수도 있습니다. <color=#D4B483>Center Freq</color>는 대역의 위치, <color=#D4B483>Octave Range</color>는 그 폭이고, <color=#D4B483>Frequency Gain</color>은 1보다 작으면 깎고 1보다 크면 올립니다

  <color=#B48CE0><b>참고:</b></color> <b>초기화</b>하면 <b>믹스 레벨</b>도 기본값인 -80 dB로 돌아가므로 효과가 꺼집니다

  자세히: <link="https://bullethero.space/ko/docs/editor/resources/preparing-the-track"><color=#59A6FF>트랙 준비하기</color></link>
hint_editor_inspector-audio_param-eq_header: "파라메트릭 EQ"
hint_editor_inspector-audio_pitch-shifter-fft-size: "분석 창의 크기입니다. 이 알고리즘에서 품질과 지연 시간을 맞바꾸는 다이얼입니다"
hint_editor_inspector-audio_pitch-shifter-max-channels: "처리할 채널 수의 상한입니다"
hint_editor_inspector-audio_pitch-shifter-overlap: "연속된 창이 겹치는 정도입니다. 많이 겹칠수록 아티팩트가 매끄러워지지만 비용이 듭니다"
hint_editor_inspector-audio_pitch-shifter-pitch: "피치 배율입니다. 1은 그대로, 2는 한 옥타브 위입니다"
hint_editor_inspector-audio_pitch-shifter_body: |-
  속도를 바꾸지 않고 피치를 바꾸므로 타이밍이 곡에 고정된 채로 유지됩니다. <color=#D4B483>Pitch</color>는 배율로, 1은 그대로 두고 2는 한 옥타브 올립니다. <color=#D4B483>FFT Size</color>와 <color=#D4B483>Overlap</color>은 품질과 비용을 맞바꿉니다

  <color=#5EC8C8><b>팁:</b></color> 체인은 <b>트랙</b>에 속하며 키프레임으로 바꿀 수 없습니다. 곡 중간에 바꾸려면 트랙을 잘라 두 부분을 따로 설정하십시오

  <color=#B48CE0><b>참고:</b></color> <b>초기화</b>하면 <b>믹스 레벨</b>도 기본값인 -80 dB로 돌아가므로 효과가 꺼집니다

  자세히: <link="https://bullethero.space/ko/docs/editor/resources/preparing-the-track"><color=#59A6FF>트랙 준비하기</color></link>
hint_editor_inspector-audio_pitch-shifter_header: "피치 시프터"
hint_editor_inspector-audio_reverb-decay-hf-ratio: "고음이 저음보다 얼마나 빨리 감쇠하는지 정합니다. 1보다 작으면 잔향 꼬리가 사라지면서 어두워집니다"
hint_editor_inspector-audio_reverb-decay-time: "잔향 꼬리가 사라지는 데 걸리는 시간(초)입니다. 공간의 크기를 가장 강하게 드러내는 단서입니다"
hint_editor_inspector-audio_reverb-density: "시뮬레이션된 공간의 모드 밀도입니다"
hint_editor_inspector-audio_reverb-diffusion: "시간에 따른 반사음의 밀도입니다. 값이 낮으면 꼬리가 거칠고 금속성으로 들립니다"
hint_editor_inspector-audio_reverb-dry-level: "출력에 포함되는 처리되지 않은 원래 신호의 레벨입니다"
hint_editor_inspector-audio_reverb-hf-reference: "Room HF와 Decay HF Ratio 설정의 기준이 되는 주파수입니다"
hint_editor_inspector-audio_reverb-lf-reference: "Room LF 설정의 기준이 되는 주파수입니다"
hint_editor_inspector-audio_reverb-reflect-delay: "그 반사음이 도착하기까지의 지연입니다. 벽이 얼마나 멀리 있는지를 나타냅니다"
hint_editor_inspector-audio_reverb-reflections: "초기 반사음의 레벨입니다. 가까운 벽에서 처음 튕겨 나오는 뚜렷한 반사입니다"
hint_editor_inspector-audio_reverb-reverb: "초기 반사음과 대비되는, 늦게 오는 확산된 꼬리의 레벨입니다"
hint_editor_inspector-audio_reverb-reverb-delay: "그 꼬리가 시작되기 전의 지연입니다"
hint_editor_inspector-audio_reverb-room: "잔향 신호의 전체 레벨입니다. 공간이 얼마나 느껴지는지를 정합니다"
hint_editor_inspector-audio_reverb-room-hf: "고주파에서의 공간 레벨입니다. 낮추면 벽이 부드럽고 소리를 흡수하는 것처럼 들립니다"
hint_editor_inspector-audio_reverb-room-lf: "저주파에서의 공간 레벨입니다"
hint_editor_inspector-audio_reverb_body: |-
  트랙을 하나의 공간 안에 놓습니다. 초기 반사음이 먼저 오고, 그다음 잦아드는 꼬리가 이어집니다. 먼저 다음 세 필드부터 조정하십시오: <color=#D4B483>Decay Time</color>은 공간의 크기, <color=#D4B483>Room</color>은 그 공간이 얼마나 들리는지이고, <color=#D4B483>Room HF</color>를 낮추면 벽이 부드러워집니다

  <color=#B48CE0><b>참고:</b></color> <b>초기화</b>하면 <b>믹스 레벨</b>도 기본값인 -80 dB로 돌아가므로 효과가 꺼집니다

  자세히: <link="https://bullethero.space/ko/docs/editor/resources/preparing-the-track"><color=#59A6FF>트랙 준비하기</color></link>
hint_editor_inspector-audio_reverb_header: "리버브"
hint_editor_inspector-effect_angle-a: "각도이며 단위는 도입니다. 무작위 방식에서는 파티클마다 값을 고르는 범위의 한쪽 끝입니다"
hint_editor_inspector-effect_angle-b: "파티클마다 각도를 고르는 범위의 다른 쪽 끝입니다"
hint_editor_inspector-effect_angle-curve: "각도를 읽어 오는 커브입니다. 수명별 방식에서는 파티클 자신의 수명을 기준으로, 속도별 방식에서는 파티클의 속도를 기준으로 읽습니다"
hint_editor_inspector-effect_angle-speed-range: "커브를 다시 매핑하는 속도 범위입니다. 커브의 시작에 해당하는 속도와 끝에 해당하는 속도를 정합니다"
hint_editor_inspector-effect_angle-type: "회전 방식 다섯 가지 중 어느 것인지 정합니다. 바꾸면 하위 오브젝트 전체가 교체되므로 아래 행은 새 방식의 것입니다"
hint_editor_inspector-effect_angle_body: |-
  파티클이 수명 동안 어떻게 회전하는지를 다섯 가지 방식 중 하나로 정합니다. 고정 <color=#D4B483>값</color>, <color=#D4B483>커브</color> 두 가지, 파티클마다 값을 고르는 <color=#D4B483>무작위</color> 범위 두 가지가 있습니다

  <color=#D4B483>수명별</color> 방식은 파티클의 수명을 따라 커브를 읽고, <color=#D4B483>속도별</color> 방식은 아래의 속도 범위를 거쳐 파티클의 속도를 따라 읽습니다

  이 버튼 옆의 <b>초기화</b> 버튼은 <color=#D4B483>타입</color>도 초기화하며, 커브나 무작위 쌍도 함께 사라집니다

  자세히: <link="https://bullethero.space/ko/docs/editor/craft/readability-and-fairness"><color=#59A6FF>가독성과 공정성</color></link>
hint_editor_inspector-effect_angle_header: "각도"
hint_editor_inspector-effect_body: |-
  <color=#D4B483>VFX Graph</color> 이펙트의 파라미터를 그룹별로 보여 줍니다: 구성, 코어, 힘, 형태, 각도, 스케일, 색상. 그룹을 하나씩 여는 대신 모든 그룹이 한 번에 표시됩니다

  <color=#B48CE0><b>참고:</b></color> 이펙트도 <b>다른 모든 것과 같은 방식으로 시드가 정해집니다</b>. 난수 생성기의 상태가 아니라 편집하는 숫자에서 나오므로 같은 레벨은 어느 기기에서나 똑같이 재생됩니다

  <color=#5EC8C8><b>팁:</b></color> 색상은 고정 값 대신 레벨 테마를 참조할 수 있고, 그레이디언트 타입은 공용 그레이디언트 에디터를 엽니다

  자세히: <link="https://bullethero.space/ko/docs/editor/performance/level-budget"><color=#59A6FF>레벨 예산</color></link>
hint_editor_inspector-effect_color-a: "파티클의 색상입니다. 무작위 방식에서는 파티클마다 값을 고르는 범위의 한쪽 끝입니다"
hint_editor_inspector-effect_color-b: "파티클마다 색상을 고르는 범위의 다른 쪽 끝입니다"
hint_editor_inspector-effect_color-gradient: "색조를 읽어 오는 그레이디언트입니다. 방식에 따라 파티클의 수명을 따라, 속도를 따라, 또는 파티클마다 색상 하나로 읽습니다"
hint_editor_inspector-effect_color-speed-range: "그레이디언트를 다시 매핑하는 속도 범위입니다. 그레이디언트의 시작에 해당하는 속도와 끝에 해당하는 속도를 정합니다"
hint_editor_inspector-effect_color-type: "색조 방식 여섯 가지 중 어느 것인지 정합니다. 바꾸면 하위 오브젝트 전체가 교체되므로 아래 행은 새 방식의 것입니다"
hint_editor_inspector-effect_color_body: |-
  파티클이 수명 동안 어떤 색을 띠는지를 여섯 가지 방식 중 하나로 정합니다. <link="hint_editor_inspector-effect_angle"><color=#59A6FF>각도</color></link> 및 <link="hint_editor_inspector-effect_scale"><color=#59A6FF>스케일</color></link>의 다섯 방식과 같되 커브 대신 그레이디언트를 쓰며, 여기에 파티클마다 색상 하나를 고르는 <color=#D4B483>무작위 그레이디언트</color> 방식이 더해집니다

  <color=#5EC8C8><b>팁:</b></color> 여기의 색상은 테마 참조일 수 있으므로, 도중에 팔레트를 바꾸는 레벨에서도 이펙트가 그 변화를 따라갑니다

  이 버튼 옆의 <b>초기화</b> 버튼은 <color=#D4B483>타입</color>도 초기화하며, 그레이디언트나 색상 쌍도 함께 사라집니다

  자세히: <link="https://bullethero.space/ko/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>색상, 테마, 포스트 프로세싱</color></link>
hint_editor_inspector-effect_color_header: "색상"
hint_editor_inspector-effect_config-has-stop-frame: "정지 프레임을 적용할지 여부입니다. 꺼져 있으면 이미터는 오브젝트가 살아 있는 동안 계속 파티클을 생성합니다"
hint_editor_inspector-effect_config-stop-frame: "방출이 멈추는 프레임으로, 레벨 시간이 아니라 오브젝트 자신의 구간 시작부터 셉니다. 이미 살아 있는 파티클은 수명을 끝까지 채웁니다"
hint_editor_inspector-effect_config_body: |-
  이미터가 파티클 생성을 멈추는 시점을 정합니다. 꺼져 있으면 오브젝트가 살아 있는 동안 계속 생성하며, 이것이 일반적인 경우입니다

  <color=#D4B483>정지 프레임</color> 값은 레벨 타임라인이 아니라 오브젝트 자신의 구간 시작부터 셉니다. 이미 살아 있는 파티클은 수명을 끝까지 채우므로 화면이 뚝 끊기지 않고 서서히 사라집니다

  이 버튼 옆의 <b>초기화</b> 버튼은 두 필드를 개발자가 정한 기본값으로 되돌리며, 실행 취소 한 번에 되돌릴 수 있습니다

  자세히: <link="https://bullethero.space/ko/docs/editor/performance/level-budget"><color=#59A6FF>레벨 예산</color></link>
hint_editor_inspector-effect_config_header: "구성"
hint_editor_inspector-effect_core-lifetime-bounds: "파티클이 사는 최소, 최대 시간(초)이며 파티클마다 무작위로 정해집니다. 이 차이 덕분에 한 번에 터진 파티클이 동시에 사라지지 않습니다. 두 값의 평균은 1회 방출의 묶음 크기에 곱해지는 값이기도 합니다"
hint_editor_inspector-effect_core-loop: "다시 채워지지 않는 한 번의 묶음 대신 시스템이 계속 방출할지 여부입니다. 꺼져 있으면 수명 범위가 지난 뒤에는 그릴 것이 남지 않습니다"
hint_editor_inspector-effect_core-particle-count: "초당 방출되는 파티클 수로, 비용을 좌우하는 가장 중요한 값입니다. 두 모드 모두 동시에 살아 있는 파티클 수는 이 값에 평균 수명을 곱한 것입니다: 반복이면 이 속도로 생성하고, 1회 방출이면 그 곱 전체를 한 번에 터뜨립니다. 상한은 그래프 자체의 용량이며, 시스템은 파티클이 실제로 있든 없든 매 프레임 그 용량 전체를 처리합니다"
hint_editor_inspector-effect_core-particle-pivot: "파티클의 위치에 놓이고 회전의 중심이 되는 파티클 위의 점입니다. 오브젝트의 피벗에 해당하는 것을 파티클마다 둔 것입니다"
hint_editor_inspector-effect_core-render: "파티클을 그릴지 여부입니다. 꺼져 있어도 시스템은 계속 시뮬레이션되므로, 부수 효과만 필요할 때 유용합니다"
hint_editor_inspector-effect_core-shape-id: "각 파티클을 그리는 지오메트리로, 오브젝트가 쓰는 것과 같은 도형 풀에서 고릅니다. 없음은 아무것도 그리지 않습니다. 쿼드는 평범한 값 중 하나이며 이 필드의 기본값입니다"
hint_editor_inspector-effect_core-texture-id: "각 파티클이 그리는 이미지로, 오브젝트가 쓰는 것과 같은 리소스 풀에서 고릅니다. 없음이면 파티클에 이미지를 입히지 않으며, 이것이 이 필드의 기본값입니다"
hint_editor_inspector-effect_core_body: |-
  파티클이 몇 개 존재하고, 얼마나 오래 살고, 무엇으로 그려지는지 정합니다. 움직임은 <link="hint_editor_inspector-effect_forces"><color=#59A6FF>힘</color></link>에서 정합니다

  비용을 좌우하는 가장 중요한 값은 <color=#D4B483>파티클 개수</color>입니다: 이미터의 비용은 대략 개수와 <color=#D4B483>수명 범위</color>의 곱입니다. <color=#D4B483>도형</color> 및 <color=#D4B483>텍스처</color> 필드는 비워 두어도 됩니다. 텍스처 없는 파티클이 가장 저렴합니다

  <color=#E8B04B><b>경고:</b></color> 개수의 상한은 1024이며, 그래프는 살아 있는 파티클만이 아니라 전체 용량에 대한 비용을 매 프레임 치릅니다. 필요한 만큼만 지정하는 것이 좋습니다

  자세히: <link="https://bullethero.space/ko/docs/editor/performance/level-budget"><color=#59A6FF>레벨 예산</color></link>
hint_editor_inspector-effect_core_header: "코어"
hint_editor_inspector-effect_forces-linear-force: "속도가 아니라 일정한 가속도이므로, 효과가 일정하게 유지되지 않고 파티클의 수명 동안 누적됩니다"
hint_editor_inspector-effect_forces-linear-velocity: "파티클이 생성될 때의 속도 위에 매 프레임 더해지는 일정한 흐름입니다. 순간적인 충격이 아니라 바람과 같습니다"
hint_editor_inspector-effect_forces-orbital-center-offset: "이미터를 기준으로 한 궤도 중심의 위치입니다. 중심을 옮기면 소용돌이가 한쪽으로 치우칩니다"
hint_editor_inspector-effect_forces-orbital-velocity: "파티클 자신이 아니라 중심점을 축으로 하는 회전입니다. 2D 씬에서 의미가 있는 것은 Z 성분입니다"
hint_editor_inspector-effect_forces-start-angular-velocity-max: "무작위로 정해지는 초기 회전 속도의 상한입니다"
hint_editor_inspector-effect_forces-start-angular-velocity-min: "무작위로 정해지는 초기 회전 속도의 하한이며, 단위는 초당 도입니다"
hint_editor_inspector-effect_forces-start-gravity-max: "파티클마다 무작위로 정해지는 중력의 상한입니다"
hint_editor_inspector-effect_forces-start-gravity-min: "파티클마다 무작위로 정해지는 중력의 하한입니다. 음수 값이면 위로 떠오릅니다"
hint_editor_inspector-effect_forces-start-velocity-max: "무작위로 정해지는 초기 속도의 상한입니다. 두 값의 차이를 벌리면 깔끔한 폭발이 흩뿌려지는 분사로 바뀝니다"
hint_editor_inspector-effect_forces-start-velocity-min: "무작위로 정해지는 초기 속도의 하한이며, 축마다 따로 정합니다"
hint_editor_inspector-effect_forces-velocity-speed: "파티클 속도 전체에 곱하는 배수입니다. 위의 필드를 하나하나 다시 조정하지 않고도 완성된 이펙트를 느리게 하거나 빠르게 하는 값 하나입니다"
hint_editor_inspector-effect_forces_body: |-
  파티클이 생성된 뒤 파티클을 움직이는 모든 것입니다. 시작 위치는 <link="hint_editor_inspector-effect_shape"><color=#59A6FF>형태</color></link>에서 정합니다

  <color=#D4B483>시작</color> 쌍은 파티클마다 생성 시 한 번 무작위로 정해집니다. 나머지는 파티클의 수명 내내 계속 작용하며, <color=#D4B483>선형 힘</color> 값은 가속도이므로 누적됩니다

  <color=#5EC8C8><b>팁:</b></color> <color=#D4B483>이동 속도</color> 값이 결과 전체에 곱해지므로, 나머지를 다시 조정하지 않고도 완성된 이펙트를 느리게 하거나 빠르게 할 수 있습니다

  자세히: <link="https://bullethero.space/ko/docs/editor/craft/composition-and-camera"><color=#59A6FF>구도와 카메라</color></link>
hint_editor_inspector-effect_forces_header: "힘"
hint_editor_inspector-effect_header: "이펙트 인스펙터"
hint_editor_inspector-effect_scale-a: "파티클의 크기입니다. 무작위 방식에서는 파티클마다 값을 고르는 범위의 한쪽 끝입니다"
hint_editor_inspector-effect_scale-b: "파티클마다 크기를 고르는 범위의 다른 쪽 끝입니다"
hint_editor_inspector-effect_scale-curve-x: "가로 크기를 읽어 오는 커브로, 세로 크기와 독립적입니다"
hint_editor_inspector-effect_scale-curve-y: "세로 크기를 읽어 오는 커브로, 가로 크기와 독립적입니다"
hint_editor_inspector-effect_scale-speed-range: "두 커브를 다시 매핑하는 속도 범위입니다. 커브의 시작에 해당하는 속도와 끝에 해당하는 속도를 정합니다"
hint_editor_inspector-effect_scale-type: "크기 방식 다섯 가지 중 어느 것인지 정합니다. 바꾸면 하위 오브젝트 전체가 교체되므로 아래 행은 새 방식의 것입니다"
hint_editor_inspector-effect_scale_body: |-
  파티클이 수명 동안 얼마나 큰지를 <link="hint_editor_inspector-effect_angle"><color=#59A6FF>각도</color></link>에서와 같은 다섯 가지 방식으로 정합니다. <color=#D4B483>커브 X</color> 및 <color=#D4B483>커브 Y</color> 값은 따로 읽히므로 파티클이 작아지면서 늘어날 수도 있습니다

  <color=#E8B04B><b>경고:</b></color> 커브 아래의 행은 여러 용도로 쓰입니다: 값과 무작위 방식에서는 크기 자체, 속도별 방식에서는 속도 범위입니다. 옆의 캡션이 어느 쪽인지 알려 줍니다

  이 버튼 옆의 <b>초기화</b> 버튼은 <color=#D4B483>타입</color>도 초기화하며, 두 커브와 무작위 쌍도 함께 사라집니다

  자세히: <link="https://bullethero.space/ko/docs/editor/craft/readability-and-fairness"><color=#59A6FF>가독성과 공정성</color></link>
hint_editor_inspector-effect_scale_header: "스케일"
hint_editor_inspector-effect_shape-arc: "실제로 쓰이는 테두리의 범위로, 단위는 라디안이며 +X 축에서 시계 반대 방향으로 잽니다. 한 바퀴보다 작으면 부채꼴이 됩니다"
hint_editor_inspector-effect_shape-box-size: "이펙트 오브젝트를 중심으로 하는 생성 상자의 전체 너비와 높이입니다"
hint_editor_inspector-effect_shape-circle-aspect: "세로 반축을 반지름의 배수로 나타낸 값입니다: 1이면 원, 그 밖의 값이면 타원입니다"
hint_editor_inspector-effect_shape-circle-radius: "가로축을 따라 잰 중심에서 고리까지의 거리입니다"
hint_editor_inspector-effect_shape-circle-thickness: "고리가 안쪽으로 얼마나 채워지는지 정합니다: 0이면 윤곽선만, 1이면 꽉 찬 원판입니다"
hint_editor_inspector-effect_shape-cone-base-radius: "이미터 쪽 끝의 반지름입니다"
hint_editor_inspector-effect_shape-cone-height: "두 끝 사이의 거리, 즉 생성 영역의 깊이입니다"
hint_editor_inspector-effect_shape-cone-top-radius: "먼 쪽 끝의 반지름입니다. 밑면 반지름보다 크면 나팔처럼 벌어지고, 작으면 깔때기처럼 좁아집니다"
hint_editor_inspector-effect_shape-line-end: "선분의 다른 쪽 끝입니다"
hint_editor_inspector-effect_shape-line-start: "선분의 한쪽 끝으로, 이펙트 오브젝트 기준 로컬 좌표입니다"
hint_editor_inspector-effect_shape-spread: "처음으로 되돌아가기 전까지 순회가 지나가는 형태의 비율입니다"
hint_editor_inspector-effect_shape-spread-speed: "생성 지점이 나아가는 속도로, 눈에 보이는 회전 속도를 결정합니다"
hint_editor_inspector-effect_shape-spread-type: "연이은 파티클이 형태를 따라 이동하는 방식으로, 무작위, 한 방향 반복, 핑퐁, 사인 중 하나입니다. 정지한 고리를 회전하거나 쓸고 지나가는 패턴으로 바꾸는 것이 바로 이 값입니다"
hint_editor_inspector-effect_shape-torus-radius-major: "관이 감겨 있는 고리의 반지름입니다"
hint_editor_inspector-effect_shape-torus-radius-minor: "관 자체의 반지름, 즉 고리의 두께입니다"
hint_editor_inspector-effect_shape-type: "어떤 생성 영역인지 정합니다. 바꾸면 형태가 교체되므로 아래 필드는 이전 형태가 아니라 새 형태의 것입니다"
hint_editor_inspector-effect_shape_body: |-
  생성 영역이며 점, 원, 직사각형, 선, 원뿔, 토러스 중 하나입니다. 파티클이 어디서 시작하는지만 정하며, 그다음은 <link="hint_editor_inspector-effect_forces"><color=#59A6FF>힘</color></link>에서 정합니다

  <color=#D4B483>타입</color> 값을 바꾸면 아래 행이 바뀌며, 행은 여러 타입이 함께 씁니다. <color=#D4B483>호</color> 값은 라디안 단위이며, 한 바퀴보다 작으면 부채꼴이 됩니다

  <color=#5EC8C8><b>팁:</b></color> <b>확산 타입</b> 필드를 반복으로 두면 전형적인 회전 이미터가 됩니다

  이 버튼 옆의 <b>초기화</b> 버튼은 <color=#D4B483>타입</color>도 초기화하며, 형태도 함께 사라집니다

  자세히: <link="https://bullethero.space/ko/docs/editor/craft/composition-and-camera"><color=#59A6FF>구도와 카메라</color></link>
hint_editor_inspector-effect_shape_header: "형태"
hint_editor_inspector-keyframe_body: |-
  <b>선택 항목에 걸린 모든 트랙이 한 번에 표시됩니다</b>. 마지막으로 클릭한 트랙만 표시되는 것이 아닙니다. 값이 비어 있으면 선택한 키프레임들의 값이 <b>서로 다르다는</b> 뜻입니다

  <color=#5EC8C8><b>팁:</b></color> <b>이징</b> 변경은 여러 트랙에 걸쳐 적용되며, <b>실행 취소 한 번</b>에 모두 되돌릴 수 있습니다

  <color=#B48CE0><b>참고:</b></color> 키프레임을 여러 개 선택하면 <b>프레임</b> 필드가 잠깁니다. 숫자 하나로는 모두 같은 프레임에 겹쳐지기 때문입니다. 대신 타임라인에서 드래그해 옮기면 됩니다

  자세히: <link="https://bullethero.space/ko/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>에디터의 작동 방식</color></link>
hint_editor_inspector-keyframe_header: "키프레임 인스펙터"
hint_editor_inspector-object_body: |-
  선택한 오브젝트 자체의 필드입니다. 모든 타입에 빈 오브젝트 공통 필드가 표시되며, 도형, 이펙트, 텍스트, 프리팹 오브젝트는 그 아래에 자체 필드를 추가합니다

  <b>활성</b> 필드를 끄면 렌더링뿐 <i>아니라</i> 충돌도 꺼지며, 자식도 이를 물려받습니다: 여기서 숨긴 오브젝트는 플레이어를 죽일 수 없습니다

  <color=#E86A5A><b>주의:</b></color> <b>레이어</b> 값은 부모 기준의 상대값입니다. 렌더러가 실제로 쓰는 것은 옆에 있는 읽기 전용 글로벌 레이어입니다

  <color=#5EC8C8><b>팁:</b></color> 프리팹에서 온 오브젝트의 필드를 편집하면 그 내용이 <b>인스턴스별 오버라이드</b> 형태로 기록되며, 옆의 체크박스가 이를 표시하고 되돌립니다

  자세히: <link="https://bullethero.space/ko/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>에디터의 작동 방식</color></link>
hint_editor_inspector-object_header: "오브젝트 인스펙터"
hint_editor_inspector-resolved_body: |-
  선택한 오브젝트가 현재 프레임에서 <b>실제로 어떤 상태인지</b> 보여 줍니다. 작성한 값이 아니라 실행 중인 시뮬레이션에서 읽어 옵니다

  행 끝의 사각형은 필드의 키프레임 상태입니다: 파란색은 이 프레임에 키프레임이 있음(사각형을 클릭하면 선택), 주황색은 키프레임 사이에서 보간됨, 회색은 키프레임 범위 밖이라 값이 유지됨, 속이 빈 사각형은 키프레임이 없어 기본값이 쓰임을 뜻합니다. 화살표는 재생 헤드를 이전 또는 다음 키프레임으로 이동합니다

  구분선 아래에는 합성된 값이 있습니다: 합산된 레이어, 상속된 활성 상태, 부모와 합성된 트랜스폼입니다. 이 값들은 어떤 키프레임도 정하지 않으므로 표시기가 없습니다

  자세히: <link="https://bullethero.space/ko/docs/editor/reference/object-properties"><color=#59A6FF>오브젝트 속성</color></link>
hint_editor_inspector-resolved_header: "계산값"
hint_editor_inspector_audio-span-fit: "레벨이 끝나기 전까지 들어가는 만큼 클립을 덮도록 트랙을 늘립니다. 찾을 수 있는 클립이 없거나 속도가 0이면 사용할 수 없습니다. 멈춘 트랙에는 맞출 길이가 없기 때문입니다"
hint_editor_inspector_audio-span-fit-level: "클립 전체가 들어갈 때까지 트랙과 레벨을 함께 늘립니다. 레벨은 길어지기만 하며, 이미 클립이 다 들어가 있으면 아무것도 바뀌지 않습니다"
hint_editor_inspector_collider-id_body: |-
  이 오브젝트가 <b>무엇으로 충돌하는지</b> 정합니다. 무엇을 그리는지와는 별개의 선택입니다

  <color=#B48CE0><b>참고:</b></color> 둘 중 어느 것도 다른 것에서 파생되지 않으며, 이는 의도된 것입니다: 그려지지만 해가 없는 예고 광선, 감싸는 그림보다 단순한 히트박스, 보이지 않는 벽은 모두 꼼수가 아니라 평범한 콘텐츠입니다

  <color=#5EC8C8><b>팁:</b></color> 두 필드는 같은 두 컬렉션에서 고르므로, 레벨에서 만든 도형을 둘 중 하나로도, 둘 다로도 쓸 수 있습니다

  자세히: <link="https://bullethero.space/ko/docs/editor/craft/readability-and-fairness"><color=#59A6FF>가독성과 공정성</color></link>
hint_editor_inspector_collider-id_header: "콜라이더"
hint_editor_inspector_ease_body: |-
  이전 키프레임에서 이 키프레임까지 값이 어떻게 도달하는지 정합니다

  <color=#B48CE0><b>참고:</b></color> 이징은 키프레임의 <b>들어오는</b> 쪽에 속하므로, 트랙의 첫 키프레임은 이징할 출발점이 없어 선택이 드러나지 않습니다

  <color=#5EC8C8><b>팁:</b></color> 키프레임을 여러 개 선택하면 트랙과 오브젝트가 달라도 선택이 모두에 적용되며, <b>실행 취소 한 번</b>에 되돌릴 수 있습니다. 선택이 비어 있으면 키프레임마다 값이 다르다는 뜻입니다

  자세히: <link="https://bullethero.space/ko/docs/editor/basics/keyframes-and-easing"><color=#59A6FF>키프레임과 이징</color></link>
hint_editor_inspector_ease_header: "이징"
hint_editor_inspector_global-layer: "렌더러가 실제로 쓰는 그리기 순서입니다: 이 오브젝트 자신의 레이어에 모든 조상의 레이어를 더한 값입니다. 저장되지 않고 계산되는 값이므로 읽기 전용입니다"
hint_editor_inspector_layer_body: |-
  그리기 순서이며, 절대값이 아니라 <b>부모 기준의 상대값</b>입니다

  <color=#E86A5A><b>주의:</b></color> 렌더러는 이 숫자에 모든 조상의 값을 더해 쓰며, 그 합은 아래 <b>글로벌</b> 필드에 읽기 전용으로 표시됩니다. 부모를 바꾸면 이 숫자가 그대로여도 오브젝트가 그려지는 순서가 바뀝니다

  <color=#B48CE0><b>참고:</b></color> 무작위 값은 실제 적용되는 레이어에 묶여 있으므로, 계층 구조에서 오브젝트를 옮기면 무작위 값이 다시 정해집니다

  자세히: <link="https://bullethero.space/ko/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>에디터의 작동 방식</color></link>
hint_editor_inspector_layer_header: "레이어"
hint_editor_inspector_object-type: "이 오브젝트의 종류입니다. 바꾸면 오브젝트 자체가 통째로 교체됩니다: 공통 필드는 유지되고, 새 타입에 자리가 없는 것은 버려집니다"
hint_editor_inspector_parent: "이 오브젝트가 따라가는 오브젝트입니다. 부모는 자신의 트랜스폼을 자식에 합성하고 레이어는 사슬을 따라 더해지므로, 부모를 바꾸면 그리기 순서에서도 오브젝트가 이동합니다"
hint_editor_inspector_shader-type_body: |-
  이 오브젝트가 어떤 렌더링 경로를 쓰는지 정합니다

  <color=#E86A5A><b>주의:</b></color> <b>자동</b> 모드는 레벨을 불러올 때 한 번만 결정하며 레벨의 모습은 절대 바꾸지 않습니다: 알파로 불투명하다고 증명할 수 없는 것은 모두 투명이 됩니다

  <color=#5EC8C8><b>팁:</b></color> 이 필드 옆의 라벨은 자동 모드가 실제로 무엇으로 결정되었는지를 렌더러 데이터에서 바로 읽어 보여 줍니다

  자세히: <link="https://bullethero.space/ko/docs/editor/performance/level-budget"><color=#59A6FF>레벨 예산</color></link>
hint_editor_inspector_shader-type_header: "셰이더 타입"
hint_editor_inspector_shape-id_body: |-
  이 오브젝트가 <b>무엇을 그리는지</b> 정합니다

  <color=#B48CE0><b>참고:</b></color> 도형은 자기 상자에 맞춘 실제 지오메트리이며 긴 축의 길이가 정확히 1이므로, 오브젝트의 직사각형이 곧 화면에 보이는 모습입니다. 게임이 약 500종을 생성하며, 레벨에서 직접 추가할 수도 있습니다

  <color=#5EC8C8><b>팁:</b></color> 이 필드는 비워 두어도 됩니다: 아무것도 그리지 않지만 콜라이더가 있는 오브젝트는 보이지 않는 벽이 됩니다

  자세히: <link="https://bullethero.space/ko/docs/editor/craft/readability-and-fairness"><color=#59A6FF>가독성과 공정성</color></link>
hint_editor_inspector_shape-id_header: "도형"
hint_editor_inspector_span_body: |-
  이 오브젝트가 존재하는 기간이며, 반열린 범위입니다: 시작 프레임은 포함되고 끝 프레임은 포함되지 않습니다. 20에서 끝나는 오브젝트와 20에서 시작하는 오브젝트가 그 프레임에 함께 그려지는 일은 없습니다

  <color=#B48CE0><b>참고:</b></color> 자식의 구간은 부모의 구간 안에 있어야 하지만, 이는 읽을 때 계산될 뿐 저장되지 않습니다. 부모를 줄이면 자식이 잘리고, 다시 늘리면 돌아옵니다. 레벨 끝을 넘어서는 루트 오브젝트는 그냥 재생되지 않습니다

  <b>앵커</b> 설정은 가장자리가 부모의 가장자리를 따라가게 하며, 무엇이 재생될지를 결정합니다: 앵커가 걸린 자식은 부모가 늘어나면 함께 늘어납니다. 애니메이션은 작성한 타이밍을 그대로 유지합니다

  자세히: <link="https://bullethero.space/ko/docs/editor/basics/frames-and-time"><color=#59A6FF>프레임, 시간, 레벨 길이</color></link>
hint_editor_inspector_span_header: "구간"
hint_editor_interop-report: "다른 게임의 형식에서 변환할 때 살아남은 것과 그렇지 못한 것입니다. 항목은 정보 제공용입니다: 레벨은 이미 불러왔으며, 여기서는 원본과 어디가 다른지 알려 줍니다"
hint_editor_level-export_body: |-
  이 레벨을 게임 밖으로 내보냅니다. 폴더 하나 또는 아카이브 하나로 씁니다. 레벨이 쓰는 모든 것이 함께 옮겨지며, 레벨 폴더 밖에 있는 곡도 포함됩니다

  일반 <b>.zip</b> 파일은 아무것도 설치하지 않아도 Windows 탐색기에서 열립니다. 비밀번호 옵션은 그렇지 않습니다: <b>+ 비밀번호</b> 옵션은 7-Zip 등 다른 압축 프로그램에서, <b>(gpg)</b> 옵션은 gpg 프로그램에서 열립니다

  <color=#5EC8C8><b>팁:</b></color> 함께 옮겨지지 못한 것은 내보낸 뒤 보고서에 나열됩니다: URL 뒤의 리소스, 아무것도 참조하지 않는 파일 등입니다

  <color=#E8B04B><b>경고:</b></color> 비밀번호는 DRM 같은 보호 장치가 아닙니다. 파일과 비밀번호를 가진 사람은 누구나 언제든 열 수 있습니다

  자세히: <link="https://bullethero.space/ko/docs/editor/workflow/sharing-by-hand"><color=#59A6FF>레벨을 직접 공유하는 방법</color></link>
hint_editor_level-export_header: "레벨 내보내기"
hint_editor_level-protection_body: |-
  디스크에 있는 이 레벨의 문서를 암호화하므로, 레벨을 열 때 비밀번호를 묻습니다. 메타데이터, 커버, 미디어는 계속 읽을 수 있으므로 비밀번호 없이도 레벨 카드는 표시됩니다

  비밀번호는 세션마다 한 번 묻고 메모리에만 보관합니다. 보호를 해제하려면 필드를 비워 두고 <b>적용</b> 버튼을 누릅니다

  <color=#E86A5A><b>주의:</b></color> 잊어버린 비밀번호는 복구할 수 없습니다. 키는 어디에도 보관되지 않습니다

  자세히: <link="https://bullethero.space/ko/docs/editor/reference/export-and-protection"><color=#59A6FF>내보내기와 보호</color></link>
hint_editor_level-protection_header: "레벨 보호"
hint_editor_prefab-flatten-recursive_body: |-
  꺼짐 - 가리킨 배치만 더 이상 템플릿을 따르지 않습니다. 그 안에 배치된 프리팹은 자기 연결을 유지하므로, 그 내부 템플릿을 편집하면 여전히 이 레벨에 반영됩니다. 이것이 기본값입니다

  켜짐 - 중첩된 모든 것도 평탄화되며, 깊이와 관계없이 레벨의 어떤 것도 그 내부 템플릿에 연결된 채로 남지 않습니다

  어느 쪽이든 템플릿 자체는 레벨에 남으며, 평탄화는 실행 취소 한 번으로 되돌릴 수 있습니다

  자세히: <link="https://bullethero.space/ko/docs/editor/reference/prefab-mode"><color=#59A6FF>프리팹 모드</color></link>
hint_editor_prefab-flatten-recursive_header: "중첩된 프리팹도 평탄화"
hint_editor_prefab-mode_body: |-
  <color=#E86A5A><b>주의:</b></color> 지금 편집하는 것은 배치 하나가 아니라 프리팹 <b>템플릿</b>입니다. 저장하면 이 템플릿을 참조하는 모든 배치에 변경이 적용됩니다

  여기서 한 편집은 인스턴스별 오버라이드를 기록하지 않습니다. 오버라이드는 이 모드 밖, 레벨에서 배치의 오브젝트를 편집할 때만 생깁니다

  <color=#5EC8C8><b>팁:</b></color> 이 템플릿 안의 배치는 자기 템플릿을 위에 겹쳐 열며, "저장 후 닫기"를 누르면 여기로 돌아옵니다. 중첩은 최대 8단계입니다

  자세히: <link="https://bullethero.space/ko/docs/editor/workflow/reuse"><color=#59A6FF>재사용: 프리팹, 복사, 생성기</color></link>
hint_editor_prefab-mode_header: "프리팹 모드"
hint_editor_search-palette_body: |-
  모드는 두 가지입니다. <b>명령 실행</b> 모드는 툴바와 컨텍스트 메뉴가 실행하는 것과 같은 에디터 동작을 이름으로 찾습니다. <b>내용 검색</b> 모드는 현재 범위의 오브젝트와 오디오 트랙을 찾습니다

  <color=#B48CE0><b>참고:</b></color> 리소스는 어느 모드에도 나오지 않습니다. 각 리소스는 그것이 필요한 필드에서 선택합니다

  자세히: <link="https://bullethero.space/ko/docs/editor/workflow/speed-and-shortcuts"><color=#59A6FF>속도와 단축키</color></link>
hint_editor_search-palette_header: "명령 팔레트"
hint_editor_search-picker: "모든 리소스 필드가 함께 쓰는 하나의 선택기입니다. 입력하면 목록이 관련도순으로 정렬됩니다. 필터는 종류별로 목록을 좁히며, 필드가 한 도메인만 받을 때는 오른쪽에 칩이 나타납니다"
hint_editor_theme-ref_body: |-
  이 색상을 고정 값 대신 <b>레벨 테마의 슬롯</b>에 연결합니다. 테마가 바뀌면 그 슬롯을 참조하는 모든 것의 색이 한 번에 바뀝니다

  <color=#5EC8C8><b>팁:</b></color> 스와치는 재생 헤드가 아니라 편집 중인 키프레임의 프레임에서 팔레트를 보여 줍니다. 더 나중의 모습에 맞춰 고르려면 더 뒤에 있는 키프레임을 편집하십시오

  자세히: <link="https://bullethero.space/ko/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>색상, 테마, 포스트 프로세싱</color></link>
hint_editor_theme-ref_header: "테마 색상 참조"
hint_editor_timeline-audio_body: |-
  레벨의 오디오 트랙을 파형과 함께 보여 주므로, 들리는 소리에 맞춰 내용을 정렬할 수 있습니다

  <color=#5EC8C8><b>팁:</b></color> 인스펙터의 <b>트랙 맞춤</b> 버튼은 트랙 길이를 클립의 실제 길이에 맞춥니다. 클립이 없거나 속도가 0이면 비활성화됩니다

  <color=#E86A5A><b>주의:</b></color> 인스펙터의 <b>음량</b> 슬라이더는 트랙의 페이더입니다. 키프레임 음량은 로컬 타임라인에 있는 별도의 음량 트랙이며, 재생할 때 둘이 곱해집니다

  자세히: <link="https://bullethero.space/ko/docs/editor/resources/preparing-the-track"><color=#59A6FF>트랙 준비하기</color></link>
hint_editor_timeline-audio_header: "오디오 타임라인"
hint_editor_timeline-events_body: |-
  어떤 오브젝트에도 속하지 않는 레벨 전체의 키프레임입니다:
  - 카메라 위치, 회전, 줌, 피벗, 흔들림
  - 마커와 체크포인트
  - 화면 제한
  - 배경과 테마
  - 모든 포스트 프로세싱 효과
  - 플레이어의 표시, 조작, 충돌, 크기, 속도

  <color=#B48CE0><b>참고:</b></color> 여기서는 <b>비트</b> 행이 예외입니다. 그 항목에는 구간이 있으므로, 가장자리와 가위 도구가 작동하는 유일한 행입니다

  <color=#5EC8C8><b>팁:</b></color> 색상은 고정 값 대신 레벨의 테마를 가리킬 수 있습니다. 그러면 테마를 한 번 바꾸는 것만으로 그 색상이 모두 바뀝니다

  자세히: <link="https://bullethero.space/ko/docs/editor/craft/composition-and-camera"><color=#59A6FF>구도와 카메라</color></link>
hint_editor_timeline-events_header: "이벤트 타임라인"
hint_editor_timeline-level_body: |-
  오브젝트마다 클립이 하나씩 있으며, 클립이 놓인 행이 그 오브젝트의 <b>레이어</b>입니다. 클립은 오브젝트의 <b>구간</b>입니다: 프레임 10-19는 프레임 20에서 시작하는 클립의 시작 지점에서 정확히 끝납니다

  <color=#B48CE0><b>참고:</b></color> 자식은 부모의 구간 안에서만 재생되지만, 작성한 내용에서 잘려 나가는 것은 없습니다. 부모를 다시 늘리면 자식이 돌아옵니다

  <color=#5EC8C8><b>팁:</b></color> <b>선택</b> 도구는 선택하고 드래그하며, <b>가장자리</b> 도구는 가장자리 모양을 바꾸고, <b>가위</b> 도구는 커서 위치에서 클립을 자릅니다. 빈 곳을 오른쪽 클릭하면 메뉴가 열립니다

  자세히: <link="https://bullethero.space/ko/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>에디터의 작동 방식</color></link>, <link="https://bullethero.space/ko/docs/editor/craft/composition-and-camera"><color=#59A6FF>구도와 카메라</color></link>
hint_editor_timeline-level_header: "레벨 타임라인"
hint_editor_timeline-local_body: |-
  <b>선택한 오브젝트</b>의 키프레임으로, 트랙마다 행이 하나씩 있습니다. 프레임은 오브젝트 구간의 시작부터 세므로, 오브젝트를 옮기면 애니메이션 전체가 함께 이동합니다

  <color=#B48CE0><b>참고:</b></color> <b>빈 트랙도 유효한 데이터</b>입니다. 빈 트랙은 기본값을 사용하므로, 새 오브젝트는 키프레임을 추가하기 전까지 아무것도 애니메이션하지 않습니다

  자세히: <link="https://bullethero.space/ko/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>에디터의 작동 방식</color></link>
hint_editor_timeline-local_header: "로컬 타임라인"
hint_editor_timeline-prefab_body: |-
  프리팹 모드 전용 타임라인으로, <b>템플릿</b>의 오브젝트를 다룹니다. 길이는 어떤 배치의 구간이 아니라 템플릿 자체의 길이입니다

  <color=#E8B04B><b>경고:</b></color> 선택은 에디터의 나머지 부분과 공유되지 않습니다. 여기서 한 편집은 템플릿을 바꾸고, 그 템플릿의 모든 배치에 퍼집니다

  자세히: <link="https://bullethero.space/ko/docs/editor/workflow/reuse"><color=#59A6FF>재사용: 프리팹, 복사, 생성기</color></link>
hint_editor_timeline-prefab_header: "프리팹 타임라인"
hint_editor_value-type-color: "재생할 때마다 색상을 어디서 가져올지 정합니다. 값 - 입력한 그대로입니다. 테마 - 그 프레임의 테마 슬롯이므로, 테마가 바뀌면 함께 바뀝니다. 무작위 범위 - 채널마다 따로 굴리므로, 색상이 두 값 사이 어디에나 놓일 수 있습니다. 무작위(A-B) - 모든 채널에 한 번만 굴리므로, 색상은 항상 A에서 B로 가는 선 위에 놓입니다"
hint_editor_value-type-number: "재생할 때마다 이 숫자를 어떻게 정할지 결정합니다. 값 - 입력한 숫자 그대로입니다. 무작위 범위 - 두 경계 사이의 숫자입니다. 무작위 범위, 단계 - 같은 방식이지만 그 크기의 그리드에 스냅됩니다. 성분 하나는 원래 정확히 숫자 하나만 뽑으므로, 여기에는 A에서 B로 가는 형식이 없습니다. 무작위 값은 뽑는 것이 아니라 주소로 정해지므로, 같은 레벨은 모든 기기에서 똑같이 재생되며, 오브젝트나 그 레이어를 옮기면 값이 다시 정해집니다"
hint_editor_value-type-vector: "재생할 때마다 이 벡터를 어떻게 정할지 결정합니다. 값 - 입력한 숫자 그대로입니다. 무작위(사각형) - 각 축이 자기 두 경계 사이에서 따로 굴려져 사각형을 채웁니다. 무작위(A-B) - 단 한 번 굴리고 모든 축이 같은 위치에서 읽으므로, 점이 A에서 B로 가는 직선 위를 움직입니다. 양 끝의 숫자가 같은 축은 움직이지 않습니다. 무작위(원) - 중심 주위 원판 위의 한 점입니다. 단계 형식은 결과를 그리드에 스냅합니다. 무작위 값은 뽑는 것이 아니라 주소로 정해지므로, 같은 레벨은 모든 기기에서 똑같이 재생됩니다"
hint_editor_video-export_audio: "레벨의 트랙을 음량 및 팬 키프레임과 함께 동영상에 넣습니다"
hint_editor_video-export_body: |-
  이 컴퓨터에 설치된 ffmpeg 프로그램으로 열린 레벨을 동영상으로 렌더링합니다

  <color=#B48CE0><b>참고:</b></color> 렌더링은 오프라인으로 한 프레임씩 진행되므로, 컴퓨터가 아무리 느려도 동영상은 정확합니다. ffmpeg 자체는 게임에 포함되어 있지 않습니다. 한 번 설치하면 이 창이 찾아냅니다. 직접 지정할 수도 있습니다
  자세히: <link="https://bullethero.space/ko/docs/editor/reference/video-export"><color=#59A6FF>동영상 내보내기</color></link>
hint_editor_video-export_bot: "동영상에서 레벨을 플레이하는 주체입니다. Reflex 봇은 한순간 앞을 읽으며 준비가 필요 없습니다. Warm 봇은 첫 프레임 전에 전체 경로를 미리 계산합니다. 내보내는 동안에는 피격이 아무 효과도 없습니다"
hint_editor_video-export_codec: "컨테이너 안에서 화면이나 사운드를 압축하는 방식입니다. 설치된 ffmpeg에서 만들 수 있는 것만 목록에 나옵니다. 아래 줄에 함께 쓰이는 사운드 코덱과 결과 파일이 표시됩니다"
hint_editor_video-export_effects: "레벨의 파티클 이펙트를 동영상에 넣습니다. 에디터와 같은 스위치이지만 동영상에만 적용됩니다"
hint_editor_video-export_engine-audio: "켜짐: 트랙에 효과가 있으면 프레임을 렌더링하는 동안 레벨의 사운드가 실시간으로 재생되고, 모든 효과를 포함한 게임 자체의 사운드가 녹음되며, 스피커에서는 소리가 나지 않습니다. 내보내기는 최소한 범위의 길이만큼 걸립니다. 꺼짐: 트랙은 효과 없이 따로 믹스됩니다. 사운드만 형식은 항상 따로 믹스됩니다"
hint_editor_video-export_ffmpeg: "동영상 인코딩은 ffmpeg 프로그램이 맡으며, 게임에 포함되어 있지 않습니다. 녹색은 찾았고 준비된 상태, 주황색은 너무 오래된 버전, 빨간색은 찾지 못했거나 실행되지 않는 상태입니다. ffmpeg 선택 버튼은 파일을 직접 지정하고, 다시 확인 버튼은 검색을 반복합니다"
hint_editor_video-export_fps: "동영상의 초당 프레임 수로, 최대 240까지이며 레벨 자체의 프레임 레이트와 무관합니다. 60 미만이면 각 프레임을 여러 단계로 시뮬레이션하므로, 봇이 게임에서와 똑같이 플레이합니다"
hint_editor_video-export_full-chroma: "픽셀 두 개 중 하나가 아니라 모든 픽셀에 색상 정보를 담습니다. 가는 색 선이 선명하게 유지되지만, 파일이 커지고 일부 재생 프로그램에서는 열리지 않습니다"
hint_editor_video-export_header: "동영상 내보내기"
hint_editor_video-export_output: "동영상이 저장되는 위치입니다. 기본 위치는 게임 데이터 폴더의 recordings/[레벨 ID] 폴더이며, 레벨을 삭제해도 남아 있습니다"
hint_editor_video-export_post-processing: "레벨의 포스트 프로세싱(블룸, 색 보정 등)을 동영상에 넣습니다. 에디터와 같은 스위치이지만 동영상에만 적용됩니다"
hint_editor_video-export_preroll: "시작 전에 재생되지만 녹화되지 않는 시간(초)으로, 첫 프레임에서 이펙트와 파티클이 이미 진행된 상태가 되게 합니다"
hint_editor_video-export_preset: "파일 종류입니다. MP4 형식은 어디서나 열리고, MKV, MOV 형식은 편집용, WebM 형식은 웹용입니다. GIF, WebP, APNG 형식은 사운드 없는 짧은 클립이고, 이미지 시퀀스는 프레임 이미지가 담긴 폴더이며, 사운드만 형식은 화면을 전혀 렌더링하지 않습니다"
hint_editor_video-export_quality: "동영상이 차지하는 용량을 정합니다. 초안은 작고 흐릿하며, 무손실은 모든 픽셀을 보존하고 용량이 큽니다"
hint_editor_video-export_range: "레벨의 어느 부분을 녹화할지 정합니다: 레벨 전체, 타임라인의 반복 범위, 또는 직접 지정한 시작 프레임과 끝 프레임"
hint_editor_video-export_resolution: "동영상의 크기(픽셀)입니다. 사용자 지정에서는 짝수인 너비와 높이를 무엇이든 입력할 수 있습니다. 레벨의 카메라가 안쪽에 맞춰지고, 남는 부분은 검은 띠로 채워집니다"
hint_editor_video-export_seed: "레벨 무작위성의 시드입니다. 0이면 에디터가 지금 쓰는 시드를 유지하고, 다른 숫자는 매번 같은 동영상을 만듭니다"
hint_editor_video-export_sound-after-frames: "꺼짐(기본값): 효과가 적용된 사운드를 프레임 렌더링과 동시에 녹음하며, 내보내기는 둘 중 더 긴 쪽만큼 걸립니다. 켜짐: 마지막 프레임 다음에 사운드를 실시간으로 녹음하므로, 내보내기가 범위의 길이만큼 더 오래 걸립니다. 레벨이 무겁고 녹음된 사운드가 끊길 때 켜십시오"
hint_gen_audio_waveform_body: |-
  오디오 트랙의 모양을 따라가는 오브젝트를 만들어, 레벨이 들리는 소리를 눈에 보이게 따라가도록 합니다

  자세히: <link="https://bullethero.space/ko/docs/editor/workflow/reuse"><color=#59A6FF>재사용: 프리팹, 복사, 생성기</color></link>
hint_gen_audio_waveform_header: "오디오 파형"
hint_gen_beat_flash_body: |-
  모든 비트에 플래시를 배치합니다. 비트는 레벨의 비트 맵에서 가져오고, 맵이 없으면 마커에서 가져옵니다. 그래서 깜박이는 것은 그리드에서 보이는 것과 정확히 같습니다

  자세히: <link="https://bullethero.space/ko/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>리듬과 구조</color></link>
hint_gen_beat_flash_header: "비트 플래시"
hint_gen_bullet_homing_body: |-
  플레이어가 있을 것으로 예상되는 곳을 향해 휘어지는 탄환입니다. 커브는 재생 중에 계산되는 것이 아니라 미리 작성되므로, 결과는 모든 기기에서 똑같습니다

  자세히: <link="https://bullethero.space/ko/docs/editor/craft/readability-and-fairness"><color=#59A6FF>가독성과 공정성</color></link>
hint_gen_bullet_homing_header: "유도 탄환"
hint_gen_bullet_laser_sweep_body: |-
  필드를 가로질러 휩쓰는 빔입니다. 예고 표시와 치명적인 단계가 서로 다른 오브젝트이므로, 경고를 그리면서도 피해를 주지 않게 할 수 있습니다

  자세히: <link="https://bullethero.space/ko/docs/editor/craft/readability-and-fairness"><color=#59A6FF>가독성과 공정성</color></link>
hint_gen_bullet_laser_sweep_header: "레이저 스윕"
hint_gen_bullet_rain_body: |-
  일정 시간 동안 영역 전체에 떨어지는 탄환입니다. 밀도와 확산은 파라미터입니다. 각 탄환이 떨어지는 위치는 레벨의 시드에서 정해지므로, 같은 플레이가 재현됩니다

  자세히: <link="https://bullethero.space/ko/docs/editor/craft/readability-and-fairness"><color=#59A6FF>가독성과 공정성</color></link>
hint_gen_bullet_rain_header: "탄환 비"
hint_gen_bullet_spiral_body: |-
  회전하는 팔을 따라 발사되는 탄환으로, 전형적인 나선형 탄막 벽을 만듭니다

  자세히: <link="https://bullethero.space/ko/docs/editor/craft/readability-and-fairness"><color=#59A6FF>가독성과 공정성</color></link>
hint_gen_bullet_spiral_header: "탄환 나선"
hint_gen_bullet_wave_body: |-
  함께 전진하는 탄환 한 줄입니다. 가장 기본적인 패턴이자 가장 먼저 읽어 볼 만한 생성기입니다: 이 생성기의 파라미터 이름이 다른 탄환 생성기들이 재사용하는 개념을 나타냅니다

  자세히: <link="https://bullethero.space/ko/docs/editor/craft/readability-and-fairness"><color=#59A6FF>가독성과 공정성</color></link>
hint_gen_bullet_wave_header: "탄환 웨이브"
hint_gen_capacity_hint_body: |-
  레벨의 권장 한도, 즉 동시에 필요할 것으로 예상되는 오브젝트와 이펙트의 수를 기록합니다

  <color=#B48CE0><b>참고:</b></color> 눈에 보이는 것은 아무것도 바뀌지 않습니다. 런타임은 이 값으로 버퍼를 레벨 도중에 늘리지 않고 미리 확보하는데, 도중에 늘리는 것이 바로 끊김의 원인이 됩니다

  자세히: <link="https://bullethero.space/ko/docs/editor/performance/level-budget"><color=#59A6FF>레벨 예산</color></link>
hint_gen_capacity_hint_header: "용량 힌트"
hint_gen_font_cache_body: |-
  레벨의 텍스트가 실제로 사용하는 모든 문자를 모아 베이크하므로, 글리프가 처음 나타날 때 따로 준비할 필요가 없습니다

  <color=#7FC97F><b>권장:</b></color> 텍스트를 확정한 뒤에 실행하십시오. 나중에 추가하고 다시 베이크하지 않은 문자는 처음 표시되는 순간 끊김을 일으킵니다

  자세히: <link="https://bullethero.space/ko/docs/editor/resources/images-and-fonts"><color=#59A6FF>이미지와 폰트</color></link>
hint_gen_font_cache_header: "폰트 캐시"
hint_gen_geometry_fractal_body: |-
  도형을 점점 작아지는 스케일로 자기 안에 반복합니다. 깊이가 늘면 오브젝트 수가 기하급수적으로 늘어나므로, 한 단계씩 올리십시오

  자세히: <link="https://bullethero.space/ko/docs/editor/workflow/reuse"><color=#59A6FF>재사용: 프리팹, 복사, 생성기</color></link>
hint_gen_geometry_fractal_header: "프랙털"
hint_gen_geometry_grid_body: |-
  직사각형 영역을 같은 간격으로 놓인 도형 복사본으로 채웁니다

  자세히: <link="https://bullethero.space/ko/docs/editor/workflow/reuse"><color=#59A6FF>재사용: 프리팹, 복사, 생성기</color></link>
hint_gen_geometry_grid_header: "그리드"
hint_gen_geometry_polygon_body: |-
  정다각형의 꼭짓점이나 변을 따라 도형을 배치합니다

  자세히: <link="https://bullethero.space/ko/docs/editor/workflow/reuse"><color=#59A6FF>재사용: 프리팹, 복사, 생성기</color></link>
hint_gen_geometry_polygon_header: "다각형"
hint_gen_geometry_radial_body: |-
  복사본을 원 둘레에 배치합니다. 대부분의 대칭 패턴의 기본입니다

  자세히: <link="https://bullethero.space/ko/docs/editor/workflow/reuse"><color=#59A6FF>재사용: 프리팹, 복사, 생성기</color></link>
hint_gen_geometry_radial_header: "방사형"
hint_gen_geometry_spiral_body: |-
  반지름과 각도가 함께 커지는 나선을 따라 복사본을 배치합니다

  자세히: <link="https://bullethero.space/ko/docs/editor/workflow/reuse"><color=#59A6FF>재사용: 프리팹, 복사, 생성기</color></link>
hint_gen_geometry_spiral_header: "나선"
hint_gen_level_archive_body: |-
  이 게임에서 만든 아카이브로 레벨을 만듭니다. .tar.gz 또는 .zip이며, 어느 쪽이든 비밀번호로 보호할 수 있습니다. 종류는 파일의 바이트로 판별하므로 이름을 바꾼 아카이브도 열립니다. 이전 빌드에서 만든 아카이브는 가져오는 과정에서 마이그레이션됩니다

  <color=#E8B04B><b>경고:</b></color> 가져온 레벨은 기본적으로 고유한 ID를 새로 받으므로, 이 기기에 이미 있는 레벨을 덮어쓸 수 없습니다. 이 기기에 있던 레벨을 되돌려 놓을 때만 이 옵션을 끄십시오

  자세히: <link="https://bullethero.space/ko/docs/editor/reference/generators"><color=#59A6FF>생성기</color></link>
hint_gen_level_archive_header: "레벨 아카이브 가져오기"
hint_gen_level_audio_file_body: |-
  트랙에서 레벨을 시작합니다. 오디오를 가져오고, 레벨 길이를 트랙 길이에 맞춘 뒤, 빈 타임라인의 맨 앞에서 작업을 시작하게 합니다

  자세히: <link="https://bullethero.space/ko/docs/editor/resources/preparing-the-track"><color=#59A6FF>트랙 준비하기</color></link>
hint_gen_level_audio_file_header: "오디오 파일로 레벨 만들기"
hint_gen_level_empty_body: |-
  레벨을 완전히 비웁니다. 만든 모든 내용이 제거되므로, 편집하는 대신 처음부터 다시 시작할 때 쓰는 생성기입니다

  자세히: <link="https://bullethero.space/ko/docs/editor/basics/first-level"><color=#59A6FF>첫 레벨: 경로</color></link>
hint_gen_level_empty_header: "빈 레벨"
hint_gen_section_additional: "주요 파라미터 위에 더하는 세부 조정입니다. 보통은 이곳의 기본값으로 충분합니다"
hint_gen_section_main: "이 생성기가 무엇을 만들지 결정하는 파라미터입니다. 여기서 시작하십시오"
hint_gen_test_camera_flash_body: "카메라 이벤트 트랙을 테스트하기 위해 남겨 둔 개발용 생성기입니다. 콘텐츠 제작용이 아닙니다"
hint_gen_test_camera_flash_header: "카메라 플래시 (테스트)"
hint_gen_test_form_body: "폼이 만들 수 있는 모든 파라미터 컨트롤을 실행해 보는 개발용 생성기입니다. 콘텐츠 제작용이 아닙니다"
hint_gen_test_form_header: "폼 (테스트)"
hint_gen_test_odd_body: "일부러 까다롭게 만든 파라미터 사례를 담은 개발용 생성기입니다. 콘텐츠 제작용이 아닙니다"
hint_gen_test_odd_header: "특이 사례 (테스트)"
hint_gen_test_partial_order_body: "순서 힌트에 언급되지 않은 필드가 어떻게 배치되는지 확인하는 개발용 생성기입니다. 콘텐츠 제작용이 아닙니다"
hint_gen_test_partial_order_header: "부분 순서 (테스트)"
hint_gen_test_scatter_body: "주소 지정 무작위성 경로를 위한 개발용 생성기입니다. 콘텐츠 제작용이 아닙니다"
hint_gen_test_scatter_header: "흩뿌리기 (테스트)"
hint_gen_test_sections_body: "여러 섹션으로 된 폼을 만드는 개발용 생성기입니다. 콘텐츠 제작용이 아닙니다"
hint_gen_test_sections_header: "섹션 (테스트)"
hint_gen_test_spawn_body: "오브젝트 생성 경로를 위한 개발용 생성기입니다. 콘텐츠 제작용이 아닙니다"
hint_gen_test_spawn_header: "스폰 (테스트)"
hint_gen_texture_objects_body: |-
  이미지를 셀마다 오브젝트 하나씩으로 바꿉니다. 그림이 다른 모든 것처럼 애니메이션할 수 있는 레벨 콘텐츠가 됩니다

  자세히: <link="https://bullethero.space/ko/docs/editor/resources/images-and-fonts"><color=#59A6FF>이미지와 폰트</color></link>
hint_gen_texture_objects_header: "텍스처 오브젝트"
hint_level-preview_authors: "이 레벨에 이름이 올라간 모든 사람입니다. 제작자 정보는 레벨 폴더 안에 함께 들어 있으므로, 압축해서 보내고 다른 사람이 다시 업로드해도 유지됩니다"
hint_level-preview_licenses_body: |-
  이 레벨과 그 리소스에 적용되는 조건입니다. <b>조건은 리소스마다 따로 기록되므로</b>, 빌려 온 부분으로 만든 레벨은 무엇을 어떤 조건으로 빌려 왔는지 정확히 알려 줍니다

  <color=#7FC97F><b>권장:</b></color> 다른 사람의 레벨에서 무언가를 재사용하기 전에 먼저 읽어 보십시오

  자세히: <link="https://bullethero.space/ko/docs/editor/rights/licensing-basics"><color=#59A6FF>라이선스: 3분 만에 보는 핵심</color></link>
hint_level-preview_licenses_header: "라이선스"
hint_level_backups: "이 레벨의 모든 자동 복사본으로, 최신 항목이 맨 위에 있습니다. 이름은 복사본을 만든 시각입니다. 하나를 고르기 전에는 아무것도 읽지 않습니다. 복원하면 디스크의 레벨 파일을 교체하고 다시 불러오며, 교체되는 파일은 먼저 백업으로 기록되므로 복원 자체도 되돌릴 수 있습니다"
hint_level_collections_body: |-
  <b>가져오기</b>는 컬렉션의 항목을 이 레벨로 가져오고, <b>컬렉션 만들기</b>는 이 레벨의 리소스를 컬렉션 하나로 복사해 냅니다. 항목에 필요한 모든 것이 함께 따라오며, 가져오기는 실행 취소 한 번으로 되돌릴 수 있습니다

  <color=#E8B04B><b>경고:</b></color> 레벨에 이미 다른 버전의 항목이 있으면 게임이 묻습니다. 레벨의 버전을 유지하거나, 컬렉션의 버전을 새 ID를 가진 복사본으로 가져오십시오

  자세히: <link="https://bullethero.space/ko/docs/editor/reference/library-and-collections"><color=#59A6FF>라이브러리와 컬렉션</color></link>
hint_level_collections_header: "컬렉션"
hint_level_core-framerate: "이 값을 직접 바꾸면 모든 오브젝트가 빨라지거나 느려집니다. 키프레임은 프레임 번호를 그대로 유지하므로 같은 레벨이 다른 속도로 재생됩니다. 콘텐츠를 다른 프레임 레이트에 맞춰 다시 배치하려면 생성기를 사용하십시오"
hint_level_core-level-id: "이 레벨의 영구 식별자로, 레벨을 만들 때 한 번 생성되며 편집되지 않습니다. 레벨의 문제를 보고할 때 이 값을 함께 알리고, 같은 레벨의 두 복사본을 구별할 때 사용하십시오"
hint_level_core-orientation_body: |-
  이 레벨을 어느 방향으로 들고 플레이해야 하는지 정합니다

  <b>가로</b>와 <b>세로</b>는 레벨 동안 플레이어의 기기를 돌리며, 플레이어 자신의 설정보다 우선합니다. 데스크톱에서는 세로 레벨이 양옆에 막대가 있는 상태로 플레이되며, 원래 그렇게 보여야 합니다

  <b>미지정</b>은 선택을 플레이어에게 맡기며, 레벨이 <b>두 방향 모두</b>에서 제대로 읽힌다는 <b>선언</b>입니다. 이를 위해 화면을 다시 맞추거나 크기를 조정하지 않으므로, 먼저 두 방향 모두에서 레벨을 확인하십시오

  자세히: <link="https://bullethero.space/ko/docs/editor/reference/level-settings"><color=#59A6FF>레벨 설정</color></link>
hint_level_core-orientation_header: "레벨 방향"
hint_level_core-runtime-seed: "이 에디터 세션이 지금 실제로 사용하는 시드입니다. 위의 시드가 없으면 레벨을 불러올 때마다 새 숫자가 됩니다. 다시 생성 버튼은 레벨을 건드리지 않고 다른 숫자를 뽑습니다"
hint_level_core-seed: "이 레벨의 모든 무작위 값은 이 시드와 각 오브젝트 자신의 레이어, 시작 프레임으로부터 정해지므로, 같은 시드는 항상 똑같이 플레이됩니다. 0은 시드 없음을 뜻하며, 게임이 실행할 때마다 새 시드를 만듭니다"
hint_level_core_body: |-
  프레임 길이, 프레임 레이트, 그리고 레벨의 두 시드입니다

  <color=#B48CE0><b>참고:</b></color> <b>프레임은 1부터 셉니다.</b> 프레임이 N개인 레벨에는 1부터 N까지의 프레임이 있고, N+1은 프레임이 아니라 끝 경계입니다

  <b>레벨 시드</b>는 레벨 자체의 값이며 실행 취소할 수 있습니다. 0은 "실행할 때마다 새 시드"를 뜻하며 기본값입니다

  <color=#5EC8C8><b>팁:</b></color> <b>런타임 시드</b>는 이 에디터 세션에서 정해진 값을 보여 줍니다. <i>다시 생성</i>은 이 세션에만 새 값을 뽑습니다. 아무것도 기록되지 않고 실행 취소 기록에도 들어가지 않습니다

  자세히: <link="https://bullethero.space/ko/docs/editor/basics/frames-and-time"><color=#59A6FF>프레임, 시간, 레벨 길이</color></link>
hint_level_core_header: "기본"
hint_level_dangerous_body: |-
  콘텐츠가 아니라 파일을 파괴하거나 다시 쓰는 작업입니다

  <color=#E86A5A><b>주의:</b></color> <b>파일 형식</b> 드롭다운은 디스크에 있는 레벨과 그 메타데이터를 다시 씁니다. 다른 형식으로 다시 쓰면 <b>이전 형식이 남긴 파일이 삭제됩니다</b>. 그 밖에는 아무 일도 일어나지 않습니다. 다시 불러오기도, 다시 시뮬레이션도, 선택 항목이나 실행 취소 스택의 초기화도 없습니다. 메모리에 있는 모델이 이미 기록되는 내용 그대로이기 때문입니다

  <color=#E86A5A><b>주의:</b></color> <b>레벨 삭제</b>는 디스크에서 레벨 폴더를 제거합니다. 이 작업은 실행 취소할 수 없습니다

  자세히: <link="https://bullethero.space/ko/docs/editor/workflow/not-losing-work"><color=#59A6FF>작업을 잃지 않기</color></link>
hint_level_dangerous_header: "위험 구역"
hint_level_effect-editor_body: |-
  파티클 이펙트를 제작하고 캔버스에서 미리 봅니다

  <color=#B48CE0><b>참고:</b></color> 파라미터 그룹은 이펙트 인스펙터에 표시되는 것과 같으며, 여기서는 <b>초안</b>으로 편집됩니다. 저장하기 전에는 레벨에 아무것도 반영되지 않습니다

  <color=#5EC8C8><b>팁:</b></color> 여러 레벨에서 이펙트를 재사용하려면 이 기기의 공유 라이브러리에 저장하십시오

  자세히: <link="https://bullethero.space/ko/docs/editor/performance/level-budget"><color=#59A6FF>레벨 예산</color></link>
hint_level_effect-editor_header: "이펙트 에디터"
hint_level_font-cache: "레벨이 미리 구워 두는 글리프로, 문자가 처음 나타날 때 텍스트가 멈칫하지 않도록 폰트별, 언어별로 관리합니다. 읽기 전용입니다. 폰트 캐시 생성기가 레벨에 실제로 들어 있는 텍스트를 바탕으로 채우며, 이 탭에서는 아무것도 편집할 수 없습니다"
hint_level_history_body: |-
  이번 세션의 모든 편집이 여기에 한 행씩 표시되며, git log처럼 최신 항목이 맨 위에 있습니다. 가장 왼쪽 열은 메인 라인이고, 따로 떨어진 열은 실행 취소 후 다른 길로 가면서 남겨 둔 브랜치입니다. 링은 현재 위치를, 녹색 원은 마지막 저장을 표시합니다

  행을 클릭하면 레벨이 바로 그 상태로 되돌아가며, 프레임마다 작업 하나씩 진행됩니다. 기록은 이 세션에만 있고 디스크에 저장되지 않습니다

  <color=#E8B04B><b>경고:</b></color> 이동이 진행되는 동안 에디터는 읽기 전용입니다. 취소하면 그 자리에서 멈추며, 그 상태는 항상 실제로 존재하는 상태입니다

  자세히: <link="https://bullethero.space/ko/docs/editor/reference/level-settings"><color=#59A6FF>레벨 설정</color></link>
hint_level_history_header: "기록"
hint_level_library-browser_body: |-
  <b>이 기기</b>에 저장되어 여기서 여는 모든 레벨이 함께 쓰는 리소스입니다

  <color=#B48CE0><b>참고:</b></color> 가져오기는 리소스를 <i>레벨 안으로</i> 복사합니다. 레벨은 필요한 모든 것을 직접 담고 있으므로, 라이브러리는 만드는 쪽의 편의 기능일 뿐 레벨을 플레이하는 사람에게는 의존성이 되지 않습니다

  자세히: <link="https://bullethero.space/ko/docs/editor/workflow/reuse"><color=#59A6FF>재사용: 프리팹, 복사, 생성기</color></link>
hint_level_library-browser_header: "라이브러리"
hint_level_metadata-logo: "레벨 폴더에 <color=#D4B483>logo.png</color> 파일로 복사되어 레벨이 나열되는 모든 곳에 표시됩니다. 정사각형 <color=#D4B483>512x512</color> <color=#D4B483>PNG</color> 이미지를 기준으로 합니다 - 더 작으면 레벨 탐색기에서 흐릿해지고, 더 크면 용량만 차지합니다. 제거 버튼은 참조만 지울 뿐 파일 자체는 폴더에 남습니다"
hint_level_metadata-tags_body: |-
  태그는 제작자가 직접 정하는 단어이며, 쓴 그대로 표시되고 번역되지 않습니다. 플레이어가 레벨 탐색기에서 태그로 필터링하므로, 태그는 다른 레벨도 같은 태그를 쓸 때만 도움이 됩니다

  쉼표로 구분합니다. 짧고 일반적인 단어로 정하십시오: 장르, 분위기, 메커닉

  자세히: <link="https://bullethero.space/ko/docs/editor/reference/level-settings"><color=#59A6FF>레벨 설정</color></link>
hint_level_metadata-tags_header: "레벨 태그"
hint_level_metadata_body: |-
  레벨 자체가 아닌, 레벨에 관한 모든 것입니다: 이름, 설명, 커버, 라이선스, 연령 등급, 제작자

  <color=#B48CE0><b>참고:</b></color> 이름과 설명은 <b>현지화 문자열</b>입니다 - 키 없이 언어별 텍스트를 여기서 바로 작성합니다. 레벨은 게임 인터페이스의 일부가 아니라 콘텐츠이기 때문입니다. 작성하지 않은 언어를 쓰는 플레이어에게는 작성된 첫 번째 항목이 표시됩니다

  라이선스와 제작자 정보는 레벨이 공유되는 어디로든 함께 따라가므로, 다시 업로드되어도 출처 표기가 남습니다

  자세히: <link="https://bullethero.space/ko/docs/editor/reference/metadata-and-sharing"><color=#59A6FF>메타데이터와 레벨 공유</color></link>
hint_level_metadata_header: "메타데이터"
hint_level_play-seed: "0 = 레벨 자체의 시드를 사용하거나, 없으면 플레이마다 새 시드를 사용합니다"
hint_level_play_body: |-
  <color=#B48CE0><b>참고:</b></color> <b>이번 플레이에만</b> 적용되는 실행 옵션입니다 - 여기서 정한 것은 레벨에 저장되지 않습니다

  <color=#5EC8C8><b>팁:</b></color> 목숨, 속도, 체크포인트, 자동 플레이를 쓰면 레벨의 한 부분을 편집하지 않고도 연습할 수 있습니다. 여기의 <b>시드</b>는 레벨 자체의 시드보다 우선합니다: 세 단계 중 가장 높은 단계이며, 방금 본 플레이를 그대로 다시 재현하고 싶을 때 쓰는 것이 바로 이 시드입니다

  자세히: <link="https://bullethero.space/ko/docs/editor/craft/difficulty-curve"><color=#59A6FF>난이도와 곡선</color></link>
hint_level_play_header: "플레이"
hint_level_publication_body: |-
  이 레벨을 어딘가로 보내는 모든 방법입니다. 위에서 방법을 고르면 그 방법의 설정이 표시되고 레벨을 알아서 검사합니다. 보고서의 오류는 전송을 막고, 경고와 조언은 제작자의 판단에 맡깁니다

  <b>아카이브</b>는 어디서나 동작합니다. 일반 <b>.zip</b>은 아무것도 설치하지 않아도 Windows 탐색기에서 열립니다. <b>+ 비밀번호</b>는 7-Zip이나 다른 압축 프로그램에서 열리고, <b>(gpg)</b>는 gpg로 열립니다
  <b>Steam 창작마당</b>은 Steam 빌드에만 있으며 창작마당 규칙에 따라 레벨을 검사합니다

  <color=#5EC8C8><b>팁:</b></color> 창작마당에는 먼저 <b>비공개</b>로 게시하고, 모두에게 공개하기 전에 항목을 확인하십시오. 두 번째 게시는 같은 항목을 업데이트합니다

  <color=#E8B04B><b>경고:</b></color> 비밀번호는 DRM이 아닙니다. 파일과 비밀번호를 가진 사람은 언제든 파일을 열 수 있습니다

  자세히: <link="https://bullethero.space/ko/docs/editor/reference/publishing"><color=#59A6FF>게시</color></link>
hint_level_publication_header: "게시"
hint_level_raw-add: "이 창을 연 슬롯에 요소를 하나 추가합니다. 여기서는 새 요소 자체의 말단 필드만 제공됩니다. 중첩된 항목은 기본값으로 남으며 이후 트리에서 편집합니다"
hint_level_raw_body: |-
  저장되는 레벨 모델 전체를 하나의 필드 트리로 보여 줍니다 - 에디터가 처리하기 전의 파일 그대로입니다

  <color=#E86A5A><b>주의:</b></color> <b>여기서는 아무것도 검증하지 않습니다.</b> 에디터의 다른 부분에서는 불가능하다고 보는 값도 그대로 기록되므로, 레벨 폴더의 사본을 가까이 두십시오

  채워진 점은 이번 세션에서 바꾼 필드를, 빈 점은 그 안의 무언가가 바뀐 필드를 뜻합니다. <b>적용</b>은 세션 전체를 실행 취소할 수 있는 작업 하나로 반영합니다

  자세히: <link="https://bullethero.space/ko/docs/editor/workflow/not-losing-work"><color=#59A6FF>작업을 잃지 않기</color></link>
hint_level_raw_header: "원시 데이터"
hint_level_resource-meta_body: |-
  리소스 하나의 제목, 설명, 출처, 라이선스, 제작자입니다

  <color=#B48CE0><b>참고:</b></color> 출처 표기는 이렇게 유지됩니다: 어딘가에서 가져온 텍스처, 폰트, 오디오 파일은 어디서 왔고 어떤 조건으로 쓰는지를 레벨 안에 담아, 레벨이 가는 곳마다 함께 가져갑니다

  <color=#7FC97F><b>권장:</b></color> 리소스를 추가할 때 바로 채우십시오 - 출처를 아직 기억하는 유일한 순간입니다

  자세히: <link="https://bullethero.space/ko/docs/editor/rights/resource-record"><color=#59A6FF>리소스 기록</color></link>
hint_level_resource-meta_header: "리소스 메타데이터"
hint_level_resources-audios: "이 레벨이 담고 있는 오디오 파일입니다. 먼저 여기에 추가한 다음, 오디오 타임라인에 트랙으로 배치하십시오"
hint_level_resources-effects_body: |-
  레벨이 배치할 수 있는 <color=#D4B483>VFX Graph</color> 파티클 이펙트입니다. 이펙트는 <b>선택 사항</b>입니다: 이펙트를 하나도 쓰지 않는 레벨도 설계한 그대로 플레이됩니다

  이펙트는 레벨의 시드 기반 무작위성을 사용하므로 어떤 기기에서든 똑같이 재생됩니다. 이펙트는 이 기기의 공유 라이브러리로 내보낼 수 있습니다

  자세히: <link="https://bullethero.space/ko/docs/editor/performance/level-budget"><color=#59A6FF>레벨 예산</color></link>
hint_level_resources-effects_header: "이펙트"
hint_level_resources-fonts: "이 레벨이 텍스트 오브젝트에 쓰는 폰트입니다. 다른 모든 리소스와 마찬가지로 폰트는 레벨 옆에 있으며 레벨과 함께 옮겨집니다"
hint_level_resources-prefabs_body: |-
  재사용할 수 있는 오브젝트 그룹입니다. 프리팹은 템플릿 오브젝트를 담고, 각 배치는 그 실제 사본을 받습니다. 템플릿을 편집하면 모든 배치에 반영되며, 그래도 배치 하나를 인스턴스별 오버라이드로 다르게 만들 수 있습니다

  <color=#E8B04B><b>경고:</b></color> 테마, 이펙트, 콜라이더와 달리 프리팹에는 <b>게임이 제공하는 프리셋이 없습니다</b> - 프리팹을 다른 레벨로 옮기는 방법은 라이브러리와 컬렉션입니다

  자세히: <link="https://bullethero.space/ko/docs/editor/workflow/reuse"><color=#59A6FF>재사용: 프리팹, 복사, 생성기</color></link>
hint_level_resources-prefabs_header: "프리팹"
hint_level_resources-shapes_body: |-
  게임이 생성하는 약 500종에 더해지는 레벨 자체의 도형입니다. 도형은 경계 상자에 맞춰진 <b>실제 지오메트리</b>이므로, 오브젝트의 직사각형이 곧 그려지는 범위입니다

  <color=#5EC8C8><b>팁:</b></color> 도형과 콜라이더는 같은 종류의 데이터이며, 오브젝트는 그려지는 모습에는 하나를, 맞는 범위에는 다른 하나를 가리킵니다. 어느 쪽도 다른 쪽에서 파생되지 않으므로, 해가 없는 예고 광선이나 보이지 않는 벽도 평범한 콘텐츠입니다

  자세히: <link="https://bullethero.space/ko/docs/editor/resources/level-needs"><color=#59A6FF>레벨에 필요한 것</color></link>
hint_level_resources-shapes_header: "도형"
hint_level_resources-textures_body: |-
  이 레벨이 담고 있는 이미지입니다. <b>게임 자체는 텍스처를 하나도 제공하지 않습니다</b> - 레벨이 쓰는 모든 텍스처는 여기서 추가되어 레벨 폴더에 있으므로 레벨과 함께 옮겨집니다

  <color=#B48CE0><b>참고:</b></color> 도형은 텍스처가 <b>아닙니다</b>. 도형은 실제 지오메트리이며 이 탭에서 필요로 하는 것이 없습니다

  자세히: <link="https://bullethero.space/ko/docs/editor/resources/images-and-fonts"><color=#59A6FF>이미지와 폰트</color></link>
hint_level_resources-textures_header: "텍스처"
hint_level_resources-themes_body: |-
  테마는 고정 값 대신 <b>레벨의 색이 가리킬 수 있는 팔레트</b>입니다. 활성 테마를 바꾸면 그 테마를 가리키는 모든 것의 스타일이 바뀌며, 이 전환은 이벤트 타임라인에 키프레임으로 지정합니다

  <color=#5EC8C8><b>팁:</b></color> 테마를 이 기기의 공유 라이브러리로 내보내면 다른 레벨에서도 다시 쓸 수 있습니다

  자세히: <link="https://bullethero.space/ko/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>색상, 테마, 포스트 프로세싱</color></link>
hint_level_resources-themes_header: "테마"
hint_level_rules_body: |-
  검증이 이 레벨에서 찾은 문제입니다: 깨진 참조, 중복 ID, 부모 순환, 너무 깊이 중첩된 프리팹, 겹치는 비트 세그먼트

  일부 문제는 하나씩 또는 <b>모두 수정</b> 버튼으로 수정할 수 있습니다. 수정 내용은 초안에 쌓입니다: <b>저장</b> 버튼은 이를 실행 취소할 수 있는 하나의 작업으로 적용하고, <b>버리기</b> 버튼은 폐기합니다. 그래프 문제(ID, 부모, 프리팹 중첩)에는 수정 방법이 없습니다. 이는 제작자만 내릴 수 있는 콘텐츠 결정입니다

  <color=#5EC8C8><b>팁:</b></color> 자식이 부모의 구간을 벗어나도 문제로 <b>보고되지 않습니다</b>. 수명을 맞추려면 생성기에서 <color=#D4B483>구간 맞춤</color> 모디파이어를 실행합니다

  자세히: <link="https://bullethero.space/ko/docs/editor/workflow/not-losing-work"><color=#59A6FF>작업을 잃지 않기</color></link>
hint_level_rules_header: "규칙"
hint_level_shape-editor_body: |-
  점과 점 사이의 변으로 도형을 만듭니다. <b>삼각형은 자동으로 계산되며 편집하지 않습니다</b>. 그래서 세 삼각형이 공유하는 꼭짓점은 드래그할 점 하나입니다

  <color=#E8B04B><b>경고:</b></color> 형식은 변이 아니라 삼각형을 저장합니다. 닫힌 고리를 이루지 않는 변은 저장할 때 버려지며, 에디터가 이를 알립니다

  자세히: <link="https://bullethero.space/ko/docs/editor/resources/images-and-fonts"><color=#59A6FF>이미지와 폰트</color></link>
hint_level_shape-editor_header: "도형 에디터"
hint_level_theme-editor_body: |-
  테마가 제공하는 슬롯과 각 슬롯을 채우는 색상입니다

  <color=#E86A5A><b>주의:</b></color> 레벨 콘텐츠는 슬롯을 가리키므로 <b>슬롯 번호를 바꾸면 그 슬롯을 참조하는 모든 것의 색이 바뀝니다</b>. 슬롯의 위치가 곧 슬롯의 정체성입니다

  <color=#5EC8C8><b>팁:</b></color> 완성한 테마를 이 기기의 공유 라이브러리에 저장하면 다른 레벨에서도 재사용할 수 있습니다

  자세히: <link="https://bullethero.space/ko/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>색상, 테마, 포스트 프로세싱</color></link>
hint_level_theme-editor_header: "테마 에디터"
hint_menu_level-ai: "제작자가 이 레벨이나 커버, 리소스 중 하나가 AI로 생성되었다고 밝혔습니다. 개발자는 이를 확인하지 않습니다. 레벨에는 제작자가 쓴 내용이 그대로 담깁니다"
hint_menu_level-authors: "이 레벨을 만든 사람들로, 레벨 자체의 메타데이터에 기록된 그대로입니다. 제작자 버튼을 누르면 링크가 포함된 전체 목록이 열립니다"
hint_menu_level-bot_body: |-
  <b>봇이 플레이어와 같은 조작으로 레벨을 대신 플레이합니다.</b> 직접 플레이할 때와 똑같이 걷고, 대시하고, 대미지를 입고, 사망하며 부정행위를 할 수 없습니다: 같은 속도, 같은 대시, 같은 히트박스

  <b>Reflex Bot v1</b>은(는) 1.5초 앞을 내다보고 보이는 것을 피하며, 매 프레임 이를 다시 계산합니다. 준비가 필요 없어서 플레이가 바로 시작됩니다. 이 봇을 무너뜨리는 것은 1초 일찍 진입해야 했던 패턴입니다

  <b>Warm Bot v1</b>은(는) 플레이가 시작되기 전에 레벨 전체의 경로를 계산하고, 대미지 없이 클리어하는 것을 목표로 합니다

  <color=#E8B04B><b>경고:</b></color> 이 경로 계산은 추가 로딩 단계이며 수십 초가 걸릴 수 있습니다. 계산을 취소하고 레벨을 직접 플레이할 수도 있습니다

  <b>레벨 클리어를 보장하지는 않습니다.</b> 봇은 지치지 않지만 그래도 집니다. 또한 매 프레임 성능을 소모하므로, 성능이 낮은 기기에서는 프레임 레이트가 떨어질 수 있습니다

  봇을 이긴 레벨은 제보할 가치가 있습니다: <link="https://github.com/bullet-hero/releases/issues"><color=#59A6FF>bullet-hero/releases</color></link> 저장소에 이슈를 열고, 어떤 봇이 어디서 졌는지 적고, 레벨 폴더를 첨부합니다

  자세히: <link="https://bullethero.space/ko/docs/editor/workflow/bot-playtest"><color=#59A6FF>봇이 레벨을 플레이하는 방식</color></link>
hint_menu_level-bot_header: "봇"
hint_menu_level-checkpoints: "이번 플레이에서 제작자가 배치한 체크포인트를 적용할지 정합니다. 켜면 사망 시 마지막으로 도달한 체크포인트로 레벨이 되감기고 목숨이 회복됩니다. 끄면 처음으로 돌아갑니다. 체크포인트를 쓴 플레이와 쓰지 않은 플레이는 기록이 따로 유지됩니다"
hint_menu_level-identity: "이 레벨이 실제로 어떤 레벨인지 보여 줍니다: 레벨을 찾은 출처, 통계가 기록되는 ID, 그리고 폴더 이름이 ID와 다를 때 레벨이 들어 있는 폴더. 내장 레벨과 그 레벨로 만든 사본은 이 화면의 다른 모든 정보가 같고 이 항목들만 다릅니다"
hint_menu_level-lives: "플레이가 버틸 수 있는 피격 횟수입니다. 젠에서도 피격되고 밀려나지만 플레이가 끝나지 않을 뿐입니다. 커스텀은 슬라이더로 정한 어떤 횟수든 사용합니다. 충돌 없음은 별개입니다: 아무것도 닿지 않으며, 이런 플레이는 기록이 따로 유지됩니다"
hint_menu_level-music: "레벨 자체의 메타데이터에 기록된 음악 작곡자입니다. 레벨에 포함된 다른 모든 리소스는 라이선스 버튼에 있습니다"
hint_menu_level-no-collision: "아바타가 모든 것을 통과하므로 아무것도 아바타에 맞을 수 없습니다. 젠과는 다릅니다: 젠에서는 피격이 그대로 일어나고 플레이가 끝나지 않을 뿐입니다. 충돌 없이 한 플레이는 기록이 따로 유지됩니다"
hint_menu_level-rating: "제작자가 밝힌 연령 등급입니다. 개발자는 이를 확인하지 않습니다. 레벨에는 제작자가 쓴 내용이 그대로 담깁니다"
hint_menu_level-record: "오른쪽에서 현재 선택한 실행 옵션 기준으로 본 이 레벨의 플레이 기록입니다. 목숨, 속도, 체크포인트, 봇, 충돌 없음을 바꾸면 기록도 함께 바뀝니다: 조건이 다른 플레이는 다른 성과이므로 조합마다 최고 기록이 따로 유지됩니다. 시도 횟수와 클리어 횟수는 설정과 관계없이 모든 플레이를 셉니다"
hint_menu_level-seed: "레벨의 모든 무작위 값이 나오는 수입니다. 같은 시드는 어떤 기기에서든 같은 플레이를 재현하며, 0이면 레벨이 매번 새 시드를 정합니다"
hint_menu_level-speed: "레벨과 음악이 재생되는 속도입니다. 커스텀은 세 가지 프리셋뿐 아니라 슬라이더로 정한 어떤 속도든 사용합니다"
hint_mod_content_remover_body: |-
  여기서 선택한 조건에 맞는 레벨 콘텐츠를 삭제합니다

  <color=#E86A5A><b>주의:</b></color> 이 모디파이어는 내용을 추가하지 않고 기존 내용을 고쳐 쓰므로, 실행하기 전에 파라미터를 읽어 보십시오: 실행 취소는 한 단계뿐이지만 되돌릴 방법은 그것뿐입니다

  자세히: <link="https://bullethero.space/ko/docs/editor/workflow/reuse"><color=#59A6FF>재사용: 프리팹, 복사, 생성기</color></link>
hint_mod_content_remover_header: "콘텐츠 제거"
hint_mod_framerate_remap_body: |-
  레벨의 모든 프레임 번호를 다른 프레임 레이트에 맞게 다시 계산하므로, 타이밍은 초 단위로 이전과 같은 위치에 놓입니다

  <color=#E8B04B><b>경고:</b></color> 프레임은 정수이므로 나누어떨어지지 않는 값은 반올림됩니다. 두 번 변환한 레벨이 원래 상태로 돌아간다는 보장은 없습니다

  자세히: <link="https://bullethero.space/ko/docs/editor/basics/frames-and-time"><color=#59A6FF>프레임, 시간, 레벨 길이</color></link>
hint_mod_framerate_remap_header: "프레임 레이트 변환"
hint_mod_prefab_flatten_body: |-
  이 범위의 모든 프리팹 배치를 일반 오브젝트로 바꿉니다. 템플릿과의 연결은 사라지고, 오브젝트는 정확히 원래 자리에 남습니다

  <color=#B48CE0><b>참고:</b></color> 실행 후에도 레벨은 똑같아 보입니다. 아무것도 삭제되거나 이동하지 않으며, 배치별 오버라이드는 이미 오브젝트에 기록되어 있습니다. 제거를 요청하지 않는 한 템플릿은 레벨에 남습니다

  자세히: <link="https://bullethero.space/ko/docs/editor/reference/modifiers"><color=#59A6FF>모디파이어</color></link>
hint_mod_prefab_flatten_header: "프리팹 평탄화"
hint_mod_quantize_keyframes_body: |-
  키프레임을 일정한 단계 간격에 스냅합니다. 손으로 느슨하게 배치한 애니메이션을 비트에 맞추는 방법입니다

  <color=#E8B04B><b>경고:</b></color> 같은 프레임에 놓인 두 키프레임은 하나로 합쳐지므로, 거칠게 양자화하면 디테일이 압축되는 것이 아니라 사라집니다

  자세히: <link="https://bullethero.space/ko/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>리듬과 구조</color></link>
hint_mod_quantize_keyframes_header: "키프레임 양자화"
hint_mod_span_fit_body: |-
  자식을 부모 안으로 줄여 넣거나 부모를 바깥으로 늘려서, 자식의 수명이 부모의 수명 안에 들어가게 합니다

  <color=#B48CE0><b>참고:</b></color> 부모를 벗어난 자식은 잘린 채로 재생되는 정상적인 데이터이므로, 이것은 수정이 아니라 콘텐츠 결정입니다. 그래서 자동으로 실행되지 않습니다. 어느 쪽이든 앵커는 그대로 유지됩니다

  자세히: <link="https://bullethero.space/ko/docs/editor/basics/frames-and-time"><color=#59A6FF>프레임, 시간, 레벨 길이</color></link>
hint_mod_span_fit_header: "구간 맞춤"
hint_mod_span_stagger_body: |-
  선택 항목을 시간 축에서 오프셋하여, 함께 시작하던 오브젝트가 하나씩 차례로 나타나게 합니다

  자세히: <link="https://bullethero.space/ko/docs/editor/workflow/reuse"><color=#59A6FF>재사용: 프리팹, 복사, 생성기</color></link>
hint_mod_span_stagger_header: "구간 엇갈리기"
hint_mod_test_rename_body: "이름 바꾸기 경로를 위한 개발용 생성기입니다. 콘텐츠 제작용이 아닙니다"
hint_mod_test_rename_header: "이름 바꾸기 (테스트)"
hint_sandbox_attacks-auto: "메인 메뉴 배경처럼 무작위 웨이브가 저절로 나옵니다"
hint_sandbox_attacks-fire: "버튼을 누를 때마다 해당 공격의 웨이브가 아바타를 향해 한 번 발사됩니다"
hint_sandbox_attacks-gap: "웨이브가 저절로 나올 때 두 웨이브 사이의 간격(초)입니다"
hint_sandbox_controls-gyro: "모션 센서를 조작 장치로 켭니다"
hint_sandbox_controls-mode: "지금 조작에 쓰고 있는 장치의 모드입니다. 즉시 저장되며 게임 전체에 적용됩니다"
hint_sandbox_game-bot: "메인 메뉴 배경을 플레이하는 봇에게 아바타를 넘깁니다"
hint_sandbox_game-free-camera: "마우스 가운데 버튼이나 두 손가락으로 팬하고, 휠이나 핀치로 줌합니다. 프레임 테두리는 레벨 카메라가 보는 영역을 나타냅니다"
hint_sandbox_game-lives: "사망 전까지 버틸 수 있는 피격 횟수입니다. 사망은 레벨에서처럼 재생되고 아바타를 중앙으로 되돌립니다"
hint_sandbox_game-speed: "공격의 속도만 늦추거나 빠르게 합니다. 아바타는 자기 속도를 유지합니다"
hint_sandbox_tutorial_body: |-
  조작을 익히는 여섯 단계입니다. 각 단계는 실제로 한 행동을 확인합니다. 피격되거나 사망하면 그 일이 일어난 단계만 되돌아가고, 해당 단계를 통과할 때까지 빨간색으로 표시됩니다

  단계를 누르면 플레이할 수 있으며, 통과한 단계도 마찬가지입니다. 모든 단계를 통과해야 튜토리얼이 완료된 것으로 처리됩니다

  <color=#E8B04B><b>경고:</b></color> <b>무적</b> 상태에서는 피격이 집계되지 않으므로 튜토리얼도 이를 감지하지 못합니다

  자세히: <link="https://bullethero.space/ko/docs/game/sandbox"><color=#59A6FF>샌드박스와 튜토리얼</color></link>
hint_sandbox_tutorial_header: "튜토리얼"
hint_settings_audio: "마스터 음량, 게임과 에디터에서 레벨이 재생하는 소리, 그리고 레벨 에디터 밖과 안의 인터페이스 자체 사운드를 설정합니다"
hint_settings_audio-editor-game: "에디터 안에서 레벨이 재생하는 소리의 음량입니다. 같은 레벨이 같은 경로로 재생되지만 한 번이 아니라 몇 시간씩 듣게 되므로, 게임 쪽 음량은 그대로 둡니다"
hint_settings_audio-editor-ui: "레벨 에디터 자체 사운드의 음량입니다. 저장, 거부, 실행 취소, 삭제처럼 편집의 결과만 알리고, 일반적인 버튼 누름에는 소리를 내지 않습니다"
hint_settings_audio-game: "레벨이 재생하는 소리, 즉 음악과 사운드의 음량입니다"
hint_settings_audio-ui: "레벨 에디터 밖 인터페이스의 음량입니다: 메뉴, 브라우저, 설정"
hint_settings_audio-volume: "마스터 음량입니다. 다른 모든 음량이 이 값에 맞춰 조정됩니다"
hint_settings_controls_body: |-
  장치 종류별로 플레이어를 조작하는 방식입니다: 키보드와 마우스, 터치스크린, 게임패드, 기기 자이로

  <color=#B48CE0><b>참고:</b></color> 여러 종류를 동시에 활성화할 수 있습니다. <b>마지막으로</b> 건드린 장치가 조작을 맡으며, 대시와 일시 정지는 어느 장치에서든 작동합니다

  <color=#5EC8C8><b>팁:</b></color> 자이로는 휴대폰을 화면이 위로 향하게 <b>평평하게</b> 놓았을 때가 기준 자세입니다. 평평한 상태에서 기울이면 움직이고, 너무 많이 기울여야 한다면 <b>감도</b>를 높입니다

  자세히: <link="https://bullethero.space/ko/docs/game/controls"><color=#59A6FF>조작</color></link>
hint_settings_controls_header: "조작"
hint_settings_game-editor-autosave: "타이머에 맞춰 레벨의 사본을 기록합니다. 저장한 레벨을 덮어쓰지 않습니다. 사본은 안전망일 뿐 저장이 아닙니다"
hint_settings_game-editor-autosave-rate: "자동 사본을 만드는 간격을 초 단위로 정합니다"
hint_settings_game-editor-camera-invert: "드래그할 때 레벨이 포인터를 따라 움직일지, 반대로 카메라가 움직일지 정합니다. 어느 쪽이든 자연스럽게 느끼는 사람이 있습니다"
hint_settings_game-editor-camera-max-size: "에디터 뷰포트를 얼마나 멀리 축소할 수 있는지 정합니다"
hint_settings_game-editor-camera-min-size: "에디터 뷰포트를 얼마나 가까이 확대할 수 있는지 정합니다"
hint_settings_game-editor-camera-sensitivity-x: "포인터가 한 단위 움직일 때 화면이 가로로 이동하는 거리입니다"
hint_settings_game-editor-camera-sensitivity-y: "포인터가 한 단위 움직일 때 화면이 세로로 이동하는 거리입니다"
hint_settings_game-editor-camera-wheel-multiplier: "휠 한 칸으로 줌하는 정도입니다"
hint_settings_game-editor-camera-zoom-to-mouse: "뷰포트 중앙이 아니라 커서 쪽으로 줌합니다. 끄면 줌하는 동안 중앙이 고정됩니다"
hint_settings_game-editor-create-shape-size-x: "새 도형이 처음 만들어질 때의 너비입니다. 도형 자체의 스케일이 적용되기 전 값입니다"
hint_settings_game-editor-create-shape-size-y: "새 도형이 처음 만들어질 때의 높이입니다. 도형 자체의 스케일이 적용되기 전 값입니다"
hint_settings_game-editor-create-text-size-x: "새 텍스트가 글리프를 배치하는 블록의 너비입니다. 글리프의 크기가 아닙니다"
hint_settings_game-editor-create-text-size-y: "새 텍스트가 글리프를 배치하는 블록의 높이입니다. 대략 한 단위에 한 줄입니다"
hint_settings_game-editor-effects-active-default: "에디터를 열 때 레벨의 포스트 프로세싱 효과를 미리 보기로 표시할지 정합니다. 시작 상태일 뿐이며, 작업 중에 효과를 꺼도 이 값은 바뀌지 않습니다. 포스트 프로세싱은 에디터가 그리는 것 중 가장 비용이 크므로 휴대폰에서는 꺼진 상태로 시작합니다"
hint_settings_game-editor-gizmos-scale: "뷰포트의 드래그 핸들을 얼마나 크게 그릴지 정합니다. 마우스에 맞춘 크기의 핸들은 엄지로 누르기 어렵습니다"
hint_settings_game-editor-grid-active-default: "에디터를 열 때 뷰포트 그리드가 이미 켜져 있을지 정합니다. 시작 상태일 뿐이며, 작업 중에 그리드를 꺼도 이 값은 바뀌지 않습니다"
hint_settings_game-editor-grid-opacity: "그리드가 얼마나 잘 보이는지 정합니다. 알아보기 힘들 만큼 흐린 그리드는 아예 그리지 않습니다"
hint_settings_game-editor-grid-size: "뷰포트 그리드의 간격입니다. 단위는 레벨 단위입니다"
hint_settings_game-editor-history-length: "가장 오래된 브랜치를 버리기 전까지 세션이 보관하는 편집 단계 수입니다. 늘리면 메모리만 더 들고 다른 비용은 없습니다"
hint_settings_game-editor-history-objects: "단계 수 제한과 별도로 기록이 보관하는 오브젝트 수입니다. 한 번의 대량 삭제는 오브젝트 50,000개를 담은 단일 단계이며, 이 제한이 바로 그런 경우를 잡아냅니다. 0이면 제한이 없고, 0보다 작으면 기기가 정합니다"
hint_settings_game-editor-interface-dirty-field-delay: "마지막 키 입력 후 인스펙터 필드가 값을 확정하기까지 기다리는 시간입니다. 0이면 키를 누를 때마다 확정하며, 모든 입력이 각각 실행 취소 단위가 됩니다"
hint_settings_game-editor-interface-levels-layout: "에디터의 레벨 탐색기가 어떤 모습으로 열릴지 정합니다. 설명이 있는 행 목록 또는 커버 그리드입니다. 검색 필드 옆 버튼으로는 에디터를 닫을 때까지 계속 전환할 수 있습니다"
hint_settings_game-editor-interface-log-clamps: "입력한 값이 허용 범위 안으로 되돌려지면 콘솔에 알립니다. 클램프는 어느 경우든 적용됩니다"
hint_settings_game-editor-interface-rotation-unit: "회전 필드를 표시하고 입력하는 단위입니다. 각도는 어느 쪽이든 항상 라디안으로 저장됩니다"
hint_settings_game-editor-level-serialize-mode: "레벨을 기록하는 파일 형식입니다. <b><color=#D4B483>Json</color></b> 형식은 텍스트이므로 읽을 수 있고 손으로 고칠 수 있습니다. <b><color=#D4B483>Blob</color></b> 형식은 바이너리이므로 불러오기가 수십 배 빠르지만, 한번 손상되면 거의 복구할 수 없습니다"
hint_settings_game-editor-max-autosave-files: "보관할 사본 수입니다. 한도에 도달하면 가장 오래된 사본을 버립니다"
hint_settings_game-editor-mcp-enabled: "MCP 지원 AI 어시스턴트가 이 에디터에 연결해 열린 레벨을 편집할 수 있게 합니다. 이 컴퓨터에서만 연결할 수 있으며, AI가 한 배치에서 수행한 모든 작업은 기록에서 하나의 단계가 됩니다"
hint_settings_game-editor-mcp-follow-ai: "AI가 프레임을 확인한 뒤 재생 헤드가 갈 위치를 정합니다. 꺼짐: 원래 두었던 위치로 돌아갑니다. 켜짐: AI가 확인한 프레임에 일시 정지 상태로 머뭅니다. AI가 확인하는 동안 타임라인을 건드리면 재생 헤드는 직접 놓은 위치에 남습니다"
hint_settings_game-editor-mcp-operation-delay: "AI 작업 두 개 사이에 에디터가 기다리는 시간으로, 작업을 눈으로 따라갈 수 있게 합니다. <b><color=#D4B483>0</color></b> 값은 각 작업을 즉시 적용합니다. 재생, 일시 정지, 재생 헤드 이동은 절대 지연되지 않습니다. 최솟값 0, 최댓값 5"
hint_settings_game-editor-mcp-port: "에디터가 수신 대기하는 포트입니다. <b><color=#D4B483>0</color></b> 값은 시작할 때마다 빈 포트를 고릅니다. 그 밖의 값은 <b><color=#D4B483>1024-65535</color></b> 범위입니다"
hint_settings_game-editor-mcp-reveal-edits: "AI가 편집할 때마다 생성하거나 변경한 항목을 선택하고 위치를 표시합니다. 드래그, 입력, 재생 중에는 하지 않습니다"
hint_settings_game-editor-multi-select-requires-hold: "선택 항목에 추가할 때 의도적으로 길게 눌러야 하는지 정합니다. 터치 화면에서는 켜는 편이 안전합니다. 끄면 실수로 한 탭이 선택을 바꿉니다"
hint_settings_game-editor-pick-invisible-aabb: "아무것도 그리지 않는 오브젝트도 클릭으로 선택할 수 있게 합니다. 히트박스만 있고 도형이 없는 투명 벽에 필요합니다"
hint_settings_game-editor-player-active-default: "에디터를 열 때 테스트 플레이어가 이미 배치되어 있을지 정합니다. 터치 환경에서는 플레이어가 뷰포트 조작도 가져가므로 휴대폰에서는 보통 끕니다"
hint_settings_game-editor-player-bot: "미리 보기 플레이어를 직접 조작하는 대신 <color=#D4B483>Reflex Bot v1</color> 봇에게 맡깁니다. 여기서 제공하는 봇은 이것 하나뿐입니다. 미리 준비할 것이 없고, 편집하는 동안에도 역재생을 포함한 어떤 재생 속도에서든 계속 동작하기 때문입니다. 봇도 같은 규칙으로 플레이합니다. 대미지를 입고 궁지에 몰릴 수도 있습니다. 스크럽 직후에는 앞으로 일어날 일에 대한 정보를 다시 구성하는 동안 잠시 실력이 떨어집니다. 봇 선택은 실행 단위의 설정이며, 이 화면의 플레이 탭에서 고릅니다"
hint_settings_game-editor-player-bot-debug: "봇 진단 오버레이 전체를 켜고 끄는 스위치입니다. 기본값은 꺼짐입니다. 그 아래 항목은 모두 켜져 있으므로 이 스위치를 켜면 전체 그림이 한 번에 보입니다"
hint_settings_game-editor-player-bot-debug-grid: "봇이 화면 각 부분에 여유 공간이 얼마나 있다고 판단하는지 그립니다. 앞으로 보이는 모든 것 중 최악의 경우를 기준으로 합니다. 빨간색은 맞을 것으로 예상하는 위치입니다. 안전하다고 판단하는 곳에는 아무것도 그리지 않습니다"
hint_settings_game-editor-player-bot-debug-reach: "봇이 계획 구간이 끝나기 전까지 어디까지 갈 수 있다고 판단하는지 그립니다. 안쪽 고리는 걸어서, 바깥쪽 고리는 대시를 써서 닿는 범위입니다. 그 밖의 목표는 절대 고르지 않습니다"
hint_settings_game-editor-player-bot-debug-target: "봇이 지금 향하고 있는 점을 그립니다. 확실히 더 나은 목표가 나타날 때까지 선택을 유지하므로, 목표가 멈춰 있다면 봇이 갇힌 것이 아니라 만족한 것입니다"
hint_settings_game-editor-player-reset-gizmos: "테스트 플레이어를 켤 때 활성 기즈모 모드를 해제해 드래그 핸들이 손가락 밑에 남지 않게 합니다"
hint_settings_game-editor-preview-collider-on-select: "선택한 오브젝트의 히트박스를 표시합니다. 이 게임에서는 그려지는 모양과 충돌 판정이 별개이므로 둘이 다를 수 있습니다"
hint_settings_game-editor-publish-language: "창작마당 아이템의 제목과 설명을 처음 올릴 때 쓰는 언어입니다. <b><color=#D4B483>영어</color></b> 또는 기기 자체 언어인 <b><color=#D4B483>시스템</color></b> 중에서 고릅니다"
hint_settings_game-editor-resources-serialize-mode: "레벨에 포함된 리소스에 대해 같은 선택을 합니다"
hint_settings_game-editor-selection-collider-opacity: "선택한 오브젝트의 히트박스를 얼마나 불투명하게 그릴지 정합니다"
hint_settings_game-editor-selection-collider-opacity-view: "모든 히트박스를 한 번에 보여 주는 보기에 대한 같은 설정입니다. 그곳에서는 수백 개가 겹치므로 더 흐리게 그립니다"
hint_settings_game-editor-selection-long-press-delay: "다중 선택에 들어가기 위해 행이나 클립을 길게 눌러야 하는 시간입니다. 의도치 않게 선택된다면 값을 높이십시오"
hint_settings_game-editor-selection-long-press-threshold: "길게 누르는 동안 포인터가 얼마나 벗어나도 드래그로 간주하지 않는지 정합니다. 손이 떨린다면 값을 높이십시오"
hint_settings_game-editor-timeline-edge-handle: "클립 크기를 조절하는 가장자리의 너비입니다. 나머지 부분을 잡으면 클립 전체가 이동합니다"
hint_settings_game-editor-timeline-loop-global: "레벨 끝에 도달했을 때 재생 헤드가 멈추지 않고 처음으로 돌아갈지 정합니다"
hint_settings_game-editor-timeline-loop-local: "로컬 타임라인에 대한 같은 설정입니다. 로컬 타임라인은 오브젝트 하나의 수명을 반복합니다"
hint_settings_game-editor-timeline-snap-threshold: "드래그한 가장자리가 후보 프레임에 스냅되려면 얼마나 가까이 놓여야 하는지 정합니다"
hint_settings_game-editor-timeline-time-format: "타임라인 눈금자와 재생 헤드 표시가 무엇을 기준으로 세는지 정합니다. 레벨에는 아무것도 바뀌지 않으며, 어느 쪽이든 같은 프레임을 가리킵니다. 마디와 비트 형식은 레벨 자체의 비트 그리드를 읽고, 그리드에 세그먼트가 없는 곳에서는 타임코드로 대체합니다"
hint_settings_game-editor_body: |-
  <b>자동 저장</b> 기능은 타이머에 맞춰 레벨을 저장하고 매번 백업 사본을 기록합니다. <b>최대 자동 저장 수</b> 설정은 보관할 사본 수의 상한을 정합니다

  <b>카메라 최소 크기</b> 설정과 <b>카메라 최대 크기</b> 설정은 뷰포트 줌 범위를 제한합니다. <b>누를 때만 다중 선택</b> 설정과 <b>AABB 기준 선택</b> 설정은 뷰포트에서 클릭이 뜻하는 바를 바꿉니다

  <b>레벨 저장 형식</b> 필드와 <b>리소스 저장 형식</b> 필드는 디스크에 기록할 때의 기본 형식을 정합니다

  자세히: <link="https://bullethero.space/ko/docs/editor/workflow/speed-and-shortcuts"><color=#59A6FF>속도와 단축키</color></link>
hint_settings_game-editor_header: "에디터"
hint_settings_general: "언어와 게임이 한 번에 불러오는 리소스 수를 정합니다. <b>언어</b> 필드를 비워 두면 기기 언어를 따릅니다"
hint_settings_general-language: "인터페이스 언어입니다. 비워 두면 기기 언어를 따릅니다. 레벨 자체의 텍스트에는 영향을 주지 않습니다. 그 텍스트는 레벨이 직접 가지고 있습니다"
hint_settings_general-resource-parallel-load-count: "레벨 파일을 한 번에 몇 개씩 불러올지 정합니다. 값이 높으면 빠른 디스크에서는 더 일찍 끝나지만, 느린 디스크에서는 끊김이 생길 수 있습니다"
hint_settings_general-resource-web-timeout: "네트워크로 가져오는 파일을 포기하기 전까지 기다리는 시간을 초 단위로 정합니다"
hint_settings_general-show-all-found-content: "소스가 찾았지만 소유를 확인할 수 없는 콘텐츠도 목록에 표시합니다. 구독을 해지한 창작마당 아이템의 파일이나 손으로 복사해 넣은 폴더가 그 예입니다. 이런 레벨은 카드에 표시가 붙습니다. 끄면 소스는 보증할 수 있는 것만 표시합니다"
hint_settings_graphics-antialiasing-hdr: "1보다 큰 색 값입니다. 이 게임에는 필요한 곳이 없고 메모리 대역폭이 두 배로 들기 때문에 꺼진 상태로 출시됩니다"
hint_settings_graphics-antialiasing-msaa: "<color=#D4B483>MSAA</color> 방식이 픽셀당 취하는 샘플 수입니다. 많을수록 부드럽고 비용이 커지며, 비용은 투명 콘텐츠가 겹치는 양에 따라 늘어납니다"
hint_settings_graphics-antialiasing-type: "가장자리를 부드럽게 만드는 방식입니다. <b><color=#D4B483>MSAA</color></b> 방식은 이 게임의 모든 도형이 실제 지오메트리이므로 가장자리를 정확하게 처리합니다. <b><color=#D4B483>FXAA</color></b> 방식은 장면과 관계없이 패스 한 번의 비용만 듭니다. 성능이 낮은 휴대폰이 마주하는 선택지입니다"
hint_settings_graphics-audio-pitch-correction: "시뮬레이션을 따라잡기 위해 오디오 속도를 얼마나 강하게 바꿀지 정합니다. 높을수록 빨리 보정되고 귀에 더 잘 들립니다"
hint_settings_graphics-audio-render: "레벨 오디오를 재생할지 정합니다. 끄면 모든 레벨이 소리 없이 진행되고 아래 오디오 설정은 의미가 없어집니다. 소리 자체도 부담스러운 기기를 위한 설정입니다"
hint_settings_graphics-audio-render-effects: "편집하는 동안 트랙의 오디오 효과를 적용합니다. 끄면 원본 클립이 들립니다"
hint_settings_graphics-audio-resync-jump-time: "오디오와 시뮬레이션이 얼마나 어긋나야 오디오를 조금씩 맞추는 대신 제자리로 건너뛰게 할지 정합니다"
hint_settings_graphics-audio-scrub-time: "재생 헤드를 트랙 위로 드래그할 때 들리는 조각의 길이입니다"
hint_settings_graphics-audio-sync-dead-zone: "이보다 작은 어긋남은 무시합니다. 데드존이 없으면 오디오가 끊임없이 보정되고 그 소리가 귀에 들립니다"
hint_settings_graphics-audio-use-scrub: "재생 헤드를 드래그하는 동안 그 아래의 오디오를 재생해 원하는 순간을 귀로 찾을 수 있게 합니다"
hint_settings_graphics-avatar-render: "아바타의 몸은 사각형 25개로 된 그리드이며, 체력이 줄면 몇 갈래 균열을 따라 가장자리부터 안쪽으로 사각형이 어두워집니다. 그래서 플레이가 잘 풀리지 않는 것을 체력 바가 아니라 플레이어 자체에서 볼 수 있습니다. 잃은 사각형은 흐릿한 잔상으로 남고, 그 아래 히트박스 고리가 비쳐 보입니다. 끄면 그리드가 사각형 하나가 되고 체력에 따라 그 사각형이 흐려집니다. 읽는 방법은 같고, 오브젝트는 25개가 아니라 하나입니다. 사각형들을 그리기 부담스러운 기기를 위한 설정입니다"
hint_settings_graphics-colliders-mode-active: "연습용 모드입니다. 플레이하는 레벨에서 모든 히트박스를 단색 배경 위의 평면 채우기로만 그립니다. 장식, 텍스트, 이펙트, 포스트 프로세싱, 테마 배경은 사라집니다. 플레이 결과를 좌우하는 것은 모두 남습니다. 음악, 충돌, 카메라와 카메라 흔들림, 체크포인트, HUD, 통계가 그렇습니다. 이 모드에서의 플레이도 다른 플레이와 똑같이 기록됩니다. 게임 화면에만 적용되며, 에디터와 샌드박스는 평소대로 그립니다"
hint_settings_graphics-colliders-mode-background: "채우기 뒤에 그려지는 색입니다. 검은색이 아니라 짙은 회색인 것은 의도한 것입니다. 카메라 프레임 주변의 바는 검은색이라서, 배경이 검으면 레벨 프레임이 끝나는 곳이 보이지 않습니다"
hint_settings_graphics-colliders-mode-color: "이 모드가 히트박스를 채우는 색입니다. 에디터의 콜라이더 보기도 같은 색조를 자체 불투명도로 사용하므로 둘은 항상 일치합니다. 그래픽 초기화 버튼은 처음의 빨간색으로 되돌립니다"
hint_settings_graphics-colliders-mode-use-alpha: "켜면 채우기가 색의 알파만큼 비쳐 보여 겹치는 위험 요소 두 개가 더 어두운 부분으로 보입니다. 끄면 모든 채우기가 불투명해집니다. 작은 화면에서 알아보기 쉽지만 겹친 부분이 한 도형으로 합쳐집니다. 게임에서 알파는 0.15 아래로 내려가지 않습니다. 그보다 흐리면 보이지 않기 때문입니다"
hint_settings_graphics-effects-fixed-framerate: "이펙트를 그리는 빈도와 관계없이 이펙트를 시뮬레이션하는 빈도입니다"
hint_settings_graphics-effects-frame-step-budget: "한 프레임이 쓸 수 있는 이펙트 단계 수로, 따라잡는 동안 눈에 띄는 멈춤이 생기지 않게 합니다"
hint_settings_graphics-effects-framerate-target: "이펙트를 그리는 빈도입니다. 파티클은 더 거친 간격으로도 충분히 잘 보이므로 게임 자체 빈도보다 낮추면 적은 비용으로 절약할 수 있습니다"
hint_settings_graphics-effects-max-scrub-time: "재생 헤드를 건너뛸 때 에디터가 다시 재생하는 이펙트 기록의 길이입니다. 길수록 정확하지만 느립니다"
hint_settings_graphics-effects-render: "파티클 이펙트를 그릴지 정합니다. 레벨을 풍성하게 하지만 이펙트에 의존하는 레벨은 없으므로 꺼도 안전합니다"
hint_settings_graphics-effects-replay-step-budget: "한 번의 재생이 쓸 수 있는 시뮬레이션 단계 수입니다. 이 상한 덕분에 밀집 구간으로 건너뛰어도 에디터가 멈추지 않습니다"
hint_settings_graphics-fixed-framerate: "목표 프레임 레이트 값이 고정일 때 게임이 지키는 상한입니다. 화면을 다시 그리는 빈도만 정하며 다른 것은 바꾸지 않습니다. 레벨은 실제 시간을 기준으로 시뮬레이션되므로 같은 플레이는 초당 30프레임이든 144프레임이든 똑같이 진행됩니다. VSync 설정이 켜져 있으면 무시됩니다"
hint_settings_graphics-framerate-target: "게임이 목표로 하는 초당 프레임 수입니다. 수직 동기화를 거치지 않고 직접 적용됩니다"
hint_settings_graphics-postprocessing-render: "아래 모든 카메라 효과의 마스터 스위치입니다. 끄면 스택 전체를 건너뜁니다"
hint_settings_graphics-postprocessing-render-analog-glitch: "아날로그 간섭 효과입니다. 흐르는 띠, 찢어진 주사선, 색 번짐이 나타납니다"
hint_settings_graphics-postprocessing-render-bloom: "밝은 영역의 빛이 주변으로 번집니다"
hint_settings_graphics-postprocessing-render-chroma: "저렴한 렌즈처럼 화면 가장자리로 갈수록 색 채널이 분리됩니다"
hint_settings_graphics-postprocessing-render-color-curves: "채널별 색 커브입니다. 세밀한 색 보정에 씁니다"
hint_settings_graphics-postprocessing-render-digital-glitch: "디지털 손상 효과입니다. 프레임이 망가진 것처럼 블록이 어긋납니다"
hint_settings_graphics-postprocessing-render-grain: "화면 위에 필름 그레인을 입힙니다"
hint_settings_graphics-postprocessing-render-lens: "실제 렌즈처럼 화면을 휘게 만듭니다"
hint_settings_graphics-postprocessing-render-lift-gamma-gain: "색 보정을 섀도, 미드톤, 하이라이트 세 영역으로 나눕니다"
hint_settings_graphics-postprocessing-render-motion-blur: "빠른 움직임이 번져 보입니다. 이 효과 때문에 총알이 잘 안 보인다면 끄는 것이 좋습니다"
hint_settings_graphics-postprocessing-render-shadows-midtones-highlights: "같은 세 영역을 다시 다루지만, 밝기를 올리는 대신 영역마다 따로 색을 입힙니다"
hint_settings_graphics-postprocessing-render-vignette: "화면 가장자리가 어두워져 시선이 가운데로 모입니다"
hint_settings_graphics-postprocessing-render-white-balance: "흰색의 기준을 옮겨 화면 전체를 따뜻하게 또는 차갑게 만듭니다"
hint_settings_graphics-render-scale: |-
  결과를 창 크기에 맞춰 스케일하기 전에 게임 자체가 렌더링하는 픽셀 수입니다

  1보다 낮으면 게임이 더 적은 픽셀을 그린 뒤 늘립니다. 성능이 낮은 기기에서 낮출 수 있는 항목 중 가장 효과가 큽니다. 프래그먼트 비용이 이 값의 <b>제곱</b>에 비례해 줄어들기 때문입니다. 1보다 높으면 더 크게 렌더링한 뒤 결과를 줄이며, 이것이 슈퍼샘플링입니다

  인터페이스는 어느 경우든 별도의 전체 크기 대상에 그려지므로 이 값과 관계없이 텍스트와 버튼은 선명하게 유지됩니다. 이 숫자는 이 기기 등급에 기본으로 적용되는 스케일을 대체하지 않고 거기에 곱해집니다
hint_settings_graphics-resolution: |-
  게임 창의 크기를 픽셀 단위로 정합니다. 이 디스플레이가 실제로 보고하는 모드 중에서 고르므로, 모니터가 표시할 수 없는 모드를 요청할 일은 없습니다

  데스크톱에서 화면 방향을 바꾸는 방법이기도 합니다. 세로가 가로보다 긴 해상도를 고르면 인터페이스가 세워 둔 휴대폰과 같은 세로 레이아웃으로 바뀝니다. 게임 안에서 모니터를 돌릴 수는 없으므로 이 설정과 창 크기가 유일한 수단입니다

  건드리지 않으면 디스플레이 자체 해상도를 씁니다
hint_settings_graphics-textures-compression: "이미지를 불러올 때 <color=#D4B483>압축</color> 형식으로 변환합니다. 메모리를 4-8배 덜 쓰지만, 그레이디언트나 날카로운 가장자리가 4x4 블록과 만나는 곳에 블록 아티팩트가 생깁니다. 이 설정은 레벨을 불러올 때 읽히며, 레벨이 열려 있는 동안에는 반영되지 않습니다"
hint_settings_graphics-textures-compression-quality: "불러오기 시간과 압축 아티팩트 사이의 절충입니다. 어느 쪽이든 이미지 크기는 같으며, 휴대폰은 이 설정을 완전히 무시합니다"
hint_settings_graphics-textures-filtering: "이미지를 그릴 때 샘플링하는 방식만 정합니다. 이미지를 축소하는 방식은 이 설정이 아니라 이미지 제작자가 지정한 내용으로 결정됩니다"
hint_settings_graphics-textures-mipmaps: "각 이미지의 축소 사본입니다. 작게 그려진 이미지가 움직일 때 반짝이지 않게 합니다. 메모리가 3분의 1 더 들며, 그 반짝임을 없애는 유일한 방법입니다"
hint_settings_graphics-textures-size-limit: "이 기기에서 이미지가 메모리에서 차지할 수 있는 크기의 상한입니다. 메모리는 한 변 길이의 제곱에 비례해 줄어들므로 압축보다 더 많이 절약되며, 세 설정 중 레벨이 드는 비용 자체에 상한을 두는 것은 이것뿐입니다"
hint_settings_graphics-vsync: |-
  게임이 프레임을 표시하기 전에 디스플레이 갱신을 기다릴지 정합니다

  <b>꺼짐</b> 상태에서는 각 프레임이 준비되는 즉시 표시됩니다. 기다리는 것이 없으므로 입력이 가장 빨리 화면에 반영됩니다. 다만 갱신 도중에 완성된 프레임은 이전 프레임 위에 절반만 겹쳐 그려지며, 이것이 티어링입니다

  <b>켜짐</b> 상태에서는 갱신마다 한 번씩 표시하므로 티어링이 사라지지만, 프레임마다 최대 갱신 한 번만큼의 지연이 추가됩니다. <b>절반 빈도</b> 상태에서는 갱신 두 번에 한 번씩 표시합니다. 최대 빈도를 유지하지 못하는 기기에서 더 안정적이지만 지연은 두 배입니다

  이 값이 꺼짐이 아니면 Unity 엔진은 위의 프레임 레이트 상한을 완전히 무시하므로 해당 두 행은 회색으로 비활성화됩니다

  휴대폰은 자체 일정에 따라 화면을 표시하므로 이 설정은 아무 효과가 없습니다
hint_settings_graphics-window-mode: |-
  게임 창이 디스플레이를 차지하는 방식입니다

  <b>창 모드</b> 상태에서만 크기를 자유롭게 조절할 수 있고, 크기를 조절하면 게임 화면비가 바뀝니다. 창을 가로보다 세로로 길게 끌면 세워 둔 휴대폰과 똑같이 인터페이스 전체가 세로 레이아웃으로 바뀝니다

  <b>테두리 없는 창</b> 모드가 기본값입니다. 디스플레이를 채우며, 모드 전환이 없고 alt-tab 전환이 즉시 이루어집니다. <b>전용 전체 화면</b> 모드는 디스플레이를 게임에 완전히 넘깁니다. 약간 더 빠르지만 빠져나오는 데 더 오래 걸립니다

  휴대폰에는 창이 하나뿐이고 그것이 곧 화면이므로 이 설정은 아무 효과가 없습니다
hint_settings_graphics_body: |-
  <b>안티앨리어싱.</b> <color=#D4B483>MSAA</color> 방식이 기본값인 이유는 이 게임의 모든 도형이 실제 지오메트리이기 때문입니다. 따라서 계단 현상이 생기는 가장자리는 모두 실제 기하학적 가장자리이며, 이는 멀티샘플링이 모든 플랫폼에서 선명도를 잃지 않고 정확하게 해결하는 바로 그 경우입니다. <b><color=#D4B483>FXAA</color></b> 방식은 성능이 낮은 휴대폰을 위한 대안입니다: 레벨의 오버드로가 얼마나 많든 전체 화면 패스 한 번의 비용만 들지만, <color=#D4B483>MSAA</color> 방식의 비용은 투명 오버드로에 따라 늘어납니다. <b>TAA는 일부러 제공하지 않습니다</b> - 빠른 탄환 뒤에 남는 고스팅은 이 장르에서 가독성 문제이고, TAA의 지터는 글리치 효과와 충돌합니다

  <b>프레임 레이트.</b> 목표값은 수직 동기화를 거치지 않고 직접 적용됩니다. 고정 프레임 레이트는 시뮬레이션을 디스플레이와 분리하며, 이 덕분에 60 Hz 화면과 144 Hz 화면에서 레벨의 타이밍이 똑같이 유지됩니다

  <color=#7FC97F><b>권장:</b></color> 기기가 버거워할 때 가장 부담 없이 포기할 수 있는 것은 1보다 낮은 <b>렌더 스케일</b>입니다: 선명도만 잃고 다른 것은 잃지 않습니다

  자세히: <link="https://bullethero.space/ko/docs/editor/performance/mobile-devices"><color=#59A6FF>모바일 기기</color></link>
hint_settings_graphics_header: "그래픽"
hint_settings_interface: "통계 오버레이와 그 위치입니다. 모든 화면 위에 그려지며, 플레이용이 아니라 성능 진단용입니다"
hint_settings_interface-alert-on-exception: "처리되지 않은 오류가 발생했을 때 보고서 창을 띄울지 정합니다. 보고서는 어느 경우든 생성되고, 로그에 기록되고, 보관됩니다 - 이 설정이 정하는 것은 그 때문에 하던 일이 중단되는지뿐이며, 이는 플레이 도중에 가장 중요합니다. 끄더라도 마지막 보고서는 플레이어 로그에 남아 있고, 보고서 폴더의 <b>보고서 저장</b> 아래에도 있습니다"
hint_settings_interface-hitbox-ring-opacity: "아바타 위의 점 고리는 정확히 충돌 반지름 위에 있으며, 이 반지름은 너비 1로 그려지는 몸에 대해 0.4입니다 - 실루엣은 히트박스가 아니며, 이 고리로 히트박스가 실제로 어디에 있는지 볼 수 있습니다. 같은 고리가 목숨도 셉니다: 켜진 점은 아직 남은 목숨, 흐린 점은 이미 잃은 목숨입니다. 이 슬라이더는 레벨이 그리는 것 위에서 고리가 얼마나 잘 보이는지만 정하며, 0이면 완전히 꺼집니다 - 레벨은 고리를 볼 수 있는 플레이어를 기준으로 균형이 맞춰져 있습니다"
hint_settings_interface-levels-layout: "메뉴의 레벨 탐색기가 어떤 모습으로 열릴지 정합니다: 커버 그리드 또는 설명이 있는 행 목록입니다. 검색 필드 옆 버튼으로는 화면을 떠날 때까지 계속 전환할 수 있습니다"
hint_settings_interface-menu-background: "메뉴가 버튼 뒤에서 재생하는 것입니다. 봇은 실제 아레나입니다 - 플레이를 맡길 수 있는 것과 같은 Reflex Bot v1 봇이 메뉴를 보는 동안 생성되는 위험 요소를 피하며, 맞아도 아무 일도 일어나지 않습니다. 도형은 회전하는 도형이 펼쳐진 예전 배경으로, 셋 중 가장 무겁습니다. 없음은 아무것도 그리지 않습니다"
hint_settings_interface-open-menu-on-lose: "플레이에 실패했을 때의 동작입니다. 끄면 레벨이 이징을 거쳐 서서히 멈추고, 마지막으로 도달한 체크포인트로 되감긴 뒤 다시 이징을 거쳐 속도를 되찾으며, 중간에 창이 뜨지 않습니다. 켜면 재생이 멈추고 결과 창이 열립니다"
hint_settings_interface-screen-orientation: |-
  <b>가로</b>와 <b>세로</b>는 한쪽 방향이 아니라 <b>축</b>을 고정합니다 - 기기를 뒤집으면 화면도 함께 뒤집히므로 어느 쪽을 위로 해도 플레이할 수 있습니다

  <b>자동 회전</b>은 아무것도 고정하지 않습니다: 화면이 기기를 따라갑니다. 자체 방향을 지정하지 않은 레벨에서는 플레이 도중에 휴대폰을 돌려도 인터페이스와 카메라가 모두 따라옵니다

  레벨은 플레이되는 동안 이 설정을 덮어쓸 수 있습니다. 제작자가 특정 모양의 프레임에 맞춰 콘텐츠를 구성했으므로 레벨이 실행되는 동안에는 그 선택이 우선하며, 레벨을 나가면 설정이 원래대로 돌아옵니다

  데스크톱에서는 모니터를 회전시킬 수단이 없으므로 이 항목은 비활성화되며 창의 모양만 보여 줍니다 - 창 크기를 바꾸면 이 값도 따라 바뀝니다
hint_settings_interface-show-game-interface: "위의 두 설정과 화면 터치 조작까지 함께 관리하는 마스터 스위치입니다. 끄면 게임 화면에 아무것도 그려지지 않습니다 - 깨끗한 녹화나 스크린샷에 필요한 상태입니다. 작동을 멈추는 것은 없습니다: 모든 조작 요소는 원래 자리에 그대로 있고 여전히 입력을 받습니다"
hint_settings_interface-show-game-pause: "일시 정지 아이콘을 그릴지 정합니다. 제거되는 것이 아니라 숨겨질 뿐입니다: 같은 모서리는 여전히 입력을 받으며, 이 값과 관계없이 Escape나 게임패드의 Back 버튼으로 일시 정지 창이 열립니다"
hint_settings_interface-show-game-progress: "게임 화면 아래쪽을 따라 플레이 진행 막대를 그릴지 정합니다. 숨겨도 다른 것은 바뀌지 않습니다 - 막대가 표시하는 체크포인트는 계속 동작합니다"
hint_settings_interface-stats-active: "모든 화면 위에 진단 정보를 표시합니다. 플레이용이 아니라 성능 측정용입니다"
hint_settings_interface-stats-alignment-x: "진단 정보가 가로로 놓이는 위치입니다: 0은 왼쪽 가장자리, 1은 오른쪽입니다"
hint_settings_interface-stats-alignment-y: "진단 정보가 세로로 놓이는 위치입니다: 0은 위쪽 가장자리, 1은 아래쪽입니다"
hint_settings_other: "<b>설정 초기화</b>는 모든 탭의 모든 설정을 기본값으로 되돌립니다. 설정에만 영향을 줍니다 - 레벨은 디스크에 있는 파일이므로 영향을 받지 않습니다"
hint_settings_profile: "이 기기가 게임을 어떻게 플레이했고 무엇을 만들었는지 기억하는 모든 것입니다. 로컬 데이터입니다: 여기 있는 것은 어디에도 업로드되지 않으며, 그 바탕이 되는 파일은 열어서 읽을 수 있는 폴더에 레벨과 나란히 있습니다. 시간은 레벨 시간이 아니라 실제 초 단위이므로, 체크포인트로 돌아갈 때의 감속과 재가속, 절반 속도의 플레이는 실제로 걸린 만큼 계산됩니다. 기기 행은 네 가지 조작 장치 중 레벨을 플레이하는 동안 단순히 연결되어 있던 것이 아니라 실제로 주도한 장치를 측정합니다"
hint_settings_profile-transfer_body: |-
  프로필 전체를 zip 파일 하나로 내보내고 다시 가져옵니다: 레벨, 통계, 설정, 컬렉션이 포함된 라이브러리, 그리고 선택하면 에디터 자동 저장과 오류 보고서까지 포함됩니다. 다른 기기로 옮기거나 재설치 전에 사본을 보관할 때 사용하십시오

  <b>교체</b>는 선택한 부분을 비우고 파일의 내용으로 채웁니다. <b>병합</b>은 없는 것을 추가하고, 양쪽에 모두 있는 레벨은 더 새로운 사본을 택하며, 통계는 더 높은 값을 유지합니다

  <color=#E8B04B><b>경고:</b></color> 휴대폰에서는 게임을 삭제하면 프로필 전체가 삭제됩니다. 먼저 내보내십시오

  가져오기 전에 게임은 교체될 내용을 백업 하나에 저장하며, 이 백업은 여기서 복원하거나, 다른 곳에 저장하거나, 삭제할 수 있습니다

  자세히: <link="https://bullethero.space/ko/docs/game/profile-transfer"><u>프로필 이전</u></link>
hint_settings_profile-transfer_header: "프로필 이전"
hint_settings_suppress-game-saves_body: |-
  이 모드가 켜져 있는 동안 게임은 자체 데이터를 하나도 저장하지 않습니다: <color=#D4B483>settings.json</color>, 전체 통계, 각 레벨의 통계가 디스크에 있는 그대로 유지됩니다. 바꾼 설정은 게임을 닫을 때까지는 그대로 적용됩니다

  레벨 작업은 평소처럼 저장됩니다 - 레벨 저장, 내보내기, 가져오기, 복사, 삭제, 그리고 별도 스위치가 있는 에디터의 자동 저장과 백업도 마찬가지입니다

  이 모드는 게임을 닫을 때까지 유지되며 기억되지 않습니다. 끄면 현재 설정이 저장되고, 켜져 있던 동안 플레이한 모든 기록은 버려집니다

  <color=#B48CE0><b>참고:</b></color> 이 모드는 저절로 켜지기도 합니다. 실행 인자 <color=#D4B483>--suppress-game-saves</color>는 해당 실행 전체 동안 이 모드를 켜며, 게임 안에서는 끌 수 없습니다. 더 새로운 버전의 게임이 저장한 설정이나 통계도 이 모드를 켜며, 그러면 게임은 실행할 때마다 그 데이터를 유지할지 기본값으로 덮어쓸지 묻습니다
