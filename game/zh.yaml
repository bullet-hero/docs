settings_graphics-vsync_tooltip: "等待显示器刷新后再显示一帧，可消除画面撕裂，但会增加一帧延迟。开启时，上方的帧率上限不起作用。仅限桌面端"
settings_graphics-window-mode_tooltip: "窗口如何占据显示器。“窗口化”允许自由调整大小，同时也会改变界面适配的形状。仅限桌面端"
