settings_graphics-colliders-mode-active_tooltip: "用於練習的模式：遊玩的關卡只繪製可能擊中你的東西，以單色平面填充顯示"
settings_graphics-colliders-mode-background_tooltip: "模式開啟時鏡頭用來填充背景的顏色，代替關卡的主題背景"
settings_graphics-colliders-mode-color_tooltip: "該模式的填充顏色。編輯器的碰撞體檢視使用相同的色相"
settings_graphics-colliders-mode-use-alpha_tooltip: "關閉時每個填充都是實心的，顏色的不透明度鎖定為最大"
settings_graphics-colliders-mode_active: "啟用模式"
settings_graphics-colliders-mode_background: "背景顏色"
settings_graphics-colliders-mode_color: "填充顏色"
settings_graphics-colliders-mode_title: "“僅碰撞體”模式"
settings_graphics-colliders-mode_use-alpha: "使用透明度"
settings_graphics-effects-frame-step_budget: "每幀步進預算"
settings_graphics-effects-replay-step_budget: "回放步進預算"
settings_graphics-render-scale_tooltip: "遊戲在縮放到視窗之前渲染的畫素數量。介面無論如何都以完整尺寸繪製。會與此類裝置自帶的縮放倍數相乘。僅限桌面端"
settings_graphics-resolution_tooltip: "遊戲視窗的畫素尺寸，可選值來自此顯示器報告的模式。高度大於寬度的解析度會讓整個介面切換到豎屏佈局。僅限桌面端"
settings_graphics-textures-compression-quality_tooltip: "此裝置壓縮一張影像所花的時間。無論如何，結果的大小和格式都相同，取捨的只是載入時間與漸變和硬邊緣上的塊狀瑕疵。“自動”會對除照片以外的所有影像使用精細編碼器。在手機上無效，手機的編碼器不支援此設定"
settings_graphics-textures-compression_tooltip: "載入時把關卡的影像打包為壓縮格式。每張影像佔用的記憶體減少到四分之一至八分之一，代價是漸變和硬邊緣上會出現塊狀瑕疵。“自動”在記憶體緊張的手機上壓縮，在桌面端保留完整影像。在關卡載入時讀取，因此從你開啟的下一個關卡開始生效"
settings_graphics-textures-filtering_tooltip: "繪製關卡影像時如何取樣。開啟Mip貼圖時，“自動”會在Mip層級之間混合，消除層級交替處的接縫。“點”讓所有內容都呈現硬邊紋素，它不改變影像縮小的方式，只改變繪製方式。作者標記為畫素畫的影像始終使用點取樣"
settings_graphics-textures-mipmaps_tooltip: "為每張影像生成縮小的副本，使縮小繪製的影像在移動時不閃爍。多佔用三分之一的記憶體。作者標記為畫素畫的影像不會生成這些副本"
settings_graphics-textures-size-limit_tooltip: "影像在此裝置記憶體中允許的最大邊長。更大的影像會在載入時縮小，磁碟上的檔案不會被改動。記憶體隨邊長的平方下降，所以降低一檔比壓縮更省記憶體。“自動”在手機上為2048，在桌面端為4096"
settings_graphics-textures_compression: "壓縮"
settings_graphics-textures_compression-quality: "壓縮質量"
settings_graphics-textures_filtering: "過濾"
settings_graphics-textures_mipmaps: "Mip貼圖"
settings_graphics-textures_size-limit: "尺寸上限"
