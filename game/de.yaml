settings_graphics-antialiasing-hdr_tooltip: "In ein HDR-Ziel rendern. Standardmäßig überall aus: nichts, was dieses Spiel zeichnet, braucht Werte über 1, und HDR verdoppelt die Bandbreite, die die Kantenglättung ohnehin vervielfacht"
settings_graphics-antialiasing-msaa_tooltip: "Samples pro Pixel, die MSAA nimmt. Wird nur gelesen, solange Typ MSAA ist. Mehr ist sauberer und kostet umso mehr, je mehr transparente Formen sich überlagern, da das Mischen pro Sample aufgelöst wird - x2 ist die Grenze für ein Smartphone, x4 kann sich ein Desktop leisten"
settings_graphics-antialiasing-type_tooltip: "Wie Kanten geglättet werden. MSAA ist der Standard und passt zum Inhalt dieses Spiels - jede Form ist echte Geometrie, also glättet es genau das, was Treppenstufen bildet, ohne etwas anderes weichzuzeichnen. FXAA kostet einen Vollbilddurchlauf, egal wie viel das Level überzeichnet, und das ist der einzige Grund, es auf einem schwachen Gerät vorzuziehen. Es verwischt dünne Umrisse"
settings_graphics-antialiasing_hdr: "HDR"
settings_graphics-antialiasing_msaa: "MSAA-Samples"
settings_graphics-antialiasing_type: "Typ"
settings_graphics-audio-pitch_correction: "Tonhöhenkorrektur"
settings_graphics-audio-resync-jump_time: "Resync-Sprungzeit"
settings_graphics-audio-sync-dead_zone: "Sync-Totzone"
settings_graphics-colliders-mode-active_tooltip: "Ein Übungsmodus: ein Level, das du spielst, zeichnet nur, was dich treffen kann, als flache Füllungen in einer Farbe"
settings_graphics-colliders-mode-background_tooltip: "Womit die Kamera den Hintergrund füllt, solange der Modus an ist, statt des Theme-Hintergrunds des Levels"
settings_graphics-colliders-mode-color_tooltip: "Die Füllfarbe des Modus. Die Collider-Ansicht des Editors übernimmt denselben Farbton"
settings_graphics-colliders-mode-use-alpha_tooltip: "Aus: jede Füllung ist deckend und das Alpha der Farbe ist auf voll fixiert"
settings_graphics-colliders-mode_active: "Modus aktivieren"
settings_graphics-colliders-mode_background: "Hintergrundfarbe"
settings_graphics-colliders-mode_color: "Füllfarbe"
settings_graphics-colliders-mode_title: "Nur-Collider-Modus"
settings_graphics-colliders-mode_use-alpha: "Transparenz nutzen"
settings_graphics-effects-frame-step_budget: "Frame-Schrittbudget"
settings_graphics-effects-replay-step_budget: "Replay-Schrittbudget"
settings_graphics-render-scale_tooltip: "Wie viele Pixel das Spiel rendert, bevor es auf das Fenster skaliert. Die Oberfläche wird in jedem Fall in voller Größe gezeichnet. Multipliziert die Skalierung, mit der diese Geräteklasse ohnehin ausgeliefert wird. Nur Desktop"
settings_graphics-resolution_tooltip: "Größe des Spielfensters in Pixeln, aus den Modi, die dieser Bildschirm meldet. Eine Auflösung, die höher als breit ist, schaltet die ganze Oberfläche in ihr Hochformat-Layout. Nur Desktop"
settings_graphics-textures-compression-quality_tooltip: "Wie lange dieses Gerät mit dem Komprimieren eines Bilds verbringt. Das Ergebnis ist in jedem Fall gleich groß und im selben Format - abgewogen wird nur Ladezeit gegen Blockartefakte auf Verläufen und harten Kanten. Automatisch nimmt den sorgfältigen Encoder für alles außer Fotos. Auf Smartphones ignoriert, deren Encoder keine solche Einstellung kennen"
settings_graphics-textures-compression_tooltip: "Die Bilder eines Levels beim Laden in ein komprimiertes Format packen. Vier- bis achtmal weniger Speicher pro Bild, auf Kosten von Blockartefakten auf Verläufen und harten Kanten. Automatisch komprimiert auf Smartphones, wo Speicher knapp ist, und behält auf Desktops das volle Bild. Wird beim Laden eines Levels gelesen, gilt also ab dem nächsten, das du öffnest"
settings_graphics-textures-filtering_tooltip: "Wie die Bilder eines Levels beim Zeichnen abgetastet werden. Automatisch mischt zwischen Mip-Stufen, wenn Mipmaps an sind, was die Naht entfernt, wo eine die nächste ablöst. Punkt liefert hartkantige Texel bei allem - es ändert nicht, wie ein Bild verkleinert wird, nur wie es gezeichnet wird. Bilder, die ihr Autor als Pixel-Art markiert hat, werden immer punktweise abgetastet"
settings_graphics-textures-mipmaps_tooltip: "Verkleinerte Kopien jedes Bilds erzeugen, damit ein klein gezeichnetes beim Bewegen nicht flimmert. Kostet ein Drittel mehr Speicher. Bilder, die ihr Autor als Pixel-Art markiert hat, bekommen nie welche"
settings_graphics-textures-size-limit_tooltip: "Die größte Seitenlänge, die ein Bild auf diesem Gerät im Speicher belegen darf. Alles Größere wird beim Laden verkleinert, die Datei auf der Festplatte bleibt unberührt. Der Speicher sinkt mit dem Quadrat der Seitenlänge, also spart eine Stufe tiefer mehr als Kompression. Automatisch ist 2048 auf Smartphones und 4096 auf Desktops"
