settings_graphics-antialiasing-hdr_tooltip: "Rendre dans une cible HDR. Désactivé partout par défaut : rien de ce que dessine ce jeu n'a besoin de valeurs au-dessus de 1, et le HDR double la bande passante que l'antialiasing multiplie déjà"
settings_graphics-antialiasing-msaa_tooltip: "Le nombre d'échantillons par pixel que prend le MSAA. Lu seulement quand Type vaut MSAA. Plus c'est haut, plus c'est net, et plus ça coûte à mesure que les formes transparentes se superposent, car le mélange se résout par échantillon - x2 est la limite d'un téléphone, x4 ce qu'un ordinateur peut se permettre"
settings_graphics-antialiasing-type_tooltip: "Comment les bords sont adoucis. MSAA est la valeur par défaut et celle qui convient au contenu de ce jeu - chaque forme est une vraie géométrie, donc il corrige exactement ce qui crénelle sans rien adoucir d'autre. FXAA coûte une passe plein écran quelle que soit la surcharge de dessin du niveau, c'est la seule raison de le préférer sur un appareil faible. Il floute les contours fins"
