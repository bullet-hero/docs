level_resources_texture-alpha: "Альфа"
level_resources_texture-alpha_tooltip: "Что вы утверждаете о прозрачности этой картинки. Непрозрачная значит, что альфа-канал не используется, и картинка перепаковывается без него - те же пиксели, быстрее и по непрозрачному пути рендера. Утверждение никто не проверяет: на картинке, которая действительно затухает, оно сплющит затухание, и видно это будет в строке отчёта ниже"
level_resources_texture-compression: "Сжатие"
level_resources_texture-compression_tooltip: "Может ли устройство упаковать эту картинку в формат с потерями. Запретить сохраняет каждый пиксель и стоит до четырёх раз больше памяти, Разрешить даёт сжать её даже там, где вид бы отказался. Авто следует виду: пиксель-арт и градиенты отказываются. Ни одно значение не заставит устройство сжимать против его настроек и не отменяет предел размера"
level_resources_texture-details: "Импорт"
level_resources_texture-kind: "Что это за картинка - фотография, рисунок, пиксель-арт, градиент. Чисто художественный выбор: он говорит, ЧТО изображено. Ещё он задаёт исходные значения полей Сглаживание и Сжатие ниже - пиксель-арт начинает чётким и без сжатия, градиент без сжатия - и оба поля можно поменять там. Мип-карты - единственное, что вид решает сам: пиксель-арт их не получает никогда"
level_resources_texture-report-alpha-dropped: "альфа снята"
level_resources_texture-report-mips: "мип-уровней"
level_resources_texture-report-not-loaded: "не загружена"
level_resources_texture-report-source-unknown: "источник неизвестен"
level_resources_texture-sampling: "Сглаживание"
level_resources_texture-sampling_tooltip: "Как эта картинка рисуется - Сглаженная смешивает соседние пиксели, Чёткая рисует каждый жёстким квадратом. Авто следует виду: пиксель-арт чёткий, остальное сглажено. Чётко и мягко стоят устройству одинаково, так что это вид, а не бюджет, и он перебивает фильтрацию игрока"
level_resources_texture-uv-offset-x: "Смещение X"
level_resources_texture-uv-offset-y: "Смещение Y"
level_resources_texture-uv-tiling-x: "Тайлинг X"
level_resources_texture-uv-tiling-y: "Тайлинг Y"
level_resources_texture-uv_tooltip: "Как эта картинка ложится на то, что её рисует - сказано один раз для ресурса, а не на каждом объекте. Тайлинг - сколько раз она повторяется поперёк фигуры, Смещение - где начинается её первая копия. Объект без собственных ключей UV сэмплит именно это, а любой ключ UV на объекте заменяет это целиком"
