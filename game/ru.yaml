hint_editor-settings_artist-permission_body: |-
  Каждый внешний ресурс в уровне - музыка, изображения, шрифты, тексты - должен быть под лицензией не менее свободной, чем <color=#D4B483>CC BY-NC</color>, или с разрешением правообладателя на публичное некоммерческое распространение

  <color=#E86A5A><b>Внимание:</b></color> личного "да, без проблем" недостаточно. Разрешение должно покрывать публичное распространение, а не только ваше личное использование

  Пока уровень остаётся на вашем устройстве, ничего не проверяется - только когда его отдают сервису

  Подробнее: <link="https://bullethero.space/ru/docs/editor/rights/legal-resource-paths"><color=#59A6FF>Два способа легального ресурса</color></link>, <link="https://bullethero.space/ru/docs/editor/rights/asking-permission"><color=#59A6FF>Как просить разрешение у автора</color></link>
hint_editor-settings_artist-permission_header: "Использование чужой работы"
hint_editor-settings_community: "Ссылки проекта - открываются в браузере. Набор зависит от того, откуда взята сборка: в магазинной версии часть ссылок может отсутствовать"
hint_editor-settings_create-level_body: |-
  <b>Заготовка</b> определяет, с чего начинается новый уровень: пустой, либо с небольшим каркасом, который иначе пришлось бы собирать руками каждый раз

  <color=#E86A5A><b>Внимание:</b></color> <b>Параметры</b> задают то, что неудобно менять потом: длину в кадрах и частоту кадров

  <color=#5EC8C8><b>Подсказка:</b></color> два списка формата файлов выбирают, как уровень и его метаданные пишутся на диск. Оба потом меняются из "Опасной зоны" уровня

  Подробнее: <link="https://bullethero.space/ru/docs/editor/basics/first-level"><color=#59A6FF>Первый уровень: маршрут</color></link>
hint_editor-settings_create-level_header: "Создание уровня"
hint_editor-settings_open-level: "Уровни, найденные на этом устройстве. Уровень - это папка: положите её рядом с остальными, и она появится здесь"
hint_editor_beat-segment_body: |-
  Один участок постоянного темпа: УВМ, смещение фазы в дробных кадрах, долей в такте, имя и цвет. Показывается только один сегмент, даже если выделено несколько

  <color=#E86A5A><b>Внимание:</b></color> сегмент определяется своим начальным кадром, поэтому <b>сдвиг меняет его идентичность</b>. После сдвига выделите его заново на новом начале

  <color=#5EC8C8><b>Подсказка:</b></color> удары здесь перефазируют выделенный сегмент, а не создают новый

  Подробнее: <link="https://bullethero.space/ru/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>Ритм и структура</color></link>
hint_editor_beat-segment_header: "Сегмент долей"
hint_editor_beat-window_body: |-
  Метаданные для авторинга - <b>воспроизведение их не читает</b>. Сетка помогает класть контент на музыку, а генераторы работают по тем же долям, что видите вы

  Сетка - список <b>сегментов ритма</b>, у каждого постоянный темп. Дыры между ними допустимы: вступление без ударных, брейк, хвост после трека

  <color=#5EC8C8><b>Подсказка:</b></color> жмите <b>СДЕЛАТЬ РИТМ</b> вместе с треком, а потом <b>Создать из ударов</b> превратит удары в один сегмент от первого до последнего

  Подробнее: <link="https://bullethero.space/ru/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>Ритм и структура</color></link>
hint_editor_beat-window_header: "Сетка долей"
hint_editor_clipboard_body: |-
  По буферу на каждый таймлайн, у каждого своя строка состояния

  <b>Копировать текстом</b> пишет все буферы в системный буфер обмена, чтобы выделение можно было перенести в другой уровень или на другую машину. <b>Вставить из текста</b> читает его обратно в буферы - и <b>на этом останавливается</b>

  <color=#B48CE0><b>Интересно:</b></color> в уровень ничего не попадает, пока вы сами не вставите содержимое в нужный таймлайн. Куда оно ляжет, зависит от плейхеда и активной области

  Подробнее: <link="https://bullethero.space/ru/docs/editor/workflow/reuse"><color=#59A6FF>Переиспользование: префабы, копирование, генераторы</color></link>
hint_editor_clipboard_header: "Буфер обмена"
hint_editor_console: "Всё, что редактор записал за сессию: отчёты загрузки уровня, результаты генераторов, предупреждения импорта. <b>Clear</b> очищает список, шестерёнка фильтрует по важности"
hint_editor_curve-editor: "Правит кривую перетаскиванием точек. Изменения применяются <b>сразу</b> во время перетаскивания, поэтому увиденное уже записано в уровень: закрытие окна их сохраняет"
hint_editor_generators_body: |-
  Процедурный контент, применяемый к уровню одной отменяемой операцией

  <color=#B48CE0><b>Интересно:</b></color> семейства два. <b>Генераторы</b> (<i>gen_</i>) создают контент: волны пуль, радиальные паттерны, кэш шрифтов, импорт уровня Afterbeat. <b>Модификаторы</b> (<i>mod_</i>) переписывают то, что уже есть: подгонку промежутков, квантование ключей

  <color=#E86A5A><b>Внимание:</b></color> всё, что переписывает или удаляет существующий контент, сначала спрашивает подтверждение

  Подробнее: <link="https://bullethero.space/ru/docs/editor/workflow/reuse"><color=#59A6FF>Переиспользование: префабы, копирование, генераторы</color></link>
hint_editor_generators_header: "Генераторы"
hint_editor_gradient-editor: "Правит градиент перетаскиванием опорных точек. Как и в редакторе кривой, изменения применяются <b>сразу</b>, а не по кнопке подтверждения"
hint_editor_hierarchy_body: |-
  Все объекты, живые на <b>текущем кадре</b>, вложенные по родителю. Список меняется при перемотке - пустая иерархия обычно значит, что плейхед за концом контента

  Перетащите строку на другую, чтобы сделать объект её потомком. Слои складываются по цепочке, поэтому смена родителя двигает объект в порядке отрисовки и перебрасывает его случайные значения

  <color=#5EC8C8><b>Подсказка:</b></color> правый клик по строке открывает её действия. На тач-экране - удержание строки

  Подробнее: <link="https://bullethero.space/ru/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Как устроен редактор</color></link>
hint_editor_hierarchy_header: "Иерархия"
hint_editor_inspector-audio_body: |-
  Клип выделенной аудио-дорожки, скорость, громкость фейдера и цепочка эффектов: lowpass, highpass, echo, reverb, chorus, pitch shifter, distortion, flange, compressor, normalize и параметрический эквалайзер

  Скорость и громкость сделаны ползунками, а не полями ввода, чтобы допустимый диапазон был виден

  <color=#E86A5A><b>Внимание:</b></color> <b>Громкость здесь - это фейдер.</b> Ключевая громкость живёт отдельной дорожкой на локальном таймлайне, и при воспроизведении они перемножаются

  Подробнее: <link="https://bullethero.space/ru/docs/editor/resources/preparing-the-track"><color=#59A6FF>Подготовка трека</color></link>
hint_editor_inspector-audio_chorus-delay: "Базовая задержка копий в мс - достаточно короткая, чтобы слышаться плотностью, а не эхом"
hint_editor_inspector-audio_chorus-depth: "Насколько широко ходит задержка - Rate задаёт скорость колебания, это его размах"
hint_editor_inspector-audio_chorus-dry-mix: "Уровень необработанного сигнала"
hint_editor_inspector-audio_chorus-feedback: "Сколько выхода возвращается на вход, уводя звук в сторону флэнжера"
hint_editor_inspector-audio_chorus-rate: "Как быстро модулируется задержка, в Гц"
hint_editor_inspector-audio_chorus-wet-mix-tap-1: "Уровень первой задержанной копии"
hint_editor_inspector-audio_chorus-wet-mix-tap-2: "Уровень второй копии - копии разнесены по времени, поэтому их баланс задаёт ширину хоруса"
hint_editor_inspector-audio_chorus-wet-mix-tap-3: "Уровень третьей копии"
hint_editor_inspector-audio_chorus_body: |-
  Накладывает на сигнал три слегка задержанные копии с плавающей высотой тона, и один источник звучит как несколько. <color=#D4B483>Rate</color> - скорость колебания, <color=#D4B483>Depth</color> - его размах. Поднимите <color=#D4B483>Feedback</color>, и он уйдёт в сторону <link="hint_editor_inspector-audio_flange"><color=#59A6FF>Flange</color></link>

  <color=#B48CE0><b>Интересно:</b></color> <b>сброс</b> возвращает и <b>Mix Level</b> к значению по умолчанию -80 dB, поэтому заодно выключает эффект

  Подробнее: <link="https://bullethero.space/ru/docs/editor/resources/preparing-the-track"><color=#59A6FF>Подготовка трека</color></link>
hint_editor_inspector-audio_chorus_header: "Chorus - хорус"
hint_editor_inspector-audio_compressor-attack: "Как быстро он зажимает после пика, в мс - слишком быстро съедает атаки"
hint_editor_inspector-audio_compressor-make-up-gain: "Усиление в dB после компрессии, чтобы вернуть снятую громкость"
hint_editor_inspector-audio_compressor-release: "Как быстро он отпускает потом, в мс - слишком быстро даёт слышимое качание"
hint_editor_inspector-audio_compressor-threshold: "Уровень в dB, выше которого компрессор начинает работать"
hint_editor_inspector-audio_compressor_body: |-
  Прижимает громкие места, чтобы тихие встали выше - обычное лекарство для песни, которая пропадает за собственными эффектами. <color=#D4B483>Threshold</color> - где он начинает работать, <color=#D4B483>Attack</color> и <color=#D4B483>Release</color> - как быстро зажимает и отпускает, <color=#D4B483>Make Up Gain</color> возвращает громкость

  <color=#B48CE0><b>Интересно:</b></color> <b>сброс</b> возвращает и <b>Mix Level</b> к значению по умолчанию -80 dB, поэтому заодно выключает эффект

  Подробнее: <link="https://bullethero.space/ru/docs/editor/resources/preparing-the-track"><color=#59A6FF>Подготовка трека</color></link>
hint_editor_inspector-audio_compressor_header: "Compressor - компрессор"
hint_editor_inspector-audio_distortion-level: "Насколько сильно ограничивается сигнал"
hint_editor_inspector-audio_distortion_body: |-
  Ограничивает форму волны и наполняет звук гармониками - грязно и перегружено. Одна ручка <color=#D4B483>Level</color> - насколько сильно он кусает. Заодно сглаживает динамику, и у трека пропадают тихие места

  <color=#B48CE0><b>Интересно:</b></color> <b>сброс</b> возвращает и <b>Mix Level</b> к значению по умолчанию -80 dB, поэтому заодно выключает эффект

  Подробнее: <link="https://bullethero.space/ru/docs/editor/resources/preparing-the-track"><color=#59A6FF>Подготовка трека</color></link>
hint_editor_inspector-audio_distortion_header: "Distortion - перегруз"
hint_editor_inspector-audio_echo-decay: "Какая доля каждого повтора уходит в следующий - чем выше, тем дольше тянется"
hint_editor_inspector-audio_echo-delay: "Миллисекунды между повторами - привяжите их к темпу песни, чтобы эхо попадало в долю"
hint_editor_inspector-audio_echo-dry-mix: "Уровень необработанного сигнала на выходе"
hint_editor_inspector-audio_echo-max-channels: "Ограничение числа каналов для буфера эха"
hint_editor_inspector-audio_echo-wet-mix: "Уровень эхо-сигнала - балансируется с Dry Mix отдельно от Mix Level"
hint_editor_inspector-audio_echo_body: |-
  Повторяет сигнал через равные промежутки, каждый повтор тише предыдущего - отдельные копии, а не помещение, как у <link="hint_editor_inspector-audio_reverb"><color=#59A6FF>Reverb</color></link>. <color=#D4B483>Delay</color> - промежуток в миллисекундах, <color=#D4B483>Decay</color> - какая доля каждой копии уходит в следующую

  <color=#B48CE0><b>Интересно:</b></color> <b>сброс</b> возвращает и <b>Mix Level</b> к значению по умолчанию -80 dB, поэтому заодно выключает эффект

  Подробнее: <link="https://bullethero.space/ru/docs/editor/resources/preparing-the-track"><color=#59A6FF>Подготовка трека</color></link>
hint_editor_inspector-audio_echo_header: "Echo - эхо"
hint_editor_inspector-audio_enabled: "Стоит ли этот эффект в цепочке. Отдельного флага нет - галочка поднимает Mix Level с пола в -80 dB, а снятие возвращает его туда, сохраняя выставленный уровень"
hint_editor_inspector-audio_flange-depth: "Насколько широко ходит задержка"
hint_editor_inspector-audio_flange-dry-mix: "Уровень необработанного сигнала"
hint_editor_inspector-audio_flange-rate: "Как часто повторяется проход, в Гц"
hint_editor_inspector-audio_flange-wet-mix: "Уровень плавающей копии - сам эффект рождается из взаимного гашения двух сигналов"
hint_editor_inspector-audio_flange_body: |-
  Подмешивает к сигналу его же очень короткую плавающую задержку - свист реактивного двигателя. Как <link="hint_editor_inspector-audio_chorus"><color=#59A6FF>Chorus</color></link>, но копия одна, поэтому слышен проезд, а не ширина. Свист глубже всего, когда <color=#D4B483>Dry Mix</color> и <color=#D4B483>Wet Mix</color> стоят близко

  <color=#B48CE0><b>Интересно:</b></color> <b>сброс</b> возвращает и <b>Mix Level</b> к значению по умолчанию -80 dB, поэтому заодно выключает эффект

  Подробнее: <link="https://bullethero.space/ru/docs/editor/resources/preparing-the-track"><color=#59A6FF>Подготовка трека</color></link>
hint_editor_inspector-audio_flange_header: "Flange - флэнжер"
hint_editor_inspector-audio_header: "Инспектор аудио-дорожки"
hint_editor_inspector-audio_highpass-cutoff-freq: "Частота в Гц, ниже которой трек заглушается - на минимуме фильтр практически прозрачен"
hint_editor_inspector-audio_highpass_body: |-
  Зеркало <link="hint_editor_inspector-audio_lowpass"><color=#59A6FF>Lowpass</color></link>: пропускает верх и срезает всё ниже <color=#D4B483>Cutoff Freq</color>. Поднимайте частоту среза, и трек истончается до крошечного динамика

  <color=#5EC8C8><b>Подсказка:</b></color> цепочка принадлежит <b>треку</b> и не анимируется ключами. Для смены посреди песни разрежьте трек и настройте половины по-разному

  <color=#B48CE0><b>Интересно:</b></color> <b>сброс</b> возвращает и <b>Mix Level</b> к значению по умолчанию -80 dB, поэтому заодно выключает эффект

  Подробнее: <link="https://bullethero.space/ru/docs/editor/resources/preparing-the-track"><color=#59A6FF>Подготовка трека</color></link>
hint_editor_inspector-audio_highpass_header: "Highpass - фильтр высоких частот"
hint_editor_inspector-audio_lowpass-cutoff-freq: "Частота в Гц, выше которой трек заглушается - на максимуме фильтр практически прозрачен"
hint_editor_inspector-audio_lowpass_body: |-
  Пропускает низ и срезает всё выше <color=#D4B483>Cutoff Freq</color> - звук из-под воды или из-за стены. На верхнем краю диапазона фильтр практически прозрачен

  <color=#5EC8C8><b>Подсказка:</b></color> цепочка принадлежит <b>треку</b> и не анимируется ключами. Для смены посреди песни разрежьте трек и настройте половины по-разному

  <color=#B48CE0><b>Интересно:</b></color> <b>сброс</b> возвращает и <b>Mix Level</b> к значению по умолчанию -80 dB, поэтому заодно выключает эффект

  Подробнее: <link="https://bullethero.space/ru/docs/editor/resources/preparing-the-track"><color=#59A6FF>Подготовка трека</color></link>
hint_editor_inspector-audio_lowpass_header: "Lowpass - фильтр низких частот"
hint_editor_inspector-audio_mix-level: "Уровень в dB, с которым обработанный сигнал подмешивается обратно. На -80 эффект молчит - именно так в файле хранится состояние \"выключен\", отдельного переключателя нет"
hint_editor_inspector-audio_normalize-fade-in-time: "За сколько миллисекунд усиление выходит на режим, чтобы коррекция не слышалась скачком"
hint_editor_inspector-audio_normalize-lowest-volume: "Сигналы тише этого порога не трогаются - иначе тишина и шумовая полка вылезут шипением"
hint_editor_inspector-audio_normalize-maximum-amp: "Потолок усиления, которое разрешено применить"
hint_editor_inspector-audio_normalize_body: |-
  Подтягивает сигнал к целевой громкости, и клипы из разных источников встают на сопоставимый уровень. Он работает с общим уровнем, динамика внутри трека - это <link="hint_editor_inspector-audio_compressor"><color=#59A6FF>Compressor</color></link>. <color=#D4B483>Lowest Volume</color> не даёт вытянуть тишину в шипение, <color=#D4B483>Maximum Amp</color> ограничивает усиление

  <color=#B48CE0><b>Интересно:</b></color> <b>сброс</b> возвращает и <b>Mix Level</b> к значению по умолчанию -80 dB, поэтому заодно выключает эффект

  Подробнее: <link="https://bullethero.space/ru/docs/editor/resources/preparing-the-track"><color=#59A6FF>Подготовка трека</color></link>
hint_editor_inspector-audio_normalize_header: "Normalize - нормализация"
hint_editor_inspector-audio_param-eq-center-freq: "Частота в Гц, вокруг которой строится полоса"
hint_editor_inspector-audio_param-eq-frequency-gain: "Усиление внутри полосы - ниже 1 режет, выше 1 поднимает"
hint_editor_inspector-audio_param-eq-octave-range: "Ширина полосы в октавах - узкая для точечных правок, широкая для общей окраски"
hint_editor_inspector-audio_param-eq_body: |-
  Одна параметрическая полоса: поднимает или срезает выбранный участок спектра. В отличие от <link="hint_editor_inspector-audio_lowpass"><color=#59A6FF>Lowpass</color></link> и <link="hint_editor_inspector-audio_highpass"><color=#59A6FF>Highpass</color></link> умеет и добавлять. <color=#D4B483>Center Freq</color> - где стоит полоса, <color=#D4B483>Octave Range</color> - её ширина, <color=#D4B483>Frequency Gain</color> ниже 1 режет, выше 1 поднимает

  <color=#B48CE0><b>Интересно:</b></color> <b>сброс</b> возвращает и <b>Mix Level</b> к значению по умолчанию -80 dB, поэтому заодно выключает эффект

  Подробнее: <link="https://bullethero.space/ru/docs/editor/resources/preparing-the-track"><color=#59A6FF>Подготовка трека</color></link>
hint_editor_inspector-audio_param-eq_header: "Param EQ - параметрический эквалайзер"
hint_editor_inspector-audio_pitch-shifter-fft-size: "Размер окна анализа - ручка обмена качества на задержку в алгоритме"
hint_editor_inspector-audio_pitch-shifter-max-channels: "Ограничение числа каналов для обработки"
hint_editor_inspector-audio_pitch-shifter-overlap: "Насколько перекрываются соседние окна - больше перекрытие, меньше артефактов, но дороже"
hint_editor_inspector-audio_pitch-shifter-pitch: "Множитель высоты тона - 1 без изменений, 2 на октаву вверх"
hint_editor_inspector-audio_pitch-shifter_body: |-
  Меняет высоту тона, не меняя скорость, поэтому тайминг остаётся привязан к песне. <color=#D4B483>Pitch</color> - множитель: 1 ничего не меняет, 2 поднимает на октаву. <color=#D4B483>FFT Size</color> и <color=#D4B483>Overlap</color> обменивают качество на стоимость

  <color=#5EC8C8><b>Подсказка:</b></color> цепочка принадлежит <b>треку</b> и не анимируется ключами. Для смены посреди песни разрежьте трек и настройте половины по-разному

  <color=#B48CE0><b>Интересно:</b></color> <b>сброс</b> возвращает и <b>Mix Level</b> к значению по умолчанию -80 dB, поэтому заодно выключает эффект

  Подробнее: <link="https://bullethero.space/ru/docs/editor/resources/preparing-the-track"><color=#59A6FF>Подготовка трека</color></link>
hint_editor_inspector-audio_pitch-shifter_header: "Pitch Shifter - сдвиг высоты тона"
hint_editor_inspector-audio_reverb-decay-hf-ratio: "Насколько верхи затухают быстрее низов - ниже 1 хвост темнеет по мере затухания"
hint_editor_inspector-audio_reverb-decay-time: "За сколько секунд затухает хвост - самый сильный признак размера комнаты"
hint_editor_inspector-audio_reverb-density: "Модальная плотность моделируемого пространства"
hint_editor_inspector-audio_reverb-diffusion: "Плотность отражений во времени - на низких значениях хвост становится зернистым и металлическим"
hint_editor_inspector-audio_reverb-dry-level: "Уровень необработанного сигнала на выходе"
hint_editor_inspector-audio_reverb-hf-reference: "Частота, на которой отсчитываются Room HF и Decay HF Ratio"
hint_editor_inspector-audio_reverb-lf-reference: "Частота, на которой отсчитывается Room LF"
hint_editor_inspector-audio_reverb-reflect-delay: "Задержка до прихода этих отражений - насколько далеко стены"
hint_editor_inspector-audio_reverb-reflections: "Уровень ранних отражений - различимых первых отскоков от ближних стен"
hint_editor_inspector-audio_reverb-reverb: "Уровень позднего размытого хвоста в противовес ранним отражениям"
hint_editor_inspector-audio_reverb-reverb-delay: "Задержка перед тем, как этот хвост вступает"
hint_editor_inspector-audio_reverb-room: "Общий уровень отражённого сигнала - насколько комната слышна"
hint_editor_inspector-audio_reverb-room-hf: "Уровень комнаты на высоких частотах - если срезать, стены звучат мягкими и поглощающими"
hint_editor_inspector-audio_reverb-room-lf: "Уровень комнаты на низких частотах"
hint_editor_inspector-audio_reverb_body: |-
  Помещает трек в комнату: ранние отражения, затем затухающий хвост. Начинайте с трёх полей: <color=#D4B483>Decay Time</color> - размер комнаты, <color=#D4B483>Room</color> - насколько она слышна, срезанный <color=#D4B483>Room HF</color> делает стены мягкими

  <color=#B48CE0><b>Интересно:</b></color> <b>сброс</b> возвращает и <b>Mix Level</b> к значению по умолчанию -80 dB, поэтому заодно выключает эффект

  Подробнее: <link="https://bullethero.space/ru/docs/editor/resources/preparing-the-track"><color=#59A6FF>Подготовка трека</color></link>
hint_editor_inspector-audio_reverb_header: "Reverb - реверберация"
hint_editor_inspector-effect_angle-a: "Угол в градусах. В вариантах Random это один конец диапазона, из которого разыгрывается каждая частица"
hint_editor_inspector-effect_angle-b: "Другой конец диапазона, из которого каждая частица разыгрывает свой угол"
hint_editor_inspector-effect_angle-curve: "Кривая, по которой читается угол: по собственному времени жизни частицы в Over Life и по её скорости в By Speed"
hint_editor_inspector-effect_angle-speed-range: "Окно скоростей, через которое перекладывается кривая: скорость, читаемая как её начало, и скорость, читаемая как её конец"
hint_editor_inspector-effect_angle-type: "Какой из пяти вариантов поворота выбран. Смена заменяет весь подобъект, поэтому строки ниже принадлежат новому варианту"
hint_editor_inspector-effect_angle_body: |-
  Как частица повёрнута в течение жизни, одним из пяти вариантов: фиксированный <color=#D4B483>Value</color>, два <color=#D4B483>Curves</color> или два <color=#D4B483>Random</color>, разыгрываемых на каждую частицу

  <color=#D4B483>Over Life</color> читает кривую по времени жизни частицы, <color=#D4B483>By Speed</color> - по её скорости, через окно скоростей ниже

  <b>Сброс</b> рядом с этой кнопкой сбрасывает и <color=#D4B483>Type</color>, а вместе с ним и кривую или случайную пару

  Подробнее: <link="https://bullethero.space/ru/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Читаемость</color></link>
hint_editor_inspector-effect_angle_header: "Angle - поворот частицы"
hint_editor_inspector-effect_body: |-
  Параметры эффекта <color=#D4B483>VFX Graph</color> по группам: конфигурация, ядро, силы, форма, угол, масштаб и цвет. Все группы видны одновременно, а не по одной

  <color=#B48CE0><b>Интересно:</b></color> эффекты <b>сидируются так же, как всё остальное</b> - от чисел, которые вы правите, а не от состояния генератора, - поэтому уровень воспроизводится одинаково на любом устройстве

  <color=#5EC8C8><b>Подсказка:</b></color> цвета могут ссылаться на тему уровня вместо литерала, а для градиентных типов открывается общий редактор градиента

  Подробнее: <link="https://bullethero.space/ru/docs/editor/performance/level-budget"><color=#59A6FF>Бюджет уровня</color></link>
hint_editor_inspector-effect_color-a: "Цвет частицы. В вариантах Random это один конец диапазона, из которого разыгрывается каждая частица"
hint_editor_inspector-effect_color-b: "Другой конец диапазона, из которого каждая частица разыгрывает свой цвет"
hint_editor_inspector-effect_color-gradient: "Градиент, по которому читается цвет: по времени жизни частицы, по её скорости или один цвет на частицу, смотря какой вариант"
hint_editor_inspector-effect_color-speed-range: "Окно скоростей, через которое перекладывается градиент: скорость, читаемая как его начало, и скорость, читаемая как его конец"
hint_editor_inspector-effect_color-type: "Какой из шести вариантов окраски выбран. Смена заменяет весь подобъект, поэтому строки ниже принадлежат новому варианту"
hint_editor_inspector-effect_color_body: |-
  Как частица окрашена в течение жизни, одним из шести вариантов: те же пять, что у <link="hint_editor_inspector-effect_angle"><color=#59A6FF>Angle</color></link> и <link="hint_editor_inspector-effect_scale"><color=#59A6FF>Scale</color></link>, только с градиентами вместо кривых, и ещё <color=#D4B483>Random</color> по градиенту, который берёт один цвет на частицу

  <color=#5EC8C8><b>Подсказка:</b></color> цвет здесь может быть ссылкой на тему, так эффект следует за уровнем, который меняет палитру по ходу

  <b>Сброс</b> рядом с этой кнопкой сбрасывает и <color=#D4B483>Type</color>, а вместе с ним градиент или пару цветов

  Подробнее: <link="https://bullethero.space/ru/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>Цвет и темы</color></link>
hint_editor_inspector-effect_color_header: "Color - цвет частицы"
hint_editor_inspector-effect_config-has-stop-frame: "Учитывается ли Stop Frame вообще. Выключено - эмиттер спавнит, пока жив его объект"
hint_editor_inspector-effect_config-stop-frame: "Кадр, отсчитанный от начала спана самого объекта, а не от времени уровня, на котором прекращается эмиссия. Уже живые частицы дожинают свою жизнь"
hint_editor_inspector-effect_config_body: |-
  Когда эмиттер перестаёт спавнить. Выключено - он спавнит, пока жив объект, и это обычный случай

  <color=#D4B483>Stop Frame</color> отсчитывается от начала промежутка самого объекта, а не от таймлайна уровня. Уже живые частицы доживают свою жизнь, так что картинка гаснет, а не срезается

  <b>Сброс</b> рядом с этой кнопкой возвращает оба поля к значениям разработчиков одним шагом отмены

  Подробнее: <link="https://bullethero.space/ru/docs/editor/performance/level-budget"><color=#59A6FF>Что уровень может себе позволить</color></link>
hint_editor_inspector-effect_config_header: "Config - когда эмиттер замолкает"
hint_editor_inspector-effect_core-lifetime-bounds: "Минимум и максимум секунд жизни частицы, разыгрываются на каждую - разброс это то, что не даёт залпу погаснуть разом. Среднее этих двух ещё и умножает размер залпа у незацикленного эффекта"
hint_editor_inspector-effect_core-loop: "Эмитит ли система непрерывно, вместо одной партии, которую никто не пополняет. Если выключено, после времени жизни рисовать уже нечего"
hint_editor_inspector-effect_core-particle-count: "Частиц в секунду - главная ручка стоимости. Живо одновременно будет это число, умноженное на среднее время жизни, и так в обоих режимах: с зацикливанием спавнится с этой скоростью, без него всё это количество вылетает одним залпом. Потолок это собственная ёмкость графа, и система каждый кадр считается по ней, существуют частицы или нет"
hint_editor_inspector-effect_core-particle-pivot: "Точка частицы, которая стоит на её позиции и вокруг которой частица вращается - аналог пивота объекта, но для частицы"
hint_editor_inspector-effect_core-render: "Рисуются ли частицы вообще. Выключено - система продолжает считаться, что полезно, когда важны только её побочные эффекты"
hint_editor_inspector-effect_core-shape-id: "Геометрия, которой рисуется каждая частица, из того же набора форм, что и у обычного объекта. None не рисует ничего - квад это обычное значение и дефолт этого поля"
hint_editor_inspector-effect_core-texture-id: "Картинка, которую рисует каждая частица, из того же набора ресурсов, что и у обычного объекта. None оставляет частицу неокрашенной, и это дефолт поля"
hint_editor_inspector-effect_core_body: |-
  Сколько частиц существует, сколько они живут и чем нарисованы. Как они движутся - это <link="hint_editor_inspector-effect_forces"><color=#59A6FF>Forces</color></link>

  <color=#D4B483>Particle Count</color> - главная ручка стоимости: эмиттер стоит примерно количество, умноженное на <color=#D4B483>Lifetime Bounds</color>. <color=#D4B483>Shape</color> и <color=#D4B483>Texture</color> можно оставить пустыми - частица без текстуры это дешёвый случай

  <color=#E8B04B><b>Предупреждение:</b></color> количество ограничено 1024, и граф каждый кадр платит за всю свою ёмкость, а не только за живые частицы. Запрашивайте столько, сколько нужно

  Подробнее: <link="https://bullethero.space/ru/docs/editor/performance/level-budget"><color=#59A6FF>Что уровень может себе позволить</color></link>
hint_editor_inspector-effect_core_header: "Core - сколько частиц и как долго"
hint_editor_inspector-effect_forces-linear-force: "Постоянное ускорение, а не скорость, поэтому его действие накапливается за жизнь частицы, а не остаётся ровным"
hint_editor_inspector-effect_forces-linear-velocity: "Постоянный снос, добавляемый каждый кадр поверх той скорости, с которой частица родилась - ветер, а не толчок"
hint_editor_inspector-effect_forces-orbital-center-offset: "Где стоит центр этой орбиты относительно эмиттера. Смещение делает вихрь несимметричным"
hint_editor_inspector-effect_forces-orbital-velocity: "Вращение частиц вокруг центра, а не вокруг себя. В двумерной сцене значение имеет компонента Z"
hint_editor_inspector-effect_forces-start-angular-velocity-max: "Верхняя граница разыгрываемого начального вращения"
hint_editor_inspector-effect_forces-start-angular-velocity-min: "Нижняя граница разыгрываемого начального вращения, в градусах в секунду"
hint_editor_inspector-effect_forces-start-gravity-max: "Верхняя граница разыгрываемой на частицу гравитации"
hint_editor_inspector-effect_forces-start-gravity-min: "Нижняя граница разыгрываемой на частицу гравитации. Отрицательные значения поднимают вверх"
hint_editor_inspector-effect_forces-start-velocity-max: "Верхняя граница разыгрываемой начальной скорости. Развести эти две и значит превратить ровный залп в веер"
hint_editor_inspector-effect_forces-start-velocity-min: "Нижняя граница разыгрываемой начальной скорости, по каждой оси"
hint_editor_inspector-effect_forces-velocity-speed: "Множитель всей скорости частицы - одна ручка, чтобы замедлить или ускорить готовый эффект, не перенастраивая каждое поле выше"
hint_editor_inspector-effect_forces_body: |-
  Всё, что двигает частицу после спавна. Откуда она стартует - это <link="hint_editor_inspector-effect_shape"><color=#59A6FF>Shape</color></link>

  Пары <color=#D4B483>Start</color> разыгрываются один раз при рождении, на каждую частицу. Всё остальное действует непрерывно всю жизнь частицы, а <color=#D4B483>Linear Force</color> - ускорение и потому накапливается

  <color=#5EC8C8><b>Подсказка:</b></color> <color=#D4B483>Velocity Speed</color> умножает весь результат, поэтому готовый эффект можно замедлить или ускорить, не перенастраивая остальное

  Подробнее: <link="https://bullethero.space/ru/docs/editor/craft/composition-and-camera"><color=#59A6FF>Композиция</color></link>
hint_editor_inspector-effect_forces_header: "Forces - что двигает частицу"
hint_editor_inspector-effect_header: "Инспектор эффекта"
hint_editor_inspector-effect_scale-a: "Размер частицы. В вариантах Random это один конец диапазона, из которого разыгрывается каждая частица"
hint_editor_inspector-effect_scale-b: "Другой конец диапазона, из которого каждая частица разыгрывает свой размер"
hint_editor_inspector-effect_scale-curve-x: "Кривая, по которой читается горизонтальный размер, независимо от вертикального"
hint_editor_inspector-effect_scale-curve-y: "Кривая, по которой читается вертикальный размер, независимо от горизонтального"
hint_editor_inspector-effect_scale-speed-range: "Окно скоростей, через которое перекладываются обе кривые: скорость, читаемая как их начало, и скорость, читаемая как их конец"
hint_editor_inspector-effect_scale-type: "Какой из пяти вариантов размера выбран. Смена заменяет весь подобъект, поэтому строки ниже принадлежат новому варианту"
hint_editor_inspector-effect_scale_body: |-
  Насколько велика частица в течение жизни, в тех же пяти вариантах, что и <link="hint_editor_inspector-effect_angle"><color=#59A6FF>Angle</color></link>. <color=#D4B483>Curve X</color> и <color=#D4B483>Curve Y</color> читаются независимо, так что частица может растягиваться, пока уменьшается

  <color=#E8B04B><b>Предупреждение:</b></color> строка под кривыми переиспользуется: в Value и Random это сам размер, в By Speed - окно скоростей. Подпись рядом говорит, что именно

  <b>Сброс</b> рядом с этой кнопкой сбрасывает и <color=#D4B483>Type</color>, а вместе с ним обе кривые и случайную пару

  Подробнее: <link="https://bullethero.space/ru/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Читаемость</color></link>
hint_editor_inspector-effect_scale_header: "Scale - размер частицы"
hint_editor_inspector-effect_shape-arc: "Какая часть обода реально занята, в радианах, против часовой стрелки от оси +X - меньше полного оборота даёт веер"
hint_editor_inspector-effect_shape-box-size: "Полные ширина и высота коробки спавна, отцентрованной по объекту эффекта"
hint_editor_inspector-effect_shape-circle-aspect: "Вертикальная полуось как множитель радиуса: 1 - круг, всё остальное - эллипс"
hint_editor_inspector-effect_shape-circle-radius: "Расстояние от центра до кольца, вдоль горизонтальной оси"
hint_editor_inspector-effect_shape-circle-thickness: "Насколько кольцо заполнено внутрь: 0 - голый контур, 1 - сплошной диск"
hint_editor_inspector-effect_shape-cone-base-radius: "Радиус у эмиттера"
hint_editor_inspector-effect_shape-cone-height: "Расстояние между концами - насколько глубок объём спавна"
hint_editor_inspector-effect_shape-cone-top-radius: "Радиус на дальнем конце. Больше базового - раструб, меньше - воронка"
hint_editor_inspector-effect_shape-line-end: "Другой конец отрезка"
hint_editor_inspector-effect_shape-line-start: "Один конец отрезка, в локальных координатах объекта эффекта"
hint_editor_inspector-effect_shape-spread: "Какую часть формы обход проходит до того, как начать сначала"
hint_editor_inspector-effect_shape-spread-speed: "Как быстро движется точка спавна - это и задаёт видимую скорость вращения"
hint_editor_inspector-effect_shape-spread-type: "Как следующие частицы обходят форму: случайно, по кругу в одну сторону, туда-обратно или по синусу. Именно это превращает неподвижное кольцо во вращающийся или качающийся узор"
hint_editor_inspector-effect_shape-torus-radius-major: "Радиус кольца, вокруг которого согнута трубка"
hint_editor_inspector-effect_shape-torus-radius-minor: "Радиус самой трубки - насколько толсто кольцо"
hint_editor_inspector-effect_shape-type: "Какой это объём спавна. Смена заменяет форму, поэтому поля ниже принадлежат новой форме, а не прежней"
hint_editor_inspector-effect_shape_body: |-
  Объём спавна: точка, кольцо, прямоугольник, отрезок, конус или тор. Он решает только, откуда частица стартует, а что дальше - это <link="hint_editor_inspector-effect_forces"><color=#59A6FF>Forces</color></link>

  Смена <color=#D4B483>Type</color> меняет строки ниже, и строки общие для разных типов. <color=#D4B483>Arc</color> задаётся в радианах, и меньше полного оборота даёт веер

  <color=#5EC8C8><b>Подсказка:</b></color> <b>Spread</b> в режиме Loop даёт классический вращающийся эмиттер

  <b>Сброс</b> рядом с этой кнопкой сбрасывает и <color=#D4B483>Type</color>, а вместе с ним и набранную форму

  Подробнее: <link="https://bullethero.space/ru/docs/editor/craft/composition-and-camera"><color=#59A6FF>Композиция</color></link>
hint_editor_inspector-effect_shape_header: "Shape - откуда вылетают частицы"
hint_editor_inspector-keyframe_body: |-
  <b>Показываются сразу все дорожки, которых касается выделение</b>, а не только та, по которой вы кликнули последней. Пустое значение означает, что выделенные ключи в нём <b>расходятся</b>

  <color=#5EC8C8><b>Подсказка:</b></color> <b>Сглаживание</b> действует на все дорожки сразу и коммитится <b>одним шагом отмены</b>

  <color=#B48CE0><b>Интересно:</b></color> <b>Кадр</b> заблокирован, когда выделено несколько ключей: одно число схлопнуло бы их в один кадр. Двигайте их перетаскиванием на таймлайне

  Подробнее: <link="https://bullethero.space/ru/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Как устроен редактор</color></link>
hint_editor_inspector-keyframe_header: "Инспектор ключа"
hint_editor_inspector-object_body: |-
  Собственные поля выделенного объекта. Общие поля пустого объекта показываются у любого типа, а Shape, Effect, Text и Prefab добавляют снизу свои

  <b>Активен</b> выключает и отрисовку, <i>и</i> столкновения, и наследуется потомками: скрытый здесь объект не может убить игрока

  <color=#E86A5A><b>Внимание:</b></color> <b>Слой</b> задаётся относительно родителя. Глобальный слой рядом, только для чтения, - это то, что использует рендер

  <color=#5EC8C8><b>Подсказка:</b></color> правка поля у объекта из префаба записывает <b>переопределение экземпляра</b> - галочка рядом показывает его и откатывает

  Подробнее: <link="https://bullethero.space/ru/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Как устроен редактор</color></link>
hint_editor_inspector-object_header: "Инспектор объекта"
hint_editor_inspector-resolved_body: |-
  Чем выделенные объекты <b>являются</b> на текущем кадре: значения читаются из работающей симуляции, а не из того, что вы записали

  Квадрат в конце строки - состояние ключа поля: синий - ключ на этом кадре (клик по квадрату выделяет его), янтарный - значение интерполируется между ключами, серый - кадр вне ключей и значение удерживается, пустой - ключей нет, берётся значение по умолчанию. Стрелки переводят плейхед на предыдущий или следующий ключ

  Под чертой - составные значения: суммарный слой, унаследованная активность и трансформ с учётом родителей. Их не задаёт ни один ключ, поэтому индикатора у них нет

  Подробнее: <link="https://bullethero.space/ru/docs/editor/reference/object-properties"><color=#59A6FF>Свойства объекта</color></link>
hint_editor_inspector-resolved_header: "Текущие значения"
hint_editor_inspector_audio-span-fit: "Растянуть дорожку на ту часть клипа, что помещается до конца уровня. Недоступно без разрешимого клипа и при нулевой скорости: у замороженной дорожки нет длины"
hint_editor_inspector_audio-span-fit-level: "Растит дорожку и уровень вместе, пока не поместится весь клип. Уровень только удлиняется, а если клип уже помещается - не делает ничего"
hint_editor_inspector_collider-id_body: |-
  То, во что объект <b>попадает</b>, - и это выбор, отдельный от того, что он рисует

  <color=#B48CE0><b>Интересно:</b></color> одно из другого не выводится, и это намеренно: безобидный луч-предупреждение, хитбокс проще своей графики и невидимая стена - обычный контент, а не трюки

  <color=#5EC8C8><b>Подсказка:</b></color> оба поля выбирают из одних и тех же двух коллекций, поэтому фигура, созданная уровнем, годится и туда, и туда

  Подробнее: <link="https://bullethero.space/ru/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Читаемость и честность</color></link>
hint_editor_inspector_collider-id_header: "Коллайдер"
hint_editor_inspector_ease_body: |-
  Как значение приходит к этому ключу от предыдущего

  <color=#B48CE0><b>Интересно:</b></color> сглаживание принадлежит <b>входящей</b> стороне ключа, поэтому первому ключу дорожки сглаживать нечего и его выбор ни на что не влияет

  <color=#5EC8C8><b>Подсказка:</b></color> при нескольких выделенных ключах выбор применяется ко всем сразу <b>одним шагом отмены</b>, даже на разных дорожках и у разных объектов. Пустой выбор означает, что ключи расходятся

  Подробнее: <link="https://bullethero.space/ru/docs/editor/basics/keyframes-and-easing"><color=#59A6FF>Ключи и сглаживание</color></link>
hint_editor_inspector_ease_header: "Сглаживание"
hint_editor_inspector_global-layer: "Порядок отрисовки, который реально использует рендер: собственный слой плюс слои всех предков. Только для чтения - он вычисляется, а не хранится"
hint_editor_inspector_layer_body: |-
  Порядок отрисовки, <b>относительно родителя</b>, а не абсолютный

  <color=#E86A5A><b>Внимание:</b></color> рендер использует это число плюс слои всех предков - сумма показана только для чтения в поле <b>Глобально</b> ниже. Смена родителя меняет место отрисовки, даже если это число не трогать

  <color=#B48CE0><b>Интересно:</b></color> случайные значения привязаны к итоговому слою, поэтому перемещение объекта по иерархии перебрасывает их

  Подробнее: <link="https://bullethero.space/ru/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Как устроен редактор</color></link>
hint_editor_inspector_layer_header: "Слой"
hint_editor_inspector_object-type: "Какого рода этот объект. Смена типа ЗАМЕНЯЕТ объект: общие поля сохраняются, а то, чему в новом типе места нет, теряется"
hint_editor_inspector_parent: "За каким объектом следует этот. Родитель накладывает свой трансформ на потомка, а слои складываются по цепочке, поэтому смена родителя двигает объект и в порядке отрисовки"
hint_editor_inspector_shader-type_body: |-
  По какому пути рендерится объект

  <color=#E86A5A><b>Внимание:</b></color> <b>Авто</b> решает один раз, при загрузке уровня, и никогда не меняет его вид: всё, что нельзя доказать непрозрачным по альфе, становится прозрачным

  <color=#5EC8C8><b>Подсказка:</b></color> подпись рядом показывает, во что <b>Авто</b> разрешился на самом деле, - она читается прямо из данных рендера

  Подробнее: <link="https://bullethero.space/ru/docs/editor/performance/level-budget"><color=#59A6FF>Бюджет уровня</color></link>
hint_editor_inspector_shader-type_header: "Тип шейдера"
hint_editor_inspector_shape-id_body: |-
  То, что объект <b>рисует</b>

  <color=#B48CE0><b>Интересно:</b></color> фигура - настоящая геометрия, вписанная в свой прямоугольник: её длинная сторона равна ровно 1, поэтому прямоугольник объекта и есть то, что видно на экране. Игра генерирует около 500 фигур, уровень может добавить свои

  <color=#5EC8C8><b>Подсказка:</b></color> пустое значение допустимо: объект, который ничего не рисует, но имеет коллайдер, - невидимая стена

  Подробнее: <link="https://bullethero.space/ru/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Читаемость и честность</color></link>
hint_editor_inspector_shape-id_header: "Фигура"
hint_editor_inspector_span_body: |-
  Когда объект существует. Диапазон полуоткрытый: начальный кадр входит, конечный нет. Объект, заканчивающийся на 20, и объект, начинающийся с 20, никогда не рисуются оба на этом кадре

  <color=#B48CE0><b>Интересно:</b></color> промежуток потомка обязан лежать внутри родительского, но это вычисляется при чтении, а не записывается. Сожмите родителя - потомки обрежутся, растяните обратно - вернутся. Корневой объект за концом уровня просто не играет

  <b>Якоря</b> привязывают край к краю родителя и решают, что играет: потомок с якорями растягивается вместе с родителем. Его анимация сохраняет записанный вами тайминг

  Подробнее: <link="https://bullethero.space/ru/docs/editor/basics/frames-and-time"><color=#59A6FF>Кадры, время и длина уровня</color></link>
hint_editor_inspector_span_header: "Отрезок"
hint_editor_interop-report: "Что пережило конвертацию из формата другой игры, а что нет. Записи информационные: уровень уже загружен, здесь сказано, чем он отличается от оригинала"
hint_editor_level-export_body: |-
  Записывает уровень наружу - папкой или одним архивом. Всё, что использует уровень, едет вместе с ним, включая песню, которая лежит вне папки уровня

  Обычный <b>.zip</b> открывается проводником Windows без установки чего-либо. Варианты с паролем - нет: <b>+ пароль</b> открывает 7-Zip или любой другой архиватор, <b>(gpg)</b> открывается через gpg

  <color=#5EC8C8><b>Подсказка:</b></color> всё, что не смогло уехать - ресурс по ссылке, файл, на который никто не ссылается - перечислено в отчёте после экспорта

  <color=#E8B04B><b>Предупреждение:</b></color> пароль - это не DRM. У кого есть файл и пароль, тот всегда его откроет

  Подробнее: <link="https://bullethero.space/ru/docs/editor/workflow/sharing-by-hand"><color=#59A6FF>Как поделиться уровнем вручную</color></link>
hint_editor_level-export_header: "Экспорт уровня"
hint_editor_level-protection_body: |-
  Шифрует документ уровня на диске, так что при открытии уровень спрашивает пароль. Метаданные, обложка и медиа остаются открытыми, поэтому карточка уровня видна и без него

  Пароль спрашивается один раз за сессию и хранится только в памяти. Чтобы снять защиту, оставьте поле пустым и нажмите <b>Применить</b>

  <color=#E86A5A><b>Внимание:</b></color> забытый пароль не восстановить. Ключ нигде не хранится

  Подробнее: <link="https://bullethero.space/ru/docs/editor/reference/export-and-protection"><color=#59A6FF>Экспорт и защита</color></link>
hint_editor_level-protection_header: "Защита уровня"
hint_editor_prefab-flatten-recursive_body: |-
  Выключено - от шаблона отвязывается только выбранная установка. Префаб внутри неё сохраняет свою связь, так что правка внутреннего шаблона по-прежнему доходит до уровня. Это значение по умолчанию

  Включено - разворачивается и всё вложенное, и ни один объект уровня больше не связан с внутренними шаблонами, на любой глубине

  Сами шаблоны в любом случае остаются в уровне, а всё разворачивание - один шаг отмены

  Подробнее: <link="https://bullethero.space/ru/docs/editor/reference/prefab-mode"><color=#59A6FF>Режим префаба</color></link>
hint_editor_prefab-flatten-recursive_header: "Разворачивать вложенные префабы"
hint_editor_prefab-mode_body: |-
  <color=#E86A5A><b>Внимание:</b></color> вы правите <b>шаблон</b> префаба, а не одну его установку. Сохранение переносит изменение во все установки, которые ссылаются на этот шаблон

  Правки здесь не создают переопределений экземпляра. Переопределение появляется только при правке объекта установки вне этого режима

  <color=#5EC8C8><b>Подсказка:</b></color> установка внутри этого шаблона открывает свой шаблон поверх, а "Сохранить и закрыть" возвращает обратно сюда. Предел вложенности - 8 уровней

  Подробнее: <link="https://bullethero.space/ru/docs/editor/workflow/reuse"><color=#59A6FF>Переиспользование: префабы, копирование, генераторы</color></link>
hint_editor_prefab-mode_header: "Режим префаба"
hint_editor_search-palette_body: |-
  Два режима. <b>Выполнение команды</b> находит любое действие редактора по имени - те же действия, что запускают панель инструментов и контекстные меню. <b>Поиск по содержимому</b> находит объекты текущей области и аудиодорожки

  <color=#B48CE0><b>Интересно:</b></color> ресурсов нет ни в одном режиме: каждый выбирается через поле, которому он нужен

  Подробнее: <link="https://bullethero.space/ru/docs/editor/workflow/speed-and-shortcuts"><color=#59A6FF>Скорость и горячие клавиши</color></link>
hint_editor_search-palette_header: "Палитра команд"
hint_editor_search-picker: "Единый выбор для всех полей ресурсов. Печатайте, чтобы отранжировать список. Фильтры сужают его по типу, а плашка справа появляется, когда поле принимает только один домен"
hint_editor_theme-ref_body: |-
  Направьте этот цвет на <b>слот темы уровня</b> вместо конкретного значения. При смене темы всё, что ссылается на слот, перекрашивается разом

  <color=#5EC8C8><b>Подсказка:</b></color> образцы показывают палитру на кадре редактируемого ключа, а не на плейхеде. Чтобы подобрать цвет под более поздний вид, правьте ключ, который стоит позже

  Подробнее: <link="https://bullethero.space/ru/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>Цвет, темы и постобработка</color></link>
hint_editor_theme-ref_header: "Ссылка на цвет темы"
hint_editor_timeline-audio_body: |-
  Аудио-дорожки уровня с волновой формой, чтобы ровнять контент под то, что слышно

  <color=#5EC8C8><b>Подсказка:</b></color> <b>Вместить трек</b> в инспекторе подгоняет дорожку под реальную длину клипа. Кнопка недоступна без клипа и при скорости 0

  <color=#E86A5A><b>Внимание:</b></color> ползунок <b>Громкость</b> в инспекторе - это фейдер дорожки. Ключевая громкость - отдельная дорожка Volume на локальном таймлайне, и при воспроизведении они перемножаются

  Подробнее: <link="https://bullethero.space/ru/docs/editor/resources/preparing-the-track"><color=#59A6FF>Подготовка трека</color></link>
hint_editor_timeline-audio_header: "Аудио-таймлайн"
hint_editor_timeline-events_body: |-
  Ключи уровня, которые не принадлежат ни одному объекту:
  - позиция, поворот, зум, пивот и тряска камеры
  - маркеры и чекпоинты
  - предел экрана
  - фон и тема
  - все эффекты постобработки
  - видимость, управление, столкновения, размер и скорость игрока

  <color=#B48CE0><b>Интересно:</b></color> дорожка <b>Beat</b> здесь - исключение. У её элементов есть промежуток, поэтому только на неё действуют Края и Ножницы

  <color=#5EC8C8><b>Подсказка:</b></color> цвет может ссылаться на тему уровня вместо конкретного значения. Тогда одна смена темы перекрашивает всё это разом

  Подробнее: <link="https://bullethero.space/ru/docs/editor/craft/composition-and-camera"><color=#59A6FF>Композиция и камера</color></link>
hint_editor_timeline-events_header: "Таймлайн событий"
hint_editor_timeline-level_body: |-
  По одному клипу на объект, дорожка клипа - его <b>слой</b>. Клип - это <b>промежуток</b> объекта: кадры 10-19 заканчиваются ровно там, где начинается клип с кадра 20

  <color=#B48CE0><b>Интересно:</b></color> потомок играет только внутри промежутка родителя, но из авторских значений ничего не вырезается. Растяните родителя обратно - потомок вернётся

  <color=#5EC8C8><b>Подсказка:</b></color> <b>Выделение</b> выделяет и двигает, <b>Края</b> тянут край, <b>Ножницы</b> режут клип под курсором. Меню - правым кликом по пустому месту

  Подробнее: <link="https://bullethero.space/ru/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Как устроен редактор</color></link>, <link="https://bullethero.space/ru/docs/editor/craft/composition-and-camera"><color=#59A6FF>Композиция и камера</color></link>
hint_editor_timeline-level_header: "Таймлайн уровня"
hint_editor_timeline-local_body: |-
  Ключи <b>выделенного объекта</b>, по дорожке на каждое свойство. Кадры считаются от начала промежутка объекта, поэтому сдвиг объекта переносит всю его анимацию

  <color=#B48CE0><b>Интересно:</b></color> <b>пустая дорожка - это корректные данные</b>. Она берёт значение по умолчанию, поэтому новый объект ничего не анимирует, пока вы не поставите ключ

  Подробнее: <link="https://bullethero.space/ru/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>Как устроен редактор</color></link>
hint_editor_timeline-local_header: "Локальный таймлайн"
hint_editor_timeline-prefab_body: |-
  Собственный таймлайн режима префаба, по объектам <b>шаблона</b>. Его длина - длина самого шаблона, а не промежуток одной из установок

  <color=#E8B04B><b>Предупреждение:</b></color> выделение не общее с остальным редактором. Правки здесь меняют шаблон и расходятся по всем его установкам

  Подробнее: <link="https://bullethero.space/ru/docs/editor/workflow/reuse"><color=#59A6FF>Переиспользование: префабы, копирование, генераторы</color></link>
hint_editor_timeline-prefab_header: "Таймлайн префаба"
hint_editor_value-type-color: "Откуда берётся цвет на каждом проигрывании. Значение - как написан. Тема - слот темы на этом кадре, меняется вместе с темой. Случ. от-до - каждый канал катится сам по себе, цвет попадает куда угодно между двумя. Случ. от A до B - один бросок на все каналы, цвет всегда лежит на прямой из A в B"
hint_editor_value-type-number: "Как это число решается каждый раз при проигрывании. Значение - число как написано. Случ. от-до - число между границами. Случ. от-до, шаг - то же самое, но положенное на сетку такого размера. Формы от A до B здесь нет, потому что один компонент и так тянет ровно одно число. Случайность адресуется, а не тянется, поэтому уровень играется одинаково на любом устройстве, а перенос объекта или смена слоя перекатывают бросок"
hint_editor_value-type-vector: "Как это значение решается каждый раз при проигрывании. Значение - числа как написаны. Случ. в рамке - каждая ось катится сама по себе между своими границами и заполняет прямоугольник. Случ. от A до B - ОДИН бросок, который читают все оси в одном и том же месте, так что точка едет по прямой из A в B. Ось стоит на месте, если у неё одно и то же число в обоих концах. Случ. в круге - точка на диске вокруг центра. Формы с шагом кладут результат на сетку. Случайность адресуется, а не тянется, поэтому уровень играется одинаково на любом устройстве"
hint_gen_audio_waveform_body: |-
  Строит объекты по форме аудиодорожки, чтобы уровень зримо следовал за тем, что слышно

  Подробнее: <link="https://bullethero.space/ru/docs/editor/workflow/reuse"><color=#59A6FF>Переиспользование: префабы, копирование, генераторы</color></link>
hint_gen_audio_waveform_header: "Волна звука"
hint_gen_beat_flash_body: |-
  Ставит вспышку на каждую долю. Доли берутся из карты долей уровня, а если её нет - из маркеров, поэтому мигает ровно то, что вы видите на сетке

  Подробнее: <link="https://bullethero.space/ru/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>Ритм и структура</color></link>
hint_gen_beat_flash_header: "Вспышка на долю"
hint_gen_bullet_homing_body: |-
  Пули, которые подгибаются туда, где ожидается игрок. Кривая записывается заранее, а не считается при воспроизведении: результат одинаков на любом устройстве

  Подробнее: <link="https://bullethero.space/ru/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Читаемость и честность</color></link>
hint_gen_bullet_homing_header: "Самонаводящиеся пули"
hint_gen_bullet_laser_sweep_body: |-
  Луч, проходящий по полю. Предупреждение и поражающая фаза - разные объекты, поэтому предупреждение можно рисовать, не делая его смертельным

  Подробнее: <link="https://bullethero.space/ru/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Читаемость и честность</color></link>
hint_gen_bullet_laser_sweep_header: "Развёртка лазера"
hint_gen_bullet_rain_body: |-
  Пули, падающие по области в течение промежутка времени. Плотность и разброс - параметры, а место падения каждой берётся из сида уровня, поэтому прогон воспроизводим

  Подробнее: <link="https://bullethero.space/ru/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Читаемость и честность</color></link>
hint_gen_bullet_rain_header: "Дождь из пуль"
hint_gen_bullet_spiral_body: |-
  Пули, выпускаемые вдоль вращающегося луча, - классическая спиральная стена

  Подробнее: <link="https://bullethero.space/ru/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Читаемость и честность</color></link>
hint_gen_bullet_spiral_header: "Спираль из пуль"
hint_gen_bullet_wave_body: |-
  Ряд пуль, идущих вместе. Базовый паттерн, и с него стоит начать: его параметры называют идеи, которые переиспользуют остальные генераторы пуль

  Подробнее: <link="https://bullethero.space/ru/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Читаемость и честность</color></link>
hint_gen_bullet_wave_header: "Волна пуль"
hint_gen_capacity_hint_body: |-
  Записывает рекомендательные лимиты уровня: сколько объектов и эффектов он рассчитывает держать одновременно

  <color=#B48CE0><b>Интересно:</b></color> видимого не меняет ничего. Рантайм использует их, чтобы заранее зарезервировать буферы, а не растить их посреди уровня - именно оттуда иначе берётся рывок

  Подробнее: <link="https://bullethero.space/ru/docs/editor/performance/level-budget"><color=#59A6FF>Бюджет уровня</color></link>
hint_gen_capacity_hint_header: "Подсказка ёмкости"
hint_gen_font_cache_body: |-
  Собирает все символы, которые реально использует текст уровня, и запекает их, чтобы ни один глиф не готовился в момент первого появления

  <color=#7FC97F><b>Рекомендация:</b></color> запускайте, когда текст окончателен. Символ, добавленный позже и не перезапечённый, стоит рывка при первом показе

  Подробнее: <link="https://bullethero.space/ru/docs/editor/resources/images-and-fonts"><color=#59A6FF>Изображения и шрифты</color></link>
hint_gen_font_cache_header: "Кэш шрифтов"
hint_gen_geometry_fractal_body: |-
  Повторяет фигуру внутри себя во всё меньшем масштабе. Глубина стоит объектов экспоненциально, поэтому поднимайте её по шагу

  Подробнее: <link="https://bullethero.space/ru/docs/editor/workflow/reuse"><color=#59A6FF>Переиспользование: префабы, копирование, генераторы</color></link>
hint_gen_geometry_fractal_header: "Фрактал"
hint_gen_geometry_grid_body: |-
  Заполняет прямоугольник равномерно расставленными копиями фигуры

  Подробнее: <link="https://bullethero.space/ru/docs/editor/workflow/reuse"><color=#59A6FF>Переиспользование: префабы, копирование, генераторы</color></link>
hint_gen_geometry_grid_header: "Сетка"
hint_gen_geometry_polygon_body: |-
  Расставляет фигуры по вершинам или рёбрам правильного многоугольника

  Подробнее: <link="https://bullethero.space/ru/docs/editor/workflow/reuse"><color=#59A6FF>Переиспользование: префабы, копирование, генераторы</color></link>
hint_gen_geometry_polygon_header: "Многоугольник"
hint_gen_geometry_radial_body: |-
  Распределяет копии по окружности. Основа большинства симметричных паттернов

  Подробнее: <link="https://bullethero.space/ru/docs/editor/workflow/reuse"><color=#59A6FF>Переиспользование: префабы, копирование, генераторы</color></link>
hint_gen_geometry_radial_header: "Радиально"
hint_gen_geometry_spiral_body: |-
  Распределяет копии вдоль спирали: радиус и угол растут вместе

  Подробнее: <link="https://bullethero.space/ru/docs/editor/workflow/reuse"><color=#59A6FF>Переиспользование: префабы, копирование, генераторы</color></link>
hint_gen_geometry_spiral_header: "Спираль"
hint_gen_level_afterbeat_body: |-
  Конвертирует уровень Afterbeat (бывшая Project Arrhythmia) в этот формат

  <color=#E8B04B><b>Предупреждение:</b></color> переносится не всё. Что не перенеслось, перечислено в отчёте о конвертации: уровень загрузится в любом случае, а отчёт скажет, чем он отличается от оригинала

  Подробнее: <link="https://bullethero.space/ru/docs/editor/performance/afterbeat-import"><color=#59A6FF>Импорт из Afterbeat</color></link>
hint_gen_level_afterbeat_header: "Импорт уровня Afterbeat"
hint_gen_level_archive_body: |-
  Строит уровень из архива, собранного этой игрой - .tar.gz или .zip, любой может быть под паролем. Тип читается из байтов, так что переименованный архив всё равно откроется. Архив из старой сборки мигрирует на входе

  <color=#E8B04B><b>Предупреждение:</b></color> импортированный уровень по умолчанию получает собственный id и не может перезаписать уровень, который уже есть на этой машине. Снимайте эту галку, только чтобы вернуть уровень, который здесь когда-то был

  Подробнее: <link="https://bullethero.space/ru/docs/editor/reference/generators"><color=#59A6FF>Генераторы</color></link>
hint_gen_level_archive_header: "Импорт архива уровня"
hint_gen_level_audio_file_body: |-
  Начинает уровень с трека: подключает аудио, подгоняет длину уровня под него и оставляет вас в начале пустого таймлайна

  Подробнее: <link="https://bullethero.space/ru/docs/editor/resources/preparing-the-track"><color=#59A6FF>Подготовка трека</color></link>
hint_gen_level_audio_file_header: "Уровень из аудиофайла"
hint_gen_level_empty_body: |-
  Полностью очищает уровень. Всё созданное удаляется - поэтому его берут, когда начинают заново, а не правят

  Подробнее: <link="https://bullethero.space/ru/docs/editor/basics/first-level"><color=#59A6FF>Первый уровень: маршрут</color></link>
hint_gen_level_empty_header: "Пустой уровень"
hint_gen_section_additional: "Уточнения поверх основных параметров. Значения по умолчанию здесь обычно подходят"
hint_gen_section_main: "Параметры, определяющие, что генератор создаёт. Начинайте отсюда"
hint_gen_test_camera_flash_body: "Служебный генератор для проверки дорожек событий камеры. Для создания контента не предназначен"
hint_gen_test_camera_flash_header: "Вспышка камеры (тест)"
hint_gen_test_form_body: "Служебный генератор, прогоняющий все виды полей, которые умеет строить форма. Для создания контента не предназначен"
hint_gen_test_form_header: "Форма (тест)"
hint_gen_test_odd_body: "Служебный генератор с намеренно неудобными случаями параметров. Для создания контента не предназначен"
hint_gen_test_odd_header: "Странный (тест)"
hint_gen_test_partial_order_body: "Служебный генератор: проверяет, как раскладываются поля, не упомянутые в подсказке порядка. Для создания контента не предназначен"
hint_gen_test_partial_order_header: "Частичный порядок (тест)"
hint_gen_test_scatter_body: "Служебный генератор для проверки адресуемой случайности. Для создания контента не предназначен"
hint_gen_test_scatter_header: "Разброс (тест)"
hint_gen_test_sections_body: "Служебный генератор, дающий форму из нескольких секций. Для создания контента не предназначен"
hint_gen_test_sections_header: "Секции (тест)"
hint_gen_test_spawn_body: "Служебный генератор для путей создания объектов. Для создания контента не предназначен"
hint_gen_test_spawn_header: "Спавн (тест)"
hint_gen_texture_objects_body: |-
  Превращает изображение в объекты, по одному на ячейку, - картинка становится контентом уровня, который анимируется как всё остальное

  Подробнее: <link="https://bullethero.space/ru/docs/editor/resources/images-and-fonts"><color=#59A6FF>Изображения и шрифты</color></link>
hint_gen_texture_objects_header: "Объекты из текстуры"
hint_level-preview_authors: "Все, кто указан как авторы уровня. Авторство лежит внутри папки уровня, поэтому переживает упаковку, пересылку и перезаливку кем-то другим"
hint_level-preview_licenses_body: |-
  Условия, на которых распространяются уровень и его ресурсы. <b>Условия записаны у каждого ресурса отдельно</b>, поэтому уровень из чужих частей точно говорит, что взято и на каких условиях

  <color=#7FC97F><b>Рекомендация:</b></color> прочитайте их, прежде чем брать что-то из чужого уровня

  Подробнее: <link="https://bullethero.space/ru/docs/editor/rights/licensing-basics"><color=#59A6FF>Лицензии: главное за три минуты</color></link>
hint_level-preview_licenses_header: "Лицензии"
hint_level_backups: "Все автоматические копии этого уровня, свежие сверху - имя файла и есть момент снятия. Пока вы не выберете копию, ничего не читается. Восстановление заменяет файл уровня на диске и перезагружает его, а заменяемый файл сначала уходит в копии, так что восстановление тоже можно откатить"
hint_level_core-framerate: "Прямая правка ускоряет или замедляет все объекты: ключи сохраняют номера кадров, поэтому тот же уровень играет с другой скоростью. Чтобы перенести контент на другую частоту, используйте генератор"
hint_level_core-level-id: "Постоянный идентификатор уровня, созданный один раз при его создании и никогда не редактируемый. Указывайте его в баг-репорте по уровню и используйте, чтобы отличить две копии одного уровня"
hint_level_core-orientation_body: |-
  В какой ориентации держать устройство во время уровня

  <b>Горизонтальная</b> и <b>Вертикальная</b> поворачивают устройство игрока на время уровня и главнее его собственной настройки. На ПК вертикальный уровень играется с полосами по бокам, так и должно быть

  <b>Не задана</b> оставляет выбор игроку, и это ваше <b>утверждение</b>, что уровень читается в <b>обеих</b> ориентациях. Ничего под это не сдвигается и не масштабируется, поэтому сначала проверьте уровень в обеих

  Подробнее: <link="https://bullethero.space/ru/docs/editor/reference/level-settings"><color=#59A6FF>Настройки уровня</color></link>
hint_level_core-orientation_header: "Ориентация уровня"
hint_level_core-runtime-seed: "На чём фактически играет текущая сессия редактора. Если сид выше не задан - это новое число на каждую загрузку уровня. \"Пересоздать\" бросает ещё одно, не трогая уровень"
hint_level_core-seed: "Каждое случайное значение в уровне выводится из этого сида плюс собственного слоя и начального кадра объекта, поэтому один и тот же сид всегда играет одинаково. 0 означает \"без сида\": игра генерирует новый на каждом запуске"
hint_level_core_body: |-
  Длина в кадрах, частота кадров и два сида уровня

  <color=#B48CE0><b>Интересно:</b></color> <b>кадры считаются с 1.</b> В уровне из N кадров есть кадры с 1 по N, а N+1 - конечная граница, а не кадр

  <b>Сид уровня</b> - собственный сид уровня, его правка отменяется. 0 значит "новый сид на каждый прогон" и стоит по умолчанию

  <color=#5EC8C8><b>Подсказка:</b></color> <b>Сид сессии</b> показывает, что выпало этой сессии редактора. <i>Пересоздать</i> выбирает новый только для сессии: ничего не записывается и не попадает в отмену

  Подробнее: <link="https://bullethero.space/ru/docs/editor/basics/frames-and-time"><color=#59A6FF>Кадры, время и длина уровня</color></link>
hint_level_core_header: "Ядро"
hint_level_dangerous_body: |-
  Действия, разрушающие или переписывающие файлы, а не контент

  <color=#E86A5A><b>Внимание:</b></color> выпадающие списки <b>формата файла</b> перезаписывают уровень и его метаданные на диске. Перезапись в другом формате <b>удаляет файл, оставшийся от прежнего</b>. Больше не происходит ничего: ни перезагрузки, ни пересимуляции, ни сброса выделения и стека отмены - модель в памяти и есть ровно то, что записывается

  <color=#E86A5A><b>Внимание:</b></color> <b>Delete</b> удаляет папку уровня с диска. Вот это уже не отменяется

  Подробнее: <link="https://bullethero.space/ru/docs/editor/workflow/not-losing-work"><color=#59A6FF>Не потерять работу</color></link>
hint_level_dangerous_header: "Опасная зона"
hint_level_effect-editor_body: |-
  Соберите эффект частиц и посмотрите его на канве

  <color=#B48CE0><b>Интересно:</b></color> группы параметров те же, что показывает инспектор эффекта, но правятся здесь как <b>черновик</b>: до сохранения в уровень ничего не попадает

  <color=#5EC8C8><b>Подсказка:</b></color> сохраните в общую библиотеку устройства, чтобы переиспользовать эффект между уровнями

  Подробнее: <link="https://bullethero.space/ru/docs/editor/performance/level-budget"><color=#59A6FF>Бюджет уровня</color></link>
hint_level_effect-editor_header: "Редактор эффектов"
hint_level_font-cache: "Какие глифы уровень запекает заранее, чтобы текст не подвисал при первом появлении символа, - по шрифтам и по языкам. Только чтение: заполняет генератор кэша шрифтов по тексту, который в уровне реально есть, здесь ничего не правится"
hint_level_history_body: |-
  Каждая правка за эту сессию - строка здесь, новые сверху, как в git log. Самый левый столбец - основная линия, отдельный столбец - ветка, которую вы оставили, когда отменили правку и пошли другим путём. Кольцо - где вы сейчас, зелёный круг - последнее сохранение

  Клик по строке возвращает уровень ровно в то состояние, по одной операции за кадр. История живёт только в текущей сессии и на диск не пишется

  <color=#E8B04B><b>Предупреждение:</b></color> пока идёт переход, редактор работает только на чтение. Отмена останавливает его на месте, и это всегда настоящее состояние

  Подробнее: <link="https://bullethero.space/ru/docs/editor/reference/level-settings"><color=#59A6FF>Настройки уровня</color></link>
hint_level_history_header: "История"
hint_level_library-browser_body: |-
  Ресурсы, сохранённые на <b>этом устройстве</b> и общие для всех уровней, которые вы здесь открываете

  <color=#B48CE0><b>Интересно:</b></color> импорт копирует ресурс <i>внутрь уровня</i>. Уровень несёт с собой всё, что ему нужно, поэтому библиотека - удобство для вас, а не зависимость для того, кто будет играть в ваш уровень

  Подробнее: <link="https://bullethero.space/ru/docs/editor/workflow/reuse"><color=#59A6FF>Переиспользование: префабы, копирование, генераторы</color></link>
hint_level_library-browser_header: "Библиотека"
hint_level_metadata-logo: "Копируется в папку уровня как <color=#D4B483>logo.png</color> и показывается везде, где уровень в списке. Рассчитано на квадрат <color=#D4B483>512×512</color> в <color=#D4B483>PNG</color> - меньше мылит в списке, больше только занимает место. \"Убрать\" лишь очищает ссылку - сам файл остаётся в папке"
hint_level_metadata-tags_body: |-
  Теги - ваши собственные слова, показываются ровно как написаны и не переводятся. По ним игрок фильтрует в браузере уровней, поэтому тег помогает, только если его используют и другие уровни

  Через запятую. Держите их короткими и общими: жанр, настроение, механика

  Подробнее: <link="https://bullethero.space/ru/docs/editor/reference/level-settings"><color=#59A6FF>Настройки уровня</color></link>
hint_level_metadata-tags_header: "Теги уровня"
hint_level_metadata_body: |-
  Всё об уровне, что не является самим уровнем: имя, описание, логотип, лицензия, возрастной рейтинг и авторы

  <color=#B48CE0><b>Интересно:</b></color> имя и описание - <b>локализованные строки</b>: текст пишется по языкам прямо здесь, без всяких ключей, потому что уровень - это контент, а не часть интерфейса игры. Игроку с языком, который вы не заполнили, покажут первую заполненную запись

  Лицензия и авторы путешествуют вместе с уровнем везде, где им делятся, - именно это сохраняет авторство при перезаливке

  Подробнее: <link="https://bullethero.space/ru/docs/editor/reference/metadata-and-sharing"><color=#59A6FF>Метаданные и как поделиться</color></link>
hint_level_metadata_header: "Метаданные"
hint_level_play-seed: "0 - использовать сид самого уровня либо новый на каждый запуск"
hint_level_play_body: |-
  <color=#B48CE0><b>Интересно:</b></color> параметры запуска <b>только для этого прогона</b> - ничего отсюда не пишется в уровень

  <color=#5EC8C8><b>Подсказка:</b></color> жизни, скорость, чекпоинты и авто-уровень позволяют отрепетировать участок, не правя его. <b>Сид</b> здесь важнее собственного сида уровня: это верхний из трёх уровней приоритета, и именно им повторяют ровно тот прогон, который вы только что видели

  Подробнее: <link="https://bullethero.space/ru/docs/editor/craft/difficulty-curve"><color=#59A6FF>Сложность и кривая</color></link>
hint_level_play_header: "Запуск"
hint_level_raw-add: "Добавляет один элемент в слот, из которого вы это открыли. Здесь предлагаются только собственные простые поля нового элемента. Всё вложенное остаётся со значениями по умолчанию и правится потом в дереве"
hint_level_raw_body: |-
  Вся сохраняемая модель уровня одним деревом полей - сам файл, до всякой обработки редактором

  <color=#E86A5A><b>Внимание:</b></color> <b>здесь ничего не проверяется.</b> Можно записать значение, которое остальной редактор считает невозможным, поэтому держите копию папки уровня под рукой

  Закрашенная точка - вы изменили поле в этой сессии, полая - изменилось что-то внутри него. <b>Применить</b> отправляет всю сессию одной операцией, и её можно отменить

  Подробнее: <link="https://bullethero.space/ru/docs/editor/workflow/not-losing-work"><color=#59A6FF>Не потерять работу</color></link>
hint_level_raw_header: "Сырые данные"
hint_level_resource-meta_body: |-
  Название, описание, источники, лицензия и авторы одного ресурса

  <color=#B48CE0><b>Интересно:</b></color> так сохраняется атрибуция: взятая откуда-то текстура, шрифт или аудиофайл несёт внутри уровня сведения о том, откуда он и на каких условиях, - везде, куда попадёт уровень

  <color=#7FC97F><b>Рекомендация:</b></color> заполняйте это при добавлении ресурса: это единственный момент, когда вы ещё помните

  Подробнее: <link="https://bullethero.space/ru/docs/editor/rights/resource-record"><color=#59A6FF>Карточка ресурса</color></link>
hint_level_resource-meta_header: "Метаданные ресурса"
hint_level_resources-audios: "Аудиофайлы, которые несёт уровень. Сначала добавьте файл здесь, затем поставьте его дорожкой на аудио-таймлайне"
hint_level_resources-effects_body: |-
  Эффекты частиц <color=#D4B483>VFX Graph</color>, которые уровень может размещать. Они <b>необязательны</b>: уровень без них играется ровно так, как задуман

  Эффект использует случайность уровня с сидом, поэтому воспроизводится одинаково на любом устройстве. Эффекты можно экспортировать в общую библиотеку устройства

  Подробнее: <link="https://bullethero.space/ru/docs/editor/performance/level-budget"><color=#59A6FF>Бюджет уровня</color></link>
hint_level_resources-effects_header: "Эффекты"
hint_level_resources-fonts: "Шрифты, которые несёт уровень, для его текстовых объектов. Как и любой другой ресурс, шрифт лежит рядом с уровнем и переносится вместе с ним"
hint_level_resources-prefabs_body: |-
  Переиспользуемые группы объектов. Префаб хранит объекты-шаблон, а каждая установка получает их настоящие копии. Правка шаблона доходит до всех установок, а отдельная установка всё равно может отличаться через переопределения экземпляра

  <color=#E8B04B><b>Предупреждение:</b></color> у префабов <b>нет заготовок от игры</b>, в отличие от тем, эффектов и коллайдеров: перенести префаб в другой уровень можно только через общую библиотеку устройства

  Подробнее: <link="https://bullethero.space/ru/docs/editor/workflow/reuse"><color=#59A6FF>Переиспользование: префабы, копирование, генераторы</color></link>
hint_level_resources-prefabs_header: "Префабы"
hint_level_resources-shapes_body: |-
  Собственные фигуры уровня - вдобавок к примерно 500, которые генерирует игра. Фигура - это <b>настоящая геометрия</b>, вписанная в свой габаритный прямоугольник, поэтому прямоугольник объекта и есть то, что он рисует

  <color=#5EC8C8><b>Подсказка:</b></color> фигура и коллайдер - данные одного вида, и объект ссылается на одно для того, что рисуется, и на другое для того, во что попадают. Одно из другого не выводится, поэтому безобидный луч-предупреждение или невидимая стена - обычный контент

  Подробнее: <link="https://bullethero.space/ru/docs/editor/resources/level-needs"><color=#59A6FF>Что нужно для уровня</color></link>
hint_level_resources-shapes_header: "Фигуры"
hint_level_resources-textures_body: |-
  Изображения, которые несёт уровень. <b>Сама игра не поставляет ни одной текстуры</b> - любая текстура уровня добавлена здесь и лежит в папке уровня, поэтому переносится вместе с ним

  <color=#B48CE0><b>Интересно:</b></color> фигуры - <b>не</b> текстуры. Это настоящая геометрия, и эта вкладка им не нужна

  Подробнее: <link="https://bullethero.space/ru/docs/editor/resources/images-and-fonts"><color=#59A6FF>Изображения и шрифты</color></link>
hint_level_resources-textures_header: "Текстуры"
hint_level_resources-themes_body: |-
  Тема - это <b>палитра, на которую могут ссылаться цвета уровня</b> вместо конкретных значений. Смена активной темы перекрашивает всё, что на неё ссылается, а сама смена ставится ключом на таймлайне событий

  <color=#5EC8C8><b>Подсказка:</b></color> экспортируйте тему в общую библиотеку устройства, чтобы взять её в другие уровни

  Подробнее: <link="https://bullethero.space/ru/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>Цвет, темы и постобработка</color></link>
hint_level_resources-themes_header: "Темы"
hint_level_rules_body: |-
  Что нашла проверка уровня: битые ссылки, повторяющиеся идентификаторы, циклы родительства, слишком глубоко вложенные префабы, пересекающиеся сегменты долей

  Часть находок можно исправить, по одной или кнопкой <b>Исправить всё</b>. Исправления ложатся на черновик: <b>Сохранить</b> применяет их одной операцией, которую можно отменить, <b>Отменить</b> отбрасывает. У находок по графу (идентификаторы, родители, вложенность префабов) исправления нет: это решения о контенте, которые принимаете только вы

  <color=#5EC8C8><b>Подсказка:</b></color> выход отрезка потомка за пределы родителя <b>не</b> считается проблемой. Чтобы подогнать времена жизни, запустите модификатор <color=#D4B483>Подгонка отрезков</color> из "Генераторов"

  Подробнее: <link="https://bullethero.space/ru/docs/editor/workflow/not-losing-work"><color=#59A6FF>Не потерять работу</color></link>
hint_level_rules_header: "Правила"
hint_level_shape-editor_body: |-
  Соберите фигуру из точек и рёбер между ними. <b>Треугольники строятся автоматически и не редактируются</b>, поэтому угол, общий для трёх треугольников, - одна точка для перетаскивания

  <color=#E8B04B><b>Предупреждение:</b></color> формат хранит треугольники, а не рёбра: ребро, не замыкающее контур, при сохранении отбрасывается, и редактор об этом сообщает

  Подробнее: <link="https://bullethero.space/ru/docs/editor/resources/images-and-fonts"><color=#59A6FF>Изображения и шрифты</color></link>
hint_level_shape-editor_header: "Редактор фигур"
hint_level_theme-editor_body: |-
  Слоты, которые предоставляет тема, и заполняющие их цвета

  <color=#E86A5A><b>Внимание:</b></color> на слоты ссылается контент уровня, поэтому <b>их перенумерация перекрашивает всё, что на них ссылается</b>: позиция слота и есть его идентичность

  <color=#5EC8C8><b>Подсказка:</b></color> готовую тему сохраните в общую библиотеку устройства, чтобы переиспользовать в других уровнях

  Подробнее: <link="https://bullethero.space/ru/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>Цвет, темы и постобработка</color></link>
hint_level_theme-editor_header: "Редактор тем"
hint_menu_level-authors: "Кто сделал этот уровень - так, как это записано в его метаданных. Кнопка Авторы открывает полный список со ссылками"
hint_menu_level-bot_body: |-
  <b>Бот проходит уровень за вас вашим же управлением.</b> Он ходит, делает рывок, получает урон и умирает, как и вы, и читерить не может: та же скорость, тот же рывок, тот же хитбокс

  <b>Это не гарантия прохождения.</b> Бот не устаёт, но всё равно проигрывает. И он нагружает устройство на каждом кадре, поэтому на слабом устройстве ждите просадки кадров

  Уровень, который обыграл бота, стоит прислать: заведите issue в <link="https://github.com/bullet-hero/releases/issues"><color=#59A6FF>bullet-hero/releases</color></link>, напишите, какой бот и где проиграл, и приложите папку уровня

  Подробнее: <link="https://bullethero.space/ru/docs/editor/workflow/bot-playtest"><color=#59A6FF>Как бот играет ваш уровень</color></link>
hint_menu_level-bot_header: "Боты"
hint_menu_level-identity: "Что это за уровень на самом деле: источник, в котором он найден, идентификатор, под которым ведётся его статистика, и папка, если она названа не по идентификатору. Встроенный уровень и сделанная вами копия совпадают на этом экране во всём остальном и различаются здесь"
hint_menu_level-lives: "Сколько попаданий переживёт забег. Дзен не заканчивает забег никогда, а Своё берёт любое число с ползунка"
hint_menu_level-music: "Кто написал музыку - так, как это записано в метаданных уровня. Кнопка Лицензии держит все остальные ресурсы, которые уровень несёт с собой"
hint_menu_level-rating: "Возрастной рейтинг, который заявил автор. Разработчики его не проверяют - уровень несёт то, что написал его автор"
hint_menu_level-record: "Ваша история с этим уровнем для выбранных справа условий запуска. Смените жизни, скорость, чекпоинты или бота - и рекорд сменится вместе с ними: забег в других условиях это другое достижение, поэтому у каждого набора свой лучший результат. Попытки и прохождения считаются при любых настройках"
hint_menu_level-seed: "Число, из которого берётся каждое случайное значение уровня. Одинаковый сид даёт одинаковый забег на любом устройстве, а 0 значит, что уровень берёт новый каждый раз"
hint_menu_level-speed: "Насколько быстро идут уровень и его музыка. Своё берёт любую скорость с ползунка, а не только три пресета"
hint_mod_content_remover_body: |-
  Удаляет контент уровня, подходящий под заданные условия

  <color=#E86A5A><b>Внимание:</b></color> он переписывает существующее, а не добавляет, поэтому сначала прочитайте параметры: шаг отмены один, и он же единственный путь назад

  Подробнее: <link="https://bullethero.space/ru/docs/editor/workflow/reuse"><color=#59A6FF>Переиспользование: префабы, копирование, генераторы</color></link>
hint_mod_content_remover_header: "Удаление контента"
hint_mod_framerate_remap_body: |-
  Пересчитывает все номера кадров под другую частоту, чтобы тайминги остались на тех же секундах

  <color=#E8B04B><b>Предупреждение:</b></color> кадры целые, поэтому всё, что не делится нацело, округляется: уровень, пересчитанный дважды, не обязан вернуться в исходное состояние

  Подробнее: <link="https://bullethero.space/ru/docs/editor/basics/frames-and-time"><color=#59A6FF>Кадры, время и длина уровня</color></link>
hint_mod_framerate_remap_header: "Пересчёт частоты кадров"
hint_mod_prefab_flatten_body: |-
  Превращает каждую установку префаба в этой области в обычные объекты. Связь с шаблоном пропадает, объекты остаются ровно там, где были

  <color=#B48CE0><b>Интересно:</b></color> уровень выглядит так же, как до запуска - ничего не удаляется и не сдвигается, а правки отдельных установок уже записаны в сами объекты. Шаблоны остаются в уровне, если не попросить их удалить

  Подробнее: <link="https://bullethero.space/ru/docs/editor/reference/modifiers"><color=#59A6FF>Модификаторы</color></link>
hint_mod_prefab_flatten_header: "Сплющивание префабов"
hint_mod_quantize_keyframes_body: |-
  Притягивает ключи к регулярному шагу - так расхлябанная ручная анимация садится на долю

  <color=#E8B04B><b>Предупреждение:</b></color> два ключа, попавшие на один кадр, схлопываются в один, поэтому грубое квантование теряет детали, а не сжимает их

  Подробнее: <link="https://bullethero.space/ru/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>Ритм и структура</color></link>
hint_mod_quantize_keyframes_header: "Квантование ключей"
hint_mod_span_fit_body: |-
  Приводит времена жизни потомков внутрь родительских: либо вжимает потомков, либо растягивает родителей

  <color=#B48CE0><b>Интересно:</b></color> выход за пределы родителя - легальные данные, которые просто играют обрезанными, поэтому это решение о контенте, а не починка: сам по себе он не запускается. Якоря не трогаются в обоих случаях

  Подробнее: <link="https://bullethero.space/ru/docs/editor/basics/frames-and-time"><color=#59A6FF>Кадры, время и длина уровня</color></link>
hint_mod_span_fit_header: "Подгонка отрезков"
hint_mod_span_stagger_body: |-
  Смещает выделение во времени, чтобы объекты, начинавшиеся вместе, приходили один за другим

  Подробнее: <link="https://bullethero.space/ru/docs/editor/workflow/reuse"><color=#59A6FF>Переиспользование: префабы, копирование, генераторы</color></link>
hint_mod_span_stagger_header: "Каскад"
hint_mod_test_rename_body: "Служебный генератор для путей переименования. Для создания контента не предназначен"
hint_mod_test_rename_header: "Переименование (тест)"
hint_settings_audio: "Общая громкость, громкость уровня в игре и в редакторе, и звуков интерфейса вне и внутри редактора уровней"
hint_settings_audio-editor-game: "Громкость того, что играет уровень внутри редактора: тот же уровень тем же путём, но слушают его часами, а не один раз, поэтому громкость игры остаётся нетронутой"
hint_settings_audio-editor-ui: "Громкость звуков самого редактора уровней. Он озвучивает только исход правки: сохранение, отказ, отмену, удаление, но никогда обычное нажатие"
hint_settings_audio-game: "Громкость того, что играет уровень: его музыки и звуков"
hint_settings_audio-ui: "Громкость интерфейса вне редактора уровней: меню, браузеров, настроек"
hint_settings_audio-volume: "Общая громкость. Все остальные масштабируются от неё"
hint_settings_controls_body: |-
  Как вы управляете игроком, по видам устройств: клавиатура с мышью, сенсорный экран, геймпад и гироскоп устройства

  <color=#B48CE0><b>Интересно:</b></color> активными могут быть сразу несколько видов, и список <b>приоритета</b> решает, чей ввод побеждает, - это важно на ноутбуке с подключённым контроллером

  <color=#5EC8C8><b>Подсказка:</b></color> сводка сверху показывает, что активно <i>прямо сейчас</i>, поэтому схема управления, которая будто ничего не делает, обычно просто проиграла в приоритете

  Подробнее: <link="https://bullethero.space/ru/docs/editor/workflow/speed-and-shortcuts"><color=#59A6FF>Скорость и горячие клавиши</color></link>
hint_settings_controls_header: "Управление"
hint_settings_game-editor-autosave: "Писать копию уровня по таймеру. Ваш сохранённый уровень она не перезаписывает: копии - это страховка, а не сохранение"
hint_settings_game-editor-autosave-rate: "Сколько секунд между автоматическими копиями"
hint_settings_game-editor-camera-invert: "Тянет ли перетаскивание уровень за курсором или, наоборот, двигает камеру. Каждый вариант кому-то кажется правильным"
hint_settings_game-editor-camera-max-size: "Насколько далеко можно отдалить вьюпорт редактора"
hint_settings_game-editor-camera-min-size: "Насколько близко можно приблизить вьюпорт редактора"
hint_settings_game-editor-camera-sensitivity-x: "Насколько далеко уезжает вид по горизонтали на единицу движения курсора"
hint_settings_game-editor-camera-sensitivity-y: "Насколько далеко уезжает вид по вертикали на единицу движения курсора"
hint_settings_game-editor-camera-wheel-multiplier: "Насколько сильно зумит одно деление колеса"
hint_settings_game-editor-camera-zoom-to-mouse: "Зумить к курсору, а не к центру вьюпорта. Выключено - центр остаётся на месте"
hint_settings_game-editor-create-shape-size-x: "Ширина, с которой создаётся новая фигура, до её собственного масштаба"
hint_settings_game-editor-create-shape-size-y: "Высота, с которой создаётся новая фигура, до её собственного масштаба"
hint_settings_game-editor-create-text-size-x: "Ширина блока, в котором новый текст раскладывает символы, а не размер самих символов"
hint_settings_game-editor-create-text-size-y: "Высота блока, в котором новый текст раскладывает символы, примерно строка на единицу"
hint_settings_game-editor-effects-active-default: "Показывать ли пост-обработку уровня сразу при открытии редактора. Это только стартовое состояние - выключение эффектов во время работы его не меняет. На телефоне они по умолчанию выключены: пост-обработка - самое дорогое, что рисует редактор"
hint_settings_game-editor-gizmos-scale: "Насколько крупными рисуются ручки перетаскивания во вьюпорте. Ручка под мышь плохо ловится пальцем"
hint_settings_game-editor-grid-active-default: "Включена ли сетка вьюпорта сразу при открытии редактора. Это только стартовое состояние - выключение сетки во время работы его не меняет"
hint_settings_game-editor-grid-opacity: "Насколько сетка заметна. Слишком бледную, чтобы её читать, не рисуют вовсе"
hint_settings_game-editor-grid-size: "Шаг сетки во вьюпорте, в единицах уровня"
hint_settings_game-editor-history-length: "Сколько шагов редактирования хранит сессия, прежде чем самая старая ветка будет удалена. Больше стоит только памяти"
hint_settings_game-editor-history-objects: "Сколько объектов история хранит сверх этого счётчика шагов. Одно массовое удаление - это один шаг с 50 000 объектов внутри, его этот лимит и ловит. 0 убирает ограничение, меньше нуля - решает устройство"
hint_settings_game-editor-interface-dirty-field-delay: "Сколько поле инспектора ждёт после последнего нажатия, прежде чем применить значение. Ноль применяет каждое нажатие и делает каждое отменяемым"
hint_settings_game-editor-interface-log-clamps: "Сообщать в консоль, когда введённое значение было возвращено в допустимый диапазон. Ограничение применяется в любом случае"
hint_settings_game-editor-interface-rotation-unit: "В каких единицах показываются и вводятся углы. Хранятся углы всё равно в радианах"
hint_settings_game-editor-level-serialize-mode: "Формат, в котором пишется уровень. <b><color=#D4B483>Json</color></b> текстовый - читается и чинится руками. <b><color=#D4B483>Blob</color></b> бинарный - грузится в десятки раз быстрее, но повреждённый почти не чинится"
hint_settings_game-editor-max-autosave-files: "Сколько копий хранится. При достижении предела самая старая удаляется"
hint_settings_game-editor-multi-select-requires-hold: "Требует ли добавление к выделению осознанного удержания. Включено безопаснее на тач-экране, где иначе случайный тап меняет выделение"
hint_settings_game-editor-pick-invisible-aabb: "Разрешать клику выделять объект, который ничего не рисует. Нужно для невидимых стен: у них есть хитбокс и нет фигуры"
hint_settings_game-editor-player-active-default: "Стоит ли тестовый игрок в уровне сразу при открытии редактора. На тач-экране он забирает вьюпорт, поэтому на телефоне обычно выключают"
hint_settings_game-editor-player-bot: "Отдаёт пробного игрока <color=#D4B483>Reflex Bot v1</color> вместо вас. Здесь предлагается только он: ему ничего не нужно готовить заранее, и он продолжает работать, пока вы правите уровень - на любой скорости проигрывания, включая обратную. Играет по тем же правилам, что и вы: получает урон и может оказаться в тупике. Сразу после перемотки ненадолго играет хуже, пока восстанавливает знание о будущем. Выбор между ботами - дело запуска, на вкладке Играть этого экрана"
hint_settings_game-editor-player-bot-debug: "Общий выключатель отладочных наложений бота. По умолчанию выключен, а всё под ним включено - открыв его, вы сразу видите всю картину"
hint_settings_game-editor-player-bot-debug-grid: "Рисует, сколько места, по мнению бота, есть в каждой части экрана - по худшему случаю за всё, что он видит впереди. Красное - место, где он ждёт попадания. Там, где он считает себя в безопасности, не рисуется ничего"
hint_settings_game-editor-player-bot-debug-reach: "Рисует, как далеко бот считает возможным добраться до конца окна, которое он планирует: внутренний круг - шагом, внешний - рывком. Цель вне них он не выбирает никогда"
hint_settings_game-editor-player-bot-debug-target: "Рисует точку, к которой бот сейчас идёт. Он держится выбора, пока не появится заметно лучший, поэтому неподвижная цель означает, что бот доволен, а не застрял"
hint_settings_game-editor-player-reset-gizmos: "Сбрасывать режим гизмо при включении тестового игрока, чтобы ручка перетаскивания не осталась под пальцем"
hint_settings_game-editor-preview-collider-on-select: "Показывать хитбокс выделенного объекта. Здесь то, что рисуется, и то, во что попадают, - разные вещи, поэтому они могут не совпадать"
hint_settings_game-editor-resources-serialize-mode: "Тот же выбор для ресурсов, которые несёт уровень"
hint_settings_game-editor-selection-collider-opacity: "Насколько плотно рисуется хитбокс выделенного объекта"
hint_settings_game-editor-selection-collider-opacity-view: "То же для режима, показывающего все хитбоксы сразу: бледнее, потому что там их сотни и они перекрываются"
hint_settings_game-editor-selection-long-press-delay: "Сколько держать строку или клип, чтобы войти в мультивыделение. Увеличьте, если выделение срабатывает случайно"
hint_settings_game-editor-selection-long-press-threshold: "Насколько курсор может сместиться за время удержания, прежде чем это станет перетаскиванием. Увеличьте при неустойчивой руке"
hint_settings_game-editor-timeline-edge-handle: "Ширина края клипа, за который он растягивается. За остальную часть клип двигается целиком"
hint_settings_game-editor-timeline-loop-global: "Возвращается ли ползунок в начало по достижении конца уровня вместо остановки"
hint_settings_game-editor-timeline-loop-local: "То же для локального таймлайна, который повторяет время жизни одного объекта"
hint_settings_game-editor-timeline-snap-threshold: "Насколько близко должен оказаться перетаскиваемый край, чтобы примагнититься к кадру"
hint_settings_game-editor-timeline-time-format: "В чём считают линейка таймлайна и указатель воспроизведения. В уровне не меняется ничего - адресуется тот же кадр. Такты и доли читают сетку долей самого уровня и переходят на таймкод там, где сегмента сетки нет"
hint_settings_game-editor_body: |-
  <b>Автосохранение</b> сохраняет уровень по таймеру и каждый раз пишет резервную копию. <b>Максимальное количество автосохранений</b> ограничивает число копий

  <b>Минимальный</b> и <b>Максимальный размер камеры редактора</b> ограничивают зум вьюпорта. <b>Мультивыбор требует удержания</b> и <b>Выбирать невидимое по рамке</b> меняют смысл клика во вьюпорте

  <b>Формат уровня</b> и <b>Формат ресурсов</b> задают формат записи на диск по умолчанию

  Подробнее: <link="https://bullethero.space/ru/docs/editor/workflow/speed-and-shortcuts"><color=#59A6FF>Скорость и горячие клавиши</color></link>
hint_settings_game-editor_header: "Редактор уровней"
hint_settings_general: "Язык и то, сколько ресурсов игра грузит одновременно. Пустой <b>язык</b> означает \"как на устройстве\""
hint_settings_general-language: "Язык интерфейса. Пустое значение - как на устройстве. На собственный текст уровня не влияет: его уровень несёт сам"
hint_settings_general-resource-parallel-load-count: "Сколько файлов уровня грузится одновременно. Больше - быстрее на быстром диске и возможные подтормаживания на медленном"
hint_settings_general-resource-web-timeout: "Сколько секунд ждать файл, который тянется по сети, прежде чем сдаться"
hint_settings_general-show-all-found-content: "Показывать и тот контент, который источник нашёл, но не может подтвердить как ваш - файлы отписанного предмета мастерской или папку, положенную вручную. Такие уровни помечаются на карточке. Выключено - источник показывает только то, за что ручается"
hint_settings_graphics-antialiasing-hdr: "Значения цвета выше 1. Здесь они не нужны ничему, а пропускную способность памяти удваивают, поэтому выключено"
hint_settings_graphics-antialiasing-msaa: "Сколько выборок <color=#D4B483>MSAA</color> берёт на пиксель. Больше - глаже и дороже, причём цена растёт вместе с наложением прозрачного контента"
hint_settings_graphics-antialiasing-type: "Как сглаживаются края. <b><color=#D4B483>MSAA</color></b> разрешает их точно, потому что каждая фигура здесь - настоящая геометрия. <b><color=#D4B483>FXAA</color></b> стоит один проход независимо от сцены - это компромисс для слабого телефона"
hint_settings_graphics-audio-pitch-correction: "Насколько сильно скорость звука подгибается, чтобы догнать симуляцию. Больше - быстрее исправляется и заметнее на слух"
hint_settings_graphics-audio-render: "Рисовать волновую форму звука на таймлайне редактора. Выключение экономит работу на длинных треках"
hint_settings_graphics-audio-render-effects: "Применять эффекты дорожки во время редактирования. Выключено - слышен исходный клип"
hint_settings_graphics-audio-resync-jump-time: "Насколько звук и симуляция могут разойтись, прежде чем звук перепрыгнет на место вместо плавной подгонки"
hint_settings_graphics-audio-scrub-time: "Какой длины фрагмент слышно, когда вы тащите плейхед по треку"
hint_settings_graphics-audio-sync-dead-zone: "Расхождение меньше этого игнорируется. Без мёртвой зоны звук правился бы постоянно и на слух"
hint_settings_graphics-audio-use-scrub: "Проигрывать звук под плейхедом во время перетаскивания, чтобы искать момент на слух"
hint_settings_graphics-avatar-render: "Тело аватара - сетка из 64 квадратов, и потеря здоровья выбивает их от края внутрь вдоль нескольких разломов, так что плохо идущий забег видно по самому игроку, а не по полоске. Сквозь дыры проступает кольцо хитбокса под телом. Выключено - сетка становится одним квадратом, а здоровье просто гасит его прозрачностью: то же самое чтение, один объект вместо 64, для устройства, которому лишние рисовать не хочется"
hint_settings_graphics-effects-fixed-framerate: "Частота, с которой эффекты симулируются, независимо от того, как часто их рисуют"
hint_settings_graphics-effects-frame-step-budget: "Сколько шагов эффектов можно потратить за один кадр, чтобы догон никогда не стоил заметного зависания"
hint_settings_graphics-effects-framerate-target: "Как часто рисуются эффекты. Ниже частоты самой игры - дешёвая экономия: частицы нормально читаются и с более грубым шагом"
hint_settings_graphics-effects-max-scrub-time: "Сколько истории эффектов редактор проигрывает заново при прыжке плейхеда. Дольше - точнее и медленнее"
hint_settings_graphics-effects-render: "Рисовать эффекты частиц вообще. Они обогащают уровень, но ни один уровень от них не зависит, поэтому этим можно жертвовать без потерь"
hint_settings_graphics-effects-replay-step-budget: "Сколько шагов симуляции может потратить один пересчёт. Ограничение не даёт прыжку в плотный участок заморозить редактор"
hint_settings_graphics-fixed-framerate: "Предел, который игра держит, пока Тип целевой частоты кадров - Фиксированная. Это только частота перерисовки экрана. Уровень симулируется по реальному времени, поэтому один и тот же забег идёт одинаково и на 30, и на 144. Игнорируется при включённой вертикальной синхронизации"
hint_settings_graphics-framerate-target: "Сколько кадров в секунду игра держит. Задаётся напрямую, а не через вертикальную синхронизацию"
hint_settings_graphics-postprocessing-render: "Общий выключатель для всех эффектов камеры ниже. Выключено - весь стек пропускается"
hint_settings_graphics-postprocessing-render-analog-glitch: "Аналоговые помехи: плывущие полосы, рваные строки, растекание цвета"
hint_settings_graphics-postprocessing-render-bloom: "Яркие области подсвечивают то, что вокруг них"
hint_settings_graphics-postprocessing-render-chroma: "Цветовые каналы расходятся к краям экрана, как у дешёвой линзы"
hint_settings_graphics-postprocessing-render-color-curves: "Кривые цвета по каналам, для тонкой цветокоррекции"
hint_settings_graphics-postprocessing-render-digital-glitch: "Цифровое повреждение: смещённые блоки, как будто кадры побиты"
hint_settings_graphics-postprocessing-render-grain: "Плёночное зерно поверх изображения"
hint_settings_graphics-postprocessing-render-lens: "Изображение искривляется так, как искривила бы настоящая линза"
hint_settings_graphics-postprocessing-render-lift-gamma-gain: "Цветокоррекция по трём зонам: тени, средние тона и света"
hint_settings_graphics-postprocessing-render-motion-blur: "Быстрое движение смазывается. Стоит выключить, если из-за этого хуже читаются пули"
hint_settings_graphics-postprocessing-render-shadows-midtones-highlights: "Те же три зоны, но подкрашиваемые по отдельности, а не сдвигаемые"
hint_settings_graphics-postprocessing-render-vignette: "Края экрана темнеют, стягивая внимание к центру"
hint_settings_graphics-postprocessing-render-white-balance: "Сдвигает то, что считается белым, делая всю картинку теплее или холоднее"
hint_settings_graphics-render-scale: |-
  Сколько пикселей игра рисует сама, прежде чем результат масштабируется в окно

  Ниже 1 игра рисует меньше пикселей и растягивает их - самое действенное, что можно снизить на слабой машине, потому что стоимость фрагментов падает <b>квадратично</b>. Выше 1 рисует крупнее и ужимает результат - это суперсэмплинг

  Интерфейс в любом случае рисуется в свою полноразмерную цель, поэтому текст и кнопки остаются резкими при любом значении. Число умножается на масштаб, с которым и так поставляется этот класс устройств, а не заменяет его
hint_settings_graphics-resolution: |-
  Размер окна игры в пикселях, из режимов, которые монитор действительно сообщает - поэтому запросить неподдерживаемый режим отсюда нельзя

  Это же способ сменить ориентацию на ПК: разрешение выше, чем шире, переводит интерфейс в ту же вертикальную раскладку, что и телефон, поставленный стоймя. Монитор нельзя повернуть изнутри игры, так что это и размер окна - единственные рычаги

  Если не трогать, берётся собственное разрешение экрана
hint_settings_graphics-textures-compression: "Упаковывает картинки в <color=#D4B483>сжатый</color> формат при загрузке. В четыре-восемь раз меньше памяти и блочные артефакты там, где градиент или резкий край попадает в блок 4x4. Читается при загрузке уровня, а не пока уровень открыт"
hint_settings_graphics-textures-compression-quality: "Время загрузки против артефактов сжатия. Размер картинки от этого не меняется, а телефоны настройку игнорируют"
hint_settings_graphics-textures-filtering: "Как картинки сэмплируются при отрисовке, и только это - уменьшение картинки решается тем, что о ней сказал автор, а не этой настройкой"
hint_settings_graphics-textures-mipmaps: "Уменьшенные копии каждой картинки, чтобы нарисованная мелко перестала мерцать при движении. На треть больше памяти, и другого лекарства от мерцания нет"
hint_settings_graphics-textures-size-limit: "Предел того, насколько большой может быть картинка в памяти этого устройства. Память падает как квадрат стороны, поэтому здесь экономится больше, чем на сжатии, и только этот пункт вообще ограничивает цену уровня"
hint_settings_graphics-vsync: |-
  Ждать ли игре обновления экрана перед показом кадра

  <b>Выключена</b> - кадр показывается сразу, как готов. Ничего не ждёт, поэтому ввод доходит до экрана при первой возможности, но кадр, дорисованный посреди обновления, ложится поверх половины предыдущего - это и есть разрывы

  <b>Включена</b> - один кадр на обновление: разрывов нет, каждый кадр стоит до одного обновления лишней задержки. <b>Половина частоты</b> - один кадр на каждое второе обновление, ровнее на машине, которая не тянет полную частоту, но задержка вдвое больше

  Пока значение не Выключена, Unity полностью игнорирует ограничение частоты выше, поэтому те две строки погашены

  Телефон показывает кадры по своему расписанию, там это ничего не делает
hint_settings_graphics-window-mode: |-
  Как окно игры занимает экран

  <b>Оконный</b> - единственный режим со свободным изменением размера, а именно размер меняет пропорции игры: растяни окно выше, чем шире, и весь интерфейс перейдёт в вертикальную раскладку, ровно как поставленный стоймя телефон

  <b>Окно без рамки</b> - по умолчанию: экран заполнен, без переключения режима и с мгновенным alt-tab. <b>Монопольный полноэкранный</b> отдаёт экран игре целиком - чуть быстрее и дольше выходить

  У телефона одно окно, и это экран, поэтому там настройка ничего не делает
hint_settings_graphics_body: |-
  <b>Сглаживание.</b> <color=#D4B483>MSAA</color> стоит по умолчанию, потому что каждая фигура в этой игре - настоящая геометрия, а значит любой ступенчатый край является настоящим геометрическим краем. Это ровно тот случай, который мультисэмплинг разрешает точно и без замыливания на всех платформах. <b><color=#D4B483>FXAA</color></b> - альтернатива для слабых телефонов: он стоит один полноэкранный проход независимо от перерисовки, тогда как цена <color=#D4B483>MSAA</color> растёт вместе с прозрачной перерисовкой. <b>TAA намеренно не предлагается</b>: шлейф за быстрыми пулями в этом жанре - проблема читаемости, а его дрожание конфликтует с эффектами глитча

  <b>Частота кадров.</b> Целевая применяется вручную, а не через вертикальную синхронизацию. Фиксированная частота отвязывает симуляцию от дисплея - именно это сохраняет тайминг уровня одинаковым на экране 60 и 144 Гц

  <color=#7FC97F><b>Рекомендация:</b></color> <b>Масштаб рендера</b> ниже 1 - самое дешёвое, чем стоит пожертвовать на слабом устройстве: он стоит резкости и больше ничего

  Подробнее: <link="https://bullethero.space/ru/docs/editor/performance/mobile-devices"><color=#59A6FF>Мобильные устройства</color></link>
hint_settings_graphics_header: "Графика"
hint_settings_interface: "Оверлей статистики и его положение. Он рисуется поверх любого экрана и нужен для диагностики производительности, а не для игры"
hint_settings_interface-alert-on-exception: "Поднимать ли окно отчёта при непойманной ошибке. Отчёт собирается, пишется в лог и сохраняется в любом случае - настройка решает лишь, прерывают ли вас, а это важнее всего посреди забега. Если выключено, последний отчёт всё равно есть в логе игры и под кнопкой <b>Сохранить отчёт</b> в папке отчётов"
hint_settings_interface-hitbox-ring-opacity: "Кольцо из точек на аватаре нарисовано ровно по радиусу столкновения, а он 0.4 против тела шириной 1 - силуэт никогда не был хитбоксом, и теперь видно, где хитбокс на самом деле. Это же кольцо считает жизни: горящая точка - жизнь в запасе, потухшая - потраченная. Ползунок отвечает только за то, насколько оно заметно поверх того, что рисует уровень, а 0 выключает его целиком - уровни сбалансированы под того, кто его видит"
hint_settings_interface-menu-background: "Во что меню играет за кнопками. Bot - настоящая арена: тот же reflex-бот, которому можно отдать забег, уклоняется от препятствий, пока вы сидите в меню, и попадание ничего не меняет. Shapes - прежнее поле вращающихся фигур и самый тяжёлый из трёх вариантов. None не рисует ничего"
hint_settings_interface-open-menu-on-lose: "Что происходит при поражении. Выключено - уровень плавно останавливается, отматывается к последней достигнутой контрольной точке и плавно разгоняется обратно, без единого окна. Включено - воспроизведение останавливается и открывается окно результата"
hint_settings_interface-screen-orientation: |-
  <b>Горизонтально</b> и <b>Вертикально</b> закрепляют <b>ось</b>, а не сторону - переверни устройство, и картинка перевернётся вместе с ним, так что играется в любом положении

  <b>Автоповорот</b> не закрепляет ничего: экран следует за устройством. С уровнем, который не задаёт свою ориентацию, телефон можно крутить прямо посреди забега - интерфейс и камера подстроятся

  Уровень может перебить эту настройку, пока идёт. Его автор собирал контент под кадр определённой формы, поэтому его выбор главнее на всё время уровня, а после выхода настройка возвращается

  На ПК монитор не поворачивается, поэтому поле выключено и просто показывает форму окна - измени размер окна, и оно изменится
hint_settings_interface-show-game-interface: "Общий выключатель над двумя настройками выше и над экранными сенсорными контролами вместе с ними. Выключено - игровой экран не рисует вообще ничего, что и нужно для чистой записи или скриншота. Ничего не перестаёт работать: каждый контрол остаётся там же и по-прежнему принимает нажатие"
hint_settings_interface-show-game-pause: "Рисуется ли значок паузы. Он скрывается, а не убирается: тот же угол по-прежнему принимает нажатие, а Escape или Back на геймпаде открывают паузу при любом значении"
hint_settings_interface-show-game-progress: "Рисуется ли полоса прогресса забега внизу игрового экрана. Скрытие не меняет больше ничего - контрольные точки, которые она отмечает, продолжают работать"
hint_settings_interface-stats-active: "Показывать диагностическую сводку поверх любого экрана. Она для замеров производительности, а не для игры"
hint_settings_interface-stats-alignment-x: "Где сводка стоит по горизонтали: 0 - левый край, 1 - правый"
hint_settings_interface-stats-alignment-y: "Где сводка стоит по вертикали: 0 - верхний край, 1 - нижний"
hint_settings_other: "<b>Сброс</b> возвращает все настройки на всех вкладках к значениям по умолчанию. Он трогает только настройки: ваши уровни - это файлы на диске, их он не затрагивает"
hint_settings_profile: "Всё, что это устройство помнит о том, как в игру играли и что в ней собирали. Данные локальные: никуда не отправляются, а файлы под ними лежат рядом с уровнями в папке, которую можно открыть и прочитать. Время считается в реальных секундах, а не во времени уровня, поэтому замедление у чекпоинта и забег на половинной скорости учитываются столько, сколько шли на самом деле. Строка устройств измеряет, какое из четырёх вело аватара во время игры, а не просто было подключено"
hint_settings_suppress-game-saves_body: |-
  Пока режим включён, игра не сохраняет ничего своего: <color=#D4B483>settings.json</color>, общая статистика и статистика каждого уровня остаются на диске как есть. Изменённая настройка всё равно работает до закрытия игры

  Работа с уровнями сохраняется как обычно - сохранение, экспорт, импорт, копирование и удаление уровней, а также автосохранение и резервные копии редактора, у которых свой переключатель

  Режим действует до закрытия игры и нигде не запоминается. Если выключить его, текущие настройки сохранятся, а всё сыгранное за это время будет отброшено

  <color=#B48CE0><b>Интересно:</b></color> режим включается и сам. Аргумент запуска <color=#D4B483>--suppress-game-saves</color> включает его на весь запуск, и выключить его из игры нельзя. Настройки или статистика, сохранённые более новой версией игры, тоже включают его, и тогда игра на каждом запуске спрашивает, оставить их или перезаписать значениями по умолчанию
