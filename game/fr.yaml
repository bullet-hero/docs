settings_interface-alert-on-exception_tooltip: "Activé, une erreur non interceptée ouvre la fenêtre de rapport par-dessus ce qui est à l'écran. Désactivé, elle est seulement écrite dans le journal - le rapport est créé dans tous les cas"
settings_interface-menu-background_tooltip: "Ce que le menu principal dessine derrière ses boutons. Bot est une arène en direct où joue le bot réflexe, Formes est un champ de formes qui tournent, Aucun ne dessine rien"
settings_interface-open-menu-on-lose_tooltip: "Désactivé, une partie perdue revient d'elle-même au dernier checkpoint atteint. Activé, la lecture s'arrête et la fenêtre de résultat s'ouvre à la place"
settings_interface-screen-orientation_tooltip: "Le sens dans lequel l'appareil est tenu. Horizontal et Vertical verrouillent un axe plutôt qu'un côté, donc retourner l'appareil n'interrompt pas la partie. Sur ordinateur, ce champ indique plutôt la forme de la fenêtre"
