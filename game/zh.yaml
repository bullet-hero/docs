settings_graphics-antialiasing-hdr_tooltip: "渲染到HDR目标。默认在所有平台上关闭：这款游戏绘制的内容都不需要大于1的数值，而HDR会让本已被抗锯齿成倍放大的带宽再翻一倍"
settings_graphics-antialiasing-msaa_tooltip: "MSAA对每个像素的采样数。仅在“类型”为MSAA时生效。数值越高越清晰，透明形状重叠越多开销越大，因为混合是逐采样计算的。手机应保持在x2，桌面端可以承受x4"
settings_graphics-antialiasing-type_tooltip: "边缘如何平滑。MSAA是默认选项，也最适合这款游戏的内容：每个形状都是真实几何体，所以它只处理真正有锯齿的地方，不会柔化其他任何东西。FXAA无论关卡过度绘制多少，开销都只是一次全屏处理，这是在性能弱的设备上选择它的唯一理由。它会让细轮廓变模糊"
settings_graphics-antialiasing_hdr: "HDR"
settings_graphics-antialiasing_msaa: "MSAA采样数"
settings_graphics-antialiasing_type: "类型"
settings_graphics-audio-pitch_correction: "音高校正"
settings_graphics-audio-resync-jump_time: "重同步跳转时间"
settings_graphics-audio-sync-dead_zone: "同步死区"
settings_graphics-effects-frame-step_budget: "每帧步进预算"
settings_graphics-effects-replay-step_budget: "回放步进预算"
settings_graphics-render-scale_tooltip: "游戏在缩放到窗口之前渲染的像素数量。界面无论如何都以完整尺寸绘制。会与此类设备自带的缩放倍数相乘。仅限桌面端"
settings_graphics-resolution_tooltip: "游戏窗口的像素尺寸，可选值来自此显示器报告的模式。高度大于宽度的分辨率会让整个界面切换到竖屏布局。仅限桌面端"
settings_graphics-textures-compression-quality_tooltip: "此设备压缩一张图像所花的时间。无论如何，结果的大小和格式都相同，取舍的只是加载时间与渐变和硬边缘上的块状瑕疵。“自动”会对除照片以外的所有图像使用精细编码器。在手机上无效，手机的编码器不支持此设置"
settings_graphics-textures-compression_tooltip: "加载时把关卡的图像打包为压缩格式。每张图像占用的内存减少到四分之一至八分之一，代价是渐变和硬边缘上会出现块状瑕疵。“自动”在内存紧张的手机上压缩，在桌面端保留完整图像。在关卡加载时读取，因此从你打开的下一个关卡开始生效"
settings_graphics-textures-filtering_tooltip: "绘制关卡图像时如何采样。开启Mip贴图时，“自动”会在Mip层级之间混合，消除层级交替处的接缝。“点”让所有内容都呈现硬边纹素，它不改变图像缩小的方式，只改变绘制方式。作者标记为像素画的图像始终使用点采样"
settings_graphics-textures-mipmaps_tooltip: "为每张图像生成缩小的副本，使缩小绘制的图像在移动时不闪烁。多占用三分之一的内存。作者标记为像素画的图像不会生成这些副本"
settings_graphics-textures-size-limit_tooltip: "图像在此设备内存中允许的最大边长。更大的图像会在加载时缩小，磁盘上的文件不会被改动。内存随边长的平方下降，所以降低一档比压缩更省内存。“自动”在手机上为2048，在桌面端为4096"
settings_graphics-textures_compression: "压缩"
settings_graphics-textures_compression-quality: "压缩质量"
settings_graphics-textures_filtering: "过滤"
settings_graphics-textures_mipmaps: "Mip贴图"
settings_graphics-textures_size-limit: "尺寸上限"
