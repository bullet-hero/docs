editor_publish-rule-detail_collection-license-unspecified: "Die Sammlung hat keine eigene Lizenz, also weiß niemand, was mit ihrem Inhalt erlaubt ist. Wähle eine auf der Karte der Sammlung, CC BY 4.0 ist die übliche Wahl"
editor_publish-rule-detail_collection-media-missing: "{0} \"{1}\" verweist auf die Datei {2}, und diese Datei ist nicht im Ordner der Sammlung. Lege die Datei zurück oder entferne die Ressource"
editor_publish-rule-detail_collection-name-missing: "Die Sammlung hat keinen Namen. Lege einen auf der Karte der Sammlung fest"
editor_publish-rule-detail_collection-reference-missing: "{2} \"{3}\" nutzt {0} {1}, das diese Sammlung nicht enthält. Füge es der Sammlung hinzu, sonst fehlt es in jedem Level, das sie importiert"
editor_publish-rule-detail_data-file-too-large: "{0} ist {1} groß, die Grenze für eine Datendatei ist {2}. Meist bedeutet das zu viele Objekte oder Keyframes"
editor_publish-rule-detail_level-age-rating-missing: "Das Level hat keine Altersfreigabe. Lege sie in Leveleinstellungen, Metadaten fest"
editor_publish-rule-detail_level-authors-missing: "Das Level nennt niemanden. Trage dich in Leveleinstellungen, Metadaten, Autoren ein"
editor_publish-rule-detail_level-license-not-allowed: "Das Level steht unter der Lizenz {0}. Dieser Dienst akzeptiert: {1}. Ändere die Lizenz in Leveleinstellungen, Metadaten"
editor_publish-rule-detail_level-license-not-allowed-bare: "Das Level hat keine eigene Lizenz. Wähle eine in Leveleinstellungen, Metadaten"
editor_publish-rule-detail_level-license-omits-non-commercial: "{0} \"{1}\" steht unter der Lizenz {2}, daher darf niemand dieses Level kommerziell nutzen, egal was seine eigene Lizenz sagt. Erwäge eine nicht-kommerzielle Lizenz für das Level"
editor_publish-rule-detail_level-license-share-alike-mismatch: "{0} \"{1}\" steht unter der Lizenz {2}, daher muss das Level dieselben Bedingungen tragen: {3}. Ändere die Lizenz in Leveleinstellungen, Metadaten, oder ersetze die Ressource"
editor_publish-rule-detail_payload-too-large: "Alles zusammen ist {0} groß, die Grenze ist {1}. Komprimiere Audio oder Texturen oder entferne Ungenutztes"
