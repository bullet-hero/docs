settings_graphics-antialiasing-hdr_tooltip: "Renderiza en un destino HDR. Desactivado en todas partes por defecto: nada de lo que dibuja este juego necesita valores por encima de 1, y HDR duplica el ancho de banda que el antialiasing ya multiplica"
settings_graphics-antialiasing-msaa_tooltip: "Muestras por píxel que toma MSAA. Solo se lee mientras Tipo es MSAA. Más es más limpio y cuesta más cuanto más se solapan formas transparentes, porque la mezcla se resuelve por muestra - x2 es donde debería quedarse un teléfono, x4 es lo que se puede permitir un equipo de escritorio"
settings_graphics-antialiasing-type_tooltip: "Cómo se quitan los dientes de sierra de los bordes. MSAA es el predeterminado y el que encaja con el contenido de este juego: cada forma es geometría real, así que resuelve exactamente lo que tiene dientes de sierra sin desenfocar nada más. FXAA cuesta una pasada a pantalla completa sin importar cuánto redibuje el nivel, y esa es la única razón para preferirlo en un dispositivo débil. Difumina los contornos finos"
