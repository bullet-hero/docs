level_resources_texture-sampling_tooltip: "这张图片的绘制方式：平滑会混合相邻像素，锐利把每个像素画成硬边方块。自动跟随图片类型：像素画为锐利，其他为平滑。锐利和平滑对设备的开销相同，所以这是外观选择而不是性能预算，并且会覆盖玩家自己的过滤设置"
