home:
  tagline: A rhythm and bullet-hell hybrid, built as an engine for the genre.
  play: Download
  readDocs: Read the docs
  status: Alpha on Windows and Android
  features:
    play:
      title: Dodge to the beat
      body: Every level is a track and a storm of shapes timed to it. You steer a small square, dash through the gaps and try to reach the last beat.
    editor:
      title: The editor is already inside
      body: Levels are built in the same game you play them in. Timelines, keyframes, themes and post-processing, with nothing extra to install.
    share:
      title: A level is just a folder
      body: Send it to a friend, drop it into levels and play. The same seed plays the same level on every device, at 30 frames per second or at 144.
    afterbeat:
      title: Coming from Project Arrhythmia
      body: Levels, themes and prefabs from Afterbeat, formerly Project Arrhythmia, import both ways. Bring your work with you.
    bots:
      title: A bot to watch and learn
      body: A bot can play any level with your own controls - same speed, same dash, same hitbox. No cheating, and it can still lose.
    open:
      title: An engine, not just a game
      body: The level format is an open C# SDK under the MIT license. Read and write levels from your own tools.
