settings_graphics-performance_untrusted: "La mesure était instable, l'appareil de référence reste donc utilisé. Ferme les autres applications et mesure à nouveau"
settings_graphics-render-scale_tooltip: "Le nombre de pixels que le jeu rend avant la mise à l'échelle dans la fenêtre. L'interface est dessinée en taille réelle dans tous les cas. Se multiplie avec l'échelle que cette classe d'appareils a déjà. Ordinateur uniquement"
settings_graphics-resolution_tooltip: "Taille de la fenêtre du jeu en pixels, parmi les modes que signale cet écran. Une résolution plus haute que large fait passer toute l'interface en disposition verticale. Ordinateur uniquement"
settings_graphics-textures-compression-quality_tooltip: "Le temps que cet appareil passe à compresser une texture. Le résultat a la même taille et le même format dans tous les cas - seul change le temps de chargement contre des artefacts de blocs sur les dégradés et les bords nets. Auto prend l'encodeur soigné pour tout sauf les photos. Ignoré sur les téléphones, dont les encodeurs n'ont pas ce paramètre"
settings_graphics-textures-compression_tooltip: "Compresser les textures d'un niveau au chargement. Quatre à huit fois moins de mémoire par texture, au prix d'artefacts de blocs sur les dégradés et les bords nets. Auto compresse sur les téléphones, où la mémoire manque, et garde la texture complète sur ordinateur. Lu au chargement d'un niveau, donc s'applique au prochain que tu ouvres"
settings_graphics-textures-filtering_tooltip: "Comment les textures d'un niveau sont échantillonnées au dessin. Auto mélange les niveaux de mipmap quand les mipmaps sont activées, ce qui supprime la couture là où l'un prend le relais du suivant. Point donne des texels nets partout - cela ne change pas la façon dont une texture est réduite, seulement comment elle est dessinée. Les textures que leur auteur a marquées comme pixel art sont toujours échantillonnées en Point"
settings_graphics-textures-mipmaps_tooltip: "Construire des copies réduites de chaque texture, pour qu'une texture dessinée en petit ne scintille pas en bougeant. Coûte un tiers de mémoire en plus. Les textures que leur auteur a marquées comme pixel art n'en ont jamais"
settings_graphics-textures-size-limit_tooltip: "Le plus grand côté qu'une texture peut occuper en mémoire sur cet appareil. Tout ce qui est plus grand est réduit au chargement, et le fichier sur le disque n'est jamais touché. La mémoire baisse avec le carré du côté, donc un cran plus bas économise plus que la compression. Auto vaut 2048 sur téléphone et 4096 sur ordinateur"
