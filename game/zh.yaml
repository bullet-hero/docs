level_resources_texture-alpha_tooltip: "你对这张图片透明度的声明。不透明表示不使用Alpha通道，图片会去掉该通道重新打包，像素不变，绘制更快，并走不透明渲染路径。这个声明不会被校验：如果图片确实有渐隐，渐隐会被抹平，下方的报告行会显示这一点"
level_resources_texture-compression: "压缩"
level_resources_texture-compression_tooltip: "设备是否可以把这张图片打包成有损格式。禁止会保留每个像素，最多占用四倍内存。允许则让设备即使在图片类型本会禁止的情况下也压缩它。自动跟随图片类型：像素画和渐变会禁止。两个选项都不会让设备违背自身设置去压缩，也都不会解除尺寸上限"
level_resources_texture-details: "导入"
level_resources_texture-kind: "这张图片是什么：照片、绘图、像素画还是渐变。纯粹是美术上的选择，说明图片“是”什么。它也决定下方采样和压缩字段的初始值（像素画初始为锐利且不压缩，渐变不压缩），两者都可以在那里修改。Mipmap是类型唯一仍然自行决定的东西：像素画永远不会生成Mipmap"
