settings_graphics-vsync_tooltip: "Espera al refresco de la pantalla antes de mostrar un fotograma, lo que elimina el desgarro de imagen y cuesta un fotograma de latencia. Mientras está activado, el límite de frecuencia de fotogramas de arriba no hace nada. Solo en escritorio"
settings_graphics-window-mode_tooltip: "Cómo ocupa la ventana la pantalla. En ventana permite cambiar su tamaño libremente, lo que también cambia la forma para la que se organiza la interfaz. Solo en escritorio"
