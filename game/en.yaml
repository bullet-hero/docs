level_resources_texture-alpha: "Alpha"
level_resources_texture-alpha_tooltip: "What you state about this image's transparency. Opaque means the alpha channel goes unused, so the image is repacked without it - the same pixels, drawn faster and on the opaque render path. Nothing verifies the claim: on an image that really does fade it flattens the fade, and the readout below is where that shows"
level_resources_texture-compression: "Compression"
level_resources_texture-compression_tooltip: "Whether a device may pack this image into a lossy format. Refuse keeps every pixel and costs up to four times the memory, Allow lets the device compress it even where the kind would refuse. Auto follows the kind: pixel art and gradients refuse. Neither value makes a device compress what its settings say not to, and neither lifts the size limit"
level_resources_texture-details: "Import"
level_resources_texture-kind: "What this image is - a photo, a drawing, pixel art, a gradient. Purely artistic: it says what the picture IS. It also seeds the Sampling and Compression fields below - pixel art starts out sharp and uncompressed, a gradient uncompressed - and either can be changed there. Mip-maps are the one thing a kind still decides on its own: pixel art never gets them"
level_resources_texture-report-alpha-dropped: "alpha dropped"
level_resources_texture-report-mips: "mips"
level_resources_texture-report-not-loaded: "not loaded"
level_resources_texture-report-source-unknown: "unknown source"
level_resources_texture-sampling: "Sampling"
level_resources_texture-sampling_tooltip: "How this image is drawn - Smooth blends neighbouring pixels together, Sharp draws each one as a hard square. Auto follows the kind: pixel art sharp, everything else smooth. Sharp and smooth cost a device the same, so this is a look rather than a budget and it overrules the player's own filtering"
level_resources_texture-uv-offset-x: "Offset X"
level_resources_texture-uv-offset-y: "Offset Y"
level_resources_texture-uv-tiling-x: "Tiling X"
level_resources_texture-uv-tiling-y: "Tiling Y"
level_resources_texture-uv_tooltip: "How this image maps onto whatever draws it, said once for the resource instead of on every object. Tiling is how many times it repeats across the shape, Offset is where its first copy starts. An object with no UV keyframes of its own samples exactly this, and any UV keyframe on that object replaces it completely"
level_resources_texture-wrap-u: "Wrapping X"
level_resources_texture-wrap-u_tooltip: "What this image does past its left and right edges. Repeat and Mirror show up only where the UV tiles - at a tiling of 1 the image is sampled once and never leaves itself"
level_resources_texture-wrap-v: "Wrapping Y"
level_resources_texture-wrap-v_tooltip: "What this image does past its top and bottom edges. Separate from the X axis on purpose: a strip that tiles sideways while staying clamped vertically is ordinary content"
