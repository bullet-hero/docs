level_resources_texture-wrap-u_tooltip: "Что эта картинка делает за левым и правым краями. Повторять и Зеркально видны только там, где тайлится UV - при тайлинге 1 картинка сэмплится один раз и за себя не выходит"
level_resources_texture-wrap-v: "За краями по Y"
level_resources_texture-wrap-v_tooltip: "Что эта картинка делает за верхним и нижним краями. Отделено от оси X намеренно: полоса, которая тайлится по горизонтали и остаётся зажатой по вертикали - обычный контент"
