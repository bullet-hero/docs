hint_editor-settings_artist-permission_body: |-
  关卡中的每个外部资源（音乐、图片、字体、文本）都需要至少与<color=#D4B483>CC BY-NC</color>同等自由的许可证，或者获得版权所有者对公开非商业再分发的许可

  <color=#E86A5A><b>注意：</b></color>私下一句“没问题，用吧”是不够的。许可必须涵盖公开再分发，而不只是你的个人使用

  关卡只保存在你的设备上时不会检查任何内容，只有在提交给某个服务时才会检查

  更多：<link="https://bullethero.space/zh/docs/editor/rights/legal-resource-paths"><color=#59A6FF>资源合规的两种途径</color></link>，<link="https://bullethero.space/zh/docs/editor/rights/asking-permission"><color=#59A6FF>向作者请求许可</color></link>
hint_editor-settings_artist-permission_header: "使用他人的作品"
hint_editor-settings_community: "项目自己的链接，会在浏览器中打开。列出哪些链接取决于这个版本的来源，因此商店版本显示的链接可能比这里少"
hint_editor-settings_create-level_body: |-
  <b>预设</b>决定新关卡的初始内容：一个空关卡，或者一小套原本每次都要手工搭建的基础框架

  <color=#E86A5A><b>注意：</b></color><b>参数</b>设置的是事后不便修改的内容：以帧为单位的长度和帧率

  <color=#5EC8C8><b>提示：</b></color>两个文件格式下拉框决定关卡及其元数据以何种方式写入磁盘。两者之后都可以在关卡的“危险区域”中修改

  更多：<link="https://bullethero.space/zh/docs/editor/basics/first-level"><color=#59A6FF>第一个关卡：路线</color></link>
hint_editor-settings_create-level_header: "创建关卡"
hint_editor-settings_open-level: "在此设备上找到的关卡。关卡就是一个文件夹，把它放在其他关卡旁边，它就会出现在这里"
hint_editor_beat-segment_body: |-
  速度恒定的一段区间：BPM、以小数帧表示的相位偏移、每小节拍数、名称和颜色。即使选中了多个节拍段，也只显示其中一个

  <color=#E86A5A><b>注意：</b></color>节拍段以起始帧作为标识，因此<b>移动它会改变它的身份</b>。移动后，在新的起点处重新选中它

  <color=#5EC8C8><b>提示：</b></color>在这里敲击会重新调整所选节拍段的相位，而不是创建新的节拍段

  更多：<link="https://bullethero.space/zh/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>节奏与结构</color></link>
hint_editor_beat-segment_header: "节拍段"
hint_editor_beat-window_body: |-
  创作用的元数据，<b>播放时完全不读取</b>。它帮助你把内容对齐到音乐上，生成器也按照你看到的这些节拍工作

  网格是一组<b>节拍段</b>，每段内速度恒定。节拍段之间可以留空：没有打击乐的前奏、间奏、歌曲结束后的尾声

  <color=#5EC8C8><b>提示：</b></color>跟着音频轨道按<b>敲击</b>，然后<b>由敲击创建</b>会把这些敲击变成一个节拍段，从第一次敲击延续到最后一次

  更多：<link="https://bullethero.space/zh/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>节奏与结构</color></link>
hint_editor_beat-window_header: "节拍网格"
hint_editor_clipboard_body: |-
  每个时间轴一个缓冲区，各有自己的状态行

  <b>复制为文本</b>把所有缓冲区以文本形式写入系统剪贴板，这样选中项就能带到另一个关卡或另一台机器上。<b>从文本粘贴</b>把它读回缓冲区，并且<b>到此为止</b>

  <color=#B48CE0><b>须知：</b></color>在你亲自选定的时间轴中粘贴之前，没有任何内容会进入关卡。粘贴的位置取决于播放头和当前的活动作用域

  更多：<link="https://bullethero.space/zh/docs/editor/workflow/reuse"><color=#59A6FF>复用：预制件、复制、生成器</color></link>
hint_editor_clipboard_header: "剪贴板"
hint_editor_console: "编辑器在本次会话中记录的所有内容：关卡加载报告、生成器结果、导入警告。<b>清空</b>会清除这些内容。齿轮按钮用于筛选显示哪些严重级别"
hint_editor_curve-editor: "通过拖动控制点编辑曲线。拖动时修改<b>实时</b>生效，你看到的就是关卡中已有的内容，关闭窗口会保留这些修改"
hint_editor_generators_body: |-
  程序化内容，作为一次可撤销的操作作用于关卡

  <color=#B48CE0><b>须知：</b></color>共有两类。<b>生成器</b>（<i>gen_</i>）创建内容：子弹波次、径向图案、字体缓存、Afterbeat关卡导入。<b>修改器</b>（<i>mod_</i>）改写已有内容：时段适配、量化关键帧

  <color=#E86A5A><b>注意：</b></color>任何改写或删除已有内容的操作都会先请求确认

  更多：<link="https://bullethero.space/zh/docs/editor/workflow/reuse"><color=#59A6FF>复用：预制件、复制、生成器</color></link>
hint_editor_generators_header: "生成器"
hint_editor_gradient-editor: "通过拖动色标编辑渐变。与曲线编辑器一样，修改<b>实时</b>生效，而不是在确认时才应用"
hint_editor_hierarchy_body: |-
  <b>当前帧</b>上存在的所有物体，按父级嵌套。列表会随着拖动播放头而变化，层级为空通常意味着播放头已越过你的内容末尾

  把一行拖到另一行上，即可让它成为那个物体的子物体。图层沿父子链累加，因此更换父级也会改变物体的绘制顺序，并重新生成它的随机值

  <color=#5EC8C8><b>提示：</b></color>右键点击一行可打开它的操作。在触屏上，长按该行

  更多：<link="https://bullethero.space/zh/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>编辑器的思路</color></link>
hint_editor_hierarchy_header: "层级"
hint_editor_inspector-audio_body: |-
  选中音频轨道的片段、速度、推子音量及其音频效果链：低通、高通、回声、混响、合唱、变调、失真、镶边、压缩器、标准化和参数均衡

  速度和音量用滑块而不是普通数字字段，这样合法范围一目了然

  <color=#E86A5A><b>注意：</b></color><b>这里的音量是推子。</b>关键帧音量是局部时间轴上的另一条轨道，播放时两者相乘

  更多：<link="https://bullethero.space/zh/docs/editor/resources/preparing-the-track"><color=#59A6FF>准备音频轨道</color></link>
hint_editor_inspector-audio_chorus-delay: "副本的基础延迟，单位毫秒。它足够短，听起来是厚度而不是回声"
hint_editor_inspector-audio_chorus-depth: "延迟摆动的幅度。Rate决定摆动的快慢，这里决定摆动的大小"
hint_editor_inspector-audio_chorus-dry-mix: "未处理信号的电平"
hint_editor_inspector-audio_chorus-feedback: "有多少输出回送到效果输入，调高会让声音越来越接近镶边"
hint_editor_inspector-audio_chorus-rate: "延迟被调制的速度，单位Hz"
hint_editor_inspector-audio_chorus-wet-mix-tap-1: "第一个延迟副本的电平"
hint_editor_inspector-audio_chorus-wet-mix-tap-2: "第二个副本的电平。各副本在时间上错开，它们之间的平衡决定合唱听起来有多宽"
hint_editor_inspector-audio_chorus-wet-mix-tap-3: "第三个副本的电平"
hint_editor_inspector-audio_chorus_body: |-
  在信号上叠加三个略有延迟、音高微微摆动的副本，让一个声源听起来像多个。<color=#D4B483>Rate</color>是摆动的快慢，<color=#D4B483>Depth</color>是摆动的幅度。把<color=#D4B483>Feedback</color>调高，它就会变成<link="hint_editor_inspector-audio_flange"><color=#59A6FF>镶边</color></link>

  <color=#B48CE0><b>须知：</b></color><b>重置</b>也会把<b>Mix Level</b>恢复为默认的-80 dB，因此会关闭该效果

  更多：<link="https://bullethero.space/zh/docs/editor/resources/preparing-the-track"><color=#59A6FF>准备音频轨道</color></link>
hint_editor_inspector-audio_chorus_header: "合唱"
hint_editor_inspector-audio_compressor-attack: "越过峰值后多快开始压制，单位毫秒。太快会吃掉瞬态"
hint_editor_inspector-audio_compressor-make-up-gain: "压缩后补回的增益，单位dB，用于找回被压掉的电平"
hint_editor_inspector-audio_compressor-release: "压制之后多快松开，单位毫秒。太快会产生明显的抽吸感"
hint_editor_inspector-audio_compressor-threshold: "压缩开始起作用的电平，单位dB"
hint_editor_inspector-audio_compressor_body: |-
  压低响亮的部分，让安静的部分能抬高，这是歌曲被自身效果盖住时的常用解法。<color=#D4B483>Threshold</color>是开始压缩的位置，<color=#D4B483>Attack</color>和<color=#D4B483>Release</color>决定压制和松开的快慢，<color=#D4B483>Make Up Gain</color>把电平补回来

  <color=#B48CE0><b>须知：</b></color><b>重置</b>也会把<b>Mix Level</b>恢复为默认的-80 dB，因此会关闭该效果

  更多：<link="https://bullethero.space/zh/docs/editor/resources/preparing-the-track"><color=#59A6FF>准备音频轨道</color></link>
hint_editor_inspector-audio_compressor_header: "压缩器"
hint_editor_inspector-audio_distortion-level: "信号被削波的程度"
hint_editor_inspector-audio_distortion_body: |-
  对波形削波，让声音充满谐波，粗糙而过载。只有一个旋钮<color=#D4B483>Level</color>，决定失真有多狠。它还会压平动态，让音频轨道失去安静的段落

  <color=#B48CE0><b>须知：</b></color><b>重置</b>也会把<b>Mix Level</b>恢复为默认的-80 dB，因此会关闭该效果

  更多：<link="https://bullethero.space/zh/docs/editor/resources/preparing-the-track"><color=#59A6FF>准备音频轨道</color></link>
hint_editor_inspector-audio_distortion_header: "失真"
hint_editor_inspector-audio_echo-decay: "每次重复有多少送入下一次，数值越高余音越长"
hint_editor_inspector-audio_echo-delay: "两次重复之间的毫秒数。把它和歌曲的速度对齐，回声就能落在节拍上"
hint_editor_inspector-audio_echo-dry-mix: "输出中未处理信号的电平"
hint_editor_inspector-audio_echo-max-channels: "回声缓冲区的声道数上限"
hint_editor_inspector-audio_echo-wet-mix: "回声信号的电平，与Dry Mix相平衡，独立于Mix Level"
hint_editor_inspector-audio_echo_body: |-
  以固定间隔重复信号，每次重复都比上一次轻。这是一个个分开的副本，而不是<link="hint_editor_inspector-audio_reverb"><color=#59A6FF>混响</color></link>那样的房间感。<color=#D4B483>Delay</color>是间隔的毫秒数，<color=#D4B483>Decay</color>是每个副本有多少送入下一个

  <color=#B48CE0><b>须知：</b></color><b>重置</b>也会把<b>Mix Level</b>恢复为默认的-80 dB，因此会关闭该效果

  更多：<link="https://bullethero.space/zh/docs/editor/resources/preparing-the-track"><color=#59A6FF>准备音频轨道</color></link>
hint_editor_inspector-audio_echo_header: "回声"
hint_editor_inspector-audio_enabled: "该效果是否在效果链中。它没有单独的开关：勾选会把Mix Level从-80 dB的下限抬起，取消勾选会把它放回去，并保留你设置过的电平"
hint_editor_inspector-audio_flange-depth: "延迟摆动的幅度"
hint_editor_inspector-audio_flange-dry-mix: "未处理信号的电平"
hint_editor_inspector-audio_flange-rate: "扫频重复的速度，单位Hz"
hint_editor_inspector-audio_flange-wet-mix: "扫频副本的电平。两路信号之间的相互抵消就是这个效果本身"
hint_editor_inspector-audio_flange_body: |-
  把信号与它自身一段极短且不断扫动的延迟混合，形成喷气发动机般的呼啸声。类似<link="hint_editor_inspector-audio_chorus"><color=#59A6FF>合唱</color></link>，但只有一个副本，所以你听到的是扫动而不是宽度。<color=#D4B483>Dry Mix</color>和<color=#D4B483>Wet Mix</color>接近时呼啸最深

  <color=#B48CE0><b>须知：</b></color><b>重置</b>也会把<b>Mix Level</b>恢复为默认的-80 dB，因此会关闭该效果

  更多：<link="https://bullethero.space/zh/docs/editor/resources/preparing-the-track"><color=#59A6FF>准备音频轨道</color></link>
hint_editor_inspector-audio_flange_header: "镶边"
hint_editor_inspector-audio_header: "音频轨道检视器"
hint_editor_inspector-audio_highpass-cutoff-freq: "频率（Hz），音频轨道中低于它的部分会被衰减。设为最小值时滤波器实际上是透明的"
hint_editor_inspector-audio_highpass_body: |-
  <link="hint_editor_inspector-audio_lowpass"><color=#59A6FF>低通</color></link>的镜像：保留高频，切掉<color=#D4B483>Cutoff Freq</color>以下的一切。调高截止频率，音频轨道就会变薄，像从小喇叭里放出来

  <color=#5EC8C8><b>提示：</b></color>效果链属于<b>轨道</b>，不能用关键帧制作动画。要在歌曲中途改变，就把轨道切开，分别设置两半

  <color=#B48CE0><b>须知：</b></color><b>重置</b>也会把<b>Mix Level</b>恢复为默认的-80 dB，因此会关闭该效果

  更多：<link="https://bullethero.space/zh/docs/editor/resources/preparing-the-track"><color=#59A6FF>准备音频轨道</color></link>
hint_editor_inspector-audio_highpass_header: "高通"
hint_editor_inspector-audio_lowpass-cutoff-freq: "频率（Hz），音频轨道中高于它的部分会被衰减。设为最大值时滤波器实际上是透明的"
hint_editor_inspector-audio_lowpass_body: |-
  保留低频，切掉<color=#D4B483>Cutoff Freq</color>以上的一切，得到水下或隔墙听到的声音。在范围顶端，滤波器实际上是透明的

  <color=#5EC8C8><b>提示：</b></color>效果链属于<b>轨道</b>，不能用关键帧制作动画。要在歌曲中途改变，就把轨道切开，分别设置两半

  <color=#B48CE0><b>须知：</b></color><b>重置</b>也会把<b>Mix Level</b>恢复为默认的-80 dB，因此会关闭该效果

  更多：<link="https://bullethero.space/zh/docs/editor/resources/preparing-the-track"><color=#59A6FF>准备音频轨道</color></link>
hint_editor_inspector-audio_lowpass_header: "低通"
hint_editor_inspector-audio_mix-level: "处理后的信号混回时的电平，单位dB。在-80时效果无声，“关闭”就是这样存储的，文件中没有单独的开关"
hint_editor_inspector-audio_normalize-fade-in-time: "增益稳定下来所需的毫秒数，让校正听起来不像突变"
hint_editor_inspector-audio_normalize-lowest-volume: "比这更安静的信号不做处理，以免静音和底噪被放大成嘶嘶声"
hint_editor_inspector-audio_normalize-maximum-amp: "允许施加的增益上限"
hint_editor_inspector-audio_normalize_body: |-
  把信号拉向目标响度，让来自不同来源的片段处于相近的电平。它作用于整体电平，音频轨道内部的动态交给<link="hint_editor_inspector-audio_compressor"><color=#59A6FF>压缩器</color></link>。<color=#D4B483>Lowest Volume</color>防止它把静音变成嘶嘶声，<color=#D4B483>Maximum Amp</color>限制提升幅度

  <color=#B48CE0><b>须知：</b></color><b>重置</b>也会把<b>Mix Level</b>恢复为默认的-80 dB，因此会关闭该效果

  更多：<link="https://bullethero.space/zh/docs/editor/resources/preparing-the-track"><color=#59A6FF>准备音频轨道</color></link>
hint_editor_inspector-audio_normalize_header: "标准化"
hint_editor_inspector-audio_param-eq-center-freq: "频段中心所在的频率，单位Hz"
hint_editor_inspector-audio_param-eq-frequency-gain: "频段内施加的增益，小于1为衰减，大于1为提升"
hint_editor_inspector-audio_param-eq-octave-range: "频段宽度，以八度计。窄的用于精确修正，宽的用于整体音色塑造"
hint_editor_inspector-audio_param-eq_body: |-
  一个参数频段，提升或衰减频谱中选定的区域。与<link="hint_editor_inspector-audio_lowpass"><color=#59A6FF>低通</color></link>和<link="hint_editor_inspector-audio_highpass"><color=#59A6FF>高通</color></link>不同，它也能增加电平。<color=#D4B483>Center Freq</color>是频段所在位置，<color=#D4B483>Octave Range</color>是它的宽度，<color=#D4B483>Frequency Gain</color>小于1为衰减，大于1为提升

  <color=#B48CE0><b>须知：</b></color><b>重置</b>也会把<b>Mix Level</b>恢复为默认的-80 dB，因此会关闭该效果

  更多：<link="https://bullethero.space/zh/docs/editor/resources/preparing-the-track"><color=#59A6FF>准备音频轨道</color></link>
hint_editor_inspector-audio_param-eq_header: "参数均衡"
hint_editor_inspector-audio_pitch-shifter-fft-size: "分析窗口大小，是算法在质量和延迟之间取舍的旋钮"
hint_editor_inspector-audio_pitch-shifter-max-channels: "处理的声道数上限"
hint_editor_inspector-audio_pitch-shifter-overlap: "相邻窗口的重叠程度。重叠越多，伪影越少，但开销更大"
hint_editor_inspector-audio_pitch-shifter-pitch: "音高倍数：1为不变，2为升高一个八度"
hint_editor_inspector-audio_pitch-shifter_body: |-
  改变音高而不改变速度，因此节奏始终与歌曲对齐。<color=#D4B483>Pitch</color>是倍数：1保持不变，2升高一个八度。<color=#D4B483>FFT Size</color>和<color=#D4B483>Overlap</color>在质量和开销之间取舍

  <color=#5EC8C8><b>提示：</b></color>效果链属于<b>轨道</b>，不能用关键帧制作动画。要在歌曲中途改变，就把轨道切开，分别设置两半

  <color=#B48CE0><b>须知：</b></color><b>重置</b>也会把<b>Mix Level</b>恢复为默认的-80 dB，因此会关闭该效果

  更多：<link="https://bullethero.space/zh/docs/editor/resources/preparing-the-track"><color=#59A6FF>准备音频轨道</color></link>
hint_editor_inspector-audio_pitch-shifter_header: "变调"
hint_editor_inspector-audio_reverb-decay-hf-ratio: "高频比低频衰减快多少。小于1时，尾音在消退中逐渐变暗"
hint_editor_inspector-audio_reverb-decay-time: "尾音消退所需的秒数，是判断房间大小最明显的线索"
hint_editor_inspector-audio_reverb-density: "模拟空间的模态密度"
hint_editor_inspector-audio_reverb-diffusion: "回声随时间的密度。数值低时尾音会显得粗糙，带有金属感"
hint_editor_inspector-audio_reverb-dry-level: "输出中未处理信号的电平"
hint_editor_inspector-audio_reverb-hf-reference: "Room HF和Decay HF Ratio所依据的测量频率"
hint_editor_inspector-audio_reverb-lf-reference: "Room LF所依据的测量频率"
hint_editor_inspector-audio_reverb-reflect-delay: "这些反射到达之前的延迟，即墙壁有多远"
hint_editor_inspector-audio_reverb-reflections: "早期反射的电平，即附近墙壁清晰可辨的最初几次反弹"
hint_editor_inspector-audio_reverb-reverb: "后期弥散尾音的电平，与早期反射相对"
hint_editor_inspector-audio_reverb-reverb-delay: "尾音出现之前的延迟"
hint_editor_inspector-audio_reverb-room: "混响信号的整体电平，即房间的存在感"
hint_editor_inspector-audio_reverb-room-hf: "房间在高频的电平。调低它听起来像柔软、吸音的墙壁"
hint_editor_inspector-audio_reverb-room-lf: "房间在低频的电平"
hint_editor_inspector-audio_reverb_body: |-
  把音频轨道放进一个房间：先是早期反射，然后是逐渐衰减的尾音。先从三个字段入手：<color=#D4B483>Decay Time</color>是房间大小，<color=#D4B483>Room</color>是能听到多少房间感，把<color=#D4B483>Room HF</color>调低会让墙壁变软

  <color=#B48CE0><b>须知：</b></color><b>重置</b>也会把<b>Mix Level</b>恢复为默认的-80 dB，因此会关闭该效果

  更多：<link="https://bullethero.space/zh/docs/editor/resources/preparing-the-track"><color=#59A6FF>准备音频轨道</color></link>
hint_editor_inspector-audio_reverb_header: "混响"
hint_editor_inspector-effect_angle-a: "角度，单位为度。在随机类变体下，它是每个粒子抽取范围的一端"
hint_editor_inspector-effect_angle-b: "每个粒子抽取角度所用范围的另一端"
hint_editor_inspector-effect_angle-curve: "读取角度所用的曲线。“按寿命”变体沿粒子自身的寿命读取，“按速度”变体沿其速度读取"
hint_editor_inspector-effect_angle-speed-range: "曲线重新映射所用的速度区间：对应曲线起点的速度，以及对应曲线终点的速度"
hint_editor_inspector-effect_angle-type: "当前是五种旋转变体中的哪一种。更改它会替换整个子对象，因此下面的各行属于新变体"
hint_editor_inspector-effect_angle_body: |-
  粒子在寿命内如何旋转，共五种变体：固定的<color=#D4B483>数值</color>、两种<color=#D4B483>曲线</color>，或两种按粒子抽取的<color=#D4B483>随机</color>范围

  <color=#D4B483>按寿命</color>沿粒子的寿命读取曲线，<color=#D4B483>按速度</color>沿其速度读取，并经过下方的速度区间映射

  此按钮旁的<b>重置</b>也会重置<color=#D4B483>类型</color>，曲线或随机值对也随之重置

  更多：<link="https://bullethero.space/zh/docs/editor/craft/readability-and-fairness"><color=#59A6FF>可读性</color></link>
hint_editor_inspector-effect_angle_header: "角度"
hint_editor_inspector-effect_body: |-
  <color=#D4B483>VFX Graph</color>特效的参数，分组排列：配置、基本、力、形状、角度、缩放和颜色。所有组同时可见，而不是一次只显示一组

  <color=#B48CE0><b>须知：</b></color>特效<b>与其他所有内容使用同样的种子方式</b>，随机值来自你编辑的数字，而不是随机数生成器的状态，因此同一关卡在任何设备上的回放都完全一致

  <color=#5EC8C8><b>提示：</b></color>颜色可以引用关卡主题，而不必填写固定值，渐变类型会打开共用的渐变编辑器

  更多：<link="https://bullethero.space/zh/docs/editor/performance/level-budget"><color=#59A6FF>关卡预算</color></link>
hint_editor_inspector-effect_color-a: "粒子的颜色。在随机类变体下，它是每个粒子抽取范围的一端"
hint_editor_inspector-effect_color-b: "每个粒子抽取颜色所用范围的另一端"
hint_editor_inspector-effect_color-gradient: "读取颜色所用的渐变。根据变体不同，沿粒子的寿命读取、沿其速度读取，或为每个粒子取一种颜色"
hint_editor_inspector-effect_color-speed-range: "渐变重新映射所用的速度区间：对应渐变起点的速度，以及对应渐变终点的速度"
hint_editor_inspector-effect_color-type: "当前是六种着色变体中的哪一种。更改它会替换整个子对象，因此下面的各行属于新变体"
hint_editor_inspector-effect_color_body: |-
  粒子在寿命内如何着色，共六种变体：<link="hint_editor_inspector-effect_angle"><color=#59A6FF>角度</color></link>和<link="hint_editor_inspector-effect_scale"><color=#59A6FF>缩放</color></link>的那五种，只是用渐变代替曲线，外加<color=#D4B483>随机渐变</color>，为每个粒子选取一种颜色

  <color=#5EC8C8><b>提示：</b></color>这里的颜色可以是主题引用，这样关卡中途更换调色板时，特效也会随之变化

  此按钮旁的<b>重置</b>也会重置<color=#D4B483>类型</color>，渐变或颜色对也随之重置

  更多：<link="https://bullethero.space/zh/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>颜色与主题</color></link>
hint_editor_inspector-effect_color_header: "颜色"
hint_editor_inspector-effect_config-has-stop-frame: "是否启用停止帧。关闭时，只要物体还存在，发射器就一直生成粒子"
hint_editor_inspector-effect_config-stop-frame: "停止发射的帧，从物体自身时段的起点计数，而不是从关卡时间计数。已存在的粒子仍会走完各自的寿命"
hint_editor_inspector-effect_config_body: |-
  发射器何时停止生成粒子。关闭时，只要物体还存在它就一直生成，这是通常的情况

  <color=#D4B483>停止帧</color>从物体自身时段的起点计数，而不是从关卡时间轴计数。已存在的粒子会走完寿命，因此画面是逐渐消散，而不是突然中断

  此按钮旁的<b>重置</b>会把两个字段恢复为开发者设定的默认值，只占一步撤销

  更多：<link="https://bullethero.space/zh/docs/editor/performance/level-budget"><color=#59A6FF>关卡能承受多少</color></link>
hint_editor_inspector-effect_config_header: "配置"
hint_editor_inspector-effect_core-lifetime-bounds: "粒子存活的最短和最长秒数，按粒子抽取。正是这个差值让一次爆发的粒子不会同时消失。两者的平均值也是一次性特效批量大小的乘数"
hint_editor_inspector-effect_core-loop: "系统是否持续发射，而不是只发射一批且永不补充。关闭时，超出寿命范围后就没有可绘制的内容了"
hint_editor_inspector-effect_core-particle-count: "每秒发射的粒子数，是控制开销的主要参数。同时存活的数量等于它乘以平均寿命，两种模式都是如此：循环时按此速率生成，一次性时把这整个乘积一次爆发出来。上限是图自身的容量，无论粒子是否存在，系统每帧都会按这个容量调度"
hint_editor_inspector-effect_core-particle-pivot: "粒子上位于其位置、也是其旋转中心的点，相当于单个粒子自己的轴心，对应物体的轴心"
hint_editor_inspector-effect_core-render: "是否绘制粒子。关闭后系统仍继续模拟，适合只需要它的附带效果的情况"
hint_editor_inspector-effect_core-shape-id: "每个粒子绘制所用的几何体，取自物体所用的同一个形状库。“无”完全不绘制，四边形是普通的值，也是此字段的默认值"
hint_editor_inspector-effect_core-texture-id: "每个粒子绘制的图像，取自物体所用的同一个资源库。“无”让粒子不上色，这是此字段的默认值"
hint_editor_inspector-effect_core_body: |-
  粒子有多少、存活多久、用什么绘制。粒子如何运动见<link="hint_editor_inspector-effect_forces"><color=#59A6FF>力</color></link>

  <color=#D4B483>粒子数量</color>是控制开销的主要参数：一个发射器的开销约为数量乘以<color=#D4B483>寿命范围</color>。<color=#D4B483>形状</color>和<color=#D4B483>纹理</color>可以留空，无纹理的粒子开销最低

  <color=#E8B04B><b>警告：</b></color>数量上限为1024，而且图每帧都要为全部容量付出开销，而不只是存活的粒子。需要多少就设多少

  更多：<link="https://bullethero.space/zh/docs/editor/performance/level-budget"><color=#59A6FF>关卡能承受多少</color></link>
hint_editor_inspector-effect_core_header: "基本"
hint_editor_inspector-effect_forces-linear-force: "恒定的加速度而非速度，因此它的作用会在粒子寿命中不断累积，而不是保持不变"
hint_editor_inspector-effect_forces-linear-velocity: "每帧叠加在粒子初始速度之上的恒定漂移，像风，而不是冲击"
hint_editor_inspector-effect_forces-orbital-center-offset: "环绕中心相对于发射器的位置。偏移后漩涡会变得不对称"
hint_editor_inspector-effect_forces-orbital-velocity: "粒子绕某个中心旋转，而不是绕自身旋转。在2D场景中起作用的是Z分量"
hint_editor_inspector-effect_forces-start-angular-velocity-max: "初始旋转抽取的上限"
hint_editor_inspector-effect_forces-start-angular-velocity-min: "初始旋转抽取的下限，单位为度每秒"
hint_editor_inspector-effect_forces-start-gravity-max: "每个粒子重力抽取的上限"
hint_editor_inspector-effect_forces-start-gravity-min: "每个粒子重力抽取的下限。负值会让粒子向上飘"
hint_editor_inspector-effect_forces-start-velocity-max: "初始速度抽取的上限。拉开这两者的差距，就能把整齐的爆发变成喷洒"
hint_editor_inspector-effect_forces-start-velocity-min: "初始速度抽取的下限，按轴分别计算"
hint_editor_inspector-effect_forces-velocity-speed: "作用于粒子整体速度的倍数，只用这一个参数就能让做好的特效变慢或变快，无需重新调整上面的每个字段"
hint_editor_inspector-effect_forces_body: |-
  粒子生成后推动它运动的一切。粒子从哪里出发见<link="hint_editor_inspector-effect_shape"><color=#59A6FF>形状</color></link>

  <color=#D4B483>初始</color>这几对数值在出生时为每个粒子抽取一次。其余各项在粒子整个寿命中持续作用，而<color=#D4B483>线性力</color>是加速度，所以会累积

  <color=#5EC8C8><b>提示：</b></color><color=#D4B483>移动速度</color>会乘以整个结果，因此做好的特效无需重新调整其余参数就能变慢或变快

  更多：<link="https://bullethero.space/zh/docs/editor/craft/composition-and-camera"><color=#59A6FF>构图</color></link>
hint_editor_inspector-effect_forces_header: "力"
hint_editor_inspector-effect_header: "特效检视器"
hint_editor_inspector-effect_scale-a: "粒子的尺寸。在随机类变体下，它是每个粒子抽取范围的一端"
hint_editor_inspector-effect_scale-b: "每个粒子抽取尺寸所用范围的另一端"
hint_editor_inspector-effect_scale-curve-x: "读取水平尺寸所用的曲线，与垂直尺寸相互独立"
hint_editor_inspector-effect_scale-curve-y: "读取垂直尺寸所用的曲线，与水平尺寸相互独立"
hint_editor_inspector-effect_scale-speed-range: "两条曲线重新映射所用的速度区间：对应曲线起点的速度，以及对应曲线终点的速度"
hint_editor_inspector-effect_scale-type: "当前是五种尺寸变体中的哪一种。更改它会替换整个子对象，因此下面的各行属于新变体"
hint_editor_inspector-effect_scale_body: |-
  粒子在寿命内的大小，变体与<link="hint_editor_inspector-effect_angle"><color=#59A6FF>角度</color></link>相同，共五种。<color=#D4B483>曲线X</color>和<color=#D4B483>曲线Y</color>分别独立读取，因此粒子可以一边缩小一边拉伸

  <color=#E8B04B><b>警告：</b></color>曲线下方那一行是复用的：在数值和随机变体下是尺寸本身，在按速度变体下是速度区间。旁边的标注会说明当前是哪一个

  此按钮旁的<b>重置</b>也会重置<color=#D4B483>类型</color>，两条曲线和随机值对也随之重置

  更多：<link="https://bullethero.space/zh/docs/editor/craft/readability-and-fairness"><color=#59A6FF>可读性</color></link>
hint_editor_inspector-effect_scale_header: "缩放"
hint_editor_inspector-effect_shape-arc: "实际使用的边缘部分，以弧度为单位，从+X轴起逆时针测量。小于一整圈就会形成扇形"
hint_editor_inspector-effect_shape-box-size: "生成框的完整宽度和高度，以特效物体为中心"
hint_editor_inspector-effect_shape-circle-aspect: "垂直半轴相对于半径的倍数：1为圆，其他值为椭圆"
hint_editor_inspector-effect_shape-circle-radius: "沿水平轴从中心到圆周的距离"
hint_editor_inspector-effect_shape-circle-thickness: "圆周向内填充的程度：0为只有轮廓，1为实心圆盘"
hint_editor_inspector-effect_shape-cone-base-radius: "发射器一端的半径"
hint_editor_inspector-effect_shape-cone-height: "两端之间的距离，即生成体积有多深"
hint_editor_inspector-effect_shape-cone-top-radius: "远端的半径。大于底部半径时向外张开，小于时向内收成漏斗"
hint_editor_inspector-effect_shape-line-end: "线段的另一端"
hint_editor_inspector-effect_shape-line-start: "线段的一端，使用特效物体的局部坐标"
hint_editor_inspector-effect_shape-spread: "遍历在回到起点之前覆盖形状的比例"
hint_editor_inspector-effect_shape-spread-speed: "生成点前进的速度，决定了肉眼可见的旋转速率"
hint_editor_inspector-effect_shape-spread-type: "后续粒子如何遍历形状：随机、单向循环、往返或按正弦。正是这一项能把静止的圆环变成旋转或摆动的图案"
hint_editor_inspector-effect_shape-torus-radius-major: "圆管所环绕的圆环的半径"
hint_editor_inspector-effect_shape-torus-radius-minor: "圆管本身的半径，即圆环有多粗"
hint_editor_inspector-effect_shape-type: "当前是哪种生成体积。更改它会替换形状，因此下面的字段属于新形状，而不是旧形状"
hint_editor_inspector-effect_shape_body: |-
  生成体积：点、圆形、矩形、线段、锥形或圆环。它只决定粒子从哪里出发，之后的运动见<link="hint_editor_inspector-effect_forces"><color=#59A6FF>力</color></link>

  更改<color=#D4B483>类型</color>会改变下面的行，而且这些行在各类型之间共用。<color=#D4B483>弧</color>以弧度为单位，小于一整圈就会形成扇形

  <color=#5EC8C8><b>提示：</b></color>把<b>扩散</b>设为“循环”，就是经典的旋转发射器

  此按钮旁的<b>重置</b>也会重置<color=#D4B483>类型</color>，形状也随之重置

  更多：<link="https://bullethero.space/zh/docs/editor/craft/composition-and-camera"><color=#59A6FF>构图</color></link>
hint_editor_inspector-effect_shape_header: "形状"
hint_editor_inspector-keyframe_body: |-
  <b>选中项涉及的所有轨道会同时显示</b>，而不只是你最后点击的那一条。数值为空表示选中的关键帧在这一项上<b>不一致</b>

  <color=#5EC8C8><b>提示：</b></color><b>缓动</b>可跨轨道生效，并作为<b>一次撤销步骤</b>提交

  <color=#B48CE0><b>须知：</b></color>选中多个关键帧时<b>帧</b>会被锁定，因为一个数字会把它们全部压到同一帧上。请改为在时间轴上拖动它们

  更多：<link="https://bullethero.space/zh/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>编辑器的思路</color></link>
hint_editor_inspector-keyframe_header: "关键帧检视器"
hint_editor_inspector-object_body: |-
  选中物体自身的字段。所有类型都会显示共有的空物体字段，形状、特效、文本和预制件物体会在其下方添加各自的字段

  <b>活动</b>会同时关闭渲染<i>和</i>碰撞，并由子物体继承：在这里隐藏的物体无法杀死玩家

  <color=#E86A5A><b>注意：</b></color><b>图层</b>相对于父级。旁边只读的全局图层才是渲染器实际使用的值

  <color=#5EC8C8><b>提示：</b></color>在来自预制件的物体上编辑字段，会记录一个<b>实例覆盖</b>，旁边的复选框会显示它，也可以将其还原

  更多：<link="https://bullethero.space/zh/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>编辑器的思路</color></link>
hint_editor_inspector-object_header: "物体检视器"
hint_editor_inspector-resolved_body: |-
  选中物体在当前帧上<b>实际是</b>什么，数值读取自正在运行的模拟，而不是你编写的内容

  行末的方块表示该字段的关键帧状态：蓝色表示此帧上有关键帧（点击方块即可选中它），琥珀色表示在关键帧之间插值，灰色表示位于关键帧范围之外、数值保持不变，空心表示没有关键帧、使用默认值。箭头会把播放头移到上一个或下一个关键帧

  分隔线下方是组合值：累加后的图层、继承的“活动”状态，以及经父级组合的变换。它们不由任何关键帧设定，所以没有状态指示

  更多：<link="https://bullethero.space/zh/docs/editor/reference/object-properties"><color=#59A6FF>物体属性</color></link>
hint_editor_inspector-resolved_header: "当前值"
hint_editor_inspector_audio-span-fit: "把轨道拉伸到音频片段在关卡结束前能容纳的最大长度。没有可解析的音频片段，或速度为零时不可用，因为冻结的轨道没有可适配的长度"
hint_editor_inspector_audio-span-fit-level: "同时延长轨道和关卡，直到整个音频片段都能容纳。关卡只会变长，如果片段已经能容纳，则不做任何改动"
hint_editor_inspector_collider-id_body: |-
  物体用来<b>击中</b>玩家的范围，与它绘制的内容是两个独立的选择

  <color=#B48CE0><b>须知：</b></color>两者互不推导，这是有意为之：绘制出来却无害的预警光束、比其所覆盖图形更简单的判定框、隐形墙，都是普通内容，而不是取巧手段

  <color=#5EC8C8><b>提示：</b></color>两个字段都从同样的两个集合中选择，因此关卡自己创建的形状可以用作其中之一，也可以同时用作两者

  更多：<link="https://bullethero.space/zh/docs/editor/craft/readability-and-fairness"><color=#59A6FF>可读性与公平性</color></link>
hint_editor_inspector_collider-id_header: "碰撞体"
hint_editor_inspector_ease_body: |-
  数值如何从上一个关键帧到达这一个关键帧

  <color=#B48CE0><b>须知：</b></color>缓动属于关键帧的<b>进入</b>一侧，所以轨道的第一个关键帧没有可以缓动的起点，它的选择不会体现出来

  <color=#5EC8C8><b>提示：</b></color>选中多个关键帧时，选择会作为<b>一次撤销步骤</b>应用到所有关键帧，即使它们分属不同轨道和物体。选择为空表示它们不一致

  更多：<link="https://bullethero.space/zh/docs/editor/basics/keyframes-and-easing"><color=#59A6FF>关键帧与缓动</color></link>
hint_editor_inspector_ease_header: "缓动"
hint_editor_inspector_global-layer: "渲染器实际使用的绘制顺序：此物体自身的图层加上所有祖先的图层。只读，因为它是计算得出的，而不是存储的"
hint_editor_inspector_layer_body: |-
  绘制顺序，<b>相对于父级</b>，而不是绝对值

  <color=#E86A5A><b>注意：</b></color>渲染器使用的是这个数字加上所有祖先的图层，结果以只读方式显示在下方的<b>全局</b>中。更换父级会改变物体的绘制位置，即使这个数字保持不变

  <color=#B48CE0><b>须知：</b></color>随机值与实际生效的图层绑定，所以在层级中移动物体会重新随机这些值

  更多：<link="https://bullethero.space/zh/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>编辑器的思路</color></link>
hint_editor_inspector_layer_header: "图层"
hint_editor_inspector_object-type: "这是哪种物体。更改类型会替换整个物体：保留共有字段，丢弃新类型无法容纳的内容"
hint_editor_inspector_parent: "此物体跟随哪个物体。父级会把自己的变换叠加到子物体上，图层也沿着链条累加，因此更换父级也会改变物体的绘制顺序"
hint_editor_inspector_shader-type_body: |-
  此物体采用哪条渲染路径

  <color=#E86A5A><b>注意：</b></color><b>自动</b>只在关卡加载时决定一次，且从不改变关卡的外观：凡是无法根据Alpha证明为不透明的内容，都会变为透明

  <color=#5EC8C8><b>提示：</b></color>此字段旁边的标签显示“自动”实际解析成了什么，直接读取自渲染器的数据

  更多：<link="https://bullethero.space/zh/docs/editor/performance/level-budget"><color=#59A6FF>关卡预算</color></link>
hint_editor_inspector_shader-type_header: "着色器类型"
hint_editor_inspector_shape-id_body: |-
  此物体<b>绘制</b>什么

  <color=#B48CE0><b>须知：</b></color>形状是适配到其框内的真实几何体，较长的轴上恰好为1，因此物体的矩形就是屏幕上显示的内容。游戏生成了约500种形状，关卡还可以添加自己的形状

  <color=#5EC8C8><b>提示：</b></color>留空也是有效的：不绘制任何内容但带有碰撞体的物体，就是一堵隐形墙

  更多：<link="https://bullethero.space/zh/docs/editor/craft/readability-and-fairness"><color=#59A6FF>可读性与公平性</color></link>
hint_editor_inspector_shape-id_header: "形状"
hint_editor_inspector_span_body: |-
  此物体存在的时间，是一个半开区间：包含起始帧，不包含结束帧。在20结束的物体和从20开始的物体，永远不会在那一帧同时绘制

  <color=#B48CE0><b>须知：</b></color>子物体的时段必须位于父级的时段之内，但这是在读取时解析的，从不存储。缩短父级，子物体会被裁剪，再把父级延长回来，它们就会恢复。超出关卡结尾的根物体只是永远不会播放

  <b>锚点</b>让一条边跟随父级的边，并决定播放的内容：带锚点的子物体会随着父级变长而拉伸。它的动画仍保持你编写的时间安排

  更多：<link="https://bullethero.space/zh/docs/editor/basics/frames-and-time"><color=#59A6FF>帧、时间与关卡长度</color></link>
hint_editor_inspector_span_header: "时段"
hint_editor_interop-report: "从其他游戏的格式转换时，哪些内容保留了下来，哪些没有。条目仅供参考：关卡已经加载，这里说明它与原版有哪些不同"
hint_editor_level-export_body: |-
  把此关卡写到游戏之外，可以是文件夹，也可以是单个归档包。关卡使用的所有内容都会随之一起带走，包括关卡文件夹之外的歌曲

  普通的<b>.zip</b>无需安装任何软件即可在Windows资源管理器中打开。带密码的选项则不行：<b>+密码</b>可用7-Zip或其他任何压缩软件打开，<b>（gpg）</b>需用gpg打开

  <color=#5EC8C8><b>提示：</b></color>任何无法带走的内容，比如通过URL引用的资源、没有被任何内容引用的文件，都会在之后的报告中列出

  <color=#E8B04B><b>警告：</b></color>密码不是DRM。任何同时拥有文件和密码的人，始终都能打开它

  更多：<link="https://bullethero.space/zh/docs/editor/workflow/sharing-by-hand"><color=#59A6FF>手动分享关卡</color></link>
hint_editor_level-export_header: "导出关卡"
hint_editor_level-protection_body: |-
  在磁盘上加密此关卡的文档，打开关卡时会要求输入密码。元数据、封面和媒体文件仍然可读，所以没有密码也能显示关卡卡片

  每次会话只询问一次密码，且仅保存在内存中。要移除保护，请将字段留空并按<b>应用</b>

  <color=#E86A5A><b>注意：</b></color>忘记的密码无法找回。任何地方都不会保存密钥

  更多：<link="https://bullethero.space/zh/docs/editor/reference/export-and-protection"><color=#59A6FF>导出与保护</color></link>
hint_editor_level-protection_header: "保护关卡"
hint_editor_prefab-flatten-recursive_body: |-
  关：只有你选中的这个放置不再跟随模板。放置在它内部的预制件保留自己的链接，所以编辑那个内部模板仍会影响本关卡。这是默认值

  开：所有嵌套的内容也一并展平，关卡中不再有任何内容链接到这些内部模板，无论嵌套多深

  无论哪种方式，模板本身都会保留在关卡中，一次展平只占一步撤销

  更多：<link="https://bullethero.space/zh/docs/editor/reference/prefab-mode"><color=#59A6FF>预制件模式</color></link>
hint_editor_prefab-flatten-recursive_header: "同时展平嵌套的预制件"
hint_editor_prefab-mode_body: |-
  <color=#E86A5A><b>注意：</b></color>你正在编辑预制件<b>模板</b>，而不是它的某一个放置。保存会把改动带到引用此模板的每一个放置

  在这里做的编辑不会记录实例覆盖。覆盖只会在此模式之外编辑某个放置中的物体时产生

  <color=#5EC8C8><b>提示：</b></color>此模板内的放置会在上层打开它自己的模板，“保存并关闭”会带你回到这里。嵌套最多8层

  更多：<link="https://bullethero.space/zh/docs/editor/workflow/reuse"><color=#59A6FF>复用：预制件、复制、生成器</color></link>
hint_editor_prefab-mode_header: "预制件模式"
hint_editor_search-palette_body: |-
  两种模式。<b>运行命令</b>按名称查找任意编辑器操作，与工具栏和右键菜单执行的是同一批操作。<b>搜索内容</b>查找当前范围内的物体和音频轨道

  <color=#B48CE0><b>须知：</b></color>两种模式都不包含资源：每个资源都通过需要它的那个字段来选择

  更多：<link="https://bullethero.space/zh/docs/editor/workflow/speed-and-shortcuts"><color=#59A6FF>速度与快捷键</color></link>
hint_editor_search-palette_header: "命令面板"
hint_editor_search-picker: "所有资源字段共用的选择器。输入文字即可为列表排序。筛选器按类型缩小范围，当字段只接受一个域时，右侧会出现一个标签"
hint_editor_theme-ref_body: |-
  让这个颜色指向<b>关卡主题中的槽位</b>，而不是一个固定值。主题改变时，所有引用该槽位的内容会同时换色

  <color=#5EC8C8><b>提示：</b></color>色块显示的是你正在编辑的关键帧所在帧的调色板，而不是播放头处的。要按更靠后的外观取色，请编辑位置更靠后的关键帧

  更多：<link="https://bullethero.space/zh/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>颜色、主题与后期处理</color></link>
hint_editor_theme-ref_header: "主题颜色引用"
hint_editor_timeline-audio_body: |-
  关卡的音频轨道及其波形，方便你让内容与听到的声音对齐

  <color=#5EC8C8><b>提示：</b></color>检视器中的<b>适配轨道</b>会把轨道调整为其音频片段的实际长度。没有片段或速度为0时不可用

  <color=#E86A5A><b>注意：</b></color>检视器中的<b>音量</b>滑块是轨道的推子。用关键帧控制的音量是局部时间轴上一条单独的音量轨道，播放时两者相乘

  更多：<link="https://bullethero.space/zh/docs/editor/resources/preparing-the-track"><color=#59A6FF>准备音频轨道</color></link>
hint_editor_timeline-audio_header: "音频时间轴"
hint_editor_timeline-events_body: |-
  不属于任何物体的关卡级关键帧：
  - 相机的位置、旋转、缩放、轴心和震动
  - 标记和检查点
  - 屏幕限制
  - 背景和主题
  - 所有后期效果
  - 玩家的可见性、控制、碰撞、尺寸和速度

  <color=#B48CE0><b>须知：</b></color><b>节拍</b>轨道是这里的例外。它的条目带有时段，所以它是边缘和剪刀工具唯一能作用的轨道

  <color=#5EC8C8><b>提示：</b></color>颜色可以指向关卡主题，而不是保存固定值。这样只需改一次主题，这些颜色就会全部换色

  更多：<link="https://bullethero.space/zh/docs/editor/craft/composition-and-camera"><color=#59A6FF>构图与相机</color></link>
hint_editor_timeline-events_header: "事件时间轴"
hint_editor_timeline-level_body: |-
  每个物体一个片段，片段所在的行就是它的<b>图层</b>。片段就是物体的<b>时段</b>：占据第10至19帧的片段，恰好结束在从第20帧开始的片段的起点

  <color=#B48CE0><b>须知：</b></color>子物体只在父级的时段内播放，但你创作的内容不会被裁掉。把父级重新拉长，子物体就会回来

  <color=#5EC8C8><b>提示：</b></color><b>选择</b>用于选中和拖动，<b>边缘</b>用于调整边缘，<b>剪刀</b>在光标处切开片段。右键单击空白处可打开菜单

  更多：<link="https://bullethero.space/zh/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>编辑器的思路</color></link>，<link="https://bullethero.space/zh/docs/editor/craft/composition-and-camera"><color=#59A6FF>构图与相机</color></link>
hint_editor_timeline-level_header: "关卡时间轴"
hint_editor_timeline-local_body: |-
  <b>选中物体</b>的关键帧，每条轨道一行。帧从物体时段的起点开始计数，所以移动物体时，它的整段动画也随之移动

  <color=#B48CE0><b>须知：</b></color><b>空轨道是有效数据</b>。它使用默认值，所以新物体在你添加关键帧之前不会有任何动画

  更多：<link="https://bullethero.space/zh/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>编辑器的思路</color></link>
hint_editor_timeline-local_header: "局部时间轴"
hint_editor_timeline-prefab_body: |-
  预制件模式专属的时间轴，显示<b>模板</b>中的物体。它的长度是模板自身的长度，而不是某个放置的时段

  <color=#E8B04B><b>警告：</b></color>这里的选中项不与编辑器其他部分共享。在这里的编辑会改变模板，并扩散到它的每一个放置

  更多：<link="https://bullethero.space/zh/docs/editor/workflow/reuse"><color=#59A6FF>复用：预制件、复制、生成器</color></link>
hint_editor_timeline-prefab_header: "预制件时间轴"
hint_editor_value-type-color: "每次播放时颜色的来源。“数值”：按写入的值。“主题”：该帧上主题的槽位，会随主题变化。“随机区间”：每个通道各自随机，颜色可能落在两者之间的任意位置。“A到B随机”：所有通道共用一次随机，颜色始终位于从A到B的直线上"
hint_editor_value-type-number: "每次播放时这个数如何确定。“数值”：按写入的数。“随机区间”：两个边界之间的一个数。“随机区间，步长”：同上，但吸附到该大小的网格上。这里没有“A到B随机”，因为一个分量本来就只取一个数。随机值按地址计算，而不是抽取，所以同一关卡在任何设备上表现都相同，而移动物体或改变其图层会重新随机"
hint_editor_value-type-vector: "每次播放时这个向量如何确定。“数值”：按写入的数。“矩形内随机”：每个轴在自己的两个边界之间各自随机，填满整个矩形。“A到B随机”：只随机一次，所有轴都在同一位置读取，所以点沿从A到B的直线移动。某个轴两端的数相同时，它保持不动。“圆内随机”：围绕中心的圆盘上的一个点。带步长的形式会把结果吸附到网格上。随机值按地址计算，而不是抽取，所以同一关卡在任何设备上表现都相同"
hint_gen_audio_waveform_body: |-
  生成描绘音频轨道形状的物体，让关卡在画面上跟随听到的声音

  更多：<link="https://bullethero.space/zh/docs/editor/workflow/reuse"><color=#59A6FF>复用：预制件、复制、生成器</color></link>
hint_gen_audio_waveform_header: "音频波形"
hint_gen_beat_flash_body: |-
  在每个节拍上放置一次闪光。节拍来自关卡的节拍图，没有节拍图时则来自标记，所以闪烁的正是你在网格上看到的节拍

  更多：<link="https://bullethero.space/zh/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>节奏与结构</color></link>
hint_gen_beat_flash_header: "节拍闪光"
hint_gen_bullet_homing_body: |-
  朝玩家预计所在位置弯曲的子弹。弯曲轨迹在创作时就已写定，而不是在播放时计算：在任何设备上结果都完全相同

  更多：<link="https://bullethero.space/zh/docs/editor/craft/readability-and-fairness"><color=#59A6FF>可读性与公平性</color></link>
hint_gen_bullet_homing_header: "追踪弹"
hint_gen_bullet_laser_sweep_body: |-
  扫过场地的光束。预警和致命阶段是两个独立的物体，因此可以只绘制警告而不让它造成伤害

  更多：<link="https://bullethero.space/zh/docs/editor/craft/readability-and-fairness"><color=#59A6FF>可读性与公平性</color></link>
hint_gen_bullet_laser_sweep_header: "激光扫射"
hint_gen_bullet_rain_body: |-
  在一段时间内落向一片区域的子弹。密度和扩散都是参数。每颗子弹的落点取自关卡的种子，因此每次游玩都能重现

  更多：<link="https://bullethero.space/zh/docs/editor/craft/readability-and-fairness"><color=#59A6FF>可读性与公平性</color></link>
hint_gen_bullet_rain_header: "弹幕雨"
hint_gen_bullet_spiral_body: |-
  沿旋转的臂发射的子弹，形成经典的螺旋弹幕墙

  更多：<link="https://bullethero.space/zh/docs/editor/craft/readability-and-fairness"><color=#59A6FF>可读性与公平性</color></link>
hint_gen_bullet_spiral_header: "螺旋弹幕"
hint_gen_bullet_wave_body: |-
  一排齐头并进的子弹。最基础的弹幕模式，也最值得先读：它的参数命名了其他子弹生成器沿用的概念

  更多：<link="https://bullethero.space/zh/docs/editor/craft/readability-and-fairness"><color=#59A6FF>可读性与公平性</color></link>
hint_gen_bullet_wave_header: "弹幕波"
hint_gen_capacity_hint_body: |-
  写入关卡的建议上限：它预计同时需要多少物体和特效

  <color=#B48CE0><b>须知：</b></color>它不会改变任何可见的内容。运行时用它预先分配缓冲区，而不是在关卡中途扩容，中途扩容正是卡顿的来源

  更多：<link="https://bullethero.space/zh/docs/editor/performance/level-budget"><color=#59A6FF>关卡预算</color></link>
hint_gen_capacity_hint_header: "容量预估"
hint_gen_font_cache_body: |-
  收集关卡文本实际用到的每个字符并烘焙，这样任何字形都不必在首次出现时才准备

  <color=#7FC97F><b>建议：</b></color>在文本定稿后运行。之后添加且未重新烘焙的字符，会在首次显示时造成一次卡顿

  更多：<link="https://bullethero.space/zh/docs/editor/resources/images-and-fonts"><color=#59A6FF>图片与字体</color></link>
hint_gen_font_cache_header: "字体缓存"
hint_gen_geometry_fractal_body: |-
  把一个形状以逐级缩小的比例重复嵌套进自身。深度对物体数量的消耗呈指数增长，所以每次只调高一级

  更多：<link="https://bullethero.space/zh/docs/editor/workflow/reuse"><color=#59A6FF>复用：预制件、复制、生成器</color></link>
hint_gen_geometry_fractal_header: "分形"
hint_gen_geometry_grid_body: |-
  用均匀排列的形状副本填满一个矩形

  更多：<link="https://bullethero.space/zh/docs/editor/workflow/reuse"><color=#59A6FF>复用：预制件、复制、生成器</color></link>
hint_gen_geometry_grid_header: "网格"
hint_gen_geometry_polygon_body: |-
  在正多边形的顶点或边上放置形状

  更多：<link="https://bullethero.space/zh/docs/editor/workflow/reuse"><color=#59A6FF>复用：预制件、复制、生成器</color></link>
hint_gen_geometry_polygon_header: "多边形"
hint_gen_geometry_radial_body: |-
  把副本沿圆周分布。大多数对称图案的基础

  更多：<link="https://bullethero.space/zh/docs/editor/workflow/reuse"><color=#59A6FF>复用：预制件、复制、生成器</color></link>
hint_gen_geometry_radial_header: "环形"
hint_gen_geometry_spiral_body: |-
  把副本沿螺旋线分布，半径和角度同步增长

  更多：<link="https://bullethero.space/zh/docs/editor/workflow/reuse"><color=#59A6FF>复用：预制件、复制、生成器</color></link>
hint_gen_geometry_spiral_header: "螺旋"
hint_gen_level_afterbeat_body: |-
  把Afterbeat（原Project Arrhythmia）的关卡转换为本格式

  <color=#E8B04B><b>警告：</b></color>并非所有内容都能转换过来。未转换的内容会在之后的转换报告中列出。关卡无论如何都能加载，报告会说明它与原版有哪些不同

  更多：<link="https://bullethero.space/zh/docs/editor/performance/afterbeat-import"><color=#59A6FF>从Afterbeat导入</color></link>
hint_gen_level_afterbeat_header: "导入Afterbeat关卡"
hint_gen_level_archive_body: |-
  从本游戏写出的归档包构建关卡，格式为.tar.gz或.zip，两者都可以设置密码。类型根据文件字节判断，所以改过名的归档包也能打开。旧版本生成的归档包会在导入时迁移

  <color=#E8B04B><b>警告：</b></color>默认情况下，导入的关卡会获得自己的ID，因此不会覆盖本机上已有的关卡。只有在要找回本机曾经保存过的关卡时才关闭此选项

  更多：<link="https://bullethero.space/zh/docs/editor/reference/generators"><color=#59A6FF>生成器</color></link>
hint_gen_level_archive_header: "导入关卡归档包"
hint_gen_level_audio_file_body: |-
  从一首曲目开始创建关卡：导入音频，按曲目长度设定关卡长度，并把你带到空白时间轴的开头

  更多：<link="https://bullethero.space/zh/docs/editor/resources/preparing-the-track"><color=#59A6FF>准备音频轨道</color></link>
hint_gen_level_audio_file_header: "从音频文件创建关卡"
hint_gen_level_empty_body: |-
  把关卡完全清空。所有创作的内容都会被移除，所以要从头开始而不是修改时，就用它

  更多：<link="https://bullethero.space/zh/docs/editor/basics/first-level"><color=#59A6FF>第一个关卡：路线</color></link>
hint_gen_level_empty_header: "空白关卡"
hint_gen_section_additional: "主要参数之上的细化设置。这里的默认值通常就够用"
hint_gen_section_main: "决定这个生成器产出什么的参数。从这里开始"
hint_gen_test_camera_flash_body: "开发用生成器，用于测试相机事件轨道。不用于创作内容"
hint_gen_test_camera_flash_header: "相机闪光（测试）"
hint_gen_test_form_body: "开发用生成器，覆盖表单能构建的每一种参数控件。不用于创作内容"
hint_gen_test_form_header: "表单（测试）"
hint_gen_test_odd_body: "开发用生成器，包含故意设计的刁钻参数情形。不用于创作内容"
hint_gen_test_odd_header: "怪异（测试）"
hint_gen_test_partial_order_body: "开发用生成器，检查排序提示未提及的字段如何布局。不用于创作内容"
hint_gen_test_partial_order_header: "部分排序（测试）"
hint_gen_test_scatter_body: "开发用生成器，用于测试寻址式随机的代码路径。不用于创作内容"
hint_gen_test_scatter_header: "散布（测试）"
hint_gen_test_sections_body: "开发用生成器，生成包含多个分区的表单。不用于创作内容"
hint_gen_test_sections_header: "分区（测试）"
hint_gen_test_spawn_body: "开发用生成器，用于测试物体创建的代码路径。不用于创作内容"
hint_gen_test_spawn_header: "生成（测试）"
hint_gen_texture_objects_body: |-
  把图片转换为物体，每个格子一个，这样图片就成了关卡内容，可以像其他内容一样制作动画

  更多：<link="https://bullethero.space/zh/docs/editor/resources/images-and-fonts"><color=#59A6FF>图片与字体</color></link>
hint_gen_texture_objects_header: "纹理物体"
hint_level-preview_authors: "这个关卡署名的所有人。作者信息保存在关卡文件夹中，所以即使被打包、转发并由他人重新上传也不会丢失"
hint_level-preview_licenses_body: |-
  这个关卡及其资源所适用的条款。<b>条件按每个资源分别记录</b>，因此由借用部件组成的关卡会准确说明借用了什么、依据什么条款

  <color=#7FC97F><b>建议：</b></color>在复用他人关卡中的任何内容之前，先阅读这些条款

  更多：<link="https://bullethero.space/zh/docs/editor/rights/licensing-basics"><color=#59A6FF>许可证：三分钟了解全部</color></link>
hint_level-preview_licenses_header: "许可证"
hint_level_backups: "这个关卡的所有自动副本，最新的在最上面，名称就是创建的时间。选择其中一个之前不会读取任何内容。恢复会替换磁盘上的关卡文件并重新加载，被替换的文件会先写入备份，所以恢复本身也可以撤销"
hint_level_core-framerate: "直接修改这个值会让所有物体一起变快或变慢：关键帧保留各自的帧号，所以同一个关卡会以不同的速度播放。要把内容重新映射到另一个帧率，请使用生成器"
hint_level_core-level-id: "关卡的永久标识符，在创建时生成一次，之后永不修改。报告关卡问题时请附上它，也可以用它区分同一关卡的两个副本"
hint_level_core-orientation_body: |-
  这个关卡游玩时设备应以哪个方向握持

  <b>水平</b>和<b>垂直</b>会在关卡期间旋转玩家的设备，优先于玩家自己的设置。在桌面端，垂直关卡会在两侧留出边栏来播放，这是预期的样子

  <b>未指定</b>把选择留给玩家，这等于<b>声明</b>关卡在<b>两种</b>方向下都能正确显示。游戏不会为此重新取景或缩放任何内容，所以请先在两个方向上都检查一遍关卡

  更多：<link="https://bullethero.space/zh/docs/editor/reference/level-settings"><color=#59A6FF>关卡设置</color></link>
hint_level_core-orientation_header: "关卡方向"
hint_level_core-runtime-seed: "当前编辑器会话实际使用的种子。上方没有设置种子时，每次加载关卡都会得到一个新数字。“重新生成”会再掷一个，不改动关卡"
hint_level_core-seed: "关卡中的每个随机值都由这个种子加上各物体自己的图层和起始帧得出，所以同一种子每次播放都相同。0表示没有种子：游戏每次启动都会生成一个新的"
hint_level_core_body: |-
  帧长度、帧率和关卡的两个种子

  <color=#B48CE0><b>须知：</b></color><b>帧从1开始计数。</b>一个N帧的关卡包含第1帧到第N帧，N+1是结束边界，不是一帧

  <b>关卡种子</b>属于关卡本身，修改可以撤销。0表示“每次运行都用新种子”，这也是默认值

  <color=#5EC8C8><b>提示：</b></color><b>运行种子</b>显示当前编辑器会话实际得到的种子。<i>重新生成</i>只为本次会话换一个新的，不写入任何内容，也不进入撤销记录

  更多：<link="https://bullethero.space/zh/docs/editor/basics/frames-and-time"><color=#59A6FF>帧、时间与关卡长度</color></link>
hint_level_core_header: "基本"
hint_level_dangerous_body: |-
  会销毁或重写文件（而不是内容）的操作

  <color=#E86A5A><b>注意：</b></color><b>文件格式</b>下拉菜单会重写磁盘上的关卡及其元数据。以另一种格式重写时，<b>旧格式留下的文件会被删除</b>。除此之外什么都不会发生：不重新加载，不重新模拟，也不重置你的选中项或撤销栈，因为内存中的模型本来就与写入的内容完全一致

  <color=#E86A5A><b>注意：</b></color><b>删除关卡</b>会从磁盘上删除关卡文件夹。这一步无法撤销

  更多：<link="https://bullethero.space/zh/docs/editor/workflow/not-losing-work"><color=#59A6FF>避免丢失工作</color></link>
hint_level_dangerous_header: "危险区域"
hint_level_effect-editor_body: |-
  制作粒子特效并在画布上预览

  <color=#B48CE0><b>须知：</b></color>这里的参数组与特效检视器中显示的相同，但在这里作为<b>草稿</b>编辑：保存之前，任何改动都不会进入关卡

  <color=#5EC8C8><b>提示：</b></color>保存到本设备的共享库，即可在多个关卡之间复用这个特效

  更多：<link="https://bullethero.space/zh/docs/editor/performance/level-budget"><color=#59A6FF>关卡预算</color></link>
hint_level_effect-editor_header: "特效编辑器"
hint_level_font-cache: "关卡预先烘焙哪些字形（按字体和语言分别列出），这样某个字符第一次出现时文本不会卡顿。只读：字体缓存生成器会根据关卡实际包含的文本来填充它，这个标签页上没有任何东西能编辑它"
hint_level_history_body: |-
  本次会话中的每次编辑都是这里的一行，最新的在最上面，就像git log。最左边一列是主线，单独的一列是你撤销后换了另一条路而离开的分支。圆环标出你当前的位置，绿色圆点标出上次保存

  点击某一行会把关卡逐步退回到那个确切的状态，每帧执行一个操作。历史只存在于本次会话中，从不写入磁盘

  <color=#E8B04B><b>警告：</b></color>回退进行期间编辑器处于只读状态。“取消”会让它停在当前位置，而那始终是一个真实的状态

  更多：<link="https://bullethero.space/zh/docs/editor/reference/level-settings"><color=#59A6FF>关卡设置</color></link>
hint_level_history_header: "历史"
hint_level_library-browser_body: |-
  保存在<b>本设备</b>上的资源，你在这里打开的所有关卡都能共用

  <color=#B48CE0><b>须知：</b></color>导入会把资源复制<i>到关卡中</i>。关卡自带所需的一切，所以库只是为你提供便利，绝不会成为游玩你关卡的人的依赖

  更多：<link="https://bullethero.space/zh/docs/editor/workflow/reuse"><color=#59A6FF>复用：预制件、复制、生成器</color></link>
hint_level_library-browser_header: "库"
hint_level_metadata-logo: "以<color=#D4B483>logo.png</color>的名称复制到关卡文件夹，并在所有列出该关卡的地方显示。按正方形<color=#D4B483>512x512</color>的<color=#D4B483>PNG</color>设计：更小的图片在浏览器中会发糊，更大的只会占用空间。“移除”只清除引用，文件本身仍留在文件夹中"
hint_level_metadata-tags_body: |-
  标签是你自己的词语，按你写的样子原样显示，从不翻译。玩家在关卡浏览器中按标签筛选，所以只有其他关卡也在用的标签才有帮助

  用逗号分隔。保持简短而通用：一种类型、一种氛围、一种机制

  更多：<link="https://bullethero.space/zh/docs/editor/reference/level-settings"><color=#59A6FF>关卡设置</color></link>
hint_level_metadata-tags_header: "关卡标签"
hint_level_metadata_body: |-
  关于关卡、但不属于关卡本身的一切：名称、描述、封面、许可证、年龄分级和作者

  <color=#B48CE0><b>须知：</b></color>名称和描述是<b>本地化字符串</b>：你直接在这里按语言分别编写文本，不涉及任何键，因为关卡是内容，而不是游戏界面的一部分。如果玩家的语言你没有填写，就会显示你填写的第一条

  许可证和作者会随关卡一起被分享到任何地方，正是这一点让署名在重新上传后依然保留

  更多：<link="https://bullethero.space/zh/docs/editor/reference/metadata-and-sharing"><color=#59A6FF>元数据与分享关卡</color></link>
hint_level_metadata_header: "元数据"
hint_level_play-seed: "0表示使用关卡自己的种子，或每次运行用新种子"
hint_level_play_body: |-
  <color=#B48CE0><b>须知：</b></color>这些启动选项<b>只对这一次运行</b>有效，这里的任何设置都不会保存到关卡中

  <color=#5EC8C8><b>提示：</b></color>生命、速度、检查点和自动游玩让你无需编辑就能反复练习某一段。这里的<b>种子</b>优先于关卡自己的种子：它是三层中的最高一层，想要重放刚刚看到的那一次运行时就用它

  更多：<link="https://bullethero.space/zh/docs/editor/craft/difficulty-curve"><color=#59A6FF>难度与曲线</color></link>
hint_level_play_header: "游玩"
hint_level_raw-add: "向打开此窗口时所在的槽位添加一个元素。这里只提供新元素自身的叶字段，所有嵌套内容保持默认值，之后在树中编辑"
hint_level_raw_body: |-
  整个保存的关卡模型，呈现为一棵字段树：即文件本身，在编辑器处理之前的样子

  <color=#E86A5A><b>注意：</b></color><b>这里的任何内容都不做校验。</b>它会写入编辑器其他部分认为不可能的值，所以请在手边保留一份关卡文件夹的副本

  实心圆点表示你在本次会话中修改了这个字段，空心圆点表示它内部有内容被修改。<b>应用</b>会把整个会话作为一次可撤销的操作提交

  更多：<link="https://bullethero.space/zh/docs/editor/workflow/not-losing-work"><color=#59A6FF>避免丢失工作</color></link>
hint_level_raw_header: "原始数据"
hint_level_resource-meta_body: |-
  单个资源的标题、描述、来源、许可证和作者

  <color=#B48CE0><b>须知：</b></color>署名正是这样得以保留：从别处取来的纹理、字体或音频文件，会在关卡内部记录它的来源和使用条款，无论关卡去往何处

  <color=#7FC97F><b>建议：</b></color>在添加资源时就填写，那是你唯一还记得这些信息的时候

  更多：<link="https://bullethero.space/zh/docs/editor/rights/resource-record"><color=#59A6FF>资源的记录</color></link>
hint_level_resource-meta_header: "资源元数据"
hint_level_resources-audios: "这个关卡携带的音频文件。先在这里添加，再把它作为音频轨道放到音频时间轴上"
hint_level_resources-effects_body: |-
  关卡可以放置的<color=#D4B483>VFX Graph</color>粒子特效。它们是<b>可选的</b>：不使用特效的关卡也会完全按设计播放

  特效使用关卡带种子的随机数，因此在任何设备上重放结果都相同。特效可以导出到本设备的共享库

  更多：<link="https://bullethero.space/zh/docs/editor/performance/level-budget"><color=#59A6FF>关卡预算</color></link>
hint_level_resources-effects_header: "特效"
hint_level_resources-fonts: "这个关卡携带的字体，供它的文本物体使用。和其他资源一样，字体存放在关卡旁边，随关卡一起转移"
hint_level_resources-prefabs_body: |-
  可复用的物体组。预制件保存模板物体，每次放置都会得到它们的真实副本。编辑模板会影响每个放置，而单个放置仍可以通过实例覆盖与模板不同

  <color=#E8B04B><b>警告：</b></color>与主题、特效和碰撞体不同，预制件<b>没有游戏内置预设</b>，在关卡之间转移预制件的唯一方式是本设备的共享库

  更多：<link="https://bullethero.space/zh/docs/editor/workflow/reuse"><color=#59A6FF>复用：预制件、复制、生成器</color></link>
hint_level_resources-prefabs_header: "预制件"
hint_level_resources-shapes_body: |-
  关卡自己的形状，在游戏生成的约500种之外另加。形状是贴合其包围框的<b>真实几何体</b>，因此物体的矩形就是它绘制的内容

  <color=#5EC8C8><b>提示：</b></color>形状和碰撞体是同一类数据，物体引用其中一个决定绘制什么，引用另一个决定被击中的范围。两者互不推导，因此无害的预警光束或隐形墙都只是普通内容

  更多：<link="https://bullethero.space/zh/docs/editor/resources/level-needs"><color=#59A6FF>关卡需要什么</color></link>
hint_level_resources-shapes_header: "形状"
hint_level_resources-textures_body: |-
  这个关卡携带的图片。<b>游戏本身不附带任何纹理</b>，关卡用到的每张纹理都在这里添加，并存放在关卡文件夹中，因此会随关卡一起转移

  <color=#B48CE0><b>须知：</b></color>形状<b>不是</b>纹理。它们是真实几何体，不需要这个标签页里的任何东西

  更多：<link="https://bullethero.space/zh/docs/editor/resources/images-and-fonts"><color=#59A6FF>图片与字体</color></link>
hint_level_resources-textures_header: "纹理"
hint_level_resources-themes_body: |-
  主题是<b>关卡颜色可以引用的调色板</b>，颜色不必直接保存具体数值。切换活动主题会为所有引用它的内容重新配色，而切换本身以关键帧的形式放在事件时间轴上

  <color=#5EC8C8><b>提示：</b></color>把主题导出到本设备的共享库，即可在其他关卡中复用

  更多：<link="https://bullethero.space/zh/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>颜色、主题与后期处理</color></link>
hint_level_resources-themes_header: "主题"
hint_level_rules_body: |-
  校验在这个关卡中发现的问题：失效的引用、重复的ID、父级循环、嵌套过深的预制件、重叠的节拍段

  部分问题可以修复，逐个修复或使用<b>全部修复</b>。修复会先写入草稿：<b>保存</b>把它们作为一次可撤销的操作应用，<b>放弃</b>则丢弃它们。图结构问题（ID、父级、预制件嵌套）没有修复方案，这些是只有你能做的内容决定

  <color=#5EC8C8><b>提示：</b></color>子物体的时段超出父级<b>不会</b>被报告。要让时段相互适配，请从生成器中运行<color=#D4B483>时段适配</color>修改器

  更多：<link="https://bullethero.space/zh/docs/editor/workflow/not-losing-work"><color=#59A6FF>避免丢失工作</color></link>
hint_level_rules_header: "规则"
hint_level_shape-editor_body: |-
  用点和点之间的边构建形状。<b>三角形自动推导，不能编辑</b>，因此三个三角形共用的顶点只是一个可拖动的点

  <color=#E8B04B><b>警告：</b></color>格式存储的是三角形而不是边，没有闭合成环的边在保存时会被丢弃，编辑器会报告这一点

  更多：<link="https://bullethero.space/zh/docs/editor/resources/images-and-fonts"><color=#59A6FF>图片与字体</color></link>
hint_level_shape-editor_header: "形状编辑器"
hint_level_theme-editor_body: |-
  主题提供的槽位以及填充它们的颜色

  <color=#E86A5A><b>注意：</b></color>关卡内容引用的是槽位，因此<b>重新编号槽位会为所有引用它们的内容重新配色</b>，槽位的位置就是它的身份

  <color=#5EC8C8><b>提示：</b></color>把完成的主题保存到本设备的共享库，即可在其他关卡中复用

  更多：<link="https://bullethero.space/zh/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>颜色、主题与后期处理</color></link>
hint_level_theme-editor_header: "主题编辑器"
hint_menu_level-authors: "这个关卡的制作者，按关卡自己的元数据列出。“作者”按钮会打开带链接的完整列表"
hint_menu_level-bot_body: |-
  <b>机器人用你的操作方式替你游玩关卡</b>，它会像你一样移动、冲刺、受到伤害和死亡，而且不能作弊：同样的速度、同样的冲刺、同样的判定框

  <b>它不能保证关卡可以通关</b>：机器人永远不会疲劳，但依然会输。它还会在每一帧占用性能，因此在性能较弱的设备上帧率会降低

  能击败机器人的关卡值得提交：在<link="https://github.com/bullet-hero/releases/issues"><color=#59A6FF>bullet-hero/releases</color></link>中创建Issue，说明是哪个机器人在哪里输了，并附上关卡文件夹

  更多：<link="https://bullethero.space/zh/docs/editor/workflow/bot-playtest"><color=#59A6FF>让机器人游玩你的关卡</color></link>
hint_menu_level-bot_header: "机器人"
hint_menu_level-identity: "这个关卡实际上是哪一个：它所在的来源、统计记录所用的ID，以及当文件夹不以ID命名时存放它的文件夹。内置关卡和你制作的副本在此屏幕上的其他信息都相同，区别只在这几项"
hint_menu_level-lives: "一次游玩能承受多少次受击。在“禅”模式下你仍会被击中和击退，只是游玩永远不会结束。“自定义”可取滑块能达到的任意次数。“无碰撞”是单独的选项：任何东西都碰不到你，这类游玩单独记录成绩"
hint_menu_level-music: "音乐作者，按关卡自己的元数据记录。“许可证”按钮包含关卡携带的其他所有资源"
hint_menu_level-rating: "作者声明的年龄分级。开发者不会核查，关卡携带的是作者写下的内容"
hint_menu_level-record: "你在这个关卡上的个人记录，对应右侧当前选择的启动选项。改变生命、速度、检查点、机器人或“无碰撞”，记录也会随之改变：不同条件下的游玩是不同的成就，因此每组设置各自保留最佳成绩。尝试次数和通关次数统计每一次游玩，与设置无关"
hint_menu_level-seed: "关卡中所有随机值的来源数字。相同的种子在任何设备上都会产生相同的游玩，0表示关卡每次都重新生成一个"
hint_menu_level-speed: "关卡及其音乐的播放速度。“自定义”可取滑块能达到的任意速度，不限于三个预设"
hint_mod_content_remover_body: |-
  删除关卡中与你在此处所选条件匹配的内容

  <color=#E86A5A><b>注意：</b></color>它会改写已有内容而不是添加内容，所以运行前请先读懂参数：撤销只有一步，但那是唯一的回头路

  更多：<link="https://bullethero.space/zh/docs/editor/workflow/reuse"><color=#59A6FF>复用：预制件、复制、生成器</color></link>
hint_mod_content_remover_header: "内容移除"
hint_mod_framerate_remap_body: |-
  把关卡中的所有帧号换算到另一个帧率，使各个时间点以秒计仍落在原来的位置

  <color=#E8B04B><b>警告：</b></color>帧是整数，任何不能整除的数值都会被取整，一个关卡重映射两次后不一定能回到原样

  更多：<link="https://bullethero.space/zh/docs/editor/basics/frames-and-time"><color=#59A6FF>帧、时间与关卡长度</color></link>
hint_mod_framerate_remap_header: "帧率重映射"
hint_mod_prefab_flatten_body: |-
  把此范围内的每个预制件放置转换为普通物体。与模板的关联会断开，物体保持在原来的位置

  <color=#B48CE0><b>须知：</b></color>运行后关卡看起来完全一样：没有任何内容被删除或移动，每个放置的覆盖已经写入物体本身。除非你要求移除，模板会保留在关卡中

  更多：<link="https://bullethero.space/zh/docs/editor/reference/modifiers"><color=#59A6FF>修改器</color></link>
hint_mod_prefab_flatten_header: "展平预制件"
hint_mod_quantize_keyframes_body: |-
  将关键帧吸附到固定的步长上，手动摆放的松散动画就是这样对齐到节拍的

  <color=#E8B04B><b>警告：</b></color>落在同一帧上的两个关键帧会合并为一个，所以粗粒度的量化只会丢失细节，而不是压缩细节

  更多：<link="https://bullethero.space/zh/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>节奏与结构</color></link>
hint_mod_quantize_keyframes_header: "量化关键帧"
hint_mod_span_fit_body: |-
  让子物体的时段落在父级的时段之内：要么把子物体收进来，要么把父级向外扩展

  <color=#B48CE0><b>须知：</b></color>超出父级的子物体是合法数据，只是播放时会被裁掉，所以这是内容上的决定，而不是修复，也因此编辑器不会自动替你运行它。两种方式都不会改动锚点

  更多：<link="https://bullethero.space/zh/docs/editor/basics/frames-and-time"><color=#59A6FF>帧、时间与关卡长度</color></link>
hint_mod_span_fit_header: "时段适配"
hint_mod_span_stagger_body: |-
  在时间上错开选中项，让原本同时开始的物体一个接一个出现

  更多：<link="https://bullethero.space/zh/docs/editor/workflow/reuse"><color=#59A6FF>复用：预制件、复制、生成器</color></link>
hint_mod_span_stagger_header: "时段错开"
hint_mod_test_rename_body: "用于测试重命名路径的开发用生成器。不用于创作内容"
hint_mod_test_rename_header: "重命名（测试）"
hint_sandbox_attacks-auto: "随机波次自动出现，就像主菜单背景里那样"
hint_sandbox_attacks-fire: "每个按钮都会向你发出一波该攻击"
hint_sandbox_attacks-gap: "波次自动出现时，两波之间间隔的秒数"
hint_sandbox_controls-gyro: "开启体感，把它作为操控设备"
hint_sandbox_controls-mode: "你当前所用操控设备的模式，会立即保存并在整个游戏中生效"
hint_sandbox_game-bot: "把化身交给主菜单背景里游玩的那个机器人"
hint_sandbox_game-free-camera: "用鼠标中键或双指平移，用滚轮或双指捏合缩放。框线显示的是关卡相机所见的范围"
hint_sandbox_game-lives: "死亡前可承受的受击次数。死亡的过程与关卡中相同，之后化身回到中心"
hint_sandbox_game-speed: "只让攻击变慢或变快，化身保持自己的速度"
hint_sandbox_tutorial_body: |-
  六个操作步骤。每一步都检查你实际做了什么。被击中或死亡只会让当时所在的那一步重来，并把它标红，直到通过为止

  点按一个步骤即可练习它，已通过的步骤也可以。只有所有步骤都通过，教程才算完成

  <color=#E8B04B><b>警告：</b></color><b>无敌</b>时受击不计数，所以教程也看不到它们

  更多：<link="https://bullethero.space/zh/docs/game/sandbox"><color=#59A6FF>沙盒与教程</color></link>
hint_sandbox_tutorial_header: "教程"
hint_settings_audio: "主音量、关卡在游戏和编辑器中播放的音量，以及关卡编辑器之外和之内的界面音效"
hint_settings_audio-editor-game: "关卡在编辑器中播放的音量。同一个关卡、同一条播放路径，只是要连听几个小时而不是一次，所以游戏本身的音量保持不变"
hint_settings_audio-editor-ui: "关卡编辑器自身音效的音量。它只提示一次编辑的结果：保存、拒绝、撤销、删除，从不为普通的按下发声"
hint_settings_audio-game: "关卡播放内容的音量：它的音乐和音效"
hint_settings_audio-ui: "关卡编辑器之外的界面音量：菜单、浏览界面、设置"
hint_settings_audio-volume: "主音量。其他所有音量都按它缩放"
hint_settings_controls_body: |-
  你如何操控玩家，按设备类型划分：键盘和鼠标、触屏、手柄以及设备的陀螺仪

  <color=#B48CE0><b>须知：</b></color>可以同时启用多种设备，由你<b>最后</b>碰过的那种来操控，冲刺和暂停在任何一种上都有效

  <color=#5EC8C8><b>提示：</b></color>陀螺仪的中立位置是手机屏幕朝上<b>平放</b>，偏离水平倾斜即可移动。如果需要倾斜得太多，就调高<b>灵敏度</b>

  更多：<link="https://bullethero.space/zh/docs/game/controls"><color=#59A6FF>操作</color></link>
hint_settings_controls_header: "操作"
hint_settings_game-editor-autosave: "定时写入一份关卡副本。它不会覆盖你已保存的关卡，副本只是安全网，不等于保存"
hint_settings_game-editor-autosave-rate: "两次自动副本之间间隔的秒数"
hint_settings_game-editor-camera-invert: "拖拽时是让关卡跟着指针移动，还是反过来移动相机。两种方式各有人觉得顺手"
hint_settings_game-editor-camera-max-size: "编辑器视口最多能缩小到多远"
hint_settings_game-editor-camera-min-size: "编辑器视口最多能放大到多近"
hint_settings_game-editor-camera-sensitivity-x: "指针每移动一个单位，视图水平移动多远"
hint_settings_game-editor-camera-sensitivity-y: "指针每移动一个单位，视图垂直移动多远"
hint_settings_game-editor-camera-wheel-multiplier: "滚轮每滚动一格缩放多少"
hint_settings_game-editor-camera-zoom-to-mouse: "朝光标缩放，而不是朝视口中心缩放。关闭时缩放过程中中心保持不动"
hint_settings_game-editor-create-shape-size-x: "新形状创建时的宽度，不含它自身的缩放"
hint_settings_game-editor-create-shape-size-y: "新形状创建时的高度，不含它自身的缩放"
hint_settings_game-editor-create-text-size-x: "新文本排布字形所用文本框的宽度，而不是字形本身的大小"
hint_settings_game-editor-create-text-size-y: "新文本排布字形所用文本框的高度，每个单位大约一行"
hint_settings_game-editor-effects-active-default: "打开编辑器时是否预览关卡的后期效果。这只是初始状态，工作中关掉它们不会改变此设置。手机上默认关闭，因为后期处理是编辑器绘制的内容中最耗性能的"
hint_settings_game-editor-gizmos-scale: "视口中控制柄的绘制大小。按鼠标尺寸设计的控制柄很难用拇指点中"
hint_settings_game-editor-grid-active-default: "打开编辑器时视口网格是否已开启。这只是初始状态，工作中关掉网格不会改变此设置"
hint_settings_game-editor-grid-opacity: "网格的明显程度。淡到无法辨认的网格干脆不绘制"
hint_settings_game-editor-grid-size: "视口网格的间距，以关卡单位计"
hint_settings_game-editor-history-length: "会话保留多少步编辑操作，超出后丢弃最旧的分支。调高只多占内存，没有其他代价"
hint_settings_game-editor-history-objects: "在步数之外，历史还限制保留的物体数量。一次批量删除就是一个包含50000个物体的步骤，这个上限正是为此而设。0表示不限制，小于0由设备决定"
hint_settings_game-editor-interface-dirty-field-delay: "检视器字段在你最后一次按键后等待多久才提交。设为零则每次按键都提交，并且每一次都可以撤销"
hint_settings_game-editor-interface-log-clamps: "当你输入的数值被拉回允许范围时，在控制台中报告。无论是否开启，数值都会被钳制"
hint_settings_game-editor-interface-rotation-unit: "旋转字段显示和输入所用的单位。角度始终以弧度存储"
hint_settings_game-editor-level-serialize-mode: "关卡写入所用的文件格式。<b><color=#D4B483>Json</color></b>是文本，可读，也能手动修复。<b><color=#D4B483>Blob</color></b>是二进制，加载快几十倍，但一旦损坏几乎无法修复"
hint_settings_game-editor-max-autosave-files: "保留多少份副本。达到上限时丢弃最旧的一份"
hint_settings_game-editor-multi-select-requires-hold: "向选中项中添加内容是否需要刻意长按。触屏上开启更安全，否则一次误触就会改变选中的内容"
hint_settings_game-editor-pick-invisible-aabb: "允许点击选中不绘制任何内容的物体。隐形墙需要它，因为隐形墙有判定框却没有形状"
hint_settings_game-editor-player-active-default: "打开编辑器时测试玩家是否已在场。在触屏上它还会占用视口，所以手机上通常应关闭"
hint_settings_game-editor-player-bot: "把预览玩家交给<color=#D4B483>Reflex Bot v1</color>操控，而不是由你操控。这里只提供这一个机器人，因为它无需预先准备，并且在你编辑时持续工作，任何播放速度都可以，包括倒放。它遵守和你一样的规则：会受到伤害，也会被逼入死角。刚拖动进度后，它会短暂表现变差，因为要重建对未来的认知。选择哪个机器人属于每一局的设置，在此界面的“游玩”标签页中"
hint_settings_game-editor-player-bot-debug: "机器人调试叠加层的总开关。默认关闭。其下各项都已开启，所以打开它就能一次看到全貌"
hint_settings_game-editor-player-bot-debug-grid: "绘制机器人认为屏幕各处有多少空间，按它能预见的所有内容中的最坏情况计算。红色是它预计会被击中的位置。它认为安全的地方不绘制任何内容"
hint_settings_game-editor-player-bot-debug-reach: "绘制机器人认为在其规划窗口结束前能到达多远，内圈是步行可达，外圈是用掉冲刺可达。它从不选择圈外的目标"
hint_settings_game-editor-player-bot-debug-target: "绘制机器人当前前往的点。它会坚持已有选择，直到出现明显更好的目标，所以目标不再移动说明机器人已满意，而不是卡住了"
hint_settings_game-editor-player-reset-gizmos: "开启测试玩家时取消当前的控制柄模式，免得手指下留着一个拖拽手柄"
hint_settings_game-editor-preview-collider-on-select: "显示选中物体的判定框。这里绘制的内容和被击中的范围是两回事，所以二者可能不一致"
hint_settings_game-editor-resources-serialize-mode: "对关卡自带的资源做同样的选择"
hint_settings_game-editor-selection-collider-opacity: "选中物体的判定框绘制得有多不透明"
hint_settings_game-editor-selection-collider-opacity-view: "同上，用于同时显示所有判定框的视图。这里更淡，因为数百个判定框会相互重叠"
hint_settings_game-editor-selection-long-press-delay: "行或片段需要按住多久才进入多选。如果经常误选，就调高它"
hint_settings_game-editor-selection-long-press-threshold: "按住期间指针能偏移多远，超过就算作拖拽。手不稳时调高它"
hint_settings_game-editor-timeline-edge-handle: "片段边缘上用于调整长度的区域有多宽。拖动片段的其余部分则会整体滑动"
hint_settings_game-editor-timeline-loop-global: "播放头到达关卡末尾时是否回到开头，而不是停止"
hint_settings_game-editor-timeline-loop-local: "同上，用于局部时间轴，它会重复单个物体自己的时段"
hint_settings_game-editor-timeline-snap-threshold: "拖动的边缘需要落到多近才会吸附到候选帧上"
hint_settings_game-editor-timeline-time-format: "时间轴标尺和播放头读数的计数方式。它不改变关卡中的任何内容，指向的始终是同一帧。“小节和节拍”读取关卡自己的节拍网格，在网格没有节拍段的地方改用时间码"
hint_settings_game-editor_body: |-
  <b>自动保存</b>定时保存关卡，每次写入一份备份副本。<b>自动保存文件上限</b>限制保留的副本数量

  <b>相机最小尺寸</b>和<b>相机最大尺寸</b>限制视口的缩放范围。<b>多选需按住</b>和<b>按AABB选取不可见部分</b>改变在视口中点击的含义

  <b>关卡格式</b>和<b>资源格式</b>设置写入磁盘的默认格式

  更多：<link="https://bullethero.space/zh/docs/editor/workflow/speed-and-shortcuts"><color=#59A6FF>速度与快捷键</color></link>
hint_settings_game-editor_header: "编辑器"
hint_settings_general: "语言，以及游戏同时加载多少资源。<b>语言</b>留空时跟随设备"
hint_settings_general-language: "界面语言。留空时跟随设备。它不影响关卡自己的文本，那些文本由关卡自带"
hint_settings_general-resource-parallel-load-count: "关卡的文件同时加载多少个。调高在快速磁盘上完成得更快，在慢速磁盘上可能卡顿"
hint_settings_general-resource-web-timeout: "通过网络获取文件时，放弃前等待的秒数"
hint_settings_general-show-all-found-content: "同时列出来源找到、但无法确认属于你的内容，例如已取消订阅的创意工坊物品的文件，或手动复制进来的文件夹。这类关卡会在卡片上标出。关闭时，来源只列出它能担保的内容"
hint_settings_graphics-antialiasing-hdr: "大于1的颜色值。这里没有任何内容需要它们，而且它会让内存带宽翻倍，所以默认关闭"
hint_settings_graphics-antialiasing-msaa: "<color=#D4B483>MSAA</color>对每个像素取多少个采样。越多越平滑，开销也越大，而且透明内容重叠得越多，开销增长得越快"
hint_settings_graphics-antialiasing-type: "边缘如何平滑。<b><color=#D4B483>MSAA</color></b>能精确处理边缘，因为这里的每个形状都是真实几何体。<b><color=#D4B483>FXAA</color></b>无论场景如何，开销都只是一次处理，这是性能弱的手机要面对的取舍"
hint_settings_graphics-audio-pitch-correction: "为追上模拟而对音频速度施加的校正强度。越高校正得越快，也越容易听出来"
hint_settings_graphics-audio-render: "在编辑器的时间轴上绘制音频波形。关闭后可以在长音频轨道上节省计算"
hint_settings_graphics-audio-render-effects: "编辑时应用轨道的音频效果。关闭时你听到的是原始音频片段"
hint_settings_graphics-audio-resync-jump-time: "音频与模拟允许偏离多远，超过后音频会直接跳回原位，而不是逐步微调"
hint_settings_graphics-audio-scrub-time: "沿轨道拖动播放头时，每次听到的片段有多长"
hint_settings_graphics-audio-sync-dead-zone: "小于此值的偏差会被忽略。没有死区的话，音频会被不停地校正，而且能听出来"
hint_settings_graphics-audio-use-scrub: "拖动播放头时播放它下方的音频，方便凭听觉找到某个时刻"
hint_settings_graphics-avatar-render: "化身的身体是由64个方块组成的网格，损失生命值时，方块会沿几道裂痕从边缘向内脱落，所以一局打得不顺，你在玩家身上就能看出来，而不必看血条。透过缺口露出的是下方的判定框圆环。关闭后，网格变成一个方块，生命值改为让它逐渐变淡：传达的信息相同，只是一个物体而不是64个，适合不想绘制那么多方块的设备"
hint_settings_graphics-effects-fixed-framerate: "特效模拟的频率，与特效绘制的频率无关"
hint_settings_graphics-effects-frame-step-budget: "单帧内特效最多可以执行多少步，这样追赶进度时永远不会造成明显的卡顿"
hint_settings_graphics-effects-framerate-target: "特效绘制的频率。低于游戏本身的帧率是一种低成本的节省，因为粒子在较粗的步长下看起来也没问题"
hint_settings_graphics-effects-max-scrub-time: "跳转播放头时，编辑器最多重放多长的特效历史。越长越准确，也越慢"
hint_settings_graphics-effects-render: "是否绘制粒子特效。它们让关卡更丰富，但没有任何关卡依赖它们，所以放弃它们是安全的"
hint_settings_graphics-effects-replay-step-budget: "一次重放最多可以执行多少模拟步。有了这个上限，跳转到密集段落时编辑器才不会卡死"
hint_settings_graphics-fixed-framerate: "“目标帧率”为“固定”时游戏保持的上限，只决定屏幕重绘的频率，别的都不影响。关卡按真实时间模拟，所以同一局在30 FPS和144 FPS下的表现完全一致。开启“垂直同步”时忽略此项"
hint_settings_graphics-framerate-target: "游戏力求达到的每秒帧数。直接应用，而不是通过垂直同步"
hint_settings_graphics-postprocessing-render: "下方所有相机效果的总开关。关闭后跳过整个效果栈"
hint_settings_graphics-postprocessing-render-analog-glitch: "模拟信号干扰：滚动的条纹、撕裂的扫描线、颜色渗出"
hint_settings_graphics-postprocessing-render-bloom: "明亮区域的光向四周溢出"
hint_settings_graphics-postprocessing-render-chroma: "颜色通道向屏幕边缘分离，就像廉价镜头一样"
hint_settings_graphics-postprocessing-render-color-curves: "按通道调整的颜色曲线，用于精细调色"
hint_settings_graphics-postprocessing-render-digital-glitch: "数字损坏：错位的色块，仿佛帧数据被损坏了"
hint_settings_graphics-postprocessing-render-grain: "画面上叠加的胶片颗粒"
hint_settings_graphics-postprocessing-render-lens: "画面像真实镜头那样发生弯曲"
hint_settings_graphics-postprocessing-render-lift-gamma-gain: "分为三个区域的调色：阴影、中间调和高光"
hint_settings_graphics-postprocessing-render-motion-blur: "快速运动会拖出残影。如果它让子弹更难看清，可以关掉"
hint_settings_graphics-postprocessing-render-shadows-midtones-highlights: "还是这三个区域，但分别着色，而不是整体提亮"
hint_settings_graphics-postprocessing-render-vignette: "屏幕边缘变暗，把注意力引向中央"
hint_settings_graphics-postprocessing-render-white-balance: "改变什么算作白色，让整个画面变暖或变冷"
hint_settings_graphics-render-scale: |-
  游戏自身在缩放到窗口之前渲染多少像素

  低于1时，游戏绘制更少的像素再拉伸放大，这是在性能弱的机器上最值得调低的一项，因为片元开销随它的<b>平方</b>下降。高于1时，游戏以更大的尺寸渲染再缩小结果，也就是超采样

  无论如何，界面都绘制到自己的全尺寸目标中，所以不管这里设为多少，文字和按钮都保持清晰。这个数值会与此类设备自带的缩放倍数相乘，而不是取代它
hint_settings_graphics-resolution: |-
  游戏窗口的像素尺寸，可选值来自此显示器实际报告的模式，所以这里不可能请求显示器无法显示的模式

  这也是桌面端切换屏幕方向的方式：高度大于宽度的分辨率会让界面进入竖屏布局，与竖起来的手机相同。显示器无法在游戏内旋转，所以这一项和窗口尺寸是仅有的两个手段

  不做设置时，使用显示器自身的分辨率
hint_settings_graphics-textures-compression: "加载时把图像打包成<color=#D4B483>压缩</color>格式。内存减少到四分之一至八分之一，代价是渐变或硬边缘落在4x4块上时会出现块状瑕疵。在关卡加载时读取，而不是在关卡打开期间"
hint_settings_graphics-textures-compression-quality: "在加载时间和压缩瑕疵之间取舍。无论如何，图像最终的大小都相同，手机则完全忽略此设置"
hint_settings_graphics-textures-filtering: "只决定图像绘制时如何采样。图像缩小的方式由它的作者对它的标记决定，而不是由这一项决定"
hint_settings_graphics-textures-mipmaps: "每张图像的缩小副本，使缩小绘制的图像在移动时不再闪烁。多占用三分之一的内存，也是消除这种闪烁的唯一办法"
hint_settings_graphics-textures-size-limit: "图像在此设备内存中允许的最大尺寸。内存随边长的平方下降，所以这一项比压缩更省内存，也是三项中唯一能真正限制关卡开销上限的一项"
hint_settings_graphics-vsync: |-
  游戏在显示一帧之前是否等待显示器刷新

  <b>关</b>时，每帧一准备好就立刻显示。没有任何等待，所以输入会尽早反映到屏幕上，但在刷新中途完成的帧会覆盖在上一帧的一半之上，这就是画面撕裂

  <b>开</b>时，每次刷新呈现一帧，撕裂消失，但每帧最多增加一次刷新的延迟。<b>半速率</b>则每两次刷新呈现一帧，在无法保持完整刷新率的机器上更平稳，但延迟加倍

  只要此项不是“关”，Unity就会完全忽略上方的帧率上限，所以那两行会变灰

  手机按自己的节奏呈现画面，此项在手机上无效
hint_settings_graphics-window-mode: |-
  游戏窗口如何占据显示器

  <b>窗口化</b>是唯一可以自由调整大小的模式，而调整大小正是改变游戏宽高比的方式：把窗口拖得高度大于宽度，整个界面就会切换到竖屏布局，与竖起来的手机完全一样

  <b>无边框窗口</b>是默认模式：填满显示器，无需切换显示模式，Alt+Tab即时切换。<b>独占全屏</b>把显示器完全交给游戏，速度略快，但切出去更慢

  手机只有一个窗口，那就是屏幕，所以此项在手机上无效
hint_settings_graphics_body: |-
  <b>抗锯齿。</b>默认使用<color=#D4B483>MSAA</color>，因为这款游戏中的每个形状都是真实几何体，所以每条出现锯齿的边都是真实的几何边缘，这正是多重采样能在所有平台上以完整清晰度精确处理的情况。<b><color=#D4B483>FXAA</color></b>是性能较弱手机的替代方案：无论关卡过度绘制多少，它的开销都只是一次全屏处理，而<color=#D4B483>MSAA</color>的开销会随透明内容的过度绘制增长。<b>刻意不提供TAA</b>：在这类游戏中，快速子弹后的拖影会影响辨识，而且它的抖动会与故障效果相冲突

  <b>帧率。</b>目标帧率是手动应用的，而不是通过垂直同步。“固定帧率”让模拟与显示脱钩，正因如此，关卡的时序在60Hz和144Hz的屏幕上完全一致

  <color=#7FC97F><b>建议：</b></color>设备吃力时，把<b>渲染缩放</b>调到1以下是代价最小的选择：只损失清晰度，别的都不受影响

  更多：<link="https://bullethero.space/zh/docs/editor/performance/mobile-devices"><color=#59A6FF>移动设备</color></link>
hint_settings_graphics_header: "图形"
hint_settings_interface: "统计信息叠加层及其位置。它绘制在所有屏幕之上，用于诊断性能，而不是在游玩时使用"
hint_settings_interface-alert-on-exception: "未捕获的错误是否弹出报告窗口。无论如何，报告都会生成、写入日志并保留，这项设置只决定它是否打断你，而这在一局游玩的中途最为重要。关闭时，最后一份报告仍在玩家日志中，也可以通过<b>保存报告</b>在报告文件夹中找到"
hint_settings_interface-hitbox-ring-opacity: "化身上的圆点环正好位于它的碰撞半径上：身体绘制宽度为1，碰撞半径却只有0.4。轮廓从来都不是判定框，现在你能看到判定框真正的位置。这个圆环同时也显示生命数：亮着的点是剩余的生命，暗下的点是已经失去的生命。这个滑块只决定圆环在关卡绘制的内容之上有多显眼，设为0会将它完全关闭。关卡是按能看到它的玩家来平衡的"
hint_settings_interface-menu-background: "菜单在按钮后面播放的内容。“机器人”是一个真实的竞技场：可以代你游玩一局的那个反应型机器人，会在你停留于菜单时闪避实时发射的危险物，被击中也不会产生任何后果。“形状”是旧版的旋转形状场，也是三者中最耗性能的。“无”什么都不绘制"
hint_settings_interface-open-menu-on-lose: "失败的一局会怎样处理。关：关卡平滑减速停下，倒回到最后到达的检查点，再平滑加速恢复，不会弹出任何窗口。开：播放停止并打开结算窗口"
hint_settings_interface-screen-orientation: |-
  <b>横屏</b>和<b>竖屏</b>锁定的是<b>轴</b>，而不是某一侧。把设备翻转过来，画面也会随之翻转，所以正反两个方向都能游玩

  <b>自动旋转</b>不做任何锁定：屏幕跟随设备转动。如果关卡没有指定自己的方向，你可以在游玩中途转动手机，界面和相机都会随之调整

  关卡在播放时可以覆盖这项设置。关卡作者是按特定形状的画面来编排内容的，所以在关卡运行期间以作者的选择为准，离开关卡后设置会恢复

  桌面端的显示器无法旋转，因此这个控件处于禁用状态，只显示窗口的形状。调整窗口大小，它也会随之变化
hint_settings_interface-show-game-interface: "上面两项的总开关，同时也控制屏幕上的触控按钮。关闭时，游戏画面完全不绘制任何内容，适合干净的录屏或截图。所有功能都不会停止工作：每个控件都留在原位，仍然可以按下"
hint_settings_interface-show-game-pause: "是否绘制暂停图标。它只是隐藏，而不是移除：同一个角落仍然可以按下，而且无论此项如何设置，Escape或手柄的Back键都会打开暂停窗口"
hint_settings_interface-show-game-progress: "是否在游戏画面底部绘制本局的进度条。隐藏它不会改变其他任何东西，它标出的检查点照常生效"
hint_settings_interface-stats-active: "在所有屏幕之上显示诊断信息。它用于测量性能，而不是在游玩时使用"
hint_settings_interface-stats-alignment-x: "诊断信息在水平方向上的位置：0为左边缘，1为右边缘"
hint_settings_interface-stats-alignment-y: "诊断信息在垂直方向上的位置：0为上边缘，1为下边缘"
hint_settings_other: "<b>将设置恢复为默认</b>会把所有标签页上的全部设置恢复为默认值。它只影响设置：你的关卡是磁盘上的文件，不受影响"
hint_settings_profile: "这台设备记下的一切：游戏被怎样游玩过，用它创作了什么。数据只保存在本地：这里的任何内容都不会上传，其背后的文件位于关卡旁边的文件夹中，可以打开阅读。时间按真实秒数计算，而不是关卡时间，因此检查点处的减速与加速、以半速游玩的一局，都按实际花费的时间计入。设备一栏统计的是游玩关卡时四种操作设备中哪一种在主导化身，而不只是哪一种已连接"
hint_settings_suppress-game-saves_body: |-
  开启时，游戏不保存任何自身的数据：<color=#D4B483>settings.json</color>、全局统计和每个关卡的统计都原样保留在磁盘上。你更改的设置在关闭游戏前仍然有效

  你的关卡工作仍照常保存：保存、导出、导入、复制和删除关卡，以及编辑器的自动保存和备份，后者有自己的开关

  它持续到游戏关闭为止，也不会保留到下次启动。关闭它会保存你当前的设置，并丢弃开启期间游玩产生的所有数据

  <color=#B48CE0><b>须知：</b></color>它也会自动开启。启动参数<color=#D4B483>--suppress-game-saves</color>会在本次启动期间一直开启它，游戏内无法将其关闭。由更新版本的游戏保存的设置或统计数据也会开启它，此时游戏会在每次启动时询问是保留这些数据，还是用默认值覆盖
