settings_game-editor_interface-auto-open-panel-tooltip: "While this is on, selecting an object, a keyframe or an audio clip opens the editor's right panel. Off - the default - it only selects the matching tab, so opening the panel by hand still lands on what was picked. The buttons that exist to reach the panel open it either way"
settings_game-editor_interface-dirty-field-delay: "Field Commit Delay"
settings_game-editor_interface-expansion-mask: "Partial Folding"
settings_game-editor_interface-expansion-mask-tooltip: "Which kinds of object stay unfolded on the middle rung of the fold button's three-step cycle, in the Frame Hierarchy and the object timelines. A ticked kind is shown unfolded. By default everything is unfolded except prefab placements"
settings_game-editor_interface-hierarchy-expansion: "Hierarchy Folding"
settings_game-editor_interface-hierarchy-expansion-tooltip: "Which rung the Frame Hierarchy opens at when a level is loaded. Collapsed by default: a closed row in a tree still says what it hides, so opening what you need costs one press"
settings_game-editor_interface-link-collider: "Link Collider To Shape"
settings_game-editor_interface-link-collider-tooltip: "While this is on, picking a shape in the inspector writes it as that object's collider too, so the hitbox follows the silhouette. Picking None never reaches the collider - a shape of None beside a real collider is how an invisible hitbox is authored"
settings_game-editor_interface-log-clamps: "Report Clamped Values"
settings_game-editor_interface-log-rules: "Report Broken Level Rules"
settings_game-editor_interface-log-rules-tooltip: "After an explicit save, report how many level rules the saved level breaks. Off by default: findings are advisory - the Rules tab reports them on demand and never repairs them, and a level that breaks rules still opens, plays and ships"
settings_game-editor_interface-rotation-unit: "Rotation Unit"
settings_game-editor_interface-sync-timeline-expansion: "Sync Timeline Folding"
settings_game-editor_interface-sync-timeline-expansion-tooltip: "While this is on, folding a row in the Frame Hierarchy also folds that object's subtree out of the object timelines, and the other way round. Off - the default - the two surfaces keep their own answers: the hierarchy opens collapsed, the timelines open showing everything"
settings_game-editor_interface-timeline-expansion: "Timeline Folding"
settings_game-editor_interface-timeline-expansion-tooltip: "Which rung the object timelines open at when a level is loaded. Expanded by default, the opposite of the hierarchy - a fold REMOVES rows from a timeline rather than closing them, and a row that is not there cannot say what it hides"
settings_game-editor_interface_title: "Interface"
