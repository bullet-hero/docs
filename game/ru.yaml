settings_graphics-vsync_tooltip: "Ждёт обновления экрана перед показом кадра - разрывов нет, но добавляется кадр задержки. Пока включена, ограничение частоты выше ничего не делает. Только на ПК"
settings_graphics-window-mode_tooltip: "Как окно занимает экран. Оконный режим позволяет свободно менять размер, а с ним и форму, под которую подстраивается интерфейс. Только на ПК"
