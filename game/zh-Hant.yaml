level_resources_texture-alpha: "Alpha"
level_resources_texture-alpha_tooltip: "你對這張圖片透明度的宣告。不透明表示不使用Alpha通道，圖片會去掉該通道重新打包，畫素不變，繪製更快，並走不透明渲染路徑。這個宣告不會被校驗：如果圖片確實有漸隱，漸隱會被抹平，下方的報告行會顯示這一點"
level_resources_texture-compression: "壓縮"
level_resources_texture-compression_tooltip: "裝置是否可以把這張圖片打包成有損格式。禁止會保留每個畫素，最多佔用四倍記憶體。允許則讓裝置即使在圖片型別本會禁止的情況下也壓縮它。自動跟隨圖片型別：畫素畫和漸變會禁止。兩個選項都不會讓裝置違背自身設定去壓縮，也都不會解除尺寸上限"
level_resources_texture-details: "匯入"
level_resources_texture-kind: "這張圖片是什麼：照片、繪圖、畫素畫還是漸變。純粹是美術上的選擇，說明圖片“是”什麼。它也決定下方取樣和壓縮欄位的初始值（畫素畫初始為銳利且不壓縮，漸變不壓縮），兩者都可以在那裡修改。Mipmap是型別唯一仍然自行決定的東西：畫素畫永遠不會生成Mipmap"
level_resources_texture-report-alpha-dropped: "已移除Alpha"
level_resources_texture-report-mips: "Mip層級"
level_resources_texture-report-not-loaded: "未載入"
level_resources_texture-report-source-unknown: "來源未知"
level_resources_texture-sampling: "取樣"
level_resources_texture-sampling_tooltip: "這張圖片的繪製方式：平滑會混合相鄰畫素，銳利把每個畫素畫成硬邊方塊。自動跟隨圖片型別：畫素畫為銳利，其他為平滑。銳利和平滑對裝置的開銷相同，所以這是外觀選擇而不是效能預算，並且會覆蓋玩家自己的過濾設定"
level_resources_texture-uv-offset-x: "偏移X"
level_resources_texture-uv-offset-y: "偏移Y"
level_resources_texture-uv-tiling-x: "平鋪X"
level_resources_texture-uv-tiling-y: "平鋪Y"
level_resources_texture-uv_tooltip: "這張圖片如何對映到繪製它的物體上，只在資源上設定一次，而不是在每個物體上設定。平鋪是它在形狀上重複的次數，偏移是第一份副本開始的位置。沒有自己UV關鍵幀的物體會直接使用這個設定，而物體上的任何UV關鍵幀都會完全替換它"
level_resources_texture-wrap-u: "X軸環繞"
level_resources_texture-wrap-u_tooltip: "這張圖片在左右邊緣之外的表現。重複和映象只在UV平鋪時可見：平鋪為1時圖片只採樣一次，不會超出自身"
