level_resources_texture-alpha: "Alpha"
level_resources_texture-alpha_tooltip: "Ce que tu déclares sur la transparence de cette image. Opaque signifie que le canal alpha n'est pas utilisé, donc l'image est réempaquetée sans lui - les mêmes pixels, dessinés plus vite et par le chemin de rendu opaque. Rien ne vérifie cette déclaration : sur une image qui s'estompe vraiment, elle aplatit le fondu, et c'est la ligne de rapport ci-dessous qui le montre"
level_resources_texture-compression: "Compression"
level_resources_texture-compression_tooltip: "Indique si un appareil peut compresser cette image dans un format avec pertes. Refuser garde chaque pixel et coûte jusqu'à quatre fois plus de mémoire, Autoriser laisse l'appareil la compresser même là où le type refuserait. Auto suit le type : le pixel art et les dégradés refusent. Aucune des deux valeurs ne force un appareil à compresser contre ses paramètres, et aucune ne lève la limite de taille"
level_resources_texture-details: "Import"
level_resources_texture-kind: "Ce qu'est cette image - une photo, un dessin, du pixel art, un dégradé. Un choix purement artistique : il dit ce que l'image EST. Il fixe aussi les valeurs de départ des champs Échantillonnage et Compression ci-dessous - le pixel art commence net et non compressé, un dégradé non compressé - et les deux peuvent y être changés. Les mipmaps sont la seule chose que le type décide encore seul : le pixel art n'en a jamais"
level_resources_texture-report-alpha-dropped: "alpha retiré"
level_resources_texture-report-mips: "mipmaps"
level_resources_texture-report-not-loaded: "non chargée"
level_resources_texture-report-source-unknown: "source inconnue"
level_resources_texture-sampling: "Échantillonnage"
level_resources_texture-sampling_tooltip: "Comment cette image est dessinée - Lisse mélange les pixels voisins, Net dessine chacun comme un carré dur. Auto suit le type : pixel art net, tout le reste lisse. Net et lisse coûtent autant l'un que l'autre à un appareil, c'est donc une question d'apparence et non de budget, et ce choix l'emporte sur le filtrage du joueur"
level_resources_texture-uv-offset-x: "Décalage X"
level_resources_texture-uv-offset-y: "Décalage Y"
level_resources_texture-uv-tiling-x: "Mosaïque X"
level_resources_texture-uv-tiling-y: "Mosaïque Y"
level_resources_texture-uv_tooltip: "Comment cette image se pose sur ce qui la dessine, indiqué une seule fois pour la ressource au lieu de sur chaque objet. Mosaïque est le nombre de répétitions sur la forme, Décalage l'endroit où commence sa première copie. Un objet sans images clés UV propres échantillonne exactement ceci, et toute image clé UV sur cet objet le remplace entièrement"
level_resources_texture-wrap-u: "Hors des bords X"
level_resources_texture-wrap-u_tooltip: "Ce que fait cette image au-delà de ses bords gauche et droit. Répéter et Miroir n'apparaissent que là où l'UV se répète - avec une mosaïque de 1, l'image est échantillonnée une seule fois et ne sort jamais d'elle-même"
level_resources_texture-wrap-v: "Hors des bords Y"
level_resources_texture-wrap-v_tooltip: "Ce que fait cette image au-delà de ses bords haut et bas. Séparé de l'axe X exprès : une bande qui se répète à l'horizontale tout en restant bloquée à la verticale est un contenu ordinaire"
