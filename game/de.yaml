settings_game-editor_interface-auto-open-panel-tooltip: "Solange das an ist, öffnet das Auswählen eines Objekts, eines Keyframes oder eines Audioclips den rechten Bereich des Editors. Aus - der Standard - wählt es nur den passenden Tab, sodass du beim Öffnen des Bereichs von Hand trotzdem beim Gewählten landest. Die Schaltflächen, die zum Bereich führen, öffnen ihn in jedem Fall"
settings_game-editor_interface-dirty-field-delay: "Übernahmeverzögerung"
settings_game-editor_interface-expansion-mask: "Teilweises Einklappen"
settings_game-editor_interface-expansion-mask-tooltip: "Welche Objektarten auf der mittleren Stufe des dreistufigen Zyklus der Einklapp-Schaltfläche aufgeklappt bleiben, in der Frame-Hierarchie und den Objekt-Zeitleisten. Eine angehakte Art wird aufgeklappt gezeigt. Standardmäßig ist alles aufgeklappt außer Prefab-Platzierungen"
settings_game-editor_interface-hierarchy-expansion: "Hierarchie-Klappstufe"
settings_game-editor_interface-hierarchy-expansion-tooltip: "Auf welcher Stufe sich die Frame-Hierarchie öffnet, wenn ein Level geladen wird. Standardmäßig eingeklappt: eine geschlossene Zeile in einem Baum sagt immer noch, was sie verbirgt, also kostet das Öffnen des Gewünschten einen Klick"
settings_game-editor_interface-levels-layout: "Levelansicht"
settings_game-editor_interface-link-collider: "Collider an Form koppeln"
settings_game-editor_interface-link-collider-tooltip: "Solange das an ist, schreibt das Wählen einer Form im Inspector sie auch als Collider dieses Objekts, sodass die Hitbox der Silhouette folgt. Das Wählen von Keine erreicht den Collider nie - eine Form Keine neben einem echten Collider ist der Weg zu einer unsichtbaren Hitbox"
settings_game-editor_interface-log-clamps: "Begrenzte Werte melden"
settings_game-editor_interface-log-rules: "Verletzte Levelregeln melden"
settings_game-editor_interface-log-rules-tooltip: "Nach einem ausdrücklichen Speichern melden, wie viele Levelregeln das gespeicherte Level verletzt. Standardmäßig aus: Befunde sind nur Hinweise - der Tab Regeln zeigt sie auf Wunsch und behebt sie nie, und ein Level, das Regeln verletzt, lässt sich trotzdem öffnen, spielen und veröffentlichen"
settings_game-editor_interface-rotation-unit: "Winkeleinheit"
settings_game-editor_interface-sync-timeline-expansion: "Zeitleiste synchron klappen"
settings_game-editor_interface-sync-timeline-expansion-tooltip: "Solange das an ist, blendet das Einklappen einer Zeile in der Frame-Hierarchie auch den Unterbaum dieses Objekts in den Objekt-Zeitleisten aus, und umgekehrt. Aus - der Standard - behalten beide Flächen ihre eigene Antwort: die Hierarchie öffnet sich eingeklappt, die Zeitleisten zeigen anfangs alles"
settings_game-editor_interface-timeline-expansion: "Zeitleisten-Klappstufe"
settings_game-editor_interface-timeline-expansion-tooltip: "Auf welcher Stufe sich die Objekt-Zeitleisten öffnen, wenn ein Level geladen wird. Standardmäßig aufgeklappt, anders als die Hierarchie - Einklappen ENTFERNT Zeilen aus einer Zeitleiste, statt sie zu schließen, und eine Zeile, die nicht da ist, kann nicht sagen, was sie verbirgt"
