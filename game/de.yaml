editor_publish-rule-detail_resource-license-not-allowed: "{0} \"{1}\" steht unter der Lizenz {2}. Dieser Dienst akzeptiert: {3}. Ersetze die Ressource oder trage die Erlaubnis des Rechteinhabers in den Credits ein"
editor_publish-rule-detail_resource-license-unspecified: "{0} \"{1}\" nennt keine Lizenz, und ohne sie darf es niemand weitergeben. Öffne die Credits und wähle die Lizenz, die auf der Herkunftsseite steht"
editor_publish-rule-detail_resource-meta-missing: "{0} \"{1}\" hat gar keine Credits. Öffne seinen Tab und drücke Credits: wer es erstellt hat und unter welcher Lizenz"
