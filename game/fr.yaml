settings_game-editor_interface-hierarchy-expansion-tooltip: "Le palier auquel s'ouvre la hiérarchie de l'image au chargement d'un niveau. Replié par défaut : une ligne fermée dans un arbre dit encore ce qu'elle cache, donc ouvrir ce qu'il te faut ne coûte qu'un appui"
