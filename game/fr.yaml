settings_game-editor_interface-expansion-mask-tooltip: "Les types d'objets qui restent dépliés au palier intermédiaire du cycle en trois étapes du bouton de repli, dans la hiérarchie de l'image et les timelines d'objets. Un type coché est affiché déplié. Par défaut, tout est déplié sauf les placements de prefabs"
