  roles:
    player:
      title: 플레이 시작하기
      body: 사용하는 플랫폼에 맞는 게임을 다운로드하고 레벨을 플레이하세요. 처음에는 젠 모드를 권장합니다
    level_author:
      title: 나만의 레벨 만들기
      body: 좋아하는 곡으로 나만의 레벨을 만들어 보세요. 에디터는 게임에 내장되어 있으며, 할 수 있는 일은 애니메이션 도구에 견줄 만합니다
    developer:
      title: 엔진 위에 만들기
      body: Bullet Hero는 오픈 SDK를 갖춘 장르용 엔진입니다. 사람들에게 필요한 생성기, 변환기, 도구를 만들어 보세요
    contributor:
      title: 커뮤니티 발전시키기
      body: 문서를 개선하고, 레벨을 만들고, 엔진을 더 좋게 만들어 Bullet Hero 커뮤니티를 도와주세요
