editor_publish-failure-help_access-denied: "Steam lehnt das ab, wenn dem Konto das Spiel nicht gehört, das Konto eingeschränkt ist (noch keine Käufe auf Steam) oder vom Workshop ausgeschlossen ist. Prüfe, ob das Spiel in der Bibliothek dieses Kontos ist"
editor_publish-failure-help_cancelled: "Der Upload wurde vor dem Ende gestoppt. Nichts wurde veröffentlicht"
editor_publish-failure-help_connection: "Steam hat nicht rechtzeitig geantwortet. Prüfe die Verbindung und den Steam-Status und versuche es dann erneut"
editor_publish-failure-help_invalid-param: "Steam lehnt das ab, wenn der Workshop des Spiels keine Uploads annimmt oder Steam unter der ID eines anderen Spiels läuft. Starte Steam und das Spiel neu. Wiederholt es sich, melde es den Entwicklern"
editor_publish-failure-help_invalid-request: "Titel, Beschreibung, Vorschau oder Tags verletzen eine Grenze von Steam: ein Titel bis 128 Zeichen, eine Beschreibung bis 8000, eine Vorschau als png oder jpg bis 1 MB"
editor_publish-failure-help_limit-exceeded: "Dein Workshop-Speicher auf Steam ist voll. Lösche alte Objekte in deinen Workshop-Dateien und versuche es erneut"
editor_publish-failure-help_media-only: "Texturen, Schriftarten und Audio werden nur als Teil eines Prefabs, Themes, einer Form oder eines Effekts hochgeladen. Füge eines davon zur Sammlung hinzu"
editor_publish-failure-help_not-owner: "Dieses Objekt wurde von einem anderen Steam-Konto veröffentlicht. Veröffentliche von diesem Konto aus oder erstelle eine Kopie des Levels, damit es als neues Objekt hochgeladen wird"
editor_publish-failure-help_other: "Steam hat auf eine Weise geantwortet, die das Spiel nicht kennt. Versuche es noch einmal. Wiederholt es sich, schicke die Zeile oben an die Entwickler"
editor_publish-failure-help_protected: "Ein geschütztes Level verlässt nie das Gerät. Entferne den Schutz im Tab Gefahrenzone oder teile ein Archiv"
editor_publish-failure-help_staging: "Das Spiel konnte die Dateien nicht in einen temporären Ordner kopieren. Prüfe den freien Speicherplatz und ob kein anderes Programm die Leveldateien geöffnet hält"
editor_publish-failure-help_steam-not-running: "Starte den Steam-Client, melde dich an und starte das Spiel aus Steam neu"
editor_publish-failure-help_unavailable: "Nur die Steam-Version des Spiels kann im Workshop veröffentlichen. Teile das Level stattdessen als Archiv"
