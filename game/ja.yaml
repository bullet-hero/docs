hint_editor-settings_artist-permission_body: |-
  レベル内の外部リソース（音楽、画像、フォント、テキスト）にはすべて、<color=#D4B483>CC BY-NC</color>と同等以上に自由なライセンスか、公開の非営利再配布に対する権利者の許可が必要です

  <color=#E86A5A><b>注意：</b></color>個人的な「いいよ、どうぞ」だけでは足りません。許可は個人的な利用だけでなく、公開での再配布もカバーしている必要があります

  レベルがデバイス上にあるうちは何もチェックされません。チェックされるのは、サービスに提供するときだけです

  詳細：<link="https://bullethero.space/ja/docs/editor/rights/legal-resource-paths"><color=#59A6FF>合法なリソースへの2つの道</color></link>、<link="https://bullethero.space/ja/docs/editor/rights/asking-permission"><color=#59A6FF>作者に許可を求める</color></link>
hint_editor-settings_artist-permission_header: "他人の作品を使う"
hint_editor-settings_community: "プロジェクト公式のリンクです。ブラウザーで開きます。表示されるリンクはこのビルドの入手元によって異なるため、ストア版ではここより少ない場合があります"
hint_editor-settings_create-level_body: |-
  <b>プリセット</b>は、新しいレベルを何から始めるかを決めます。空のレベルか、毎回手作業で組むことになる最小限の土台です

  <color=#E86A5A><b>注意：</b></color>「<b>パラメーター</b>」では、後から変えにくいもの、つまりフレーム単位の長さとフレームレートを設定します

  <color=#5EC8C8><b>ヒント：</b></color>2つのファイルフォーマットのドロップダウンで、レベルとそのメタデータをディスクに書き込む形式を選びます。どちらも後からレベルの「危険ゾーン」で変更できます

  詳細：<link="https://bullethero.space/ja/docs/editor/basics/first-level"><color=#59A6FF>はじめてのレベル：手順</color></link>
hint_editor-settings_create-level_header: "レベルの作成"
hint_editor-settings_library_body: |-
  このデバイス上にある、レベルに取り込めるものすべてです。自分のライブラリ、自分のコレクション、ワークショップで購読したコレクション。細い列で種類を、リストの上のチップでソースを選びます

  <b>コレクション</b>は、名前、作者、ライセンスを持つ、あらゆる種類のリソースのフォルダーです。ここで作成し、種類ごとのページの「<b>コピー</b>」で中身を入れ、アーカイブとしてエクスポートするか公開します

  <color=#5EC8C8><b>ヒント：</b></color>ワークショップのコレクションは読み取り専用です。変更するには、エントリーを自分のコレクションにコピーしてください

  詳細：<link="https://bullethero.space/ja/docs/editor/reference/library-and-collections"><color=#59A6FF>ライブラリとコレクション</color></link>
hint_editor-settings_library_header: "ライブラリ"
hint_editor-settings_open-level: "このデバイスで見つかったレベルです。レベルはフォルダーなので、ほかのレベルの隣に置けばここに表示されます"
hint_editor_beat-segment_body: |-
  テンポが一定の1区間で、BPM、小数フレーム単位の位相オフセット、1小節のビート数、名前、色を持ちます。複数を選択していても、表示されるセグメントは1つだけです

  <color=#E86A5A><b>注意：</b></color>セグメントは開始フレームで識別されるため、<b>移動すると別のセグメントとして扱われます</b>。移動後は、新しい開始位置で選択し直してください

  <color=#5EC8C8><b>ヒント：</b></color>ここでのタップは、新しいセグメントを作らずに、選択中のセグメントの位相を合わせ直します

  詳細：<link="https://bullethero.space/ja/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>リズムと構成</color></link>
hint_editor_beat-segment_header: "ビートセグメント"
hint_editor_beat-window_body: |-
  制作用のメタデータで、<b>再生中は一切読まれません</b>。音楽に合わせて内容を配置するためのもので、ジェネレーターも見えているのと同じビートに従って動作します

  グリッドは<b>ビートセグメント</b>のリストで、それぞれがテンポ一定の区間です。セグメント間に隙間があっても構いません。たとえば打楽器のないイントロ、ブレイク、曲が終わった後の余韻などです

  <color=#5EC8C8><b>ヒント：</b></color>トラックに合わせて「<b>タップ</b>」を押し、「<b>タップから作成</b>」を押すと、最初から最後までのタップが1つのセグメントになります

  詳細：<link="https://bullethero.space/ja/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>リズムと構成</color></link>
hint_editor_beat-window_header: "ビートグリッド"
hint_editor_clipboard_body: |-
  タイムラインごとにバッファーが1つあり、それぞれに状態行があります

  「<b>テキストコピー</b>」はすべてのバッファーをテキストとしてシステムのクリップボードに書き込むので、選択内容を別のレベルや別のマシンへ持ち運べます。「<b>テキスト貼り付け</b>」はそれをバッファーに読み戻し、<b>そこで止まります</b>

  <color=#B48CE0><b>補足：</b></color>自分で選んだタイムラインに貼り付けるまで、レベルには何も入りません。貼り付け先は再生ヘッドとアクティブなスコープで決まります

  詳細：<link="https://bullethero.space/ja/docs/editor/workflow/reuse"><color=#59A6FF>再利用：プレハブ、コピー、ジェネレーター</color></link>
hint_editor_clipboard_header: "クリップボード"
hint_editor_console: "このセッションでエディターが記録したすべての内容です。レベルの読み込みレポート、ジェネレーターの結果、インポートの警告など。<b>消去</b>で空になります。歯車アイコンで、表示する重要度をフィルターします"
hint_editor_curve-editor: "ポイントをドラッグしてカーブを編集します。変更はドラッグ中に<b>その場で</b>適用されるので、見えているものがすでにレベルの内容です。ウィンドウを閉じても変更は残ります"
hint_editor_generators_body: |-
  プロシージャルなコンテンツを、元に戻せる1つの操作としてレベルに対して実行します

  <color=#B48CE0><b>補足：</b></color>2つの系統があります。<b>ジェネレーター</b>（<i>gen_</i>）は内容を作成します。弾のウェーブ、放射状パターン、フォントキャッシュなどです。<b>モディファイアー</b>（<i>mod_</i>）は既存の内容を書き換えます。スパン調整、キーフレームの量子化などです

  <color=#E86A5A><b>注意：</b></color>既存の内容を書き換えたり削除したりするものは、必ず先に確認を求めます

  詳細：<link="https://bullethero.space/ja/docs/editor/workflow/reuse"><color=#59A6FF>再利用：プレハブ、コピー、ジェネレーター</color></link>
hint_editor_generators_header: "ジェネレーター"
hint_editor_gradient-editor: "カラーストップをドラッグしてグラデーションを編集します。カーブエディターと同様に、変更は確定時ではなく<b>その場で</b>適用されます"
hint_editor_hierarchy_body: |-
  <b>現在のフレーム</b>に存在するすべてのオブジェクトを、親ごとに入れ子で表示します。スクラブするとリストが変わります。ヒエラルキーが空なら、たいていは再生ヘッドが内容の終わりを過ぎています

  行を別の行の上にドラッグすると、そのオブジェクトの子になります。レイヤーは親子の連鎖に沿って加算されるため、親を変えると描画順も変わり、ランダムな値も振り直されます

  <color=#5EC8C8><b>ヒント：</b></color>行を右クリックすると操作が表示されます。タッチ操作では行を長押しします

  詳細：<link="https://bullethero.space/ja/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>エディターの仕組み</color></link>
hint_editor_hierarchy_header: "ヒエラルキー"
hint_editor_inspector-audio_body: |-
  選択したオーディオトラックのクリップ、速度、フェーダー音量、そしてオーディオエフェクトのチェーンです。ローパス、ハイパス、エコー、リバーブ、コーラス、ピッチシフター、ディストーション、フランジャー、コンプレッサー、ノーマライズ、パラメトリックEQ

  「速度」と「音量」は、有効な範囲が見えるように、ただの数値フィールドではなくスライダーになっています

  <color=#E86A5A><b>注意：</b></color><b>ここの音量はフェーダーです。</b>キーフレームの音量はローカルタイムラインの別のトラックで、再生時に2つが掛け合わされます

  詳細：<link="https://bullethero.space/ja/docs/editor/resources/preparing-the-track"><color=#59A6FF>オーディオトラックの準備</color></link>
hint_editor_inspector-audio_chorus-delay: "コピーの基本ディレイ（ms）です。エコーではなく音の厚みとして聞こえる短さです"
hint_editor_inspector-audio_chorus-depth: "ディレイの揺れ幅です。Rateが揺れの速さを、これがその大きさを決めます"
hint_editor_inspector-audio_chorus-dry-mix: "処理されていない原音のレベルです"
hint_editor_inspector-audio_chorus-feedback: "出力をエフェクトに戻す量です。上げるほど効きが深くなり、フランジャーに近づきます"
hint_editor_inspector-audio_chorus-rate: "ディレイを変調する速さ（Hz）です"
hint_editor_inspector-audio_chorus-wet-mix-tap-1: "1つ目のディレイコピーのレベルです"
hint_editor_inspector-audio_chorus-wet-mix-tap-2: "2つ目のコピーのレベルです。タップは時間的にずらしてあるので、そのバランスでコーラスの広がり感が決まります"
hint_editor_inspector-audio_chorus-wet-mix-tap-3: "3つ目のコピーのレベルです"
hint_editor_inspector-audio_chorus_body: |-
  わずかに遅らせてピッチを揺らした3つのコピーを信号に重ね、1つの音源を複数のように聞かせます。<color=#D4B483>Rate</color>は揺れの速さ、<color=#D4B483>Depth</color>はその大きさです。<color=#D4B483>Feedback</color>を上げると<link="hint_editor_inspector-audio_flange"><color=#59A6FF>フランジャー</color></link>に変わります

  <color=#B48CE0><b>補足：</b></color><b>リセット</b>すると<b>Mix Level</b>もデフォルトの-80 dBに戻るため、エフェクトはオフになります

  詳細：<link="https://bullethero.space/ja/docs/editor/resources/preparing-the-track"><color=#59A6FF>オーディオトラックの準備</color></link>
hint_editor_inspector-audio_chorus_header: "コーラス"
hint_editor_inspector-audio_compressor-attack: "ピークの後に抑え込む速さ（ms）です。速すぎるとアタック感が潰れます"
hint_editor_inspector-audio_compressor-make-up-gain: "圧縮後に足し戻すゲイン（dB）です。圧縮で下がったレベルを取り戻します"
hint_editor_inspector-audio_compressor-release: "その後に解放する速さ（ms）です。速すぎると音量のうねりが耳につきます"
hint_editor_inspector-audio_compressor-threshold: "圧縮が効き始めるレベル（dB）です"
hint_editor_inspector-audio_compressor_body: |-
  大きい部分を抑えて、小さい部分を持ち上げられるようにします。自身のエフェクトに埋もれてしまう曲への定番の対処法です。<color=#D4B483>Threshold</color>は効き始める位置、<color=#D4B483>Attack</color>と<color=#D4B483>Release</color>は抑え込みと解放の速さ、<color=#D4B483>Make Up Gain</color>はレベルを戻します

  <color=#B48CE0><b>補足：</b></color><b>リセット</b>すると<b>Mix Level</b>もデフォルトの-80 dBに戻るため、エフェクトはオフになります

  詳細：<link="https://bullethero.space/ja/docs/editor/resources/preparing-the-track"><color=#59A6FF>オーディオトラックの準備</color></link>
hint_editor_inspector-audio_compressor_header: "コンプレッサー"
hint_editor_inspector-audio_distortion-level: "信号をクリップする強さです"
hint_editor_inspector-audio_distortion_body: |-
  波形をクリップして倍音で満たし、ざらついた歪んだ音にします。ダイヤルは<color=#D4B483>Level</color>の1つだけで、効きの強さを決めます。ダイナミクスも潰れるので、トラックから静かな部分がなくなります

  <color=#B48CE0><b>補足：</b></color><b>リセット</b>すると<b>Mix Level</b>もデフォルトの-80 dBに戻るため、エフェクトはオフになります

  詳細：<link="https://bullethero.space/ja/docs/editor/resources/preparing-the-track"><color=#59A6FF>オーディオトラックの準備</color></link>
hint_editor_inspector-audio_distortion_header: "ディストーション"
hint_editor_inspector-audio_echo-decay: "各リピートが次のリピートへ送られる割合です。高いほど長く響きます"
hint_editor_inspector-audio_echo-delay: "リピートの間隔（ミリ秒）です。曲のテンポに合わせると、エコーがビートに乗ります"
hint_editor_inspector-audio_echo-dry-mix: "出力に含まれる原音のレベルです"
hint_editor_inspector-audio_echo-max-channels: "エコーバッファーのチャンネル数の上限です"
hint_editor_inspector-audio_echo-wet-mix: "エコー音のレベルです。Mix Levelとは別に、Dry Mixとのバランスで決まります"
hint_editor_inspector-audio_echo_body: |-
  一定の間隔で信号を繰り返し、リピートのたびに音が小さくなります。<link="hint_editor_inspector-audio_reverb"><color=#59A6FF>リバーブ</color></link>のような空間の響きではなく、独立したコピーです。<color=#D4B483>Delay</color>は間隔（ミリ秒）、<color=#D4B483>Decay</color>は各コピーが次へ送られる割合です

  <color=#B48CE0><b>補足：</b></color><b>リセット</b>すると<b>Mix Level</b>もデフォルトの-80 dBに戻るため、エフェクトはオフになります

  詳細：<link="https://bullethero.space/ja/docs/editor/resources/preparing-the-track"><color=#59A6FF>オーディオトラックの準備</color></link>
hint_editor_inspector-audio_echo_header: "エコー"
hint_editor_inspector-audio_enabled: "このエフェクトがチェーンに入っているかどうかです。専用のフラグはありません。チェックするとMix Levelが-80 dBの下限から上がり、外すと下限に戻ります。設定していたレベルは保持されます"
hint_editor_inspector-audio_flange-depth: "ディレイの揺れ幅です"
hint_editor_inspector-audio_flange-dry-mix: "処理されていない原音のレベルです"
hint_editor_inspector-audio_flange-rate: "スイープが繰り返される速さ（Hz）です"
hint_editor_inspector-audio_flange-wet-mix: "スイープするコピーのレベルです。2つの信号の打ち消し合いがこのエフェクトの正体です"
hint_editor_inspector-audio_flange_body: |-
  信号に、ごく短くスイープする自分自身のディレイを混ぜます。ジェット機のような「シュワー」という音です。<link="hint_editor_inspector-audio_chorus"><color=#59A6FF>コーラス</color></link>に似ていますが、コピーが1つなので、広がりではなくスイープが聞こえます。<color=#D4B483>Dry Mix</color>と<color=#D4B483>Wet Mix</color>が近いほど効果が深くなります

  <color=#B48CE0><b>補足：</b></color><b>リセット</b>すると<b>Mix Level</b>もデフォルトの-80 dBに戻るため、エフェクトはオフになります

  詳細：<link="https://bullethero.space/ja/docs/editor/resources/preparing-the-track"><color=#59A6FF>オーディオトラックの準備</color></link>
hint_editor_inspector-audio_flange_header: "フランジャー"
hint_editor_inspector-audio_header: "オーディオトラックのインスペクター"
hint_editor_inspector-audio_highpass-cutoff-freq: "トラックのこの周波数（Hz）より低い成分を減衰させます。最小値ではフィルターは実質的に素通しです"
hint_editor_inspector-audio_highpass_body: |-
  <link="hint_editor_inspector-audio_lowpass"><color=#59A6FF>ローパス</color></link>の逆です。高域を通し、<color=#D4B483>Cutoff Freq</color>より下をすべてカットします。カットオフを上げると、トラックは小さなスピーカーのような細い音になります

  <color=#5EC8C8><b>ヒント：</b></color>チェーンは<b>トラック</b>に属し、キーフレームでは変えられません。曲の途中で変えるには、トラックを分割して前後を別々に設定します

  <color=#B48CE0><b>補足：</b></color><b>リセット</b>すると<b>Mix Level</b>もデフォルトの-80 dBに戻るため、エフェクトはオフになります

  詳細：<link="https://bullethero.space/ja/docs/editor/resources/preparing-the-track"><color=#59A6FF>オーディオトラックの準備</color></link>
hint_editor_inspector-audio_highpass_header: "ハイパス"
hint_editor_inspector-audio_lowpass-cutoff-freq: "トラックのこの周波数（Hz）より高い成分を減衰させます。最大値ではフィルターは実質的に素通しです"
hint_editor_inspector-audio_lowpass_body: |-
  低域を通し、<color=#D4B483>Cutoff Freq</color>より上をすべてカットします。水中や壁越しのような音です。範囲の上端ではフィルターは実質的に素通しです

  <color=#5EC8C8><b>ヒント：</b></color>チェーンは<b>トラック</b>に属し、キーフレームでは変えられません。曲の途中で変えるには、トラックを分割して前後を別々に設定します

  <color=#B48CE0><b>補足：</b></color><b>リセット</b>すると<b>Mix Level</b>もデフォルトの-80 dBに戻るため、エフェクトはオフになります

  詳細：<link="https://bullethero.space/ja/docs/editor/resources/preparing-the-track"><color=#59A6FF>オーディオトラックの準備</color></link>
hint_editor_inspector-audio_lowpass_header: "ローパス"
hint_editor_inspector-audio_mix-level: "処理済みの信号を混ぜ戻すレベル（dB）です。-80ではエフェクトは無音になり、これが「オフ」の保存方法です。ファイルに別のスイッチはありません"
hint_editor_inspector-audio_normalize-fade-in-time: "ゲインが落ち着くまでのミリ秒数です。補正が急な変化として聞こえないようにします"
hint_editor_inspector-audio_normalize-lowest-volume: "これより小さい信号はそのままにします。無音やノイズフロアが増幅されてヒスノイズになるのを防ぎます"
hint_editor_inspector-audio_normalize-maximum-amp: "適用できるゲインの上限です"
hint_editor_inspector-audio_normalize_body: |-
  信号を目標の音量に近づけ、異なるソースのクリップを同程度のレベルにそろえます。扱うのは全体のレベルで、トラック内のダイナミクスは<link="hint_editor_inspector-audio_compressor"><color=#59A6FF>コンプレッサー</color></link>の担当です。<color=#D4B483>Lowest Volume</color>は無音がヒスノイズになるのを防ぎ、<color=#D4B483>Maximum Amp</color>はブーストの上限を決めます

  <color=#B48CE0><b>補足：</b></color><b>リセット</b>すると<b>Mix Level</b>もデフォルトの-80 dBに戻るため、エフェクトはオフになります

  詳細：<link="https://bullethero.space/ja/docs/editor/resources/preparing-the-track"><color=#59A6FF>オーディオトラックの準備</color></link>
hint_editor_inspector-audio_normalize_header: "ノーマライズ"
hint_editor_inspector-audio_param-eq-center-freq: "バンドの中心周波数（Hz）です"
hint_editor_inspector-audio_param-eq-frequency-gain: "バンド内に適用するゲインです。1未満でカット、1より大きいとブーストします"
hint_editor_inspector-audio_param-eq-octave-range: "バンドの幅（オクターブ）です。ピンポイントの修正には狭く、音色づくりには広くします"
hint_editor_inspector-audio_param-eq_body: |-
  スペクトルの選んだ帯域をブーストまたはカットする、1つのパラメトリックバンドです。<link="hint_editor_inspector-audio_lowpass"><color=#59A6FF>ローパス</color></link>や<link="hint_editor_inspector-audio_highpass"><color=#59A6FF>ハイパス</color></link>と違い、レベルを足すこともできます。<color=#D4B483>Center Freq</color>はバンドの位置、<color=#D4B483>Octave Range</color>はその幅、<color=#D4B483>Frequency Gain</color>は1未満でカット、1より大きいとブーストします

  <color=#B48CE0><b>補足：</b></color><b>リセット</b>すると<b>Mix Level</b>もデフォルトの-80 dBに戻るため、エフェクトはオフになります

  詳細：<link="https://bullethero.space/ja/docs/editor/resources/preparing-the-track"><color=#59A6FF>オーディオトラックの準備</color></link>
hint_editor_inspector-audio_param-eq_header: "パラメトリックEQ"
hint_editor_inspector-audio_pitch-shifter-fft-size: "解析ウィンドウのサイズです。アルゴリズムの品質とレイテンシーのバランスを決めます"
hint_editor_inspector-audio_pitch-shifter-max-channels: "処理するチャンネル数の上限です"
hint_editor_inspector-audio_pitch-shifter-overlap: "連続するウィンドウの重なり具合です。重なりを増やすとアーティファクトが減りますが、負荷が上がります"
hint_editor_inspector-audio_pitch-shifter-pitch: "ピッチの倍率です。1で変化なし、2で1オクターブ上がります"
hint_editor_inspector-audio_pitch-shifter_body: |-
  速度を変えずにピッチを変えるので、タイミングは曲に合ったままです。<color=#D4B483>Pitch</color>は倍率で、1ならそのまま、2で1オクターブ上がります。<color=#D4B483>FFT Size</color>と<color=#D4B483>Overlap</color>で品質と負荷のバランスを取ります

  <color=#5EC8C8><b>ヒント：</b></color>チェーンは<b>トラック</b>に属し、キーフレームでは変えられません。曲の途中で変えるには、トラックを分割して前後を別々に設定します

  <color=#B48CE0><b>補足：</b></color><b>リセット</b>すると<b>Mix Level</b>もデフォルトの-80 dBに戻るため、エフェクトはオフになります

  詳細：<link="https://bullethero.space/ja/docs/editor/resources/preparing-the-track"><color=#59A6FF>オーディオトラックの準備</color></link>
hint_editor_inspector-audio_pitch-shifter_header: "ピッチシフター"
hint_editor_inspector-audio_reverb-decay-hf-ratio: "高域が低域よりどれだけ速く減衰するかです。1未満では、消えていくにつれて残響が暗くなります"
hint_editor_inspector-audio_reverb-decay-time: "残響が消えるまでの秒数です。部屋の大きさを最も強く感じさせる要素です"
hint_editor_inspector-audio_reverb-density: "シミュレートする空間のモード密度です"
hint_editor_inspector-audio_reverb-diffusion: "時間あたりのエコー密度です。低い値では残響がざらついた金属的な音になります"
hint_editor_inspector-audio_reverb-dry-level: "出力に含まれる原音のレベルです"
hint_editor_inspector-audio_reverb-hf-reference: "Room HFとDecay HF Ratioの設定を測る基準の周波数です"
hint_editor_inspector-audio_reverb-lf-reference: "Room LFの設定を測る基準の周波数です"
hint_editor_inspector-audio_reverb-reflect-delay: "初期反射が届くまでのディレイです。壁までの距離にあたります"
hint_editor_inspector-audio_reverb-reflections: "初期反射のレベルです。近くの壁から最初に返ってくる、はっきりした反射です"
hint_editor_inspector-audio_reverb-reverb: "初期反射に対して、後から来る拡散した残響のレベルです"
hint_editor_inspector-audio_reverb-reverb-delay: "その残響が始まるまでのディレイです"
hint_editor_inspector-audio_reverb-room: "残響音全体のレベルです。部屋の存在感にあたります"
hint_editor_inspector-audio_reverb-room-hf: "高域での部屋のレベルです。下げると、柔らかく吸音性のある壁のように聞こえます"
hint_editor_inspector-audio_reverb-room-lf: "低域での部屋のレベルです"
hint_editor_inspector-audio_reverb_body: |-
  トラックを部屋の中に置きます。初期反射のあとに、減衰していく残響が続きます。まずは3つのフィールドから：<color=#D4B483>Decay Time</color>は部屋の大きさ、<color=#D4B483>Room</color>はその聞こえる量、<color=#D4B483>Room HF</color>を低くカットすると壁が柔らかくなります

  <color=#B48CE0><b>補足：</b></color><b>リセット</b>すると<b>Mix Level</b>もデフォルトの-80 dBに戻るため、エフェクトはオフになります

  詳細：<link="https://bullethero.space/ja/docs/editor/resources/preparing-the-track"><color=#59A6FF>オーディオトラックの準備</color></link>
hint_editor_inspector-audio_reverb_header: "リバーブ"
hint_editor_inspector-effect_angle-a: "角度（度単位）。「ランダム」系のバリアントでは、各パーティクルが値を抽選する範囲の一端です"
hint_editor_inspector-effect_angle-b: "各パーティクルが角度を抽選する範囲のもう一端です"
hint_editor_inspector-effect_angle-curve: "角度を読み取るカーブです。「寿命に沿ったカーブ」ではパーティクル自身の寿命に対して、「速度に応じたカーブ」では速度に対して読み取ります"
hint_editor_inspector-effect_angle-speed-range: "カーブを割り当て直す速度の範囲です。カーブの始点として読む速度と、終点として読む速度を指定します"
hint_editor_inspector-effect_angle-type: "5種類の回転バリアントのどれかを選びます。変更するとサブオブジェクト全体が置き換わるため、下の行は新しいバリアントのものになります"
hint_editor_inspector-effect_angle_body: |-
  パーティクルが寿命の間にどう回転するかを、5種類のバリアントの1つで指定します：固定の「<color=#D4B483>値</color>」、2種類の「<color=#D4B483>カーブ</color>」、パーティクルごとに抽選する2種類の「<color=#D4B483>ランダム</color>」範囲

  「<color=#D4B483>寿命に沿ったカーブ</color>」はパーティクルの寿命に沿って、「<color=#D4B483>速度に応じたカーブ</color>」は下の速度範囲を通して速度に沿ってカーブを読み取ります

  このボタンの横にある<b>リセット</b>は「<color=#D4B483>タイプ</color>」もリセットし、カーブやランダムの値の組も一緒に戻ります

  詳細：<link="https://bullethero.space/ja/docs/editor/craft/readability-and-fairness"><color=#59A6FF>読みやすさと公平さ</color></link>
hint_editor_inspector-effect_angle_header: "角度"
hint_editor_inspector-effect_body: |-
  <color=#D4B483>VFX Graph</color>エフェクトのパラメーターをグループ別に表示します：構成、基本、力、シェイプ、角度、スケール、色。グループは1つずつではなく、すべて同時に表示されます

  <color=#B48CE0><b>補足：</b></color>エフェクトは<b>ほかのすべてと同じ方法でシードされます</b>。乱数ジェネレーターの状態ではなく編集する数値から決まるため、同じレベルはどのデバイスでも同じように再生されます

  <color=#5EC8C8><b>ヒント：</b></color>色はリテラル値の代わりにレベルのテーマを参照でき、グラデーション型の値は共通のグラデーションエディターで開きます

  詳細：<link="https://bullethero.space/ja/docs/editor/performance/level-budget"><color=#59A6FF>レベルの予算</color></link>
hint_editor_inspector-effect_color-a: "パーティクルの色。「ランダム」系のバリアントでは、各パーティクルが値を抽選する範囲の一端です"
hint_editor_inspector-effect_color-b: "各パーティクルが色を抽選する範囲のもう一端です"
hint_editor_inspector-effect_color-gradient: "色合いを読み取るグラデーションです。バリアントに応じて、パーティクルの寿命に沿って、速度に沿って、またはパーティクルごとに1色を選んで読み取ります"
hint_editor_inspector-effect_color-speed-range: "グラデーションを割り当て直す速度の範囲です。始点として読む速度と、終点として読む速度を指定します"
hint_editor_inspector-effect_color-type: "6種類の色合いバリアントのどれかを選びます。変更するとサブオブジェクト全体が置き換わるため、下の行は新しいバリアントのものになります"
hint_editor_inspector-effect_color_body: |-
  パーティクルが寿命の間にどう色づくかを、6種類のバリアントの1つで指定します：<link="hint_editor_inspector-effect_angle"><color=#59A6FF>角度</color></link>と<link="hint_editor_inspector-effect_scale"><color=#59A6FF>スケール</color></link>の5種類をカーブの代わりにグラデーションにしたものと、パーティクルごとに1色を選ぶ「<color=#D4B483>ランダムグラデーション</color>」

  <color=#5EC8C8><b>ヒント：</b></color>ここの色はテーマの参照にできるため、途中でパレットを変えるレベルにもエフェクトが追従します

  このボタンの横にある<b>リセット</b>は「<color=#D4B483>タイプ</color>」もリセットし、グラデーションや色の組も一緒に戻ります

  詳細：<link="https://bullethero.space/ja/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>色、テーマ、ポストプロセス</color></link>
hint_editor_inspector-effect_color_header: "色"
hint_editor_inspector-effect_config-has-stop-frame: "「停止フレーム」を考慮するかどうか。オフの場合、エミッターはオブジェクトが存在する限り放出し続けます"
hint_editor_inspector-effect_config-stop-frame: "放出を止めるフレームです。レベルの時間ではなく、オブジェクト自身のスパンの開始から数えます。すでに存在するパーティクルは寿命を最後まで全うします"
hint_editor_inspector-effect_config_body: |-
  エミッターがいつ放出を止めるかを指定します。オフの場合はオブジェクトが存在する限り放出し、これが通常のケースです

  「<color=#D4B483>停止フレーム</color>」はレベルのタイムラインではなく、オブジェクト自身のスパンの開始から数えます。すでに存在するパーティクルは寿命を全うするため、映像はぷつりと切れずにフェードアウトします

  このボタンの横にある<b>リセット</b>は、両方のフィールドを開発者のデフォルト値に戻します。この操作は「元に戻す」1回分のステップになります

  詳細：<link="https://bullethero.space/ja/docs/editor/performance/level-budget"><color=#59A6FF>レベルの予算</color></link>
hint_editor_inspector-effect_config_header: "構成"
hint_editor_inspector-effect_core-lifetime-bounds: "パーティクルが存在する最小・最大の秒数で、パーティクルごとに抽選されます。このばらつきがあるので、バーストが一斉に消えずに済みます。この2つの平均は、ワンショットの一括放出数に掛ける値にもなります"
hint_editor_inspector-effect_core-loop: "補充されない1回きりの一括放出ではなく、システムが連続して放出するかどうか。オフの場合、寿命の範囲を過ぎると描くものは何も残りません"
hint_editor_inspector-effect_core-particle-count: "1秒あたりに放出されるパーティクル数で、コストを左右する主なつまみです。同時に存在する数はこの値に平均寿命を掛けたもので、どちらのモードでも同じです：ループでは毎秒この数ずつ放出し、ワンショットではその積の全量を一度にバーストします。上限はグラフ自身の容量で、システムはパーティクルの有無に関係なく毎フレームその容量分を処理します"
hint_editor_inspector-effect_core-particle-pivot: "パーティクル上で、その位置に置かれ、回転の中心となる点です。オブジェクト自身のピボットのパーティクル版にあたります"
hint_editor_inspector-effect_core-render: "パーティクルを描画するかどうか。オフにしてもシステムのシミュレーションは続くため、副次的な効果だけが必要なときに便利です"
hint_editor_inspector-effect_core-shape-id: "各パーティクルを描くジオメトリで、オブジェクトと同じシェイプのプールから選びます。「なし」は何も描画しません。クアッドは普通の値の1つで、このフィールドのデフォルトです"
hint_editor_inspector-effect_core-texture-id: "各パーティクルが描く画像で、オブジェクトと同じリソースのプールから選びます。「なし」はパーティクルに何も塗らず、これがこのフィールドのデフォルトです"
hint_editor_inspector-effect_core_body: |-
  パーティクルがいくつ存在し、どれだけの間存在し、何で描かれるかを指定します。動き方は<link="hint_editor_inspector-effect_forces"><color=#59A6FF>力</color></link>で指定します

  「<color=#D4B483>パーティクル数</color>」がコストを左右する主なつまみです：エミッターのコストはおおよそ数×「<color=#D4B483>寿命の範囲</color>」です。「<color=#D4B483>シェイプ</color>」と「<color=#D4B483>テクスチャ</color>」は空のままでもかまいません。テクスチャなしのパーティクルが最も軽いケースです

  <color=#E8B04B><b>警告：</b></color>数の上限は1024で、グラフは存在するパーティクルの分だけでなく、容量全体の分を毎フレーム負担します。必要な数だけ指定してください

  詳細：<link="https://bullethero.space/ja/docs/editor/performance/level-budget"><color=#59A6FF>レベルの予算</color></link>
hint_editor_inspector-effect_core_header: "基本"
hint_editor_inspector-effect_forces-linear-force: "速度ではなく一定の加速度です。そのため効果は一定のままではなく、パーティクルの寿命の間に積み重なっていきます"
hint_editor_inspector-effect_forces-linear-velocity: "パーティクルが生まれたときの速度に加えて毎フレーム足される一定のドリフトです。衝撃ではなく風のようなものです"
hint_editor_inspector-effect_forces-orbital-center-offset: "その軌道の中心がエミッターに対してどこにあるか。ずらすと渦が偏ります"
hint_editor_inspector-effect_forces-orbital-velocity: "パーティクル自身ではなく中心の周りを回る回転です。2Dシーンで意味を持つのはZ成分です"
hint_editor_inspector-effect_forces-start-angular-velocity-max: "初期回転速度を抽選する範囲の上限"
hint_editor_inspector-effect_forces-start-angular-velocity-min: "初期回転速度を抽選する範囲の下限（度/秒）"
hint_editor_inspector-effect_forces-start-gravity-max: "パーティクルごとに抽選する重力の上限"
hint_editor_inspector-effect_forces-start-gravity-min: "パーティクルごとに抽選する重力の下限。負の値では上に浮かびます"
hint_editor_inspector-effect_forces-start-velocity-max: "初期速度を抽選する範囲の上限。この2つの差を広げると、整ったバーストが広がるスプレーに変わります"
hint_editor_inspector-effect_forces-start-velocity-min: "初期速度を抽選する範囲の下限（軸ごと）"
hint_editor_inspector-effect_forces-velocity-speed: "パーティクルの速度全体に掛かる倍率です。上の各フィールドを調整し直さずに、完成したエフェクトを遅くしたり速くしたりできる1つのつまみです"
hint_editor_inspector-effect_forces_body: |-
  パーティクルが放出された後に動かすものすべてです。どこから始まるかは<link="hint_editor_inspector-effect_shape"><color=#59A6FF>シェイプ</color></link>で指定します

  「<color=#D4B483>初期</color>」で始まるペアは、誕生時にパーティクルごとに一度だけ抽選されます。それ以外はパーティクルの寿命の間ずっと作用し、「<color=#D4B483>直線方向の力</color>」は加速度なので積み重なっていきます

  <color=#5EC8C8><b>ヒント：</b></color>「<color=#D4B483>移動速度</color>」は結果全体に掛かるため、ほかを調整し直さずに完成したエフェクトを遅くしたり速くしたりできます

  詳細：<link="https://bullethero.space/ja/docs/editor/craft/composition-and-camera"><color=#59A6FF>構図とカメラ</color></link>
hint_editor_inspector-effect_forces_header: "力"
hint_editor_inspector-effect_header: "エフェクトインスペクター"
hint_editor_inspector-effect_scale-a: "パーティクルのサイズ。「ランダム」系のバリアントでは、各パーティクルが値を抽選する範囲の一端です"
hint_editor_inspector-effect_scale-b: "各パーティクルがサイズを抽選する範囲のもう一端です"
hint_editor_inspector-effect_scale-curve-x: "水平方向のサイズを読み取るカーブで、垂直方向とは独立しています"
hint_editor_inspector-effect_scale-curve-y: "垂直方向のサイズを読み取るカーブで、水平方向とは独立しています"
hint_editor_inspector-effect_scale-speed-range: "2つのカーブを割り当て直す速度の範囲です。始点として読む速度と、終点として読む速度を指定します"
hint_editor_inspector-effect_scale-type: "5種類のサイズバリアントのどれかを選びます。変更するとサブオブジェクト全体が置き換わるため、下の行は新しいバリアントのものになります"
hint_editor_inspector-effect_scale_body: |-
  パーティクルが寿命の間にどの大きさになるかを、<link="hint_editor_inspector-effect_angle"><color=#59A6FF>角度</color></link>と同じ5種類のバリアントで指定します。「<color=#D4B483>カーブ X</color>」と「<color=#D4B483>カーブ Y</color>」は別々に読み取られるので、パーティクルを縮めながら引き伸ばすこともできます

  <color=#E8B04B><b>警告：</b></color>カーブの下の行は使い回されます：「値」と「ランダム」系ではサイズそのもの、「速度に応じたカーブ」では速度の範囲です。どちらなのかは横のキャプションに表示されます

  このボタンの横にある<b>リセット</b>は「<color=#D4B483>タイプ</color>」もリセットし、両方のカーブとランダムの値の組も一緒に戻ります

  詳細：<link="https://bullethero.space/ja/docs/editor/craft/readability-and-fairness"><color=#59A6FF>読みやすさと公平さ</color></link>
hint_editor_inspector-effect_scale_header: "スケール"
hint_editor_inspector-effect_shape-arc: "外周のうち実際に使う部分で、単位はラジアン、+X軸から反時計回りに測ります。1周未満にすると扇形になります"
hint_editor_inspector-effect_shape-box-size: "放出用の長方形の幅と高さ（全長）で、エフェクトオブジェクトを中心に配置されます"
hint_editor_inspector-effect_shape-circle-aspect: "縦の半軸を半径の倍数で指定します：1なら円、それ以外は楕円です"
hint_editor_inspector-effect_shape-circle-radius: "中心からリングまでの距離（水平軸方向）"
hint_editor_inspector-effect_shape-circle-thickness: "リングを内側へどこまで塗りつぶすか：0は輪郭だけ、1は塗りつぶした円盤です"
hint_editor_inspector-effect_shape-cone-base-radius: "エミッター側の端の半径"
hint_editor_inspector-effect_shape-cone-height: "2つの端の間の距離、つまり放出領域の奥行きです"
hint_editor_inspector-effect_shape-cone-top-radius: "遠い側の端の半径。底面の半径より大きいと外に広がり、小さいと漏斗状にすぼまります"
hint_editor_inspector-effect_shape-line-end: "線分のもう一方の端"
hint_editor_inspector-effect_shape-line-start: "線分の一方の端（エフェクトオブジェクトのローカル座標）"
hint_editor_inspector-effect_shape-spread: "巡回が最初に戻るまでにカバーするシェイプの割合"
hint_editor_inspector-effect_shape-spread-speed: "放出点が進む速さで、見た目の回転速度を決めます"
hint_editor_inspector-effect_shape-spread-type: "続くパーティクルがシェイプをどう巡るか：「ランダム」、一方向に回る「ループ」、往復する「ピンポン」、正弦波に沿う「サイン」。静止したリングを回転や往復するパターンに変えるのはこの設定です"
hint_editor_inspector-effect_shape-torus-radius-major: "チューブを曲げて作るリングの半径"
hint_editor_inspector-effect_shape-torus-radius-minor: "チューブ自体の半径、つまりリングの太さ"
hint_editor_inspector-effect_shape-type: "どの放出領域かを選びます。変更するとシェイプが置き換わるため、下のフィールドは古いシェイプではなく新しいシェイプのものになります"
hint_editor_inspector-effect_shape_body: |-
  放出領域：点、リング、長方形、線分、円錐、トーラスのいずれかです。決めるのはパーティクルがどこから始まるかだけで、その後の動きは<link="hint_editor_inspector-effect_forces"><color=#59A6FF>力</color></link>で決まります

  「<color=#D4B483>タイプ</color>」を変えると下の行が変わり、行はタイプ間で共有されます。「<color=#D4B483>弧</color>」の単位はラジアンで、1周未満にすると扇形になります

  <color=#5EC8C8><b>ヒント：</b></color><b>拡散</b>を「ループ」にすると、定番の回転エミッターになります

  このボタンの横にある<b>リセット</b>は「<color=#D4B483>タイプ</color>」もリセットし、シェイプも一緒に戻ります

  詳細：<link="https://bullethero.space/ja/docs/editor/craft/composition-and-camera"><color=#59A6FF>構図とカメラ</color></link>
hint_editor_inspector-effect_shape_header: "シェイプ"
hint_editor_inspector-keyframe_body: |-
  <b>選択に含まれるトラックをすべて同時に表示します</b>。最後にクリックしたトラックだけではありません。値が空欄なら、選択中のキーフレームの間でその値が<b>一致していません</b>

  <color=#5EC8C8><b>ヒント：</b></color>「<b>イージング</b>」はトラックをまたいで機能し、<b>1回の元に戻す操作</b>でまとめて取り消せます

  <color=#B48CE0><b>補足：</b></color>複数のキーフレームを選択している間は「<b>フレーム</b>」がロックされます。1つの数値を入れると、すべてが同じフレームに重なってしまうためです。代わりにタイムライン上でドラッグしてください

  詳細：<link="https://bullethero.space/ja/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>エディターの仕組み</color></link>
hint_editor_inspector-keyframe_header: "キーフレームインスペクター"
hint_editor_inspector-object_body: |-
  選択中のオブジェクト自身のフィールドです。どのタイプにも空オブジェクトの共通フィールドが表示され、シェイプ、エフェクト、テキスト、プレハブの各オブジェクトはその下に独自のフィールドを追加します

  「<b>アクティブ</b>」をオフにすると、レンダリング<i>と</i>衝突の両方が無効になり、子にも継承されます。ここで非表示にしたオブジェクトがプレイヤーを倒すことはありません

  <color=#E86A5A><b>注意：</b></color>「<b>レイヤー</b>」は親からの相対値です。横にある読み取り専用のグローバルレイヤーが、レンダラーが実際に使う値です

  <color=#5EC8C8><b>ヒント：</b></color>プレハブから配置したオブジェクトのフィールドを編集すると、<b>インスタンスごとのオーバーライド</b>として記録されます。横のチェックボックスでその有無を確認でき、元に戻すこともできます

  詳細：<link="https://bullethero.space/ja/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>エディターの仕組み</color></link>
hint_editor_inspector-object_header: "オブジェクトインスペクター"
hint_editor_inspector-resolved_body: |-
  選択中のオブジェクトが現在のフレームで実際に<b>どうなっているか</b>を表示します。値は編集した内容ではなく、実行中のシミュレーションから読み取ります

  行末の四角はそのフィールドのキーフレームの状態です。青はこのフレームにキーフレームがある（四角をクリックすると選択）、琥珀色はキーフレーム間で補間中、灰色はキーフレームの範囲外で値を保持中、中抜きはキーフレームがなくデフォルト値を使用中です。矢印で再生ヘッドを前または次のキーフレームへ移動できます

  区切り線の下には合成された値が並びます。合計したレイヤー、継承された「アクティブ」フラグ、親と合成したトランスフォームです。どのキーフレームでも設定されないため、インジケーターはありません

  詳細：<link="https://bullethero.space/ja/docs/editor/reference/object-properties"><color=#59A6FF>オブジェクトのプロパティ</color></link>
hint_editor_inspector-resolved_header: "現在値"
hint_editor_inspector_audio-span-fit: "クリップのうちレベル終了までに収まる範囲いっぱいまでトラックを伸ばします。参照先を解決できるクリップがない場合と、速度がゼロの場合は使用できません。停止したトラックには合わせる長さがないためです"
hint_editor_inspector_audio-span-fit-level: "クリップ全体が収まるまで、トラックとレベルを一緒に伸ばします。レベルは長くなるだけで、すでに収まっているクリップでは何も変わりません"
hint_editor_inspector_collider-id_body: |-
  このオブジェクトが<b>当たる</b>範囲です。何を描画するかとは別に選びます

  <color=#B48CE0><b>補足：</b></color>描画と当たり判定はどちらも他方から自動で決まらず、これは意図的です。描画されるが無害な予告ビーム、見た目より単純な当たり判定、見えない壁は、どれも小技ではなく普通のコンテンツです

  <color=#5EC8C8><b>ヒント：</b></color>どちらのフィールドも同じ2つのコレクションから選ぶため、レベル独自のシェイプはどちらにも、両方にも使えます

  詳細：<link="https://bullethero.space/ja/docs/editor/craft/readability-and-fairness"><color=#59A6FF>読みやすさと公平さ</color></link>
hint_editor_inspector_collider-id_header: "コライダー"
hint_editor_inspector_ease_body: |-
  前のキーフレームからこのキーフレームへ、値がどう変化して到達するかを決めます

  <color=#B48CE0><b>補足：</b></color>イージングはキーフレームの<b>入ってくる側</b>に属します。そのため、トラックの最初のキーフレームにはイージングの起点がなく、選んでも見た目に反映されません

  <color=#5EC8C8><b>ヒント：</b></color>複数のキーフレームを選択していると、トラックやオブジェクトをまたいでもすべてに適用され、<b>1回の元に戻す操作</b>でまとめて取り消せます。選択が空欄なら、それらの設定が一致していません

  詳細：<link="https://bullethero.space/ja/docs/editor/basics/keyframes-and-easing"><color=#59A6FF>キーフレームとイージング</color></link>
hint_editor_inspector_ease_header: "イージング"
hint_editor_inspector_global-layer: "レンダラーが実際に使う描画順です。このオブジェクト自身のレイヤーに、すべての祖先のレイヤーを足した値です。保存されるのではなく計算されるため、読み取り専用です"
hint_editor_inspector_layer_body: |-
  描画順です。絶対値ではなく<b>親からの相対値</b>です

  <color=#E86A5A><b>注意：</b></color>レンダラーはこの数値にすべての祖先の値を足して使います。その合計は下の「<b>グローバル</b>」に読み取り専用で表示されます。親を変えると、この数値が同じままでもオブジェクトの描画位置が変わります

  <color=#B48CE0><b>補足：</b></color>ランダムな値は実効レイヤーに結び付いているため、ヒエラルキー内でオブジェクトを移動すると値が振り直されます

  詳細：<link="https://bullethero.space/ja/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>エディターの仕組み</color></link>
hint_editor_inspector_layer_header: "レイヤー"
hint_editor_inspector_object-type: "このオブジェクトの種類です。変更するとオブジェクトが丸ごと置き換わります。共通のフィールドは残り、新しいタイプに入る場所のないものは失われます"
hint_editor_inspector_parent: "このオブジェクトが追従するオブジェクトです。親は自分のトランスフォームを子に合成し、レイヤーはチェーンに沿って加算されます。そのため親を変えると、描画順の位置も変わります"
hint_editor_inspector_shader-type_body: |-
  このオブジェクトが通るレンダリング経路です

  <color=#E86A5A><b>注意：</b></color>「<b>自動</b>」はレベルの読み込み時に一度だけ決定し、レベルの見た目を変えることはありません。アルファから不透明だと証明できないものはすべて透明になります

  <color=#5EC8C8><b>ヒント：</b></color>このフィールドの横のラベルに、「自動」が実際に何に決まったかが表示されます。レンダラーのデータから直接読み取った値です

  詳細：<link="https://bullethero.space/ja/docs/editor/performance/level-budget"><color=#59A6FF>レベルの予算</color></link>
hint_editor_inspector_shader-type_header: "シェーダータイプ"
hint_editor_inspector_shape-id_body: |-
  このオブジェクトが<b>描画する</b>ものです

  <color=#B48CE0><b>補足：</b></color>シェイプはボックスに合わせた本物のジオメトリで、長いほうの軸がちょうど1になります。そのため、画面に表示されるのはオブジェクトの長方形そのものです。ゲームは約500種類を生成し、レベルが独自のシェイプを追加することもできます

  <color=#5EC8C8><b>ヒント：</b></color>ここを空のままにしても問題ありません。何も描画せずコライダーだけを持つオブジェクトは、見えない壁になります

  詳細：<link="https://bullethero.space/ja/docs/editor/craft/readability-and-fairness"><color=#59A6FF>読みやすさと公平さ</color></link>
hint_editor_inspector_shape-id_header: "シェイプ"
hint_editor_inspector_span_body: |-
  このオブジェクトが存在する期間で、半開区間です。開始フレームは含まれ、終了フレームは含まれません。20で終わるオブジェクトと20から始まるオブジェクトが、そのフレームで同時に描画されることはありません

  <color=#B48CE0><b>補足：</b></color>子のスパンは親のスパンの内側に収まる必要がありますが、これは読み取り時に解決され、保存はされません。親を縮めると子は切り詰められ、再び伸ばすと子も戻ります。レベルの終わりを越えるルートオブジェクトは、単に再生されません

  <b>アンカー</b>は辺を親の辺に追従させ、何が再生されるかを決めます。アンカー付きの子は、伸びる親と一緒に伸びます。アニメーションは作成したタイミングのまま変わりません

  詳細：<link="https://bullethero.space/ja/docs/editor/basics/frames-and-time"><color=#59A6FF>フレーム、時間、レベルの長さ</color></link>
hint_editor_inspector_span_header: "スパン"
hint_editor_interop-report: "他のゲームのフォーマットから変換したときに、何が引き継がれ何が失われたかを示します。各項目は情報提供のみです。レベルはすでに読み込まれており、ここには元のデータとの違いが書かれています"
hint_editor_level-export_body: |-
  このレベルをゲームの外に書き出します。フォルダーとしても、1つのアーカイブとしても出力できます。レベルが使うものはすべて一緒に書き出され、レベルフォルダーの外にある曲も含まれます

  通常の<b>.zip</b>は、何もインストールせずにWindowsのエクスプローラーで開けます。パスワード付きの形式はそうはいきません。「<b>+ パスワード</b>」は7-Zipなどのアーカイバーで、「<b>（gpg）</b>」はgpgで開きます

  <color=#5EC8C8><b>ヒント：</b></color>一緒に書き出せなかったもの（URLの先にあるリソースや、どこからも参照されていないファイルなど）は、後でレポートに一覧表示されます

  <color=#E8B04B><b>警告：</b></color>パスワードはDRMではありません。ファイルとパスワードを持っている人は、いつでも開けます

  詳細：<link="https://bullethero.space/ja/docs/editor/workflow/sharing-by-hand"><color=#59A6FF>レベルを手動で共有する方法</color></link>
hint_editor_level-export_header: "レベルをエクスポート"
hint_editor_level-protection_body: |-
  ディスク上のこのレベルのドキュメントを暗号化し、レベルを開くときにパスワードを求めるようにします。メタデータ、カバー、メディアは読める状態のままなので、パスワードがなくてもレベルカードは表示されます

  パスワードはセッションごとに一度だけ尋ねられ、メモリ内にのみ保持されます。保護を解除するには、フィールドを空にして「<b>適用</b>」を押します

  <color=#E86A5A><b>注意：</b></color>忘れたパスワードは復元できません。キーはどこにも保存されていません

  詳細：<link="https://bullethero.space/ja/docs/editor/reference/export-and-protection"><color=#59A6FF>エクスポートと保護</color></link>
hint_editor_level-protection_header: "レベルを保護"
hint_editor_prefab-flatten-recursive_body: |-
  オフ：対象の配置だけがテンプレートへの追従をやめます。その中に置かれたプレハブは自身のリンクを保つので、内側のテンプレートを編集すれば引き続きこのレベルに反映されます。これがデフォルトです

  オン：ネストしたものもすべてフラット化され、どの深さでも、内側のテンプレートとリンクしたままのものはレベルに一切残りません

  どちらの場合もテンプレート自体はレベルに残り、フラット化全体を1回の元に戻す操作で取り消せます

  詳細：<link="https://bullethero.space/ja/docs/editor/reference/prefab-mode"><color=#59A6FF>プレハブモード</color></link>
hint_editor_prefab-flatten-recursive_header: "ネストしたプレハブもフラット化"
hint_editor_prefab-mode_body: |-
  <color=#E86A5A><b>注意：</b></color>編集しているのはプレハブの<b>テンプレート</b>で、その配置の1つではありません。保存すると、このテンプレートを参照するすべての配置に変更が反映されます

  ここでの編集では、インスタンスごとのオーバーライドは記録されません。オーバーライドが生じるのは、このモードの外で配置のオブジェクトを編集したときだけです

  <color=#5EC8C8><b>ヒント：</b></color>このテンプレート内の配置は、自身のテンプレートを上に重ねて開き、「保存して閉じる」でここに戻ります。ネストは8階層までです

  詳細：<link="https://bullethero.space/ja/docs/editor/workflow/reuse"><color=#59A6FF>再利用：プレハブ、コピー、ジェネレーター</color></link>
hint_editor_prefab-mode_header: "プレハブモード"
hint_editor_search-palette_body: |-
  モードは2つです。「<b>コマンドを実行</b>」は、エディターのあらゆる操作を名前で探します。ツールバーやコンテキストメニューが実行するのと同じ操作です。「<b>コンテンツを検索</b>」は、現在のスコープのオブジェクトとオーディオトラックを探します

  <color=#B48CE0><b>補足：</b></color>リソースはどちらのモードにもありません。各リソースは、それを必要とするフィールドから選びます

  詳細：<link="https://bullethero.space/ja/docs/editor/workflow/speed-and-shortcuts"><color=#59A6FF>スピードとショートカット</color></link>
hint_editor_search-palette_header: "コマンドパレット"
hint_editor_search-picker: "すべてのリソースフィールドが使う共通のピッカーです。入力すると一致度順にリストが並びます。フィルターで種類ごとに絞り込めます。右側のチップは、フィールドが1つのドメインしか受け付けないときに表示されます"
hint_editor_theme-ref_body: |-
  この色に固定値ではなく<b>レベルのテーマのスロット</b>を参照させます。テーマが変わると、そのスロットを参照するすべてが一度に塗り替わります

  <color=#5EC8C8><b>ヒント：</b></color>スウォッチに表示されるのは、再生ヘッドではなく、編集中のキーフレームのフレームでのパレットです。後の見た目に合わせて選ぶには、後ろにあるキーフレームを編集してください

  詳細：<link="https://bullethero.space/ja/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>色、テーマ、ポストプロセス</color></link>
hint_editor_theme-ref_header: "テーマカラーの参照"
hint_editor_timeline-audio_body: |-
  レベルのオーディオトラックを波形付きで表示します。聞こえる音に合わせて内容を揃えられます

  <color=#5EC8C8><b>ヒント：</b></color>インスペクターの「<b>トラックをフィット</b>」は、トラックをクリップの実際の長さに合わせます。クリップがないときと速度0のときは無効です

  <color=#E86A5A><b>注意：</b></color>インスペクターの「<b>音量</b>」スライダーはトラックのフェーダーです。キーフレームで付けた音量はローカルタイムラインにある別の「音量」トラックで、再生時に2つは掛け合わされます

  詳細：<link="https://bullethero.space/ja/docs/editor/resources/preparing-the-track"><color=#59A6FF>オーディオトラックの準備</color></link>
hint_editor_timeline-audio_header: "オーディオタイムライン"
hint_editor_timeline-events_body: |-
  どのオブジェクトにも属さない、レベル全体のキーフレーム：
  - カメラの位置、回転、ズーム、ピボット、揺れ
  - マーカーとチェックポイント
  - 画面制限
  - 背景とテーマ
  - すべてのポストプロセス効果
  - プレイヤーの表示、操作、衝突、サイズ、速度

  <color=#B48CE0><b>補足：</b></color>ここでは「<b>ビート</b>」レーンが例外です。その項目はスパンを持つので、「エッジ」と「ハサミ」が作用する唯一のレーンです

  <color=#5EC8C8><b>ヒント：</b></color>色は固定値を持つ代わりに、レベルのテーマを参照できます。そうすればテーマを1回変えるだけで、そのすべてが塗り替わります

  詳細：<link="https://bullethero.space/ja/docs/editor/craft/composition-and-camera"><color=#59A6FF>構図とカメラ</color></link>
hint_editor_timeline-events_header: "イベントタイムライン"
hint_editor_timeline-level_body: |-
  オブジェクトごとにクリップが1つあり、クリップが置かれたレーンがその<b>レイヤー</b>です。クリップはオブジェクトの<b>スパン</b>です。フレーム10-19は、フレーム20から始まるクリップの開始位置でちょうど終わります

  <color=#B48CE0><b>補足：</b></color>子は親のスパンの内側でだけ再生されますが、作成した内容から何かが削られるわけではありません。親を元の長さに戻せば、子も戻ってきます

  <color=#5EC8C8><b>ヒント：</b></color>「<b>選択</b>」で選んでドラッグ、「<b>エッジ</b>」で端をドラッグ、「<b>ハサミ</b>」でカーソル位置のクリップを分割します。メニューは空いている場所を右クリックして開きます

  詳細：<link="https://bullethero.space/ja/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>エディターの仕組み</color></link>、<link="https://bullethero.space/ja/docs/editor/craft/composition-and-camera"><color=#59A6FF>構図とカメラ</color></link>
hint_editor_timeline-level_header: "レベルタイムライン"
hint_editor_timeline-local_body: |-
  <b>選択中のオブジェクト</b>のキーフレームを、トラックごとに1レーンで表示します。フレームはオブジェクトのスパンの開始から数えるので、オブジェクトを動かすとアニメーション全体も一緒に動きます

  <color=#B48CE0><b>補足：</b></color><b>空のトラックも有効なデータです</b>。デフォルト値が使われるため、新しいオブジェクトはキーフレームを追加するまで何もアニメーションしません

  詳細：<link="https://bullethero.space/ja/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>エディターの仕組み</color></link>
hint_editor_timeline-local_header: "ローカルタイムライン"
hint_editor_timeline-prefab_body: |-
  プレハブモード専用のタイムラインで、<b>テンプレート</b>のオブジェクトを扱います。長さはテンプレート自体の長さで、どの配置のスパンでもありません

  <color=#E8B04B><b>警告：</b></color>選択はエディターのほかの部分と共有されません。ここでの編集はテンプレートを変更し、そのすべての配置に広がります

  詳細：<link="https://bullethero.space/ja/docs/editor/workflow/reuse"><color=#59A6FF>再利用：プレハブ、コピー、ジェネレーター</color></link>
hint_editor_timeline-prefab_header: "プレハブタイムライン"
hint_editor_value-type-color: "プレイのたびに色をどこから取るかを決めます。「値」：記述したとおり。「テーマ」：そのフレームでのテーマのスロットで、テーマが変われば色も変わります。「ランダム範囲」：チャンネルごとに個別に抽選するので、色は2色の間のどこにでも落ちます。「A～B間ランダム」：全チャンネルで1回だけ抽選するので、色は常にAからBへの線上にあります"
hint_editor_value-type-number: "プレイのたびにこの数値をどう決めるかを選びます。「値」：記述したとおりの数値。「ランダム範囲」：2つの境界の間の数値。「ランダム範囲、ステップ」：同じく、その大きさのグリッドにスナップします。ここにA～B形式はありません。1つの成分はもともと数値をちょうど1つ抽選するからです。ランダムな値は抽選ではなくアドレスで決まるため、同じレベルはどのデバイスでも同じようにプレイされ、オブジェクトやそのレイヤーを動かすと再抽選されます"
hint_editor_value-type-vector: "プレイのたびにこのベクトルをどう決めるかを選びます。「値」：記述したとおりの数値。「矩形内ランダム」：各軸が2つの境界の間で個別に抽選し、矩形を埋めます。「A～B間ランダム」：抽選はただ1回で、すべての軸が同じ位置でそれを読むので、点はAからBへの直線上を移動します。両端で同じ数値を持つ軸は動きません。「円内ランダム」：中心の周りの円盤上の点。「ステップ」付きの形式は結果をグリッドにスナップします。ランダムな値は抽選ではなくアドレスで決まるため、同じレベルはどのデバイスでも同じようにプレイされます"
hint_editor_video-export_audio: "動画に入れるレベルのトラックです。音量とパンのキーフレームも反映されます"
hint_editor_video-export_body: |-
  このコンピューターにインストールされたffmpegで、開いているレベルを動画にレンダリングします

  <color=#B48CE0><b>補足：</b></color>レンダリングはオフラインで1フレームずつ行うため、マシンがどれほど遅くても動画は正確です。ffmpegはゲームに含まれていません。一度インストールすれば、このウィンドウが自動で見つけます。手動で指定することもできます
  詳細：<link="https://bullethero.space/ja/docs/editor/reference/video-export"><color=#59A6FF>動画のエクスポート</color></link>
hint_editor_video-export_bot: "動画でレベルをプレイするボットです。Reflexは少し先を読み、準備は不要です。Warmは最初のフレームの前にルート全体を計算します。エクスポート中は被弾しても何も起きません"
hint_editor_video-export_codec: "コンテナー内で映像や音声をどう圧縮するかです。お使いのffmpegで作成できるものだけが表示されます。下の行に、組み合わせる音声コーデックと出力されるファイルが表示されます"
hint_editor_video-export_effects: "動画にレベルのパーティクルエフェクトを入れます。エディターと同じスイッチですが、動画にだけ適用されます"
hint_editor_video-export_engine-audio: "オン：トラックにエフェクトがある場合、フレームのレンダリング中にレベルのサウンドをリアルタイムで再生し、すべてのエフェクトを含むゲーム自体のサウンドを録音します。スピーカーからは音が出ません。エクスポートには少なくとも範囲の長さだけ時間がかかります。オフ：トラックはエフェクトなしで個別にミックスされます。「サウンドのみ」は常に個別にミックスされます"
hint_editor_video-export_ffmpeg: "ffmpegは動画をエンコードするもので、ゲームには含まれていません。緑は検出済みで準備完了、黄色は古すぎる、赤は見つからないか起動できないことを示します。「ffmpegを指定」はファイルを手動で選び、「再確認」はもう一度検索します"
hint_editor_video-export_fps: "動画の1秒あたりのフレーム数で、最大240です。レベル自体のフレームレートとは関係ありません。60未満では各フレームを複数のステップでシミュレーションするため、ボットはゲーム内と同じようにプレイします"
hint_editor_video-export_full-chroma: "1ピクセルおきではなく、すべてのピクセルに色を持たせます。細い色付きの線がくっきり残りますが、ファイルは大きくなり、一部の再生ソフトでは開けません"
hint_editor_video-export_header: "動画をエクスポート"
hint_editor_video-export_output: "動画の保存先です。デフォルトではゲームのデータフォルダー内のrecordings/[レベルID]で、レベルを削除しても残ります"
hint_editor_video-export_post-processing: "動画にレベルのポストプロセス（ブルーム、カラーグレーディングなど）を入れます。エディターと同じスイッチですが、動画にだけ適用されます"
hint_editor_video-export_preroll: "開始前に再生するものの録画はしない秒数です。最初のフレームの時点で、エフェクトやパーティクルにすでに履歴がある状態になります"
hint_editor_video-export_preset: "ファイルの種類です。MP4はどこでも開けます。MKVとMOVは編集向け、WebMはWeb向け、GIF、WebP、APNGは音声なしの短いクリップです。「連番画像」はフレームのフォルダーで、「サウンドのみ」は映像を一切レンダリングしません"
hint_editor_video-export_quality: "動画が使う容量です。「ドラフト」は小さく柔らかい画質、「ロスレス」はすべてのピクセルを保持しますがサイズが大きくなります"
hint_editor_video-export_range: "レベルのどの部分を録画するかです。「レベル全体」、タイムラインの「ループ範囲」、または自分で決めた開始フレームと終了フレームから選びます"
hint_editor_video-export_resolution: "動画のサイズ（ピクセル）です。「カスタム」では任意の偶数の幅と高さを指定できます。レベルのカメラは内側に収まり、残りは黒い帯で埋まります"
hint_editor_video-export_seed: "レベルのランダム性のシードです。0なら現在エディターで使っているシードのままになり、それ以外の数値なら毎回同じ動画になります"
hint_editor_video-export_sound-after-frames: "オフ（デフォルト）：エフェクト付きのサウンドをフレームのレンダリング中に録音し、エクスポートには両者の長い方の時間がかかります。オン：最後のフレームの後にサウンドをリアルタイムで録音するため、エクスポートは範囲の長さ分だけ長くなります。レベルが重く、録音したサウンドが途切れるときはオンにしてください"
hint_gen_audio_waveform_body: |-
  オーディオトラックの形をなぞるオブジェクトを作り、聞こえる音にレベルが目に見えて沿うようにします

  詳細：<link="https://bullethero.space/ja/docs/editor/workflow/reuse"><color=#59A6FF>再利用：プレハブ、コピー、ジェネレーター</color></link>
hint_gen_audio_waveform_header: "オーディオ波形"
hint_gen_beat_flash_body: |-
  すべてのビートにフラッシュを置きます。ビートはレベルのビートマップから取り、マップがない場合はマーカーから取ります。つまり、グリッドに見えているものがそのまま光ります

  詳細：<link="https://bullethero.space/ja/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>リズムと構成</color></link>
hint_gen_beat_flash_header: "ビートフラッシュ"
hint_gen_bullet_homing_body: |-
  プレイヤーがいると予想される位置へ曲がっていく弾です。カーブは再生時に計算されるのではなく、あらかじめ作成されます。そのため結果はどのデバイスでも同じです

  詳細：<link="https://bullethero.space/ja/docs/editor/craft/readability-and-fairness"><color=#59A6FF>読みやすさと公平さ</color></link>
hint_gen_bullet_homing_header: "ホーミング弾"
hint_gen_bullet_laser_sweep_body: |-
  フィールドを横切って掃射するビームです。予告と致死フェーズは別々のオブジェクトなので、警告表示を当たり判定なしで描けます

  詳細：<link="https://bullethero.space/ja/docs/editor/craft/readability-and-fairness"><color=#59A6FF>読みやすさと公平さ</color></link>
hint_gen_bullet_laser_sweep_header: "レーザー掃射"
hint_gen_bullet_rain_body: |-
  一定時間、範囲内に降り注ぐ弾です。密度と拡散はパラメーターで指定します。それぞれの着弾位置はレベルのシードから決まるため、プレイは再現可能です

  詳細：<link="https://bullethero.space/ja/docs/editor/craft/readability-and-fairness"><color=#59A6FF>読みやすさと公平さ</color></link>
hint_gen_bullet_rain_header: "弾の雨"
hint_gen_bullet_spiral_body: |-
  回転するアームに沿って弾を発射し、定番の螺旋状の弾幕を作ります

  詳細：<link="https://bullethero.space/ja/docs/editor/craft/readability-and-fairness"><color=#59A6FF>読みやすさと公平さ</color></link>
hint_gen_bullet_spiral_header: "螺旋弾"
hint_gen_bullet_wave_body: |-
  まとまって進む弾の列です。基本のパターンで、最初に見ておく価値があります。そのパラメーターは、他の弾のジェネレーターが再利用する考え方を示しています

  詳細：<link="https://bullethero.space/ja/docs/editor/craft/readability-and-fairness"><color=#59A6FF>読みやすさと公平さ</color></link>
hint_gen_bullet_wave_header: "弾の波"
hint_gen_capacity_hint_body: |-
  レベルの目安となる上限を書き込みます。同時に必要になるオブジェクトとエフェクトの数の見込みです

  <color=#B48CE0><b>補足：</b></color>見た目は何も変わりません。ランタイムはこれを使ってバッファーを前もって確保し、レベルの途中で拡張しないようにします。拡張すると、そこでカクつきが起きます

  詳細：<link="https://bullethero.space/ja/docs/editor/performance/level-budget"><color=#59A6FF>レベルの予算</color></link>
hint_gen_capacity_hint_header: "容量ヒント"
hint_gen_font_cache_body: |-
  レベルのテキストで実際に使われるすべての文字を集めてベイクします。初めて表示されるときにグリフを準備する必要がなくなります

  <color=#7FC97F><b>推奨：</b></color>テキストが確定してから実行してください。後から追加して再ベイクしていない文字は、初めて表示された瞬間にカクつきを起こします

  詳細：<link="https://bullethero.space/ja/docs/editor/resources/images-and-fonts"><color=#59A6FF>画像とフォント</color></link>
hint_gen_font_cache_header: "フォントキャッシュ"
hint_gen_geometry_fractal_body: |-
  シェイプを縮小しながら自身の中に繰り返し配置します。深さを上げるとオブジェクト数が指数関数的に増えるので、1ステップずつ上げてください

  詳細：<link="https://bullethero.space/ja/docs/editor/workflow/reuse"><color=#59A6FF>再利用：プレハブ、コピー、ジェネレーター</color></link>
hint_gen_geometry_fractal_header: "フラクタル"
hint_gen_geometry_grid_body: |-
  長方形の中をシェイプのコピーで等間隔に埋めます

  詳細：<link="https://bullethero.space/ja/docs/editor/workflow/reuse"><color=#59A6FF>再利用：プレハブ、コピー、ジェネレーター</color></link>
hint_gen_geometry_grid_header: "グリッド"
hint_gen_geometry_polygon_body: |-
  正多角形の頂点または辺に沿ってシェイプを配置します

  詳細：<link="https://bullethero.space/ja/docs/editor/workflow/reuse"><color=#59A6FF>再利用：プレハブ、コピー、ジェネレーター</color></link>
hint_gen_geometry_polygon_header: "多角形"
hint_gen_geometry_radial_body: |-
  円周上にコピーを配置します。ほとんどの対称パターンの基本です

  詳細：<link="https://bullethero.space/ja/docs/editor/workflow/reuse"><color=#59A6FF>再利用：プレハブ、コピー、ジェネレーター</color></link>
hint_gen_geometry_radial_header: "放射状"
hint_gen_geometry_spiral_body: |-
  半径と角度を同時に進めながら、螺旋に沿ってコピーを配置します

  詳細：<link="https://bullethero.space/ja/docs/editor/workflow/reuse"><color=#59A6FF>再利用：プレハブ、コピー、ジェネレーター</color></link>
hint_gen_geometry_spiral_header: "螺旋"
hint_gen_level_archive_body: |-
  このゲームが書き出したアーカイブからレベルを作成します。.tar.gzでも.zipでもよく、どちらもパスワード付きにできます。形式はバイト列から判別するので、名前を変えたアーカイブでも開けます。古いビルドのアーカイブは読み込み時に移行されます

  <color=#E8B04B><b>警告：</b></color>インポートしたレベルにはデフォルトで独自のIDが付くため、このマシンにすでにあるレベルを上書きすることはありません。これをオフにするのは、このマシンにかつてあったレベルを戻すときだけにしてください

  詳細：<link="https://bullethero.space/ja/docs/editor/reference/generators"><color=#59A6FF>ジェネレーター</color></link>
hint_gen_level_archive_header: "レベルアーカイブをインポート"
hint_gen_level_audio_file_body: |-
  トラックからレベルを始めます。オーディオを取り込み、レベルの長さをトラックに合わせ、空のタイムラインの先頭から作業を始められる状態にします

  詳細：<link="https://bullethero.space/ja/docs/editor/resources/preparing-the-track"><color=#59A6FF>オーディオトラックの準備</color></link>
hint_gen_level_audio_file_header: "オーディオファイルからレベルを作成"
hint_gen_level_empty_body: |-
  レベルを空にします。作成した内容はすべて削除されるので、編集ではなく最初からやり直すときに使います

  詳細：<link="https://bullethero.space/ja/docs/editor/basics/first-level"><color=#59A6FF>はじめてのレベル：手順</color></link>
hint_gen_level_empty_header: "空のレベル"
hint_gen_section_additional: "基本パラメーターに加える細かな調整です。通常はデフォルトのままで問題ありません"
hint_gen_section_main: "このジェネレーターが何を生成するかを決めるパラメーターです。まずはここから始めてください"
hint_gen_test_camera_flash_body: "カメラのイベントトラックをテストするために残してある開発用ジェネレーターです。コンテンツの制作用ではありません"
hint_gen_test_camera_flash_header: "カメラフラッシュ（テスト）"
hint_gen_test_form_body: "フォームが作れるすべてのパラメーター入力欄を試す開発用ジェネレーターです。コンテンツの制作用ではありません"
hint_gen_test_form_header: "フォーム（テスト）"
hint_gen_test_odd_body: "あえて扱いにくいパラメーターのケースを集めた開発用ジェネレーターです。コンテンツの制作用ではありません"
hint_gen_test_odd_header: "変則（テスト）"
hint_gen_test_partial_order_body: "並び順のヒントに含まれないフィールドがどう配置されるかを確認する開発用ジェネレーターです。コンテンツの制作用ではありません"
hint_gen_test_partial_order_header: "部分順序（テスト）"
hint_gen_test_scatter_body: "アドレス指定型ランダム値の処理経路を確認する開発用ジェネレーターです。コンテンツの制作用ではありません"
hint_gen_test_scatter_header: "散布（テスト）"
hint_gen_test_sections_body: "複数セクションのフォームを生成する開発用ジェネレーターです。コンテンツの制作用ではありません"
hint_gen_test_sections_header: "セクション（テスト）"
hint_gen_test_spawn_body: "オブジェクト作成の処理経路を確認する開発用ジェネレーターです。コンテンツの制作用ではありません"
hint_gen_test_spawn_header: "スポーン（テスト）"
hint_gen_texture_objects_body: |-
  画像をセルごとに1つずつオブジェクトに変換します。絵がレベルの内容になり、ほかのものと同じようにアニメーションできます

  詳細：<link="https://bullethero.space/ja/docs/editor/resources/images-and-fonts"><color=#59A6FF>画像とフォント</color></link>
hint_gen_texture_objects_header: "テクスチャからオブジェクト"
hint_level-preview_authors: "このレベルにクレジットされている全員です。作者情報はレベルフォルダーの中に入っているので、zipにまとめて送られ、別の人に再アップロードされても失われません"
hint_level-preview_licenses_body: |-
  このレベルとそのリソースに適用される条件です。<b>条件はリソースごとに記録される</b>ので、借りた素材でできたレベルでも、何をどんな条件で借りたかが正確にわかります

  <color=#7FC97F><b>推奨：</b></color>他人のレベルから何かを再利用する前に、目を通してください

  詳細：<link="https://bullethero.space/ja/docs/editor/rights/licensing-basics"><color=#59A6FF>ライセンス：3分でわかる要点</color></link>
hint_level-preview_licenses_header: "ライセンス"
hint_level_backups: "このレベルの自動コピーすべてです。新しい順に並び、名前はコピーを取った時刻です。選ぶまでは何も読み込まれません。復元するとディスク上のレベルファイルが置き換えられて再読み込みされます。置き換えられるファイルは先にバックアップへ書き込まれるので、復元自体も元に戻せます"
hint_level_collections_body: |-
  <b>インポート</b>はコレクションの項目をこのレベルに取り込み、<b>コレクションを作成</b>はこのレベルのリソースをコレクションへコピーします。項目に必要なものはすべて一緒に付いてきます。インポートは1回の操作で元に戻せます

  <color=#E8B04B><b>警告：</b></color>レベルに別バージョンの項目がすでにある場合は、ゲームが確認します。レベル側のバージョンを保持するか、コレクション側を新しいIDのコピーとしてインポートしてください

  詳細：<link="https://bullethero.space/ja/docs/editor/reference/library-and-collections"><color=#59A6FF>ライブラリとコレクション</color></link>
hint_level_collections_header: "コレクション"
hint_level_core-framerate: "ここを直接変更すると、すべてのオブジェクトが速くなったり遅くなったりします。キーフレームはフレーム番号を保ったままなので、同じレベルが別の速度で再生されます。内容を別のフレームレートに割り当て直すには、ジェネレーターを使ってください"
hint_level_core-level-id: "このレベルの恒久的な識別子です。作成時に一度だけ生成され、編集されることはありません。レベルの問題を報告するときに記載し、同じレベルの2つのコピーを見分けるのに使ってください"
hint_level_core-orientation_body: |-
  このレベルをプレイするときの端末の向きです

  <b>横向き</b>と<b>縦向き</b>はレベル中のプレイヤーの端末の向きを切り替え、プレイヤー自身の設定より優先されます。デスクトップでは縦向きのレベルは左右に帯が付いた状態でプレイされ、それが正しい表示です

  <b>未指定</b>は選択をプレイヤーに任せます。これは、レベルが<b>どちらの</b>向きでも正しく見えるという<b>宣言</b>です。そのための位置調整や拡大縮小は一切行われないので、先に両方の向きでレベルを確認してください

  詳細：<link="https://bullethero.space/ja/docs/editor/reference/level-settings"><color=#59A6FF>レベル設定</color></link>
hint_level_core-orientation_header: "レベルの向き"
hint_level_core-runtime-seed: "このエディターセッションが今実際に使っているシードです。上のシードが設定されていなければ、レベルを読み込むたびに新しい数になります。「再生成」はレベルに触れずに別の値を引き直します"
hint_level_core-seed: "このレベルのランダム値はすべて、このシードと各オブジェクト自身のレイヤーと開始フレームから決まるので、同じシードなら常に同じようにプレイされます。0は「シードなし」を意味し、ゲームは起動するたびに新しいシードを生成します"
hint_level_core_body: |-
  フレーム数、フレームレート、レベルの2つのシード

  <color=#B48CE0><b>補足：</b></color><b>フレームは1から数えます。</b>Nフレームのレベルにはフレーム1からNまでがあり、N+1は終わりの境界で、フレームではありません

  <b>レベルシード</b>はレベル自身のもので、変更は元に戻せます。0は「プレイのたびに新しいシード」を意味し、これがデフォルトです

  <color=#5EC8C8><b>ヒント：</b></color><b>実行時シード</b>は、このエディターセッションで決まったシードを表示します。<i>再生成</i>はこのセッション専用に新しいシードを引き直します。何も書き込まれず、元に戻す履歴にも入りません

  詳細：<link="https://bullethero.space/ja/docs/editor/basics/frames-and-time"><color=#59A6FF>フレーム、時間、レベルの長さ</color></link>
hint_level_core_header: "基本"
hint_level_dangerous_body: |-
  内容ではなくファイルを破壊したり書き換えたりする操作

  <color=#E86A5A><b>注意：</b></color><b>ファイルのフォーマット</b>のドロップダウンは、ディスク上のレベルとそのメタデータを書き換えます。別のフォーマットで書き換えると、<b>古いフォーマットが残したファイルは削除されます</b>。それ以外には何も起こりません。再読み込みも再シミュレーションもなく、選択や元に戻す履歴もリセットされません。メモリ上のモデルが、書き込まれる内容そのものだからです

  <color=#E86A5A><b>注意：</b></color><b>レベルを削除</b>はレベルのフォルダーをディスクから削除します。これは元に戻せません

  詳細：<link="https://bullethero.space/ja/docs/editor/workflow/not-losing-work"><color=#59A6FF>作業を失わないために</color></link>
hint_level_dangerous_header: "危険ゾーン"
hint_level_effect-editor_body: |-
  パーティクルエフェクトを作成し、キャンバス上でプレビューします

  <color=#B48CE0><b>補足：</b></color>パラメーターのグループはエフェクトのインスペクターに表示されるものと同じですが、ここでは<b>下書き</b>として編集します。保存するまでレベルには何も反映されません

  <color=#5EC8C8><b>ヒント：</b></color>このデバイスの共有ライブラリに保存すると、エフェクトを複数のレベルで再利用できます

  詳細：<link="https://bullethero.space/ja/docs/editor/performance/level-budget"><color=#59A6FF>レベルの予算</color></link>
hint_level_effect-editor_header: "エフェクトエディター"
hint_level_font-cache: "文字が初めて表示されるときにテキストが引っかからないよう、レベルが事前にベイクするグリフです。フォントごと、言語ごとに分かれています。読み取り専用で、フォントキャッシュのジェネレーターがレベルに実際に含まれるテキストから埋めます。このタブでは何も編集できません"
hint_level_history_body: |-
  このセッションの編集はすべてここに1行ずつ並び、git logのように新しいものが上に来ます。いちばん左の列がメインライン、別の列は元に戻してから別の道を進んだときに離れたブランチです。リングが現在位置、緑の円が最後の保存を示します

  行をクリックすると、1フレームに1操作ずつ、レベルがその時点の状態まで正確に戻ります。履歴はこのセッションの中だけにあり、ディスクには書き込まれません

  <color=#E8B04B><b>警告：</b></color>移動中、エディターは読み取り専用です。「キャンセル」を押すとその場で止まり、そこは常に実在する状態です

  詳細：<link="https://bullethero.space/ja/docs/editor/reference/level-settings"><color=#59A6FF>レベル設定</color></link>
hint_level_history_header: "履歴"
hint_level_library-browser_body: |-
  <b>このデバイス</b>に保存されたリソースで、ここで開くすべてのレベルで共有されます

  <color=#B48CE0><b>補足：</b></color>インポートすると、リソースは<i>レベルの中に</i>コピーされます。レベルは必要なものをすべて持ち運ぶので、ライブラリは作る側の便利な道具であって、レベルを遊ぶ人にとっての依存先には決してなりません

  詳細：<link="https://bullethero.space/ja/docs/editor/workflow/reuse"><color=#59A6FF>再利用：プレハブ、コピー、ジェネレーター</color></link>
hint_level_library-browser_header: "ライブラリ"
hint_level_metadata-logo: "<color=#D4B483>logo.png</color>としてレベルフォルダーにコピーされ、レベルが一覧に載るすべての場所に表示されます。正方形の<color=#D4B483>512x512</color>の<color=#D4B483>PNG</color>を想定しています。小さいとレベル一覧でぼやけ、大きくても容量を取るだけです。「除去」は参照を消すだけで、ファイル自体はフォルダーに残ります"
hint_level_metadata-tags_body: |-
  タグは自分で決める言葉で、書いたとおりに表示され、翻訳されることはありません。プレイヤーはレベル一覧でタグを使って絞り込むので、タグはほかのレベルも使っている場合にだけ役立ちます

  カンマで区切ります。短く一般的な言葉にしてください：ジャンル、雰囲気、メカニクス

  詳細：<link="https://bullethero.space/ja/docs/editor/reference/level-settings"><color=#59A6FF>レベル設定</color></link>
hint_level_metadata-tags_header: "レベルタグ"
hint_level_metadata_body: |-
  レベルそのものではない、レベルに関するすべての情報：名前、説明、カバー、ライセンス、年齢レーティング、作者

  <color=#B48CE0><b>補足：</b></color>名前と説明は<b>ローカライズ文字列</b>です。キーは使わず、言語ごとのテキストをその場で書きます。レベルはゲームのインターフェースの一部ではなくコンテンツだからです。テキストが書かれていない言語のプレイヤーには、最初に書かれたエントリーが表示されます

  ライセンスと作者は、どこで共有されてもレベルと一緒に移動します。これにより、再アップロードされてもクレジットが残ります

  詳細：<link="https://bullethero.space/ja/docs/editor/reference/metadata-and-sharing"><color=#59A6FF>メタデータとレベルの共有</color></link>
hint_level_metadata_header: "メタデータ"
hint_level_play-seed: "0 = レベル自体のシード、またはプレイごとに新しいシードを使います"
hint_level_play_body: |-
  <color=#B48CE0><b>補足：</b></color><b>今回のプレイだけ</b>の起動オプションです。ここでの設定はレベルに保存されません

  <color=#5EC8C8><b>ヒント：</b></color>ライフ、速度、チェックポイント、自動プレイを使えば、区間を編集せずに練習できます。ここの<b>シード</b>はレベル自体のシードより優先されます。3段階のうち最上位で、今見たのとまったく同じプレイを再現したいときに使うのはこれです

  詳細：<link="https://bullethero.space/ja/docs/editor/craft/difficulty-curve"><color=#59A6FF>難易度とカーブ</color></link>
hint_level_play_header: "プレイ"
hint_level_publication_body: |-
  このレベルをどこかへ送り出す手段のすべてです。上部で方法を選ぶと、その方法独自の設定が表示され、レベルが自動的にチェックされます。レポートのエラーは送信を止めますが、警告とアドバイスをどうするかは任されています

  「<b>アーカイブ</b>」はどこでも使えます。普通の<b>.zip</b>は何もインストールせずにWindowsのエクスプローラーで開けます。<b>+ パスワード</b>は7-Zipなどのアーカイバーで、<b>（gpg）</b>はgpgで開きます
  「<b>Steamワークショップ</b>」はSteam版にだけあり、ワークショップのルールに照らしてレベルをチェックします

  <color=#5EC8C8><b>ヒント：</b></color>ワークショップにはまず「<b>自分のみ</b>」で公開し、全員に見せる前にアイテムを確認してください。2回目の公開では同じアイテムが更新されます

  <color=#E8B04B><b>警告：</b></color>パスワードはDRMではありません。ファイルとパスワードを持っている人は、いつでも開けます

  詳細：<link="https://bullethero.space/ja/docs/editor/reference/publishing"><color=#59A6FF>公開</color></link>
hint_level_publication_header: "公開"
hint_level_raw-add: "開いた元のスロットに要素を1つ追加します。ここで設定できるのは新しい要素自身の末端フィールドだけです。入れ子になった部分はデフォルトのままで、あとからツリーで編集します"
hint_level_raw_body: |-
  保存されるレベルモデル全体を、ひとつのフィールドツリーとして表示します。エディターが処理する前の、ファイルそのものです

  <color=#E86A5A><b>注意：</b></color><b>ここでは何も検証されません。</b>エディターのほかの部分では不可能とされる値でも書き込まれるので、レベルフォルダーのコピーを手元に置いておいてください

  塗りつぶされた点はこのセッションでそのフィールドを変更したこと、中空の点はその内側の何かが変更されたことを示します。「<b>適用</b>」は、セッション全体を元に戻せる1つの操作として確定します

  詳細：<link="https://bullethero.space/ja/docs/editor/workflow/not-losing-work"><color=#59A6FF>作業を失わないために</color></link>
hint_level_raw_header: "生データ"
hint_level_resource-meta_body: |-
  1つのリソースのタイトル、説明、出典、ライセンス、作者

  <color=#B48CE0><b>補足：</b></color>これがクレジット表記を残す仕組みです。どこかから持ってきたテクスチャ、フォント、オーディオファイルは、その出どころと利用条件をレベルの中に持ち、レベルがどこへ行ってもついていきます

  <color=#7FC97F><b>推奨：</b></color>リソースを追加したときに記入してください。まだ覚えているのはそのときだけです

  詳細：<link="https://bullethero.space/ja/docs/editor/rights/resource-record"><color=#59A6FF>リソースの記録</color></link>
hint_level_resource-meta_header: "リソースのメタデータ"
hint_level_resources-audios: "このレベルが持つオーディオファイルです。まずここで追加し、それからオーディオタイムラインにトラックとして配置します"
hint_level_resources-effects_body: |-
  レベルが配置できる<color=#D4B483>VFX Graph</color>のパーティクルエフェクトです。<b>任意</b>の機能で、一度も使わないレベルも設計どおりにプレイされます

  エフェクトはレベルのシードに基づくランダム値を使うので、どのデバイスでも同じように再生されます。エフェクトはこのデバイスの共有ライブラリにエクスポートできます

  詳細：<link="https://bullethero.space/ja/docs/editor/performance/level-budget"><color=#59A6FF>レベルの予算</color></link>
hint_level_resources-effects_header: "エフェクト"
hint_level_resources-fonts: "このレベルが持つフォントで、テキストオブジェクトに使います。ほかのリソースと同じく、フォントはレベルのそばに置かれ、レベルと一緒に移動します"
hint_level_resources-prefabs_body: |-
  再利用できるオブジェクトのグループです。プレハブはテンプレートとなるオブジェクトを持ち、配置ごとにその実際のコピーが作られます。テンプレートを編集するとすべての配置に反映されますが、インスタンスごとのオーバーライドで個別の配置を変えることもできます

  <color=#E8B04B><b>警告：</b></color>テーマ、エフェクト、コライダーと違い、プレハブには<b>ゲーム定義のプリセットがありません</b>。プレハブをレベル間で移すには、ライブラリとコレクションを使います

  詳細：<link="https://bullethero.space/ja/docs/editor/workflow/reuse"><color=#59A6FF>再利用：プレハブ、コピー、ジェネレーター</color></link>
hint_level_resources-prefabs_header: "プレハブ"
hint_level_resources-shapes_body: |-
  ゲームが生成する約500種類に加えた、レベル独自のシェイプです。シェイプはバウンディングボックスに合わせた<b>実際のジオメトリ</b>なので、オブジェクトの長方形がそのまま描画される範囲になります

  <color=#5EC8C8><b>ヒント：</b></color>シェイプとコライダーは同じ種類のデータで、オブジェクトは描画するものに一方を、当たり判定に他方を指定します。どちらも他方から派生しないので、無害な予告ビームや見えない壁も普通のコンテンツとして作れます

  詳細：<link="https://bullethero.space/ja/docs/editor/resources/level-needs"><color=#59A6FF>レベルに必要なもの</color></link>
hint_level_resources-shapes_header: "シェイプ"
hint_level_resources-textures_body: |-
  このレベルが持つ画像です。<b>ゲーム自体にはテクスチャが1枚も含まれていません</b>。レベルが使うテクスチャはすべてここで追加され、レベルフォルダーに置かれるので、レベルと一緒に移動します

  <color=#B48CE0><b>補足：</b></color>シェイプはテクスチャでは<b>ありません</b>。実際のジオメトリなので、このタブからは何も必要としません

  詳細：<link="https://bullethero.space/ja/docs/editor/resources/images-and-fonts"><color=#59A6FF>画像とフォント</color></link>
hint_level_resources-textures_header: "テクスチャ"
hint_level_resources-themes_body: |-
  テーマは<b>レベルの色が参照できるパレット</b>で、色は具体的な値を持つ代わりにテーマを参照できます。アクティブなテーマを切り替えると、それを参照しているものすべての見た目が変わります。切り替えはイベントタイムラインにキーフレームとして置きます

  <color=#5EC8C8><b>ヒント：</b></color>テーマをこのデバイスの共有ライブラリにエクスポートすると、ほかのレベルでも再利用できます

  詳細：<link="https://bullethero.space/ja/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>色、テーマ、ポストプロセス</color></link>
hint_level_resources-themes_header: "テーマ"
hint_level_rules_body: |-
  このレベルで検証が見つけた問題：壊れた参照、重複したID、親の循環、深すぎるプレハブのネスト、重なり合うビートセグメント

  一部の問題は、1件ずつ、または「<b>すべて修正</b>」で修復できます。修復はまず下書きに入ります。「<b>保存</b>」で取り消し可能な1回の操作として適用し、「<b>破棄</b>」で捨てます。グラフの問題（ID、親、プレハブのネスト）には修復がありません。どれも作者にしか下せないコンテンツの判断です

  <color=#5EC8C8><b>ヒント：</b></color>子のスパンが親のスパンからはみ出していても、問題として<b>報告されません</b>。寿命を収めるには、「ジェネレーター」から「<color=#D4B483>スパン調整</color>」モディファイアーを実行してください

  詳細：<link="https://bullethero.space/ja/docs/editor/workflow/not-losing-work"><color=#59A6FF>作業を失わないために</color></link>
hint_level_rules_header: "ルール"
hint_level_shape-editor_body: |-
  ポイントと、その間をつなぐエッジからシェイプを作ります。<b>三角形は自動で導かれ、編集はできません</b>。そのため、3つの三角形が共有する角も、ドラッグするポイントは1つです

  <color=#E8B04B><b>警告：</b></color>フォーマットが保存するのはエッジではなく三角形です。どのループも閉じないエッジは保存時に捨てられ、エディターがそれを報告します

  詳細：<link="https://bullethero.space/ja/docs/editor/resources/images-and-fonts"><color=#59A6FF>画像とフォント</color></link>
hint_level_shape-editor_header: "シェイプエディター"
hint_level_theme-editor_body: |-
  テーマが提供するスロットと、それを埋める色

  <color=#E86A5A><b>注意：</b></color>レベルのコンテンツが参照するのはスロットです。そのため<b>番号を振り直すと、参照しているものすべての見た目が変わります</b>。スロットの位置がそのスロットの識別子です

  <color=#5EC8C8><b>ヒント：</b></color>完成したテーマはこのデバイスの共有ライブラリに保存すると、ほかのレベルで再利用できます

  詳細：<link="https://bullethero.space/ja/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>色、テーマ、ポストプロセス</color></link>
hint_level_theme-editor_header: "テーマエディター"
hint_menu_level-ai: "作者は、このレベル、そのカバー、またはリソースのいずれかがAIで生成されたと申告しています。開発者は確認していません。レベルには作者が書いた内容がそのまま載っています"
hint_menu_level-authors: "このレベルを作った人たちを、レベル自身のメタデータの記載どおりに表示します。「作者」ボタンで、リンク付きの全リストが開きます"
hint_menu_level-bot_body: |-
  <b>ボットが、自分と同じ操作設定でレベルを代わりにプレイします。</b>移動し、ダッシュし、ダメージを受け、自分でプレイするときと同じように死亡します。ずるはできません。速度も、ダッシュも、当たり判定も同じです

  <b>Reflex Bot v1</b>は1.5秒先を見て、見えたものを回避します。この判断を毎フレームやり直します。準備が要らないので、プレイはすぐに始まります。苦手なのは、1秒早く入っておく必要があったパターンです

  <b>Warm Bot v1</b>はプレイ開始前にレベル全体のルートを計算し、ノーダメージを目指します

  <color=#E8B04B><b>警告：</b></color>このルート計算は読み込みの追加段階で、数十秒かかることがあります。キャンセルして、自分でレベルをプレイすることもできます

  <b>レベルのクリアを保証するものではありません。</b>ボットは疲れませんが、それでも負けます。また毎フレーム処理の負荷がかかるため、性能の低いデバイスではフレームレートの低下を覚悟してください

  ボットに勝ったレベルは、ぜひ送ってください。<link="https://github.com/bullet-hero/releases/issues"><color=#59A6FF>bullet-hero/releases</color></link>でissueを作成し、どのボットがどこで負けたかを書いて、レベルフォルダーを添付してください

  詳細：<link="https://bullethero.space/ja/docs/editor/workflow/bot-playtest"><color=#59A6FF>ボットはレベルをどうプレイするか</color></link>
hint_menu_level-bot_header: "ボット"
hint_menu_level-checkpoints: "作者が配置したチェックポイントをプレイで使うかどうかを選びます。オンなら、死亡すると最後に到達したチェックポイントまでレベルが巻き戻り、ライフが回復します。オフならスタートに戻ります。チェックポイントありとなしのプレイは記録が別々です"
hint_menu_level-identity: "このレベルが実際にどれなのかを示します。見つかったソース、統計が記録されるID、そしてフォルダー名がIDと異なる場合はそのフォルダーです。組み込みレベルとそれを自分でコピーしたものは、この画面の他の情報はすべて同じで、ここだけが異なります"
hint_menu_level-lives: "プレイが何回の被弾に耐えられるかを決めます。「禅」でも被弾してノックバックはしますが、プレイが終わることはありません。「カスタム」ではスライダーで選べる任意の回数を使えます。「衝突なし」は別の設定で、何にも当たらなくなり、そのプレイは独自の記録を持ちます"
hint_menu_level-music: "音楽の作者を、レベル自身のメタデータの記載どおりに表示します。「ライセンス」ボタンには、レベルが含むその他すべてのリソースがまとめられています"
hint_menu_level-no-collision: "アバターがすべてをすり抜けるので、何にも当たりません。被弾はするもののプレイが終わらないだけの「禅」とは別物です。衝突なしのプレイは独自の記録を持ちます"
hint_menu_level-rating: "作者が申告した年齢レーティングです。開発者は確認していません。レベルには作者が書いた内容がそのまま載っています"
hint_menu_level-record: "このレベルでの自分の記録です。右側で現在選択している起動オプションごとに表示されます。ライフ、速度、チェックポイント、ボット、「衝突なし」を変えると、記録もそれに合わせて変わります。条件が違うプレイは別の達成なので、組み合わせごとにベストが記録されます。「挑戦回数」と「クリア」は、設定にかかわらずすべてのプレイを数えます"
hint_menu_level-seed: "レベル内のすべてのランダム値の元になる数です。同じシードなら、どのデバイスでも同じプレイが再現されます。0にすると、レベルは毎回新しいシードを使います"
hint_menu_level-speed: "レベルと音楽の再生速度です。「カスタム」では、3つのプリセットだけでなく、スライダーで選べる任意の速度を使えます"
hint_mod_content_remover_body: |-
  ここで選んだ条件に一致するレベルのコンテンツを削除します

  <color=#E86A5A><b>注意：</b></color>既存の内容に追加するのではなく書き換えるため、実行前にパラメーターをよく確認してください。元に戻す操作は1回分ありますが、それが唯一の戻り道です

  詳細：<link="https://bullethero.space/ja/docs/editor/workflow/reuse"><color=#59A6FF>再利用：プレハブ、コピー、ジェネレーター</color></link>
hint_mod_content_remover_header: "コンテンツ除去"
hint_mod_framerate_remap_body: |-
  レベル内のすべてのフレーム番号を別のフレームレートに合わせて換算し、タイミングが秒単位で以前と同じ位置に来るようにします

  <color=#E8B04B><b>警告：</b></color>フレームは整数なので、割り切れないものは丸められます。2回変換したレベルが元の状態に戻る保証はありません

  詳細：<link="https://bullethero.space/ja/docs/editor/basics/frames-and-time"><color=#59A6FF>フレーム、時間、レベルの長さ</color></link>
hint_mod_framerate_remap_header: "フレームレート変換"
hint_mod_prefab_flatten_body: |-
  この範囲内のプレハブ配置をすべて通常のオブジェクトに変換します。テンプレートとのリンクはなくなり、オブジェクトは元の位置にそのまま残ります

  <color=#B48CE0><b>補足：</b></color>実行後もレベルの見た目は変わりません。何も削除・移動されず、配置ごとのオーバーライドはすでにオブジェクトに書き込まれています。除去を指定しない限り、テンプレートはレベルに残ります

  詳細：<link="https://bullethero.space/ja/docs/editor/reference/modifiers"><color=#59A6FF>モディファイアー</color></link>
hint_mod_prefab_flatten_header: "プレハブのフラット化"
hint_mod_quantize_keyframes_body: |-
  キーフレームを一定のステップにスナップします。手で置いた緩いアニメーションをビートに合わせる方法です

  <color=#E8B04B><b>警告：</b></color>同じフレームに来た2つのキーフレームは1つにまとまります。そのため粗く量子化すると、細部は圧縮されるのではなく失われます

  詳細：<link="https://bullethero.space/ja/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>リズムと構成</color></link>
hint_mod_quantize_keyframes_header: "キーフレーム量子化"
hint_mod_span_fit_body: |-
  子の寿命を親の寿命の内側に収めます。子を内側に切り詰めるか、親を外側に広げるかのどちらかです

  <color=#B48CE0><b>補足：</b></color>はみ出した子は正当なデータで、切り取られて再生されるだけです。つまりこれは修復ではなくコンテンツの判断なので、自動では実行されません。どちらの方法でもアンカーは変更されません

  詳細：<link="https://bullethero.space/ja/docs/editor/basics/frames-and-time"><color=#59A6FF>フレーム、時間、レベルの長さ</color></link>
hint_mod_span_fit_header: "スパン調整"
hint_mod_span_stagger_body: |-
  選択中の項目を時間方向にずらし、同時に始まっていたオブジェクトが順番に現れるようにします

  詳細：<link="https://bullethero.space/ja/docs/editor/workflow/reuse"><color=#59A6FF>再利用：プレハブ、コピー、ジェネレーター</color></link>
hint_mod_span_stagger_header: "スパンずらし"
hint_mod_test_rename_body: "名前変更の処理経路を試すための開発用ジェネレーターです。コンテンツの制作用ではありません"
hint_mod_test_rename_header: "名前を変更（テスト）"
hint_sandbox_attacks-auto: "メインメニューの背景と同じように、ランダムなウェーブが自動で来ます"
hint_sandbox_attacks-fire: "各ボタンで、その攻撃のウェーブが1回、自分に向けて発射されます"
hint_sandbox_attacks-gap: "ウェーブが自動で来るときの、2つのウェーブの間隔（秒）"
hint_sandbox_controls-gyro: "モーションセンサーを操作デバイスとしてオンにします"
hint_sandbox_controls-mode: "現在操作に使っているデバイスのモードです。すぐに保存され、ゲーム全体に適用されます"
hint_sandbox_game-bot: "メインメニューの背景でプレイしているボットにアバターを任せます"
hint_sandbox_game-free-camera: "マウスの中ボタンか2本指でパン、ホイールかピンチでズームします。フレームはレベルのカメラに映る範囲を示します"
hint_sandbox_game-lives: "死亡するまでに受けられる被弾の数です。死亡はレベル内と同じように再生され、アバターは中央に戻ります"
hint_sandbox_game-speed: "攻撃だけを遅く、または速くします。アバターの速度は変わりません"
hint_sandbox_tutorial_body: |-
  操作を学ぶ6つのステップです。各ステップは実際に何をしたかを確認します。被弾や死亡で戻されるのはそれが起きたステップだけで、そのステップはクリアするまで赤く表示されます

  ステップを押すとプレイできます。クリア済みのステップも同様です。チュートリアルは、すべてのステップをクリアして初めて完了になります

  <color=#E8B04B><b>警告：</b></color><b>無敵</b>の間は被弾がカウントされないため、チュートリアルにも認識されません

  詳細：<link="https://bullethero.space/ja/docs/game/sandbox"><color=#59A6FF>サンドボックスとチュートリアル</color></link>
hint_sandbox_tutorial_header: "チュートリアル"
hint_settings_audio: "マスター音量、ゲーム内とエディター内でレベルが再生する音、そしてレベルエディターの外と中でのインターフェース自体のサウンドです"
hint_settings_audio-editor-game: "エディター内でレベルが再生する音の音量です。同じレベルを同じ経路で鳴らしますが、一度きりではなく何時間も聴くことになるため、ゲーム側の音量はそのまま残します"
hint_settings_audio-editor-ui: "レベルエディター自体のサウンドの音量です。鳴るのは編集の結果、つまり保存、拒否、元に戻す、削除のときだけで、普通に押しただけでは鳴りません"
hint_settings_audio-game: "レベルが再生する音、つまり音楽とサウンドの音量です"
hint_settings_audio-ui: "レベルエディターの外のインターフェースの音量です：メニュー、ブラウザー、設定"
hint_settings_audio-volume: "マスター音量です。ほかのすべての音量はこの値に合わせてスケールされます"
hint_settings_controls_body: |-
  プレイヤーの操作方法をデバイスの種類ごとに設定します：キーボードとマウス、タッチスクリーン、ゲームパッド、デバイスのジャイロ

  <color=#B48CE0><b>補足：</b></color>複数の種類を同時にアクティブにできます。操作を担うのは<b>最後に</b>触れたもので、ダッシュと一時停止はどれからでも使えます

  <color=#5EC8C8><b>ヒント：</b></color>ジャイロは、画面を上にしてスマートフォンを<b>水平</b>に置いた状態が基準です。水平から傾けると移動し、大きく傾けないと動かないときは<b>感度</b>を上げてください

  詳細：<link="https://bullethero.space/ja/docs/game/controls"><color=#59A6FF>操作</color></link>
hint_settings_controls_header: "操作"
hint_settings_game-editor-autosave: "タイマーでレベルのコピーを書き出します。保存済みのレベルが上書きされることはありません。コピーは万一のための保険で、保存の代わりにはなりません"
hint_settings_game-editor-autosave-rate: "自動コピーの間隔（秒）です"
hint_settings_game-editor-camera-invert: "ドラッグでレベルをポインターと一緒に動かすか、代わりにカメラを動かすかです。どちらの感覚も、誰かにとっては自然です"
hint_settings_game-editor-camera-max-size: "エディターのビューポートをズームアウトできる限界です"
hint_settings_game-editor-camera-min-size: "エディターのビューポートをズームインできる限界です"
hint_settings_game-editor-camera-sensitivity-x: "ポインターの移動1単位あたりに、ビューが水平方向へ動く距離です"
hint_settings_game-editor-camera-sensitivity-y: "ポインターの移動1単位あたりに、ビューが垂直方向へ動く距離です"
hint_settings_game-editor-camera-wheel-multiplier: "ホイール1ノッチあたりのズーム量です"
hint_settings_game-editor-camera-zoom-to-mouse: "ビューポートの中央ではなく、カーソルに向かってズームします。オフにすると、ズーム中も中央が動きません"
hint_settings_game-editor-create-shape-size-x: "新しいシェイプの最初の幅です。シェイプ自身のスケールが掛かる前の値です"
hint_settings_game-editor-create-shape-size-y: "新しいシェイプの最初の高さです。シェイプ自身のスケールが掛かる前の値です"
hint_settings_game-editor-create-text-size-x: "新しいテキストが文字を並べるブロックの幅です。文字自体のサイズではありません"
hint_settings_game-editor-create-text-size-y: "新しいテキストが文字を並べるブロックの高さです。1単位がおよそ1行分です"
hint_settings_game-editor-effects-active-default: "エディターを開いたときに、レベルのポストプロセス効果をプレビューするかどうかです。これは開始時の状態にすぎず、作業中にオフにしてもこの設定は変わりません。スマートフォンではオフで始まります。ポストプロセスは、エディターが描画するものの中で最も負荷が高いためです"
hint_settings_game-editor-gizmos-scale: "ビューポートのドラッグ用ハンドルを描画する大きさです。マウス向けの大きさのハンドルは、親指では押しにくくなります"
hint_settings_game-editor-grid-active-default: "エディターを開いたときに、ビューポートのグリッドが最初からオンになっているかどうかです。これは開始時の状態にすぎず、作業中にグリッドをオフにしてもこの設定は変わりません"
hint_settings_game-editor-grid-opacity: "グリッドの見えやすさです。薄すぎて読み取れないグリッドは、まったく描画されません"
hint_settings_game-editor-grid-size: "ビューポートのグリッドの間隔です（レベル単位）"
hint_settings_game-editor-history-length: "最も古いブランチが破棄されるまでに、セッションが保持する編集ステップの数です。増やしてもメモリを使うだけで、ほかの影響はありません"
hint_settings_game-editor-history-objects: "そのステップ数とは別に、履歴が保持するオブジェクトの数です。一括削除1回は、50,000個のオブジェクトを抱えた1ステップになります。それを捉えるのがこの設定です。0で制限なし、0未満ではデバイスに任せます"
hint_settings_game-editor-interface-dirty-field-delay: "最後のキー入力から、インスペクターのフィールドが値を確定するまでの待ち時間です。0にするとキー入力ごとに確定され、その1回1回が元に戻せる操作になります"
hint_settings_game-editor-interface-levels-layout: "エディターのレベルブラウザーの開き方です。説明付きの行のリストか、カバーのグリッドを選べます。エディターを閉じるまでは、検索欄の横のボタンでも切り替えられます"
hint_settings_game-editor-interface-log-clamps: "入力した値が許容範囲内に戻されたときに、コンソールに報告します。クランプはどちらの場合も行われます"
hint_settings_game-editor-interface-rotation-unit: "回転フィールドの表示と入力に使う単位です。角度はどちらの場合も常にラジアンで保存されます"
hint_settings_game-editor-level-serialize-mode: "レベルを書き出すファイルフォーマットです。<b><color=#D4B483>Json</color></b>はテキストで、読むことも手で修復することもできます。<b><color=#D4B483>Blob</color></b>はバイナリで、読み込みが数十倍速い代わりに、一度壊れるとほぼ修復できません"
hint_settings_game-editor-max-autosave-files: "保持するコピーの数です。上限に達すると、最も古いコピーが破棄されます"
hint_settings_game-editor-mcp-enabled: "MCPに対応したAIアシスタントがこのエディターに接続し、開いているレベルを編集できるようにします。接続できるのはこのコンピューターだけで、AIが1回のバッチで行ったことはすべて履歴の1ステップになります"
hint_settings_game-editor-mcp-follow-ai: "AIがフレームを確認した後に、再生ヘッドがどこへ行くかです。オフ：元の位置に戻ります。オン：AIが確認したフレームで一時停止したまま残ります。AIの確認中にタイムラインに触れると、再生ヘッドは置いた位置にとどまります"
hint_settings_game-editor-mcp-operation-delay: "AIの2つの操作の間にエディターが待つ時間です。操作を目で追えるようにするためのものです。<b><color=#D4B483>0</color></b>では各操作をすぐに適用します。再生、一時停止、再生ヘッドの移動は遅延しません。0から5まで"
hint_settings_game-editor-mcp-port: "エディターが待ち受けるポートです。<b><color=#D4B483>0</color></b>では起動するたびに空いているポートを選びます。それ以外は<b><color=#D4B483>1024-65535</color></b>"
hint_settings_game-editor-mcp-reveal-edits: "AIが編集するたびに、作成または変更したものを選択し、位置を表示します。ドラッグ、入力、再生の最中には行いません"
hint_settings_game-editor-multi-select-requires-hold: "選択への追加に、意図的なホールドを必要とするかどうかです。タッチ操作ではオンのほうが安全です。オフだと、うっかりタップしただけで選択が変わってしまいます"
hint_settings_game-editor-pick-invisible-aabb: "何も描画しないオブジェクトもクリックで選択できるようにします。当たり判定があってシェイプのない、見えない壁に必要です"
hint_settings_game-editor-player-active-default: "エディターを開いたときに、テストプレイヤーが最初から配置されているかどうかです。タッチ操作ではビューポートも占有するため、スマートフォンでは通常オフにします"
hint_settings_game-editor-player-bot: "プレビュー用のプレイヤーを、自分ではなく<color=#D4B483>Reflex Bot v1</color>に操作させます。ここで選べるボットはこれだけです。事前の準備が何も要らず、編集中も動き続けるためです。再生速度を問わず、逆再生中でも動きます。ボットも同じルールでプレイし、ダメージを受けますし、追い詰められることもあります。スクラブ直後は、未来についての情報を組み立て直す間、少しのあいだプレイが下手になります。ボットを選ぶのはプレイを始めるときで、この画面の「プレイ」タブで行います"
hint_settings_game-editor-player-bot-debug: "ボットの診断オーバーレイのマスタースイッチです。デフォルトではオフです。その下の項目はすべてオンなので、これを開くと全体像がすぐに見えます"
hint_settings_game-editor-player-bot-debug-grid: "画面の各部分にどれだけの余裕があるとボットが考えているかを、先に見えるすべてを踏まえた最悪の場合で描画します。赤は被弾を予想している場所です。安全だと考えている場所には何も描画されません"
hint_settings_game-editor-player-bot-debug-reach: "ボットが計画する時間枠の終わりまでに、どこまで到達できると考えているかを描画します。内側の輪は歩いた場合、外側の輪はダッシュを使った場合です。ボットがその外にターゲットを選ぶことはありません"
hint_settings_game-editor-player-bot-debug-target: "ボットが今向かっている地点を描画します。明らかに良い候補が現れるまで選択を維持するので、ターゲットが動かなくなったのは、行き詰まったのではなく満足している状態です"
hint_settings_game-editor-player-reset-gizmos: "テストプレイヤーをオンにしたときにアクティブなギズモモードを解除し、ドラッグ用ハンドルが指の下に残らないようにします"
hint_settings_game-editor-preview-collider-on-select: "選択中のオブジェクトの当たり判定を表示します。ここでは描画されるものと当たるものが別物なので、両者が一致しないことがあります"
hint_settings_game-editor-publish-language: "ワークショップアイテムのタイトルと説明を、最初にどの言語で投稿するかです。<b>「<color=#D4B483>英語</color>」</b>、または<b>「<color=#D4B483>システム</color>」</b>（デバイスの言語）"
hint_settings_game-editor-resources-serialize-mode: "レベルが持つリソースについての同じ選択です"
hint_settings_game-editor-selection-collider-opacity: "選択中のオブジェクトの当たり判定を描画する濃さです"
hint_settings_game-editor-selection-collider-opacity-view: "すべての当たり判定を一度に表示するビューでの同じ設定です。そこでは数百個が重なるため、より薄くなります"
hint_settings_game-editor-selection-long-press-delay: "行やクリップが複数選択に入るまでに、押し続ける必要がある時間です。意図せず選択されてしまう場合は長くしてください"
hint_settings_game-editor-selection-long-press-threshold: "その長押しの間にポインターがどれだけずれると、代わりにドラッグとみなされるかです。手元が安定しない場合は大きくしてください"
hint_settings_game-editor-timeline-edge-handle: "クリップの端のうち、サイズ変更に使う部分の幅です。それ以外の部分をドラッグすると、クリップ全体がスライドします"
hint_settings_game-editor-timeline-loop-global: "レベルの終わりで、再生ヘッドが停止せずに先頭へ戻るかどうかです"
hint_settings_game-editor-timeline-loop-local: "ローカルタイムラインについての同じ設定です。ローカルタイムラインは、1つのオブジェクト自身の寿命を繰り返します"
hint_settings_game-editor-timeline-snap-threshold: "ドラッグした端が候補のフレームにスナップするには、どれだけ近づく必要があるかです"
hint_settings_game-editor-timeline-time-format: "タイムラインのルーラーと再生ヘッドの表示を、何の単位で数えるかです。レベルの中身は何も変わらず、どちらでも同じフレームを指します。「小節とビート」はレベル自体のビートグリッドを読み、グリッドにセグメントがない部分ではタイムコードに切り替わります"
hint_settings_game-editor_body: |-
  「<b>自動保存</b>」はタイマーでレベルを保存し、そのたびにバックアップのコピーを書き出します。「<b>自動保存ファイルの最大数</b>」は保持するコピーの数の上限です

  「<b>カメラの最小サイズ</b>」と「<b>カメラの最大サイズ</b>」はビューポートのズームを制限します。「<b>複数選択にホールドが必要</b>」と「<b>AABBで選択</b>」は、ビューポートでのクリックの意味を変えます

  「<b>レベルのフォーマット</b>」と「<b>リソースのフォーマット</b>」は、ディスクに書き込むときのデフォルトのフォーマットを設定します

  詳細：<link="https://bullethero.space/ja/docs/editor/workflow/speed-and-shortcuts"><color=#59A6FF>スピードとショートカット</color></link>
hint_settings_game-editor_header: "エディター"
hint_settings_general: "言語と、ゲームが同時に読み込むリソースの数です。「<b>言語</b>」を空にすると、デバイスの言語に従います"
hint_settings_general-language: "インターフェースの言語です。空にするとデバイスの言語に従います。レベル自体のテキストには影響しません。それはレベル自身が持っています"
hint_settings_general-resource-parallel-load-count: "レベルのファイルを同時にいくつ読み込むかです。値を大きくすると、速いディスクでは早く終わりますが、遅いディスクではカクつくことがあります"
hint_settings_general-resource-web-timeout: "ネットワーク経由で取得するファイルを、諦めるまでに待つ時間（秒）です"
hint_settings_general-show-all-found-content: "ソースが見つけたものの、自分のものだと確認できないコンテンツも一覧に表示します。購読を解除したワークショップアイテムのファイルや、手動でコピーしたフォルダーなどです。そうしたレベルはカードに印が付きます。オフにすると、ソースは保証できるものだけを表示します"
hint_settings_graphics-antialiasing-hdr: "1を超える色の値です。このゲームにはこれを必要とするものがなく、メモリ帯域幅が2倍になるため、デフォルトでオフです"
hint_settings_graphics-antialiasing-msaa: "<color=#D4B483>MSAA</color>が1ピクセルあたりに取るサンプル数です。多いほど滑らかになり、負荷も上がります。負荷は、透明なコンテンツがどれだけ重なるかに応じて増えます"
hint_settings_graphics-antialiasing-type: "エッジをどう滑らかにするかです。<b><color=#D4B483>MSAA</color></b>はエッジを正確に処理します。ここではすべてのシェイプが実際のジオメトリだからです。<b><color=#D4B483>FXAA</color></b>はシーンの内容に関係なくパス1回分のコストで済み、性能の低いスマートフォンではそこが選択の分かれ目になります"
hint_settings_graphics-audio-pitch-correction: "シミュレーションに追いつくために、オーディオの再生速度をどれだけ強く調整するかです。高いほど早く補正されますが、補正が耳で気づかれやすくなります"
hint_settings_graphics-audio-render: "そもそもレベルのオーディオを再生するかどうかです。オフにすると、すべてのレベルが無音で進み、下のオーディオ設定は意味を持たなくなります。サウンドそのものが重すぎるデバイス向けです"
hint_settings_graphics-audio-render-effects: "編集中にトラックのオーディオエフェクトを適用します。オフでは元のクリップがそのまま聞こえます"
hint_settings_graphics-audio-resync-jump-time: "オーディオとシミュレーションがどこまでずれたら、少しずつ寄せる代わりにオーディオを正しい位置へジャンプさせるかです"
hint_settings_graphics-audio-scrub-time: "再生ヘッドをトラック上でドラッグしたときに、どれだけの長さの断片が聞こえるかです"
hint_settings_graphics-audio-sync-dead-zone: "これより小さいずれは無視されます。デッドゾーンがないと、オーディオが絶えず補正され、それが耳に聞こえてしまいます"
hint_settings_graphics-audio-use-scrub: "再生ヘッドをドラッグしている間、その位置のオーディオを再生し、耳でタイミングを探せるようにします"
hint_settings_graphics-avatar-render: "アバターの体は25個の正方形のグリッドで、体力が減ると、いくつかの裂け目に沿って縁から内側へ正方形が暗くなっていきます。そのため、プレイがうまくいっていないことはバーではなくプレイヤー自身の姿でわかります。失われた正方形は淡い残像として残り、その下の当たり判定のリングが透けて見えます。オフにすると、グリッドは1つの正方形になり、代わりに体力に応じてそれが薄れていきます。読み取れる情報は同じで、25個ではなく1個のオブジェクトで済むので、それらを描画したくないデバイス向けです"
hint_settings_graphics-colliders-mode-active: "練習用のモードです。プレイするレベルは、すべての当たり判定を無地の背景の上の平らな塗りとして描画し、それ以外は何も描画しません。装飾、テキスト、エフェクト、ポストプロセス、テーマの背景は消えます。プレイの結果を左右するものはすべて残ります。音楽、衝突判定、カメラとその揺れ、チェックポイント、HUD、統計です。ここでのプレイもほかと同じように記録されます。対象はゲーム画面だけで、エディターとサンドボックスは通常どおり描画されます"
hint_settings_graphics-colliders-mode-background: "塗りの後ろに描画される色です。黒ではなく濃いグレーなのは意図的です。カメラのフレームの周りの帯は黒なので、背景が黒だとレベルのフレームがどこで終わるのかわからなくなります"
hint_settings_graphics-colliders-mode-color: "モードが当たり判定を塗る色です。エディターのコライダー表示は同じ色相を独自の不透明度で使うので、2つは常に一致します。「グラフィックをリセット」で最初の赤に戻ります"
hint_settings_graphics-colliders-mode-use-alpha: "オンにすると、塗りは色のアルファに応じて透けるので、重なった2つの障害物は濃い部分として読み取れます。オフにすると、すべての塗りが不透明になります。小さい画面では読みやすくなりますが、重なりは1つの形に溶け合います。ゲーム内ではアルファが0.15を下回ることはありません。それより薄いと見えなくなるからです"
hint_settings_graphics-effects-fixed-framerate: "エフェクトをシミュレーションする頻度です。描画される頻度とは関係ありません"
hint_settings_graphics-effects-frame-step-budget: "1フレームで使えるエフェクトのステップ数です。追いつくための処理が目に見える停止を招かないようにします"
hint_settings_graphics-effects-framerate-target: "エフェクトを描画する頻度です。ゲーム自体の頻度より低くするのは手軽な節約になります。パーティクルは粗いステップでも十分に読み取れるからです"
hint_settings_graphics-effects-max-scrub-time: "再生ヘッドをジャンプさせたときに、エディターがどれだけのエフェクト履歴を再生し直すかです。長いほど正確になり、遅くなります"
hint_settings_graphics-effects-render: "そもそもパーティクルエフェクトを描画するかどうかです。レベルを豊かにしますが、これに依存するレベルはないので、安心してオフにできます"
hint_settings_graphics-effects-replay-step-budget: "1回のリプレイで使えるシミュレーションのステップ数です。この上限があるので、密度の高い区間へジャンプしてもエディターがフリーズしません"
hint_settings_graphics-fixed-framerate: "「目標フレームレート」が「固定」の間、ゲームが保つ上限です。決めるのは画面を描き直す頻度だけです。レベルは実時間に沿ってシミュレーションされるので、同じプレイは30でも144でもまったく同じように進みます。「垂直同期」がオンの間は無視されます"
hint_settings_graphics-framerate-target: "ゲームが目指す1秒あたりのフレーム数です。垂直同期を介さず、直接適用されます"
hint_settings_graphics-postprocessing-render: "下にあるすべてのカメラ効果のマスタースイッチです。オフにするとスタック全体をスキップします"
hint_settings_graphics-postprocessing-render-analog-glitch: "アナログの干渉：流れる帯、乱れた走査線、色のにじみ"
hint_settings_graphics-postprocessing-render-bloom: "明るい部分の光が周囲ににじみ出します"
hint_settings_graphics-postprocessing-render-chroma: "安いレンズのように、画面の端に向かって色チャンネルがずれます"
hint_settings_graphics-postprocessing-render-color-curves: "チャンネルごとのカラーカーブで、細かいカラーグレーディング用です"
hint_settings_graphics-postprocessing-render-digital-glitch: "デジタルの破損：フレームが壊れたかのように、ブロックがずれます"
hint_settings_graphics-postprocessing-render-grain: "画面に重ねるフィルムグレイン"
hint_settings_graphics-postprocessing-render-lens: "本物のレンズのように画像が歪みます"
hint_settings_graphics-postprocessing-render-lift-gamma-gain: "シャドウ、中間調、ハイライトの3つに分けたグレーディング"
hint_settings_graphics-postprocessing-render-motion-blur: "速い動きがにじみます。弾が読み取りにくくなる場合は、オフにするとよいでしょう"
hint_settings_graphics-postprocessing-render-shadows-midtones-highlights: "同じ3つのゾーンを、持ち上げるのではなく、それぞれ別々に色付けします"
hint_settings_graphics-postprocessing-render-vignette: "画面の端が暗くなり、注意を中央に引き寄せます"
hint_settings_graphics-postprocessing-render-white-balance: "白とみなす基準をずらし、画面全体を暖かく、または冷たくします"
hint_settings_graphics-render-scale: |-
  ウィンドウに合わせて拡大縮小する前に、ゲーム自体が何ピクセルでレンダリングするかです

  1未満では、ゲームは少ないピクセルを描画して引き伸ばします。フラグメントのコストはこの値の<b>2乗</b>に比例して下がるので、性能の低いマシンで下げる設定としては最も効果があります。1を超えると大きくレンダリングして結果を縮小します。これがスーパーサンプリングです

  インターフェースはどちらにしても専用のフルサイズのターゲットに描画されるので、この値がいくつでもテキストとボタンはくっきりしたままです。この数値は、このデバイスクラスに最初から設定されているスケールを置き換えるのではなく、それに掛け合わされます
hint_settings_graphics-resolution: |-
  ゲームウィンドウのピクセル単位のサイズで、このディスプレイが実際に報告するモードから選びます。そのため、モニターが表示できないモードをここから要求することはできません

  これはデスクトップで画面の向きを変える方法でもあります。幅より高さが大きい解像度にすると、インターフェースは、縦に立てたスマートフォンと同じ縦向きレイアウトになります。モニターはゲームの中から回転できないので、これとウィンドウサイズが唯一の手段です

  そのままにしておくと、ディスプレイ本来の解像度が使われます
hint_settings_graphics-textures-compression: "読み込み時に画像を<color=#D4B483>圧縮</color>フォーマットに変換します。メモリは4分の1から8分の1になる一方、グラデーションやくっきりしたエッジが4x4のブロックにかかる部分にブロックノイズが出ます。レベルを開いている間ではなく、レベルの読み込み時に読まれます"
hint_settings_graphics-textures-compression-quality: "読み込み時間と圧縮によるノイズの引き換えです。画像のサイズはどちらでも同じで、スマートフォンではこの設定は完全に無視されます"
hint_settings_graphics-textures-filtering: "描画時に画像をどうサンプリングするかで、それ以外には影響しません。画像の縮小方法は、この設定ではなく、作者がその画像をどう指定したかで決まります"
hint_settings_graphics-textures-mipmaps: "各画像の縮小コピーで、小さく描画された画像が動いてもちらつかなくなります。メモリが3分の1多く必要ですが、このちらつきを治す方法はほかにありません"
hint_settings_graphics-textures-size-limit: "このデバイスで画像がメモリ上で取れる大きさの上限です。メモリは辺の長さの2乗に比例して減るので、圧縮よりも節約になります。また、3つの中でレベルのコストそのものに上限をかけられるのはこれだけです"
hint_settings_graphics-vsync: |-
  フレームを表示する前に、ゲームがディスプレイのリフレッシュを待つかどうかです

  <b>オフ</b>では、各フレームを準備ができ次第表示します。何も待たないので、入力は最も早いタイミングで画面に届きます。ただし、リフレッシュの途中で完成したフレームは前のフレームの上に半分だけ重なって描画されます。これがティアリングです

  <b>オン</b>ではリフレッシュ1回につき1回表示するので、ティアリングはなくなり、各フレームに最大でリフレッシュ1回分の遅延が加わります。<b>1/2レート</b>ではリフレッシュ2回につき1回表示します。フルレートを維持できないマシンでは安定しますが、遅延はその2倍になります

  これが「オフ」以外の間、Unityはその上のフレームレート上限を完全に無視するので、その2行はグレー表示になります

  スマートフォンは独自のタイミングで表示するので、そこではこの設定は何もしません
hint_settings_graphics-window-mode: |-
  ゲームウィンドウがディスプレイをどう占めるかです

  <b>ウィンドウ</b>は自由にサイズを変更できる唯一のモードで、サイズを変えるとゲームのアスペクト比が変わります。ウィンドウを幅より高さが大きくなるようにドラッグすると、縦に立てたスマートフォンとまったく同じように、インターフェース全体が縦向きレイアウトに切り替わります

  <b>ボーダーレスウィンドウ</b>がデフォルトです。画面を埋め、モードの切り替えがなく、alt-tabが一瞬で済みます。<b>排他的フルスクリーン</b>はディスプレイを完全にゲームに渡します。わずかに速くなりますが、抜けるのに時間がかかります

  スマートフォンにはウィンドウが1つしかなく、それが画面そのものなので、そこではこの設定は何もしません
hint_settings_graphics_body: |-
  <b>アンチエイリアス。</b><color=#D4B483>MSAA</color>がデフォルトなのは、このゲームのシェイプはすべて本物のジオメトリで、ギザギザになるエッジはすべて本物の幾何学的なエッジだからです。これはマルチサンプリングが、どのプラットフォームでも鮮明さを損なわずに正確に解消できるケースです。<b><color=#D4B483>FXAA</color></b>は性能の低いスマートフォン向けの代替です。レベルのオーバードローがどれだけ多くても全画面パス1回分のコストで済みますが、<color=#D4B483>MSAA</color>のコストは半透明のオーバードローとともに増えます。<b>TAAは意図的に提供していません</b>。このジャンルでは速い弾の後ろに出る残像が視認性の問題になり、そのジッターはグリッチエフェクトと干渉します

  <b>フレームレート。</b>目標値は垂直同期ではなく手動で適用されます。固定フレームレートはシミュレーションを表示から切り離します。そのおかげで、レベルのタイミングは60 Hzの画面でも144 Hzの画面でも同じに保たれます

  <color=#7FC97F><b>推奨：</b></color>デバイスの処理が追いつかないとき、最も手軽に削れるのは1未満の<b>レンダースケール</b>です。失うのは鮮明さだけです

  詳細：<link="https://bullethero.space/ja/docs/editor/performance/mobile-devices"><color=#59A6FF>モバイルデバイス</color></link>
hint_settings_graphics_header: "グラフィック"
hint_settings_interface: "統計オーバーレイとその位置です。すべての画面の上に描画され、パフォーマンスの診断用であって、プレイ用ではありません"
hint_settings_interface-alert-on-exception: "キャッチされなかったエラーでレポートウィンドウを表示するかどうかです。レポートはどちらの場合も作成され、ログに記録され、保存されます。これが決めるのは中断されるかどうかだけで、それが最も重要になるのはプレイの最中です。オフでも、最後のレポートはプレイヤーログに残り、<b>レポートを保存</b>でレポートフォルダーに保存できます"
hint_settings_interface-hitbox-ring-opacity: "アバターの点のリングは、ちょうど当たり判定の半径上にあります。半径は0.4で、描画される体の幅は1です。シルエットはもともと当たり判定ではなく、このリングで本当の位置が見えます。同じリングがライフも数えます：点灯している点は残っているライフ、暗い点は失ったライフです。このスライダーはレベルの描画の上でリングがどれだけ見えるかを決めるだけで、0にすると完全に消えます。レベルはリングが見えている前提でバランス調整されています"
hint_settings_interface-levels-layout: "メニューのレベルブラウザーの開き方です：カバーのグリッドか、説明付きの行のリスト。検索欄の横のボタンでも、画面を離れるまでは切り替えられます"
hint_settings_interface-menu-background: "メニューがボタンの後ろで再生するものです。「ボット」は本物のアリーナで、プレイを任せられるのと同じreflexボットが、待っている間に放たれる障害物を避けます。被弾しても何も起きません。「シェイプ」は従来の回転するシェイプのフィールドで、3つの中で最も重い選択肢です。「なし」は何も描画しません"
hint_settings_interface-open-menu-on-lose: "負けたプレイでどうなるかです。オフでは、レベルがイージングで止まり、到達した最後のチェックポイントまで巻き戻って、イージングで元の速度に戻ります。途中にウィンドウは出ません。オンでは、再生が止まり、結果ウィンドウが開きます"
hint_settings_interface-screen-orientation: |-
  <b>横向き</b>と<b>縦向き</b>は<b>軸</b>を固定するもので、どちらの端が上かは固定しません。デバイスを逆さにすると映像も一緒に回転するので、どちら向きでもプレイできます

  <b>自動回転</b>は何も固定しません：画面がデバイスに従います。レベル自体が向きを指定していなければ、プレイの途中でスマートフォンを回しても、インターフェースとカメラの両方が追従します

  レベルはプレイ中、この設定を上書きできます。作者は特定の形のフレームに合わせて内容を組み立てているため、レベルが動いている間はその選択が優先され、レベルを出ると設定が戻ります

  デスクトップではモニターは回転しないため、この項目は無効になり、ウィンドウの形を表示するだけです。ウィンドウのサイズを変えると、それに合わせて変わります
hint_settings_interface-show-game-interface: "上の2つと、それに加えて画面上のタッチ操作をまとめて切り替えるマスタースイッチです。オフにするとゲーム画面には何も描画されず、きれいな録画やスクリーンショットに向いています。機能は何も止まりません：すべての操作は元の位置のまま、押せば反応します"
hint_settings_interface-show-game-pause: "一時停止のアイコンを描画するかどうかです。非表示になるだけで削除はされません：同じ隅は押せば反応し、EscapeやゲームパッドのBackでは、この設定に関係なく一時停止ウィンドウが開きます"
hint_settings_interface-show-game-progress: "プレイのプログレスバーをゲーム画面の下端に描画するかどうかです。非表示にしても他は何も変わらず、バーが示すチェックポイントはそのまま機能します"
hint_settings_interface-stats-active: "すべての画面の上に診断情報を表示します。パフォーマンスの計測用で、プレイ用ではありません"
hint_settings_interface-stats-alignment-x: "診断情報の横方向の位置です：0が左端、1が右端"
hint_settings_interface-stats-alignment-y: "診断情報の縦方向の位置です：0が上端、1が下端"
hint_settings_other: "<b>設定をデフォルトに戻す</b>を押すと、すべてのタブのすべての設定が初期値に戻ります。変わるのは設定だけで、レベルはディスク上のファイルなので影響を受けません"
hint_settings_profile: "このデバイスが記憶している、ゲームのプレイ内容とゲームで作ったもののすべてです。データはローカルのみです：どこにもアップロードされず、元のファイルはレベルの隣の、開いて読めるフォルダーにあります。時間はレベル内の時間ではなく実際の秒数なので、チェックポイントからの再加速やハーフスピードでのプレイも、実際にかかった時間で数えられます。デバイスの行は、レベルのプレイ中に4つの操作デバイスのどれが操作を担っていたかを測ります。接続されていただけのものは数えません"
hint_settings_profile-transfer_body: |-
  プロファイル全体を1つのzipファイルにまとめ、また戻せます：レベル、統計、設定、コレクションを含むライブラリ、そしてチェックを入れればエディターの自動保存とエラーレポートも含みます。別のデバイスへの移行や、再インストール前のコピーの保存に使えます

  <b>置換</b>はチェックを入れた部分を空にして、ファイルの内容を入れます。<b>統合</b>は足りないものを追加し、両方にあるレベルは新しい方のコピーを取り、統計は高い方を残します

  <color=#E8B04B><b>警告：</b></color>スマートフォンでは、ゲームをアンインストールするとプロファイル全体が削除されます。先にエクスポートしてください

  インポートの前には毎回、置き換えられる内容を1つのバックアップに保存します。ここで復元、別の場所への保存、削除ができます

  詳細：<link="https://bullethero.space/ja/docs/game/profile-transfer"><u>プロファイル転送</u></link>
hint_settings_profile-transfer_header: "プロファイル転送"
hint_settings_suppress-game-saves_body: |-
  これがオンの間、ゲームは自分のデータを何も保存しません：<color=#D4B483>settings.json</color>、全体の統計、各レベルの統計はディスク上でそのまま残ります。変更した設定もゲームを閉じるまでは有効です

  レベルの作業はいつも通り保存されます：レベルの保存、エクスポート、インポート、コピー、削除、それにエディターの自動保存とバックアップ（これらには専用のスイッチがあります）

  効果はゲームを閉じるまで続き、記憶されることはありません。オフにすると現在の設定が保存され、オンの間にプレイした内容はすべて破棄されます

  <color=#B48CE0><b>補足：</b></color>これは自動でオンになることもあります。起動引数<color=#D4B483>--suppress-game-saves</color>はその起動の間ずっとこれをオンにし、ゲーム内からはオフにできません。より新しいバージョンのゲームで保存された設定や統計もこれをオンにし、その場合ゲームは起動のたびに、それらを残すかデフォルト値で上書きするかを尋ねます
hint_settings_suppress-game-saves_header: "匿名モード"
