settings_game-editor_interface-log-clamps: "Signaler les valeurs limitées"
settings_game-editor_interface-log-rules: "Signaler les règles du niveau enfreintes"
settings_game-editor_interface-log-rules-tooltip: "Après un enregistrement explicite, indiquer combien de règles du niveau le niveau enregistré enfreint. Désactivé par défaut : les problèmes sont indicatifs - l'onglet Règles les signale à la demande et ne les corrige jamais, et un niveau qui enfreint des règles s'ouvre, se joue et se publie quand même"
settings_game-editor_interface-rotation-unit: "Unité de rotation"
settings_game-editor_interface-sync-timeline-expansion: "Synchroniser le repli des timelines"
settings_game-editor_interface-sync-timeline-expansion-tooltip: "Quand c'est activé, replier une ligne dans la hiérarchie de l'image retire aussi le sous-arbre de cet objet des timelines d'objets, et inversement. Désactivé (par défaut), les deux surfaces gardent chacune leur réponse : la hiérarchie s'ouvre repliée, les timelines s'ouvrent en montrant tout"
settings_game-editor_interface-timeline-expansion: "Repli de la timeline"
settings_game-editor_interface-timeline-expansion-tooltip: "Le palier auquel s'ouvrent les timelines d'objets au chargement d'un niveau. Déplié par défaut, à l'inverse de la hiérarchie - un repli RETIRE des lignes d'une timeline au lieu de les fermer, et une ligne absente ne peut pas dire ce qu'elle cache"
