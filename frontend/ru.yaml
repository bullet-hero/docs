home:
  tagline: Гибрид ритм-игры и bullet hell, сделанный как движок для жанра.
  play: Скачать
  readDocs: Читать документацию
  status: Альфа-версия для Windows и Android
  features:
    play:
      title: Уворачивайся в ритм
      body: Каждый уровень - это трек и шторм фигур, выверенный под него. Ты ведёшь маленький квадрат, прорываешься рывком сквозь просветы и стараешься дожить до последнего бита.
    editor:
      title: Редактор уже внутри
      body: Уровни собираются в той же игре, в которой в них играют. Таймлайны, ключевые кадры, темы и постобработка, и ничего не нужно ставить отдельно.
    share:
      title: Уровень - это просто папка
      body: Отправь её другу, положи в levels и играй. Один и тот же сид даёт один и тот же уровень на любом устройстве, хоть при 30 кадрах в секунду, хоть при 144.
    afterbeat:
      title: Для тех, кто пришёл из Project Arrhythmia
      body: Уровни, темы и префабы из Afterbeat, бывшей Project Arrhythmia, импортируются в обе стороны. Твоя работа переедет вместе с тобой.
    bots:
      title: Бот, у которого можно поучиться
      body: Бот проходит любой уровень твоим же управлением - та же скорость, тот же рывок, тот же хитбокс. Никакого читерства, и он тоже может проиграть.
    open:
      title: Движок, а не просто игра
      body: Формат уровней - открытый C# SDK под лицензией MIT. Читай и пиши уровни из своих инструментов.
