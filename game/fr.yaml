settings_interface-stats-level-objects_tooltip: "Ajoute la taille propre du niveau chargé : objets par type, images clés, pistes audio et ressources. Compté une fois par seconde, et pas du tout tant que c'est désactivé"
settings_interface-stats-memory_tooltip: "Ajoute le bloc mémoire du processus : le tas managé, et la part de sa réserve que Unity a allouée. Ce sont les totaux du processus entier, pas ceux de ce niveau"
settings_interface-stats-profiling_tooltip: "Ajoute le bloc de profilage : la durée de chaque étape de la simulation, et le nombre d'éléments que contient le panneau d'interface. Présent seulement dans l'éditeur Unity et les versions de développement - une version publiée ne porte aucun marqueur de profilage"
