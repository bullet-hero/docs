settings_graphics-antialiasing-hdr_tooltip: "渲染到HDR目標。預設在所有平臺上關閉：這款遊戲繪製的內容都不需要大於1的數值，而HDR會讓本已被抗鋸齒成倍放大的頻寬再翻一倍"
settings_graphics-antialiasing-msaa_tooltip: "MSAA對每個畫素的取樣數。僅在“型別”為MSAA時生效。數值越高越清晰，透明形狀重疊越多開銷越大，因為混合是逐取樣計算的。手機應保持在x2，桌面端可以承受x4"
settings_graphics-antialiasing-type_tooltip: "邊緣如何平滑。MSAA是預設選項，也最適合這款遊戲的內容：每個形狀都是真實幾何體，所以它只處理真正有鋸齒的地方，不會柔化其他任何東西。FXAA無論關卡過度繪製多少，開銷都只是一次全屏處理，這是在效能弱的裝置上選擇它的唯一理由。它會讓細輪廓變模糊"
settings_graphics-antialiasing_hdr: "HDR"
settings_graphics-antialiasing_msaa: "MSAA取樣數"
settings_graphics-antialiasing_type: "型別"
settings_graphics-audio-pitch_correction: "音高校正"
