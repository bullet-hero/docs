settings_interface-stats-active_tooltip: "Affiche des diagnostics par-dessus chaque écran : temps de l'image, utilisation des tampons par image, taille du niveau et mémoire du processus. Jamais interactif - les clics le traversent"
settings_interface-stats-alignment-x_tooltip: "0 est le bord gauche de l'écran, 1 le bord droit"
settings_interface-stats-alignment-y_tooltip: "0 est le bord inférieur de l'écran, 1 le bord supérieur - la même convention que celle du contenu des niveaux"
