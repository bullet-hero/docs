settings_graphics-vsync_tooltip: "Espera a atualização da tela antes de mostrar um quadro, o que remove o tearing e custa um quadro de latência. Enquanto está ativado, o limite de taxa de quadros acima não faz nada. Só no computador"
settings_graphics-window-mode_tooltip: "Como a janela ocupa a tela. Em janela permite redimensioná-la livremente, o que também muda o formato para o qual a interface se organiza. Só no computador"
