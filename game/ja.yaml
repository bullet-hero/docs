level_resources_texture-compression_tooltip: "デバイスがこの画像を非可逆フォーマットに圧縮してよいかを決めます。「拒否」はすべてのピクセルを保ち、メモリを最大4倍使います。「許可」は、種類が拒否する場合でもデバイスに圧縮させます。「自動」は種類に従い、ドット絵とグラデーションは拒否します。どちらの値も、デバイスの設定が禁じる圧縮を強いることはなく、サイズ上限も解除しません"
level_resources_texture-details: "インポート"
level_resources_texture-kind: "この画像が何か、つまり写真、イラスト、ドット絵、グラデーションのどれかを示します。純粋に見た目の選択で、画像が何なのかを伝えます。下の「サンプリング」と「圧縮」の初期値も決め（ドット絵はシャープかつ非圧縮、グラデーションは非圧縮から始まります）、どちらもそこで変更できます。ミップマップだけは今も種類が単独で決め、ドット絵には決して生成されません"
level_resources_texture-report-alpha-dropped: "アルファ除去"
level_resources_texture-report-mips: "ミップレベル"
level_resources_texture-report-not-loaded: "未読み込み"
level_resources_texture-report-source-unknown: "ソース不明"
level_resources_texture-sampling: "サンプリング"
level_resources_texture-sampling_tooltip: "この画像の描画方法です。「スムーズ」は隣り合うピクセルを混ぜ合わせ、「シャープ」は各ピクセルをくっきりした四角形として描きます。「自動」は種類に従い、ドット絵はシャープ、それ以外はスムーズになります。シャープとスムーズはデバイスへの負荷が同じなので、これは予算ではなく見た目の選択で、プレイヤー自身のフィルタリング設定より優先されます"
level_resources_texture-uv-offset-x: "オフセットX"
level_resources_texture-uv-offset-y: "オフセットY"
level_resources_texture-uv-tiling-x: "タイリングX"
level_resources_texture-uv-tiling-y: "タイリングY"
level_resources_texture-uv_tooltip: "この画像を描画するものにどう貼り付けるかを、オブジェクトごとではなくリソースで一度だけ指定します。「タイリング」はシェイプ上で繰り返す回数、「オフセット」は最初のコピーが始まる位置です。独自のUVキーフレームを持たないオブジェクトはこの設定どおりにサンプリングし、そのオブジェクトにUVキーフレームが1つでもあれば、この設定は完全に置き換えられます"
level_resources_texture-wrap-u: "ラップX"
level_resources_texture-wrap-u_tooltip: "この画像が左右の端の外側でどうなるかを決めます。「リピート」と「ミラー」はUVがタイリングされている部分にだけ現れます。タイリングが1なら画像は一度だけサンプリングされ、自身の外には出ません"
level_resources_texture-wrap-v: "ラップY"
level_resources_texture-wrap-v_tooltip: "この画像が上下の端の外側でどうなるかを決めます。X軸とは意図的に分けてあります。横方向にタイリングし、縦方向はクランプしたままの帯は、ごく普通のコンテンツです"
