hint_editor-settings_artist-permission_body: |-
  Every external resource in a level - music, images, fonts, texts - needs a licence at least as free as <color=#D4B483>CC BY-NC</color>, or the rights holder's permission for public non-commercial redistribution

  <color=#E86A5A><b>Caution:</b></color> a private "sure, go ahead" is not enough. The permission has to cover public redistribution, not just your personal use

  Nothing is checked while a level stays on your device - only when it is offered to a service

  More: <link="https://bullethero.space/en/docs/editor/rights/legal-resource-paths"><color=#59A6FF>Two ways a resource qualifies</color></link>, <link="https://bullethero.space/en/docs/editor/rights/asking-permission"><color=#59A6FF>Asking an author for permission</color></link>
hint_editor-settings_artist-permission_header: "Using someone else's work"
hint_editor-settings_community: "The project's own links - they open in your browser. Which of them are listed depends on where this build came from, so a store build may show fewer than this one"
hint_editor-settings_create-level_body: |-
  A <b>preset</b> decides what the new level starts with - an empty one, or a small amount of scaffolding you would otherwise build by hand every time

  <color=#E86A5A><b>Caution:</b></color> <b>Parameters</b> set the things that are awkward to change later: frame length and framerate

  <color=#5EC8C8><b>Tip:</b></color> the two file-format dropdowns pick how the level and its metadata are written to disk. Both can be changed afterwards from the level's Dangerous Zone

  More: <link="https://bullethero.space/en/docs/editor/basics/first-level"><color=#59A6FF>Your first level: the route</color></link>
hint_editor-settings_create-level_header: "Create a level"
hint_editor-settings_open-level: "Levels found on this device. A level is a folder - put one beside the others and it appears here"
hint_editor_beat-segment_body: |-
  One stretch of constant tempo: BPM, phase offset in fractional frames, beats per bar, a name and a colour. Only one segment is shown even when several are selected

  <color=#E86A5A><b>Caution:</b></color> a segment is identified by its start frame, so <b>moving it changes its identity</b>. After a move, reselect it at its new start

  <color=#5EC8C8><b>Tip:</b></color> taps here re-phase the selected segment instead of creating a new one

  More: <link="https://bullethero.space/en/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>Rhythm and structure</color></link>
hint_editor_beat-segment_header: "Beat segment"
hint_editor_beat-window_body: |-
  Authoring metadata - <b>nothing in playback reads it</b>. It lets you place content on the music, and generators act on the same beats you see

  The grid is a list of <b>beat segments</b>, each a stretch of constant tempo. Gaps between them are fine: an intro with no percussion, a break, the tail after the song

  <color=#5EC8C8><b>Tip:</b></color> press <b>TAP</b> along with the track, then <b>Create from taps</b> turns the taps into one segment from the first to the last

  More: <link="https://bullethero.space/en/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>Rhythm and structure</color></link>
hint_editor_beat-window_header: "Beat grid"
hint_editor_clipboard_body: |-
  One buffer per timeline, each with its own status line

  <b>Serialize Copy</b> writes every buffer into the system clipboard as text, so a selection can travel to another level or another machine. <b>Deserialize Paste</b> reads it back into the buffers - and <b>stops there</b>

  <color=#B48CE0><b>Worth knowing:</b></color> nothing reaches the level until you paste into the timeline you chose yourself. Where it lands depends on the playhead and the active scope

  More: <link="https://bullethero.space/en/docs/editor/workflow/reuse"><color=#59A6FF>Reuse: prefabs, copying, generators</color></link>
hint_editor_clipboard_header: "Clipboard"
hint_editor_console: "Everything the editor has logged this session - level load reports, generator results, import warnings. <b>Clear</b> empties it. The gear filters which severities are shown"
hint_editor_curve-editor: "Edits a curve by dragging its points. Changes apply <b>live</b> as you drag, so what you see is already what the level holds - closing the window keeps them"
hint_editor_generators_body: |-
  Procedural content, run against the level as one undoable operation

  <color=#B48CE0><b>Worth knowing:</b></color> there are two families. <b>Generators</b> (<i>gen_</i>) create content - bullet waves, radial patterns, the font cache, an Afterbeat level import. <b>Modifiers</b> (<i>mod_</i>) rewrite what is already there - fitting spans, quantising keyframes

  <color=#E86A5A><b>Caution:</b></color> anything that rewrites or deletes existing content asks for confirmation first

  More: <link="https://bullethero.space/en/docs/editor/workflow/reuse"><color=#59A6FF>Reuse: prefabs, copying, generators</color></link>
hint_editor_generators_header: "Generators"
hint_editor_gradient-editor: "Edits a gradient by dragging its stops. Like the curve editor, changes apply <b>live</b> rather than on a commit"
hint_editor_hierarchy_body: |-
  Every object alive on the <b>current frame</b>, nested by parent. The list changes as you scrub - an empty hierarchy usually means the playhead is past the end of your content

  Drag a row onto another to make it that object's child. Layers add up along the chain, so reparenting also moves an object in draw order and rerolls its random values

  <color=#5EC8C8><b>Tip:</b></color> right-click a row for its actions. On touch, hold the row

  More: <link="https://bullethero.space/en/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>How the editor thinks</color></link>
hint_editor_hierarchy_header: "Hierarchy"
hint_editor_inspector-audio_body: |-
  The selected audio track's clip, speed, fader volume and its chain of audio effects - lowpass, highpass, echo, reverb, chorus, pitch shifter, distortion, flange, compressor, normalize and parametric EQ

  Speed and volume are sliders rather than plain number fields so their legal range is visible

  <color=#E86A5A><b>Caution:</b></color> <b>Volume here is the fader.</b> Keyframed volume is a separate track on the Local timeline, and the two multiply at playback

  More: <link="https://bullethero.space/en/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparing the track</color></link>
hint_editor_inspector-audio_chorus-delay: "Base delay of the copies in ms - short enough to be heard as thickness rather than as an echo"
hint_editor_inspector-audio_chorus-depth: "How far the delay swings - Rate sets the speed of the wobble, this its size"
hint_editor_inspector-audio_chorus-dry-mix: "Level of the untouched signal"
hint_editor_inspector-audio_chorus-feedback: "How much output is fed back into the effect, deepening it toward flanger territory"
hint_editor_inspector-audio_chorus-rate: "How fast the delay is modulated, in Hz"
hint_editor_inspector-audio_chorus-wet-mix-tap-1: "Level of the first delayed copy"
hint_editor_inspector-audio_chorus-wet-mix-tap-2: "Level of the second copy - the taps are spaced apart, so their balance decides how wide the chorus feels"
hint_editor_inspector-audio_chorus-wet-mix-tap-3: "Level of the third copy"
hint_editor_inspector-audio_chorus_body: |-
  Lays three slightly delayed copies with a wobbling pitch over the signal, so one source sounds like several. <color=#D4B483>Rate</color> is the speed of the wobble, <color=#D4B483>Depth</color> its size. Push <color=#D4B483>Feedback</color> up and it turns into <link="hint_editor_inspector-audio_flange"><color=#59A6FF>Flange</color></link>

  <color=#B48CE0><b>Worth knowing:</b></color> <b>reset</b> also returns <b>Mix Level</b> to its -80 dB default, so it switches the effect off

  More: <link="https://bullethero.space/en/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparing the track</color></link>
hint_editor_inspector-audio_chorus_header: "Chorus"
hint_editor_inspector-audio_compressor-attack: "How quickly it clamps down after a peak, in ms - too fast kills transients"
hint_editor_inspector-audio_compressor-make-up-gain: "Gain in dB added back after compression, to recover the level it removed"
hint_editor_inspector-audio_compressor-release: "How quickly it lets go afterwards, in ms - too fast pumps audibly"
hint_editor_inspector-audio_compressor-threshold: "Level in dB above which compression starts acting"
hint_editor_inspector-audio_compressor_body: |-
  Pulls the loud parts down so the quiet ones can sit higher - the usual fix for a song that disappears behind its own effects. <color=#D4B483>Threshold</color> is where it starts, <color=#D4B483>Attack</color> and <color=#D4B483>Release</color> how fast it clamps and lets go, <color=#D4B483>Make Up Gain</color> gives the level back

  <color=#B48CE0><b>Worth knowing:</b></color> <b>reset</b> also returns <b>Mix Level</b> to its -80 dB default, so it switches the effect off

  More: <link="https://bullethero.space/en/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparing the track</color></link>
hint_editor_inspector-audio_compressor_header: "Compressor"
hint_editor_inspector-audio_distortion-level: "How hard the signal is clipped"
hint_editor_inspector-audio_distortion_body: |-
  Clips the waveform and fills the sound with harmonics - gritty and overdriven. One dial, <color=#D4B483>Level</color>, for how hard it bites. It also flattens dynamics, so the track loses its quiet moments

  <color=#B48CE0><b>Worth knowing:</b></color> <b>reset</b> also returns <b>Mix Level</b> to its -80 dB default, so it switches the effect off

  More: <link="https://bullethero.space/en/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparing the track</color></link>
hint_editor_inspector-audio_distortion_header: "Distortion"
hint_editor_inspector-audio_echo-decay: "How much of each repeat feeds the next - higher values ring on longer"
hint_editor_inspector-audio_echo-delay: "Milliseconds between repeats - tie it to the song's tempo to keep the echoes on the beat"
hint_editor_inspector-audio_echo-dry-mix: "Level of the untouched signal in the output"
hint_editor_inspector-audio_echo-max-channels: "Channel cap for the echo buffer"
hint_editor_inspector-audio_echo-wet-mix: "Level of the echoed signal - balanced against Dry Mix, separately from Mix Level"
hint_editor_inspector-audio_echo_body: |-
  Repeats the signal at a fixed interval, each repeat quieter than the last - separate copies, not the room of <link="hint_editor_inspector-audio_reverb"><color=#59A6FF>Reverb</color></link>. <color=#D4B483>Delay</color> is the gap in milliseconds, <color=#D4B483>Decay</color> how much of each copy feeds the next

  <color=#B48CE0><b>Worth knowing:</b></color> <b>reset</b> also returns <b>Mix Level</b> to its -80 dB default, so it switches the effect off

  More: <link="https://bullethero.space/en/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparing the track</color></link>
hint_editor_inspector-audio_echo_header: "Echo"
hint_editor_inspector-audio_enabled: "Whether this effect is in the chain. There is no flag of its own - ticking it lifts Mix Level off the -80 dB floor, unticking puts it back and keeps the level you had set"
hint_editor_inspector-audio_flange-depth: "How far the delay swings"
hint_editor_inspector-audio_flange-dry-mix: "Level of the untouched signal"
hint_editor_inspector-audio_flange-rate: "How fast the sweep repeats, in Hz"
hint_editor_inspector-audio_flange-wet-mix: "Level of the swept copy - the cancellation between the two is the effect"
hint_editor_inspector-audio_flange_body: |-
  Mixes the signal with a very short, sweeping delay of itself - the jet-engine whoosh. Like <link="hint_editor_inspector-audio_chorus"><color=#59A6FF>Chorus</color></link>, but with one copy, so you hear a sweep rather than width. The whoosh is deepest when <color=#D4B483>Dry Mix</color> and <color=#D4B483>Wet Mix</color> are close

  <color=#B48CE0><b>Worth knowing:</b></color> <b>reset</b> also returns <b>Mix Level</b> to its -80 dB default, so it switches the effect off

  More: <link="https://bullethero.space/en/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparing the track</color></link>
hint_editor_inspector-audio_flange_header: "Flange"
hint_editor_inspector-audio_header: "Audio track inspector"
hint_editor_inspector-audio_highpass-cutoff-freq: "Frequency in Hz below which the track is attenuated - at the minimum the filter is effectively transparent"
hint_editor_inspector-audio_highpass_body: |-
  The mirror of <link="hint_editor_inspector-audio_lowpass"><color=#59A6FF>Lowpass</color></link>: passes the highs and cuts everything below <color=#D4B483>Cutoff Freq</color>. Raise the cutoff and the track thins out into a tiny speaker

  <color=#5EC8C8><b>Tip:</b></color> the chain belongs to the <b>track</b> and is not keyframed. For a change mid-song, cut the track and set the two halves apart

  <color=#B48CE0><b>Worth knowing:</b></color> <b>reset</b> also returns <b>Mix Level</b> to its -80 dB default, so it switches the effect off

  More: <link="https://bullethero.space/en/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparing the track</color></link>
hint_editor_inspector-audio_highpass_header: "Highpass"
hint_editor_inspector-audio_lowpass-cutoff-freq: "Frequency in Hz above which the track is attenuated - at the maximum the filter is effectively transparent"
hint_editor_inspector-audio_lowpass_body: |-
  Passes the low end and cuts everything above <color=#D4B483>Cutoff Freq</color> - the underwater, behind-a-wall sound. At the top of the range the filter is effectively transparent

  <color=#5EC8C8><b>Tip:</b></color> the chain belongs to the <b>track</b> and is not keyframed. For a change mid-song, cut the track and set the two halves apart

  <color=#B48CE0><b>Worth knowing:</b></color> <b>reset</b> also returns <b>Mix Level</b> to its -80 dB default, so it switches the effect off

  More: <link="https://bullethero.space/en/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparing the track</color></link>
hint_editor_inspector-audio_lowpass_header: "Lowpass"
hint_editor_inspector-audio_mix-level: "Level in dB at which the processed signal is mixed back in. At -80 the effect is silent, and that is how \"off\" is stored - there is no separate switch in the file"
hint_editor_inspector-audio_normalize-fade-in-time: "Milliseconds the gain takes to settle, so the correction is not audible as a jump"
hint_editor_inspector-audio_normalize-lowest-volume: "Signals quieter than this are left alone - keeps silence and noise floors from being amplified into hiss"
hint_editor_inspector-audio_normalize-maximum-amp: "Ceiling on how much gain may be applied"
hint_editor_inspector-audio_normalize_body: |-
  Brings the signal toward a target loudness, so clips from different sources sit at a comparable level. It works on overall level, dynamics inside a track are for <link="hint_editor_inspector-audio_compressor"><color=#59A6FF>Compressor</color></link>. <color=#D4B483>Lowest Volume</color> keeps it from turning silence into hiss, <color=#D4B483>Maximum Amp</color> caps the boost

  <color=#B48CE0><b>Worth knowing:</b></color> <b>reset</b> also returns <b>Mix Level</b> to its -80 dB default, so it switches the effect off

  More: <link="https://bullethero.space/en/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparing the track</color></link>
hint_editor_inspector-audio_normalize_header: "Normalize"
hint_editor_inspector-audio_param-eq-center-freq: "Frequency in Hz the band is centered on"
hint_editor_inspector-audio_param-eq-frequency-gain: "Gain applied inside the band - below 1 cuts, above 1 boosts"
hint_editor_inspector-audio_param-eq-octave-range: "Width of the band in octaves - narrow for surgical fixes, wide for tone shaping"
hint_editor_inspector-audio_param-eq_body: |-
  One parametric band that boosts or cuts a chosen region of the spectrum. Unlike <link="hint_editor_inspector-audio_lowpass"><color=#59A6FF>Lowpass</color></link> and <link="hint_editor_inspector-audio_highpass"><color=#59A6FF>Highpass</color></link> it can add level too. <color=#D4B483>Center Freq</color> is where the band sits, <color=#D4B483>Octave Range</color> how wide it is, <color=#D4B483>Frequency Gain</color> below 1 cuts and above 1 boosts

  <color=#B48CE0><b>Worth knowing:</b></color> <b>reset</b> also returns <b>Mix Level</b> to its -80 dB default, so it switches the effect off

  More: <link="https://bullethero.space/en/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparing the track</color></link>
hint_editor_inspector-audio_param-eq_header: "Param EQ"
hint_editor_inspector-audio_pitch-shifter-fft-size: "Analysis window size - the quality against latency dial of the algorithm"
hint_editor_inspector-audio_pitch-shifter-max-channels: "Channel cap for the processing"
hint_editor_inspector-audio_pitch-shifter-overlap: "How much consecutive windows overlap - more overlap smooths artifacts at a cost"
hint_editor_inspector-audio_pitch-shifter-pitch: "Pitch multiplier - 1 is unchanged, 2 an octave up"
hint_editor_inspector-audio_pitch-shifter_body: |-
  Changes the pitch without changing the speed, so the timing stays locked to the song. <color=#D4B483>Pitch</color> is a multiplier: 1 leaves it alone, 2 is an octave up. <color=#D4B483>FFT Size</color> and <color=#D4B483>Overlap</color> trade quality against cost

  <color=#5EC8C8><b>Tip:</b></color> the chain belongs to the <b>track</b> and is not keyframed. For a change mid-song, cut the track and set the two halves apart

  <color=#B48CE0><b>Worth knowing:</b></color> <b>reset</b> also returns <b>Mix Level</b> to its -80 dB default, so it switches the effect off

  More: <link="https://bullethero.space/en/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparing the track</color></link>
hint_editor_inspector-audio_pitch-shifter_header: "Pitch Shifter"
hint_editor_inspector-audio_reverb-decay-hf-ratio: "How much faster highs decay than lows - below 1 the tail darkens as it fades"
hint_editor_inspector-audio_reverb-decay-time: "Seconds the tail takes to fade out - the single strongest cue of room size"
hint_editor_inspector-audio_reverb-density: "Modal density of the simulated space"
hint_editor_inspector-audio_reverb-diffusion: "Echo density over time - low values make the tail grainy and metallic"
hint_editor_inspector-audio_reverb-dry-level: "Level of the untouched signal in the output"
hint_editor_inspector-audio_reverb-hf-reference: "Frequency the Room HF and Decay HF Ratio settings are measured at"
hint_editor_inspector-audio_reverb-lf-reference: "Frequency the Room LF setting is measured at"
hint_editor_inspector-audio_reverb-reflect-delay: "Delay before those reflections arrive - how far the walls are"
hint_editor_inspector-audio_reverb-reflections: "Level of the early reflections - the distinct first bounces off nearby walls"
hint_editor_inspector-audio_reverb-reverb: "Level of the late, diffuse tail, as opposed to the early reflections"
hint_editor_inspector-audio_reverb-reverb-delay: "Delay before that tail sets in"
hint_editor_inspector-audio_reverb-room: "Overall level of the reverberated signal - the room's presence"
hint_editor_inspector-audio_reverb-room-hf: "Room level at high frequencies - cutting it reads as soft, absorbent walls"
hint_editor_inspector-audio_reverb-room-lf: "Room level at low frequencies"
hint_editor_inspector-audio_reverb_body: |-
  Puts the track in a room: early reflections, then a decaying tail. Start with three fields: <color=#D4B483>Decay Time</color> is the room size, <color=#D4B483>Room</color> how much of it you hear, <color=#D4B483>Room HF</color> cut low makes the walls soft

  <color=#B48CE0><b>Worth knowing:</b></color> <b>reset</b> also returns <b>Mix Level</b> to its -80 dB default, so it switches the effect off

  More: <link="https://bullethero.space/en/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparing the track</color></link>
hint_editor_inspector-audio_reverb_header: "Reverb"
hint_editor_inspector-effect_angle-a: "The angle, in degrees. Under the Random variants it is one end of the range each particle draws from"
hint_editor_inspector-effect_angle-b: "The other end of the range each particle draws its angle from"
hint_editor_inspector-effect_angle-curve: "The curve the angle is read from - against the particle's own lifetime under Over Life, against its speed under By Speed"
hint_editor_inspector-effect_angle-speed-range: "Speed window the curve is remapped through - the speed that reads as the curve's start, and the one that reads as its end"
hint_editor_inspector-effect_angle-type: "Which of the five rotation variants this is. Changing it replaces the whole sub-object, so the rows below are the new variant's"
hint_editor_inspector-effect_angle_body: |-
  How a particle is rotated over its life, as one of five variants: a fixed <color=#D4B483>Value</color>, two <color=#D4B483>Curves</color> or two <color=#D4B483>Random</color> ranges drawn per particle

  <color=#D4B483>Over Life</color> reads the curve along the particle's lifetime, <color=#D4B483>By Speed</color> along its speed, through the speed window below

  The <b>reset</b> beside this button resets <color=#D4B483>Type</color> too, and the curve or the random pair goes with it

  More: <link="https://bullethero.space/en/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Readability</color></link>
hint_editor_inspector-effect_angle_header: "Angle"
hint_editor_inspector-effect_body: |-
  A <color=#D4B483>VFX Graph</color> effect's parameters, grouped: config, core, forces, shape, angle, scale and colour. Every group is visible at once rather than one at a time

  <color=#B48CE0><b>Worth knowing:</b></color> effects are <b>seeded the same way everything else is</b> - from numbers you edit rather than from generator state - so the same level plays back identically on any device

  <color=#5EC8C8><b>Tip:</b></color> colours can reference the level theme instead of holding a literal, and gradient types open the shared gradient editor

  More: <link="https://bullethero.space/en/docs/editor/performance/level-budget"><color=#59A6FF>The level's budget</color></link>
hint_editor_inspector-effect_color-a: "The particle's colour. Under the Random variants it is one end of the range each particle draws from"
hint_editor_inspector-effect_color-b: "The other end of the range each particle draws its colour from"
hint_editor_inspector-effect_color-gradient: "The gradient the tint is read from - along the particle's lifetime, along its speed, or one colour per particle, depending on the variant"
hint_editor_inspector-effect_color-speed-range: "Speed window the gradient is remapped through - the speed that reads as its start, and the one that reads as its end"
hint_editor_inspector-effect_color-type: "Which of the six tint variants this is. Changing it replaces the whole sub-object, so the rows below are the new variant's"
hint_editor_inspector-effect_color_body: |-
  How a particle is tinted over its life, as one of six variants: the five of <link="hint_editor_inspector-effect_angle"><color=#59A6FF>Angle</color></link> and <link="hint_editor_inspector-effect_scale"><color=#59A6FF>Scale</color></link> with gradients instead of curves, plus a gradient <color=#D4B483>Random</color> that picks one colour per particle

  <color=#5EC8C8><b>Tip:</b></color> a colour here can be a theme reference, so the effect follows a level that changes its palette partway through

  The <b>reset</b> beside this button resets <color=#D4B483>Type</color> too, and the gradient or the colour pair goes with it

  More: <link="https://bullethero.space/en/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>Colour and themes</color></link>
hint_editor_inspector-effect_color_header: "Color"
hint_editor_inspector-effect_config-has-stop-frame: "Whether Stop Frame is honoured at all. Off, the emitter keeps spawning for as long as its object lives"
hint_editor_inspector-effect_config-stop-frame: "Frame, counted from the object's own span start rather than from level time, where emission stops. Particles already alive still finish their lifetime"
hint_editor_inspector-effect_config_body: |-
  When the emitter stops spawning. Off, it spawns for as long as the object lives, which is the ordinary case

  <color=#D4B483>Stop Frame</color> counts from the object's own span start, not from the level timeline. Particles already alive finish their lifetime, so the picture fades rather than cutting

  The <b>reset</b> beside this button returns both fields to the developers' defaults as one undo step

  More: <link="https://bullethero.space/en/docs/editor/performance/level-budget"><color=#59A6FF>What a level can afford</color></link>
hint_editor_inspector-effect_config_header: "Config"
hint_editor_inspector-effect_core-lifetime-bounds: "Min and max seconds a particle lives, drawn per particle - the spread is what keeps a burst from dying all at once. Their average is also what a one-shot's batch size is multiplied by"
hint_editor_inspector-effect_core-loop: "Whether the system emits continuously, instead of one batch that is never refilled. With it off there is nothing left to draw past the lifetime bounds"
hint_editor_inspector-effect_core-particle-count: "Particles emitted per second - the main cost knob. Alive at once is this times the average lifetime, in both modes: looping spawns at this rate, a one-shot bursts that whole product in one go. The ceiling is the graph's own capacity, and a system dispatches over that capacity every frame whether or not the particles exist"
hint_editor_inspector-effect_core-particle-pivot: "Point of the particle that sits on its position and that it rotates around - the per-particle counterpart of an object's own pivot"
hint_editor_inspector-effect_core-render: "Whether particles are drawn at all. Off keeps the system simulating, which is useful when only its side effects matter"
hint_editor_inspector-effect_core-shape-id: "Geometry each particle is drawn with, out of the same shape pool an object draws from. None draws nothing at all - the quad is an ordinary value and is this field's default"
hint_editor_inspector-effect_core-texture-id: "Image each particle draws, out of the same resource pool an object draws from. None leaves the particle unpainted, which is this field's default"
hint_editor_inspector-effect_core_body: |-
  How many particles exist, how long they live and what they are drawn with. How they move is <link="hint_editor_inspector-effect_forces"><color=#59A6FF>Forces</color></link>

  <color=#D4B483>Particle Count</color> is the main cost knob: an emitter costs roughly count times <color=#D4B483>Lifetime Bounds</color>. <color=#D4B483>Shape</color> and <color=#D4B483>Texture</color> may stay empty - an untextured particle is the cheap case

  <color=#E8B04B><b>Warning:</b></color> the count is capped at 1024, and the graph pays for its whole capacity every frame, not only for the particles alive. Ask for as many as you need

  More: <link="https://bullethero.space/en/docs/editor/performance/level-budget"><color=#59A6FF>What a level can afford</color></link>
hint_editor_inspector-effect_core_header: "Core"
hint_editor_inspector-effect_forces-linear-force: "Constant acceleration rather than velocity, so its effect compounds over the particle's life instead of staying flat"
hint_editor_inspector-effect_forces-linear-velocity: "Constant drift added every frame on top of whatever velocity the particle was born with - wind, not an impulse"
hint_editor_inspector-effect_forces-orbital-center-offset: "Where that orbit centre sits relative to the emitter. Offsetting it makes the swirl lopsided"
hint_editor_inspector-effect_forces-orbital-velocity: "Rotation of particles around a centre rather than around themselves. The Z component is the one that matters in a 2D scene"
hint_editor_inspector-effect_forces-start-angular-velocity-max: "Upper bound of the initial spin draw"
hint_editor_inspector-effect_forces-start-angular-velocity-min: "Lower bound of the initial spin draw, in degrees per second"
hint_editor_inspector-effect_forces-start-gravity-max: "Upper bound of the per-particle gravity draw"
hint_editor_inspector-effect_forces-start-gravity-min: "Lower bound of the per-particle gravity draw. Negative values float upward"
hint_editor_inspector-effect_forces-start-velocity-max: "Upper bound of the initial velocity draw. Spreading these two is what turns a clean burst into a spray"
hint_editor_inspector-effect_forces-start-velocity-min: "Lower bound of the initial velocity draw, per axis"
hint_editor_inspector-effect_forces-velocity-speed: "Multiplier over the particle's whole velocity - one dial to slow down or speed up a finished effect without re-tuning every field above"
hint_editor_inspector-effect_forces_body: |-
  Everything that moves a particle after it spawns. Where it starts is <link="hint_editor_inspector-effect_shape"><color=#59A6FF>Shape</color></link>

  The <color=#D4B483>Start</color> pairs are drawn once at birth, per particle. Everything else acts continuously for the particle's whole life, and <color=#D4B483>Linear Force</color> is an acceleration, so it compounds

  <color=#5EC8C8><b>Tip:</b></color> <color=#D4B483>Velocity Speed</color> multiplies the whole result, so a finished effect can be slowed down or sped up without re-tuning the rest

  More: <link="https://bullethero.space/en/docs/editor/craft/composition-and-camera"><color=#59A6FF>Composition</color></link>
hint_editor_inspector-effect_forces_header: "Forces"
hint_editor_inspector-effect_header: "Effect inspector"
hint_editor_inspector-effect_scale-a: "The particle's size. Under the Random variants it is one end of the range each particle draws from"
hint_editor_inspector-effect_scale-b: "The other end of the range each particle draws its size from"
hint_editor_inspector-effect_scale-curve-x: "The curve the horizontal size is read from, independently of the vertical one"
hint_editor_inspector-effect_scale-curve-y: "The curve the vertical size is read from, independently of the horizontal one"
hint_editor_inspector-effect_scale-speed-range: "Speed window the two curves are remapped through - the speed that reads as their start, and the one that reads as their end"
hint_editor_inspector-effect_scale-type: "Which of the five size variants this is. Changing it replaces the whole sub-object, so the rows below are the new variant's"
hint_editor_inspector-effect_scale_body: |-
  How big a particle is over its life, in the same five variants as <link="hint_editor_inspector-effect_angle"><color=#59A6FF>Angle</color></link>. <color=#D4B483>Curve X</color> and <color=#D4B483>Curve Y</color> are read independently, so a particle can stretch as it shrinks

  <color=#E8B04B><b>Warning:</b></color> the row under the curves is reused: the size itself under Value and Random, the speed window under By Speed. The caption beside it says which

  The <b>reset</b> beside this button resets <color=#D4B483>Type</color> too, and both curves and the random pair go with it

  More: <link="https://bullethero.space/en/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Readability</color></link>
hint_editor_inspector-effect_scale_header: "Scale"
hint_editor_inspector-effect_shape-arc: "Portion of the rim actually used, in radians, measured counter-clockwise from the +X axis - less than a full turn makes a fan"
hint_editor_inspector-effect_shape-box-size: "Full width and height of the spawn box, centred on the effect object"
hint_editor_inspector-effect_shape-circle-aspect: "Vertical semi-axis as a multiple of the radius: 1 is a circle, anything else an ellipse"
hint_editor_inspector-effect_shape-circle-radius: "Distance from the centre to the ring, along the horizontal axis"
hint_editor_inspector-effect_shape-circle-thickness: "How far inward the ring is filled: 0 is a bare outline, 1 a full disc"
hint_editor_inspector-effect_shape-cone-base-radius: "Radius at the emitter end"
hint_editor_inspector-effect_shape-cone-height: "Distance between the two ends - how deep the spawn volume is"
hint_editor_inspector-effect_shape-cone-top-radius: "Radius at the far end. Larger than the base radius flares out, smaller funnels in"
hint_editor_inspector-effect_shape-line-end: "The other end of the segment"
hint_editor_inspector-effect_shape-line-start: "One end of the segment, local to the effect object"
hint_editor_inspector-effect_shape-spread: "Portion of the shape the walk covers before wrapping"
hint_editor_inspector-effect_shape-spread-speed: "How fast the spawn point advances - what sets the visible rotation rate"
hint_editor_inspector-effect_shape-spread-type: "How successive particles walk the shape: randomly, looping in one direction, ping-ponging, or on a sine. This is what turns a static ring into a rotating or sweeping pattern"
hint_editor_inspector-effect_shape-torus-radius-major: "Radius of the ring the tube is bent around"
hint_editor_inspector-effect_shape-torus-radius-minor: "Radius of the tube itself - how thick the ring is"
hint_editor_inspector-effect_shape-type: "Which spawn volume this is. Changing it replaces the shape, so the fields below are the new shape's, not the old one's"
hint_editor_inspector-effect_shape_body: |-
  The spawn volume: a point, a ring, a box, a segment, a cone or a torus. It decides only where a particle starts, what happens next is <link="hint_editor_inspector-effect_forces"><color=#59A6FF>Forces</color></link>

  Changing <color=#D4B483>Type</color> changes the rows below, and the rows are shared between types. <color=#D4B483>Arc</color> is in radians, and less than a full turn makes a fan

  <color=#5EC8C8><b>Tip:</b></color> <b>Spread</b> set to Loop gives the classic rotating emitter

  The <b>reset</b> beside this button resets <color=#D4B483>Type</color> too, and the shape goes with it

  More: <link="https://bullethero.space/en/docs/editor/craft/composition-and-camera"><color=#59A6FF>Composition</color></link>
hint_editor_inspector-effect_shape_header: "Shape"
hint_editor_inspector-keyframe_body: |-
  <b>Every track the selection touches is shown at once</b>, not just the last one you clicked. A blank value means the selected keys <b>disagree</b> on it

  <color=#5EC8C8><b>Tip:</b></color> <b>Ease</b> works across tracks and commits as a <b>single undo step</b>

  <color=#B48CE0><b>Worth knowing:</b></color> <b>Frame</b> is locked while several keys are selected - one number would collapse them onto one frame. Drag them on the timeline instead

  More: <link="https://bullethero.space/en/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>How the editor thinks</color></link>
hint_editor_inspector-keyframe_header: "Keyframe inspector"
hint_editor_inspector-object_body: |-
  The selected object's own fields. Every type shows the shared rect fields, and Shape, Effect, Text and Prefab objects add their own below them

  <b>Active</b> turns off both rendering <i>and</i> collision, and children inherit it: an object hidden here cannot kill the player

  <color=#E86A5A><b>Caution:</b></color> <b>Layer</b> is relative to the parent. The read-only global layer beside it is what the renderer uses

  <color=#5EC8C8><b>Tip:</b></color> a field edited on an object from a prefab records a <b>per-instance override</b> - the checkbox beside it shows and reverts it

  More: <link="https://bullethero.space/en/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>How the editor thinks</color></link>
hint_editor_inspector-object_header: "Object inspector"
hint_editor_inspector-resolved_body: |-
  What the selected objects <b>are</b> on the current frame, read from the running simulation rather than from what you authored

  The square at the end of a row is the field's keyframe state: blue - a key on this frame (click the square to select it), amber - interpolated between keys, grey - outside the keys, the value is held, hollow - no keys, the default is used. The arrows jump the playhead to the previous or the next key

  Below the rule sit composed values - the summed layer, the inherited Active flag and the parent-composed transform. No keyframe sets them, so they carry no indicator

  More: <link="https://bullethero.space/en/docs/editor/reference/object-properties"><color=#59A6FF>Object properties</color></link>
hint_editor_inspector-resolved_header: "Resolved values"
hint_editor_inspector_audio-span-fit: "Stretch the track over as much of its clip as fits before the end of the level. Unavailable without a resolvable clip, and at speed zero, because a frozen track has no length to fit"
hint_editor_inspector_audio-span-fit-level: "Grow the track and the level together until the whole clip fits. The level only ever gets longer, and a clip that already fits changes nothing"
hint_editor_inspector_collider-id_body: |-
  What this object <b>hits</b> - and it is a separate choice from what it draws

  <color=#B48CE0><b>Worth knowing:</b></color> neither derives from the other, and that is deliberate: a telegraph beam that is drawn but harmless, a hitbox simpler than the art it guards, and an invisible wall are all ordinary content rather than tricks

  <color=#5EC8C8><b>Tip:</b></color> both fields pick from the same two collections, so a shape a level authored can serve as either or both

  More: <link="https://bullethero.space/en/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Readability and fairness</color></link>
hint_editor_inspector_collider-id_header: "Collider"
hint_editor_inspector_ease_body: |-
  How the value arrives at this keyframe from the previous one

  <color=#B48CE0><b>Worth knowing:</b></color> easing belongs to the <b>incoming</b> side of a keyframe, so the first keyframe of a track has nothing to ease from and its choice does not show

  <color=#5EC8C8><b>Tip:</b></color> with several keyframes selected, the choice applies to all of them as a <b>single undo step</b>, even across tracks and objects. A blank choice means they disagree

  More: <link="https://bullethero.space/en/docs/editor/basics/keyframes-and-easing"><color=#59A6FF>Keyframes and easing</color></link>
hint_editor_inspector_ease_header: "Easing"
hint_editor_inspector_global-layer: "The draw order the renderer actually uses: this object's own layer plus every ancestor's. Read-only, because it is computed rather than stored"
hint_editor_inspector_layer_body: |-
  Draw order, <b>relative to the parent</b> rather than absolute

  <color=#E86A5A><b>Caution:</b></color> the renderer uses this number plus every ancestor's, shown read-only in <b>Global</b> below. Reparenting changes where an object draws even when this number stays the same

  <color=#B48CE0><b>Worth knowing:</b></color> random values are tied to the effective layer, so moving an object in the hierarchy rerolls them

  More: <link="https://bullethero.space/en/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>How the editor thinks</color></link>
hint_editor_inspector_layer_header: "Layer"
hint_editor_inspector_object-type: "What kind of object this is. Changing it REPLACES the object, keeping the shared fields and dropping what the new type has no place for"
hint_editor_inspector_parent: "Which object this one follows. A parent composes its transform onto the child, and layers add up along the chain, so reparenting moves an object in draw order too"
hint_editor_inspector_shader-type_body: |-
  Which render path this object takes

  <color=#E86A5A><b>Caution:</b></color> <b>Auto</b> decides once, when the level loads, and never changes how the level looks: anything it cannot prove opaque from alpha becomes transparent

  <color=#5EC8C8><b>Tip:</b></color> the label beside this field shows what Auto actually resolved to, read straight from the renderer's data

  More: <link="https://bullethero.space/en/docs/editor/performance/level-budget"><color=#59A6FF>The level's budget</color></link>
hint_editor_inspector_shader-type_header: "Shader Type"
hint_editor_inspector_shape-id_body: |-
  What this object <b>draws</b>

  <color=#B48CE0><b>Worth knowing:</b></color> a shape is real geometry fitted to its box, exactly 1 across its longer axis, so the object's rect is what appears on screen. The game generates around 500 of them, and a level can add its own

  <color=#5EC8C8><b>Tip:</b></color> leaving this empty is valid: an object that draws nothing but has a collider is an invisible wall

  More: <link="https://bullethero.space/en/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Readability and fairness</color></link>
hint_editor_inspector_shape-id_header: "Shape"
hint_editor_inspector_span_body: |-
  When this object exists, as a half-open range: the start frame is in, the end frame is not. An object ending at 20 and one starting at 20 never both draw on that frame

  <color=#B48CE0><b>Worth knowing:</b></color> a child's span must lie inside its parent's, but that is resolved on read, never stored. Shrink a parent and its children are clipped, grow it back and they return. A root object running past the end of the level simply never plays

  <b>Anchors</b> make an edge follow the parent's edge, and they decide what plays: an anchored child stretches with a growing parent. Its animation keeps the timing you authored

  More: <link="https://bullethero.space/en/docs/editor/basics/frames-and-time"><color=#59A6FF>Frames, time and the length of a level</color></link>
hint_editor_inspector_span_header: "Span"
hint_editor_interop-report: "What did and did not survive a conversion from another game's format. Entries are informational: the level already loaded, this says where it differs from the original"
hint_editor_level-export_body: |-
  Writes this level outside the game - as a folder or as one archive. Everything the level uses travels with it, a song from outside the level folder included

  A plain <b>.zip</b> opens in Windows Explorer with nothing installed. The password options do not: <b>+ password</b> opens in 7-Zip or any other archiver, <b>(gpg)</b> opens with gpg

  <color=#5EC8C8><b>Tip:</b></color> whatever could not travel - a resource behind a URL, a file nothing references - is listed in the report afterwards

  <color=#E8B04B><b>Warning:</b></color> a password is not DRM. Anyone holding the file and the password can always open it

  More: <link="https://bullethero.space/en/docs/editor/workflow/sharing-by-hand"><color=#59A6FF>Sharing a level by hand</color></link>
hint_editor_level-export_header: "Export level"
hint_editor_level-protection_body: |-
  Encrypts this level's document on disk, so opening the level asks for a password. The metadata, the cover and the media stay readable, so the level card still shows without it

  The password is asked once per session and kept in memory only. To remove the protection, leave the field empty and press <b>Apply</b>

  <color=#E86A5A><b>Caution:</b></color> a forgotten password cannot be recovered. No key is kept anywhere

  More: <link="https://bullethero.space/en/docs/editor/reference/export-and-protection"><color=#59A6FF>Export and protection</color></link>
hint_editor_level-protection_header: "Protect level"
hint_editor_prefab-flatten-recursive_body: |-
  Off - only the placement you pointed at stops following its template. A prefab placed inside it keeps its own link, so editing that inner template still reaches this level. This is the default

  On - everything nested is flattened too, and nothing in the level stays linked to those inner templates, at any depth

  The templates themselves stay in the level either way, and a flatten is one undo step

  More: <link="https://bullethero.space/en/docs/editor/reference/prefab-mode"><color=#59A6FF>Prefab Mode</color></link>
hint_editor_prefab-flatten-recursive_header: "Flatten nested prefabs too"
hint_editor_prefab-mode_body: |-
  <color=#E86A5A><b>Caution:</b></color> you are editing a prefab <b>template</b>, not one placement of it. Saving carries the change to every placement that references this template

  Edits made here record no per-instance overrides. An override comes only from editing a placement's object outside this mode

  <color=#5EC8C8><b>Tip:</b></color> a placement inside this template opens its own template on top, and "Save & Close" brings you back here. Nesting stops at 8 levels

  More: <link="https://bullethero.space/en/docs/editor/workflow/reuse"><color=#59A6FF>Reuse: prefabs, copying, generators</color></link>
hint_editor_prefab-mode_header: "Prefab Mode"
hint_editor_search-palette_body: |-
  Two modes. <b>Run Command</b> finds any editor action by name - the same actions the toolbar and the context menus run. <b>Search Content</b> finds the objects of the current scope and the audio tracks

  <color=#B48CE0><b>Worth knowing:</b></color> resources are in neither mode: each one is picked through the field that needs it

  More: <link="https://bullethero.space/en/docs/editor/workflow/speed-and-shortcuts"><color=#59A6FF>Speed and shortcuts</color></link>
hint_editor_search-palette_header: "Command palette"
hint_editor_search-picker: "The one picker every resource field uses. Type to rank the list. The filters narrow it by kind, and the chip on the right appears when a field accepts only one domain"
hint_editor_theme-ref_body: |-
  Point this colour at a <b>slot in the level's theme</b> instead of a literal value. When the theme changes, everything referencing the slot restyles at once

  <color=#5EC8C8><b>Tip:</b></color> the swatches show the palette at the frame of the key you are editing, not at the playhead. To pick against a later look, edit a key that sits later

  More: <link="https://bullethero.space/en/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>Colour, themes and post-processing</color></link>
hint_editor_theme-ref_header: "Theme colour reference"
hint_editor_timeline-audio_body: |-
  The level's audio tracks with their waveforms, so you can line content up with what you hear

  <color=#5EC8C8><b>Tip:</b></color> <b>Fit Track</b> in the inspector resizes a track to its clip's real length. It is disabled without a clip and at speed 0

  <color=#E86A5A><b>Caution:</b></color> the inspector's <b>Volume</b> slider is the track's fader. The keyframed volume is a separate Volume track on the Local timeline, and the two multiply at playback

  More: <link="https://bullethero.space/en/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparing the track</color></link>
hint_editor_timeline-audio_header: "Audio timeline"
hint_editor_timeline-events_body: |-
  Level-wide keyframes that belong to no object:
  - camera position, rotation, zoom, pivot and shake
  - markers and checkpoints
  - the screen limit
  - background and theme
  - every post-processing effect
  - the player's visibility, control, collision, size and speed

  <color=#B48CE0><b>Worth knowing:</b></color> the <b>Beat</b> lane is the exception here. Its items carry a span, so it is the only lane Edges and Scissors act on

  <color=#5EC8C8><b>Tip:</b></color> a colour can point at the level's theme instead of holding a fixed value. Then one theme change recolours all of it

  More: <link="https://bullethero.space/en/docs/editor/craft/composition-and-camera"><color=#59A6FF>Composition and the camera</color></link>
hint_editor_timeline-events_header: "Events timeline"
hint_editor_timeline-level_body: |-
  One clip per object, and the lane it sits in is its <b>layer</b>. A clip is the object's <b>span</b>: frames 10-19 end exactly where a clip starting at 20 begins

  <color=#B48CE0><b>Worth knowing:</b></color> a child plays only inside its parent's span, but nothing is cut from what you authored. Grow the parent back and the child returns

  <color=#5EC8C8><b>Tip:</b></color> <b>Selection</b> picks and drags, <b>Edges</b> reshapes an edge, <b>Scissors</b> splits a clip at the cursor. Right-click empty space for the menu

  More: <link="https://bullethero.space/en/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>How the editor thinks</color></link>, <link="https://bullethero.space/en/docs/editor/craft/composition-and-camera"><color=#59A6FF>Composition and the camera</color></link>
hint_editor_timeline-level_header: "Level timeline"
hint_editor_timeline-local_body: |-
  Keyframes of the <b>selected object</b>, one lane per track. Frames count from the start of the object's span, so moving the object moves its whole animation with it

  <color=#B48CE0><b>Worth knowing:</b></color> an <b>empty track is valid data</b>. It uses the default value, which is why a new object animates nothing until you add a key

  More: <link="https://bullethero.space/en/docs/editor/basics/how-the-editor-thinks"><color=#59A6FF>How the editor thinks</color></link>
hint_editor_timeline-local_header: "Local timeline"
hint_editor_timeline-prefab_body: |-
  Prefab Mode's own timeline, over the <b>template's</b> objects. Its length is the template's own, not any placement's span

  <color=#E8B04B><b>Warning:</b></color> the selection is not shared with the rest of the editor. Edits here change the template and spread to every placement of it

  More: <link="https://bullethero.space/en/docs/editor/workflow/reuse"><color=#59A6FF>Reuse: prefabs, copying, generators</color></link>
hint_editor_timeline-prefab_header: "Prefab timeline"
hint_editor_value-type-color: "Where the colour comes from on every play. Value - as written. Theme - the theme's slot on that frame, so it moves when the theme does. Rnd Min-Max - every channel rolls on its own, so the colour lands anywhere between the two. Rnd A to B - one roll for all channels, so the colour always sits on the line from A to B"
hint_editor_value-type-number: "How this number is decided every time it plays. Value - the number as written. Rnd Min-Max - a number between the two bounds. Rnd Min-Max, Step - the same, snapped to a grid of that size. There is no A to B form here, because one component already draws exactly one number. A random value is addressed, not drawn, so the same level plays the same on every device, and moving an object or its layer rerolls it"
hint_editor_value-type-vector: "How this vector is decided every time it plays. Value - the numbers as written. Rnd in Rect - each axis rolls on its own between its two bounds, filling the rectangle. Rnd A to B - ONE roll, read by every axis at the same place, so the point travels the straight line from A to B. An axis holds still when it carries the same number at both ends. Rnd in Circle - a point on a disc around the centre. The Step forms snap the result to a grid. A random value is addressed, not drawn, so the same level plays the same on every device"
hint_gen_audio_waveform_body: |-
  Builds objects that trace the shape of an audio track, so the level visibly follows what is heard

  More: <link="https://bullethero.space/en/docs/editor/workflow/reuse"><color=#59A6FF>Reuse: prefabs, copying, generators</color></link>
hint_gen_audio_waveform_header: "Audio Waveform"
hint_gen_beat_flash_body: |-
  Places a flash on every beat. The beats come from the level's beat map, and from its markers when there is no map - so what flashes is exactly what you see on the grid

  More: <link="https://bullethero.space/en/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>Rhythm and structure</color></link>
hint_gen_beat_flash_header: "Beat Flash"
hint_gen_bullet_homing_body: |-
  Bullets that curve towards where the player is expected to be. The curve is authored, not computed at playback: the result stays identical on every device

  More: <link="https://bullethero.space/en/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Readability and fairness</color></link>
hint_gen_bullet_homing_header: "Homing Bullets"
hint_gen_bullet_laser_sweep_body: |-
  A beam that sweeps across the field. Its telegraph and its lethal phase are separate objects, so the warning can be drawn without being able to kill

  More: <link="https://bullethero.space/en/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Readability and fairness</color></link>
hint_gen_bullet_laser_sweep_header: "Laser Sweep"
hint_gen_bullet_rain_body: |-
  Bullets falling across an area over a stretch of time. Density and spread are parameters. Where each one lands is drawn from the level's seed, so a run is reproducible

  More: <link="https://bullethero.space/en/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Readability and fairness</color></link>
hint_gen_bullet_rain_header: "Bullet Rain"
hint_gen_bullet_spiral_body: |-
  Bullets emitted along a rotating arm, producing the classic spiral wall

  More: <link="https://bullethero.space/en/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Readability and fairness</color></link>
hint_gen_bullet_spiral_header: "Bullet Spiral"
hint_gen_bullet_wave_body: |-
  A row of bullets advancing together. The staple pattern, and the one worth reading first: its parameters name the ideas the other bullet generators reuse

  More: <link="https://bullethero.space/en/docs/editor/craft/readability-and-fairness"><color=#59A6FF>Readability and fairness</color></link>
hint_gen_bullet_wave_header: "Bullet Wave"
hint_gen_capacity_hint_body: |-
  Writes the level's advisory limits - how many objects and effects it expects to need at once

  <color=#B48CE0><b>Worth knowing:</b></color> it changes nothing you can see. The runtime uses it to reserve buffers up front instead of growing them mid-level, which is where a stutter would otherwise come from

  More: <link="https://bullethero.space/en/docs/editor/performance/level-budget"><color=#59A6FF>The level's budget</color></link>
hint_gen_capacity_hint_header: "Capacity Hint"
hint_gen_font_cache_body: |-
  Collects every character the level's text actually uses and bakes it, so no glyph has to be prepared the first time it appears

  <color=#7FC97F><b>Recommendation:</b></color> run it after the text is final. A character added later and not re-baked costs a hitch the moment it is first shown

  More: <link="https://bullethero.space/en/docs/editor/resources/images-and-fonts"><color=#59A6FF>Images and fonts</color></link>
hint_gen_font_cache_header: "Font Cache"
hint_gen_geometry_fractal_body: |-
  Repeats a shape into itself at shrinking scales. Depth costs objects exponentially, so raise it a step at a time

  More: <link="https://bullethero.space/en/docs/editor/workflow/reuse"><color=#59A6FF>Reuse: prefabs, copying, generators</color></link>
hint_gen_geometry_fractal_header: "Fractal"
hint_gen_geometry_grid_body: |-
  Fills a rectangle with evenly spaced copies of a shape

  More: <link="https://bullethero.space/en/docs/editor/workflow/reuse"><color=#59A6FF>Reuse: prefabs, copying, generators</color></link>
hint_gen_geometry_grid_header: "Grid"
hint_gen_geometry_polygon_body: |-
  Places shapes around the vertices or edges of a regular polygon

  More: <link="https://bullethero.space/en/docs/editor/workflow/reuse"><color=#59A6FF>Reuse: prefabs, copying, generators</color></link>
hint_gen_geometry_polygon_header: "Polygon"
hint_gen_geometry_radial_body: |-
  Distributes copies around a circle. The base of most symmetric patterns

  More: <link="https://bullethero.space/en/docs/editor/workflow/reuse"><color=#59A6FF>Reuse: prefabs, copying, generators</color></link>
hint_gen_geometry_radial_header: "Radial"
hint_gen_geometry_spiral_body: |-
  Distributes copies along a spiral, with radius and angle advancing together

  More: <link="https://bullethero.space/en/docs/editor/workflow/reuse"><color=#59A6FF>Reuse: prefabs, copying, generators</color></link>
hint_gen_geometry_spiral_header: "Spiral"
hint_gen_level_afterbeat_body: |-
  Converts a level from Afterbeat (formerly Project Arrhythmia) into this format

  <color=#E8B04B><b>Warning:</b></color> not everything crosses. What did not is listed in the conversion report afterwards - the level loads either way, and the report says where it differs from the original

  More: <link="https://bullethero.space/en/docs/editor/performance/afterbeat-import"><color=#59A6FF>Importing from Afterbeat</color></link>
hint_gen_level_afterbeat_header: "Import Afterbeat Level"
hint_gen_level_archive_body: |-
  Builds a level from an archive written by this game - a .tar.gz or a .zip, either optionally behind a password. The type is read from the bytes, so a renamed archive still opens. An archive from an older build is migrated on the way in

  <color=#E8B04B><b>Warning:</b></color> the imported level gets an id of its own by default, so it cannot overwrite a level already on this machine. Turn that off only to bring back a level this machine used to hold

  More: <link="https://bullethero.space/en/docs/editor/reference/generators"><color=#59A6FF>Generators</color></link>
hint_gen_level_archive_header: "Import Level Archive"
hint_gen_level_audio_file_body: |-
  Starts a level from a track: brings the audio in, sizes the level to its length and leaves you at the beginning of an empty timeline

  More: <link="https://bullethero.space/en/docs/editor/resources/preparing-the-track"><color=#59A6FF>Preparing the track</color></link>
hint_gen_level_audio_file_header: "Level From Audio File"
hint_gen_level_empty_body: |-
  Clears the level to nothing. Everything authored is removed, which is what makes it the one to reach for when starting over rather than editing

  More: <link="https://bullethero.space/en/docs/editor/basics/first-level"><color=#59A6FF>Your first level: the route</color></link>
hint_gen_level_empty_header: "Empty Level"
hint_gen_section_additional: "Refinements on top of the main parameters. Defaults here are usually fine"
hint_gen_section_main: "The parameters that decide what this generator produces. Start here"
hint_gen_test_camera_flash_body: "A development generator, kept for testing the camera event tracks. Not meant for authoring content"
hint_gen_test_camera_flash_header: "Camera Flash (test)"
hint_gen_test_form_body: "A development generator that exercises every parameter control the form can build. Not meant for authoring content"
hint_gen_test_form_header: "Form (test)"
hint_gen_test_odd_body: "A development generator holding deliberately awkward parameter cases. Not meant for authoring content"
hint_gen_test_odd_header: "Odd (test)"
hint_gen_test_partial_order_body: "A development generator that checks how fields the ordering hint does not mention are laid out. Not meant for authoring content"
hint_gen_test_partial_order_header: "Partial Order (test)"
hint_gen_test_scatter_body: "A development generator for the addressed-randomness paths. Not meant for authoring content"
hint_gen_test_scatter_header: "Scatter (test)"
hint_gen_test_sections_body: "A development generator that produces a multi-section form. Not meant for authoring content"
hint_gen_test_sections_header: "Sections (test)"
hint_gen_test_spawn_body: "A development generator for object creation paths. Not meant for authoring content"
hint_gen_test_spawn_header: "Spawn (test)"
hint_gen_texture_objects_body: |-
  Turns an image into objects, one per cell, so a picture becomes level content that can be animated like anything else

  More: <link="https://bullethero.space/en/docs/editor/resources/images-and-fonts"><color=#59A6FF>Images and fonts</color></link>
hint_gen_texture_objects_header: "Texture Objects"
hint_level-preview_authors: "Everyone credited on this level. Authorship travels inside the level folder, so it survives being zipped, sent on and re-uploaded by someone else"
hint_level-preview_licenses_body: |-
  The terms this level and its resources come under. <b>Conditions are recorded per resource</b>, so a level made of borrowed parts says exactly what was borrowed and under what terms

  <color=#7FC97F><b>Recommendation:</b></color> read them before reusing anything from someone else's level

  More: <link="https://bullethero.space/en/docs/editor/rights/licensing-basics"><color=#59A6FF>Licensing: the whole thing in three minutes</color></link>
hint_level-preview_licenses_header: "Licences"
hint_level_backups: "Every automatic copy of this level, newest first - the name is the moment it was taken. Nothing here is read until you pick one. Restoring replaces the level file on disk and reloads it, and the file it replaces is written to backups first, so a restore can itself be undone"
hint_level_core-framerate: "Changing this directly speeds every object up or down: keyframes keep their frame numbers, so the same level plays at a different speed. Use the generator to remap the content onto another framerate"
hint_level_core-level-id: "This level's permanent identifier, generated once when it was created and never edited. Quote it when reporting a problem with the level, and use it to tell two copies of the same level apart"
hint_level_core-orientation_body: |-
  Which way round this level is meant to be held

  <b>Horizontal</b> and <b>Vertical</b> turn the player's device for the level and outrank the player's own setting. On desktop a vertical level plays inside side bars, and that is how it should look

  <b>Not Specified</b> leaves the choice to the player, and it is a <b>claim</b> that the level reads correctly in <b>both</b> orientations. Nothing is reframed or scaled for it, so check the level both ways first

  More: <link="https://bullethero.space/en/docs/editor/reference/level-settings"><color=#59A6FF>Level settings</color></link>
hint_level_core-orientation_header: "Level Orientation"
hint_level_core-runtime-seed: "What this editor session is actually playing on right now. With no seed above it is a fresh number on every level load. Regenerate rolls another one without touching the level"
hint_level_core-seed: "Every random value in this level is drawn from this seed plus each object's own layer and start frame, so the same seed always plays the same. 0 means no seed: the game generates a new one on every launch"
hint_level_core_body: |-
  Frame length, framerate and the level's two seeds

  <color=#B48CE0><b>Worth knowing:</b></color> <b>frames count from 1.</b> A level of N frames holds frames 1 to N, and N+1 is the end boundary, not a frame

  <b>Level Seed</b> is the level's own and can be undone. 0 means "a new seed every run" and is the default

  <color=#5EC8C8><b>Tip:</b></color> <b>Runtime Seed</b> shows what this editor session resolved. <i>Regenerate</i> rolls a new one for the session only - nothing is written and nothing goes into undo

  More: <link="https://bullethero.space/en/docs/editor/basics/frames-and-time"><color=#59A6FF>Frames, time and the length of a level</color></link>
hint_level_core_header: "Core"
hint_level_dangerous_body: |-
  Actions that destroy or rewrite files rather than content

  <color=#E86A5A><b>Caution:</b></color> the <b>file format</b> dropdowns rewrite the level and its metadata on disk. Rewriting in another format <b>deletes the file the old one left behind</b>. Nothing else happens: no reload, no resimulation, no reset of your selection or undo stack, because the model in memory is already exactly what gets written

  <color=#E86A5A><b>Caution:</b></color> <b>Delete</b> removes the level's folder from disk. There is no undo for that one

  More: <link="https://bullethero.space/en/docs/editor/workflow/not-losing-work"><color=#59A6FF>Not losing your work</color></link>
hint_level_dangerous_header: "Dangerous Zone"
hint_level_effect-editor_body: |-
  Author a particle effect and preview it on the canvas

  <color=#B48CE0><b>Worth knowing:</b></color> the parameter groups are the same ones the Effect inspector shows, edited here as a <b>draft</b>: nothing reaches the level until you save

  <color=#5EC8C8><b>Tip:</b></color> save to the device-wide library to reuse the effect across levels

  More: <link="https://bullethero.space/en/docs/editor/performance/level-budget"><color=#59A6FF>The level's budget</color></link>
hint_level_effect-editor_header: "Effect editor"
hint_level_font-cache: "Which glyphs the level pre-bakes, so text does not stall the first time a character appears - per font and per language. Read-only: the font-cache generator fills it from the text the level actually contains, and nothing on this tab edits it"
hint_level_history_body: |-
  Every edit this session is a row here, newest at the top, like a git log. The leftmost column is the main line, a column of its own is a branch you left by undoing and going another way. The ring marks where you are, the green circle the last save

  Clicking a row walks the level back to that exact state, one operation per frame. The history lives in this session only and is never written to disk

  <color=#E8B04B><b>Warning:</b></color> the editor is read-only while a walk runs. Cancel stops it where it is, and that is always a real state

  More: <link="https://bullethero.space/en/docs/editor/reference/level-settings"><color=#59A6FF>Level settings</color></link>
hint_level_history_header: "History"
hint_level_library-browser_body: |-
  Resources saved on <b>this device</b>, shared by every level you open here

  <color=#B48CE0><b>Worth knowing:</b></color> importing copies the resource <i>into the level</i>. A level carries everything it needs, so the library is a convenience for you, never a dependency for whoever plays your level

  More: <link="https://bullethero.space/en/docs/editor/workflow/reuse"><color=#59A6FF>Reuse: prefabs, copying, generators</color></link>
hint_level_library-browser_header: "Library"
hint_level_metadata-logo: "Copied into the level folder as <color=#D4B483>logo.png</color> and shown wherever the level is listed. It is built for a square <color=#D4B483>512x512</color> <color=#D4B483>PNG</color> - smaller goes soft in the browser, larger only costs space. Remove only clears the reference - the file itself stays in the folder"
hint_level_metadata-tags_body: |-
  Tags are your own words, shown exactly as you write them and never translated. A player filters by them in the level browser, so a tag only helps if other levels use it too

  Comma-separated. Keep them short and general: a genre, a mood, a mechanic

  More: <link="https://bullethero.space/en/docs/editor/reference/level-settings"><color=#59A6FF>Level settings</color></link>
hint_level_metadata-tags_header: "Level Tags"
hint_level_metadata_body: |-
  Everything about the level that is not the level: name, description, logo, licence, age rating and authors

  <color=#B48CE0><b>Worth knowing:</b></color> name and description are <b>localized strings</b> - you author the text per language inline, with no keys involved, because a level is content rather than part of the game's interface. A player whose language you did not author falls back to the first entry you did

  Licence and authors travel with the level wherever it is shared, which is what makes credit survive a re-upload

  More: <link="https://bullethero.space/en/docs/editor/reference/metadata-and-sharing"><color=#59A6FF>Metadata and sharing a level</color></link>
hint_level_metadata_header: "Metadata"
hint_level_play-seed: "0 = use the level's own seed, or a new one each run"
hint_level_play_body: |-
  <color=#B48CE0><b>Worth knowing:</b></color> launch options for <b>this run only</b> - nothing here is saved into the level

  <color=#5EC8C8><b>Tip:</b></color> lives, speed, checkpoints and auto-level let you rehearse a section without editing it. The <b>seed</b> here outranks the level's own: it is the top of the three tiers, and it is the one to use when you want to replay the exact run you just saw

  More: <link="https://bullethero.space/en/docs/editor/craft/difficulty-curve"><color=#59A6FF>Difficulty and the curve</color></link>
hint_level_play_header: "Play"
hint_level_raw-add: "Adds one element to the slot you opened this from. Only the new element's own leaf fields are offered here. Anything nested keeps its default and is edited in the tree afterwards"
hint_level_raw_body: |-
  The whole saved level model as one tree of fields - the file itself, before the editor processes it

  <color=#E86A5A><b>Caution:</b></color> <b>nothing here is validated.</b> It will write a value the rest of the editor considers impossible, so keep a copy of the level folder at hand

  A filled dot means you changed a field this session, a hollow one means something inside it changed. <b>Apply</b> commits the whole session as one operation you can undo

  More: <link="https://bullethero.space/en/docs/editor/workflow/not-losing-work"><color=#59A6FF>Not losing your work</color></link>
hint_level_raw_header: "Raw Data"
hint_level_resource-meta_body: |-
  Title, description, sources, licence and authors for one resource

  <color=#B48CE0><b>Worth knowing:</b></color> this is how attribution survives: a texture, font or audio file taken from somewhere carries where it came from and under what terms, inside the level, wherever the level goes

  <color=#7FC97F><b>Recommendation:</b></color> fill it in when you add the resource - that is the only moment you still remember

  More: <link="https://bullethero.space/en/docs/editor/rights/resource-record"><color=#59A6FF>A resource's record</color></link>
hint_level_resource-meta_header: "Resource metadata"
hint_level_resources-audios: "Audio files this level carries. Add one here first, then place it as a track on the Audio timeline"
hint_level_resources-effects_body: |-
  <color=#D4B483>VFX Graph</color> particle effects the level can place. They are <b>optional</b>: a level that never uses one plays exactly as designed

  An effect uses the level's seeded randomness, so it replays the same on any device. Effects can be exported to the device-wide library

  More: <link="https://bullethero.space/en/docs/editor/performance/level-budget"><color=#59A6FF>The level's budget</color></link>
hint_level_resources-effects_header: "Effects"
hint_level_resources-fonts: "Fonts this level carries, for its Text objects. Like every other resource, a font lives beside the level and travels with it"
hint_level_resources-prefabs_body: |-
  Reusable groups of objects. A prefab holds template objects, and each placement gets real copies of them. Editing the template reaches every placement, and one placement can still differ through per-instance overrides

  <color=#E8B04B><b>Warning:</b></color> prefabs have <b>no game-defined presets</b>, unlike themes, effects and colliders - the device-wide library is the only way to move a prefab between levels

  More: <link="https://bullethero.space/en/docs/editor/workflow/reuse"><color=#59A6FF>Reuse: prefabs, copying, generators</color></link>
hint_level_resources-prefabs_header: "Prefabs"
hint_level_resources-shapes_body: |-
  The level's own shapes, on top of the ~500 the game generates. A shape is <b>real geometry</b> fitted to its bounding box, so the object's rect is exactly what it draws

  <color=#5EC8C8><b>Tip:</b></color> a shape and a collider are the same kind of data, and an object points at one for what is drawn and at the other for what is hit. Neither derives from the other, so a harmless telegraph beam or an invisible wall is ordinary content

  More: <link="https://bullethero.space/en/docs/editor/resources/level-needs"><color=#59A6FF>What a level needs</color></link>
hint_level_resources-shapes_header: "Shapes"
hint_level_resources-textures_body: |-
  Images this level carries. <b>The game itself ships no textures</b> - every texture a level uses is added here and lives in the level folder, so it travels with the level

  <color=#B48CE0><b>Worth knowing:</b></color> shapes are <b>not</b> textures. They are real geometry and need nothing from this tab

  More: <link="https://bullethero.space/en/docs/editor/resources/images-and-fonts"><color=#59A6FF>Images and fonts</color></link>
hint_level_resources-textures_header: "Textures"
hint_level_resources-themes_body: |-
  A theme is a <b>palette the level's colours can point at</b> instead of holding literal values. Switching the active theme restyles everything that points at it, and the switch is keyed on the Events timeline

  <color=#5EC8C8><b>Tip:</b></color> export a theme to the device-wide library to reuse it in other levels

  More: <link="https://bullethero.space/en/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>Colour, themes and post-processing</color></link>
hint_level_resources-themes_header: "Themes"
hint_level_rules_body: |-
  What validation found in this level: broken references, duplicate ids, parent cycles, prefabs nested too deep, overlapping beat segments

  Some findings can be repaired, one at a time or with <b>Fix All</b>. Repairs land on a draft: <b>Save</b> applies them as one operation you can undo, <b>Discard</b> drops them. Graph findings (ids, parents, prefab nesting) carry no repair - those are content decisions only you can make

  <color=#5EC8C8><b>Tip:</b></color> a child overhanging its parent's span is <b>not</b> reported. To fit lifetimes, run the <color=#D4B483>Span Fit</color> modifier from Generators

  More: <link="https://bullethero.space/en/docs/editor/workflow/not-losing-work"><color=#59A6FF>Not losing your work</color></link>
hint_level_rules_header: "Rules"
hint_level_shape-editor_body: |-
  Build a shape from points and the edges between them. <b>Triangles are derived, never edited</b>, so a corner shared by three triangles is one point to drag

  <color=#E8B04B><b>Warning:</b></color> the format stores triangles, not edges - an edge that closes no loop is dropped on save, and the editor reports it

  More: <link="https://bullethero.space/en/docs/editor/resources/images-and-fonts"><color=#59A6FF>Images and fonts</color></link>
hint_level_shape-editor_header: "Shape editor"
hint_level_theme-editor_body: |-
  The slots a theme provides and the colours filling them

  <color=#E86A5A><b>Caution:</b></color> slots are what level content points at, so <b>renumbering them restyles everything that references them</b> - a slot's position is its identity

  <color=#5EC8C8><b>Tip:</b></color> save a finished theme to the device-wide library to reuse it in other levels

  More: <link="https://bullethero.space/en/docs/editor/craft/color-and-postprocessing"><color=#59A6FF>Colour, themes and post-processing</color></link>
hint_level_theme-editor_header: "Theme editor"
hint_menu_level-authors: "Who made this level, as its own metadata lists them. The Authors button opens the full list with links"
hint_menu_level-bot_body: |-
  <b>A bot plays the level for you, with your own controls.</b> It walks, dashes, takes damage and dies like you would, and it cannot cheat: the same speed, the same dash, the same hitbox

  <b>It is not a guarantee that the level gets cleared.</b> A bot never gets tired, but it still loses. It also costs performance on every frame, so expect a lower framerate on a weak device

  A level that beats a bot is worth sending in: open an issue in <link="https://github.com/bullet-hero/releases/issues"><color=#59A6FF>bullet-hero/releases</color></link>, say which bot lost and where, and attach the level folder

  More: <link="https://bullethero.space/en/docs/editor/workflow/bot-playtest"><color=#59A6FF>Letting a bot play your level</color></link>
hint_menu_level-bot_header: "Bots"
hint_menu_level-identity: "Which level this actually is: the source it was found in, the id its statistics are filed under, and the folder holding it when that folder is not named by the id. A built-in level and a copy you made of it share every other fact on this screen and differ in these"
hint_menu_level-lives: "How many hits the run survives. Zen never ends the run, and Custom takes any count the slider reaches"
hint_menu_level-music: "Who wrote the music, as the level's own metadata records it. The Licenses button holds every other resource the level carries"
hint_menu_level-rating: "The age rating the author declared. The developers do not check it - a level carries whatever its author wrote"
hint_menu_level-record: "Your own history with this level, for the launch options currently selected on the right. Change the lives, the speed, the checkpoints or the bot and the record changes with them: a run under different conditions is a different achievement, so each set keeps its own best. Attempts and clears count every run whatever the settings"
hint_menu_level-seed: "The number every random value in the level is drawn from. The same seed plays the same run on any device, and 0 means the level rolls a fresh one each time"
hint_menu_level-speed: "How fast the level and its music play. Custom takes any speed the slider reaches, not only the three presets"
hint_mod_content_remover_body: |-
  Deletes level content matching what you select here

  <color=#E86A5A><b>Caution:</b></color> it rewrites what already exists rather than adding to it, so read the parameters before running: the undo step is one, but it is the only way back

  More: <link="https://bullethero.space/en/docs/editor/workflow/reuse"><color=#59A6FF>Reuse: prefabs, copying, generators</color></link>
hint_mod_content_remover_header: "Remove Content"
hint_mod_framerate_remap_body: |-
  Rescales every frame number in the level to a different framerate, so timings land in the same place in seconds as before

  <color=#E8B04B><b>Warning:</b></color> frames are whole numbers, so anything that does not divide evenly is rounded - a level remapped twice is not guaranteed to return to where it started

  More: <link="https://bullethero.space/en/docs/editor/basics/frames-and-time"><color=#59A6FF>Frames, time and the length of a level</color></link>
hint_mod_framerate_remap_header: "Remap Framerate"
hint_mod_prefab_flatten_body: |-
  Turns every prefab placement in this scope into ordinary objects. The link to the template goes, the objects stay exactly where they were

  <color=#B48CE0><b>Worth knowing:</b></color> the level looks the same afterwards - nothing is deleted or moved, and per-placement overrides are already written onto the objects. The templates stay in the level unless you ask for them to be removed

  More: <link="https://bullethero.space/en/docs/editor/reference/modifiers"><color=#59A6FF>Modifiers</color></link>
hint_mod_prefab_flatten_header: "Flatten Prefabs"
hint_mod_quantize_keyframes_body: |-
  Snaps keyframes onto a regular step, which is how loose hand-placed animation is pulled onto the beat

  <color=#E8B04B><b>Warning:</b></color> two keyframes landing on the same frame collapse into one, so quantizing coarsely loses detail rather than compressing it

  More: <link="https://bullethero.space/en/docs/editor/craft/rhythm-and-structure"><color=#59A6FF>Rhythm and structure</color></link>
hint_mod_quantize_keyframes_header: "Quantize Keyframes"
hint_mod_span_fit_body: |-
  Makes child lifetimes fit inside their parents', either by clamping the children in or by expanding the parents out

  <color=#B48CE0><b>Worth knowing:</b></color> an overhanging child is legal data that simply plays clipped, so this is a content decision rather than a repair - which is why nothing runs it for you. Anchors are left untouched either way

  More: <link="https://bullethero.space/en/docs/editor/basics/frames-and-time"><color=#59A6FF>Frames, time and the length of a level</color></link>
hint_mod_span_fit_header: "Fit Spans"
hint_mod_span_stagger_body: |-
  Offsets a selection in time so objects that started together arrive one after another

  More: <link="https://bullethero.space/en/docs/editor/workflow/reuse"><color=#59A6FF>Reuse: prefabs, copying, generators</color></link>
hint_mod_span_stagger_header: "Stagger"
hint_mod_test_rename_body: "A development generator for the renaming paths. Not meant for authoring content"
hint_mod_test_rename_header: "Rename (test)"
hint_settings_audio: "Master volume, what a level plays in the game and in the editor, and the interface's own sounds outside and inside the level editor"
hint_settings_audio-editor-game: "Volume of what a level plays inside the editor - the same level through the same path, listened to for hours instead of once, so the game's own volume is left where it is"
hint_settings_audio-editor-ui: "Volume of the level editor's own sounds. It only ever says what an edit resulted in - a save, a refusal, an undo, a deletion - never the ordinary press"
hint_settings_audio-game: "Volume of what a level plays - its music and its sounds"
hint_settings_audio-ui: "Volume of the interface outside the level editor: menus, browsers, settings"
hint_settings_audio-volume: "Master volume. Everything else is scaled by it"
hint_settings_controls_body: |-
  How you steer the player, per device kind - keyboard and mouse, touchscreen, gamepad and device gyro

  <color=#B48CE0><b>Worth knowing:</b></color> several kinds can be active at once and the <b>priority</b> list decides which one wins when two are, which matters on a laptop with a controller plugged in

  <color=#5EC8C8><b>Tip:</b></color> the summary at the top shows what is active <i>right now</i>, so a control scheme that seems to do nothing is usually one that lost the priority race

  More: <link="https://bullethero.space/en/docs/editor/workflow/speed-and-shortcuts"><color=#59A6FF>Speed and shortcuts</color></link>
hint_settings_controls_header: "Controls"
hint_settings_game-editor-autosave: "Write a copy of the level on a timer. It never overwrites your saved level - the copies are a safety net, not a save"
hint_settings_game-editor-autosave-rate: "Seconds between automatic copies"
hint_settings_game-editor-camera-invert: "Whether dragging moves the level with the pointer or moves the camera instead. Both feel right to somebody"
hint_settings_game-editor-camera-max-size: "How far the editor viewport may zoom out"
hint_settings_game-editor-camera-min-size: "How far the editor viewport may zoom in"
hint_settings_game-editor-camera-sensitivity-x: "How far the view travels horizontally per unit of pointer movement"
hint_settings_game-editor-camera-sensitivity-y: "How far the view travels vertically per unit of pointer movement"
hint_settings_game-editor-camera-wheel-multiplier: "How much one notch of the wheel zooms"
hint_settings_game-editor-camera-zoom-to-mouse: "Zoom towards the cursor instead of the middle of the viewport. Off keeps the centre still while you zoom"
hint_settings_game-editor-create-shape-size-x: "Width a new shape starts at, before any scale of its own"
hint_settings_game-editor-create-shape-size-y: "Height a new shape starts at, before any scale of its own"
hint_settings_game-editor-create-text-size-x: "Width of the block a new text lays its glyphs out in, not the size of the glyphs"
hint_settings_game-editor-create-text-size-y: "Height of the block a new text lays its glyphs out in, about one line per unit"
hint_settings_game-editor-effects-active-default: "Whether the level's post-processing effects are previewed when the editor opens. Only the starting state - switching them off while working never changes it. A phone starts with them off, since post-processing is the most expensive thing the editor draws"
hint_settings_game-editor-gizmos-scale: "How big the viewport drag handles are drawn. A handle sized for a mouse is hard to hit with a thumb"
hint_settings_game-editor-grid-active-default: "Whether the viewport grid is already on when the editor opens. Only the starting state - switching the grid off while working never changes it"
hint_settings_game-editor-grid-opacity: "How visible the grid is. A grid too faint to read is not drawn at all"
hint_settings_game-editor-grid-size: "The spacing of the viewport grid, in level units"
hint_settings_game-editor-history-length: "How many editing steps the session keeps before the oldest branch is dropped. More costs memory and nothing else"
hint_settings_game-editor-history-objects: "Objects the history keeps on top of that step count. One mass delete is a single step holding 50 000 of them, and that is what this catches. 0 removes the limit, below 0 lets the device decide"
hint_settings_game-editor-interface-dirty-field-delay: "How long an inspector field waits after your last keystroke before it commits. Zero commits every keystroke, and makes every one of them undoable"
hint_settings_game-editor-interface-log-clamps: "Report it in the console when a value you typed was pulled back into its allowed range. The clamp happens either way"
hint_settings_game-editor-interface-rotation-unit: "The unit rotation fields are shown and typed in. Angles are always stored in radians either way"
hint_settings_game-editor-level-serialize-mode: "The file format a level is written in. <b><color=#D4B483>Json</color></b> is text - readable and repairable by hand. <b><color=#D4B483>Blob</color></b> is binary - dozens of times faster to load, and almost unrepairable once damaged"
hint_settings_game-editor-max-autosave-files: "How many copies are kept. The oldest is dropped when the limit is reached"
hint_settings_game-editor-multi-select-requires-hold: "Whether adding to a selection needs a deliberate hold. On is safer on touch, where a stray tap otherwise changes what is selected"
hint_settings_game-editor-pick-invisible-aabb: "Let a click select an object that draws nothing. Needed for invisible walls, which have a hitbox and no shape"
hint_settings_game-editor-player-active-default: "Whether the test player is already there when the editor opens. On touch it also takes the viewport, so a phone usually wants this off"
hint_settings_game-editor-player-bot: "Hands the preview player over to <color=#D4B483>Reflex Bot v1</color> instead of to you. It is the only bot offered here, because it needs nothing prepared in advance and keeps working while you edit - at any playback speed, backwards included. It plays by the same rules you do: it takes damage and it can be cornered. Right after a scrub it plays worse for a moment while it rebuilds what it knows about the future. Choosing between bots belongs to a run, on the Play tab of this screen"
hint_settings_game-editor-player-bot-debug: "The master switch for the bot's diagnostic overlays. Off by default. Everything under it is on, so opening this shows the whole picture at once"
hint_settings_game-editor-player-bot-debug-grid: "Draws how much room the bot believes each part of the screen has, worst case over everything it can see ahead. Red is a place it expects to be hit. Nothing is drawn where it considers itself safe"
hint_settings_game-editor-player-bot-debug-reach: "Draws how far the bot believes it can get before the end of the window it plans over - the inner ring by walking, the outer one by spending the dash. It never picks a target outside them"
hint_settings_game-editor-player-bot-debug-target: "Draws the point the bot is currently heading for. It sticks to a choice until a clearly better one appears, so a target that stops moving is the bot being satisfied rather than stuck"
hint_settings_game-editor-player-reset-gizmos: "Drop the active gizmo mode when the test player is switched on, so a drag handle is not left under your finger"
hint_settings_game-editor-preview-collider-on-select: "Show a selected object's hitbox. What is drawn and what is hit are separate things here, so they can differ"
hint_settings_game-editor-resources-serialize-mode: "The same choice for the resources a level carries"
hint_settings_game-editor-selection-collider-opacity: "How solid a selected object's hitbox is drawn"
hint_settings_game-editor-selection-collider-opacity-view: "The same, for the view that shows every hitbox at once - fainter, because hundreds of them overlap there"
hint_settings_game-editor-selection-long-press-delay: "How long a row or clip must be held before it enters multi-select. Raise it if selections happen by accident"
hint_settings_game-editor-selection-long-press-threshold: "How far the pointer may drift during that hold before it counts as a drag instead. Raise it for an unsteady hand"
hint_settings_game-editor-timeline-edge-handle: "The width of a clip's edge that resizes it. The rest of the clip slides instead"
hint_settings_game-editor-timeline-loop-global: "Whether the playhead wraps at the end of the level instead of stopping"
hint_settings_game-editor-timeline-loop-local: "The same for the local timeline, which repeats one object's own lifetime"
hint_settings_game-editor-timeline-snap-threshold: "How close a dragged edge must land before it snaps onto a candidate frame"
hint_settings_game-editor-timeline-time-format: "What a timeline ruler and the playhead readout count in. It changes nothing in the level - the same frame is addressed either way. Bars & Beats reads the level's own beat grid and falls back to a timecode wherever the grid has no segment"
hint_settings_game-editor_body: |-
  <b>Autosave</b> saves the level on a timer and writes a backup copy each time. <b>Max Autosave Files</b> caps how many copies are kept

  <b>Camera Min Size</b> and <b>Camera Max Size</b> cap the viewport zoom. <b>Multi Select Requires Hold</b> and <b>Pick Invisible AABB</b> change what a click in the viewport means

  The two <b>Serialize Mode</b> fields set the default format for writing to disk

  More: <link="https://bullethero.space/en/docs/editor/workflow/speed-and-shortcuts"><color=#59A6FF>Speed and shortcuts</color></link>
hint_settings_game-editor_header: "Game Editor"
hint_settings_general: "Language, and how many resources the game loads at once. <b>Language</b> left empty follows the device"
hint_settings_general-language: "Interface language. Left empty it follows the device. It does not affect a level's own text, which the level carries itself"
hint_settings_general-resource-parallel-load-count: "How many of a level's files load at once. Higher finishes sooner on a fast disk and can stutter on a slow one"
hint_settings_general-resource-web-timeout: "How long to wait for a file fetched over the network before giving up, in seconds"
hint_settings_general-show-all-found-content: "Also list content a source found but cannot confirm is yours - the files of an unsubscribed workshop item, or a folder copied in by hand. Such levels are marked on their card. Off, a source lists only what it vouches for"
hint_settings_graphics-antialiasing-hdr: "Colour values above 1. Nothing here needs them, and it doubles the memory bandwidth, so it ships off"
hint_settings_graphics-antialiasing-msaa: "How many samples <color=#D4B483>MSAA</color> takes per pixel. More is smoother and costs more, and the cost grows with how much transparent content overlaps"
hint_settings_graphics-antialiasing-type: "How edges are smoothed. <b><color=#D4B483>MSAA</color></b> resolves them exactly, because every shape here is real geometry. <b><color=#D4B483>FXAA</color></b> costs one pass whatever the scene does, which is the trade a weak phone faces"
hint_settings_graphics-audio-pitch-correction: "How hard the audio speed is bent to catch up with the simulation. Higher corrects sooner and is easier to hear"
hint_settings_graphics-audio-render: "Draw the audio waveform in the editor's timeline. Turning it off saves work on long tracks"
hint_settings_graphics-audio-render-effects: "Apply the track's audio effects while editing. Off means you hear the raw clip"
hint_settings_graphics-audio-resync-jump-time: "How far audio and simulation may drift apart before the audio is jumped back into place instead of nudged"
hint_settings_graphics-audio-scrub-time: "How long a fragment is heard when you drag the playhead across the track"
hint_settings_graphics-audio-sync-dead-zone: "Drift smaller than this is ignored. Without a dead zone the audio would be corrected constantly and audibly"
hint_settings_graphics-audio-use-scrub: "Play the audio under the playhead while dragging it, so you can find a moment by ear"
hint_settings_graphics-avatar-render: "The avatar's body is a grid of 64 squares, and losing health takes them away from the rim inwards along a few tears - so a run going badly is something you see on the player rather than on a bar. The hitbox ring underneath is what shows through the holes. Off, the grid becomes one square and health fades it instead: same reading, one object rather than 64, for a device that would rather not draw them"
hint_settings_graphics-effects-fixed-framerate: "The rate effects are simulated at, independent of how often they are drawn"
hint_settings_graphics-effects-frame-step-budget: "How many effect steps a single frame may spend, so catching up never costs a visible stall"
hint_settings_graphics-effects-framerate-target: "How often effects are drawn. Lower than the game's own rate is a cheap saving, because particles read fine at a coarser step"
hint_settings_graphics-effects-max-scrub-time: "How much effect history the editor will replay when you jump the playhead. Longer is more accurate and slower"
hint_settings_graphics-effects-render: "Draw particle effects at all. They enrich a level but no level depends on them, so this is a safe thing to give up"
hint_settings_graphics-effects-replay-step-budget: "How many simulation steps one replay may spend. The cap is what stops a jump into a dense section from freezing the editor"
hint_settings_graphics-fixed-framerate: "The cap the game holds while Framerate Target is Fixed - how often the screen is redrawn, and nothing else. A level is simulated against real time, so the same run plays identically at 30 and at 144. Ignored while VSync is on"
hint_settings_graphics-framerate-target: "Frames per second the game aims for. Applied directly rather than through vertical sync"
hint_settings_graphics-postprocessing-render: "The master switch for every camera effect below. Off skips the whole stack"
hint_settings_graphics-postprocessing-render-analog-glitch: "Analogue interference: rolling bands, torn scanlines, colour bleed"
hint_settings_graphics-postprocessing-render-bloom: "Bright areas bleed light into what surrounds them"
hint_settings_graphics-postprocessing-render-chroma: "Colour channels separate towards the edges of the screen, like a cheap lens"
hint_settings_graphics-postprocessing-render-color-curves: "Per-channel colour curves, for fine grading"
hint_settings_graphics-postprocessing-render-digital-glitch: "Digital corruption: displaced blocks, as if frames were damaged"
hint_settings_graphics-postprocessing-render-grain: "Film grain over the picture"
hint_settings_graphics-postprocessing-render-lens: "The picture is bent as a real lens would bend it"
hint_settings_graphics-postprocessing-render-lift-gamma-gain: "Grading split three ways: shadows, midtones and highlights"
hint_settings_graphics-postprocessing-render-motion-blur: "Fast movement smears. Worth turning off if it makes bullets harder to read"
hint_settings_graphics-postprocessing-render-shadows-midtones-highlights: "The same three zones again, tinted separately rather than lifted"
hint_settings_graphics-postprocessing-render-vignette: "The edges of the screen darken, pulling attention to the middle"
hint_settings_graphics-postprocessing-render-white-balance: "Shifts what counts as white, warming or cooling the whole picture"
hint_settings_graphics-render-scale: |-
  How many pixels the game itself renders before the result is scaled to the window

  Below 1 the game draws fewer pixels and stretches them up - the single most effective thing to turn down on a weak machine, because fragment cost falls with the <b>square</b> of it. Above 1 it renders larger and shrinks the result, which is supersampling

  The interface is drawn into its own full-size target either way, so text and buttons stay sharp whatever this is set to. The number multiplies the scale this device class already ships with rather than replacing it
hint_settings_graphics-resolution: |-
  The size of the game window in pixels, offered from the modes this display actually reports - so nothing here can ask for a mode the monitor cannot show

  It is also the desktop way to change orientation: a resolution taller than it is wide puts the interface into the same vertical layout a phone stood upright gets. A monitor cannot be turned from inside the game, so this and the window size are the only levers there are

  Left alone, the display own resolution is used
hint_settings_graphics-textures-compression: "Packs images into a <color=#D4B483>compressed</color> format at load. Four to eight times less memory, and block artefacts where a gradient or a hard edge meets a 4x4 block. Read when a level loads, not while one is open"
hint_settings_graphics-textures-compression-quality: "Loading time against compression artefacts. The image ends up the same size either way, and phones ignore it entirely"
hint_settings_graphics-textures-filtering: "How images are sampled when drawn, and nothing else - scaling an image down is decided by what its author said it is, not by this"
hint_settings_graphics-textures-mipmaps: "Reduced copies of each image, so one drawn small stops shimmering as it moves. A third more memory, and the only cure for that shimmer"
hint_settings_graphics-textures-size-limit: "The cap on how large an image may be in memory here. Memory falls with the SQUARE of the side, so this saves more than compression, and it is the only one of the three that bounds what a level can cost at all"
hint_settings_graphics-vsync: |-
  Whether the game waits for the display's refresh before showing a frame

  <b>Off</b> shows each frame as soon as it is ready. Nothing waits, so input reaches the screen at the first opportunity - and a frame finished mid-refresh is drawn half over the previous one, which is tearing

  <b>On</b> presents once per refresh, so tearing is gone and every frame costs up to one refresh of extra latency. <b>Half rate</b> presents once per second refresh - steadier on a machine that cannot hold the full rate, at twice that latency

  While this is not Off, Unity ignores the framerate cap above it entirely, so those two rows are greyed out

  A phone presents on its own schedule and this does nothing there
hint_settings_graphics-window-mode: |-
  How the game window occupies the display

  <b>Windowed</b> is the one mode you can resize freely, and resizing is what changes the game aspect - drag the window taller than it is wide and the whole interface moves to its vertical layout, exactly as a phone stood upright would

  <b>Borderless Window</b> is the default: the display filled, with no mode switch and instant alt-tab. <b>Exclusive Fullscreen</b> hands the display to the game outright, which is marginally faster and slower to leave

  A phone has one window and it is the screen, so this does nothing there
hint_settings_graphics_body: |-
  <b>Anti-aliasing.</b> <color=#D4B483>MSAA</color> is the default because every shape in this game is real geometry, so every edge that aliases is a real geometric edge - the one case multisampling resolves exactly, at full sharpness, on every platform. <b><color=#D4B483>FXAA</color></b> is the alternative for weaker phones: it costs one full-screen pass no matter how much the level overdraws, while <color=#D4B483>MSAA</color>'s cost grows with transparent overdraw. <b>TAA is deliberately not offered</b> - ghosting behind fast bullets is a readability problem in this genre, and its jitter fights the glitch effects

  <b>Framerate.</b> The target is applied manually rather than through vsync. Fixed framerate decouples simulation from display, which is what keeps a level's timing identical on a 60 Hz and a 144 Hz screen

  <color=#7FC97F><b>Recommendation:</b></color> <b>Render scale</b> below 1 is the cheapest thing to give up when a device struggles: it costs sharpness and nothing else

  More: <link="https://bullethero.space/en/docs/editor/performance/mobile-devices"><color=#59A6FF>Mobile devices</color></link>
hint_settings_graphics_header: "Graphics"
hint_settings_interface: "The statistics overlay and where it sits. It draws over every screen and is meant for diagnosing performance, not for playing with"
hint_settings_interface-alert-on-exception: "Whether an uncaught error raises the report window. The report is built, logged and kept either way - what this decides is only whether you are interrupted by it, which matters most of all mid-run. With it off, the last report is still in the player log and under <b>Save Report</b> in the reports folder"
hint_settings_interface-hitbox-ring-opacity: "The ring of dots on the avatar sits exactly on its collision radius, which is 0.4 across a body drawn 1 wide - the silhouette never was the hitbox and now you can see where it really is. The same ring counts lives: a lit dot is a life still in hand, a dim one is a life you spent. This slider is only how visible it is over whatever the level draws, and 0 turns it off completely - levels are balanced for someone who can see it"
hint_settings_interface-menu-background: "What the menu plays behind its buttons. Bot is a real arena - the same reflex bot a run can be handed to, dodging hazards emitted as you sit there, and it can be hit without anything happening. Shapes is the older field of rotating shapes and the heaviest of the three. None draws nothing at all"
hint_settings_interface-open-menu-on-lose: "What a lost run does. Off, the level eases to a stop, rewinds to the last checkpoint reached and eases back up, with no window in the way. On, playback stops and the result window opens"
hint_settings_interface-screen-orientation: |-
  <b>Horizontal</b> and <b>Vertical</b> lock an <b>axis</b>, never a side - turn the device over and the picture turns with it, so either way up plays

  <b>Auto-Rotate</b> is no lock at all: the screen follows the device. With a level that states no orientation of its own, you can turn the phone in the middle of a run and the interface and the camera both follow

  A level can override this while it plays. Its author composed the content for a frame of a particular shape, so that choice wins for as long as the level is running, and leaving it gives the setting back

  On desktop nothing rotates a monitor, so the control is disabled and simply reports the shape of your window - resize it and this follows
hint_settings_interface-show-game-interface: "The master switch over the two above, and over the on-screen touch controls with them. Off, the game screen draws nothing at all - which is what a clean recording or a screenshot wants. Nothing stops working: every control stays exactly where it was and still takes a press"
hint_settings_interface-show-game-pause: "Whether the pause glyph is drawn. It is hidden, not removed: the same corner still takes a press, and Escape or a gamepad Back opens the pause window whatever this says"
hint_settings_interface-show-game-progress: "Whether the run's progress bar is drawn along the bottom of the game screen. Hiding it changes nothing else - the checkpoints it marks go on working"
hint_settings_interface-stats-active: "Show the diagnostics readout over every screen. It is for measuring performance, not for playing with"
hint_settings_interface-stats-alignment-x: "Where the readout sits horizontally: 0 is the left edge, 1 the right"
hint_settings_interface-stats-alignment-y: "Where the readout sits vertically: 0 is the top edge, 1 the bottom"
hint_settings_other: "<b>Reset</b> restores every setting on every tab to its default. It touches settings only - your levels are files on disk and are not affected"
hint_settings_profile: "Everything this device remembers about how the game has been played and what has been built with it. It is local: nothing here is uploaded anywhere, and the files behind it sit next to the levels in a folder that can be opened and read. Times are real seconds rather than level time, so the checkpoint ramp and a run at half speed count as long as they actually took. The device row measures which of the four control devices was leading while a level was being played, not merely connected"
hint_settings_suppress-game-saves_body: |-
  While this is on, the game saves nothing of its own: <color=#D4B483>settings.json</color>, the global statistics and each level's statistics stay on disk exactly as they are. A setting you change still works until the game is closed

  Your level work is still saved as usual - saving, exporting, importing, copying and deleting levels, and the editor's autosave and backups, which have their own switch

  It lasts until the game is closed and is never remembered. Turning it off saves your current settings and throws away everything played while it was on

  <color=#B48CE0><b>Worth knowing:</b></color> it also turns on by itself. The launch argument <color=#D4B483>--suppress-game-saves</color> turns it on for the whole launch, and nothing in the game can turn it off. Settings or statistics saved by a newer version of the game turn it on too, and then the game asks at every launch whether to keep them or overwrite them with defaults
hint_settings_suppress-game-saves_header: "Anonymous mode"
level_authors_none: "No authors credited"
level_authors_unnamed: "Unnamed author"
