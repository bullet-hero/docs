level_resources_texture-alpha: "Alpha"
level_resources_texture-alpha_tooltip: "Was du über die Transparenz dieses Bilds angibst. Deckend heißt, der Alphakanal wird nicht genutzt, also wird das Bild ohne ihn neu gepackt - dieselben Pixel, schneller gezeichnet und auf dem deckenden Rendering-Pfad. Niemand prüft die Angabe: bei einem Bild, das wirklich ausblendet, wird der Übergang plattgedrückt, und die Zeile darunter zeigt das"
level_resources_texture-compression: "Kompression"
level_resources_texture-compression_tooltip: "Ob ein Gerät dieses Bild in ein verlustbehaftetes Format packen darf. Verbieten behält jedes Pixel und kostet bis zu viermal so viel Speicher, Erlauben lässt das Gerät es auch dort komprimieren, wo die Art es verbieten würde. Automatisch folgt der Art: Pixel-Art und Verläufe verbieten. Kein Wert zwingt ein Gerät zu komprimieren, wenn seine Einstellungen es ausschließen, und keiner hebt die Größengrenze auf"
level_resources_texture-details: "Import"
level_resources_texture-kind: "Was dieses Bild ist - ein Foto, eine Zeichnung, Pixel-Art, ein Verlauf. Rein künstlerisch: es sagt, was das Bild IST. Außerdem gibt es die Startwerte der Felder Abtastung und Kompression unten vor - Pixel-Art beginnt scharf und unkomprimiert, ein Verlauf unkomprimiert - und beide lassen sich dort ändern. Mipmaps sind das Einzige, was die Art noch selbst entscheidet: Pixel-Art bekommt nie welche"
level_resources_texture-report-alpha-dropped: "Alpha entfernt"
level_resources_texture-report-mips: "Mips"
level_resources_texture-report-not-loaded: "nicht geladen"
level_resources_texture-report-source-unknown: "Quelle unbekannt"
level_resources_texture-sampling: "Abtastung"
level_resources_texture-sampling_tooltip: "Wie dieses Bild gezeichnet wird - Weich mischt benachbarte Pixel, Scharf zeichnet jedes als hartes Quadrat. Automatisch folgt der Art: Pixel-Art scharf, alles andere weich. Scharf und weich kosten ein Gerät gleich viel, es ist also eine Frage des Aussehens, nicht des Budgets, und es übersteuert die Filterung des Spielers"
level_resources_texture-uv-offset-x: "Versatz X"
level_resources_texture-uv-offset-y: "Versatz Y"
level_resources_texture-uv-tiling-x: "Kachelung X"
level_resources_texture-uv-tiling-y: "Kachelung Y"
level_resources_texture-uv_tooltip: "Wie dieses Bild auf das abgebildet wird, was es zeichnet - einmal für die Ressource festgelegt statt an jedem Objekt. Kachelung ist, wie oft es sich über die Form wiederholt, Versatz ist, wo seine erste Kopie beginnt. Ein Objekt ohne eigene UV-Keyframes tastet genau das ab, und jeder UV-Keyframe an diesem Objekt ersetzt es vollständig"
level_resources_texture-wrap-u: "Randverhalten X"
level_resources_texture-wrap-u_tooltip: "Was dieses Bild jenseits seines linken und rechten Rands tut. Wiederholen und Spiegeln sind nur zu sehen, wo die UV gekachelt ist - bei einer Kachelung von 1 wird das Bild einmal abgetastet und reicht nie über sich selbst hinaus"
level_resources_texture-wrap-v: "Randverhalten Y"
level_resources_texture-wrap-v_tooltip: "Was dieses Bild jenseits seines oberen und unteren Rands tut. Absichtlich von der X-Achse getrennt: ein Streifen, der seitlich gekachelt wird und vertikal begrenzt bleibt, ist gewöhnlicher Inhalt"
