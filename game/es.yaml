settings_graphics-performance_untrusted: "La medición fue inestable, así que se sigue usando el dispositivo de referencia. Cierra otras aplicaciones y vuelve a medir"
settings_graphics-render-scale_tooltip: "Cuántos píxeles renderiza el juego antes de escalar a la ventana. La interfaz se dibuja a tamaño completo en cualquier caso. Multiplica la escala con la que ya viene esta clase de dispositivo. Solo en escritorio"
settings_graphics-resolution_tooltip: "Tamaño de la ventana del juego en píxeles, de entre los modos que indica esta pantalla. Una resolución más alta que ancha pone toda la interfaz en su disposición vertical. Solo en escritorio"
settings_graphics-textures-compression-quality_tooltip: "Cuánto tiempo dedica este dispositivo a comprimir una imagen. El resultado tiene el mismo tamaño y el mismo formato en cualquier caso - lo único que se intercambia es tiempo de carga frente a artefactos de bloque en degradados y bordes duros. Auto usa el codificador cuidadoso para todo salvo las fotografías. Se ignora en teléfonos, cuyos codificadores no admiten esta opción"
settings_graphics-textures-compression_tooltip: "Empaqueta las imágenes de un nivel en un formato comprimido al cargarlas. De cuatro a ocho veces menos memoria por imagen, a costa de artefactos de bloque en degradados y bordes duros. Auto comprime en teléfonos, donde la memoria escasea, y mantiene la imagen completa en escritorio. Se lee al cargar un nivel, así que se aplica al siguiente que abras"
settings_graphics-textures-filtering_tooltip: "Cómo se muestrean las imágenes de un nivel al dibujarlas. Auto mezcla entre niveles de mipmap cuando los mipmaps están activados, lo que elimina la costura donde uno da paso al siguiente. Punto da téxeles de bordes duros en todo - no cambia cómo se reduce una imagen, solo cómo se dibuja. Las imágenes que su autor marcó como pixel art siempre se muestrean por punto"
settings_graphics-textures-mipmaps_tooltip: "Genera copias reducidas de cada imagen, para que una dibujada en pequeño no parpadee al moverse. Cuesta un tercio más de memoria. Las imágenes que su autor marcó como pixel art nunca las reciben"
settings_graphics-textures-size-limit_tooltip: "El lado más grande que puede ocupar una imagen en memoria en este dispositivo. Todo lo que sea mayor se reduce al cargar, y el archivo en disco nunca se toca. La memoria baja con el cuadrado del lado, así que bajar un paso ahorra más que la compresión. Auto es 2048 en teléfonos y 4096 en escritorio"
