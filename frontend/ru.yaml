  rolesTitle: Выбери свой путь
  start: С чего начать
  roles:
    player:
      title: Переживи дроп
      body: Музыка нарастает, экран заполняется, и между тобой и последним битом только маленький квадрат. Начни в режиме Zen, где жизни не кончаются, а потом убери страховку.
    advanced_player:
      title: Каждое попадание - твоё
      body: Никакого везения. С одним сидом уровень играется одинаково на любом устройстве и при любой частоте кадров, а каждое правило урона и рывка расписано до десятой доли секунды. Выучи их и побей свой рекорд.
    level_author:
      title: Преврати трек в битву
      body: Возьми любимую песню и заставь каждый бит бить. Редактор встроен в игру, от таймлайнов и ключевых кадров до тем и постобработки. Бот проверит уровень раньше, чем твои друзья.
    developer:
      title: Строй на движке
      body: Bullet Hero - движок для жанра, а формат его уровней - открытый C# SDK под лицензией MIT. Напиши генератор, конвертер или инструмент, до которого ещё никто не додумался.
